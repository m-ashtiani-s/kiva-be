# /etc/ssh/sshd_config.d/00-kiva.conf (LAUNCH.md, step 6.5). sshd keeps the first value it reads for each setting, and
# reads this folder in name order, so 00- wins over the image's own 50-cloud-init.conf.
# Before `systemctl reload ssh`: a key login works in a second window, and Arvan's web console is open as the way back.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin prohibit-password
PubkeyAuthentication yes
MaxAuthTries 4
