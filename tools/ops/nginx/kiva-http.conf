# /etc/nginx/conf.d/kiva-http.conf: what the shop's server blocks share, in nginx's http context
# (LAUNCH.md, steps 6.2 and 6.5). The client's real address comes from arvan-real-ip.conf (tools/ops/arvan-real-ip.sh),
# so every zone below counts per shopper, not per ArvanCloud edge.

# One bucket per address. A 10m zone holds about 160,000 addresses.
#  otp:      a code send or verify; the app has its own limits per phone and per address behind this
#  cart:     a shopper reads the cart on every page, so this one is generous
#  orders:   placing an order; 1 every 2 s, a burst of 10 (the 12th in a row is refused)
#  tracking: a guest's lookup by order code and phone; the app allows 10 in 10 minutes behind this
#  contact:  the contact form (phase 13)
#  search:   the header's live search, called as the shopper types (10 a second, a burst of 20; phase 12)
limit_req_zone $binary_remote_addr zone=kiva_otp:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=kiva_cart:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=kiva_orders:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=kiva_tracking:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=kiva_contact:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=kiva_wishlist_shared:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=kiva_search:10m rate=10r/s;
limit_req_status 429;
limit_req_log_level warn;

# A 429 that nginx answers itself never reaches the app, so it carries the CORS headers the app would have sent;
# without them the browser hides the answer and the frontend sees a network error instead of «یه کم صبر کن».
# Keep this list the same as KIVA_ALLOWED_ORIGINS.
map $http_origin $kiva_cors_origin {
    default "";
    "https://kivashop.ir" $http_origin;
    "https://www.kivashop.ir" $http_origin;
    "https://admin.kivashop.ir" $http_origin;
}
