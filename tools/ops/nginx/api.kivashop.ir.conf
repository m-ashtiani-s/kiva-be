# /etc/nginx/sites-available/api.kivashop.ir: the API, its media files, the upload limits and the rate limits
# (LAUNCH.md, steps 6.2 and 6.5). Needs conf.d/kiva-http.conf, conf.d/arvan-real-ip.conf and
# snippets/kiva-proxy-params.conf. The server already has a block for this name: compare it with this one and take
# over what is new (the /media/ location, the two uploads, the rate-limited locations, @kiva_rate_limited) instead of
# replacing it blindly; its certificate paths and port-80 block stay as they are.

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.kivashop.ir;

    ssl_certificate /etc/letsencrypt/live/api.kivashop.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.kivashop.ir/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Every request body but the two uploads below: JSON of a few KB.
    client_max_body_size 1m;

    error_page 429 = @kiva_rate_limited;

    # The processed uploads. A stored file never changes (a new upload is a new path), so it is cached for a year.
    # The folder is kiva:www-data 2750: the app writes, nginx only reads.
    location /media/ {
        alias /var/lib/kiva/media/;
        autoindex off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff;
    }

    # The panel's photos and videos: the app's own cap is 200 MB for a video (MediaLimitsPolicy), and it processes the
    # file before it answers, so the answer may take a while.
    location = /api/v1/admin/media {
        client_max_body_size 210m;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        include snippets/kiva-proxy-params.conf;
        proxy_pass http://127.0.0.1:8080;
    }

    # A customer's photos for a return (phase 7); the app's cap is 50 MB.
    location = /api/v1/me/uploads {
        client_max_body_size 55m;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        include snippets/kiva-proxy-params.conf;
        proxy_pass http://127.0.0.1:8080;
    }

    location /api/v1/auth/otp/ {
        limit_req zone=kiva_otp burst=5 nodelay;
        include snippets/kiva-proxy-params.conf;
        proxy_pass http://127.0.0.1:8080;
    }

    location /api/v1/cart {
        limit_req zone=kiva_cart burst=60 nodelay;
        include snippets/kiva-proxy-params.conf;
        proxy_pass http://127.0.0.1:8080;
    }

    location /api/v1/orders {
        limit_req zone=kiva_orders burst=10 nodelay;
        include snippets/kiva-proxy-params.conf;
        proxy_pass http://127.0.0.1:8080;
    }

    location = /api/v1/tracking/lookup {
        limit_req zone=kiva_tracking burst=5 nodelay;
        include snippets/kiva-proxy-params.conf;
        proxy_pass http://127.0.0.1:8080;
    }

    location /api/v1/wishlists/shared/ {
        limit_req zone=kiva_wishlist_shared burst=10 nodelay;
        include snippets/kiva-proxy-params.conf;
        proxy_pass http://127.0.0.1:8080;
    }

    location = /api/v1/search/suggest {
        limit_req zone=kiva_search burst=20 nodelay;
        include snippets/kiva-proxy-params.conf;
        proxy_pass http://127.0.0.1:8080;
    }

    location = /api/v1/contact/messages {
        limit_req zone=kiva_contact burst=3 nodelay;
        include snippets/kiva-proxy-params.conf;
        proxy_pass http://127.0.0.1:8080;
    }

    location / {
        include snippets/kiva-proxy-params.conf;
        proxy_pass http://127.0.0.1:8080;
    }

    # The app's own 429, word for word (the contract's Problem with RATE_LIMITED), so the frontend can't tell which
    # of the two refused it.
    location @kiva_rate_limited {
        default_type application/problem+json;
        add_header Retry-After 60 always;
        add_header Access-Control-Allow-Origin $kiva_cors_origin always;
        add_header Access-Control-Allow-Credentials true always;
        add_header Vary Origin always;
        return 429 '{"status":429,"code":"RATE_LIMITED","message":"یه کم صبر کن و دوباره امتحان کن","instance":null,"traceId":null,"errors":null,"meta":{"retryAfterSeconds":60}}';
    }
}
