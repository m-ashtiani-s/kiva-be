# /etc/nginx/sites-available/admin.kivashop.ir: the panel (kiva-backoffice-fe under pm2 on 127.0.0.1:3200), LAUNCH.md
# step 6.1. Enabled once certbot has issued the certificate. The panel calls the API at api.kivashop.ir from the
# browser, uploads included, so nothing here takes more than a small body.

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.kivashop.ir;

    ssl_certificate /etc/letsencrypt/live/admin.kivashop.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.kivashop.ir/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 1m;

    # Never in a frame, never in a search engine.
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        include snippets/kiva-proxy-params.conf;
        proxy_pass http://127.0.0.1:3200;
    }
}
