# /etc/nginx/sites-available/admin.kivashop.ir.http: the panel's port 80 (LAUNCH.md, step 6.1). Enabled first, alone,
# so certbot's webroot challenge can pass before the https block (admin.kivashop.ir.conf) has a certificate to name.
# The webroot is the one the other two domains use; if theirs is another folder, use that one here and in certbot.

server {
    listen 80;
    listen [::]:80;
    server_name admin.kivashop.ir;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
