# /etc/nginx/snippets/kiva-proxy-params.conf: the headers every proxied location sends on.
# The app runs with KIVA_TRUSTED_PROXY_HOPS=1 and takes the last X-Forwarded-For as the caller, so nginx sends exactly
# one address, the real one ($remote_addr after arvan-real-ip.conf), and never passes on what the client wrote there.
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto https;
