    post:
      tags: [Addresses]
      operationId: createAddress
      summary: "افزودن آدرس جدید"
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddressInput' }
      responses:
        '201':
          description: ساخته شد
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Address' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '422':
          description: "`CITY_NOT_IN_PROVINCE` یا `ADDRESS_LIMIT_REACHED` (حداکثر ۲۰ آدرس)"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me/addresses/{addressId}:
    get:
      tags: [Addresses]
      operationId: getAddress
      summary: "یک آدرس"
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/AddressId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Address' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [Addresses]
      operationId: updateAddress
      summary: "ویرایش آدرس"
      description: سفارش‌های قبلی تغییر نمی‌کنند چون یک snapshot از آدرس در سفارش ذخیره شده است.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/AddressId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddressInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Address' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [Addresses]
      operationId: deleteAddress
      summary: "حذف آدرس (اگر پیش‌فرض بود، قدیمی‌ترین آدرس بعدی پیش‌فرض می‌شود)"
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/AddressId'
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me/addresses/{addressId}/default:
    post:
      tags: [Addresses]
      operationId: setDefaultAddress
      summary: "پیش‌فرض کردن آدرس"
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/AddressId'
      responses:
        '200':
          description: لیست به‌روز آدرس‌ها
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Address' }

        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  # ================================================================
  #  WISHLIST
  # ================================================================
  /me/wishlist:
    get:
      tags: [Wishlist]
      operationId: getMyWishlist
      summary: "علاقه‌مندی‌ها با کارت محصول، تاریخ افزودن و افت قیمت از زمان ذخیره"
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Page'
        - name: size
          in: query
