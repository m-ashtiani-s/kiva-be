  /admin/orders/{orderCode}/refunds:
    post:
      tags: [Admin · Orders]
      x-roles: [ADMIN]
      operationId: adminCreateRefund
      summary: "ثبت استرداد وجه (کامل یا جزئی)"
      description: |
        استرداد **دستی** است: سرور فقط ثبتش می‌کند و هیچ تماس بانکی یا درگاهی برای برگرداندن پول نمی‌گیرد.
        استرداد با وضعیت `PENDING` ساخته می‌شود (`expectedBy` = زمان ثبت + ۷۲ ساعت) و با `PATCH /admin/refunds/{refundId}` پیش می‌رود.
        جمع استردادهای غیر `FAILED` یک سفارش از مبلغ پرداخت‌شده‌اش بیشتر نمی‌شود (`400 REFUND_EXCEEDS_PAID` روی `amount` با `meta.refundable`).
        `reason` اجباری است (`400 REFUND_REASON_REQUIRED`). `method` پیش‌فرض `ORIGINAL_PAYMENT` (برگشت به همان کارت با کارت‌به‌کارت دستی)؛
        `BANK_TRANSFER` به شبایی که تلفنی گرفته شده.
        با `returnId`، مرجوعی باید `RECEIVED` باشد و مال همین سفارش؛ وقتی این استرداد `COMPLETED` شود مرجوعی `REFUNDED` می‌شود.
        تا ساخته شدن مرجوعی، هر `returnId` ← `400 RETURN_NOT_FOUND` روی `returnId`.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/OrderCode'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminRefundRequest' }
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Refund' }
        '422':
          description: "`INVALID_STATUS_TRANSITION` — مرجوعی `returnId` هنوز `RECEIVED` نیست"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
