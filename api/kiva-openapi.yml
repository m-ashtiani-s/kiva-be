  description: |
    # API فروشگاه کیوا — «هرچی ببینی، همون می‌رسه»

    این سند قرارداد کامل بین فرانت‌اند (طرح‌های فعلی: `index`, `products`, `product`, `cart`, `checkout`,
    `login`, `account`, `wishlist`, `track`, `blog`, `blog-post`, `faq`, `contact`, `about`, `404`) و بک‌اند است.
    هرچیزی که در طرح‌ها هست پوشش داده شده و هرجا که پیشنهاد معماری خودمان است، در عنوان endpoint با
    **[پیشنهادی]** مشخص شده است.

    ---

    ## ۱. قراردادهای کلی (Conventions)

    | موضوع | قرارداد |
    |---|---|
    | Base URL | `https://api.kiva.ir/api/v1` — نسخه در مسیر است؛ تغییر شکننده = `v2` |
    | فرمت | `application/json; charset=utf-8` — نام فیلدها `camelCase` — مقادیر enum با حروف بزرگ (`IN_STOCK`) و پارامترهای sort با حروف کوچک (`price_asc`) |
    | پول | همه مبالغ **عدد صحیح به تومان** (`int64`) هستند. تبدیل به ریال فقط داخل لایه‌ی درگاه پرداخت انجام می‌شود. |
    | تاریخ و زمان | ISO-8601 با منطقه زمانی (`2026-10-05T09:24:00Z`) و تاریخ خالی `YYYY-MM-DD` (میلادی). تبدیل به شمسی در کلاینت (`Intl` با `fa-IR-u-ca-persian`). منطق «روز کاری» و «جمعه» بر اساس `Asia/Tehran`. |
    | اعداد فارسی | سرور در ورودی‌ها (موبایل، کد پستی، کد سفارش، OTP، کد تخفیف) ارقام فارسی/عربی را به لاتین **نرمال‌سازی** می‌کند. فیلدهای داده (عدد، کد، مبلغ) همیشه ارقام لاتین‌اند و قالب‌بندی با کلاینت است؛ فقط فیلدهای متنی آماده‌ی نمایش (`label`، `message`، `statusLabel`، `title`) با ارقام فارسی برمی‌گردند. |
    | حروف فارسی | در جستجو `ي→ی` و `ك→ک` و حذف نیم‌فاصله‌ی اضافی انجام می‌شود. |
    | شناسه‌ها | محصول/ورینت/آدرس: `integer` — سفارش: کد عمومی `KV-218340` — رنگ: کلید رشته‌ای (`lilac`) — دسته‌بندی: `slug` (`shoulder`) |
    | صفحه‌بندی | `page` (از ۱) و `size` — پاسخ: `{ items: [], meta: { page, size, totalItems, totalPages, hasNext } }` |
    | فیلدهای بی‌مقدار | همه‌ی فیلدهای تعریف‌شده‌ی پاسخ **همیشه** فرستاده می‌شوند؛ فیلدی که مقدار ندارد `null` است (نه حذف‌شده). فیلدی که می‌تواند بی‌مقدار باشد در این سند `nullable` است. |
    | خطا | `application/problem+json` (RFC 7807) + فیلد ماشینی `code` (لیست کامل در `ErrorCode`) + `message` فارسی قابل نمایش به کاربر + `errors[]` برای خطای فیلدها |
    | 400 در برابر 422 | `400 VALIDATION_ERROR` = ورودی از نظر شکل/فرمت غلط است. `422` = ورودی درست است ولی قانون کسب‌وکار اجازه نمی‌دهد (مثل `DISCOUNT_MIN_SUBTOTAL_NOT_MET`). |
    | Idempotency | `POST /orders`، `POST /payments/{id}/retry` و `POST /me/orders/{code}/payments` هدر `Idempotency-Key` (UUID) می‌گیرند؛ تکرار با همان کلید همان پاسخ را برمی‌گرداند. |
    | کش | `GET /config`، `/home`، `/categories`، `/colors`، `/faq`، `/geo/*` و بلاگ با `ETag` + `Cache-Control: public, max-age=300` کش می‌شوند. |
    | Rate limit | ورود و کدهای تأیید: جدول «محدودیت‌ها» در بخش ۲. پیگیری مهمان: ۱۰ بار در ۱۰ دقیقه برای هر IP. پاسخ `429` همیشه با هدر `Retry-After` (ثانیه) و `meta.retryAfterSeconds`. |

    ## ۲. احراز هویت

    * ورود و ثبت‌نام یکی است: `POST /auth/otp/send` ← `POST /auth/otp/verify` (کد ۵ رقمی، اعتبار ۵ دقیقه، تایمر ارسال مجدد ۱۲۰ ثانیه).
      پاسخ `send` برای شماره‌ی ثبت‌نام‌شده و جدید دقیقاً یکی است؛ ثبت‌نام بودن فقط بعد از verify (`isNewUser`) معلوم می‌شود.
    * **دو توکن:**
      * `accessToken`: JWT با اعتبار ۱۵ دقیقه، در بدنه‌ی پاسخ. کلاینت آن را **فقط در حافظه** نگه می‌دارد (نه `localStorage`، نه `sessionStorage`، نه کوکی) و با `Authorization: Bearer <token>` می‌فرستد.
      * `refreshToken`: **در بدنه نمی‌آید.** سرور آن را در کوکی `kiva_rt` می‌گذارد:
        `HttpOnly; Secure; SameSite=Strict; Path=/api/v1/auth`. جاوااسکریپت آن را نمی‌بیند و مرورگر فقط برای `/api/v1/auth/*` می‌فرستدش.
        با هر استفاده عوض می‌شود (چرخشی). مشتری: ۳۰ روز بعد از آخرین استفاده و حداکثر ۱۸۰ روز. کاربر پنل (هر نقشی غیر از `CUSTOMER`): ۱۲ ساعت بعد از آخرین استفاده و حداکثر ۷ روز.
    * **باز شدن صفحه و تمدید:** کلاینت بعد از باز شدن صفحه، و هر وقت جواب `401 TOKEN_EXPIRED` گرفت، `POST /auth/refresh` را با `credentials: 'include'` صدا می‌زند.
      اگر چند تب باز است فقط **یکی** تمدید کند (مثلاً با `navigator.locks`). سرور درخواست‌های هم‌زمان با یک توکن را تا ۳۰ ثانیه می‌پذیرد،
      ولی استفاده از توکنی که قبلاً عوض شده بعد از این مهلت **نشانه‌ی دزدی است** و همه‌ی نشست‌های آن زنجیره باطل می‌شود (`401 REFRESH_TOKEN_INVALID`).
    * هر درخواستی که کوکی نشست را می‌گذارد یا می‌خواند (`/auth/otp/verify`، `/auth/refresh`، `/auth/logout`، `/me/phone-change/verify`، `DELETE /me`)
      باید با `credentials: 'include'` فرستاده شود؛ وگرنه مرورگر `Set-Cookie` پاسخ را نادیده می‌گیرد. بقیه‌ی درخواست‌ها به آن نیازی ندارند.
    * **محل فرانت:** چون کوکی `SameSite=Strict` است، فرانت و پنل باید روی **همان سایت** API باشند (`kiva.ir`، `www.kiva.ir`، `admin.kiva.ir` در کنار `api.kiva.ir`؛ در توسعه `localhost`).
      `/auth/refresh` و `/auth/logout` فقط از originهای مجاز پذیرفته می‌شوند (هدر `Origin`)؛ وگرنه `403 FORBIDDEN`.
    * اگر `isNewUser = true` بود، کلاینت مرحله‌ی اختیاری «دوست داری چی صدات کنیم؟» را نشان می‌دهد و با `PATCH /me` نام را ذخیره می‌کند.
    * **سبد مهمان:** افزودن به سبد بدون ورود مجاز است. سرور در اولین درخواست سبد یک `X-Cart-Token` برمی‌گرداند؛ کلاینت آن را نگه می‌دارد.
      موقع verify، اگر `guestCartToken` ارسال شود سبد مهمان با سبد کاربر **ادغام** می‌شود (از فاز سبد؛ تا آن موقع `cart` در پاسخ `null` است).
    * نیازمند ورود: پرداخت، علاقه‌مندی‌ها، ثبت نظر، حساب کاربری. پیگیری سفارش (track) بدون ورود است.
    * **ورود اختیاری:** endpointهایی که `security` آن‌ها `[{}, bearerAuth]` است با و بی ورود کار می‌کنند. بدون هدر `Authorization` = مهمان.
      ولی اگر هدر فرستاده شود و توکن منقضی یا نامعتبر باشد، جواب `401` است (`TOKEN_EXPIRED` یا `UNAUTHORIZED`) و درخواست **هرگز بی‌صدا مهمان حساب نمی‌شود**.
    * **نقش‌ها:** هر endpoint ِ `/admin/*` نقش‌های مجازش را در `x-roles` دارد؛ نقش ناکافی = `403 FORBIDDEN`. `ADMIN` همه‌جا مجاز است.
      در پنل، نقش‌ها و فعال بودن نشست در **هر درخواست** از سرور خوانده می‌شوند، پس گرفتن نقش یا خروج فوراً اثر می‌کند. تغییر نقش‌های یک کاربر همه‌ی نشست‌هایش را باطل می‌کند.

      | بخش پنل | نقش‌ها |
      |---|---|
      | کاتالوگ و موجودی | `ADMIN`، `CATALOG_MANAGER` |
      | آپلود مدیا (`POST /admin/media`) | `ADMIN`، `CATALOG_MANAGER`، `CONTENT_EDITOR`، `OPERATOR` |
      | سفارش‌ها و مرجوعی‌ها | `ADMIN`، `OPERATOR` — به‌جز استرداد وجه (`POST /admin/orders/{orderCode}/refunds`): فقط `ADMIN` |
      | کد تخفیف | فقط `ADMIN` |
      | کمپین، بنر، نوار اطلاعیه، رضایت مشتری، بلاگ، FAQ، صفحه‌های ثابت | `ADMIN`، `CONTENT_EDITOR` |
      | تنظیمات (`/admin/settings`) | فقط `ADMIN` |
      | نظرات، پیام‌های تماس، مشتریان | `ADMIN`، `SUPPORT` |
      | گزارش‌ها و تعیین نقش کاربران | فقط `ADMIN` |

    * **محدودیت‌ها** (همه با `429`، هدر `Retry-After` و `meta.retryAfterSeconds`):

      | چی | حد | کد |
      |---|---|---|
      | ارسال کد به یک شماره | ۱ بار در ۱۲۰ ثانیه (برای هر هدف جدا: ورود، تغییر شماره، حذف حساب) | `OTP_RESEND_TOO_SOON` |
      | ارسال کد به یک شماره | ۵ بار در ساعت و ۱۰ بار در ۲۴ ساعت | `RATE_LIMITED` |
      | درخواست کد از یک IP | ۲۰ بار در ۱۰ دقیقه | `RATE_LIMITED` |
      | امتحان یک کد | ۵ بار؛ بعدش کد باطل است (`422`) | `OTP_TOO_MANY_ATTEMPTS` |
      | کد اشتباه برای یک شماره | ۱۰ بار در ۲۴ ساعت؛ بعدش تا پایان بازه کد جدید هم پذیرفته نمی‌شود | `RATE_LIMITED` |

      همین حدها برای کدهای تغییر شماره و حذف حساب هم هست.

    ## ۳. قوانین کسب‌وکار

    * **ارسال رایگان:** فقط برای `POST` (پست معمولی) وقتی `subtotal` (جمع بعد از تخفیف محصولات و **قبل** از کد تخفیف) ≥ ۳٬۰۰۰٬۰۰۰ تومان.
    * **محاسبه‌ی جمع سبد** (دقیقاً مطابق طرح سبد و تسویه):
      `itemsCompareAtTotal` (قیمت کالاها = جمع قیمت قبل از تخفیف) − `productDiscount` (تخفیف محصولات) = `subtotal`
      ← − `codeDiscount` (کد تخفیف) + `shippingCost` = `payable` (مبلغ قابل پرداخت، هرگز منفی نیست).
    * **کد تخفیف:** نوع درصدی روی `subtotal` محاسبه و به نزدیک‌ترین ۱٬۰۰۰ تومان گرد می‌شود؛ نوع مبلغی حداکثر به اندازه‌ی `subtotal`. شرط‌ها: حداقل خرید، فقط خرید اول، بازه‌ی زمانی، سقف تخفیف، سقف استفاده.
    * **موجودی:** موجودی دقیق هیچ‌وقت لو نمی‌رود؛ فقط وقتی کمتر از `lowStockThreshold` (پیش‌فرض ۵) است، `availableQuantity` برگردانده می‌شود («فقط ۳ عدد باقی مونده»). سقف تعداد در سبد = موجودی ورینت.
    * **ناموجودها** در لیست محصولات به انتهای لیست می‌روند، مگر در مرتب‌سازی قیمتی.
    * **رزرو ۴ روزه:** سوییچ «رزرو ۴ روزه» در سبد و تسویه، **کنار** روش ارسال (پست/تیپاکس) است و جای آن را نمی‌گیرد.
      مبلغ کامل (با هزینه‌ی ارسال) پرداخت می‌شود و سفارش `RESERVED` می‌ماند؛ هر خرید دیگری در این مدت به همان سفارش می‌پیوندد و هزینه‌ی ارسال ندارد.
      * **شروع و پایان مهلت:** مهلت از لحظه‌ی **پرداخت موفق** اولین سفارش (سفارش اصلی) شروع می‌شود و `reservationHoldDays` (۴) روز بعد تمام می‌شود.
        این زمان برای کل گروه ثابت است و با پیوستن سفارش‌های بعدی تمدید نمی‌شود.
      * **پیوستن (ادغام):** اگر کاربر رزرو فعال داشته باشد و سفارش جدید را **به همان آدرس** ثبت کند، سفارش جدید خودکار به گروه می‌پیوندد:
        هزینه‌ی ارسالش صفر می‌شود (`freeReason = RESERVATION_CONSOLIDATION`)، روش ارسالش همان روش سفارش اصلی است، و بعد از پرداخت آن هم `RESERVED` می‌شود.
        تصمیم ادغام هنگام `POST /orders` گرفته می‌شود و اگر مهلت در فاصله‌ی ثبت تا پرداخت (حداکثر ۱۵ دقیقه) تمام شود، ارسال رایگان همچنان حفظ می‌شود.
      * **فقط یک رزرو فعال:** هر کاربر در هر لحظه حداکثر یک رزرو فعال دارد. وقتی رزرو فعال دارد سوییچ رزرو در دسترس نیست
        (`reservation.available = false`، `unavailableReason = HAS_ACTIVE_RESERVATION`): سفارش به همان آدرس ادغام می‌شود و سفارش به آدرس دیگر عادی ارسال می‌شود.
      * **کالای غیرقابل‌رزرو:** اگر حتی یک کالای سبد `reservable = false` باشد، رزرو در دسترس نیست (`ITEM_NOT_RESERVABLE`).
      * **پایان مهلت:** همه‌ی سفارش‌های گروه **خودکار** از `RESERVED` به `PROCESSING` می‌روند (عکس قبل از ارسال، سپس ارسال گروهی با **یک کد رهگیری**).
      * **لغو:** هر سفارش گروه تا قبل از `SHIPPED` قابل لغو است (بازگشت کامل وجه). لغو سفارش اصلی گروه یا مهلتش را از بین نمی‌برد و
        ارسال رایگان سفارش‌های پیوسته حفظ می‌شود. هزینه‌ی ارسال سفارش اصلی بعد از پیوستن سفارش‌های دیگر دوباره محاسبه نمی‌شود.
    * **عکس قبل از ارسال (امضای کیوا):** انتخاب پیام‌رسان (روبیکا/تلگرام/بله) و شماره‌ی آن در تسویه **اجباری** است. اپراتور قبل از بسته‌بندی عکس/ویدیو را آپلود و ارسال می‌کند؛ یک نسخه برای همیشه در جزئیات سفارش می‌ماند. تا قبل از `SHIPPED` مشتری می‌تواند تأیید کند، تغییر رنگ/مدل بخواهد یا لغو کند (بازگشت کامل وجه).
    * **بازگشت کالا:** تا ۷ روز بعد از تحویل. اگر مشکل از کیوا باشد (`NOT_AS_PICTURED`، `MANUFACTURING_DEFECT`، ...) هزینه‌ی برگشت با کیواست؛ در `CHANGED_MIND` با مشتری.
    * **جمعه‌ها** ارسال نداریم (`nonShippingWeekdays`).

    ## ۴. چرخه‌ی وضعیت سفارش

    | `status` | برچسب طرح | مرحله‌ی stepper | رنگ تگ |
    |---|---|---|---|
    | `PENDING_PAYMENT` | در انتظار پرداخت | — | warn |
    | `PAYMENT_FAILED` / `EXPIRED` | پرداخت ناموفق / منقضی | — | danger |
    | `RESERVED` | رزرو شده | ۱ ثبت شد | cream |
    | `PROCESSING` | در حال آماده‌سازی | ۱ ثبت شد | warn |
    | `PHOTO_SENT` | عکس کیف ارسال شد | ۲ عکس ارسال شد | default |
    | `CHANGE_REQUESTED` | درخواست تغییر ثبت شد | ۲ عکس ارسال شد | warn |
    | `SHIPPED` | در مسیر | ۳ تحویل پست شد | default |
    | `DELIVERED` | تحویل شده | ۴ تحویل شد | success |
    | `CANCELLED` | لغو شده | — | danger |
    | `RETURN_REQUESTED` / `RETURNED` / `REFUNDED` | درخواست مرجوعی / مرجوع شد / وجه برگشت داده شد | — | warn / default |

    مسیر اصلی: `PENDING_PAYMENT → (RESERVED) → PROCESSING → PHOTO_SENT → SHIPPED → DELIVERED`.
    `RESERVED → PROCESSING` فقط خودکار و در پایان مهلت رزرو انجام می‌شود؛ `RESERVED → CANCELLED` با لغو مشتری یا ادمین.
    سرور برای هر سفارش آبجکت آماده‌ی `progress` (۴ مرحله با تاریخ هر مرحله) و `statusLabel`/`statusTone` را برمی‌گرداند تا کلاینت منطق نگاشت نداشته باشد.

    ## ۵. پیامک‌ها و اعلان‌ها

    | رویداد | کانال | محتوا |
    |---|---|---|
    | درخواست OTP | SMS | کد ۵ رقمی |
    | پرداخت موفق | SMS | کد سفارش + لینک `track?order=KV-...` |
    | ارسال عکس قبل از ارسال | پیام‌رسان انتخابی + SMS | عکس‌ها/ویدیو + لینک جزئیات سفارش |
    | ۱۲ ساعت مانده به پایان رزرو | SMS | یادآوری افزودن خرید [پیشنهادی] |
    | تحویل به پست/تیپاکس | SMS | کد رهگیری + لینک رهگیری حامل |
    | تحویل شد | SMS | درخواست ثبت نظر |
    | موجود شد | SMS | لینک محصول (اشتراک «موجود شد خبرم کن») |
    | افت قیمت علاقه‌مندی | SMS | فقط با رضایت بازاریابی [پیشنهادی] |

    ## ۶. نگاشت صفحه‌ها به endpointها

    | صفحه | endpointها |
    |---|---|
    | همه صفحات (هدر/فوتر/منو/جستجو/سبد کشویی) | `GET /config`، `GET /categories`، `GET /search/suggest`، `GET /search/hints`، `GET /cart`، `GET /me/wishlist/ids`، `POST /newsletter/subscriptions` |
    | خانه `index` | `GET /home` (یا جداگانه: `/campaigns/active`، `/banners`، `/testimonials`، `/products?sort=newest`) |
    | فروشگاه `products` | `GET /products` (+`includeFacets`)، `GET /products/facets`، `GET /colors` |
    | جزئیات محصول `product` | `GET /products/{idOrSlug}`، `GET /products/{id}/reviews`، `POST /products/{id}/reviews`، `GET /products/{id}/related`، `POST /products/{id}/stock-alerts`، `GET /products/{id}/inquiry`، `POST /cart/items`، `PUT /me/wishlist/items/{id}` |
    | سبد `cart` | `GET/POST/PATCH/DELETE /cart/...`، `PUT /cart/shipping-method`، `PUT /cart/reservation`، `POST/DELETE /cart/discount-code`، `POST /cart/items/{id}/move-to-wishlist` |
    | تسویه `checkout` | `GET /checkout`، `POST /orders`، `GET /payments/{id}`، `GET /geo/provinces` |
    | ورود `login` | `POST /auth/otp/send`، `POST /auth/otp/verify`، `PATCH /me` |
    | حساب `account` | `GET /me/dashboard`، `GET /me/orders`، `GET /me/orders/{code}`، `GET /me/tracking`، `/me/addresses`، `/me/wishlist`، `GET /me/reviews`، `GET/PATCH /me` |
    | کارهای سفارش در `account` (طبق `actions`) | `POST /me/orders/{code}/payments`، `POST /me/orders/{code}/cancel`، `POST /me/orders/{code}/media-feedback`، `POST /me/orders/{code}/returns`، `GET /me/orders/{code}/invoice` |
    | علاقه‌مندی `wishlist` | `GET /me/wishlist`، `DELETE /me/wishlist`، `POST /me/wishlist/add-to-cart`، `POST/DELETE /me/wishlist/share` |
    | لیست اشتراکی `wishlist/shared/{token}` (بدون ورود) | `GET /wishlists/shared/{token}` |
    | پیگیری `track` | `POST /tracking/lookup`، `GET /tracking/daily/days`، `GET /tracking/daily` |
    | بلاگ | `GET /blog/categories`، `GET /blog/posts`، `GET /blog/posts/{idOrSlug}`، `GET /blog/posts/{id}/related`، `POST /blog/posts/{id}/feedback` |
    | سوالات متداول `faq` | `GET /faq` |
    | تماس `contact` | `GET /contact/topics`، `POST /contact/messages` (ساعات پاسخگویی در `/config`) |
    | درباره ما `about` | `GET /site/stats`، `GET /pages/{slug}` |
servers:
  - url: https://api.kiva.ir/api/v1
    description: Production
  - url: https://staging-api.kiva.ir/api/v1
    description: Staging
  - url: '{scheme}://{host}:{port}/api/v1'
    description: Local development
    variables:
      scheme:
        enum: [http, https]
        default: http
      host:
        default: localhost
      port:
        default: '8080'
security: []
tags:
  - name: Config & Home
    description: تنظیمات سراسری سایت، صفحه‌ی اصلی، بنرها، کمپین‌ها و آمار
  - name: Auth
    description: ورود/ثبت‌نام بدون رمز با کد یک‌بارمصرف (OTP)
  - name: Catalog
    description: دسته‌بندی‌ها، رنگ‌ها، متریال‌ها و لیست/فیلتر محصولات
  - name: Product
    description: جزئیات کامل محصول، ورینت‌های رنگی، مدیا، مشخصات، محصولات مرتبط، «موجود شد خبرم کن» و «سؤال داری؟»
  - name: Reviews
    description: نظرات و امتیاز محصولات (با تأیید ادمین و پاسخ کیوا)
  - name: Search
    description: جستجوی سراسری هدر و پیشنهادها
  - name: Cart
    description: سبد خرید (مهمان و کاربر)، روش ارسال، رزرو ۴ روزه و کد تخفیف
  - name: Checkout & Payment
    description: تکمیل خرید، ثبت سفارش، درگاه پرداخت و نتیجه‌ی پرداخت
  - name: Orders
    description: سفارش‌های کاربر، عکس قبل از ارسال، لغو، درخواست تغییر و مرجوعی
  - name: Tracking
    description: پیگیری سفارش بدون ورود و کدهای رهگیری روزانه
  - name: Account
    description: پروفایل، داشبورد حساب و ترجیحات
  - name: Addresses
    description: آدرس‌های کاربر و تقسیمات کشوری
  - name: Wishlist
    description: علاقه‌مندی‌ها، افت قیمت و اشتراک‌گذاری لیست
  - name: Content
    description: سوالات متداول، تماس با ما، خبرنامه و صفحات ثابت
  - name: Blog
    description: مجله‌ی کیوا
  - name: Uploads
    description: آپلود فایل (عکس مرجوعی، عکس نظر)
  - name: Admin · Catalog
    description: "[پیشنهادی] مدیریت محصولات، ورینت‌ها، موجودی، مدیا و طبقه‌بندی‌ها"
  - name: Admin · Orders
    description: "[پیشنهادی] مدیریت سفارش‌ها، آپلود و ارسال عکس قبل از ارسال، ثبت کد رهگیری، مرجوعی و استرداد"
  - name: Admin · Marketing
    description: "[پیشنهادی] کدهای تخفیف، کمپین‌ها، بنرها، اطلاعیه‌ها و پیام‌های رضایت"
  - name: Admin · Content
    description: "[پیشنهادی] بلاگ، سوالات متداول، صفحات و تنظیمات سایت"
  - name: Admin · Support
    description: "[پیشنهادی] نظرات، پیام‌های تماس، مشتریان و گزارش‌ها"
paths:
  # ================================================================
  #  CONFIG & HOME
  # ================================================================
  /config:
    get:
      tags: [Config & Home]
      operationId: getSiteConfig
      summary: "تنظیمات سراسری سایت (هدر، فوتر، ارسال، رزرو، پیام‌رسان‌ها، درگاه‌ها، پشتیبانی)"
      description: |
        یک‌بار در بارگذاری اپ گرفته و کش می‌شود. همه‌ی عددهای ثابتی که الان در `kiva.js` هاردکد شده‌اند
        (`SHIPPING`، `FREE_POST`، `MSGR`، پیام‌های نوار اطلاعیه، ساعت کاری، آستانه‌ی موجودی کم و ...) از این‌جا می‌آیند.
      responses:
        '200':
          description: OK
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SiteConfig' }
  /home:
    get:
      tags: [Config & Home]
      operationId: getHomePage
      summary: "داده‌ی تجمیعی صفحه‌ی اصلی"
      description: |
        شامل: محصول نمایشی هیرو (با رنگ‌ها و عکس هر رنگ)، ویژگی‌ها، دسته‌بندی‌ها با تعداد مدل،
        محصولات جدید (۸ تا)، بنرهای تبلیغاتی، کمپین تخفیف فعال با شمارنده‌ی معکوس + ۴ محصول با بیشترین درصد تخفیف (موجود)،
        خلاصه‌ی رضایت و پیام‌های مشتریان، و مراحل «چطور کار می‌کنیم».
      security: [{}, { bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HomePage' }
  /banners:
    get:
      tags: [Config & Home]
      operationId: listBanners
      summary: "بنرهای فعال یک جایگاه"
      parameters:
        - name: placement
          in: query
          required: true
          schema: { $ref: '#/components/schemas/BannerPlacement' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Banner' }
        '400': { $ref: '#/components/responses/ValidationError' }
  /campaigns/active:
    get:
      tags: [Config & Home]
      operationId: getActiveCampaign
      summary: "کمپین تخفیف فعال (مثل جشنواره پاییزه) با زمان پایان برای شمارنده"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Campaign' }
        '204':
          description: کمپین فعالی وجود ندارد
  /testimonials:
    get:
      tags: [Config & Home]
      operationId: listTestimonials
      summary: "پیام‌های رضایت مشتریان از پیام‌رسان‌ها + خلاصه‌ی رضایت"
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestimonialListResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
  /site/stats:
    get:
      tags: [Config & Home]
      operationId: getSiteStats
      summary: "آمار عمومی (صفحه‌ی درباره ما — مشتری راضی، عکس قبل از ارسال، درصد رضایت، تعداد مدل)"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SiteStats' }

  # ================================================================
  #  GEO
  # ================================================================
  /geo/provinces:
    get:
      tags: [Addresses]
      operationId: listProvinces
      summary: "لیست استان‌ها (به‌همراه شهرها)"
      parameters:
        - name: includeCities
          in: query
          schema: { type: boolean, default: true }
      responses:
        '200':
          description: OK
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Province' }
        '400': { $ref: '#/components/responses/ValidationError' }
  /geo/provinces/{provinceId}/cities:
    get:
      tags: [Addresses]
      operationId: listCitiesOfProvince
      summary: "شهرهای یک استان"
      parameters:
        - name: provinceId
          in: path
          required: true
          schema: { type: integer, example: 8 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/City' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ================================================================
  #  CONTENT: FAQ / CONTACT / NEWSLETTER / PAGES
  # ================================================================
  /faq:
    get:
      tags: [Content]
      operationId: getFaq
      summary: "سوالات متداول گروه‌بندی‌شده (با جستجو)"
      description: |
        گروه‌ها با `id` برای لینک مستقیم (`faq#reserve`، `faq#return`، `faq#shipping`) استفاده می‌شوند.
        با `q` فقط سوال‌هایی که در متن سوال یا جواب شامل عبارت هستند برگردانده می‌شوند و `highlight` فعال می‌شود.
      parameters:
        - name: q
          in: query
          schema: { type: string, maxLength: 100, example: رزرو }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FaqResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
  /contact/topics:
    get:
      tags: [Content]
      operationId: listContactTopics
      summary: "موضوعات فرم تماس"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ContactTopicOption' }
  /contact/messages:
    post:
      tags: [Content]
      operationId: createContactMessage
      summary: "ارسال پیام فرم تماس — خروجی کد پیگیری (CT-xxxx)"
      security: [{}, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContactMessageRequest' }
      responses:
        '201':
          description: ثبت شد
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactMessageResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /newsletter/subscriptions:
    post:
      tags: [Content]
      operationId: subscribeNewsletter
      summary: "عضویت در خبرنامه‌ی ایمیلی (فوتر)"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewsletterSubscribeRequest' }
      responses:
        '201':
          description: عضو شد
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageResponse' }
        '200':
          description: قبلاً عضو بوده (برای جلوگیری از افشای اطلاعات، پیام موفق برمی‌گردد)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
  /newsletter/subscriptions/unsubscribe:
    post:
      tags: [Content]
      operationId: unsubscribeNewsletter
      summary: "لغو عضویت خبرنامه با توکن لینک ایمیل [پیشنهادی]"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '400': { $ref: '#/components/responses/ValidationError' }
  /pages/{slug}:
    get:
      tags: [Content]
      operationId: getStaticPage
      summary: "صفحه‌ی ثابت CMS (درباره ما، قوانین، حریم خصوصی، شرایط بازگشت) [پیشنهادی]"
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string, example: terms }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaticPage' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ================================================================
  #  AUTH
  # ================================================================
  /auth/otp/send:
    post:
      tags: [Auth]
      operationId: sendOtp
      summary: "ارسال کد تأیید ۵ رقمی به موبایل (ورود و ثبت‌نام یکی است)"
      description: |
        برای جلوگیری از شناسایی کاربران (user enumeration) در این مرحله مشخص نمی‌شود که شماره قبلاً ثبت‌نام کرده یا نه؛
        این اطلاعات بعد از verify در `isNewUser` برمی‌گردد. پاسخ برای هر شماره‌ی معتبری یکی است.
        کد جدید، کد قبلی همان شماره را باطل می‌کند. حدها: جدول «محدودیت‌ها» در بخش ۲.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SendOtpRequest' }
      responses:
        '200':
          description: کد ارسال شد
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SendOtpResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/otp/verify:
    post:
      tags: [Auth]
      operationId: verifyOtp
      summary: "تأیید کد و دریافت توکن (+ادغام سبد مهمان)"
      description: |
        اگر شماره حساب نداشت، همین‌جا ساخته می‌شود (`isNewUser = true`). هر کد فقط یک بار مصرف می‌شود.
        refreshToken در کوکی `kiva_rt` می‌آید (هدر `Set-Cookie`)، نه در بدنه.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerifyOtpRequest' }
      responses:
        '200':
          description: ورود موفق
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetRefreshCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '422':
          description: |
            `OTP_INVALID` (با `meta.attemptsLeft`)، `OTP_EXPIRED` (کد فعالی برای این شماره نیست یا تمام شده)،
            یا `OTP_TOO_MANY_ATTEMPTS` (این کد ۵ بار اشتباه زده شده و باطل است؛ کد جدید بگیر).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshToken
      summary: "تمدید توکن با کوکی refreshToken (چرخشی)"
      description: |
        بدنه ندارد؛ refreshToken از کوکی `kiva_rt` خوانده می‌شود (`credentials: 'include'`).
        پاسخ یک accessToken تازه است و کوکی با توکن جدید عوض می‌شود.
        `401 REFRESH_TOKEN_INVALID`: کوکی نیست، منقضی یا باطل شده، یا توکن قدیمی دوباره استفاده شده (در این حالت کل زنجیره باطل می‌شود).
        `403 FORBIDDEN`: درخواست از origin مجاز نیامده.
      security: [{ refreshCookie: [] }]
      responses:
        '200':
          description: OK
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetRefreshCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthTokens' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: "خروج از حساب (ابطال نشست)"
      description: |
        نشستِ کوکی `kiva_rt` را باطل و کوکی را پاک می‌کند. accessToken لازم ندارد، پس با توکن منقضی هم کار می‌کند.
        همیشه `204` است، حتی اگر کوکی نباشد یا قبلاً باطل شده باشد. accessTokenهای صادرشده تا پایان ۱۵ دقیقه‌شان معتبر می‌مانند
        (به‌جز در پنل، که نشست در هر درخواست چک می‌شود)؛ کلاینت باید accessToken را از حافظه پاک کند.
      security: [{ refreshCookie: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                allDevices: { type: boolean, default: false, description: "خروج از همه‌ی دستگاه‌ها: همه‌ی نشست‌های این کاربر باطل می‌شوند" }
      responses:
        '204':
          description: خارج شد
          headers:
            Set-Cookie: { $ref: '#/components/headers/ClearRefreshCookie' }
        '403': { $ref: '#/components/responses/Forbidden' }
  # ================================================================
  #  CATALOG
  # ================================================================
  /categories:
    get:
      tags: [Catalog]
      operationId: listCategories
      summary: "دسته‌بندی‌ها (مگامنو، منوی موبایل، چیپ‌های فروشگاه، بخش دسته‌بندی خانه)"
      responses:
        '200':
          description: OK
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Category' }
  /categories/{slug}:
    get:
      tags: [Catalog]
      operationId: getCategory
      summary: "جزئیات یک دسته‌بندی (عنوان صفحه، SEO، بنر)"
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string, example: shoulder }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
        '404': { $ref: '#/components/responses/NotFound' }
  /colors:
    get:
      tags: [Catalog]
      operationId: listColors
      summary: "پالت رنگ‌ها با تعداد محصول هر رنگ"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Color' }
  /materials:
    get:
      tags: [Catalog]
      operationId: listMaterials
      summary: "متریال‌ها (برای فیلتر و صفحه‌ی مشخصات) [پیشنهادی]"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Material' }
  /products:
    get:
      tags: [Catalog]
      operationId: listProducts
      summary: "لیست محصولات با فیلتر، مرتب‌سازی، صفحه‌بندی و (اختیاری) facets"
      description: |
        پارامترها همان state صفحه‌ی فروشگاه هستند (`?q=&category=shoulder,cross&color=black,lilac&minPrice=&maxPrice=&onSale=true&inStock=true&sort=bestselling`).

        * وقتی فیلتر رنگ فعال است، `ProductSummary.displayColorKey` برابر اولین رنگ منطبق است تا **عکس اول کارت همان رنگ** باشد.
        * ناموجودها در انتهای لیست قرار می‌گیرند مگر `sort` قیمتی باشد.
        * `title` و `appliedFilters` آماده‌ی نمایش (عنوان صفحه، بردکرامب و چیپ‌های فیلتر فعال) برگردانده می‌شوند.
        * با `ids` می‌توان لیست «اخیراً دیده‌شده» یا علاقه‌مندی مهمان را گرفت.
      security: [{}, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/SearchQuery'
        - $ref: '#/components/parameters/CategoryFilter'
        - $ref: '#/components/parameters/ColorFilter'
        - $ref: '#/components/parameters/MinPrice'
        - $ref: '#/components/parameters/MaxPrice'
        - $ref: '#/components/parameters/OnSale'
        - $ref: '#/components/parameters/InStock'
        - $ref: '#/components/parameters/IsNew'
        - $ref: '#/components/parameters/HasVideo'
        - $ref: '#/components/parameters/BagTypeFilter'
        - $ref: '#/components/parameters/MaterialFilter'
        - $ref: '#/components/parameters/OccasionFilter'
        - $ref: '#/components/parameters/CampaignFilter'
        - $ref: '#/components/parameters/ProductIds'
        - $ref: '#/components/parameters/ProductSort'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/ProductPageSize'
        - name: includeFacets
          in: query
          description: اگر true باشد facets (تعداد هر دسته/رنگ و بازه‌ی قیمت) هم در پاسخ می‌آید.
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductListResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
  /products/facets:
    get:
      tags: [Catalog]
      operationId: getProductFacets
      summary: "شمارش‌های فیلتر (تعداد هر دسته و رنگ) و کمترین/بیشترین قیمت فعلی"
      description: |
        بازه‌ی قیمت پویاست: ارزان‌ترین و گران‌ترین محصول فعلی، گرد شده با `step` (۱۰٬۰۰۰ تومان).
        هر facet با در نظر گرفتن سایر فیلترهای اعمال‌شده (به جز خودش) شمرده می‌شود (disjunctive faceting).
      parameters:
        - $ref: '#/components/parameters/SearchQuery'
        - $ref: '#/components/parameters/CategoryFilter'
        - $ref: '#/components/parameters/ColorFilter'
        - $ref: '#/components/parameters/MinPrice'
        - $ref: '#/components/parameters/MaxPrice'
        - $ref: '#/components/parameters/OnSale'
        - $ref: '#/components/parameters/InStock'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductFacets' }

        '400': { $ref: '#/components/responses/ValidationError' }
  # ================================================================
  #  PRODUCT
  # ================================================================
  /products/{idOrSlug}:
    get:
      tags: [Product]
      operationId: getProduct
      summary: "جزئیات کامل محصول (گالری هر رنگ، ویدیو، قیمت، موجودی، مشخصات، امتیاز، SEO)"
      description: |
        `idOrSlug` می‌تواند `1`، `KV-1001` (کد محصول) یا `mahak-shoulder-bag` باشد.
        تشخیص بی‌ابهام است: فقط رقم ← id؛ با حروف بزرگ (`KV-...`) ← کد محصول؛ در غیر این صورت ← slug
        (slug همیشه حروف کوچک است و حداقل یک حرف دارد).
        اگر با id/sku صدا زده شود، `seo.canonicalUrl` آدرس slug را برمی‌گرداند.
        پارامتر `color` فقط `selectedColorKey` را تعیین می‌کند (برای لینک‌هایی مثل `product?id=2&color=olive`).
        در صورت ورود کاربر: `isWishlisted` و `stockAlert.subscribed` پر می‌شوند.
      security: [{}, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ProductIdOrSlug'
        - name: color
          in: query
          schema: { $ref: '#/components/schemas/ColorKey' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductDetail' }
        '301':
          description: slug تغییر کرده؛ هدر `Location` به آدرس جدید اشاره می‌کند
        '404': { $ref: '#/components/responses/NotFound' }
        '400': { $ref: '#/components/responses/ValidationError' }
  /products/{productId}/related:
    get:
      tags: [Product]
      operationId: getRelatedProducts
      summary: "محصولات مشابه (اول هم‌دسته، بعد پرفروش‌ترین‌ها)"
      security: [{}, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ProductId'
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 24, default: 8 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ProductSummary' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
  /products/{productId}/stock-alerts:
    post:
      tags: [Product]
      operationId: createStockAlert
      summary: "«موجود شد خبرم کن» — اشتراک پیامک موجود شدن"
      description: |
        اگر کاربر وارد شده باشد شماره‌ی حسابش استفاده می‌شود؛ در غیر این صورت `phone` الزامی است.
        اگر `variantId` نیاید، با موجود شدن **هر** رنگی اطلاع داده می‌شود.
      security: [{}, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ProductId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateStockAlertRequest' }
      responses:
        '201':
          description: ثبت شد
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StockAlert' }
        '409':
          description: "`STOCK_ALERT_EXISTS`"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: "`PRODUCT_IN_STOCK` — محصول/رنگ موجود است"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
  /products/{productId}/inquiry:
    get:
      tags: [Product]
      operationId: getProductInquiryLinks
      summary: "«سؤال داری؟ عکس یا ویدیوی بیشتر بخواه» — لینک پیام‌رسان‌ها با متن آماده"
      description: |
        متن پیام شامل نام محصول، رنگ انتخابی و کد محصول (KV-1001) است و در `url` هر کانال (`?text=`) قرار می‌گیرد.
        ساخت لینک در سرور انجام می‌شود تا تغییر آیدی‌ها یا متن نیاز به انتشار فرانت نداشته باشد.
      parameters:
        - $ref: '#/components/parameters/ProductId'
        - name: color
          in: query
          schema: { $ref: '#/components/schemas/ColorKey' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductInquiry' }

        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
  # ================================================================
  #  REVIEWS
  # ================================================================
  /products/{productId}/reviews:
    get:
      tags: [Reviews]
      operationId: listProductReviews
      summary: "نظرات تأییدشده‌ی محصول + خلاصه‌ی امتیاز (میانگین و توزیع ستاره‌ها)"
      description: اگر کاربر وارد شده باشد، نظرات «در انتظار تأیید» خودش هم با `isMine=true` در ابتدای لیست می‌آید.
      security: [{}, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ProductId'
        - name: sort
          in: query
          schema: { type: string, enum: [newest, highest, lowest, helpful], default: newest }
        - name: rating
          in: query
          description: فیلتر بر اساس ستاره
          schema: { type: integer, minimum: 1, maximum: 5 }
        - name: withMedia
          in: query
          schema: { type: boolean }
        - name: verifiedOnly
          in: query
          schema: { type: boolean }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewListResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Reviews]
      operationId: createProductReview
      summary: "ثبت نظر (نیازمند ورود) — بعد از تأیید ادمین نمایش داده می‌شود"
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ProductId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateReviewRequest' }
      responses:
        '201':
          description: ثبت شد (status = PENDING)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Review' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: "`REVIEW_ALREADY_EXISTS` — کاربر برای این محصول نظر در انتظار دارد"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404': { $ref: '#/components/responses/NotFound' }
  /products/{productId}/reviews/summary:
    get:
      tags: [Reviews]
      operationId: getReviewSummary
      summary: "فقط خلاصه‌ی امتیاز (برای meta-row بالای صفحه)"
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RatingSummary' }
        '404': { $ref: '#/components/responses/NotFound' }
  /reviews/{reviewId}/helpful:
    put:
      tags: [Reviews]
      operationId: voteReviewHelpful
      summary: "رأی «این نظر مفید بود» [پیشنهادی]"
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ReviewId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [helpful]
              properties:
                helpful: { type: boolean }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  helpfulCount: { type: integer, example: 12 }
                  myVote: { type: boolean, nullable: true }

        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  # ================================================================
  #  SEARCH
  # ================================================================
  /search/suggest:
    get:
      tags: [Search]
      operationId: searchSuggest
      summary: "جستجوی زنده‌ی هدر (حداکثر ۸ محصول + دسته‌ها و رنگ‌های منطبق)"
      description: |
        جستجو روی نام محصول، نام دسته، نام رنگ‌ها و متریال انجام می‌شود و همه‌ی کلمات باید منطبق باشند (AND).
        اگر کلمه‌ای از نام رنگ در عبارت باشد (مثلاً «کیف مشکی»)، `matchedColorKey` همان رنگ است تا تصویر و لینک با همان رنگ باز شوند.
        `nameHighlighted` با تگ `<mark>` آماده‌ی نمایش است (HTML-escaped).
      security: [{}, { bearerAuth: [] }]
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 100, example: کراس مشکی }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 20, default: 8 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchSuggestResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
  /search/hints:
    get:
      tags: [Search]
      operationId: getSearchHints
      summary: "پیشنهادهای اولیه‌ی پنل جستجو (دسته‌ها، رنگ‌ها، جستجوهای پرتکرار)"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchHints' }

  # ================================================================
  #  CART
  # ================================================================
  /cart:
    get:
      tags: [Cart]
      operationId: getCart
      summary: "سبد خرید جاری (مهمان با X-Cart-Token یا کاربر با Bearer)"
      description: |
        پاسخ همه‌ی محاسبات را آماده دارد: جمع‌ها، تخفیف‌ها، هزینه‌ی هر روش ارسال، نوار پیشرفت ارسال رایگان،
        مبلغ صرفه‌جویی، وضعیت رزرو و `issues` (تغییر قیمت/ناموجود شدن از آخرین بازدید).
        اگر توکن مهمان نیامده باشد یک سبد خالی ساخته و توکن آن در هدر `X-Cart-Token` برگردانده می‌شود.
      security: [{}, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/CartToken'
      responses:
        '200':
          description: OK
          headers:
            X-Cart-Token: { $ref: '#/components/headers/XCartToken' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
    delete:
      tags: [Cart]
      operationId: clearCart
      summary: "خالی کردن سبد"
      security: [{}, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/CartToken'
      responses:
        '200':
          description: سبد خالی
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
  /cart/items:
    post:
      tags: [Cart]
      operationId: addCartItem
      summary: "افزودن به سبد (اگر همان ورینت/رنگ موجود باشد تعداد جمع می‌شود)"
      description: |
        تعداد نهایی هر ردیف حداکثر برابر موجودی ورینت است؛ اگر درخواست بیشتر باشد به سقف کاهش داده می‌شود و
        `Cart.issues` شامل `QUANTITY_REDUCED` خواهد بود (کلاینت تُست «حداکثر موجودی: n عدد» را نشان می‌دهد).
        برای «افزودن سریع» از کارت محصول، `variantId` رنگِ فعال روی کارت ارسال می‌شود.
      security: [{}, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/CartToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddCartItemRequest' }
      responses:
        '200':
          description: سبد به‌روز شد
          headers:
            X-Cart-Token: { $ref: '#/components/headers/XCartToken' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CartMutationResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: "`OUT_OF_STOCK` یا `PRODUCT_UNAVAILABLE`"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '400': { $ref: '#/components/responses/ValidationError' }
  /cart/items/{itemId}:
    patch:
      tags: [Cart]
      operationId: updateCartItem
      summary: "تغییر تعداد یا رنگ یک ردیف سبد"
      security: [{}, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/CartToken'
        - $ref: '#/components/parameters/CartItemId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateCartItemRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CartMutationResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: "`QUANTITY_EXCEEDS_STOCK` (با `meta.availableQuantity`)"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '400': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Cart]
      operationId: removeCartItem
      summary: "حذف ردیف از سبد"
      description: کلاینت برای «برگردون» (undo) کافی است همان `variantId` و `quantity` را دوباره POST کند؛ این دو در `removedItem` برگردانده می‌شوند.
      security: [{}, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/CartToken'
        - $ref: '#/components/parameters/CartItemId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CartMutationResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
  /cart/items/{itemId}/move-to-wishlist:
    post:
      tags: [Cart]
      operationId: moveCartItemToWishlist
      summary: "انتقال از سبد به علاقه‌مندی‌ها (نیازمند ورود)"
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/CartItemId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CartMutationResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /cart/shipping-method:
    put:
      tags: [Cart]
      operationId: setCartShippingMethod
      summary: "انتخاب روش ارسال (تیپاکس / پست)"
      security: [{}, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/CartToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [method]
              properties:
                method: { $ref: '#/components/schemas/ShippingMethodCode' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '422':
          description: "`SHIPPING_METHOD_UNAVAILABLE`"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '400': { $ref: '#/components/responses/ValidationError' }
  /cart/reservation:
    put:
      tags: [Cart]
      operationId: setCartReservation
      summary: "فعال/غیرفعال کردن رزرو ۴ روزه"
      description: |
        فقط وقتی `cart.reservation.available = true` است می‌توان رزرو را فعال کرد (دلیل در دسترس نبودن در `unavailableReason`).
        غیرفعال کردن همیشه مجاز است.
      security: [{}, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/CartToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean, example: true }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '422':
          description: "`RESERVATION_UNAVAILABLE` — رزرو برای این سبد در دسترس نیست (`meta.reason` = همان `unavailableReason`)"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '400': { $ref: '#/components/responses/ValidationError' }
  /cart/discount-code:
    post:
      tags: [Cart]
      operationId: applyDiscountCode
      summary: "اعمال کد تخفیف"
      security: [{}, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/CartToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApplyDiscountCodeRequest' }
      responses:
        '200':
          description: اعمال شد — `Cart.discount` شامل کد، برچسب و مبلغ است
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '422':
          description: |
            `DISCOUNT_CODE_INVALID` «این کد تخفیف معتبر نیست»،
            `DISCOUNT_MIN_SUBTOTAL_NOT_MET` «این کد برای خرید بالای ۲٬۰۰۰٬۰۰۰ تومان فعاله» (`meta.minSubtotal`)،
            `DISCOUNT_CODE_EXPIRED`، `DISCOUNT_FIRST_ORDER_ONLY`، `DISCOUNT_USAGE_LIMIT_REACHED`، `DISCOUNT_LOGIN_REQUIRED`، `DISCOUNT_NOT_APPLICABLE`
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    delete:
      tags: [Cart]
      operationId: removeDiscountCode
      summary: "حذف کد تخفیف"
      security: [{}, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/CartToken'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
  /cart/merge:
    post:
      tags: [Cart]
      operationId: mergeGuestCart
      summary: "ادغام سبد مهمان در سبد کاربر (اگر در verify انجام نشده باشد)"
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [guestCartToken]
              properties:
                guestCartToken: { type: string, example: 'gct_7f3a9c2e1b' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }

        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  # ================================================================
  #  CHECKOUT & PAYMENT
  # ================================================================
  /checkout:
    get:
      tags: [Checkout & Payment]
      operationId: getCheckoutContext
      summary: "همه‌ی داده‌ی صفحه‌ی تکمیل خرید در یک درخواست"
      description: |
        شامل سبد (با جمع‌ها)، آدرس‌های ذخیره‌شده و آدرس پیش‌فرض، پیام‌رسان پیش‌فرض و شماره‌ی آخرین استفاده‌شده،
        گزینه‌های ارسال با قیمت محاسبه‌شده، وضعیت رزرو (تاریخ ارسال بعد از ۴ روز)، درگاه‌های فعال،
        و اگر کاربر رزرو فعال داشته باشد پیشنهاد **پیوستن به سفارش رزروی** (`consolidation`).
        اگر سبد خالی باشد `422 CART_EMPTY`.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: addressId
          in: query
          description: برای محاسبه‌ی مجدد (مثلاً امکان ادغام با رزرو فقط برای همان آدرس است)
          schema: { type: integer }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckoutContext' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422':
          description: "`CART_EMPTY`"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '400': { $ref: '#/components/responses/ValidationError' }
  /orders:
    post:
      tags: [Checkout & Payment]
      operationId: placeOrder
      summary: "ثبت سفارش و دریافت لینک درگاه پرداخت"
      description: |
        ترتیب اعتبارسنجی (مطابق طرح): ۱) آدرس ← ۲) پیام‌رسان (اجباری؛ `MESSENGER_REQUIRED`) و شماره‌ی آن ← ۳) روش ارسال ← ۴) درگاه.
        موجودی ورینت‌ها برای مدت `payment.expiresAt` (۱۵ دقیقه) رزرو موقت می‌شود.
        اگر `expectedPayable` با مبلغ محاسبه‌شده‌ی سرور فرق کند `409 PRICE_CHANGED` برمی‌گردد تا کاربر مبلغ جدید را ببیند.
        اگر مبلغ قابل پرداخت صفر باشد (کد تخفیف کامل)، `payment = null` و سفارش مستقیماً پرداخت‌شده است.
        رزرو: اگر `reserve = true` باشد ولی رزرو در دسترس نباشد `422 RESERVATION_UNAVAILABLE`. اگر کاربر رزرو فعال به همین آدرس داشته باشد،
        سفارش بدون توجه به `reserve` به گروه رزرو می‌پیوندد (هزینه‌ی ارسال صفر) — قوانین کامل در بخش «قوانین کسب‌وکار».
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlaceOrderRequest' }
      responses:
        '201':
          description: سفارش ساخته شد؛ کاربر را به `payment.redirect` هدایت کنید
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlaceOrderResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: "`PRICE_CHANGED` (با `meta.payable`) یا `IDEMPOTENCY_KEY_REUSED`"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: "`CART_EMPTY`، `OUT_OF_STOCK`، `MESSENGER_REQUIRED`، `MESSENGER_PHONE_INVALID`، `ADDRESS_NOT_FOUND`، `SHIPPING_METHOD_UNAVAILABLE`، `TERMS_NOT_ACCEPTED`، `PAYMENT_GATEWAY_UNAVAILABLE`"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /payment-callbacks/{gateway}:
    get:
      tags: [Checkout & Payment]
      operationId: paymentCallbackGet
      summary: "بازگشت از درگاه (سرور به سرور / مرورگر) — فقط برای بک‌اند"
      description: |
        پارامترهای مخصوص هر درگاه را می‌گیرد (زرین‌پال: `Authority`, `Status` — سامان: `RefNum`, `State`, `ResNum` — ملت: `RefId`, `ResCode`, `SaleOrderId`, `SaleReferenceId`)،
        تراکنش را verify می‌کند و با `302` کاربر را به `https://kiva.ir/checkout/result?paymentId=...` هدایت می‌کند.
      parameters:
        - $ref: '#/components/parameters/GatewayPath'
      responses:
        '302':
          description: هدایت به صفحه‌ی نتیجه‌ی فرانت
          headers:
            Location:
              schema: { type: string, example: 'https://kiva.ir/checkout/result?paymentId=pay_01J9X2' }
    post:
      tags: [Checkout & Payment]
      operationId: paymentCallbackPost
      summary: "بازگشت از درگاه با متد POST (سامان/ملت)"
      parameters:
        - $ref: '#/components/parameters/GatewayPath'
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: { type: string }
      responses:
        '302':
          description: هدایت به صفحه‌ی نتیجه‌ی فرانت
  /payments/{paymentId}:
    get:
      tags: [Checkout & Payment]
      operationId: getPaymentResult
      summary: "نتیجه‌ی پرداخت برای صفحه‌ی موفقیت (کد سفارش، مراحل بعدی) یا خطا"
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/PaymentId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentResult' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /payments/{paymentId}/retry:
    post:
      tags: [Checkout & Payment]
      operationId: retryPayment
      summary: "پرداخت مجدد سفارش پرداخت‌نشده (در صورت شکست/انصراف) — امکان تغییر درگاه"
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/PaymentId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                gateway: { $ref: '#/components/schemas/PaymentGatewayCode' }
      responses:
        '201':
          description: تراکنش جدید
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentInit' }
        '422':
          description: "`ORDER_ALREADY_PAID` یا `PAYMENT_EXPIRED` (موجودی آزاد شده)"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  # ================================================================
  #  TRACKING (public)
  # ================================================================
  /tracking/lookup:
    post:
      tags: [Tracking]
      operationId: guestTrackOrder
      summary: "پیگیری سفارش بدون ورود با شماره سفارش + موبایل"
      description: |
        به‌خاطر حریم خصوصی، شماره موبایل در بدنه‌ی POST ارسال می‌شود نه در URL.
        خروجی نسخه‌ی محدود سفارش است (بدون آدرس و قیمت‌ها؛ حداکثر ۴ عکس پیش‌نمایش).
        موبایل باید موبایل خریدار یا گیرنده باشد. در صورت عدم تطابق، برای جلوگیری از حدس زدن، همان `404 TRACKING_NOT_FOUND` برمی‌گردد.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GuestTrackingRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GuestTrackingResult' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /tracking/daily/days:
    get:
      tags: [Tracking]
      operationId: listDailyShipmentDays
      summary: "تب‌های روزهای اخیر (امروز، دیروز، ...) با تعداد مرسوله‌ی هر روز"
      parameters:
        - name: days
          in: query
          schema: { type: integer, minimum: 1, maximum: 30, default: 10 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DailyShipmentDay' }
        '400': { $ref: '#/components/responses/ValidationError' }
  /tracking/daily:
    get:
      tags: [Tracking]
      operationId: listDailyShipments
      summary: "کدهای رهگیری ارسال‌های یک روز (اطلاعات گیرنده ماسک‌شده)"
      description: |
        جستجو با ۴ رقم آخر موبایل، حرف اول نام یا نام شهر. نام‌ها و موبایل‌ها **همیشه ماسک‌شده** از سرور می‌آیند
        (`س*** م***`، `09** *** 4821`) و داده‌ی کامل هرگز به این endpoint عمومی نمی‌رسد.
      parameters:
        - name: date
          in: query
          required: true
          schema: { type: string, format: date, example: '2026-10-05' }
        - name: q
          in: query
          schema: { type: string, maxLength: 20, example: '4821' }
        - $ref: '#/components/parameters/Page'
        - name: size
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DailyShipmentListResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }

  # ================================================================
  #  ACCOUNT / PROFILE
  # ================================================================
  /me:
    get:
      tags: [Account]
      operationId: getMe
      summary: "اطلاعات کاربر جاری"
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [Account]
      operationId: updateMe
      summary: "ویرایش اطلاعات شخصی (نام، ایمیل، تولد، جنسیت، پیام‌رسان پیش‌فرض، پیامک تخفیف)"
      description: فقط فیلدهای ارسال‌شده تغییر می‌کنند. ارسال `null` برای فیلدهای اختیاری یعنی پاک کردن.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProfileRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [Account]
      operationId: deleteMe
      summary: "حذف حساب کاربری (با OTP تأیید) [پیشنهادی — بعد از فاز سفارش]"
      description: |
        کد را اول از `POST /me/deletion/request` بگیر. با حذف، اطلاعات شخصی (نام، ایمیل، تولد، پیام‌رسان) پاک،
        همه‌ی نشست‌ها باطل و شماره آزاد می‌شود؛ سفارش‌های قبلی برای حسابداری بی‌نام می‌مانند.
        کسی که سفارش جاری دارد (پرداخت‌شده و هنوز تحویل‌نشده، یا رزرو فعال) نمی‌تواند حساب را حذف کند.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [otpCode]
              properties:
                otpCode: { type: string, pattern: '^\d{5}$' }
                reason: { type: string, maxLength: 300 }
      responses:
        '204':
          description: حساب حذف شد
          headers:
            Set-Cookie: { $ref: '#/components/headers/ClearRefreshCookie' }
        '422':
          description: "`OTP_INVALID` (با `meta.attemptsLeft`)، `OTP_EXPIRED`، `OTP_TOO_MANY_ATTEMPTS` یا `ACCOUNT_HAS_ACTIVE_ORDERS`"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /me/deletion/request:
    post:
      tags: [Account]
      operationId: requestAccountDeletion
      summary: "ارسال کد تأیید حذف حساب به موبایل خود کاربر [پیشنهادی — بعد از فاز سفارش]"
      description: کد فقط برای `DELETE /me` معتبر است، نه برای ورود؛ و کد ورود هم برای حذف حساب پذیرفته نمی‌شود.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: کد ارسال شد
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SendOtpResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /me/phone-change/request:
    post:
      tags: [Account]
      operationId: requestPhoneChange
      summary: "درخواست تغییر شماره موبایل — ارسال کد به شماره‌ی فعلی و شماره‌ی جدید [پیشنهادی]"
      description: |
        برای امنیت، مالکیت **هر دو** شماره باید ثابت شود: یک کد به شماره‌ی فعلی و یک کد به شماره‌ی جدید می‌رود.
        (اگر فقط شماره‌ی جدید چک شود، کسی که یک accessToken را دزدیده می‌تواند حساب را برای همیشه به شماره‌ی خودش ببرد.)
        کسی که به شماره‌ی فعلی‌اش دسترسی ندارد، تغییر شماره را از پشتیبانی می‌خواهد.
        اینکه شماره‌ی جدید مال حساب دیگری است، عمداً اینجا گفته نمی‌شود (فقط بعد از تأیید هر دو کد، در verify)،
        تا این endpoint راهی برای فهمیدن «این شماره در کیوا حساب دارد؟» نباشد.
        شماره‌ی تکراری: `400 VALIDATION_ERROR` با `errors[].field = newPhone` و `code = PHONE_SAME_AS_CURRENT`.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newPhone]
              properties:
                newPhone: { $ref: '#/components/schemas/PhoneNumber' }
      responses:
        '200':
          description: هر دو کد ارسال شد (با همان تایمرها)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PhoneChangeOtpResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /me/phone-change/verify:
    post:
      tags: [Account]
      operationId: verifyPhoneChange
      summary: "تأیید هر دو کد و تغییر شماره [پیشنهادی]"
      description: |
        بعد از تغییر: همه‌ی نشست‌های قبلی (همه‌ی دستگاه‌ها) باطل می‌شوند، یک نشست تازه برای همین دستگاه ساخته می‌شود
        (کوکی جدید + accessToken جدید در پاسخ)، و یک پیامک هشدار به شماره‌ی **قبلی** می‌رود.
        در `422`ها، `meta.field` می‌گوید کدام کد مشکل دارد (`currentPhoneCode` یا `newPhoneCode`).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newPhone, currentPhoneCode, newPhoneCode]
              properties:
                newPhone: { $ref: '#/components/schemas/PhoneNumber' }
                currentPhoneCode: { type: string, pattern: '^\d{5}$', description: کدی که به شماره‌ی فعلی رفت }
                newPhoneCode: { type: string, pattern: '^\d{5}$', description: کدی که به شماره‌ی جدید رفت }
      responses:
        '200':
          description: شماره عوض شد
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetRefreshCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PhoneChangeResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: "`PHONE_ALREADY_REGISTERED`: شماره‌ی جدید مال حساب دیگری است"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: "`OTP_INVALID` (با `meta.attemptsLeft` و `meta.field`)، `OTP_EXPIRED` یا `OTP_TOO_MANY_ATTEMPTS` (با `meta.field`)"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /me/dashboard:
    get:
      tags: [Account]
      operationId: getMyDashboard
      summary: "سربرگ حساب کاربری — سلام، کارت‌های آمار و شمارنده‌های منوی کناری"
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountDashboard' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ================================================================
  #  ADDRESSES
  # ================================================================
  /me/addresses:
    get:
      tags: [Addresses]
      operationId: listMyAddresses
      summary: "آدرس‌های من (آدرس پیش‌فرض اول)"
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Address' }
