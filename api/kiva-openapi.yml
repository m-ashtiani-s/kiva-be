      summary: "فقط شناسه‌ها — برای روشن کردن قلب‌ها روی کارت‌ها و بج هدر"
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [productIds, count]
                properties:
                  productIds:
                    type: array
                    items: { type: integer }
                    example: [3, 7, 12]
                  count: { type: integer, example: 3 }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me/wishlist/items/{productId}:
    put:
      tags: [Wishlist]
      operationId: addToWishlist
