      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ProductId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                colorKey:
                  allOf: [{ $ref: '#/components/schemas/ColorKey' }]
                  description: رنگی که کاربر هنگام ذخیره می‌دید [پیشنهادی]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WishlistToggleResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '400': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Wishlist]
      operationId: removeFromWishlist
      summary: "حذف از علاقه‌مندی‌ها (idempotent)"
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WishlistToggleResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /me/wishlist/add-to-cart:
    post:
      tags: [Wishlist]
      operationId: addWishlistToCart
      summary: "افزودن همه‌ی موجودها به سبد (هر کدام ۱ عدد، با رنگ ذخیره‌شده یا اولین رنگ موجود)"
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                productIds:
                  type: array
                  description: اگر خالی باشد همه‌ی موارد موجود
                  items: { type: integer }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WishlistAddToCartResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me/wishlist/share:
    post:
      tags: [Wishlist]
      operationId: shareMyWishlist
      summary: "ساخت لینک عمومی لیست علاقه‌مندی (برای هدیه گرفتن) [پیشنهادی]"
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WishlistShare' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [Wishlist]
      operationId: revokeWishlistShare
      summary: "غیرفعال کردن لینک اشتراک [پیشنهادی]"
      security: [{ bearerAuth: [] }]
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /wishlists/shared/{token}:
    get:
      tags: [Wishlist]
      operationId: getSharedWishlist
      summary: "مشاهده‌ی لیست اشتراکی دیگران (عمومی) [پیشنهادی]"
      description: داده‌ی صفحه‌ی فرانت `https://kiva.ir/wishlist/shared/{token}` (همان `WishlistShare.url`).
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string, example: 'wl_9Kq2Xz' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SharedWishlist' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ================================================================
  #  MY ORDERS
  # ================================================================
  /me/orders:
    get:
      tags: [Orders]
      operationId: listMyOrders
      summary: "سفارش‌های من (فیلتر همه / جاری / تحویل شده)"
      security: [{ bearerAuth: [] }]
      parameters:
        - name: filter
          in: query
          schema: { type: string, enum: [all, current, delivered, cancelled], default: all }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '400': { $ref: '#/components/responses/ValidationError' }
  /me/orders/{orderCode}:
    get:
      tags: [Orders]
      operationId: getMyOrder
      summary: "جزئیات کامل سفارش (کالاها، عکس‌ها و ویدیوهای قبل از ارسال، آدرس، خلاصه پرداخت، تایم‌لاین)"
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/OrderCode'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me/orders/{orderCode}/payments:
    post:
      tags: [Orders]
      operationId: payMyOrder
      summary: "پرداخت سفارش «در انتظار پرداخت» از حساب کاربری — امکان تغییر درگاه"
      description: |
        مثل `POST /payments/{paymentId}/retry`، ولی با کد سفارش؛ چون صفحه‌ی سفارش `paymentId` ندارد.
        فقط وقتی مجاز است که `actions.canPay = true` باشد. یک تراکنش جدید به مبلغ `totals.payable` ساخته می‌شود.
        بازگشت از درگاه مثل تسویه است: `https://kiva.ir/checkout/result?paymentId=...`
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/OrderCode'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                gateway: { $ref: '#/components/schemas/PaymentGatewayCode' }
      responses:
        '201':
          description: تراکنش جدید؛ کاربر را به `redirect` هدایت کنید
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentInit' }
        '422':
          description: "`ORDER_ALREADY_PAID`، `PAYMENT_EXPIRED` (موجودی آزاد شده) یا `PAYMENT_GATEWAY_UNAVAILABLE`"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /me/orders/{orderCode}/media:
    get:
      tags: [Orders]
      operationId: listMyOrderMedia
      summary: "عکس‌ها و ویدیوهای قبل از ارسال (برای lightbox)"
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/OrderCode'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PreShipmentMedia' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /me/orders/{orderCode}/media-feedback:
    post:
      tags: [Orders]
      operationId: submitPreShipmentFeedback
      summary: "پاسخ مشتری به عکس قبل از ارسال — «همونه!» یا درخواست تغییر رنگ/مدل [پیشنهادی مبتنی بر FAQ]"
      description: |
        مطابق FAQ: «تا قبل از ارسال، می‌تونی رنگ یا مدل رو عوض کنی یا سفارش رو لغو کنی».
        `APPROVE` سفارش را برای ارسال آزاد می‌کند (بدون منتظر ماندن برای پایان مهلت پاسخ).
        `REQUEST_CHANGE` وضعیت را `CHANGE_REQUESTED` می‌کند و اپراتور با مشتری هماهنگ می‌کند؛ اختلاف قیمت از طریق لینک پرداخت/استرداد تسویه می‌شود.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/OrderCode'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PreShipmentFeedbackRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderDetail' }
        '422':
          description: "`CHANGE_REQUEST_NOT_ALLOWED` — سفارش ارسال شده است"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /me/orders/{orderCode}/cancel:
    post:
      tags: [Orders]
      operationId: cancelMyOrder
      summary: "لغو سفارش قبل از ارسال با بازگشت کامل وجه"
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/OrderCode'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CancelOrderRequest' }
      responses:
        '200':
          description: لغو شد
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CancelOrderResponse' }
        '422':
          description: "`ORDER_NOT_CANCELLABLE`"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /me/orders/{orderCode}/returns:
    post:
      tags: [Orders]
      operationId: createReturnRequest
      summary: "درخواست مرجوعی (تا ۷ روز بعد از تحویل)"
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/OrderCode'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateReturnRequest' }
      responses:
        '201':
          description: ثبت شد
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReturnRequest' }
        '422':
          description: "`ORDER_NOT_RETURNABLE` یا `RETURN_WINDOW_EXPIRED`"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /me/orders/{orderCode}/reorder:
    post:
      tags: [Orders]
      operationId: reorder
      summary: "خرید دوباره — افزودن کالاهای موجود این سفارش به سبد [پیشنهادی]"
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/OrderCode'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WishlistAddToCartResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /me/orders/{orderCode}/invoice:
    get:
      tags: [Orders]
      operationId: downloadInvoice
      summary: "دانلود فاکتور PDF [پیشنهادی]"
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/OrderCode'
      responses:
        '200':
          description: فایل PDF
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /me/returns:
    get:
      tags: [Orders]
      operationId: listMyReturns
      summary: "درخواست‌های مرجوعی من"
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ReturnRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me/reservation:
    get:
      tags: [Orders]
      operationId: getMyActiveReservation
      summary: "رزرو ۴ روزه‌ی فعال (برای نوار شمارش معکوس و دکمه‌ی «افزودن محصول»)"
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReservationInfo' }
        '204':
          description: رزرو فعالی ندارد
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me/tracking:
    get:
      tags: [Orders]
      operationId: listMyTrackingCodes
