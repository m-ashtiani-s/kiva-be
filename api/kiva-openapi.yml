              schema: { $ref: '#/components/schemas/RatingSummary' }
        '404': { $ref: '#/components/responses/NotFound' }
  /reviews/{reviewId}/helpful:
    put:
      tags: [Reviews]
      operationId: voteReviewHelpful
      summary: "رأی «این نظر مفید بود» [پیشنهادی]"
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ReviewId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [helpful]
