  description: |
    # API فروشگاه کیوا — «هرچی ببینی، همون می‌رسه»

    این سند قرارداد کامل بین فرانت‌اند (طرح‌های فعلی: `index`, `products`, `product`, `cart`, `checkout`,
    `login`, `account`, `wishlist`, `track`, `blog`, `blog-post`, `faq`, `contact`, `about`, `404`) و بک‌اند است.
    هرچیزی که در طرح‌ها هست پوشش داده شده و هرجا که پیشنهاد معماری خودمان است، در عنوان endpoint با
    **[پیشنهادی]** مشخص شده است.

    ---

    ## ۱. قراردادهای کلی (Conventions)

    | موضوع | قرارداد |
    |---|---|
    | Base URL | `https://api.kiva.ir/api/v1` — نسخه در مسیر است؛ تغییر شکننده = `v2` |
    | فرمت | `application/json; charset=utf-8` — نام فیلدها `camelCase` — مقادیر enum با حروف بزرگ (`IN_STOCK`) و پارامترهای sort با حروف کوچک (`price_asc`) |
    | پول | همه مبالغ **عدد صحیح به تومان** (`int64`) هستند. تبدیل به ریال فقط داخل لایه‌ی درگاه پرداخت انجام می‌شود. |
    | تاریخ و زمان | ISO-8601 با منطقه زمانی (`2026-10-05T09:24:00Z`) و تاریخ خالی `YYYY-MM-DD` (میلادی). تبدیل به شمسی در کلاینت (`Intl` با `fa-IR-u-ca-persian`). منطق «روز کاری» و «جمعه» بر اساس `Asia/Tehran`. |
    | اعداد فارسی | سرور در ورودی‌ها (موبایل، کد پستی، کد سفارش، OTP، کد تخفیف) ارقام فارسی/عربی را به لاتین **نرمال‌سازی** می‌کند. فیلدهای داده (عدد، کد، مبلغ) همیشه ارقام لاتین‌اند و قالب‌بندی با کلاینت است؛ فقط فیلدهای متنی آماده‌ی نمایش (`label`، `message`، `statusLabel`، `title`) با ارقام فارسی برمی‌گردند. |
    | حروف فارسی | در جستجو `ي→ی` و `ك→ک` و حذف نیم‌فاصله‌ی اضافی انجام می‌شود. |
    | شناسه‌ها | محصول/ورینت/آدرس: `integer` — سفارش: کد عمومی `KV-218340` — رنگ: کلید رشته‌ای (`lilac`) — دسته‌بندی: `slug` (`shoulder`) |
    | صفحه‌بندی | `page` (از ۱) و `size` — پاسخ: `{ items: [], meta: { page, size, totalItems, totalPages, hasNext } }` |
    | فیلدهای بی‌مقدار | همه‌ی فیلدهای تعریف‌شده‌ی پاسخ **همیشه** فرستاده می‌شوند؛ فیلدی که مقدار ندارد `null` است (نه حذف‌شده). فیلدی که می‌تواند بی‌مقدار باشد در این سند `nullable` است. |
    | خطا | `application/problem+json` (RFC 7807) + فیلد ماشینی `code` (لیست کامل در `ErrorCode`) + `message` فارسی قابل نمایش به کاربر + `errors[]` برای خطای فیلدها |
    | 400 در برابر 422 | `400 VALIDATION_ERROR` = ورودی از نظر شکل/فرمت غلط است. `422` = ورودی درست است ولی قانون کسب‌وکار اجازه نمی‌دهد (مثل `DISCOUNT_MIN_SUBTOTAL_NOT_MET`). |
    | Idempotency | `POST /orders`، `POST /payments/{id}/retry` و `POST /me/orders/{code}/payments` هدر `Idempotency-Key` (UUID) می‌گیرند. تکرار با همان کلید و همان بدنه همان سفارش و همان تراکنش را برمی‌گرداند (با وضعیت **فعلی** آن‌ها، پس پاسخ از نظر معنی یکی است، نه بایت‌به‌بایت). همان کلید با بدنه‌ی دیگر `409 IDEMPOTENCY_KEY_REUSED`. درخواستی که شکست خورد و چیزی نساخت ثبت نمی‌شود و تکرارش دوباره اجرا می‌شود. کلید ۲۴ ساعت نگه داشته می‌شود. هدر نیامده یا UUID نیست = `400 VALIDATION_ERROR` روی فیلد `Idempotency-Key`. |
    | کش | `GET /config`، `/home`، `/categories`، `/colors`، `/faq`، `/search/hints`، `/geo/*` و بلاگ با `ETag` + `Cache-Control: public, max-age=300` کش می‌شوند. |
    | Rate limit | ورود و کدهای تأیید: جدول «محدودیت‌ها» در بخش ۲. پیگیری مهمان: ۱۰ بار در ۱۰ دقیقه برای هر IP. سفارش پرداخت‌نشده و تلاش پرداخت: بخش ۳. پاسخ `429` همیشه با هدر `Retry-After` (ثانیه) و `meta.retryAfterSeconds`. |

    ## ۲. احراز هویت

    * ورود و ثبت‌نام یکی است: `POST /auth/otp/send` ← `POST /auth/otp/verify` (کد ۵ رقمی، اعتبار ۵ دقیقه، تایمر ارسال مجدد ۱۲۰ ثانیه).
      پاسخ `send` برای شماره‌ی ثبت‌نام‌شده و جدید دقیقاً یکی است؛ ثبت‌نام بودن فقط بعد از verify (`isNewUser`) معلوم می‌شود.
    * **دو توکن:**
      * `accessToken`: JWT با اعتبار ۱۵ دقیقه، در بدنه‌ی پاسخ. کلاینت آن را **فقط در حافظه** نگه می‌دارد (نه `localStorage`، نه `sessionStorage`، نه کوکی) و با `Authorization: Bearer <token>` می‌فرستد.
      * `refreshToken`: **در بدنه نمی‌آید.** سرور آن را در کوکی `kiva_rt` می‌گذارد:
        `HttpOnly; Secure; SameSite=Strict; Path=/api/v1/auth`. جاوااسکریپت آن را نمی‌بیند و مرورگر فقط برای `/api/v1/auth/*` می‌فرستدش.
        با هر استفاده عوض می‌شود (چرخشی). مشتری: ۳۰ روز بعد از آخرین استفاده و حداکثر ۱۸۰ روز. کاربر پنل (هر نقشی غیر از `CUSTOMER`): ۱۲ ساعت بعد از آخرین استفاده و حداکثر ۷ روز.
    * **باز شدن صفحه و تمدید:** کلاینت بعد از باز شدن صفحه، و هر وقت جواب `401 TOKEN_EXPIRED` گرفت، `POST /auth/refresh` را با `credentials: 'include'` صدا می‌زند.
      اگر چند تب باز است فقط **یکی** تمدید کند (مثلاً با `navigator.locks`). سرور درخواست‌های هم‌زمان با یک توکن را تا ۳۰ ثانیه می‌پذیرد،
      ولی استفاده از توکنی که قبلاً عوض شده بعد از این مهلت **نشانه‌ی دزدی است** و همه‌ی نشست‌های آن زنجیره باطل می‌شود (`401 REFRESH_TOKEN_INVALID`).
    * هر درخواستی که کوکی نشست را می‌گذارد یا می‌خواند (`/auth/otp/verify`، `/auth/refresh`، `/auth/logout`، `/me/phone-change/verify`، `DELETE /me`)
      باید با `credentials: 'include'` فرستاده شود؛ وگرنه مرورگر `Set-Cookie` پاسخ را نادیده می‌گیرد. بقیه‌ی درخواست‌ها به آن نیازی ندارند.
    * **محل فرانت:** چون کوکی `SameSite=Strict` است، فرانت و پنل باید روی **همان سایت** API باشند (`kiva.ir`، `www.kiva.ir`، `admin.kiva.ir` در کنار `api.kiva.ir`؛ در توسعه `localhost`).
      `/auth/refresh` و `/auth/logout` فقط از originهای مجاز پذیرفته می‌شوند (هدر `Origin`)؛ وگرنه `403 FORBIDDEN`.
    * اگر `isNewUser = true` بود، کلاینت مرحله‌ی اختیاری «دوست داری چی صدات کنیم؟» را نشان می‌دهد و با `PATCH /me` نام را ذخیره می‌کند.
    * **سبد مهمان:** افزودن به سبد بدون ورود مجاز است. سرور در اولین درخواست سبد یک `X-Cart-Token` برمی‌گرداند؛ کلاینت آن را نگه می‌دارد.
      با Bearer معتبر، سبد کاربر برمی‌گردد و `X-Cart-Token` نادیده گرفته می‌شود.
      موقع verify، اگر `guestCartToken` ارسال شود سبد مهمان با سبد کاربر **ادغام** می‌شود و سبد مهمان از بین می‌رود. `cart` ِ پاسخ verify همیشه سبد کاربر بعد از ادغام است.
    * نیازمند ورود: پرداخت، علاقه‌مندی‌ها، ثبت نظر، حساب کاربری. پیگیری سفارش (track) بدون ورود است.
    * **ورود اختیاری:** endpointهایی که `security` آن‌ها `[{}, bearerAuth]` است با و بی ورود کار می‌کنند. بدون هدر `Authorization` = مهمان.
      ولی اگر هدر فرستاده شود و توکن منقضی یا نامعتبر باشد، جواب `401` است (`TOKEN_EXPIRED` یا `UNAUTHORIZED`) و درخواست **هرگز بی‌صدا مهمان حساب نمی‌شود**.
    * **نقش‌ها:** هر endpoint ِ `/admin/*` نقش‌های مجازش را در `x-roles` دارد؛ نقش ناکافی = `403 FORBIDDEN`. `ADMIN` همه‌جا مجاز است.
      در پنل، نقش‌ها و فعال بودن نشست در **هر درخواست** از سرور خوانده می‌شوند، پس گرفتن نقش یا خروج فوراً اثر می‌کند. تغییر نقش‌های یک کاربر همه‌ی نشست‌هایش را باطل می‌کند.

      | بخش پنل | نقش‌ها |
      |---|---|
      | کاتالوگ، موجودی و صف «موجود شد خبرم کن» (`GET /admin/stock-alerts`) | `ADMIN`، `CATALOG_MANAGER` |
      | آپلود مدیا (`POST /admin/media`) | `ADMIN`، `CATALOG_MANAGER`، `CONTENT_EDITOR`، `OPERATOR` |
      | سفارش‌ها و مرجوعی‌ها | `ADMIN`، `OPERATOR` — به‌جز ثبت و پیگیری استرداد وجه (`POST /admin/orders/{orderCode}/refunds`، `PATCH /admin/refunds/{refundId}`): فقط `ADMIN` |
      | کد تخفیف | فقط `ADMIN` |
      | کمپین، بنر، نوار اطلاعیه، رضایت مشتری، بلاگ، FAQ، صفحه‌های ثابت | `ADMIN`، `CONTENT_EDITOR` |
      | تنظیمات (`/admin/settings`) | فقط `ADMIN` |
      | نظرات، پیام‌های تماس، مشتریان | `ADMIN`، `SUPPORT` |
      | گزارش‌ها، تعیین نقش کاربران، لاگ تغییرات و مشترکین خبرنامه | فقط `ADMIN` |

    * **لاگ تغییرات:** هر درخواست **موفقِ** نوشتنی زیر `/admin/*` (`POST`، `PUT`، `PATCH`، `DELETE`؛ به‌جز آپلود مدیا) یک ردیف در لاگ تغییرات می‌گذارد:
      چه کسی، کِی، چه کاری، روی چه چیزی، و هر فیلد از چه به چه شد. خواندن‌ها و کارهای خودکار سیستم (مثل پایان مهلت رزرو) ثبت نمی‌شوند.
      **یک ردیف برای هر درخواست**: درخواستی که چند چیز را عوض می‌کند (ساخت محصول با رنگ‌هایش) یک ردیف با همه‌ی تغییرها دارد،
      و درخواستی که چیزی را عوض نکرد (ذخیره‌ی فرم بی‌تغییر، آرشیو ِ محصولِ از قبل آرشیو) ردیفی ندارد.
      `actor` (نام و موبایل) موقع خواندن از حساب **فعلی** کاربر خوانده می‌شود، نه از ردیف. نوع `MEDIA` استفاده نمی‌شود، چون آپلود ثبت نمی‌شود.
      لاگ فقط اضافه می‌شود و ویرایش ندارد؛ هر ردیف **۹۰ روز** نگه داشته می‌شود و هر شب ردیف‌های قدیمی‌تر پاک می‌شوند: `GET /admin/audit-log`.

    * **محدودیت‌ها** (همه با `429`، هدر `Retry-After` و `meta.retryAfterSeconds`):

      | چی | حد | کد |
      |---|---|---|
      | ارسال کد به یک شماره | ۱ بار در ۱۲۰ ثانیه (برای هر هدف جدا: ورود، تغییر شماره، حذف حساب) | `OTP_RESEND_TOO_SOON` |
      | ارسال کد به یک شماره | ۵ بار در ساعت و ۱۰ بار در ۲۴ ساعت | `RATE_LIMITED` |
      | درخواست کد از یک IP | ۲۰ بار در ۱۰ دقیقه | `RATE_LIMITED` |
      | امتحان یک کد | ۵ بار؛ بعدش کد باطل است (`422`) | `OTP_TOO_MANY_ATTEMPTS` |
      | کد اشتباه برای یک شماره | ۱۰ بار در ۲۴ ساعت؛ بعدش تا پایان بازه کد جدید هم پذیرفته نمی‌شود | `RATE_LIMITED` |

      همین حدها برای کدهای تغییر شماره و حذف حساب هم هست.

    ## ۳. قوانین کسب‌وکار

    * **ارسال رایگان:** فقط برای `POST` (پست معمولی) وقتی `subtotal` (جمع بعد از تخفیف محصولات و **قبل** از کد تخفیف) ≥ ۳٬۰۰۰٬۰۰۰ تومان.
    * **محاسبه‌ی جمع سبد** (دقیقاً مطابق طرح سبد و تسویه):
      `itemsCompareAtTotal` (قیمت کالاها = جمع قیمت قبل از تخفیف) − `productDiscount` (تخفیف محصولات) = `subtotal`
      ← − `codeDiscount` (کد تخفیف) + `shippingCost` = `payable` (مبلغ قابل پرداخت، هرگز منفی نیست).
    * **کد تخفیف:** مبنا جمع ردیف‌های قابل خریدی است که کد شاملشان می‌شود (کد بدون محدودیت دسته/محصول/«بدون کالاهای تخفیف‌خورده» = کل `subtotal`).
      نوع درصدی: `floor((مبنا × درصد + 50000) / 100000) × 1000`، یعنی به نزدیک‌ترین ۱٬۰۰۰ تومان، نیمه به بالا (۱۴۵٬۵۰۰ ← ۱۴۶٬۰۰۰؛ ۱۴۵٬۴۹۹ ← ۱۴۵٬۰۰۰)، بعد حداکثر `maxDiscount`؛
      نوع مبلغی حداکثر به اندازه‌ی مبنا. شرط‌ها به این ترتیب (اولین شرط ناموفق جواب است): وجود و فعال بودن، شروع، پایان، ورود (کد با سقف هر کاربر، خرید اول یا «فقط با ورود» برای مهمان نیست)،
      خرید اول (کاربری که سفارش پرداخت‌شده دارد)، سقف استفاده (کل و هر کاربر؛ سفارش‌های پرداخت‌نشده‌ی در جریان هم شمرده می‌شوند)، حداقل خرید، و دست‌کم یک ردیف مشمول.
      کد سبد بعد از هر تغییر سبد دوباره بررسی می‌شود و اگر دیگر معتبر نباشد با `DISCOUNT_REMOVED` (یک بار) برداشته می‌شود. استفاده‌ی سفارشی که منقضی شود آزاد می‌شود.
    * **موجودی:** موجودی دقیق هیچ‌وقت لو نمی‌رود؛ فقط وقتی کمتر از `lowStockThreshold` (پیش‌فرض ۵) است، `availableQuantity` برگردانده می‌شود («فقط ۳ عدد باقی مونده»).
    * **سقف خرید هر محصول** (`maxPerOrder`، پیش‌فرض ۵) مال **محصول** است، نه هر رنگ: جمع تعداد همه‌ی رنگ‌های یک محصول در سبد و در سفارش از آن بیشتر نمی‌شود.
      پس سقف هر ردیف سبد (`CartItem.maxQuantity`) = min(موجودی آن رنگ، `maxPerOrder` − تعداد بقیه‌ی رنگ‌های همان محصول در سبد).
    * **ردیف غیرقابل خرید:** اگر رنگی ناموجود شود یا از فروشگاه خارج شود، ردیفش در سبد می‌ماند (`CartItem.purchasable = false`) ولی در جمع پول حساب نمی‌شود،
      و ثبت سفارش تا وقتی حذف نشود رد می‌شود.
    * **نگه‌داری موجودی برای پرداخت:** با `POST /orders` موجودی برای ۱۵ دقیقه (`paymentPendingMinutes`) کنار گذاشته می‌شود و با پرداخت موفق تا ارسال کنار می‌ماند.
      اگر پرداخت تا آن موقع انجام نشود سفارش `EXPIRED` و موجودی آزاد می‌شود؛ ولی اگر مشتری در همین ۱۵ دقیقه به درگاه رفته و هنوز برنگشته، موجودی تا پایان همان پرداخت
      (حداکثر ۲۰ دقیقه بعد از پایان مهلت) نگه داشته می‌شود. تلاش پرداخت تازه فقط تا پایان مهلت مجاز است و پرداخت دوباره مهلت را تمدید نمی‌کند.
    * **سقف سفارش پرداخت‌نشده:** هر کاربر حداکثر ۳ سفارش پرداخت‌نشده دارد که موجودی نگه داشته‌اند؛ سفارش چهارم `429 RATE_LIMITED` می‌گیرد.
      هر سفارش حداکثر ۱۰ تلاش پرداخت دارد.
    * **ناموجودها** در لیست محصولات به انتهای لیست می‌روند، مگر در مرتب‌سازی قیمتی.
    * **رزرو ۴ روزه:** سوییچ «رزرو ۴ روزه» در سبد و تسویه، **کنار** روش ارسال (پست/تیپاکس) است و جای آن را نمی‌گیرد.
      مبلغ کامل (با هزینه‌ی ارسال) پرداخت می‌شود و سفارش `RESERVED` می‌ماند؛ هر خرید دیگری در این مدت به همان سفارش می‌پیوندد و هزینه‌ی ارسال ندارد.
      * **شروع و پایان مهلت:** مهلت از لحظه‌ی **پرداخت موفق** اولین سفارش (سفارش اصلی) شروع می‌شود و `reservationHoldDays` (۴) روز بعد تمام می‌شود.
        این زمان برای کل گروه ثابت است و با پیوستن سفارش‌های بعدی تمدید نمی‌شود.
      * **پیوستن (ادغام):** اگر کاربر رزرو فعال داشته باشد و سفارش جدید را **به همان آدرس** ثبت کند، سفارش جدید خودکار به گروه می‌پیوندد.
        «همان آدرس» یعنی همان آدرس ذخیره‌شده‌ی سفارش اصلی (`addressId`)، به شرطی که از شروع رزرو ویرایش نشده باشد؛ اگر ویرایش شده باشد سفارش تازه ادغام نمی‌شود.
        هزینه‌ی ارسال سفارش پیوسته صفر می‌شود (`freeReason = RESERVATION_CONSOLIDATION`)، روش ارسالش همان روش سفارش اصلی است، و بعد از پرداخت آن هم `RESERVED` می‌شود.
        تصمیم ادغام هنگام `POST /orders` گرفته می‌شود و اگر مهلت در فاصله‌ی ثبت تا پرداخت (حداکثر ۱۵ دقیقه) تمام شود، ارسال رایگان همچنان حفظ می‌شود
        و سفارش بعد از پرداخت مستقیم `PROCESSING` می‌شود (همراه گروه ارسال می‌شود). سوییچ رزرو ِ سفارشی که می‌پیوندد نادیده گرفته می‌شود.
      * **فقط یک رزرو فعال:** هر کاربر در هر لحظه حداکثر یک رزرو فعال دارد. وقتی رزرو فعال دارد سوییچ رزرو در دسترس نیست
        (`reservation.available = false`، `unavailableReason = HAS_ACTIVE_RESERVATION`): سفارش به همان آدرس ادغام می‌شود و سفارش به آدرس دیگر عادی ارسال می‌شود.
        اگر دو سفارش رزروی پیش از شروع رزرو ثبت شده باشند، اولین پرداخت رزرو را شروع می‌کند و دومی هنگام پرداخت، اگر به همان آدرس باشد، به آن می‌پیوندد
        و وگرنه `PROCESSING` می‌شود.
      * **کالای غیرقابل‌رزرو:** اگر حتی یک کالای سبد `reservable = false` باشد، رزرو در دسترس نیست (`ITEM_NOT_RESERVABLE`).
      * **پایان مهلت:** همه‌ی سفارش‌های گروه **خودکار** از `RESERVED` به `PROCESSING` می‌روند (عکس قبل از ارسال، سپس ارسال گروهی با **یک کد رهگیری**).
      * **لغو:** مشتری سفارش گروه را تا وقتی وضعیتش عوض نشده (`RESERVED` یا `PROCESSING` و هیچ عکسی برایش فرستاده نشده) لغو می‌کند؛
        پنل هر سفارش گروه را تا قبل از `SHIPPED`. لغو سفارش اصلی گروه یا مهلتش را از بین نمی‌برد و
        ارسال رایگان سفارش‌های پیوسته حفظ می‌شود. هزینه‌ی ارسال سفارش اصلی بعد از پیوستن سفارش‌های دیگر دوباره محاسبه نمی‌شود.
    * **عکس قبل از ارسال (امضای کیوا):** انتخاب پیام‌رسان (روبیکا/تلگرام/بله) و شماره‌ی آن در تسویه **اجباری** است. اپراتور قبل از بسته‌بندی عکس/ویدیو را آپلود می‌کند،
      خودش در پیام‌رسان مشتری می‌فرستد و ارسال را ثبت می‌کند؛ یک نسخه برای همیشه در جزئیات سفارش می‌ماند. مشتری عکس را تأیید می‌کند یا تغییر رنگ/مدل می‌خواهد.
    * **لغو سفارش:** مشتری تا وقتی وضعیت سفارش عوض نشده (`RESERVED` یا `PROCESSING` و هیچ عکسی فرستاده نشده) لغو می‌کند؛
      بعد از آن لغو با درخواست تغییر یا پشتیبانی است. پنل تا قبل از `SHIPPED` لغو می‌کند. سفارش پرداخت‌نشده لغو نمی‌شود (خودش منقضی می‌شود).
      **بازگشت وجه دستی است:** با هر لغو یک استرداد `PENDING` به اندازه‌ی کل مبلغ پرداخت‌شده (منهای استردادهای قبلی) ثبت می‌شود
      و همکاران برای گرفتن شماره شبا با مشتری تماس می‌گیرند؛ شماره شبا در سیستم ذخیره نمی‌شود. موجودی آزاد و استفاده‌ی کد تخفیف برگردانده می‌شود.
    * **بازگشت کالا:** تا `returnableUntil` (لحظه‌ی تحویل + `returnWindowDays` ِ همان لحظه، پیش‌فرض ۷ روز). اگر مشکل از کیوا باشد (`NOT_AS_PICTURED`، `MANUFACTURING_DEFECT`، `WRONG_ITEM`، `DAMAGED_IN_TRANSIT`)
      هزینه‌ی برگشت با کیواست و دست‌کم یک عکس یا ویدیو لازم است؛ در `CHANGED_MIND` و `OTHER` با مشتری (اپراتور موقع تأیید می‌تواند عوضش کند).
      هر سفارش حداکثر یک مرجوعی ِ غیر `REJECTED` دارد. بازگشت وجه مرجوعی هم دستی است: همان استرداد `POST /admin/orders/{orderCode}/refunds` با `returnId`؛ شماره شبا ذخیره نمی‌شود.
    * **جمعه‌ها** ارسال نداریم (`nonShippingWeekdays`). سفارشی که جمعه (به وقت تهران) ثبت می‌شود شنبه ارسال می‌شود، و `estimatedDelivery`
      از روز ارسال شمرده می‌شود: `minDays` تا `maxDays` روز کاری بعد از آن، بدون جمعه‌ها. پس سفارش جمعه یک روز دیرتر از سفارش پنجشنبه می‌رسد.

    ## ۴. چرخه‌ی وضعیت سفارش

    | `status` | برچسب طرح | مرحله‌ی stepper | رنگ تگ |
    |---|---|---|---|
    | `PENDING_PAYMENT` | در انتظار پرداخت | — | warn |
    | `PAYMENT_FAILED` / `EXPIRED` | پرداخت ناموفق / منقضی | — | danger |
    | `RESERVED` | رزرو شده | ۱ ثبت شد | cream |
    | `PROCESSING` | در حال آماده‌سازی | ۱ ثبت شد | warn |
    | `PHOTO_SENT` | عکس کیف ارسال شد | ۲ عکس ارسال شد | default |
    | `CHANGE_REQUESTED` | درخواست تغییر ثبت شد | ۲ عکس ارسال شد | warn |
    | `SHIPPED` | در مسیر | ۳ تحویل پست شد | default |
    | `DELIVERED` | تحویل شده | ۴ تحویل شد | success |
    | `CANCELLED` | لغو شده | — | danger |
    | `RETURN_REQUESTED` / `RETURNED` / `REFUNDED` | درخواست مرجوعی / مرجوع شد / وجه برگشت داده شد | — | warn / default |

    مسیر اصلی: `PENDING_PAYMENT → (RESERVED) → PROCESSING → PHOTO_SENT → SHIPPED → DELIVERED`.
    `RESERVED → PROCESSING` فقط خودکار و در پایان مهلت رزرو انجام می‌شود؛ `RESERVED → CANCELLED` با لغو مشتری یا ادمین.

    **`allowedTransitions`** (آنچه `POST /admin/orders/{orderCode}/status` می‌پذیرد):

    | وضعیت فعلی | `allowedTransitions` |
    |---|---|
    | `RESERVED`، `PROCESSING`، `PHOTO_SENT`، `CHANGE_REQUESTED` | `[CANCELLED]` |
    | `SHIPPED` | `[DELIVERED]` |
    | بقیه | `[]` |

    `PHOTO_SENT` (با `…/pre-shipment-media/send`)، `SHIPPED` (با `…/shipment`)، خروج از `CHANGE_REQUESTED` به‌جز لغو و وضعیت‌های مرجوعی هیچ‌وقت از `…/status` نمی‌آیند.

    **عکس قبل از ارسال** (`preShipmentMedia.status`): `WAITING` (پیش‌نویس دارد یا نه؛ مشتری پیش‌نویس را نمی‌بیند) ← ثبت ارسال ← `SENT` ← تأیید مشتری،
    یا پایان مهلت پاسخ (`feedbackDeadline` = زمان ارسال عکس + ۲۴ ساعت) ← `APPROVED`؛ `SENT` یا `APPROVED` ← درخواست تغییر ← `CHANGE_REQUESTED` ← رسیدگی ← `WAITING` (عکس تازه).
    تأیید عکس وضعیت سفارش را عوض نمی‌کند (`PHOTO_SENT` تا ارسال می‌ماند).

    **ارسال** فقط از `PHOTO_SENT` است، و فقط بعد از تأیید مشتری یا پایان مهلت پاسخ (`422 AWAITING_CUSTOMER_FEEDBACK`)، و بدون مانده‌ی پرداخت.
    **گروه رزرو با یک درخواست و یک کد رهگیری ارسال می‌شود** و همه‌ی سفارش‌های لغونشده‌ی گروه باید آماده باشند (`422 GROUP_NOT_READY`)؛ سفارش لغوشده‌ی گروه ارسال نمی‌شود و مانع هم نیست.
    «تحویل شد» دستی است (`…/status` با `DELIVERED`) و مهلت مرجوعی (`returnableUntil`) همان لحظه با `returnWindowDays` ِ آن لحظه ثابت می‌شود.
    سرور برای هر سفارش آبجکت آماده‌ی `progress` (۴ مرحله با تاریخ هر مرحله) و `statusLabel`/`statusTone` را برمی‌گرداند تا کلاینت منطق نگاشت نداشته باشد.

    **درخواست تغییر:** مشتری با `POST /me/orders/{orderCode}/media-feedback` (`REQUEST_CHANGE`) سفارش را `CHANGE_REQUESTED` می‌کند.
    اپراتور آن را با `POST /admin/orders/{orderCode}/change-request/resolution` اجرا یا رد می‌کند و سفارش به `PROCESSING` برمی‌گردد
    (`preShipmentMedia.status = WAITING`: عکس تازه، بعد ارسال). از `CHANGE_REQUESTED` فقط همین endpoint یا لغو (`CANCELLED`) بیرون می‌برد.
    اگر رنگ/مدل تازه **ارزان‌تر** باشد، مابه‌التفاوت اول از مانده‌ی پرداخت (`balanceDue`) کم می‌شود و باقیش خودکار استرداد می‌شود؛
    اگر **گران‌تر** باشد، روی سفارش `balanceDue` می‌نشیند (در `OrderSummary` و `totals`) و `actions.canPay = true`؛
    مشتری با `POST /me/orders/{orderCode}/payments` آن را می‌پردازد و تا صفر نشود سفارش ارسال نمی‌شود (`422 BALANCE_DUE`).
    درخواست تغییر فقط در `PHOTO_SENT` (عکس `SENT` یا `APPROVED`؛ پس بعد از تأیید هم) و یکی در هر لحظه ممکن است؛ بعد از ارسال هیچ‌وقت.

    **چرخه‌ی مرجوعی** (`ReturnStatus`):

    | از | به | با |
    |---|---|---|
    | — | `REQUESTED` | مشتری: `POST /me/orders/{orderCode}/returns` |
    | `REQUESTED` | `APPROVED` یا `REJECTED` (پایان) | `POST /admin/returns/{returnId}/decision` |
    | `APPROVED` | `PICKUP_SCHEDULED` (اختیاری؛ وقتی کیوا مرسوله را جمع می‌کند) | `PUT /admin/returns/{returnId}/pickup` (دوباره صدا زدن = تغییر زمان/کد) |
    | `APPROVED`، `PICKUP_SCHEDULED` | `RECEIVED` (کالا به انبار رسید و بازبینی شد) | `POST /admin/returns/{returnId}/receipt` |
    | `RECEIVED` | `REFUNDED` (پایان) | وقتی استرداد همین مرجوعی (`POST /admin/orders/{orderCode}/refunds` با `returnId`) `COMPLETED` شود |
    | `APPROVED`، `PICKUP_SCHEDULED`، `RECEIVED` | `CLOSED` (پایان بدون استرداد: کالا نرسید یا بازبینی رد شد) | `POST /admin/returns/{returnId}/close` |

    وضعیت سفارش دنبال مرجوعی باز آن می‌رود: تا مرجوعی `REQUESTED`، `APPROVED` یا `PICKUP_SCHEDULED` است سفارش `RETURN_REQUESTED`،
    بعد از `RECEIVED` سفارش `RETURNED` و بعد از `REFUNDED` سفارش `REFUNDED` است. اگر مرجوعی `REJECTED` یا `CLOSED` شود (یعنی بدون استرداد)،
    سفارش به `DELIVERED` برمی‌گردد. انتقال نامجاز در همه‌ی این endpointها `422 INVALID_STATUS_TRANSITION` (با `meta.from`، `meta.to` و `meta.allowed`) است و پاسخ پنل
    (`AdminReturnRequest.allowedTransitions`) قدم‌های مجاز بعدی را می‌گوید.

    | وضعیت مرجوعی | وضعیت سفارش | `allowedTransitions` ِ مرجوعی |
    |---|---|---|
    | `REQUESTED` | `RETURN_REQUESTED` | `[APPROVED, REJECTED]` |
    | `APPROVED`، `PICKUP_SCHEDULED` | `RETURN_REQUESTED` | `[PICKUP_SCHEDULED, RECEIVED, CLOSED]` |
    | `RECEIVED` | `RETURNED` | `[REFUNDED, CLOSED]`؛ وقتی استرداد `PENDING`/`PROCESSING` ِ همین مرجوعی هست `[]` (هر دو قدم منتظر نتیجه‌ی آن استردادند) |
    | `REFUNDED` | `REFUNDED` | `[]` |
    | `REJECTED` | `DELIVERED` (تا مهلت باز است، مشتری دوباره درخواست می‌دهد) | `[]` |
    | `CLOSED` | `DELIVERED` (دیگر مرجوعی ندارد) | `[]` |

    مرجوعی **بستن خودکار ندارد**: مرسوله‌ای که نرسید را اپراتور با `…/close` می‌بندد (صف پنل با `sort=oldest` قدیمی‌ها را اول نشان می‌دهد).
    مرجوعی `soldCount` ِ محصول را کم نمی‌کند (سفارش مرجوعی‌شده هنوز خرید است).

    ## ۵. پیامک‌ها و اعلان‌ها

    | رویداد | کانال | محتوا |
    |---|---|---|
    | درخواست OTP | SMS | کد ۵ رقمی |
    | پرداخت موفق | SMS | کد سفارش + لینک `track?order=KV-...` |
    | ارسال عکس قبل از ارسال | پیام‌رسان انتخابی (اپراتور، دستی) + SMS (سرور) | عکس‌ها/ویدیو در پیام‌رسان؛ پیامک: کد سفارش + لینک جزئیات سفارش |
    | ۱۲ ساعت مانده به پایان رزرو | SMS | یادآوری افزودن خرید [پیشنهادی] |
    | تحویل به پست/تیپاکس | SMS | کد رهگیری + اسم حامل (اصلاح کد رهگیری پیامک ندارد) |
    | تحویل شد | SMS | درخواست ثبت نظر (با `notifyCustomer`) |
    | لغو شد | SMS | کد سفارش؛ لغو مشتری همیشه، لغو پنل با `notifyCustomer` |
    | پول برگشت | SMS | کد سفارش؛ وقتی استرداد `COMPLETED` می‌شود (استرداد مرجوعی هم) |
    | مرجوعی تأیید شد / رد شد | SMS | کد مرجوعی (`RT-…`) + «جزئیات تو حسابت»؛ همیشه. **بدون** دلیل رد یا دستورالعمل (متن آزاد پیامک نداریم) |
    | جمع‌آوری مرجوعی | SMS | کد مرجوعی + اسم حامل؛ با `notifyCustomer` |
    | مرجوعی بسته شد | SMS | کد مرجوعی + «جزئیات تو حسابت»؛ با `notifyCustomer`. **بدون** دلیل بستن |
    | درخواست تغییر بررسی شد | SMS | کد سفارش + «جزئیات در صفحه‌ی سفارش»؛ با `notifyCustomer`. **بدون `note`**: متن آزاد پیامک نداریم، `note` در `feedback.resolution` و تایم‌لاین دیده می‌شود |
    | پاسخ پیام تماس | SMS | فقط خبر و کد پیگیری («پشتیبانی کیوا به پیامت (CT-…) رسیدگی کرد…»)؛ **متن پاسخ را نمی‌برد** (الگوهای پیامک متن آزاد نمی‌گیرند)؛ اپراتور خودش تماس می‌گیرد یا در پیام‌رسان می‌نویسد |
    | موجود شد | SMS | اسم محصول (حداکثر ۳۰ نویسه) + لینک صفحه‌اش به رنگ موجودشده؛ یه کار زمان‌بندی‌شده تا ۵ دقیقه بعد از موجود شدن، از هر راهی، می‌فرسته؛ نه بین ۲۲ تا ۸ صبح تهران؛ هر اشتراک فقط یه بار |

    ## ۶. نگاشت صفحه‌ها به endpointها

    | صفحه | endpointها |
    |---|---|
    | همه صفحات (هدر/فوتر/منو/جستجو/سبد کشویی) | `GET /config`، `GET /categories`، `GET /search/suggest`، `GET /search/hints`، `GET /cart`، `GET /me/wishlist/ids` (فقط کاربر واردشده؛ مهمان قلب‌ها را در مرورگر نگه می‌دارد)، `POST /newsletter/subscriptions` |
    | خانه `index` | `GET /home` (یا جداگانه: `/campaigns/active`، `/banners`، `/testimonials`، `/products?sort=newest`) |
    | فروشگاه `products` | `GET /products` (+`includeFacets`)، `GET /products/facets`، `GET /colors` |
    | جزئیات محصول `product` | `GET /products/{idOrSlug}`، `GET /products/{id}/reviews`، `POST /products/{id}/reviews`، `GET /products/{id}/related`، `POST /products/{id}/stock-alerts`، `GET /products/{id}/inquiry`، `POST /cart/items`، `PUT /me/wishlist/items/{id}` |
    | سبد `cart` | `GET/POST/PATCH/DELETE /cart/...`، `PUT /cart/shipping-method`، `PUT /cart/reservation`، `POST/DELETE /cart/discount-code`، `POST /cart/items/{id}/move-to-wishlist` |
    | تسویه `checkout` | `GET /checkout`، `POST /orders`، `GET /payments/{id}`، `GET /geo/provinces` |
    | ورود `login` | `POST /auth/otp/send`، `POST /auth/otp/verify`، `PATCH /me` |
    | حساب `account` | `GET /me/dashboard`، `GET /me/orders`، `GET /me/orders/{code}`، `GET /me/tracking`، `/me/addresses`، `/me/wishlist`، `GET /me/reviews`، `GET/PATCH /me` |
    | کارهای سفارش در `account` (طبق `actions`) | `POST /me/orders/{code}/payments`، `POST /me/orders/{code}/cancel`، `POST /me/orders/{code}/media-feedback`، `POST /me/orders/{code}/returns`، `GET /me/orders/{code}/invoice` |
    | علاقه‌مندی `wishlist` | `GET /me/wishlist`، `DELETE /me/wishlist`، `POST /me/wishlist/add-to-cart`، `POST/DELETE /me/wishlist/share` |
    | لیست اشتراکی `wishlist/shared/{token}` (بدون ورود) | `GET /wishlists/shared/{token}` |
    | پیگیری `track` | `POST /tracking/lookup`، `GET /tracking/daily/days`، `GET /tracking/daily` |
    | بلاگ | `GET /blog/categories`، `GET /blog/posts`، `GET /blog/posts/{idOrSlug}`، `GET /blog/posts/{id}/related`، `POST /blog/posts/{id}/feedback` |
    | سوالات متداول `faq` | `GET /faq` |
    | تماس `contact` | `GET /contact/topics`، `POST /contact/messages` (ساعات پاسخگویی در `/config`) |
    | درباره ما `about` | `GET /site/stats`، `GET /pages/{slug}` |
servers:
  - url: https://api.kiva.ir/api/v1
    description: Production
  - url: https://staging-api.kiva.ir/api/v1
    description: Staging
  - url: '{scheme}://{host}:{port}/api/v1'
    description: Local development
    variables:
      scheme:
        enum: [http, https]
        default: http
      host:
        default: localhost
      port:
        default: '8080'
security: []
tags:
  - name: Config & Home
    description: تنظیمات سراسری سایت، صفحه‌ی اصلی، بنرها، کمپین‌ها و آمار
  - name: Auth
    description: ورود/ثبت‌نام بدون رمز با کد یک‌بارمصرف (OTP)
  - name: Catalog
    description: دسته‌بندی‌ها، رنگ‌ها، متریال‌ها و لیست/فیلتر محصولات
  - name: Product
    description: جزئیات کامل محصول، ورینت‌های رنگی، مدیا، مشخصات، محصولات مرتبط، «موجود شد خبرم کن» و «سؤال داری؟»
  - name: Reviews
    description: نظرات و امتیاز محصولات (با تأیید ادمین و پاسخ کیوا)
  - name: Search
    description: جستجوی سراسری هدر و پیشنهادها
  - name: Cart
    description: سبد خرید (مهمان و کاربر)، روش ارسال، رزرو ۴ روزه و کد تخفیف
  - name: Checkout & Payment
    description: تکمیل خرید، ثبت سفارش، درگاه پرداخت و نتیجه‌ی پرداخت
  - name: Orders
    description: سفارش‌های کاربر، عکس قبل از ارسال، لغو، درخواست تغییر و مرجوعی
  - name: Tracking
    description: پیگیری سفارش بدون ورود و کدهای رهگیری روزانه
  - name: Account
    description: پروفایل، داشبورد حساب و ترجیحات
  - name: Addresses
    description: آدرس‌های کاربر و تقسیمات کشوری
  - name: Wishlist
    description: علاقه‌مندی‌ها، افت قیمت و اشتراک‌گذاری لیست
  - name: Content
    description: سوالات متداول، تماس با ما، خبرنامه و صفحات ثابت
  - name: Blog
    description: مجله‌ی کیوا
  - name: Uploads
    description: آپلود فایل (عکس مرجوعی، عکس نظر)
  - name: Admin · Catalog
    description: "[پیشنهادی] مدیریت محصولات، ورینت‌ها، موجودی، مدیا و طبقه‌بندی‌ها"
  - name: Admin · Orders
    description: "[پیشنهادی] مدیریت سفارش‌ها، آپلود و ارسال عکس قبل از ارسال، ثبت کد رهگیری، مرجوعی و استرداد"
  - name: Admin · Marketing
    description: "[پیشنهادی] کدهای تخفیف، کمپین‌ها، بنرها، اطلاعیه‌ها و پیام‌های رضایت"
  - name: Admin · Content
    description: "[پیشنهادی] بلاگ، سوالات متداول، صفحات و تنظیمات سایت"
  - name: Admin · Support
    description: "[پیشنهادی] نظرات، پیام‌های تماس، مشتریان و گزارش‌ها"
paths:
  # ================================================================
  #  CONFIG & HOME
  # ================================================================
  /config:
    get:
      tags: [Config & Home]
      operationId: getSiteConfig
      summary: "تنظیمات سراسری سایت (هدر، فوتر، ارسال، رزرو، پیام‌رسان‌ها، درگاه‌ها، پشتیبانی)"
      description: |
        یک‌بار در بارگذاری اپ گرفته و کش می‌شود. همه‌ی عددهای ثابتی که الان در `kiva.js` هاردکد شده‌اند
        (`SHIPPING`، `FREE_POST`، `MSGR`، پیام‌های نوار اطلاعیه، ساعت کاری، آستانه‌ی موجودی کم و ...) از این‌جا می‌آیند.
        با `ETag` و `Cache-Control: public, max-age=300` کش می‌شود؛ درخواست با `If-None-Match` برابر `304` بدون بدنه می‌گیرد.
        منبع هر بخش در `SiteConfig`: عددها و لیست‌ها همان تنظیمات `PUT /admin/settings` و همان چیزی‌اند که سبد و تسویه می‌خوانند؛
        متن‌های برند، فوتر و نشان‌ها محتوای ثابت سایت‌اند (فعلاً بدون endpoint پنل). `support.isOpenNow` و `announcements` به لحظه‌ی
        ساختن پاسخ وابسته‌اند، پس تا ۵ دقیقه ممکن است کهنه باشند.
      responses:
        '200':
          description: OK
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SiteConfig' }
        '304':
          description: تغییری نکرده (`If-None-Match` همان `ETag` فعلی است)؛ بدون بدنه
  /home:
    get:
      tags: [Config & Home]
      operationId: getHomePage
      summary: "داده‌ی تجمیعی صفحه‌ی اصلی"
      description: |
        شامل: محصول نمایشی هیرو (با رنگ‌ها و عکس هر رنگ)، ویژگی‌ها، دسته‌بندی‌ها با تعداد مدل،
        محصولات جدید (۸ تا)، بنرهای تبلیغاتی، کمپین تخفیف فعال با شمارنده‌ی معکوس + ۴ محصول با بیشترین درصد تخفیف (موجود)،
        خلاصه‌ی رضایت و پیام‌های مشتریان، و مراحل «چطور کار می‌کنیم».

        * `hero`، `features` و `howItWorks` محتوای ثابت سایت‌اند (فعلاً بدون endpoint ِ پنل). `hero.showcaseProduct` محصول انتخاب‌شده‌ی محتواست
          اگر منتشرشده باشد، وگرنه تازه‌ترین محصول منتشرشده؛ فروشگاه خالی ← `null`.
        * `categories` همان `GET /categories`؛ `newArrivals` ۸ تازه‌ترین منتشرشده (ناموجودها ته لیست)؛ `promos` بنرهای دیده‌شده‌ی `HOME_PROMO` (حداکثر ۶)؛
          `sale` کمپین فعال با ۴ محصول (یا `null`)؛ `testimonials` خلاصه‌ی رضایت و ۶ پیام اول. بنرهای `HOME_HERO` جزو خانه نیستند (`GET /banners?placement=HOME_HERO`).
        * ورود اثری ندارد: `isWishlisted` روی همه‌ی کارت‌ها **همیشه `null`** است (پاسخ کش می‌شود؛ قلب‌ها را از `GET /me/wishlist/ids` روشن کن).
        * با `ETag` و `Cache-Control: public, max-age=300` کش می‌شود؛ `If-None-Match` برابر ← `304`. شمارنده‌ی `sale` را با `serverTime` ِ
          `GET /campaigns/active` همگام کن، نه با این پاسخ که تا ۵ دقیقه کهنه است.
      security: [{}, { bearerAuth: [] }]
      responses:
        '200':
          description: OK
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HomePage' }
        '304':
          description: تغییری نکرده (`If-None-Match` همان `ETag` فعلی است)؛ بدون بدنه
  /banners:
    get:
      tags: [Config & Home]
      operationId: listBanners
      summary: "بنرهای فعال یک جایگاه"
      description: |
        بنرهای **دیده‌شده** ِ همان جایگاه: `startsAt ≤ الان < endsAt` (هر کدام `null` = باز)، به ترتیب `sortOrder` و بعد شناسه، حداکثر ۱۰.
        `placement` نیامد یا ناشناخته ← `400`. کش نمی‌شود.
      parameters:
        - name: placement
          in: query
          required: true
          schema: { $ref: '#/components/schemas/BannerPlacement' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Banner' }
        '400': { $ref: '#/components/responses/ValidationError' }
  /campaigns/active:
    get:
      tags: [Config & Home]
      operationId: getActiveCampaign
      summary: "کمپین تخفیف فعال (مثل جشنواره پاییزه) با زمان پایان برای شمارنده"
      description: |
        «فعال» = `isActive` و `startsAt ≤ الان < endsAt`؛ دو کمپین فعال هم‌پوشان ساخته نمی‌شوند، پس حداکثر یکی است. نبود ← `204`.
        کمپین فقط نمایشی است و **هیچ قیمتی را عوض نمی‌کند**؛ تخفیف هر محصول همان `compareAtPrice` ِ خودش است. `products` حداکثر ۲۴ (قانون در `Campaign`)،
        کارت‌ها با `isWishlisted = null`. کش نمی‌شود (`serverTime` باید تازه باشد).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Campaign' }
        '204':
          description: کمپین فعالی وجود ندارد
  /testimonials:
    get:
      tags: [Config & Home]
      operationId: listTestimonials
      summary: "پیام‌های رضایت مشتریان از پیام‌رسان‌ها + خلاصه‌ی رضایت"
      description: |
        فقط منتشرشده‌ها، به ترتیب `sortOrder` صعودی، بعد `receivedAt` نزولی (بی‌تاریخ آخر)، بعد شناسه نزولی. `summary` دستی است (`siteStats.satisfaction`
        ِ `PUT /admin/settings`) و از پیام‌ها یا نظرها حساب نمی‌شود؛ تنظیم نشده ← `null`. کش نمی‌شود.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestimonialListResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
  /site/stats:
    get:
      tags: [Config & Home]
      operationId: getSiteStats
      summary: "آمار عمومی (صفحه‌ی درباره ما — مشتری راضی، عکس قبل از ارسال، درصد رضایت، تعداد مدل)"
      description: همان `siteStats` ِ `PUT /admin/settings`، همان‌طور که ذخیره شده (دستی؛ هیچ عددی حساب نمی‌شود). کش نمی‌شود.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SiteStats' }

  # ================================================================
  #  GEO
  # ================================================================
  /geo/provinces:
    get:
      tags: [Addresses]
      operationId: listProvinces
      summary: "لیست استان‌ها (به‌همراه شهرها)"
      description: |
        ۳۱ استان به ترتیب الفبا، هر کدام با شهرهایش به ترتیب الفبا. فهرست فقط با به‌روزرسانی سرور عوض می‌شود،
        پس با `ETag` و `Cache-Control: public, max-age=300` کش می‌شود؛ درخواست با `If-None-Match` برابر `304` بدون بدنه می‌گیرد.
      parameters:
        - name: includeCities
          in: query
          description: '`false` = فقط استان‌ها (`cities: null`). مقداری غیر از `true` و `false` ← `400` روی همین فیلد.'
          schema: { type: boolean, default: true }
      responses:
        '200':
          description: OK
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Province' }
        '304':
          description: تغییری نکرده (`If-None-Match` همان `ETag` فعلی است)؛ بدون بدنه
        '400': { $ref: '#/components/responses/ValidationError' }
  /geo/provinces/{provinceId}/cities:
    get:
      tags: [Addresses]
      operationId: listCitiesOfProvince
      summary: "شهرهای یک استان"
      description: |
        شهرهای استان به ترتیب الفبا. مثل `GET /geo/provinces` با `ETag` و `Cache-Control: public, max-age=300` کش می‌شود.
        استانی که وجود ندارد، یا شناسه‌ای که عدد مثبت نیست، `404 NOT_FOUND` می‌گیرد.
      parameters:
        - name: provinceId
          in: path
          required: true
          schema: { type: integer, example: 8 }
      responses:
        '200':
          description: OK
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/City' }
        '304':
          description: تغییری نکرده (`If-None-Match` همان `ETag` فعلی است)؛ بدون بدنه
        '404': { $ref: '#/components/responses/NotFound' }

  # ================================================================
  #  CONTENT: FAQ / CONTACT / NEWSLETTER / PAGES
  # ================================================================
  /faq:
    get:
      tags: [Content]
      operationId: getFaq
      summary: "سوالات متداول گروه‌بندی‌شده (با جستجو)"
      description: |
        گروه‌ها با `id` برای لینک مستقیم (`faq#reserve`، `faq#return`، `faq#shipping`) استفاده می‌شوند.
        با `q` فقط سوال‌هایی که در متن سوال یا متن ساده‌ی جواب (بدون تگ) شامل عبارت هستند برگردانده می‌شوند، و فقط گروه‌هایی که
        سوال جور دارند؛ `questionHighlighted`/`answerHighlighted` با `<mark>` پر می‌شوند. تطابق حرف‌به‌حرف و بی‌حساس به
        `ي`/`ی`، `ك`/`ک`، رقم فارسی و لاتین و حروف بزرگ و کوچک است؛ فاصله‌های اضافه‌ی `q` حذف می‌شوند. `q` ِ خالی یعنی بی `q`؛
        بیشتر از ۱۰۰ حرف ← `400 TEXT_TOO_LONG` روی `q`. بی نتیجه: `groups: []` و `emptyMessage`.
        با `ETag` و `Cache-Control: public, max-age=300` کش می‌شود.
      parameters:
        - name: q
          in: query
          schema: { type: string, maxLength: 100, example: رزرو }
      responses:
        '200':
          description: OK
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FaqResponse' }
        '304':
          description: تغییری نکرده (`If-None-Match` همان `ETag` فعلی است)؛ بدون بدنه
        '400': { $ref: '#/components/responses/ValidationError' }
  /contact/topics:
    get:
      tags: [Content]
      operationId: listContactTopics
      summary: "موضوعات فرم تماس"
      description: 'پنج موضوع با برچسب فارسی. با `ETag` و `Cache-Control: public, max-age=300` کش می‌شود؛ `If-None-Match` برابر ← `304`.'
      responses:
        '200':
          description: OK
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ContactTopicOption' }
        '304':
          description: تغییری نکرده (`If-None-Match` همان `ETag` فعلی است)؛ بدون بدنه
  /contact/messages:
    post:
      tags: [Content]
      operationId: createContactMessage
      summary: "ارسال پیام فرم تماس — خروجی کد پیگیری (CT- و ۶ رقم)"
      description: |
        ورود اختیاری (اگر وارد شده، پیام به حسابش وصل می‌شود؛ توکن نامعتبر `401`). قانون‌های فیلدها در `ContactMessageRequest`، همه با هم (`400`).
        `orderCode` فقط مرجع است و مالکیتش چک نمی‌شود. سقف: ۵ پیام در ساعت برای هر IP و ۵ پیام در ۲۴ ساعت برای هر موبایل ← `429 RATE_LIMITED`
        با `Retry-After` و `meta.retryAfterSeconds`. خبری به پشتیبانی فرستاده نمی‌شود؛ پنل با `status=OPEN` صف را می‌بیند.
      security: [{}, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContactMessageRequest' }
      responses:
        '201':
          description: ثبت شد
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactMessageResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /newsletter/subscriptions:
    post:
      tags: [Content]
      operationId: subscribeNewsletter
      summary: "عضویت در خبرنامه‌ی ایمیلی (فوتر)"
      description: |
        **همیشه `200`** با همان پیام («عضو خبرنامه کیوا شدی!»)، چه تازه، چه از قبل عضو، چه برگشته از لغو؛ پاسخ لو نمی‌دهد ایمیل عضو بوده یا نه.
        ایمیل با حروف کوچک ذخیره می‌شود (`Sara@Example.com` و `sara@example.com` یک عضوند). فقط عضو تازه یا برگشته یک ایمیل خوش‌آمد با لینک لغو
        (`/newsletter/unsubscribe?token=nl_…`) می‌گیرد. سقف: ۵ درخواست در ساعت برای هر IP ← `429`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewsletterSubscribeRequest' }
      responses:
        '200':
          description: عضو شد (یا از قبل بود)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /newsletter/subscriptions/unsubscribe:
    post:
      tags: [Content]
      operationId: unsubscribeNewsletter
      summary: "لغو عضویت خبرنامه با توکن لینک ایمیل"
      description: |
        `token` باید `nl_` و ۳۲ حرف و رقم لاتین باشد (`400 UNSUBSCRIBE_TOKEN_INVALID` روی `token`). ناشناخته یا از قبل لغوشده هم `204` (بی‌تغییر):
        پاسخ لو نمی‌دهد توکنی بوده یا نه.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '400': { $ref: '#/components/responses/ValidationError' }
  /pages/{slug}:
    get:
      tags: [Content]
      operationId: getStaticPage
      summary: "صفحه‌ی ثابت CMS (درباره ما، قوانین، حریم خصوصی، شرایط بازگشت)"
      description: |
        صفحه‌هایی که پنل نوشته (`terms`، `privacy`، `returns`، `about`، …). صفحه‌ی ننوشته یا `slug` ِ بدشکل ← `404 NOT_FOUND`
        (صفحه‌ای پیش‌فرض ساخته نمی‌شود). با `ETag` و `Cache-Control: public, max-age=300` کش می‌شود.
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string, example: terms }
      responses:
        '200':
          description: OK
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaticPage' }
        '304':
          description: تغییری نکرده (`If-None-Match` همان `ETag` فعلی است)؛ بدون بدنه
        '404': { $ref: '#/components/responses/NotFound' }

  # ================================================================
  #  AUTH
  # ================================================================
  /auth/otp/send:
    post:
      tags: [Auth]
      operationId: sendOtp
      summary: "ارسال کد تأیید ۵ رقمی به موبایل (ورود و ثبت‌نام یکی است)"
      description: |
        برای جلوگیری از شناسایی کاربران (user enumeration) در این مرحله مشخص نمی‌شود که شماره قبلاً ثبت‌نام کرده یا نه؛
        این اطلاعات بعد از verify در `isNewUser` برمی‌گردد. پاسخ برای هر شماره‌ی معتبری یکی است.
        کد جدید، کد قبلی همان شماره را باطل می‌کند. حدها: جدول «محدودیت‌ها» در بخش ۲.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SendOtpRequest' }
      responses:
        '200':
          description: کد ارسال شد
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SendOtpResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/otp/verify:
    post:
      tags: [Auth]
      operationId: verifyOtp
      summary: "تأیید کد و دریافت توکن (+ادغام سبد مهمان)"
      description: |
        اگر شماره حساب نداشت، همین‌جا ساخته می‌شود (`isNewUser = true`). هر کد فقط یک بار مصرف می‌شود.
        refreshToken در کوکی `kiva_rt` می‌آید (هدر `Set-Cookie`)، نه در بدنه.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerifyOtpRequest' }
      responses:
        '200':
          description: ورود موفق
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetRefreshCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '422':
          description: |
            `OTP_INVALID` (با `meta.attemptsLeft`)، `OTP_EXPIRED` (کد فعالی برای این شماره نیست یا تمام شده)،
            یا `OTP_TOO_MANY_ATTEMPTS` (این کد ۵ بار اشتباه زده شده و باطل است؛ کد جدید بگیر).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshToken
      summary: "تمدید توکن با کوکی refreshToken (چرخشی)"
      description: |
        بدنه ندارد؛ refreshToken از کوکی `kiva_rt` خوانده می‌شود (`credentials: 'include'`).
        پاسخ یک accessToken تازه است و کوکی با توکن جدید عوض می‌شود.
        `401 REFRESH_TOKEN_INVALID`: کوکی نیست، منقضی یا باطل شده، یا توکن قدیمی دوباره استفاده شده (در این حالت کل زنجیره باطل می‌شود).
        `403 FORBIDDEN`: درخواست از origin مجاز نیامده.
      security: [{ refreshCookie: [] }]
      responses:
        '200':
          description: OK
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetRefreshCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthTokens' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: "خروج از حساب (ابطال نشست)"
      description: |
        نشستِ کوکی `kiva_rt` را باطل و کوکی را پاک می‌کند. accessToken لازم ندارد، پس با توکن منقضی هم کار می‌کند.
        همیشه `204` است، حتی اگر کوکی نباشد یا قبلاً باطل شده باشد. accessTokenهای صادرشده تا پایان ۱۵ دقیقه‌شان معتبر می‌مانند
        (به‌جز در پنل، که نشست در هر درخواست چک می‌شود)؛ کلاینت باید accessToken را از حافظه پاک کند.
      security: [{ refreshCookie: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                allDevices: { type: boolean, default: false, description: "خروج از همه‌ی دستگاه‌ها: همه‌ی نشست‌های این کاربر باطل می‌شوند" }
      responses:
        '204':
          description: خارج شد
          headers:
            Set-Cookie: { $ref: '#/components/headers/ClearRefreshCookie' }
        '403': { $ref: '#/components/responses/Forbidden' }
  # ================================================================
  #  CATALOG
  # ================================================================
  /categories:
    get:
      tags: [Catalog]
      operationId: listCategories
      summary: "دسته‌بندی‌ها (مگامنو، منوی موبایل، چیپ‌های فروشگاه، بخش دسته‌بندی خانه)"
      responses:
        '200':
          description: OK
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Category' }
  /categories/{slug}:
    get:
      tags: [Catalog]
      operationId: getCategory
      summary: "جزئیات یک دسته‌بندی (عنوان صفحه، SEO، بنر)"
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string, example: shoulder }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
        '404': { $ref: '#/components/responses/NotFound' }
  /colors:
    get:
      tags: [Catalog]
      operationId: listColors
      summary: "پالت رنگ‌ها با تعداد محصول هر رنگ"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Color' }
  /materials:
    get:
      tags: [Catalog]
      operationId: listMaterials
      summary: "متریال‌ها (برای فیلتر و صفحه‌ی مشخصات) [پیشنهادی]"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Material' }
  /products:
    get:
      tags: [Catalog]
      operationId: listProducts
      summary: "لیست محصولات با فیلتر، مرتب‌سازی، صفحه‌بندی و (اختیاری) facets"
      description: |
        پارامترها همان state صفحه‌ی فروشگاه هستند (`?q=&category=shoulder,cross&color=black,lilac&minPrice=&maxPrice=&onSale=true&inStock=true&sort=bestselling`).

        * وقتی فیلتر رنگ فعال است، `ProductSummary.displayColorKey` برابر اولین رنگ منطبق است تا **عکس اول کارت همان رنگ** باشد.
        * ناموجودها در انتهای لیست قرار می‌گیرند مگر `sort` قیمتی باشد.
        * `title` و `appliedFilters` آماده‌ی نمایش (عنوان صفحه، بردکرامب و چیپ‌های فیلتر فعال) برگردانده می‌شوند.
        * با `ids` می‌توان لیست «اخیراً دیده‌شده» یا علاقه‌مندی مهمان را گرفت.
      security: [{}, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/SearchQuery'
        - $ref: '#/components/parameters/CategoryFilter'
        - $ref: '#/components/parameters/ColorFilter'
        - $ref: '#/components/parameters/MinPrice'
        - $ref: '#/components/parameters/MaxPrice'
        - $ref: '#/components/parameters/OnSale'
        - $ref: '#/components/parameters/InStock'
        - $ref: '#/components/parameters/IsNew'
        - $ref: '#/components/parameters/HasVideo'
        - $ref: '#/components/parameters/BagTypeFilter'
        - $ref: '#/components/parameters/MaterialFilter'
        - $ref: '#/components/parameters/OccasionFilter'
        - $ref: '#/components/parameters/CampaignFilter'
        - $ref: '#/components/parameters/ProductIds'
        - $ref: '#/components/parameters/ProductSort'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/ProductPageSize'
        - name: includeFacets
          in: query
          description: اگر true باشد facets (تعداد هر دسته/رنگ و بازه‌ی قیمت) هم در پاسخ می‌آید.
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductListResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
  /products/facets:
    get:
      tags: [Catalog]
      operationId: getProductFacets
      summary: "شمارش‌های فیلتر (تعداد هر دسته و رنگ) و کمترین/بیشترین قیمت فعلی"
      description: |
        بازه‌ی قیمت پویاست: ارزان‌ترین و گران‌ترین محصول فعلی، گرد شده با `step` (۱۰٬۰۰۰ تومان).
        هر facet با در نظر گرفتن سایر فیلترهای اعمال‌شده (به جز خودش) شمرده می‌شود (disjunctive faceting).
      parameters:
        - $ref: '#/components/parameters/SearchQuery'
        - $ref: '#/components/parameters/CategoryFilter'
        - $ref: '#/components/parameters/ColorFilter'
        - $ref: '#/components/parameters/MinPrice'
        - $ref: '#/components/parameters/MaxPrice'
        - $ref: '#/components/parameters/OnSale'
        - $ref: '#/components/parameters/InStock'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductFacets' }

        '400': { $ref: '#/components/responses/ValidationError' }
  # ================================================================
  #  PRODUCT
  # ================================================================
  /products/{idOrSlug}:
    get:
      tags: [Product]
      operationId: getProduct
      summary: "جزئیات کامل محصول (گالری هر رنگ، ویدیو، قیمت، موجودی، مشخصات، امتیاز، SEO)"
      description: |
        `idOrSlug` می‌تواند `1`، `KV-1001` (کد محصول) یا `mahak-shoulder-bag` باشد.
        تشخیص بی‌ابهام است: فقط رقم ← id؛ با حروف بزرگ (`KV-...`) ← کد محصول؛ در غیر این صورت ← slug
        (slug همیشه حروف کوچک است و حداقل یک حرف دارد).
        اگر با id/sku صدا زده شود، `seo.canonicalUrl` آدرس slug را برمی‌گرداند.
        پارامتر `color` فقط `selectedColorKey` را تعیین می‌کند (برای لینک‌هایی مثل `product?id=2&color=olive`).
        در صورت ورود کاربر: `isWishlisted` و `stockAlert.subscribed` پر می‌شوند.
      security: [{}, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ProductIdOrSlug'
        - name: color
          in: query
          schema: { $ref: '#/components/schemas/ColorKey' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductDetail' }
        '301':
          description: slug تغییر کرده؛ هدر `Location` به آدرس جدید اشاره می‌کند
        '404': { $ref: '#/components/responses/NotFound' }
        '400': { $ref: '#/components/responses/ValidationError' }
  /products/{productId}/related:
    get:
      tags: [Product]
      operationId: getRelatedProducts
      summary: "محصولات مشابه (اول هم‌دسته، بعد پرفروش‌ترین‌ها)"
      security: [{}, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ProductId'
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 24, default: 8 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ProductSummary' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
  /products/{productId}/stock-alerts:
    post:
      tags: [Product]
      operationId: createStockAlert
      summary: "«موجود شد خبرم کن» — اشتراک پیامک موجود شدن (نیازمند ورود)"
      description: |
        فقط با ورود؛ پیامک به موبایل **حساب** می‌رود (موقع فرستادن خوانده می‌شود)، شماره‌ی دیگری پذیرفته نمی‌شود. محصول منتشرشده لازم است (`404 PRODUCT_NOT_FOUND`).
        `variantId` اختیاری: اگر هست باید رنگ فعال همین محصول باشد (`400 VARIANT_NOT_FOUND` روی `variantId`) و موجود نباشد (`422 PRODUCT_IN_STOCK`)؛
        اگر نیاید، با موجود شدن **هر** رنگی خبر می‌دهیم و اگر همین الان یک رنگ فعال موجود است ← `422 PRODUCT_IN_STOCK` با `meta.inStockColorKeys`.
        یک اشتراک `ACTIVE` برای هر (محصول، رنگ یا «هر رنگی») ← `409 STOCK_ALERT_EXISTS`؛ «هر رنگی» و «رنگ خاص» با هم مجازند؛ بعد از `NOTIFIED` یا `CANCELLED`
        اشتراک تازه مجاز است. حداکثر ۳۰ اشتراک `ACTIVE` (`422 STOCK_ALERT_LIMIT_REACHED` با `meta.limit`) و ۱۰ ثبت در ساعت (`429 RATE_LIMITED` با `Retry-After`).
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ProductId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateStockAlertRequest' }
      responses:
        '201':
          description: ثبت شد
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StockAlert' }
        '409':
          description: "`STOCK_ALERT_EXISTS`"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: "`PRODUCT_IN_STOCK` — رنگ (یا برای «هر رنگی» یکی از رنگ‌ها) همین الان موجود است؛ `STOCK_ALERT_LIMIT_REACHED` — ۳۰ اشتراک فعال"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /products/{productId}/inquiry:
    get:
      tags: [Product]
      operationId: getProductInquiryLinks
      summary: "«سؤال داری؟ عکس یا ویدیوی بیشتر بخواه» — لینک پیام‌رسان‌ها با متن آماده"
      description: |
        متن پیام شامل نام محصول، رنگ انتخابی و کد محصول (KV-1001) است و در `url` هر کانال (`?text=`، یا `&text=` وقتی آدرس کانال خودش `?` دارد،
        متن با UTF-8 کدشده و فاصله `%20`) قرار می‌گیرد. ساخت لینک در سرور انجام می‌شود تا تغییر آیدی‌ها یا متن نیاز به انتشار فرانت نداشته باشد.
        محصول منتشرشده لازم است (`404`). `color` اختیاری؛ اگر هست باید رنگ فعال همین محصول باشد (`400 COLOR_NOT_FOUND` روی `color`)؛ نیاید ← رنگ پیش‌فرض.
        `channels` فقط روبیکا، تلگرام و بله، به ترتیب تنظیمات (اینستاگرام متن آماده نمی‌گیرد). پیش‌پر شدن متن دست پیام‌رسان است، پس فرانت `prefilledText`
        را برای کپی هم نشان می‌دهد. کش نمی‌شود.
      parameters:
        - $ref: '#/components/parameters/ProductId'
        - name: color
          in: query
          schema: { $ref: '#/components/schemas/ColorKey' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductInquiry' }

        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
  # ================================================================
  #  REVIEWS
  # ================================================================
  /products/{productId}/reviews:
    get:
      tags: [Reviews]
      operationId: listProductReviews
      summary: "نظرات تأییدشده‌ی محصول + خلاصه‌ی امتیاز (میانگین و توزیع ستاره‌ها)"
      description: |
        فقط نظرهای `APPROVED`، برای محصول منتشرشده (وگرنه `404 PRODUCT_NOT_FOUND`). اگر کاربر وارد شده باشد، نظرهای `PENDING` ِ خودش برای همین محصول
        با `isMine = true` **فقط در صفحه‌ی ۱ و اول لیست** می‌آیند: بیرون از فیلترها و بیرون از `meta` (شمرده نمی‌شوند). نظر `REJECTED` ِ خودش فقط در «نظرات من».
        `isMine` برای نظر تأییدشده‌ی خودش هم `true` است.

        ترتیب‌ها: `newest` زمان ثبت نزولی؛ `highest` امتیاز نزولی، بعد تازه‌ترین؛ `lowest` امتیاز صعودی، بعد تازه‌ترین؛ `helpful` `helpfulCount` نزولی،
        بعد تازه‌ترین؛ در همه آخرین کلید شناسه‌ی نظر نزولی (صفحه‌بندی پایدار). `summary` همیشه روی **همه‌ی** نظرهای تأییدشده است، مستقل از فیلترها.
        ورود اختیاری است، ولی توکن نامعتبر یا منقضی `401` است (نه مهمان).
      security: [{}, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ProductId'
        - name: sort
          in: query
          schema: { type: string, enum: [newest, highest, lowest, helpful], default: newest }
        - name: rating
          in: query
          description: فیلتر بر اساس ستاره
          schema: { type: integer, minimum: 1, maximum: 5 }
        - name: withMedia
          in: query
          schema: { type: boolean }
        - name: verifiedOnly
          in: query
          schema: { type: boolean }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewListResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Reviews]
      operationId: createProductReview
      summary: "ثبت نظر (نیازمند ورود) — بعد از تأیید ادمین نمایش داده می‌شود"
      description: |
        هر کاربر واردشده، برای محصول منتشرشده (وگرنه `404 PRODUCT_NOT_FOUND`)؛ خرید شرط نیست. ترتیب قانون‌ها: شکل (همه‌ی خطاها با هم، `400`)؛
        محصول؛ نظر «زنده» (`PENDING` یا `APPROVED`) ِ همین کاربر برای همین محصول ← `409 REVIEW_ALREADY_EXISTS` (بعد از `REJECTED` نظر تازه مجاز است)؛
        بیشتر از ۵ نظر در ۲۴ ساعت گذشته ← `429 RATE_LIMITED` با `Retry-After`؛ مدیا (پرچم `reviewMedia` خاموش و `mediaIds` ناخالی ← `400 REVIEW_MEDIA_DISABLED`
        روی `mediaIds`؛ هر کدام فقط `REVIEW_PHOTO` ِ خود کاربر، وگرنه `400 MEDIA_NOT_FOUND` روی `mediaIds.{i}`)؛ وصل خرید (`CreateReviewRequest`).
        همیشه `PENDING`؛ بعد از تأیید پشتیبانی دیده می‌شود. پیامکی نمی‌رود.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ProductId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateReviewRequest' }
      responses:
        '201':
          description: ثبت شد (status = PENDING)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Review' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: "`REVIEW_ALREADY_EXISTS` — کاربر برای این محصول نظر «زنده» (`PENDING` یا `APPROVED`) دارد"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: "`REVIEW_PURCHASE_NOT_DELIVERED` — سفارشی که نظر به آن وصل شده هنوز تحویل نشده یا لغو شده"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '404':
          description: "`PRODUCT_NOT_FOUND`، یا `ORDER_NOT_FOUND` (سفارش ِ `orderCode` نیست یا مال کاربر دیگری است)"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /products/{productId}/reviews/summary:
    get:
      tags: [Reviews]
      operationId: getReviewSummary
      summary: "فقط خلاصه‌ی امتیاز (برای meta-row بالای صفحه)"
      description: همان `summary` ِ `GET /products/{productId}/reviews`؛ محصول منتشرنشده ← `404`. کش نمی‌شود (با هر تأیید عوض می‌شود).
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RatingSummary' }
        '404': { $ref: '#/components/responses/NotFound' }
  /reviews/{reviewId}/helpful:
    put:
      tags: [Reviews]
      operationId: voteReviewHelpful
      summary: "رأی «این نظر مفید بود» [پیشنهادی]"
      description: |
        `helpful: true` = رأی می‌دهم، `false` = رأیم را پس می‌گیرم («مفید نبود» شمرده نمی‌شود). تکرار بی‌اثر است. فقط روی نظر `APPROVED`
        (وگرنه `404 REVIEW_NOT_FOUND`)؛ روی نظر خودش ← `422 OWN_REVIEW_VOTE`. `myVote` بعد از کار `true` یا `null` (هیچ‌وقت `false`).
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ReviewId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [helpful]
              properties:
                helpful: { type: boolean }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  helpfulCount: { type: integer, example: 12 }
                  myVote: { type: boolean, nullable: true, description: '`true` یا `null`' }
                required: [helpfulCount, myVote]
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: "`OWN_REVIEW_VOTE` — رأی به نظر خود"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  # ================================================================
  #  SEARCH
  # ================================================================
  /search/suggest:
    get:
      tags: [Search]
      operationId: searchSuggest
      summary: "جستجوی زنده‌ی هدر (حداکثر `limit` محصول، پیش‌فرض ۸، + دسته‌ها و رنگ‌های منطبق)"
      description: |
        * `q` اول نرمال می‌شود (ارقام فارسی و عربی ← لاتین، `ي`/`ى` ← `ی`، `ك` ← `ک`، نیم‌فاصله ← فاصله، فاصله‌های پشت‌سرهم ← یکی، trim)، بعد طولش چک
          می‌شود: خالی (فاصله یا نیم‌فاصله‌ی تنها هم) ← `400 SEARCH_QUERY_EMPTY` روی `q`؛ بیشتر از ۱۰۰ ← `400 SEARCH_QUERY_TOO_LONG`. `limit` ۱ تا ۲۰ (`400 LIMIT_INVALID`).
        * حداکثر ۶ کلمه‌ی اول؛ **همه‌ی کلمه‌ها** باید جایی در نام محصول، نام دسته، نام رنگ‌های فعال، متریال یا کد محصول باشند (AND، «شامل»؛ همان قانون
          `GET /products?q=`). فقط محصولات منتشرشده، ناموجودها هم ولی بعد از موجودها.
        * ترتیب: اول محصولاتی که همه‌ی کلمه‌ها در **نام**شان است، بعد موجودها، بعد پرفروش‌تر، بعد شناسه‌ی بزرگ‌تر. `totalProducts` همه‌ی منطبق‌هاست (نه فقط این تعداد)
          و با `meta.totalItems` ِ `GET /products?q=` ِ همان عبارت یکی است.
        * `matchedColorKey`: بلندترین نام رنگ پالت که به‌صورت کلمه‌ی کامل در عبارت است (مثلاً «مشکی» در «کراس مشکی»)؛ اگر محصول آن رنگ را فعال دارد، تصویر و
          `url` با همان رنگ، وگرنه `null` و رنگ پیش‌فرض.
        * `nameHighlighted`: نام همان‌طور که ذخیره شده، HTML-escaped، با `<mark>` دور هر جایی که یکی از کلمه‌ها پیدا شد (بازه‌های هم‌پوشان یکی می‌شوند)؛ هیچ تگ دیگری.
        * `categories`: دسته‌های منو با حداقل یک محصول منتشرشده که نامشان حداقل یکی از کلمه‌های دو حرفی یا بیشتر را دارد، به ترتیب منو، حداکثر ۴.
          `colors`: رنگ‌هایی که حداقل یک محصول منتشرشده دارند و نامشان یکی از کلمه‌ها را دارد، حداکثر ۴.
        * `seeAllUrl` = `/products?q=` + عبارت نرمال‌شده (UTF-8، فاصله `%20`). ورود اختیاری است و اثری ندارد (توکن نامعتبر `401`). کش نمی‌شود؛ فرانت حداقل ۲۵۰ میلی‌ثانیه debounce کند.
      security: [{}, { bearerAuth: [] }]
      parameters:
        - name: q
          in: query
          required: true
          description: 'طول بعد از نرمال‌سازی چک می‌شود (۱ تا ۱۰۰)'
          schema: { type: string, example: کراس مشکی }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 20, default: 8 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchSuggestResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
  /search/hints:
    get:
      tags: [Search]
      operationId: getSearchHints
      summary: "پیشنهادهای اولیه‌ی پنل جستجو (دسته‌ها، رنگ‌ها، جستجوهای پیشنهادی)"
      description: |
        `categories`: دسته‌های منو با حداقل یک محصول منتشرشده، به ترتیب منو، حداکثر ۸. `colors`: رنگ‌هایی که حداقل یک محصول منتشرشده با آن رنگ ِ فعال هست،
        به ترتیب پالت، حداکثر ۱۲. `popularQueries`: **لیست دستی** محتوای سایت (لاگ جستجو نگه داشته نمی‌شود)، حداکثر ۸.
        با `ETag` و `Cache-Control: public, max-age=300` کش می‌شود؛ `If-None-Match` برابر ← `304`.
      responses:
        '200':
          description: OK
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchHints' }
        '304':
          description: تغییری نکرده (`If-None-Match` همان `ETag` فعلی است)؛ بدون بدنه

  # ================================================================
  #  CART
  # ================================================================
  /cart:
    get:
      tags: [Cart]
      operationId: getCart
      summary: "سبد خرید جاری (مهمان با X-Cart-Token یا کاربر با Bearer)"
      description: |
        پاسخ همه‌ی محاسبات را آماده دارد: جمع‌ها، تخفیف‌ها، هزینه‌ی هر روش ارسال، نوار پیشرفت ارسال رایگان،
        مبلغ صرفه‌جویی، وضعیت رزرو و `issues` (تغییر قیمت/ناموجود شدن از آخرین بازدید).

        **کدام سبد:** با Bearer معتبر، سبد کاربر (`X-Cart-Token` نادیده گرفته می‌شود). بدون Bearer، سبد مهمانِ همان `X-Cart-Token`.
        سبد مهمان تازه **فقط** وقتی ساخته می‌شود که توکن نیامده باشد یا ناشناخته یا بدشکل باشد؛ توکن تازه در هدر `X-Cart-Token` برمی‌گردد.
        Bearer منقضی یا نامعتبر `401` می‌گیرد و هرگز مهمان حساب نمی‌شود. همین قاعده برای همه‌ی endpointهای سبد است.

        **همگام‌سازی:** هر خواندن سبد، ردیف‌ها را با قیمت و موجودی فعلی فروشگاه مقایسه می‌کند. تعداد بیشتر از سقف کم می‌شود (وقتی سقف خرید محصول بین رنگ‌هایش
        کم بیاید، ردیف قدیمی‌تر سهمش را نگه می‌دارد و ردیفی که جایی برایش نماند حذف می‌شود)، روش ارسال غیرفعال‌شده
        به روش پیش‌فرض برمی‌گردد، و `issues` همه‌ی این تغییرها را می‌گوید. هر issue فقط **یک بار** برمی‌گردد، چون همین خواندن «دیده شد» را ثبت می‌کند.

        این endpoint را فقط از مرورگر صدا بزنید، نه از رندر سمت سرور (SSR)؛ وگرنه هر بازدید یک سبد خالی مهمان می‌سازد.
      security: [{}, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/CartToken'
      responses:
        '200':
          description: OK
          headers:
            X-Cart-Token: { $ref: '#/components/headers/XCartToken' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
    delete:
      tags: [Cart]
      operationId: clearCart
      summary: "خالی کردن سبد"
      description: ردیف‌ها، کد تخفیف و سوییچ رزرو پاک می‌شوند؛ روش ارسال انتخاب‌شده می‌ماند.
      security: [{}, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/CartToken'
      responses:
        '200':
          description: سبد خالی
          headers:
            X-Cart-Token: { $ref: '#/components/headers/XCartToken' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
  /cart/items:
    post:
      tags: [Cart]
      operationId: addCartItem
      summary: "افزودن به سبد (اگر همان ورینت/رنگ موجود باشد تعداد جمع می‌شود)"
      description: |
        تعداد نهایی هر ردیف حداکثر `maxQuantity` آن است: min(موجودی آن رنگ، `maxPerOrder` − تعداد بقیه‌ی رنگ‌های همان محصول در سبد).
        اگر درخواست بیشتر باشد به سقف کاهش داده می‌شود و `Cart.issues` شامل `QUANTITY_REDUCED` خواهد بود (کلاینت تُست «حداکثر موجودی: n عدد» را نشان می‌دهد).
        برای «افزودن سریع» از کارت محصول، `variantId` رنگِ فعال روی کارت ارسال می‌شود.
      security: [{}, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/CartToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddCartItemRequest' }
      responses:
        '200':
          description: سبد به‌روز شد
          headers:
            X-Cart-Token: { $ref: '#/components/headers/XCartToken' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CartMutationResponse' }
        '404':
          description: "`VARIANT_NOT_FOUND` — رنگی با این شناسه نیست"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: |
            `OUT_OF_STOCK` این رنگ موجودی ندارد ·
            `PRODUCT_UNAVAILABLE` محصول یا این رنگش در فروشگاه نیست ·
            `QUANTITY_EXCEEDS_LIMIT` سقف خرید این محصول را رنگ‌های دیگرش در سبد پر کرده‌اند، با وجود موجودی (`meta.maxPerOrder`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '400': { $ref: '#/components/responses/ValidationError' }
  /cart/items/{itemId}:
    patch:
      tags: [Cart]
      operationId: updateCartItem
      summary: "تغییر تعداد یا رنگ یک ردیف سبد"
      description: |
        حداقل یکی از `quantity` و `variantId` لازم است؛ وگرنه `400` روی `quantity` (`QUANTITY_OR_VARIANT_REQUIRED`). با هر دو، اول رنگ و بعد تعداد روی ردیفی که می‌ماند.
        `itemId` بدشکل مثل ردیفی که در این سبد نیست `404 CART_ITEM_NOT_FOUND` می‌گیرد.

        **تعداد:** برخلاف افزودن، کم نمی‌شود و رد می‌شود: بیشتر از موجودی رنگ ← `QUANTITY_EXCEEDS_STOCK`؛ در موجودی جا می‌شود ولی از سقف خرید محصول
        (با حساب بقیه‌ی رنگ‌هایش در سبد) بیشتر است ← `QUANTITY_EXCEEDS_LIMIT`.

        **رنگ** [پیشنهادی]: رنگ تازه باید مال همان محصول باشد، وگرنه `400` روی `variantId` (`VARIANT_ID_INVALID`). اگر رنگ تازه از قبل ردیف دارد، دو ردیف **یکی** می‌شوند
        (تعدادها جمع، تا سقف؛ بیشتر از سقف با `QUANTITY_REDUCED` کم می‌شود) و `affectedItemId` شناسه‌ی ردیفی است که می‌ماند.
      security: [{}, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/CartToken'
        - $ref: '#/components/parameters/CartItemId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateCartItemRequest' }
      responses:
        '200':
          description: OK
          headers:
            X-Cart-Token: { $ref: '#/components/headers/XCartToken' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CartMutationResponse' }
        '404':
          description: "`CART_ITEM_NOT_FOUND` — این ردیف در این سبد نیست"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: |
            `QUANTITY_EXCEEDS_STOCK` (`meta.availableQuantity` = همان `maxQuantity` ردیف؛ موجودی دقیق لو نمی‌رود) ·
            `QUANTITY_EXCEEDS_LIMIT` (`meta.maxQuantity`) ·
            `OUT_OF_STOCK` رنگ تازه موجودی ندارد ·
            `PRODUCT_UNAVAILABLE` محصول یا رنگ تازه در فروشگاه نیست
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '400': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Cart]
      operationId: removeCartItem
      summary: "حذف ردیف از سبد"
      description: کلاینت برای «برگردون» (undo) کافی است همان `variantId` و `quantity` را دوباره POST کند؛ این دو در `removedItem` برگردانده می‌شوند.
      security: [{}, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/CartToken'
        - $ref: '#/components/parameters/CartItemId'
      responses:
        '200':
          description: OK
          headers:
            X-Cart-Token: { $ref: '#/components/headers/XCartToken' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CartMutationResponse' }
        '404':
          description: "`CART_ITEM_NOT_FOUND` — این ردیف در این سبد نیست"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /cart/items/{itemId}/move-to-wishlist:
    post:
      tags: [Cart]
      operationId: moveCartItemToWishlist
      summary: "انتقال از سبد به علاقه‌مندی‌ها (نیازمند ورود)"
      description: |
        فقط سبد خود کاربر (نه سبد مهمان). یک تراکنش: قلم از سبد می‌رود و محصول با **رنگ همان قلم** به علاقه‌مندی می‌رود (اگر از قبل در لیست است فقط
        رنگش عوض می‌شود؛ `priceAtAdd` و `addedAt` از اولین بار). لیست پر (۲۰۰) و محصول در آن نیست ← `422 WISHLIST_LIMIT_REACHED` و **هیچ‌چیز عوض
        نمی‌شود** (قلم در سبد می‌ماند). `removedItem` همان قلمِ رفته است: دکمه‌ی «برگردون» با `POST /cart/items` ِ معمولی برش می‌گرداند و به علاقه‌مندی
        دست نمی‌زند.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/CartItemId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CartMutationResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: "`CART_ITEM_NOT_FOUND` — این ردیف در سبد این کاربر نیست"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: "`WISHLIST_LIMIT_REACHED` (`meta.limit = 200`) — سبد عوض نشد"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /cart/shipping-method:
    put:
      tags: [Cart]
      operationId: setCartShippingMethod
      summary: "انتخاب روش ارسال (تیپاکس / پست)"
      security: [{}, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/CartToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [method]
              properties:
                method: { $ref: '#/components/schemas/ShippingMethodCode' }
      responses:
        '200':
          description: OK
          headers:
            X-Cart-Token: { $ref: '#/components/headers/XCartToken' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '422':
          description: "`SHIPPING_METHOD_UNAVAILABLE` — این روش غیرفعال است، یا سبد به رزرو فعال می‌پیوندد و فقط روش ارسال گروه مجاز است"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '400': { $ref: '#/components/responses/ValidationError' }
  /cart/reservation:
    put:
      tags: [Cart]
      operationId: setCartReservation
      summary: "فعال/غیرفعال کردن رزرو ۴ روزه"
      description: |
        فقط وقتی `cart.reservation.available = true` است می‌توان رزرو را فعال کرد (دلیل در دسترس نبودن در `unavailableReason`).
        غیرفعال کردن همیشه مجاز است.
      security: [{}, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/CartToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean, example: true }
      responses:
        '200':
          description: OK
          headers:
            X-Cart-Token: { $ref: '#/components/headers/XCartToken' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '422':
          description: "`RESERVATION_UNAVAILABLE` — رزرو برای این سبد در دسترس نیست (`meta.reason` = همان `unavailableReason`)"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '400': { $ref: '#/components/responses/ValidationError' }
  /cart/discount-code:
    post:
      tags: [Cart]
      operationId: applyDiscountCode
      summary: "اعمال کد تخفیف"
      description: |
        کد trim، ارقامش لاتین و حروفش بزرگ می‌شود (`kiva10 ` و `KIVA۱۰` هر دو `KIVA10`) و جای کد قبلی سبد را می‌گیرد. سبد اول همگام‌سازی می‌شود.
        کد خالی ← `400` روی `code` (`DISCOUNT_CODE_REQUIRED`)؛ متنی که هیچ کدی نمی‌تواند باشد ← همان `422 DISCOUNT_CODE_INVALID`.
        کدی که رد شود کد قبلی سبد را دست نمی‌زند. ترتیب `422`ها در «قوانین کسب‌وکار».
      security: [{}, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/CartToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApplyDiscountCodeRequest' }
      responses:
        '200':
          description: اعمال شد — `Cart.discount` شامل کد، برچسب و مبلغ است
          headers:
            X-Cart-Token: { $ref: '#/components/headers/XCartToken' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '422':
          description: |
            `DISCOUNT_CODE_INVALID` «این کد تخفیف معتبر نیست»،
            `DISCOUNT_MIN_SUBTOTAL_NOT_MET` «این کد برای خرید بالای ۲٬۰۰۰٬۰۰۰ تومان فعاله» (`meta.minSubtotal`)،
            `DISCOUNT_CODE_NOT_STARTED`، `DISCOUNT_CODE_EXPIRED`، `DISCOUNT_FIRST_ORDER_ONLY`، `DISCOUNT_USAGE_LIMIT_REACHED`، `DISCOUNT_LOGIN_REQUIRED`، `DISCOUNT_NOT_APPLICABLE`
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    delete:
      tags: [Cart]
      operationId: removeDiscountCode
      summary: "حذف کد تخفیف"
      description: سبد بدون کد هم `200` می‌گیرد.
      security: [{}, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/CartToken'
      responses:
        '200':
          description: OK
          headers:
            X-Cart-Token: { $ref: '#/components/headers/XCartToken' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
  /cart/merge:
    post:
      tags: [Cart]
      operationId: mergeGuestCart
      summary: "ادغام سبد مهمان در سبد کاربر (اگر در verify انجام نشده باشد)"
      description: |
        همان ادغامی که `POST /auth/otp/verify` با `guestCartToken` انجام می‌دهد:
        * هر ردیف مهمان به سبد کاربر اضافه می‌شود؛ رنگ مشترک تعدادش جمع می‌شود (در ردیف کاربر) و بیشتر از سقف با `QUANTITY_REDUCED` (در `issues`) کم می‌شود.
          رنگی که فقط مهمان داشت با همان `id` منتقل می‌شود. وقتی سقف خرید محصول کم بیاید، ردیف قدیمی‌تر (زودتر اضافه‌شده، در هر کدام از دو سبد)
          سهمش را نگه می‌دارد و ردیفی که جایی برایش نماند حذف می‌شود (`QUANTITY_REDUCED` به `0`).
        * روش ارسال و سوییچ رزرو سبد مهمان برنده‌اند (مشتری همین الان روی صفحه‌ی سبد انتخابشان کرده)، ولی فقط وقتی سبد مهمان ردیفی دارد:
          سبد مهمان خالی (که هر بازدید می‌سازد) چیزی انتخاب نکرده و روش ارسال و سوییچ رزرو کاربر سر جایشان می‌مانند. کد تخفیف: اگر کاربر کد داشت همان می‌ماند، وگرنه کد مهمان (بعد از اعتبارسنجی دوباره).
        * سبد مهمان (خالی یا نه) حذف می‌شود و توکنش دیگر کار نمی‌کند.
        * هر دو سبد مثل `GET /cart` همگام‌سازی می‌شوند، پس `issues` ِ پاسخ تغییرهای از آخرین بازدید هر دو سبد و کم شدن‌های خود ادغام را دارد (هر کدام یک بار).

        توکنی که سبدی ندارد (قبلاً ادغام شده، پاک شده، ساختگی یا بدشکل است) هیچ کاری نمی‌کند و خطا هم نمی‌دهد: `200` با سبد کاربر بدون ادغام
        (همگام‌سازی‌شده مثل `GET /cart`). پس تکرار ادغام (بعد از verify، یا از دو تب) بی‌خطر است. `400` فقط وقتی `guestCartToken` نیامده یا رشته نیست.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [guestCartToken]
              properties:
                guestCartToken: { type: string, example: 'gct_7f3a9c2e1b' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }

        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  # ================================================================
  #  CHECKOUT & PAYMENT
  # ================================================================
  /checkout:
    get:
      tags: [Checkout & Payment]
      operationId: getCheckoutContext
      summary: "همه‌ی داده‌ی صفحه‌ی تکمیل خرید در یک درخواست"
      description: |
        شامل سبد (با جمع‌ها)، آدرس‌های ذخیره‌شده و آدرس پیش‌فرض، پیام‌رسان پیش‌فرض و شماره‌ی آخرین استفاده‌شده،
        گزینه‌های ارسال با قیمت محاسبه‌شده، وضعیت رزرو (تاریخ ارسال بعد از ۴ روز)، درگاه‌های فعال،
        و اگر کاربر رزرو فعال داشته باشد پیشنهاد **پیوستن به سفارش رزروی** (`consolidation`).
        سبد مثل `GET /cart` همگام‌سازی می‌شود، پس `cart.issues` تغییرهای از آخرین بازدید را دارد (هر کدام یک بار).
        `shippingOptions`، `reservation` و `consolidation` ِ بالای پاسخ همان‌های `cart` اند.
        اگر سبد هیچ ردیفی نداشته باشد `422 CART_EMPTY`. ردیفی که قابل خرید نیست (`purchasable = false`) هم ردیف است: صفحه نشانش می‌دهد و `POST /orders` ردش می‌کند.
        ترتیب خطاها مثل `POST /orders`: اول `CART_EMPTY`، بعد `addressId`.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: addressId
          in: query
          description: |
            برای محاسبه‌ی مجدد (مثلاً امکان ادغام با رزرو فقط برای همان آدرس است). نیامده = آدرس پیش‌فرض.
            آدرسی که مال این کاربر نیست، وجود ندارد یا عدد نیست `400` روی فیلد `addressId` با کد `ADDRESS_NOT_FOUND` می‌گیرد (هر سه یکی، تا معلوم نشود آدرس کس دیگری وجود دارد).
          schema: { type: integer }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckoutContext' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422':
          description: "`CART_EMPTY`"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '400': { $ref: '#/components/responses/ValidationError' }
  /orders:
    post:
      tags: [Checkout & Payment]
      operationId: placeOrder
      summary: "ثبت سفارش و دریافت لینک درگاه پرداخت"
      description: |
        قیمت‌ها و همه‌ی مبلغ‌ها را سرور حساب می‌کند. `expectedPayable` فقط برای مقایسه است و هیچ عددی که کلاینت می‌فرستد پول جابه‌جا نمی‌کند.

        **اول، شکل ورودی** (`400 VALIDATION_ERROR`، همه‌ی خطاها با هم): هدر `Idempotency-Key`، دقیقاً یکی از `addressId` و `newAddress`
        (خطاهای `newAddress` با پیشوند `newAddress.` در `errors[].field`، مثل `newAddress.postalCode`)، مقدار enumها، طول یادداشت‌ها، و `expectedPayable ≥ 0`.
        کدهای فیلد: هیچ آدرسی ← `addressId` با `ADDRESS_REQUIRED`، هر دو ← `addressId` با `ADDRESS_AMBIGUOUS`؛ `shippingMethod` یا `paymentGateway` نیامده ←
        `SHIPPING_METHOD_REQUIRED` و `PAYMENT_GATEWAY_REQUIRED`؛ `preShipmentMessenger.channel` بیرون از فهرست ← `MESSENGER_CHANNEL_INVALID`؛
        `expectedPayable` منفی ← `MONEY_NEGATIVE`؛ `gift.message` و `customerNote` و `preShipmentMessenger.username`/`note` با کدهای طولشان.

        **بعد، قانون‌ها به این ترتیب** (اولین موردی که برقرار نباشد برمی‌گردد):
        1. سبد هیچ ردیفی ندارد ← `422 CART_EMPTY`
        2. `addressId` وجود ندارد یا مال کاربر دیگری است ← `422 ADDRESS_NOT_FOUND`. برای `newAddress`: استان یا شهر ناموجود ← `400` روی `newAddress.provinceId` یا
           `newAddress.cityId` (`PROVINCE_NOT_FOUND`، `CITY_NOT_FOUND`)، شهرِ استان دیگر ← `422 CITY_NOT_IN_PROVINCE`
        3. `preShipmentMessenger` نیامده یا `channel` ندارد ← `422 MESSENGER_REQUIRED`؛ شماره‌ی پیام‌رسان نیامده یا غلط است ← `422 MESSENGER_PHONE_INVALID`
        4. روش ارسال غیرفعال است (یا سفارش به رزرو فعال می‌پیوندد و روش، روش گروه نیست) ← `422 SHIPPING_METHOD_UNAVAILABLE`
        5. مبلغ قابل پرداخت بیشتر از صفر است و درگاه انتخابی در دسترس نیست ← `422 PAYMENT_GATEWAY_UNAVAILABLE` (بدون `meta.orderCode`: سفارشی ساخته نشده)
        6. `acceptTerms` نیست ← `422 TERMS_NOT_ACCEPTED`
        7. `reserve = true` ولی رزرو در دسترس نیست ← `422 RESERVATION_UNAVAILABLE` (`meta.reason`)
        8. کاربر ۳ سفارش پرداخت‌نشده دارد که هنوز موجودی نگه داشته‌اند (مهلت پرداختشان تمام نشده) ← `429 RATE_LIMITED`
        9. ردیفی از فروشگاه خارج شده ← `422 PRODUCT_UNAVAILABLE`؛ ردیفی موجودی کافی ندارد ← `422 OUT_OF_STOCK`؛ رنگ‌های یک محصول با هم بیشتر از سقف خرید آن محصول‌اند
           (سقف بعد از افزودن به سبد کم شده) ← `422 QUANTITY_EXCEEDS_LIMIT`. هر سه با `meta.itemIds` (شناسه‌ی ردیف‌های سبد)، و به همین ترتیب.
        10. کد تخفیف سبد دیگر معتبر نیست ← سفارش بدون کد حساب می‌شود (و چون مبلغ عوض شده، قدم بعد `PRICE_CHANGED` می‌دهد)
        11. `expectedPayable` با مبلغ سرور فرق دارد ← `409 PRICE_CHANGED` (`meta.payable` = مبلغ تازه)

        هر کدام از این‌ها رد شود **هیچ چیزی** ذخیره نمی‌شود: سبد سر جایش است و موجودی کنار گذاشته نشده.

        **ثبت:** موجودی ردیف‌ها تا `payment.expiresAt` (۱۵ دقیقه) کنار گذاشته می‌شود و سبد خالی می‌شود. بعد سرور جلسه‌ی پرداخت را در درگاه باز می‌کند:
        * موفق ← `201`، سفارش `PENDING_PAYMENT`، کاربر را به `payment.redirect` بفرستید.
        * درگاه جواب نداد یا رد کرد ← `422 PAYMENT_GATEWAY_UNAVAILABLE` **با** `meta.orderCode` و `meta.paymentId`. سفارش ساخته شده و موجودی‌اش کنار گذاشته شده؛
          ادامه با `POST /payments/{paymentId}/retry` (همان درگاه یا درگاه دیگر)، نه با ثبت دوباره. وجود `meta.orderCode` این حالت را از قدم ۵ جدا می‌کند.
        * مبلغ قابل پرداخت صفر (کد تخفیف کامل) ← `201` با `payment = null`؛ سفارش مستقیماً پرداخت‌شده است.

        **تکرار با همان `Idempotency-Key`:** همان سفارش و همان پرداخت برمی‌گردد، از جمله همان `422 PAYMENT_GATEWAY_UNAVAILABLE`، با وضعیت **فعلی** سفارش (شاید دیگر پرداخت شده باشد).
        تکرار هیچ‌وقت جلسه‌ی تازه‌ای در درگاه باز نمی‌کند؛ `payment.redirect` همان قبلی است. درخواستی که رد شد (۴۰۰، ۴۰۹، ۴۲۲ ِ قبل از ثبت، ۴۲۹) کلید را مصرف نمی‌کند.
        دو درخواست همزمان از یک سبد (دو تب، با دو کلید): یکی ثبت می‌شود و دیگری `422 CART_EMPTY` می‌گیرد.

        **رزرو:** اگر کاربر رزرو فعال به همین آدرس داشته باشد، سفارش بدون توجه به `reserve` به گروه رزرو می‌پیوندد (هزینه‌ی ارسال صفر) — قوانین کامل در بخش «قوانین کسب‌وکار».
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlaceOrderRequest' }
      responses:
        '201':
          description: سفارش ساخته شد؛ کاربر را به `payment.redirect` هدایت کنید
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlaceOrderResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: "`PRICE_CHANGED` (با `meta.payable`) یا `IDEMPOTENCY_KEY_REUSED` (همان کلید با بدنه‌ی دیگر)"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: |
            `CART_EMPTY`، `ADDRESS_NOT_FOUND`، `CITY_NOT_IN_PROVINCE` (`newAddress`)، `MESSENGER_REQUIRED`، `MESSENGER_PHONE_INVALID`، `SHIPPING_METHOD_UNAVAILABLE`، `TERMS_NOT_ACCEPTED`،
            `RESERVATION_UNAVAILABLE` (`meta.reason`)، `PRODUCT_UNAVAILABLE`، `OUT_OF_STOCK` و `QUANTITY_EXCEEDS_LIMIT` (`meta.itemIds`)،
            `PAYMENT_GATEWAY_UNAVAILABLE` (قبل از ثبت بدون meta؛ بعد از ثبت با `meta.orderCode` و `meta.paymentId`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429':
          description: |
            `RATE_LIMITED` — کاربر ۳ سفارش پرداخت‌نشده دارد که هنوز موجودی نگه داشته‌اند.
            `Retry-After` و `meta.retryAfterSeconds` = ثانیه‌های باقی‌مانده تا پایان مهلت پرداخت زودترین‌شان.
          headers:
            Retry-After: { $ref: '#/components/headers/RetryAfter' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /payment-callbacks/{gateway}:
    get:
      tags: [Checkout & Payment]
      operationId: paymentCallbackGet
      summary: "بازگشت از درگاه (سرور به سرور / مرورگر) — فقط برای بک‌اند"
      description: |
        پارامترهای مخصوص هر درگاه را می‌گیرد (زرین‌پال: `Authority`, `Status` — سامان: `RefNum`, `State`, `ResNum` — ملت: `RefId`, `ResCode`, `SaleOrderId`, `SaleReferenceId`)،
        تراکنش را verify می‌کند و با `302` کاربر را به `https://kiva.ir/checkout/result?paymentId=...` هدایت می‌کند.

        * تراکنش از روی شناسه‌ای که خود درگاه داده (زرین‌پال: `Authority`) پیدا می‌شود، و verify سرور به سرور با مبلغی انجام می‌شود که سرور خودش ذخیره کرده، نه با چیزی از این درخواست.
        * verify فقط وقتی انجام می‌شود که سفارش هنوز در انتظار پرداخت باشد. اگر سفارش منقضی شده یا با تلاش دیگری پرداخت شده، verify **نمی‌شود**،
          تراکنش `FAILED` می‌شود و درگاه مبلغ را خودش به کارت برمی‌گرداند.
        * **پرداخت مانده** (تلاش با `purpose = BALANCE`، بعد از درخواست تغییر): verify فقط وقتی انجام می‌شود که `balanceDue` ِ سفارش هنوز **دقیقاً همان مبلغ تلاش** باشد.
          اگر مانده صفر شده (تلاش دیگری پرداختش کرده) یا عوض شده (اپراتور دوباره تغییر داده) یا سفارش لغو شده، verify نمی‌شود و همان مسیر بالا (`FAILED`) را می‌رود.
        * اگر تلاش دیگری از **همین سفارش** همان لحظه در حال verify است، این تلاش فعلاً verify نمی‌شود و `PENDING` می‌ماند (هیچ‌وقت دو تلاش یک سفارش با هم verify نمی‌شوند).
          سرور بعداً خودش تمامش می‌کند: اگر آن تلاش موفق شد این یکی `FAILED` می‌شود و درگاه مبلغش را برمی‌گرداند، وگرنه همین یکی verify می‌شود.
        * این مسیر هیچ‌وقت JSON یا صفحه‌ی خطا نشان نمی‌دهد و **همیشه** `302` است. تراکنش پیدا نشد (یا پارامترها مال این درگاه نیست، یا درگاهی است که هنوز
          پیاده‌سازی نشده مثل `saman` و `mellat`، یا خطای داخلی پیش آمد) ← هدایت به همان صفحه‌ی نتیجه **بدون** `paymentId`؛ وضعیت سفارش در «سفارش‌های من» دیده می‌شود.
        * صدا زدن دوباره (refresh، یا GET و POST با هم) چیزی را عوض نمی‌کند و همان هدایت را تکرار می‌کند.
        * مقصد هدایت ثابت است و از تنظیمات سرور می‌آید؛ فقط `paymentId` به آن اضافه می‌شود.
      parameters:
        - $ref: '#/components/parameters/GatewayPath'
      responses:
        '302':
          description: هدایت به صفحه‌ی نتیجه‌ی فرانت
          headers:
            Location:
              schema: { type: string, example: 'https://kiva.ir/checkout/result?paymentId=pay_01J9X2' }
    post:
      tags: [Checkout & Payment]
      operationId: paymentCallbackPost
      summary: "بازگشت از درگاه با متد POST (سامان/ملت)"
      parameters:
        - $ref: '#/components/parameters/GatewayPath'
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: { type: string }
      responses:
        '302':
          description: هدایت به صفحه‌ی نتیجه‌ی فرانت
  /payments/{paymentId}:
    get:
      tags: [Checkout & Payment]
      operationId: getPaymentResult
      summary: "نتیجه‌ی پرداخت برای صفحه‌ی موفقیت (کد سفارش، مراحل بعدی) یا خطا"
      description: |
        `status = PENDING` روی صفحه‌ی نتیجه یعنی «verify در جریان است» (مثلاً درگاه دیر جواب داده). کلاینت هر ۳ ثانیه و حداکثر ۳۰ ثانیه دوباره می‌پرسد.
        اگر بعد از آن هم `PENDING` بود، سرور خودش پرداخت را با درگاه پیگیری و تمام می‌کند و نتیجه در «سفارش‌های من» دیده می‌شود.
        تراکنش کاربر دیگر `404 PAYMENT_NOT_FOUND` می‌گیرد، مثل تراکنشی که وجود ندارد، و همین‌طور شناسه‌ای که شکل `pay_…` ندارد.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/PaymentId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentResult' }
        '404':
          description: "`PAYMENT_NOT_FOUND`"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /payments/{paymentId}/retry:
    post:
      tags: [Checkout & Payment]
      operationId: retryPayment
      summary: "پرداخت مجدد سفارش پرداخت‌نشده (در صورت شکست/انصراف) — امکان تغییر درگاه"
      description: |
        یک تراکنش تازه به مبلغ `totals.payable` سفارش ساخته می‌شود؛ `gateway` نیامده (یا بدنه‌ای نیامده) = درگاه همین تراکنش. `gateway` نامعتبر ← `400` روی `gateway`.
        `expiresAt` همان پایان مهلت پرداخت سفارش است و **تمدید نمی‌شود**؛ بعد از آن `PAYMENT_EXPIRED`.
        تلاش‌های قبلی لغو نمی‌شوند: اگر تلاشی قدیمی (مثلاً در تب دیگر) اول پرداخت شود همان برنده است، و تلاش‌های بعدی verify نمی‌شوند و درگاه مبلغشان را برمی‌گرداند.
        هر سفارش حداکثر ۱۰ تلاش پرداخت دارد. تکرار با همان `Idempotency-Key` همان تراکنش را برمی‌گرداند (مثل `POST /orders`)؛ کلید مال همین نوع درخواست است،
        پس همان UUID روی `POST /me/orders/{orderCode}/payments` کلید دیگری است.

        ترتیب قانون‌ها: تراکنش مال کاربر نیست یا شناسه شکل `pay_…` ندارد (`404`) ← `ORDER_ALREADY_PAID` ← `PAYMENT_EXPIRED` ← درگاه در دسترس نیست
        (`PAYMENT_GATEWAY_UNAVAILABLE` **بدون** `meta`، تراکنشی ساخته نشد) ← ۱۰ تلاش (`429`). اگر تراکنش ساخته شد ولی درگاه جواب نداد،
        `422 PAYMENT_GATEWAY_UNAVAILABLE` **با** `meta.orderCode` و `meta.paymentId` (همان رفتار `POST /orders`)؛ ادامه با retry ِ همین `paymentId`.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/PaymentId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                gateway: { $ref: '#/components/schemas/PaymentGatewayCode' }
      responses:
        '201':
          description: تراکنش جدید
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentInit' }
        '409':
          description: "`IDEMPOTENCY_KEY_REUSED` (همان کلید با بدنه‌ی دیگر)"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: "`ORDER_ALREADY_PAID`، `PAYMENT_EXPIRED` (مهلت پرداخت تمام شده و موجودی آزاد شده یا می‌شود) یا `PAYMENT_GATEWAY_UNAVAILABLE` (درگاه انتخابی در دسترس نیست یا جواب نداد)"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429':
          description: |
            `RATE_LIMITED` — این سفارش ۱۰ تلاش پرداخت داشته است.
            `Retry-After` و `meta.retryAfterSeconds` = ثانیه‌های باقی‌مانده تا پایان مهلت پرداخت سفارش؛ بعد از آن سفارش منقضی می‌شود و با «خرید دوباره» می‌شود از نو سفارش داد.
          headers:
            Retry-After: { $ref: '#/components/headers/RetryAfter' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: "`PAYMENT_NOT_FOUND` — تراکنشی با این شناسه برای این کاربر نیست"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  # ================================================================
  #  TRACKING (public)
  # ================================================================
  /tracking/lookup:
    post:
      tags: [Tracking]
      operationId: guestTrackOrder
      summary: "پیگیری سفارش بدون ورود با شماره سفارش + موبایل"
      description: |
        به‌خاطر حریم خصوصی، شماره موبایل در بدنه‌ی POST ارسال می‌شود نه در URL.
        خروجی نسخه‌ی محدود سفارش است (بدون آدرس و قیمت‌ها؛ حداکثر ۴ عکس پیش‌نمایش).
        موبایل باید موبایل خریدار یا گیرنده باشد. در صورت عدم تطابق، برای جلوگیری از حدس زدن، همان `404 TRACKING_NOT_FOUND` برمی‌گردد.
        **فقط سفارش پرداخت‌شده** (هر وضعیتی جز `PENDING_PAYMENT`، `PAYMENT_FAILED` و `EXPIRED`). کد بدشکل، سفارش ناموجود یا پرداخت‌نشده و موبایل دیگر
        همه همان `404 TRACKING_NOT_FOUND` با بدنه‌ی یکسان‌اند؛ فقط موبایل بدشکل `400` روی `phone` است. `orderCode` با ارقام فارسی هم پذیرفته است.
        سقف: ۱۰ درخواست در ۱۰ دقیقه برای هر IP (`429`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GuestTrackingRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GuestTrackingResult' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /tracking/daily/days:
    get:
      tags: [Tracking]
      operationId: listDailyShipmentDays
      summary: "تب‌های روزهای اخیر (امروز، دیروز، ...) با تعداد مرسوله‌ی هر روز"
      description: |
        روزها از امروز (به وقت تهران) به عقب. `shipmentCount` تعداد **کدهای رهگیری** یکتای آن روز است (سفارش‌های یک گروه رزرو یک کد).
      parameters:
        - name: days
          in: query
          schema: { type: integer, minimum: 1, maximum: 30, default: 10 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DailyShipmentDay' }
        '400': { $ref: '#/components/responses/ValidationError' }
  /tracking/daily:
    get:
      tags: [Tracking]
      operationId: listDailyShipments
      summary: "کدهای رهگیری ارسال‌های یک روز (اطلاعات گیرنده ماسک‌شده)"
      description: |
        جستجو با ۴ رقم آخر موبایل، حرف اول نام یا نام شهر. نام‌ها و موبایل‌ها **همیشه ماسک‌شده** از سرور می‌آیند
        (`س*** م***`، `09** *** 4821`) و داده‌ی کامل هرگز به این endpoint عمومی نمی‌رسد.
        **یک ردیف برای هر کد رهگیری** (سفارش‌های یک گروه یک ردیف)، فقط مرسوله‌هایی که `showInDailyList` دارند، و **فقط ۳۰ روز اخیر**
        (`date` ِ قدیمی‌تر یا آینده یک لیست خالی است). `q`: چهار رقم ← چهار رقم آخر موبایل گیرنده؛ یک حرف ← حرف اول نام گیرنده؛ وگرنه شهر شامل متن.
        ترتیب: زمان ارسال، تازه‌ترین اول.
      parameters:
        - name: date
          in: query
          required: true
          schema: { type: string, format: date, example: '2026-10-05' }
        - name: q
          in: query
          schema: { type: string, maxLength: 20, example: '4821' }
        - $ref: '#/components/parameters/Page'
        - name: size
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DailyShipmentListResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }

  # ================================================================
  #  ACCOUNT / PROFILE
  # ================================================================
  /me:
    get:
      tags: [Account]
      operationId: getMe
      summary: "اطلاعات کاربر جاری"
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [Account]
      operationId: updateMe
      summary: "ویرایش اطلاعات شخصی (نام، ایمیل، تولد، جنسیت، پیام‌رسان پیش‌فرض، پیامک تخفیف)"
      description: فقط فیلدهای ارسال‌شده تغییر می‌کنند. ارسال `null` برای فیلدهای اختیاری یعنی پاک کردن.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProfileRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [Account]
      operationId: deleteMe
      summary: "حذف حساب کاربری (با OTP تأیید)"
      description: |
        کد را اول از `POST /me/deletion/request` بگیر (هدف `DELETE_ACCOUNT`؛ کد ورود این‌جا پذیرفته نمی‌شود و برعکس).
        ترتیب چک‌ها: شکل بدنه (`400`)؛ کارمند (هر نقش پنل) ← `422 STAFF_ACCOUNT_CANNOT_BE_DELETED` (اول ادمین نقش‌ها را بردارد)؛
        سفارش جاری ← `422 ACCOUNT_HAS_ACTIVE_ORDERS` با `meta.orderCodes`؛ **بعد** کد (پس کدی که به‌خاطر سفارش جاری رد شد مصرف نمی‌شود).
        «سفارش جاری»: سفارشی در `PENDING_PAYMENT`، `PAYMENT_FAILED` (هنوز پرداخت‌شدنی)، `RESERVED`، `PROCESSING`، `PHOTO_SENT`، `CHANGE_REQUESTED`، `SHIPPED`،
        `RETURN_REQUESTED` یا `RETURNED`؛ یا سفارش با مانده‌ی پرداخت‌نشده؛ یا استرداد `PENDING`/`PROCESSING`.

        با حذف:
        * حساب بی‌نام می‌شود (ردیفش برای ارجاع سفارش‌ها می‌ماند): موبایل، نام، ایمیل، تولد، جنسیت، پیام‌رسان پیش‌فرض و رضایت پیامک
          تبلیغاتی پاک، نقش‌ها فقط `CUSTOMER`. **شماره آزاد می‌شود**: ورود دوباره با همان شماره یک حساب تازه می‌سازد که به سفارش‌های قبلی ربطی ندارد.
        * سفارش‌ها برای حسابداری می‌مانند ولی بی‌نام: گیرنده، موبایل گیرنده، نشانی، پلاک، واحد، کد پستی، پیام‌رسان، یادداشت سفارش و
          پیام هدیه پاک (استان و شهر، مبلغ‌ها، ردیف‌ها، کد رهگیری و تاریخ‌ها می‌مانند). مرجوعی‌ها و استردادها (سند مالی) می‌مانند.
        * پاک: آدرس‌ها، سبد، علاقه‌مندی‌ها و لینک اشتراکش، «موجود شد خبرم کن»ها، پیام‌های فرم تماس، عضویت خبرنامه با ایمیل حساب.
        * نظرها می‌مانند با «کاربر کیوا» (`authorName` و راه تماس پاک).
        * همه‌ی نشست‌ها باطل؛ توکن دسترسی ِ همان لحظه هم دیگر کار نمی‌کند (`401`).
        * `reason` (اختیاری، حداکثر ۳۰۰) **بی هیچ شناسه‌ای** (فقط متن و تاریخ) برای فهمیدن دلیل رفتن ذخیره می‌شود.
        * رویدادهای قبلی ِ سفارش در تاریخچه‌ی داخلی (event store) عوض نمی‌شوند؛ این داده هیچ‌جا از API بیرون نمی‌رود.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [otpCode]
              properties:
                otpCode: { type: string, pattern: '^\d{5}$' }
                reason: { type: string, maxLength: 300 }
      responses:
        '204':
          description: حساب حذف شد
          headers:
            Set-Cookie: { $ref: '#/components/headers/ClearRefreshCookie' }
        '422':
          description: "`OTP_INVALID` (با `meta.attemptsLeft`)، `OTP_EXPIRED`، `OTP_TOO_MANY_ATTEMPTS`، `ACCOUNT_HAS_ACTIVE_ORDERS` (با `meta.orderCodes`) یا `STAFF_ACCOUNT_CANNOT_BE_DELETED`"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /me/deletion/request:
    post:
      tags: [Account]
      operationId: requestAccountDeletion
      summary: "ارسال کد تأیید حذف حساب به موبایل خود کاربر"
      description: |
        کد فقط برای `DELETE /me` معتبر است، نه برای ورود؛ و کد ورود هم برای حذف حساب پذیرفته نمی‌شود. همان سقف‌های کد ورود (`429`).
        **اول** مانع‌ها چک می‌شوند و اگر هست پیامکی نمی‌رود: کارمند ← `422 STAFF_ACCOUNT_CANNOT_BE_DELETED`؛ سفارش جاری
        (تعریف در `DELETE /me`) ← `422 ACCOUNT_HAS_ACTIVE_ORDERS` با `meta.orderCodes`.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: کد ارسال شد
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SendOtpResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422':
          description: "`ACCOUNT_HAS_ACTIVE_ORDERS` (با `meta.orderCodes`) یا `STAFF_ACCOUNT_CANNOT_BE_DELETED`؛ پیامکی نرفت"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /me/phone-change/request:
    post:
      tags: [Account]
      operationId: requestPhoneChange
      summary: "درخواست تغییر شماره موبایل — ارسال کد به شماره‌ی فعلی و شماره‌ی جدید [پیشنهادی]"
      description: |
        برای امنیت، مالکیت **هر دو** شماره باید ثابت شود: یک کد به شماره‌ی فعلی و یک کد به شماره‌ی جدید می‌رود.
        (اگر فقط شماره‌ی جدید چک شود، کسی که یک accessToken را دزدیده می‌تواند حساب را برای همیشه به شماره‌ی خودش ببرد.)
        کسی که به شماره‌ی فعلی‌اش دسترسی ندارد، تغییر شماره را از پشتیبانی می‌خواهد.
        اینکه شماره‌ی جدید مال حساب دیگری است، عمداً اینجا گفته نمی‌شود (فقط بعد از تأیید هر دو کد، در verify)،
        تا این endpoint راهی برای فهمیدن «این شماره در کیوا حساب دارد؟» نباشد.
        شماره‌ی تکراری: `400 VALIDATION_ERROR` با `errors[].field = newPhone` و `code = PHONE_SAME_AS_CURRENT`.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newPhone]
              properties:
                newPhone: { $ref: '#/components/schemas/PhoneNumber' }
      responses:
        '200':
          description: هر دو کد ارسال شد (با همان تایمرها)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PhoneChangeOtpResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /me/phone-change/verify:
    post:
      tags: [Account]
      operationId: verifyPhoneChange
      summary: "تأیید هر دو کد و تغییر شماره [پیشنهادی]"
      description: |
        بعد از تغییر: همه‌ی نشست‌های قبلی (همه‌ی دستگاه‌ها) باطل می‌شوند، یک نشست تازه برای همین دستگاه ساخته می‌شود
        (کوکی جدید + accessToken جدید در پاسخ)، و یک پیامک هشدار به شماره‌ی **قبلی** می‌رود.
        در `422`ها، `meta.field` می‌گوید کدام کد مشکل دارد (`currentPhoneCode` یا `newPhoneCode`).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newPhone, currentPhoneCode, newPhoneCode]
              properties:
                newPhone: { $ref: '#/components/schemas/PhoneNumber' }
                currentPhoneCode: { type: string, pattern: '^\d{5}$', description: کدی که به شماره‌ی فعلی رفت }
                newPhoneCode: { type: string, pattern: '^\d{5}$', description: کدی که به شماره‌ی جدید رفت }
      responses:
        '200':
          description: شماره عوض شد
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetRefreshCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PhoneChangeResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: "`PHONE_ALREADY_REGISTERED`: شماره‌ی جدید مال حساب دیگری است"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: "`OTP_INVALID` (با `meta.attemptsLeft` و `meta.field`)، `OTP_EXPIRED` یا `OTP_TOO_MANY_ATTEMPTS` (با `meta.field`)"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /me/dashboard:
    get:
      tags: [Account]
      operationId: getMyDashboard
      summary: "سربرگ حساب کاربری — سلام، کارت‌های آمار و شمارنده‌های منوی کناری"
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountDashboard' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ================================================================
  #  ADDRESSES
  # ================================================================
  /me/addresses:
    get:
      tags: [Addresses]
      operationId: listMyAddresses
      summary: "آدرس‌های من (آدرس پیش‌فرض اول)"
      description: آدرس پیش‌فرض اول، بعد بقیه به ترتیب ثبت (قدیمی‌ترین اول). وقتی دفترچه آدرسی دارد، دقیقاً یکی از آن‌ها پیش‌فرض است.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Address' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Addresses]
      operationId: createAddress
      summary: "افزودن آدرس جدید"
      description: |
        اولین آدرس همیشه پیش‌فرض می‌شود؛ آدرس‌های بعدی فقط با `setAsDefault: true` (و پیش‌فرض قبلی دیگر پیش‌فرض نیست).
        همه‌ی خطاهای فیلدها با هم در یک `400` می‌آیند. استان یا شهری که در فهرست نیست `400` روی همان فیلد است
        (`PROVINCE_NOT_FOUND`، `CITY_NOT_FOUND`)؛ شهر واقعیِ استانی دیگر `422 CITY_NOT_IN_PROVINCE`.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddressInput' }
      responses:
        '201':
          description: ساخته شد
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Address' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '422':
          description: "`CITY_NOT_IN_PROVINCE` یا `ADDRESS_LIMIT_REACHED` (حداکثر ۲۰ آدرس)"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me/addresses/{addressId}:
    get:
      tags: [Addresses]
      operationId: getAddress
      summary: "یک آدرس"
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/AddressId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Address' }
        '404':
          description: "`ADDRESS_NOT_FOUND` — این آدرس در دفترچه‌ی این کاربر نیست (آدرس کاربر دیگر هم همین جواب را می‌گیرد)"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [Addresses]
      operationId: updateAddress
      summary: "ویرایش آدرس"
      description: |
        همه‌ی فیلدها دوباره فرستاده می‌شوند (جایگزینی کامل). سفارش‌های قبلی تغییر نمی‌کنند چون یک snapshot از آدرس در سفارش ذخیره شده است.
        `setAsDefault: true` این آدرس را پیش‌فرض می‌کند؛ `false` هیچ‌وقت پیش‌فرض بودن را برنمی‌دارد، چون همیشه یکی باید پیش‌فرض باشد
        (پیش‌فرض فقط با پیش‌فرض کردن آدرسی دیگر عوض می‌شود).
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/AddressId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddressInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Address' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404':
          description: "`ADDRESS_NOT_FOUND` — این آدرس در دفترچه‌ی این کاربر نیست (آدرس کاربر دیگر هم همین جواب را می‌گیرد)"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: "`CITY_NOT_IN_PROVINCE`"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [Addresses]
      operationId: deleteAddress
      summary: "حذف آدرس (اگر پیش‌فرض بود، قدیمی‌ترین آدرس بعدی پیش‌فرض می‌شود)"
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/AddressId'
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '404':
          description: "`ADDRESS_NOT_FOUND` — این آدرس در دفترچه‌ی این کاربر نیست (آدرس کاربر دیگر هم همین جواب را می‌گیرد)"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me/addresses/{addressId}/default:
    post:
      tags: [Addresses]
      operationId: setDefaultAddress
      summary: "پیش‌فرض کردن آدرس"
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/AddressId'
      responses:
        '200':
          description: لیست به‌روز آدرس‌ها
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Address' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: "`ADDRESS_NOT_FOUND` — این آدرس در دفترچه‌ی این کاربر نیست (آدرس کاربر دیگر هم همین جواب را می‌گیرد)"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  # ================================================================
  #  WISHLIST
  # ================================================================
  /me/wishlist:
    get:
      tags: [Wishlist]
      operationId: getMyWishlist
      summary: "علاقه‌مندی‌ها با کارت محصول، تاریخ افزودن و افت قیمت از زمان ذخیره"
      description: |
        تازه‌ترین افزوده اول (بعد `productId`). محصولی که از سایت برداشته شده (`DRAFT`) دیده نمی‌شود و در `count` نیست، ولی ردیفش می‌ماند و با انتشار
        دوباره برمی‌گردد (و در سقف ۲۰۰ شمرده می‌شود)؛ بایگانی محصول ردیفش را پاک می‌کند. `count` و `inStockCount` روی همه‌ی قلم‌های دیده‌شده است، نه فقط این
        صفحه. هر `product.isWishlisted = true`. پرچم `wishlistShare` خاموش ← `share = null`.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Page'
        - name: size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 48 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Wishlist' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '400': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Wishlist]
      operationId: clearMyWishlist
      summary: "پاک کردن کل لیست علاقه‌مندی‌ها"
      description: لینک اشتراک دست نمی‌خورد (همان لینک، لیست خالی).
      security: [{ bearerAuth: [] }]
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me/wishlist/ids:
    get:
      tags: [Wishlist]
      operationId: getMyWishlistIds
      summary: "فقط شناسه‌ها — برای روشن کردن قلب‌ها روی کارت‌ها و بج هدر"
      description: همان ترتیب و همان قلم‌های دیده‌شده‌ی `GET /me/wishlist`، بدون صفحه‌بندی (حداکثر ۲۰۰). فقط برای کاربر واردشده.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [productIds, count]
                properties:
                  productIds:
                    type: array
                    items: { type: integer }
                    example: [3, 7, 12]
                  count: { type: integer, example: 3 }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me/wishlist/items/{productId}:
    put:
      tags: [Wishlist]
      operationId: addToWishlist
      summary: "افزودن به علاقه‌مندی‌ها (idempotent)"
      description: |
        محصول منتشرشده لازم است (وگرنه `404 PRODUCT_NOT_FOUND`). `colorKey` اختیاری؛ اگر هست باید رنگ فعال همین محصول باشد (`400 COLOR_NOT_FOUND` روی
        `colorKey`). دوباره ← `200` و فقط رنگ عوض می‌شود (`colorKey` نیامد ← دست نمی‌خورد)؛ `priceAtAdd` و `addedAt` از اولین بار. `priceAtAdd` = قیمت فروش
        همان رنگ در همان لحظه (بدون رنگ: قیمت کارت). سقف ۲۰۰ قلم: قلم تازه در لیست پر ← `422 WISHLIST_LIMIT_REACHED` با `meta.limit = 200`. بعد از ورود،
        فرانت برای هر قلب محلی مهمان یک `PUT` می‌زند (endpoint ِ ادغام نداریم).
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ProductId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                colorKey:
                  allOf: [{ $ref: '#/components/schemas/ColorKey' }]
                  description: رنگی که کاربر هنگام ذخیره می‌دید [پیشنهادی]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WishlistToggleResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '422':
          description: "`WISHLIST_LIMIT_REACHED` (`meta.limit = 200`)"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    delete:
      tags: [Wishlist]
      operationId: removeFromWishlist
      summary: "حذف از علاقه‌مندی‌ها (idempotent)"
      description: همیشه `200` با `wishlisted = false`، حتی اگر در لیست نبود (محصول برداشته‌شده هم حذف می‌شود). `404 PRODUCT_NOT_FOUND` فقط برای شناسه‌ای که هیچ‌وقت محصول نبوده.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WishlistToggleResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /me/wishlist/add-to-cart:
    post:
      tags: [Wishlist]
      operationId: addWishlistToCart
      summary: "افزودن همه‌ی موجودها به سبد (هر کدام ۱ عدد، با رنگ ذخیره‌شده یا اولین رنگ موجود)"
      description: |
        به ترتیب لیست، هر قلم ۱ عدد در یک تراکنش: رنگ ذخیره‌شده اگر فعال و موجود است، وگرنه اولین رنگ موجود به ترتیب نمایش. هیچ رنگ موجود ←
        `skipped OUT_OF_STOCK`؛ محصول منتشرنشده ← `UNAVAILABLE`؛ سبد همین الان سقف خرید محصول یا موجودی رنگ را دارد ← `ALREADY_AT_MAX` (یک ردیف برای هر
        محصول). **قلم‌ها از علاقه‌مندی پاک نمی‌شوند.** هیچ‌وقت به‌خاطر ناموجودی خطا نمی‌دهد: لیست خالی یا همه ناموجود ← `200` با `addedCount = 0`.
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                productIds:
                  type: array
                  maxItems: 200
                  description: 'نیامد یا خالی ← همه‌ی قلم‌های دیده‌شده؛ شناسه‌ای که در لیست نیست نادیده گرفته می‌شود. بیشتر از ۲۰۰ ← `400 TOO_MANY_ITEMS`'
                  items: { type: integer, minimum: 1 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WishlistAddToCartResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me/wishlist/share:
    post:
      tags: [Wishlist]
      operationId: shareMyWishlist
      summary: "ساخت لینک عمومی لیست علاقه‌مندی (برای هدیه گرفتن) [پیشنهادی]"
      description: |
        لینک فعال هست ← همان را برمی‌گرداند؛ نیست ← می‌سازد؛ هر دو `200`. توکن `wl_` + ۳۲ نویسه‌ی تصادفی (`0-9A-Za-z`). `url` از دامنه‌ی پیکربندی‌شده‌ی
        فروشگاه ساخته می‌شود. پرچم `wishlistShare` خاموش ← `422 WISHLIST_SHARE_DISABLED`.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WishlistShare' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422':
          description: "`WISHLIST_SHARE_DISABLED` — اشتراک‌گذاری لیست خاموش است"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    delete:
      tags: [Wishlist]
      operationId: revokeWishlistShare
      summary: "غیرفعال کردن لینک اشتراک [پیشنهادی]"
      description: همیشه `204`، بدون لینک هم، و با پرچم خاموش هم. لینک قبلی بلافاصله `404` می‌شود و `POST` ِ بعدی توکن تازه می‌دهد.
      security: [{ bearerAuth: [] }]
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /wishlists/shared/{token}:
    get:
      tags: [Wishlist]
      operationId: getSharedWishlist
      summary: "مشاهده‌ی لیست اشتراکی دیگران (عمومی) [پیشنهادی]"
      description: |
        داده‌ی صفحه‌ی فرانت `https://kiva.ir/wishlist/shared/{token}` (همان `WishlistShare.url`). توکن بدشکل، ناموجود، باطل‌شده یا پرچم `wishlistShare`
        خاموش ← همه یک `404 NOT_FOUND`. فقط محصولات منتشرشده (حداکثر ۲۰۰، به ترتیب لیست، `isWishlisted = null`). `ownerDisplayName` فقط اسم کوچک صاحب
        لیست، وگرنه «یکی از دوستان کیوا»؛ نه فامیلی، نه موبایل. هدر `Cache-Control: no-store`. حداکثر ۳۰ درخواست در دقیقه برای هر IP (`429`).
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string, pattern: '^wl_[0-9A-Za-z]{32}$', example: 'wl_9Kq2XzA7bC4dE1fG8hJ3kL6mN0pQ5rS2' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SharedWishlist' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ================================================================
  #  MY ORDERS
  # ================================================================
  /me/orders:
    get:
      tags: [Orders]
      operationId: listMyOrders
      summary: "سفارش‌های من (فیلتر همه / جاری / تحویل شده)"
      description: |
        تازه‌ترین سفارش اول (ترتیب دیگری ندارد)؛ پیش‌فرض ۲۰ در هر صفحه. `counts` شمارنده‌ی همه‌ی تب‌هاست، هر تبی که نمایش داده شود.
        هر وضعیت دقیقاً در یک تب است: `current` = `PENDING_PAYMENT`، `PAYMENT_FAILED`، `RESERVED`، `PROCESSING`، `PHOTO_SENT`، `CHANGE_REQUESTED`، `SHIPPED` ·
        `delivered` = `DELIVERED`، `RETURN_REQUESTED`، `RETURNED` · `cancelled` = `EXPIRED`، `CANCELLED`، `REFUNDED`.
        سفارشی که پرداخت‌نشده منقضی شد در `cancelled` است. `filter` نامعتبر ← `400` روی `filter` با `ORDER_FILTER_INVALID`.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: filter
          in: query
          schema: { type: string, enum: [all, current, delivered, cancelled], default: all }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '400': { $ref: '#/components/responses/ValidationError' }
  /me/orders/{orderCode}:
    get:
      tags: [Orders]
      operationId: getMyOrder
      summary: "جزئیات کامل سفارش (کالاها، عکس‌ها و ویدیوهای قبل از ارسال، آدرس، خلاصه پرداخت، تایم‌لاین)"
      description: |
        سفارش کاربر دیگر، سفارشی که نیست و کدی که شکل `KV-…` ندارد هر سه `404 ORDER_NOT_FOUND`.
        `payment` آخرین تلاش پرداخت سفارش است (`null` برای سفارشی که مبلغی نداشت). `items[].image` تا آپلود مدیا `null` است؛
        `items[].color` نام و hex ِ لحظه‌ی خرید را دارد و `isLight`/`sortOrder` ِ پالت فعلی را.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/OrderCode'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me/orders/{orderCode}/payments:
    post:
      tags: [Orders]
      operationId: payMyOrder
      summary: "پرداخت سفارش «در انتظار پرداخت» یا مانده‌ی پرداخت آن از حساب کاربری — امکان تغییر درگاه"
      description: |
        مثل `POST /payments/{paymentId}/retry`، ولی با کد سفارش؛ چون صفحه‌ی سفارش `paymentId` ندارد. همان ترتیب قانون‌ها و همان دو حالت `PAYMENT_GATEWAY_UNAVAILABLE`؛
        `gateway` نیامده = درگاه آخرین تلاش سفارش. کد سفارش کاربر دیگر یا کد بدشکل ← `404 ORDER_NOT_FOUND`.
        فقط وقتی مجاز است که `actions.canPay = true` باشد. یک تراکنش جدید ساخته می‌شود: برای سفارش پرداخت‌نشده به مبلغ `totals.payable`،
        و برای سفارش پرداخت‌شده‌ای که بعد از درخواست تغییر مانده‌ی پرداخت دارد به مبلغ `totals.balanceDue` ِ همین لحظه (`purpose = BALANCE`).

        **پرداخت مانده:** فقط وقتی `totals.balanceDue > 0` و سفارش `PROCESSING`، `PHOTO_SENT` یا `CHANGE_REQUESTED` است؛ سفارش پرداخت‌شده بدون مانده
        `422 ORDER_ALREADY_PAID`. مانده مهلت ندارد (موجودی از ثبت سفارش رزرو شده و سفارش تا پرداخت ارسال نمی‌شود)، پس `PaymentInit.expiresAt` پایان
        پنجره‌ی همین تلاش روی درگاه است (۲۰ دقیقه بعد)، نه مهلت سفارش. سقف ۱۰ تلاش از تلاش‌های مانده ِ همین سفارش شمرده می‌شود.
        بعد از تأیید، `balanceDue = 0` و `totals.payable` (پرداخت‌شده) به اندازه‌ی مانده بالا می‌رود؛ وضعیت سفارش عوض نمی‌شود.
        بازگشت از درگاه مثل تسویه است: `https://kiva.ir/checkout/result?paymentId=...`
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/OrderCode'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                gateway: { $ref: '#/components/schemas/PaymentGatewayCode' }
      responses:
        '201':
          description: تراکنش جدید؛ کاربر را به `redirect` هدایت کنید
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentInit' }
        '409':
          description: "`IDEMPOTENCY_KEY_REUSED` (همان کلید با بدنه‌ی دیگر)"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: "`ORDER_ALREADY_PAID` (پرداخت‌شده و بدون مانده)، `PAYMENT_EXPIRED` (موجودی آزاد شده) یا `PAYMENT_GATEWAY_UNAVAILABLE`"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429':
          description: "`RATE_LIMITED` — این سفارش ۱۰ تلاش پرداخت (یا ۱۰ تلاش پرداخت مانده) داشته است (مثل `POST /payments/{paymentId}/retry`)"
          headers:
            Retry-After: { $ref: '#/components/headers/RetryAfter' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: "`ORDER_NOT_FOUND` — سفارشی با این کد برای این کاربر نیست"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /me/orders/{orderCode}/media:
    get:
      tags: [Orders]
      operationId: listMyOrderMedia
      summary: "عکس‌ها و ویدیوهای قبل از ارسال (برای lightbox)"
      description: |
        فقط سفارش خود کاربر (وگرنه `404 ORDER_NOT_FOUND`). `items` آخرین دسته‌ی **فرستاده‌شده** است (پیش‌نویس اپراتور هیچ‌وقت نه)؛
        قبل از اولین ارسال خالی است و `waitingMessage` دارد. `capturedAt` زمان آپلود همان فایل است.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/OrderCode'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PreShipmentMedia' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /me/orders/{orderCode}/media-feedback:
    post:
      tags: [Orders]
      operationId: submitPreShipmentFeedback
      summary: "پاسخ مشتری به عکس قبل از ارسال — «همونه!» یا درخواست تغییر رنگ/مدل [پیشنهادی مبتنی بر FAQ]"
      description: |
        مطابق FAQ: «تا قبل از ارسال، می‌تونی رنگ یا مدل رو عوض کنی یا سفارش رو لغو کنی».
        `APPROVE` سفارش را برای ارسال آزاد می‌کند (بدون منتظر ماندن برای پایان مهلت پاسخ). فقط وقتی عکس فرستاده شده و هنوز جواب نگرفته
        (`preShipmentMedia.status = SENT`)؛ وگرنه `422 INVALID_STATUS_TRANSITION`. تأیید دوباره‌ی عکسی که تأیید شده `200` و بی‌اثر است.

        `REQUEST_CHANGE` وضعیت را `CHANGE_REQUESTED` (و `preShipmentMedia.status` را `CHANGE_REQUESTED`) می‌کند و اپراتور با مشتری هماهنگ می‌کند
        و درخواست را اجرا یا رد می‌کند (`POST /admin/orders/{orderCode}/change-request/resolution`)؛ اختلاف قیمت با استرداد یا `totals.balanceDue` تسویه می‌شود (بخش ۴).
        فقط وقتی سفارش `PHOTO_SENT` است و عکس `SENT` یا `APPROVED` (**بعد از تأیید هم مجاز است**)، و **یک درخواست باز در هر لحظه**؛
        وگرنه (قبل از عکس، درخواست باز، بعد از ارسال) `422 CHANGE_REQUEST_NOT_ALLOWED`. `actions.canRequestChange` همین را می‌گوید.

        **شکل درخواست** (همه‌ی خطاها با هم، `400` روی همان فیلد):

        | `changeType` | لازم | یعنی |
        |---|---|---|
        | `COLOR` | `orderItemId`، `desiredVariantId` | رنگ دیگری از **همان** محصول ِ قلم |
        | `MODEL` | `orderItemId`، `desiredVariantId` | رنگی از محصول **دیگر** |
        | `CANCEL_ITEM` | `orderItemId` | حذف قلم (تنها قلم سفارش = لغو کامل سفارش، بعد از تأیید اپراتور) |
        | `OTHER` | `note` | هر درخواست دیگری؛ اپراتور دستی انجامش می‌دهد |

        کدها: `CHANGE_TYPE_REQUIRED` / `CHANGE_TYPE_INVALID` (روی `changeType`)، `ORDER_ITEM_REQUIRED` (روی `orderItemId`)، `DESIRED_VARIANT_REQUIRED` (روی `desiredVariantId`)،
        `NOTE_REQUIRED` / `STATUS_NOTE_TOO_LONG` (روی `note`، حداکثر ۵۰۰). فیلدی که برای آن `changeType` معنی ندارد نادیده گرفته می‌شود.
        بعد از شکل، به این ترتیب: سفارش کاربر دیگر ← `404 ORDER_NOT_FOUND`؛ ورینت ناموجود ← `400 DESIRED_VARIANT_INVALID`؛ ورینت غیرفعال یا محصولش
        منتشرنشده ← `422 PRODUCT_UNAVAILABLE` (موجودی این‌جا چک نمی‌شود؛ اپراتور موقع اجرا چک می‌کند)؛ وضعیت ← `422 CHANGE_REQUEST_NOT_ALLOWED`؛
        `orderItemId` ِ ناموجود در سفارش ← `400 ORDER_ITEM_NOT_FOUND`؛ `COLOR` با رنگ محصول دیگر یا همان رنگ فعلی، یا `MODEL` با رنگی از همان محصول ← `400 DESIRED_VARIANT_INVALID`.
        پاسخ مشتری با همین فیلدها در `preShipmentMediaDetail.feedback` دیده می‌شود.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/OrderCode'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PreShipmentFeedbackRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderDetail' }
        '422':
          description: "`INVALID_STATUS_TRANSITION` — عکسی منتظر جواب نیست؛ `CHANGE_REQUEST_NOT_ALLOWED` — درخواست تغییر الان ممکن نیست؛ `PRODUCT_UNAVAILABLE` — رنگ/مدل خواسته‌شده قابل فروش نیست"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /me/orders/{orderCode}/cancel:
    post:
      tags: [Orders]
      operationId: cancelMyOrder
      summary: "لغو سفارش تا وقتی وضعیتش عوض نشده، با ثبت استرداد کامل"
      description: |
        مشتری فقط وقتی لغو می‌کند که **وضعیت سفارش هنوز عوض نشده**: `RESERVED` یا `PROCESSING`، و هیچ عکسی برایش فرستاده نشده
        (حتی اگر بعد از درخواست تغییر دوباره `PROCESSING` شده باشد). وگرنه `422 ORDER_NOT_CANCELLABLE` («وضعیت عوض شده»)؛
        بعد از عکس، لغو با درخواست تغییر یا پشتیبانی است. سفارش پرداخت‌نشده لغو نمی‌شود (خودش منقضی می‌شود). لغو دوباره هم `422 ORDER_NOT_CANCELLABLE` است.
        لغو یک استرداد `PENDING` به اندازه‌ی کل پرداخت‌شده می‌سازد (`refund`؛ برای سفارشی که چیزی پرداخت نشده `null`)،
        موجودی را آزاد و استفاده‌ی کد تخفیف را برمی‌گرداند، و پیامک «لغو شد» می‌فرستد. `note` برای `reason = OTHER` لازم است (`400 NOTE_REQUIRED`).
        اگر پرداختی همین حالا در حال تأیید است ← `422 PAYMENT_IN_PROGRESS`.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/OrderCode'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CancelOrderRequest' }
      responses:
        '200':
          description: لغو شد
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CancelOrderResponse' }
        '422':
          description: "`ORDER_NOT_CANCELLABLE` — وضعیت سفارش عوض شده (یا لغو شده)؛ `PAYMENT_IN_PROGRESS` — پرداختی در حال تأیید است"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /me/orders/{orderCode}/returns:
    post:
      tags: [Orders]
      operationId: createReturnRequest
      summary: "درخواست مرجوعی (تا ۷ روز بعد از تحویل)"
      description: |
        **ترتیب قانون‌ها:** شکل (`400`، همه با هم؛ قانون هر فیلد در `CreateReturnRequest`) ← سفارش (کد بدشکل، ناموجود یا مال کاربر دیگر ← `404 ORDER_NOT_FOUND`)
        ← عکس‌ها: هر `mediaIds.{i}` باید آپلود `RETURN_EVIDENCE` ِ **خود همین کاربر** باشد؛ ناموجود، مال کس دیگر یا آپلود‌شده برای کار دیگر
        همه همان `400 MEDIA_NOT_FOUND` روی `mediaIds.{i}` (هیچ پاسخی نشان نمی‌دهد یک `mediaId` ِ دیگر وجود دارد)
        ← قابل مرجوعی بودن سفارش: `DELIVERED` و حداقل یک قلم قابل مرجوعی، و هیچ مرجوعی ِ غیر `REJECTED` ِ دیگری
        (یک مرجوعی باز یا تمام‌شده، یا سفارش لغوشده/در راه ← `422 ORDER_NOT_RETURNABLE`) ← مهلت: `now ≤ returnableUntil`
        (گذشته ← `422 RETURN_WINDOW_EXPIRED` با `meta.returnableUntil`) ← قلم‌ها: `items.{i}.orderItemId` باید قلم همین سفارش باشد
        (`400 ORDER_ITEM_NOT_FOUND`)، قابل مرجوعی در لحظه‌ی خرید (`400 ITEM_NOT_RETURNABLE`)، و `items.{i}.quantity` حداکثر تعداد همان قلم
        (`400 RETURN_QUANTITY_EXCEEDS` با `meta.maxQuantity`) ← مدرک: برای چهار دلیل «تقصیر کیوا» (`ReturnReason`) حداقل یک `mediaIds`
        (`400 EVIDENCE_REQUIRED` روی `mediaIds`) و برای `OTHER` توضیح (`400 DESCRIPTION_REQUIRED` روی `description`).
        بعد از `REJECTED`، تا مهلت باز است، مشتری دوباره درخواست می‌دهد (مثلاً با عکس بهتر). مهلت فقط موقع درخواست چک می‌شود.
        با ثبت، سفارش `RETURN_REQUESTED` می‌شود و `shippingPaidBy` پیشنهاد دلیل است (`ReturnReason`). پیامکی نمی‌رود (مشتری خودش همین الان ثبت کرده).
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/OrderCode'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateReturnRequest' }
      responses:
        '201':
          description: ثبت شد
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReturnRequest' }
        '422':
          description: "`ORDER_NOT_RETURNABLE` یا `RETURN_WINDOW_EXPIRED`"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /me/orders/{orderCode}/reorder:
    post:
      tags: [Orders]
      operationId: reorder
      summary: "خرید دوباره — افزودن کالاهای موجود این سفارش به سبد [پیشنهادی]"
      description: |
        هر رنگ سفارش با همان تعداد، مثل `POST /cart/items` (بیشتر از سقف کم می‌شود با `QUANTITY_REDUCED`). `addedCount` تعداد کیف‌هایی است که واقعاً اضافه شد.
        `skipped`: ناموجود ← `OUT_OF_STOCK`، بیرون از فروشگاه یا حذف‌شده ← `UNAVAILABLE`، سبد همین الان سقف آن را دارد ← `ALREADY_AT_MAX`؛ `name` نام لحظه‌ی خرید است.
        هیچ‌وقت به‌خاطر ناموجودی خطا نمی‌دهد. سفارش کاربر دیگر یا کد بدشکل ← `404 ORDER_NOT_FOUND`.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/OrderCode'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WishlistAddToCartResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /me/orders/{orderCode}/invoice:
    get:
      tags: [Orders]
      operationId: downloadInvoice
      summary: "دانلود رسید خرید PDF"
      description: |
        **رسید خرید، نه فاکتور رسمی مالیاتی** (فروشگاه شناسه‌ی مالیاتی و ارزش افزوده ندارد). فقط مالک، فقط سفارشی که یک بار پرداخت شده
        (لغوشده و مرجوعی‌شده هم)؛ پرداخت‌نشده ← `422 INVOICE_NOT_AVAILABLE`؛ سفارش ناموجود یا مال دیگری ← `404 ORDER_NOT_FOUND`.
        محتوا: نام، تلفن و نشانی فروشگاه؛ شماره = کد سفارش؛ تاریخ پرداخت (شمسی، وقت تهران)؛ خریدار (نام و نشانی سفارش)؛ ردیف‌های
        **فعلی** سفارش (بعد از درخواست تغییر) با رنگ، تعداد، قیمت واحد، قیمت خط‌خورده و جمع ردیف؛ جمع‌ها مثل `OrderDetail.totals`؛
        روش ارسال و کد رهگیری اگر هست؛ برای لغوشده نوار «لغو شده». ارقام فارسی، تومان.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/OrderCode'
      responses:
        '200':
          description: فایل PDF
          headers:
            Content-Disposition:
              description: 'همیشه `attachment; filename="kiva-{orderCode}.pdf"` (CORS این هدر را expose می‌کند)'
              schema: { type: string, example: 'attachment; filename="kiva-KV-215566.pdf"' }
            Cache-Control:
              schema: { type: string, example: 'private, no-store' }
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: "`INVOICE_NOT_AVAILABLE`: سفارش هنوز پرداخت نشده"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /me/returns:
    get:
      tags: [Orders]
      operationId: listMyReturns
      summary: "درخواست‌های مرجوعی من"
      description: |
        آرایه‌ی ساده (نه `{items, meta}`): همه‌ی مرجوعی‌های کاربر، `REJECTED` ها هم، تازه‌ترین اول، حداکثر ۵۰.
        `items[].name` و `color` همان snapshot ِ قلم سفارش‌اند (نه محصول امروز).
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ReturnRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me/reservation:
    get:
      tags: [Orders]
      operationId: getMyActiveReservation
      summary: "رزرو ۴ روزه‌ی فعال (برای نوار شمارش معکوس و دکمه‌ی «افزودن محصول»)"
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReservationInfo' }
        '204':
          description: رزرو فعالی ندارد (یا مهلتش تمام شده و سفارش‌هایش در حال رفتن به `PROCESSING` اند)
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me/tracking:
    get:
      tags: [Orders]
      operationId: listMyTrackingCodes
      summary: "کدهای رهگیری من، گروه‌بندی‌شده بر اساس روز ارسال"
      description: |
        سفارش‌های ارسال‌شده‌ی خود کاربر (لغوشده نه)، گروه‌بندی‌شده بر اساس روز ارسال به وقت تهران، تازه‌ترین روز اول؛ حداکثر ۵۰ کد.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TrackingDayGroup' }

        '401': { $ref: '#/components/responses/Unauthorized' }
  # ================================================================
  #  MY REVIEWS / ALERTS / UPLOADS
  # ================================================================
  /me/reviews:
    get:
      tags: [Reviews]
      operationId: listMyReviews
      summary: "نظرات من با وضعیت (منتشر شده / در انتظار تأیید) و پاسخ ادمین"
      description: همه‌ی وضعیت‌ها (رد شده‌ها با `rejectionReason`)، تازه‌ترین اول، هر کدام با `product` (محصول بایگانی‌شده هم). `counts` روی همه‌ی نظرهای کاربر.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MyReviewListResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me/reviews/{reviewId}:
    patch:
      tags: [Reviews]
      operationId: updateMyReview
      summary: "ویرایش نظر در انتظار تأیید [پیشنهادی]"
      description: |
        فقط نظر خود (وگرنه `404 REVIEW_NOT_FOUND`) و فقط `PENDING` یا `REJECTED` (`APPROVED` ← `422 REVIEW_NOT_EDITABLE`؛ برای عوض کردنش حذف و ثبت دوباره).
        ویرایش ِ `REJECTED` آن را دوباره `PENDING` می‌کند و `rejectionReason` پاک می‌شود؛ اگر کاربر همین الان نظر زنده‌ی دیگری برای همین محصول دارد ←
        `409 REVIEW_ALREADY_EXISTS`. هر فیلد نیامده عوض نمی‌شود؛ `{}` ← `200` بی‌تغییر؛ `authorName: ""` ← «کاربر کیوا». `createdAt` عوض نمی‌شود.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ReviewId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateReviewRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Review' }
        '422':
          description: "`REVIEW_NOT_EDITABLE`"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: "`REVIEW_ALREADY_EXISTS` — ویرایش نظر ردشده وقتی نظر زنده‌ی دیگری برای همین محصول هست"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Reviews]
      operationId: deleteMyReview
      summary: "حذف نظر [پیشنهادی]"
      description: نظر خود، در هر وضعیتی (وگرنه `404 REVIEW_NOT_FOUND`)؛ نظر و رأی‌هایش پاک می‌شوند (عکس‌ها می‌مانند). نظر تأییدشده از امتیاز محصول کم می‌شود.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ReviewId'
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /me/reviews/pending-products:
    get:
      tags: [Reviews]
      operationId: listProductsAwaitingMyReview
      summary: "کالاهای خریداری‌شده‌ای که هنوز نظر نداده‌ام [پیشنهادی]"
      description: |
        ردیف‌های سفارش‌های تحویل‌شده‌ی کاربر (تحویل شده و لغو نشده) که محصولشان منتشرشده است و کاربر برایش نظر زنده (`PENDING` یا `APPROVED`) ندارد؛
        **یک ردیف برای هر محصول** (آخرین تحویل)، تازه‌ترین تحویل اول، حداکثر ۵۰. `color` از snapshot ِ ردیف.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ReviewablePurchase' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me/stock-alerts:
    get:
      tags: [Product]
      operationId: listMyStockAlerts
      summary: "اشتراک‌های «موجود شد خبرم کن» من"
      description: '`ACTIVE` ها و `NOTIFIED` های ۹۰ روز اخیر، تازه‌ترین اول، حداکثر ۱۰۰. `CANCELLED` نمی‌آید.'
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/StockAlert' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me/stock-alerts/{alertId}:
    delete:
      tags: [Product]
      operationId: deleteMyStockAlert
      summary: "لغو اشتراک موجود شدن"
      description: اشتراک `ACTIVE` ← `CANCELLED` (پاک نمی‌شود). روی اشتراک تمام‌شده‌ی خود (`NOTIFIED`/`CANCELLED`) ← `204` بی‌تغییر. مال کس دیگر یا ناموجود ← `404 STOCK_ALERT_NOT_FOUND`.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: alertId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /me/uploads:
    post:
      tags: [Uploads]
      operationId: uploadMyFile
      summary: "آپلود عکس/ویدیو (برای مرجوعی یا نظر) — خروجی mediaId"
      description: |
        همان پردازش `POST /admin/media` (نوع از روی محتوا، حذف همه‌ی metadata مثل GPS، webp در چند اندازه) با سقف‌های مشتری:
        عکس jpeg/png/webp تا ۸MB (کوتاه‌ترین ضلع حداقل ۳۲۰، حداکثر ۴۰ مگاپیکسل)، ویدیو mp4 با H.264 تا ۵۰MB و ۶۰ ثانیه
        (بیشتر ← `400 VIDEO_TOO_LONG` روی `file`). فقط `purpose` های مشتری (`RETURN_EVIDENCE`، `REVIEW_PHOTO`؛ بقیه ← `400 MEDIA_PURPOSE_INVALID`)؛ `alt` ندارد.
        **حداکثر ۲۰ آپلود در ساعت برای هر کاربر** (`429 RATE_LIMITED` با `Retry-After` و `meta.retryAfterSeconds`).
        آپلود فقط به چیزی ِ خود همین کاربر وصل می‌شود (مرجوعی، نظر)؛ آپلودی که ۴۸ ساعت به چیزی وصل نشود پاک می‌شود.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, purpose]
              properties:
                file:
                  type: string
                  format: binary
                  description: "jpg/png/webp تا ۸MB یا mp4 تا ۵۰MB"
                purpose: { type: string, enum: [RETURN_EVIDENCE, REVIEW_PHOTO] }
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaAsset' }
        '413':
          description: "`UPLOAD_TOO_LARGE`"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '415':
          description: "`UPLOAD_TYPE_NOT_ALLOWED`"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429':
          description: |
            `RATE_LIMITED` — ۲۰ آپلود در ساعت گذشته. `Retry-After` و `meta.retryAfterSeconds` = ثانیه‌های باقی‌مانده تا یک ساعت بعد از
            قدیمی‌ترین آپلود ِ همین ساعت.
          headers:
            Retry-After: { $ref: '#/components/headers/RetryAfter' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  # ================================================================
  #  BLOG
  # ================================================================
  /blog/categories:
    get:
      tags: [Blog]
      operationId: listBlogCategories
      summary: "دسته‌بندی‌های مجله (چیپ‌های بالای صفحه)"
      description: |
        همه‌ی دسته‌ها به ترتیب نمایش. `postCount` فقط مقاله‌هایی که الان در مجله دیده می‌شوند (`PUBLISHED` و رسیده به `publishedAt`)؛
        دسته‌ها با SQL ساخته می‌شوند و endpoint ِ پنل ندارند. کش ۵ دقیقه (`ETag`، `304`).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/BlogCategory' }
  /blog/posts:
    get:
      tags: [Blog]
      operationId: listBlogPosts
      summary: "لیست مقاله‌ها + مقاله‌ی منتخب سردبیر"
      description: |
        فقط مقاله‌های دیده‌شده (`PUBLISHED` با `publishedAt` ِ گذشته)، جدیدترین `publishedAt` اول (هم‌زمان‌ها: شناسه‌ی بزرگ‌تر اول).
        `category` = slug ِ دسته (ناشناخته ← لیست خالی، نه خطا). `q` (حداکثر ۱۰۰): هر کلمه باید در عنوان، خلاصه، برچسب‌ها یا اسم دسته باشد
        (نرمال‌شده: «ي» و «ی» یکی). `tag`: برابری با یکی از برچسب‌ها بعد از همان نرمال‌سازی.
        `featured` فقط در صفحه‌ی اول و وقتی با فیلتر فعلی منطبق باشد برگردانده می‌شود؛ در آن صورت از `items` **و از شمارش `meta`** حذف است.
        هیچ مقاله‌ای ← `items` خالی و `emptyMessage`. کش ۵ دقیقه (`ETag`، `304`).
      parameters:
        - name: category
          in: query
          schema: { type: string, example: style }
        - name: q
          in: query
          schema: { type: string, maxLength: 100 }
          description: 'بیشتر از ۱۰۰ ← `400 SEARCH_QUERY_TOO_LONG`'
        - name: tag
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/Page'
        - name: size
          in: query
          schema: { type: integer, minimum: 1, maximum: 30, default: 9 }
          description: 'بیرون از ۱ تا ۳۰ ← `400 PAGE_SIZE_INVALID`'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BlogPostListResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
  /blog/posts/{idOrSlug}:
    get:
      tags: [Blog]
      operationId: getBlogPost
      summary: "مقاله با بلوک‌های محتوا (تیتر، پاراگراف، نقل‌قول، نکته‌ی کیوا، محصول درون‌متنی) و فهرست مطالب"
      description: |
        `idOrSlug`: فقط رقم ← شناسه، وگرنه slug (slug همیشه حداقل یک حرف دارد). فقط مقاله‌ی `PUBLISHED` که به `publishedAt` اش رسیده؛
        پیش‌نویس، بایگانی، زمان‌بندی‌شده و ناموجود ← `404 NOT_FOUND`. بلوک `PRODUCT` ای که محصولش دیگر در فروشگاه نیست **حذف** می‌شود.
        `shareUrl` = `seo.canonicalUrl`؛ `shareLinks` پیام‌رسان‌های فروشگاه با متن «{عنوان} {shareUrl}». کارت‌های محصول بدون قلب
        (`isWishlisted = null`، پاسخ کش می‌شود). کش ۵ دقیقه (`ETag`، `304`)؛ مقاله‌ی زمان‌بندی‌شده تا ۵ دقیقه بعد از زمانش دیده می‌شود.
      parameters:
        - name: idOrSlug
          in: path
          required: true
          schema: { type: string, example: bag-by-body-shape }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BlogPostDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
  /blog/posts/{postId}/related:
    get:
      tags: [Blog]
      operationId: getRelatedBlogPosts
      summary: "مقاله‌های مرتبط (اول هم‌دسته)"
      description: |
        مقاله باید دیده شود (وگرنه `404 NOT_FOUND`). اول هم‌دسته‌ها، بعد بقیه، هر دو جدیدترین `publishedAt` اول؛ خود مقاله هرگز.
        `limit` بیرون از ۱ تا ۱۲ ← `400 NUMBER_OUT_OF_RANGE` روی `limit`. کش ۵ دقیقه.
      parameters:
        - name: postId
          in: path
          required: true
          schema: { type: integer }
        - name: limit
          in: query
          schema: { type: integer, default: 3, minimum: 1, maximum: 12 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/BlogPostSummary' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
  /blog/posts/{postId}/feedback:
    post:
      tags: [Blog]
      operationId: sendBlogFeedback
      summary: "«این مطلب مفید بود؟» آره / نه چندان"
      description: |
        مقاله باید دیده شود (وگرنه `404 NOT_FOUND`). **یک رأی برای هر کاربر واردشده، یا برای هر IP ِ مهمان**؛ رأی دوباره همان رأی را
        جایگزین می‌کند. خود IP ذخیره نمی‌شود (فقط hash ِ آن با یک راز سرور). `comment` (متن ساده، حداکثر ۳۰۰) فقط با `helpful = false`
        نگه داشته می‌شود و فقط پنل آن را می‌بیند. بیش از ۳۰ رأی در ساعت از یک IP ← `429 RATE_LIMITED`.
      security: [{}, { bearerAuth: [] }]
      parameters:
        - name: postId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [helpful]
              properties:
                helpful: { type: boolean, description: 'نیامده ← `400 FIELD_REQUIRED`' }
                comment: { type: string, maxLength: 300, description: "توضیح وقتی مفید نبود؛ با `helpful = true` نادیده" }
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ================================================================
  #  ADMIN — CATALOG   (roles: ADMIN, CATALOG_MANAGER)
  # ================================================================
  /admin/products:
    get:
      tags: [Admin · Catalog]
      x-roles: [ADMIN, CATALOG_MANAGER]
      operationId: adminListProducts
      summary: "لیست محصولات پنل (همه‌ی وضعیت‌ها، موجودی دقیق)"
      description: |
        * **`q`** (حداکثر ۱۰۰ نویسه): محصولی که اسم، دسته، اسم رنگ‌های فعال، اسم متریال یا SKU ِ آن شامل متن است، یا SKU ِ خودش یا یکی از رنگ‌هایش
          با `q` شروع می‌شود (بی‌توجه به حروف بزرگ و کوچک)، یا بارکد یکی از رنگ‌هایش دقیقاً `q` است.
        * **`totalStock`** = جمع موجودی قابل فروش (`stockOnHand − stockReserved`) رنگ‌های **فعال**. **`variantsCount`** = همه‌ی رنگ‌ها (فعال و غیرفعال).
          **`lowStockVariants`** = رنگ‌های فعالی که موجودی‌شان بیشتر از صفر و کمتر از `lowStockThreshold` است.
        * **`stockStatus`**: `OUT_OF_STOCK` = `totalStock = 0`؛ `LOW_STOCK` = `totalStock > 0` و `lowStockVariants > 0`؛ `IN_STOCK` = بقیه.
        * **`sort`**: `updated` آخرین تغییر (نزولی، پیش‌فرض)، `newest` تاریخ ساخت (نزولی)، `name` اسم (صعودی)، `price_asc`/`price_desc` قیمت رنگ پیش‌فرض،
          `bestselling` تعداد فروش (نزولی)، `stock_asc` `totalStock` (صعودی). در تساوی، شناسه‌ی بزرگ‌تر اول. ناموجودها اینجا ته لیست نمی‌روند.
        * `imageUrl` = نسخه‌ی کوچک (`thumbnailUrl`) اولین مدیای رنگ پیش‌فرض، یا `null`.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/SearchQuery'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ProductStatus' }
        - $ref: '#/components/parameters/CategoryFilter'
        - name: stockStatus
          in: query
          schema: { $ref: '#/components/schemas/StockStatus' }
        - name: sort
          in: query
          schema: { type: string, enum: [newest, updated, name, price_asc, price_desc, bestselling, stock_asc], default: updated }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminProductListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '400': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Admin · Catalog]
      x-roles: [ADMIN, CATALOG_MANAGER]
      operationId: adminCreateProduct
      summary: "ساخت محصول (می‌توان ورینت‌ها را هم‌زمان فرستاد)"
      description: |
        ترتیب بررسی: اول همه‌ی خطاهای شکل با هم (`400` با مسیر هر فیلد، مثل `variants.1.media.0.mediaId` یا `specs.straps.0.lengthCm`)؛
        رنگ تکراری در خود ورودی `409 COLOR_ALREADY_ON_PRODUCT` روی `variants.i.colorKey`. بعد: slug ِ گرفته‌شده `409 DUPLICATE_SLUG`؛
        دسته، متریال و رنگ‌های ناموجود `400` روی همان فیلد؛ مدیای ناموجود یا با `purpose` ِ دیگر `400` روی `variants.i.media.j.mediaId`؛
        SKU ِ گرفته‌شده `409 DUPLICATE_SKU`؛ و `status = ACTIVE` بدون رنگ فعال `422 NO_ACTIVE_VARIANT`.
        `stockQuantity` ِ هر رنگ موجودی اولیه است و در همان درخواست با دلیل `RESTOCK` در تاریخچه‌ی موجودی ثبت می‌شود.
        رنگی که `isActive = false` دارد اضافه و همان لحظه غیرفعال می‌شود. `status` پیش‌فرض `DRAFT` است.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductUpsertRequest' }
      responses:
        '201':
          description: ساخته شد
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminProduct' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409':
          description: '`DUPLICATE_SLUG`، `DUPLICATE_SKU` یا `COLOR_ALREADY_ON_PRODUCT` (یک رنگ دو بار در `variants`)'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: '`NO_ACTIVE_VARIANT` — `status = ACTIVE` بدون هیچ رنگ فعال'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/products/{productId}:
    get:
      tags: [Admin · Catalog]
      x-roles: [ADMIN, CATALOG_MANAGER]
      operationId: adminGetProduct
      summary: "جزئیات محصول در پنل"
      description: |
        محصول در **هر** وضعیت (پیش‌نویس و آرشیو هم). نبود یا شناسه‌ای که عدد مثبت نیست ← `404 PRODUCT_NOT_FOUND`.
        هدر `ETag` همان `etag` ِ بدنه است: `W/"{نسخه}"`، که با هر تغییر محصول یا رنگ‌هایش یک پله بالا می‌رود (تغییر موجودی نه).
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: OK
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminProduct' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [Admin · Catalog]
      x-roles: [ADMIN, CATALOG_MANAGER]
      operationId: adminUpdateProduct
      summary: "ویرایش کامل محصول"
      description: |
        **`If-Match`** (اختیاری؛ پنل همیشه می‌فرستد): `ETag` ِ نسخه‌ای که فرم از آن پر شده (`W/"12"`، `"12"` و `12` هر سه پذیرفته‌اند؛
        شکل دیگر ← `400 IF_MATCH_INVALID` روی `If-Match`). اگر با نسخه‌ی فعلی جور نباشد ← `412` با کد `CHANGED_BY_SOMEONE_ELSE`
        و `meta.currentEtag`، **قبل از** هر قانون دیگری و بدون ذخیره‌ی هیچ‌چیز. `If-Match` ِ نیامده یعنی بدون این بررسی.
        دو ذخیره در یک لحظه با یک نسخه: یکی ذخیره می‌شود و دیگری `409 CHANGED_BY_SOMEONE_ELSE` می‌گیرد.

        `slug` و `sku` بعد از ساخت عوض نمی‌شوند: مقدار دیگر ← `400 SLUG_IMMUTABLE` / `SKU_IMMUTABLE` (`sku` ِ نیامده یا خالی یعنی همان).
        `status` و `variants` در این درخواست **نادیده** گرفته می‌شوند: وضعیت با `PATCH …/status` و `DELETE`، رنگ‌ها با endpointهای ورینت.
        ذخیره‌ی بی‌تغییر `200` است و در لاگ تغییرات ردیفی ندارد. محصول آرشیوشده ← `422 PRODUCT_ARCHIVED`.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ProductId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductUpsertRequest' }
      responses:
        '200':
          description: OK
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminProduct' }
        '412':
          description: '`CHANGED_BY_SOMEONE_ELSE` — نسخه‌ی `If-Match` کهنه است (`meta.currentEtag`)؛ هیچ‌چیز ذخیره نشد. صفحه را تازه کنید.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: "`CHANGED_BY_SOMEONE_ELSE` — همزمان با این درخواست کس دیگه‌ای محصول را تغییر داد؛ هیچ‌چیز ذخیره نشد. صفحه را تازه کنید."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: '`PRODUCT_ARCHIVED`'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Admin · Catalog]
      x-roles: [ADMIN, CATALOG_MANAGER]
      operationId: adminArchiveProduct
      summary: "آرشیو محصول (حذف نرم؛ سفارش‌های قبلی سالم می‌مانند)"
      description: |
        محصولِ از قبل آرشیو هم `204` است (بدون تغییر و بدون ردیف لاگ). سفارش‌های قبلی و رزروهای باز دست نمی‌خورند؛
        ردیف این محصول در سبدها `purchasable = false` می‌شود.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/products/{productId}/status:
    patch:
      tags: [Admin · Catalog]
      x-roles: [ADMIN, CATALOG_MANAGER]
      operationId: adminSetProductStatus
      summary: "انتشار / پیش‌نویس / آرشیو"
      description: |
        | وضعیت فعلی | `status` | `publishAt` | نتیجه |
        |---|---|---|---|
        | `DRAFT` | `ACTIVE` | نیامده یا الان/گذشته | منتشر می‌شود (برنامه‌ی قبلی هم پاک). بدون رنگ فعال ← `422 NO_ACTIVE_VARIANT` |
        | `DRAFT` | `ACTIVE` | آینده | `DRAFT` می‌ماند و برای همان زمان برنامه‌ریزی می‌شود (`AdminProduct.publishAt`). بدون رنگ فعال ← `422 NO_ACTIVE_VARIANT`؛ بیشتر از ۳۶۵ روز بعد ← `400 PUBLISH_AT_TOO_FAR` |
        | `DRAFT` | `DRAFT` | نیامده | برنامه دارد ← برنامه لغو می‌شود؛ ندارد ← `422 PRODUCT_ALREADY_DRAFT` |
        | `ACTIVE` | `ACTIVE` | نیامده | `422 PRODUCT_ALREADY_ACTIVE` |
        | `ACTIVE` | `DRAFT` | نیامده | از انتشار درمی‌آید |
        | `DRAFT` یا `ACTIVE` | `ARCHIVED` | نیامده | آرشیو می‌شود |
        | `ARCHIVED` | `DRAFT` یا `ACTIVE` | — | `422 INVALID_STATUS_TRANSITION` (`meta.from`، `meta.to`) |
        | `ARCHIVED` | `ARCHIVED` | — | `422 PRODUCT_ALREADY_ARCHIVED` |
        | هر | `DRAFT` یا `ARCHIVED`، یا محصولِ `ACTIVE` | آمده | `400 PUBLISH_AT_NOT_ALLOWED` روی `publishAt` |

        محصول برنامه‌ریزی‌شده در موعد (با دقت یک دقیقه) خودکار منتشر می‌شود؛ اگر تا آن موقع رنگ فعالی نداشته باشد منتشر نمی‌شود و برنامه‌اش پاک می‌شود.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ProductId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: '#/components/schemas/ProductStatus' }
                publishAt: { type: string, format: date-time, nullable: true, description: 'انتشار زمان‌بندی‌شده؛ فقط با `status = ACTIVE` روی محصول پیش‌نویس' }
      responses:
        '200':
          description: OK
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminProduct' }
        '422':
          description: '`NO_ACTIVE_VARIANT`، `PRODUCT_ALREADY_ACTIVE`، `PRODUCT_ALREADY_DRAFT`، `PRODUCT_ALREADY_ARCHIVED` یا `INVALID_STATUS_TRANSITION`'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/products/{productId}/variants:
    post:
      tags: [Admin · Catalog]
      x-roles: [ADMIN, CATALOG_MANAGER]
      operationId: adminCreateVariant
      summary: "افزودن ورینت رنگی"
      description: |
        ترتیب: شکل (`400`) ← محصول هست (`404`) ← آرشیو نیست (`422 PRODUCT_ARCHIVED`) ← رنگ در پالت (`400 COLOR_NOT_FOUND` روی `colorKey`)
        ← رنگ از قبل روی محصول نیست، حتی غیرفعال (`409 COLOR_ALREADY_ON_PRODUCT`) ← SKU گرفته نشده (`409 DUPLICATE_SKU`) ← مدیاها.
        `stockQuantity` موجودی اولیه است (با دلیل `RESTOCK` در تاریخچه)؛ `isActive = false` یعنی اضافه و همان لحظه غیرفعال.
        پاسخ `AdminVariant` ِ همین رنگ است و هدر `ETag` نسخه‌ی تازه‌ی **محصول**.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ProductId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VariantUpsertRequest' }
      responses:
        '201':
          description: ساخته شد
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminVariant' }
        '409':
          description: '`COLOR_ALREADY_ON_PRODUCT` (این رنگ قبلاً برای محصول تعریف شده) یا `DUPLICATE_SKU`'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: '`PRODUCT_ARCHIVED`'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/products/{productId}/variants/{variantId}:
    put:
      tags: [Admin · Catalog]
      x-roles: [ADMIN, CATALOG_MANAGER]
      operationId: adminUpdateVariant
      summary: "ویرایش ورینت (قیمت اختصاصی، مدیا، وضعیت)"
      description: |
        رنگی که مال همین محصول نیست، نیست، یا شناسه‌اش عدد مثبت نیست ← `404 VARIANT_NOT_FOUND`.
        `colorKey` و `sku` عوض نمی‌شوند (`400 COLOR_KEY_IMMUTABLE` / `SKU_IMMUTABLE`؛ `sku` ِ نیامده یعنی همان). `stockQuantity` نادیده
        گرفته می‌شود: موجودی فقط با `POST /admin/inventory/adjustments` عوض می‌شود. `priceOverride: null` یعنی «قیمت خود محصول».
        `isDefault: false` پیش‌فرض بودن را برنمی‌دارد؛ برای عوض کردنش رنگ دیگری را پیش‌فرض کنید.
        ترتیب اعمال: فعال کردن، تغییر قیمت/ترتیب/پیش‌فرض/بارکد، گالری، و آخر غیرفعال کردن. پس «رنگ غیرفعال را فعال و پیش‌فرض کن» در یک درخواست کار می‌کند.
        `isDefault: true` با `isActive: false` ← `422 INACTIVE_VARIANT_CANNOT_BE_DEFAULT`؛ غیرفعال کردن آخرین رنگ فعال محصول منتشرشده ← `422 LAST_ACTIVE_VARIANT`.
        درخواست بی‌تغییر `200` است و ردیف لاگ ندارد.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ProductId'
        - $ref: '#/components/parameters/VariantId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VariantUpsertRequest' }
      responses:
        '200':
          description: OK
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminVariant' }
        '422':
          description: '`PRODUCT_ARCHIVED`، `INACTIVE_VARIANT_CANNOT_BE_DEFAULT` یا `LAST_ACTIVE_VARIANT`'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Admin · Catalog]
      x-roles: [ADMIN, CATALOG_MANAGER]
      operationId: adminDeleteVariant
      summary: "غیرفعال کردن ورینت"
      description: |
        رنگ روی محصول می‌ماند (سفارش‌های قبلی به آن اشاره می‌کنند) و فقط از فروشگاه خارج می‌شود. رنگِ از قبل غیرفعال هم `204` است.
        اگر پیش‌فرض بود، رنگ فعال بعدی (به ترتیب `sortOrder`، بعد شناسه) پیش‌فرض می‌شود.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ProductId'
        - $ref: '#/components/parameters/VariantId'
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '422':
          description: '`LAST_ACTIVE_VARIANT` (آخرین رنگ فعال محصول منتشرشده؛ اول محصول را از انتشار دربیاورید) یا `PRODUCT_ARCHIVED`'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/inventory/adjustments:
    post:
      tags: [Admin · Catalog]
      x-roles: [ADMIN, CATALOG_MANAGER]
      operationId: adminAdjustInventory
      summary: "ثبت تغییر موجودی (ورود کالا، شمارش انبار، آسیب‌دیده) با لاگ"
      description: |
        `delta` غیرصفر و حداکثر ±۱۰٬۰۰۰ (`STOCK_DELTA_INVALID`). جهت هر دلیل: `RESTOCK` و `RETURNED` فقط مثبت، `DAMAGED` فقط منفی،
        `STOCKTAKE` و `MANUAL_CORRECTION` هر دو (`ADJUSTMENT_DIRECTION_INVALID`). `STOCKTAKE` هم یک **تفاوت** است، نه عدد شمارش:
        پنل خودش تفاوت شمارش با موجودی فعلی را حساب می‌کند. رنگ ناموجود ← `400 VARIANT_NOT_FOUND` روی `variantId`.
        موجودی بعد از تغییر نباید از رزروشده کمتر شود ← `422 QUANTITY_EXCEEDS_STOCK` با `meta.availableQuantity` (چقدر می‌شود کم کرد).
        پیامک «موجود شد» را کار زمان‌بندی‌شده‌ی «موجود شد خبرم کن» تا ۵ دقیقه بعد می‌فرستد (نه بین ۲۲ تا ۸ صبح)، نه خود این درخواست.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InventoryAdjustmentRequest' }
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InventoryAdjustment' }
        '422':
          description: '`QUANTITY_EXCEEDS_STOCK` (`meta.availableQuantity`)'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    get:
      tags: [Admin · Catalog]
      x-roles: [ADMIN, CATALOG_MANAGER]
      operationId: adminListInventoryAdjustments
      summary: "تاریخچه‌ی تغییرات موجودی"
      description: |
        فقط تغییرهای دستی (و موجودی اولیه‌ی ساخت رنگ)، **تازه‌ترین اول**. رزرو، آزادسازی و ارسال سفارش‌ها در این لیست نیستند.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: variantId
          in: query
          description: 'فقط همین رنگ؛ شناسه‌ای که عدد مثبت نیست ← `400`'
          schema: { type: integer }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/InventoryAdjustment' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/media:
    post:
      tags: [Admin · Catalog]
      x-roles: [ADMIN, CATALOG_MANAGER, CONTENT_EDITOR, OPERATOR]
      operationId: adminUploadMedia
      summary: "آپلود عکس/ویدیو (محصول، بلاگ، بنر، عکس قبل از ارسال)"
      description: |
        **پردازش همگام است؛ پاسخ کامل است**: سرور نسخه‌های بهینه را همین‌جا می‌سازد و `201` با `MediaAsset` ِ کامل برمی‌گرداند.
        عکس: webp در عرض‌های ۱۶۰، ۴۸۰، ۸۰۰، ۱۲۰۰ و ۱۶۰۰ (فقط عرض‌های کوچک‌تر از عکس اصلی، و همیشه حداقل یکی)، با چرخش از روی EXIF،
        **همه‌ی metadata (EXIF و GPS) پاک**، و `blurhash`. اصل فایل نگه داشته نمی‌شود. **avif ساخته نمی‌شود.**
        ویدیو: همان mp4 (H.264) بدون انکود دوباره با metadata ِ پاک، و فریم کاور (`posterUrl`) در عرض‌های ۴۸۰ و ۸۰۰.
        `url` = بزرگ‌ترین نسخه، `thumbnailUrl` = نسخه‌ی ۱۶۰ (برای ویدیو کاور ۴۸۰)، `srcSet` = همه‌ی نسخه‌ها.

        نوع فایل از روی **محتوا** تشخیص داده می‌شود، نه پسوند یا هدر. اسم فایل کلاینت هیچ‌جا استفاده یا ذخیره نمی‌شود.

        | `purpose` | عکس | ویدیو |
        |---|---|---|
        | `PRODUCT`، `BLOG` | jpeg، png، webp؛ حداکثر ۱۵ مگابایت و ۴۰ مگاپیکسل؛ کوتاه‌ترین ضلع حداقل ۳۲۰ | mp4 با H.264؛ حداکثر ۲۰۰ مگابایت و ۱۸۰ ثانیه |
        | `PRE_SHIPMENT` | همان | mp4 یا mov با H.264؛ حداکثر ۲۰۰ مگابایت و ۱۸۰ ثانیه |
        | `CATEGORY`، `BANNER`، `TESTIMONIAL` | همان | ممنوع (`415`) |

        SVG، GIF، HEIC و هر نوع دیگری پذیرفته نمی‌شود (`415`). ویدیوی HEVC (پیش‌فرض آیفون) هم `415` با `meta.hint = "H264"` می‌گیرد:
        دوربین را روی «Most Compatible» بگذارید.
        مدیایی که تا ۴۸ ساعت به چیزی (رنگ محصول، دسته، ...) وصل نشود خودکار پاک می‌شود؛ مدیای وصل‌شده هیچ‌وقت پاک نمی‌شود.
        آپلود در لاگ تغییرات ثبت نمی‌شود.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, purpose]
              properties:
                file: { type: string, format: binary, description: 'دقیقاً یک فایل؛ بیشتر ← `400 FILE_COUNT_INVALID` روی `file`' }
                purpose: { type: string, enum: [PRODUCT, PRE_SHIPMENT, BLOG, BANNER, CATEGORY, TESTIMONIAL], description: 'مقدار دیگر ← `400 MEDIA_PURPOSE_INVALID`' }
                alt: { type: string, maxLength: 200, description: 'خالی = بدون متن جایگزین؛ بیشتر از ۲۰۰ ← `400 MEDIA_ALT_TOO_LONG`' }
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaAsset' }
        '400':
          description: |
            `VALIDATION_ERROR`: `file` یا `purpose` نیامده، `purpose` نامعتبر (`MEDIA_PURPOSE_INVALID`)، `alt` بلند،
            یا ابعاد غلط: `IMAGE_TOO_SMALL` (کوتاه‌ترین ضلع کمتر از ۳۲۰)، `IMAGE_TOO_LARGE` (بیشتر از ۴۰ مگاپیکسل)، `VIDEO_TOO_LONG`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '413':
          description: '`UPLOAD_TOO_LARGE` — حجم از سقف همان نوع بیشتر است (`meta.maxBytes`). سرور همان لحظه‌ای که سقف رد شد خواندن را قطع می‌کند.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '415':
          description: '`UPLOAD_TYPE_NOT_ALLOWED` — نوع فایل مجاز نیست (`meta.allowed`: فهرست نوع‌های مجاز همین `purpose`؛ `meta.hint = "H264"` برای ویدیوی HEVC)'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/categories:
    get:
      tags: [Admin · Catalog]
      x-roles: [ADMIN, CATALOG_MANAGER]
      operationId: adminListCategories
      summary: "دسته‌بندی‌ها (همه، با شناسه‌ی مدیای عکس برای فرم)"
      description: |
        همه‌ی دسته‌ها به ترتیب `sortOrder`، بعد شناسه. `productCount` ِ پنل محصول‌های **همه‌ی** وضعیت‌هاست (پیش‌نویس و آرشیو هم)،
        تا معلوم باشد چرا دسته‌ای حذف نمی‌شود؛ `GET /categories` ِ فروشگاه همان «فقط منتشرشده» را می‌شمرد.
        `imageUrl` نسخه‌ی ۸۰۰ ِ عکس دسته است و `icon.imageUrl` فعلاً همیشه `null`.
      security: [{ bearerAuth: [] }]
