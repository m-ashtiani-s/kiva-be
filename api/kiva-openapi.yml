  # ================================================================
  #  ADMIN — ORDERS   (roles: ADMIN, OPERATOR)
  # ================================================================
  /admin/orders:
    get:
      tags: [Admin · Orders]
      x-roles: [ADMIN, OPERATOR]
      operationId: adminListOrders
      summary: "صف سفارش‌ها (فیلتر وضعیت، رزرو، روش ارسال، بازه‌ی تاریخ، جستجو با کد/موبایل/نام)"
      description: |
        * بدون `status`، سفارش‌های پرداخت‌نشده و منقضی (`PENDING_PAYMENT`، `PAYMENT_FAILED`، `EXPIRED`) نمی‌آیند؛ با `status` همان وضعیت‌ها (مقدار ناشناخته ← `400`).
        * **`q`** (حداکثر ۱۰۰ نویسه، ارقام فارسی هم): به شکل کد سفارش (`KV-…` یا فقط ۴ تا ۸ رقم) ← همان کد؛ به شکل موبایل ← موبایل حساب یا گیرنده (دقیق)؛
          وگرنه اسم حساب، اسم یا موبایل گیرنده، کد یا شهر شامل متن.
        * **`reserved = true`**: سفارش عضو یک گروه رزرو است (هنوز `RESERVED` یا آزادشده). **`awaitingPhotos = true`**: `PROCESSING` و عکس در وضعیت `WAITING`
          (پیش‌نویس داشته باشد یا نه؛ سفارشی که بعد از درخواست تغییر دوباره عکس لازم دارد هم).
        * **`refundStatus`**: سفارش‌هایی که استردادی در این وضعیت دارند (صف استرداد دستی).
        * **`from`/`to`**: روز تهران، شامل هر دو، روی زمان ثبت.
        * **`statusCounts`**: هر ۱۳ وضعیت (صفر هم)، با همه‌ی فیلترها **جز** `status`، تا شمارنده‌ی تب‌ها با انتخاب یک تب عوض نشود.
        * `customerName` اسم حساب، وگرنه اسم گیرنده؛ `customerPhone` موبایل حساب؛ `mediaCount` تعداد دسته‌ی آخر فرستاده‌شده، وگرنه پیش‌نویس.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: status
          in: query
          style: form
          explode: false
          schema:
            type: array
            items: { $ref: '#/components/schemas/OrderStatus' }
        - name: q
          in: query
          schema: { type: string, maxLength: 100 }
        - name: shippingMethod
          in: query
          schema: { $ref: '#/components/schemas/ShippingMethodCode' }
        - name: reserved
          in: query
          schema: { type: boolean }
        - name: awaitingPhotos
          in: query
          description: سفارش‌هایی که باید عکاسی شوند (`PROCESSING` با عکس در وضعیت `WAITING`)
          schema: { type: boolean }
        - name: refundStatus
          in: query
          description: سفارش‌هایی که استردادی در این وضعیت دارند
          schema: { type: string, enum: [PENDING, PROCESSING] }
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
        - name: sort
          in: query
          description: '`newest` (پیش‌فرض) یا `oldest` (برای کار کردن صف به ترتیب ثبت)'
          schema: { type: string, enum: [newest, oldest], default: newest }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminOrderListResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/orders/{orderCode}:
    get:
      tags: [Admin · Orders]
      x-roles: [ADMIN, OPERATOR]
      operationId: adminGetOrder
      summary: "جزئیات سفارش در پنل (+ مشتری، پرداخت‌ها، گروه ارسال رزرو، یادداشت‌های داخلی)"
      description: |
        همه‌ی `OrderDetail` به‌علاوه‌ی مشتری، گروه ارسال (کد سفارش‌های لغونشده‌ی گروه به ترتیب پرداخت)، **همه‌ی** تلاش‌های پرداخت (قدیمی‌ترین اول)،
        استردادها، یادداشت‌های داخلی (قدیمی‌ترین اول) و `allowedTransitions`. پیش‌نویس عکس‌ها فقط این‌جا (`draftItems`) دیده می‌شود.
        کد ناموجود یا بدشکل ← `404 ORDER_NOT_FOUND`.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/OrderCode'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminOrder' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/orders/{orderCode}/status:
    post:
      tags: [Admin · Orders]
      x-roles: [ADMIN, OPERATOR]
      operationId: adminChangeOrderStatus
      summary: "تغییر وضعیت سفارش (با اعتبارسنجی state machine و ارسال پیامک اختیاری)"
      description: |
        فقط به وضعیت‌های `allowedTransitions` همان سفارش. وضعیت‌هایی که endpoint خودشان را دارند این‌جا پذیرفته نمی‌شوند:
        `PHOTO_SENT` (`…/pre-shipment-media/send`)، `SHIPPED` (`…/shipment`)، خروج از `CHANGE_REQUESTED` به‌جز لغو (`…/change-request/resolution`)،
        و وضعیت‌های مرجوعی (`/admin/returns/*`). انتقال نامجاز ← `422 INVALID_STATUS_TRANSITION` با `meta.from`، `meta.to` و `meta.allowed`.

        * **`CANCELLED`** (از `RESERVED`، `PROCESSING`، `PHOTO_SENT`، `CHANGE_REQUESTED`): موجودی آزاد، استفاده‌ی کد تخفیف برگشت، و **یک استرداد `PENDING`
          به اندازه‌ی کل مبلغ پرداخت‌شده منهای استردادهای قبلی** (روش `BANK_TRANSFER`) ساخته می‌شود. پرداختی در حال تأیید ← `422 PAYMENT_IN_PROGRESS`.
        * **`DELIVERED`** (از `SHIPPED`): لحظه‌ی تحویل همین لحظه است و `returnableUntil` ِ ردیف‌های قابل مرجوعی همین حالا ثابت می‌شود.
        * `note` در تایم‌لاین مشتری به‌عنوان `note` ِ همان ردیف **دیده می‌شود**. با `notifyCustomer` پیامک «لغو شد» یا «تحویل شد» می‌رود.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/OrderCode'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminOrderStatusChangeRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminOrder' }
        '422':
          description: انتقال وضعیت مجاز نیست
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/orders/{orderCode}/pre-shipment-media:
    put:
      tags: [Admin · Orders]
      x-roles: [ADMIN, OPERATOR]
      operationId: adminSetPreShipmentMedia
      summary: "اتصال عکس‌ها/ویدیوهای آپلودشده به سفارش (به ازای هر قلم کالا)"
      description: |
        **پیش‌نویس** را کامل جایگزین می‌کند؛ مشتری پیش‌نویس را نمی‌بیند تا ارسال ثبت شود. فقط در `PROCESSING` با عکس `WAITING`
        (وگرنه `422 INVALID_STATUS_TRANSITION`). ۱ تا ۲۰ مورد، فقط مدیای آپلودشده با `purpose = PRE_SHIPMENT`
        (`400 MEDIA_NOT_FOUND` / `MEDIA_PURPOSE_MISMATCH` روی `items.i.mediaId`؛ تکراری `MEDIA_DUPLICATE`)؛ `orderItemId` باید ردیفی از همین سفارش باشد
        (`400 ORDER_ITEM_NOT_FOUND` روی `items.i.orderItemId`). `sortOrder` ِ نیامده = ترتیب آرایه.
        پاسخ نمای پنل است: `items` همین پیش‌نویس است.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/OrderCode'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminPreShipmentMediaRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PreShipmentMedia' }
        '422':
          description: "`INVALID_STATUS_TRANSITION` — سفارش در مرحله‌ی عکس (`PROCESSING` با عکس `WAITING`) نیست"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/orders/{orderCode}/pre-shipment-media/send:
    post:
      tags: [Admin · Orders]
      x-roles: [ADMIN, OPERATOR]
      operationId: adminSendPreShipmentMedia
      summary: "ارسال عکس‌ها به پیام‌رسان مشتری و تغییر وضعیت به PHOTO_SENT"
      description: |
        **ارسال همیشه دستی است:** اپراتور عکس‌ها را خودش در پیام‌رسان مشتری می‌فرستد و این‌جا ثبت می‌کند؛ بات پیام‌رسان نداریم.
        `manual` پیش‌فرض `true` است و `false` ← `400 MANUAL_ONLY`. `channelOverride` کانالی است که واقعاً استفاده شده (پیش‌فرض: کانال سفارش).
        `message` فقط ثبت می‌شود و سرور آن را به کسی تحویل نمی‌دهد.
        پیش‌نویس «فرستاده» می‌شود: سفارش `PHOTO_SENT`، عکس `SENT`، و `feedbackDeadline` = همین لحظه + ۲۴ ساعت. فقط در `PROCESSING` با عکس `WAITING` و پیش‌نویس ناخالی
        (`422 INVALID_STATUS_TRANSITION`)؛ سفارش چندردیفه برای هر ردیف حداقل یک عکس با `orderItemId` ِ همان ردیف لازم دارد (`422 PHOTOS_INCOMPLETE` با `meta.missingItemIds`).
        بعد از ثبت، پیامک «عکس کیفت فرستاده شد» به موبایل حساب خریدار می‌رود.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/OrderCode'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                manual: { type: boolean, default: true, description: 'همیشه `true`؛ `false` ← `400 MANUAL_ONLY`' }
                channelOverride: { $ref: '#/components/schemas/PhotoMessengerChannel' }
                message: { type: string, maxLength: 500, description: فقط ثبت می‌شود, example: 'این کیف خودته؛ همین الان برات کنار گذاشتیمش.' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminOrder' }
        '422':
          description: "`INVALID_STATUS_TRANSITION` یا `PHOTOS_INCOMPLETE` (`meta.missingItemIds`)"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/orders/{orderCode}/change-request/resolution:
    post:
      tags: [Admin · Orders]
      x-roles: [ADMIN, OPERATOR]
      operationId: adminResolveChangeRequest
      summary: "اجرا یا رد درخواست تغییر مشتری (سفارش CHANGE_REQUESTED ← PROCESSING)"
      description: |
        درخواست همان است که مشتری فرستاده (`preShipmentMediaDetail.feedback`: `changeType`، `orderItemId`، `desiredVariantId`، `note`).
        در هر دو حالت سفارش به `PROCESSING` برمی‌گردد و اپراتور دوباره عکس می‌گیرد و می‌فرستد: `preShipmentMedia.status` به `WAITING` برمی‌گردد
        و پاسخ قبلی مشتری با نتیجه‌اش (`feedback.resolution`) می‌ماند تا عکس تازه برسد و مشتری دوباره جواب بدهد.

        | `decision` | `changeType` | نتیجه |
        |---|---|---|
        | `REJECT` | هر کدام | همان کالا ارسال می‌شود. `note` (دلیل، برای مشتری) لازم است. |
        | `APPLY` | `COLOR`، `MODEL` | قلم `orderItemId` به `variantId` (پیش‌فرض: `desiredVariantId`) عوض می‌شود: رزرو انبار ورینت قبلی آزاد و ورینت تازه رزرو می‌شود. نام، SKU و قیمت قلم از ورینت تازه با قیمت **امروزش** است. |
        | `APPLY` | `CANCEL_ITEM` | قلم حذف و رزروش آزاد می‌شود و سهم پرداخت‌شده‌ی آن استرداد می‌شود. **اگر تنها قلم سفارش بود، سفارش `CANCELLED` می‌شود، دقیقاً مثل لغو پنل** (`POST …/status` با `CANCELLED`: موجودی آزاد، استفاده‌ی کد تخفیف برگشت، استرداد کامل ِ مانده‌ی پرداخت‌شده). |
        | `APPLY` | `OTHER` | کار دستی انجام شده؛ فقط وضعیت برمی‌گردد. `note` لازم است. |

        شماره‌ی قلم (`orderItemId`) هیچ‌وقت عوض نمی‌شود (عکس‌ها و مرجوعی به آن اشاره می‌کنند)؛ قلم حذف‌شده از `items` بیرون می‌رود و شماره‌اش دوباره استفاده نمی‌شود.

        **اختلاف قیمت** = (قیمت امروز ِ ورینت تازه − قیمت پرداخت‌شده‌ی قلم) × تعداد، و همان لحظه ثابت می‌شود.
        مثبت ← به `totals.balanceDue` اضافه می‌شود و `actions.canPay = true`؛ مشتری با `POST /me/orders/{orderCode}/payments` می‌پردازد و تا آن موقع ارسال ممکن نیست.
        منفی ← **اول از `balanceDue` ِ موجود کم می‌شود**، و فقط باقیش یک `Refund` با وضعیت `PENDING` (`BANK_TRANSFER`) می‌شود.
        هزینه‌ی ارسال و کد تخفیف سفارش دوباره حساب نمی‌شوند.

        **سهم پرداخت‌شده‌ی قلم حذف‌شده** = `lineTotal − floor(lineTotal × codeDiscount ÷ subtotal)` (کد تخفیف و `subtotal` ِ موقع ثبت سفارش؛ هزینه‌ی ارسال برنمی‌گردد،
        و گرد کردن رو به پایین یعنی هیچ‌وقت بیشتر از پرداخت‌شده برنمی‌گردد). این سهم هم مثل اختلاف منفی اول از `balanceDue` کم می‌شود.

        **ترتیب قانون‌ها:** شکل (`400`: `decision` لازم، `RESOLUTION_DECISION_INVALID`؛ `note` حداکثر ۵۰۰ (`STATUS_NOTE_TOO_LONG`)؛ `REJECT` بدون `note` ← `NOTE_REQUIRED`؛ `variantId` با `REJECT` ← `VARIANT_NOT_ALLOWED`)
        ← سفارش ← `404` ← پرداخت مانده‌ای در حال تأیید ← `422 PAYMENT_IN_PROGRESS` ← سفارش `CHANGE_REQUESTED` نیست ← `422 INVALID_STATUS_TRANSITION`
        ← `APPLY` با `OTHER` بدون `note` ← `400 NOTE_REQUIRED`؛ `variantId` با `CANCEL_ITEM`/`OTHER` ← `400 VARIANT_NOT_ALLOWED`
        ← `COLOR`/`MODEL`: ورینت ناموجود یا نامتناسب با نوع تغییر ← `400 DESIRED_VARIANT_INVALID` روی `variantId`؛ غیرفعال یا محصولش منتشرنشده ← `422 PRODUCT_UNAVAILABLE`؛
        موجودی کم ← `422 QUANTITY_EXCEEDS_STOCK` (`meta.availableQuantity`)؛ بیش از سقف هر سفارش ِ محصول ← `422 QUANTITY_EXCEEDS_LIMIT`. با هر خطا **هیچ‌چیز** عوض نمی‌شود.

        با `notifyCustomer` (پیش‌فرض) پیامک «درخواستت بررسی شد؛ جزئیات تو صفحه‌ی سفارش» می‌رود، **بدون `note`** (متن آزاد پیامک نداریم)؛
        `note` در `feedback.resolution.note` و تایم‌لاین سفارش دیده می‌شود. برای `CANCEL_ITEM` ِ تنها قلم پیامک «لغو شد» می‌رود.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/OrderCode'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminChangeRequestResolutionRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminOrder' }
        '422':
          description: "`INVALID_STATUS_TRANSITION` (سفارش `CHANGE_REQUESTED` نیست)، `PAYMENT_IN_PROGRESS` (پرداخت مانده در حال تأیید)، `QUANTITY_EXCEEDS_STOCK` (`meta.availableQuantity`)، `QUANTITY_EXCEEDS_LIMIT` یا `PRODUCT_UNAVAILABLE` (ورینت تازه فعال یا قابل فروش نیست)"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/orders/{orderCode}/shipment:
    put:
      tags: [Admin · Orders]
      x-roles: [ADMIN, OPERATOR]
      operationId: adminSetShipment
      summary: "ثبت تحویل به حامل و کد رهگیری (وضعیت SHIPPED + پیامک)"
      description: |
        فقط از `PHOTO_SENT`، و فقط وقتی مشتری عکس را تأیید کرده یا مهلت پاسخش (`feedbackDeadline`) گذشته
        (`422 AWAITING_CUSTOMER_FEEDBACK` با `meta.feedbackDeadline`). `carrier` باید همان روش ارسال سفارش باشد (`400 CARRIER_MISMATCH`).
        `trackingCode`: ۶ تا ۴۰ نویسه از `[0-9A-Za-z-]` (به حروف بزرگ ذخیره می‌شود؛ وگرنه `400 TRACKING_CODE_INVALID`).
        `shippedAt` (پیش‌فرض الان) نه در آینده، نه بیشتر از ۷ روز پیش، نه قبل از ارسال عکس (`400 SHIPPED_AT_INVALID`).

        **گروه رزرو:** یک درخواست **همه‌ی** سفارش‌های لغونشده‌ی گروه را با همین کد ارسال می‌کند. اگر حتی یکی آماده نیست (عکس تأییدنشده،
        مانده‌ی پرداخت، درخواست تغییر باز) ← `422 GROUP_NOT_READY` با `meta.orderCodes` و هیچ‌کدام ارسال نمی‌شوند. گروهی که هنوز در مهلت رزرو است
        ← `422 INVALID_STATUS_TRANSITION`. سفارش لغوشده‌ی گروه ارسال نمی‌شود و مانع هم نیست.
        سفارشی که مانده‌ی پرداخت دارد (`totals.balanceDue > 0`، بعد از درخواست تغییر به رنگ/مدل گران‌تر) ارسال نمی‌شود.

        **روی سفارش `SHIPPED` = اصلاح:** فقط کد، `shippedAt` و `showInDailyList` عوض می‌شوند (برای گروه روی همه‌ی سفارش‌های ارسال‌شده‌ی آن)،
        بدون پیامک. روی `DELIVERED` ← `422 INVALID_STATUS_TRANSITION`. بعد از ارسال (نه اصلاح) پیامک «ارسال شد» با کد رهگیری و اسم حامل می‌رود.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/OrderCode'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminShipmentRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminOrder' }
        '422':
          description: "`AWAITING_CUSTOMER_FEEDBACK` (`meta.feedbackDeadline`)، `GROUP_NOT_READY` (`meta.orderCodes`)، `BALANCE_DUE` (`meta.balanceDue`) یا `INVALID_STATUS_TRANSITION`"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/orders/{orderCode}/notes:
    post:
      tags: [Admin · Orders]
