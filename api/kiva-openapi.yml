    PreShipmentFeedbackRequest:
      type: object
      required: [decision]
      description: |
        `APPROVE` بقیه‌ی فیلدها را نمی‌خواهد. `REQUEST_CHANGE` با `changeType` (`400 CHANGE_TYPE_REQUIRED`):
        `COLOR` و `MODEL` با `orderItemId` (`ORDER_ITEM_REQUIRED`) و `desiredVariantId` (`DESIRED_VARIANT_REQUIRED`)؛
        `CANCEL_ITEM` با `orderItemId`؛ `OTHER` با `note` (`NOTE_REQUIRED`). فیلدی که برای آن `changeType` معنی ندارد نادیده گرفته می‌شود.
        `COLOR` = رنگ دیگری از همان محصول ِ قلم؛ `MODEL` = رنگی از محصول دیگر (وگرنه `400 DESIRED_VARIANT_INVALID`).
      properties:
        decision: { type: string, enum: [APPROVE, REQUEST_CHANGE] }
        changeType: { type: string, nullable: true, enum: [COLOR, MODEL, CANCEL_ITEM, OTHER, null] }
        orderItemId: { type: integer, nullable: true, description: 'قلم سفارش (`OrderItem.id`)؛ برای `COLOR`، `MODEL` و `CANCEL_ITEM`' }
        desiredVariantId: { type: integer, nullable: true, description: 'رنگ/مدل جایگزین؛ برای `COLOR` و `MODEL`' }
        note: { type: string, maxLength: 500, nullable: true, example: می‌شه رنگ مشکی‌اش رو بفرستید؟ }
    CancelOrderRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, enum: [CHANGED_MIND, NOT_AS_PICTURED, ORDERED_BY_MISTAKE, FOUND_CHEAPER, DELIVERY_TOO_LONG, OTHER] }
        note: { type: string, maxLength: 500, nullable: true }
    CancelOrderResponse:
      type: object
      properties:
        order: { $ref: '#/components/schemas/OrderSummary' }
        refund: { type: object, allOf: [{ $ref: '#/components/schemas/Refund' }], nullable: true, description: 'استرداد `PENDING` ِ ساخته‌شده؛ `null` وقتی چیزی پرداخت نشده بود' }
        message: { type: string, example: سفارش لغو شد. برای برگردوندن پولت، همکارهامون تا ۷۲ ساعت کاری باهات تماس می‌گیرن. }
    Refund:
      type: object
      properties:
        id: { type: integer, example: 31 }
        amount: { $ref: '#/components/schemas/Money' }
        method: { type: string, enum: [ORIGINAL_PAYMENT, BANK_TRANSFER] }
        status: { type: string, enum: [PENDING, PROCESSING, COMPLETED, FAILED] }
        reason: { type: string, nullable: true }
        returnId: { type: integer, nullable: true, description: مرجوعی‌ای که این استرداد برای آن است }
        createdAt: { type: string, format: date-time }
        expectedBy: { type: string, format: date-time, nullable: true, description: 'زمان ثبت + ۷۲ ساعت؛ تخمین تماس همکاران' }
        completedAt: { type: string, format: date-time, nullable: true }
        referenceId: { type: string, nullable: true, description: شماره‌ی پیگیری انتقال بانکی }
        statusNote: { type: string, nullable: true, description: 'توضیح آخرین تغییر وضعیت (`PATCH /admin/refunds/{refundId}`)؛ به مشتری هم نشان داده می‌شود', example: شماره شبا تأیید نشد؛ دوباره باهات تماس می‌گیریم }
    ReturnStatus:
      type: string
      enum: [REQUESTED, APPROVED, REJECTED, PICKUP_SCHEDULED, RECEIVED, REFUNDED, CLOSED]
    ReturnReason:
      type: string
      description: سه مورد اول «مشکل از کیوا» حساب می‌شوند و هزینه‌ی برگشت با کیواست
      enum: [NOT_AS_PICTURED, MANUFACTURING_DEFECT, WRONG_ITEM, DAMAGED_IN_TRANSIT, CHANGED_MIND, OTHER]
    CreateReturnRequest:
      type: object
      required: [items, reason]
      properties:
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [orderItemId, quantity]
            properties:
              orderItemId: { type: integer }
              quantity: { type: integer, minimum: 1 }
        reason: { $ref: '#/components/schemas/ReturnReason' }
        description: { type: string, maxLength: 1000, example: رنگ کیف با عکس قبل از ارسال فرق داشت. }
        mediaIds:
          type: array
          maxItems: 6
          description: عکس‌های مستندات از `POST /me/uploads`
          items: { type: string }
        refundMethod: { type: string, enum: [ORIGINAL_PAYMENT, BANK_TRANSFER], default: ORIGINAL_PAYMENT }
        iban: { type: string, nullable: true, pattern: '^IR\d{24}$', description: فقط برای BANK_TRANSFER }
    ReturnRequest:
      type: object
      properties:
        id: { type: integer, example: 12 }
        code: { type: string, example: RT-1012 }
        orderCode: { $ref: '#/components/schemas/OrderCode' }
        status: { $ref: '#/components/schemas/ReturnStatus' }
        statusLabel: { type: string, example: در حال بررسی }
        reason: { $ref: '#/components/schemas/ReturnReason' }
        description: { type: string, nullable: true }
        items:
          type: array
          items:
            type: object
            properties:
              orderItemId: { type: integer }
              name: { type: string }
              color: { $ref: '#/components/schemas/Color' }
              quantity: { type: integer }
        media:
          type: array
          items: { $ref: '#/components/schemas/MediaAsset' }
        shippingPaidBy: { type: string, enum: [KIVA, CUSTOMER] }
        instructions: { type: string, nullable: true, example: بسته رو با تیپاکس به آدرس انبار کیوا بفرست و کد رهگیری رو این‌جا ثبت کن. }
        refundMethod: { type: string, enum: [ORIGINAL_PAYMENT, BANK_TRANSFER] }
        rejectionReason: { type: string, nullable: true, description: فقط برای `REJECTED` }
        pickup:
          type: object
          nullable: true
          description: جمع‌آوری مرسوله توسط کیوا (`PICKUP_SCHEDULED`)؛ وقتی مشتری خودش می‌فرستد `null`
          properties:
            carrier: { $ref: '#/components/schemas/ShippingMethodCode' }
            carrierName: { type: string, example: تیپاکس }
            scheduledFor: { type: string, format: date-time, nullable: true }
            trackingCode: { type: string, nullable: true }
            note: { type: string, nullable: true }
        refund: { type: object, allOf: [{ $ref: '#/components/schemas/Refund' }], nullable: true }
        createdAt: { type: string, format: date-time }
        decidedAt: { type: string, format: date-time, nullable: true }
        receivedAt: { type: string, format: date-time, nullable: true }
        closedAt: { type: string, format: date-time, nullable: true }
        closeReason: { type: string, nullable: true, description: فقط برای `CLOSED` }

