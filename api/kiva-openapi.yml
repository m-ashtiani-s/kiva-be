  description: |
    # API فروشگاه کیوا — «هرچی ببینی، همون می‌رسه»

    این سند قرارداد کامل بین فرانت‌اند (طرح‌های فعلی: `index`, `products`, `product`, `cart`, `checkout`,
    `login`, `account`, `wishlist`, `track`, `blog`, `blog-post`, `faq`, `contact`, `about`, `404`) و بک‌اند است.
    هرچیزی که در طرح‌ها هست پوشش داده شده و هرجا که پیشنهاد معماری خودمان است، در عنوان endpoint با
    **[پیشنهادی]** مشخص شده است.

    ---

    ## ۱. قراردادهای کلی (Conventions)

    | موضوع | قرارداد |
    |---|---|
    | Base URL | `https://api.kiva.ir/api/v1` — نسخه در مسیر است؛ تغییر شکننده = `v2` |
    | فرمت | `application/json; charset=utf-8` — نام فیلدها `camelCase` — مقادیر enum با حروف بزرگ (`IN_STOCK`) و پارامترهای sort با حروف کوچک (`price_asc`) |
    | پول | همه مبالغ **عدد صحیح به تومان** (`int64`) هستند. تبدیل به ریال فقط داخل لایه‌ی درگاه پرداخت انجام می‌شود. |
    | تاریخ و زمان | ISO-8601 با منطقه زمانی (`2026-10-05T09:24:00Z`) و تاریخ خالی `YYYY-MM-DD` (میلادی). تبدیل به شمسی در کلاینت (`Intl` با `fa-IR-u-ca-persian`). منطق «روز کاری» و «جمعه» بر اساس `Asia/Tehran`. |
    | اعداد فارسی | سرور در ورودی‌ها (موبایل، کد پستی، کد سفارش، OTP، کد تخفیف) ارقام فارسی/عربی را به لاتین **نرمال‌سازی** می‌کند. فیلدهای داده (عدد، کد، مبلغ) همیشه ارقام لاتین‌اند و قالب‌بندی با کلاینت است؛ فقط فیلدهای متنی آماده‌ی نمایش (`label`، `message`، `statusLabel`، `title`) با ارقام فارسی برمی‌گردند. |
    | حروف فارسی | در جستجو `ي→ی` و `ك→ک` و حذف نیم‌فاصله‌ی اضافی انجام می‌شود. |
    | شناسه‌ها | محصول/ورینت/آدرس: `integer` — سفارش: کد عمومی `KV-218340` — رنگ: کلید رشته‌ای (`lilac`) — دسته‌بندی: `slug` (`shoulder`) |
    | صفحه‌بندی | `page` (از ۱) و `size` — پاسخ: `{ items: [], meta: { page, size, totalItems, totalPages, hasNext } }` |
    | فیلدهای بی‌مقدار | همه‌ی فیلدهای تعریف‌شده‌ی پاسخ **همیشه** فرستاده می‌شوند؛ فیلدی که مقدار ندارد `null` است (نه حذف‌شده). فیلدی که می‌تواند بی‌مقدار باشد در این سند `nullable` است. |
    | خطا | `application/problem+json` (RFC 7807) + فیلد ماشینی `code` (لیست کامل در `ErrorCode`) + `message` فارسی قابل نمایش به کاربر + `errors[]` برای خطای فیلدها |
    | 400 در برابر 422 | `400 VALIDATION_ERROR` = ورودی از نظر شکل/فرمت غلط است. `422` = ورودی درست است ولی قانون کسب‌وکار اجازه نمی‌دهد (مثل `DISCOUNT_MIN_SUBTOTAL_NOT_MET`). |
    | Idempotency | `POST /orders`، `POST /payments/{id}/retry` و `POST /me/orders/{code}/payments` هدر `Idempotency-Key` (UUID) می‌گیرند. تکرار با همان کلید و همان بدنه همان سفارش و همان تراکنش را برمی‌گرداند (با وضعیت **فعلی** آن‌ها، پس پاسخ از نظر معنی یکی است، نه بایت‌به‌بایت). همان کلید با بدنه‌ی دیگر `409 IDEMPOTENCY_KEY_REUSED`. درخواستی که شکست خورد و چیزی نساخت ثبت نمی‌شود و تکرارش دوباره اجرا می‌شود. کلید ۲۴ ساعت نگه داشته می‌شود. هدر نیامده یا UUID نیست = `400 VALIDATION_ERROR` روی فیلد `Idempotency-Key`. |
    | کش | `GET /config`، `/home`، `/categories`، `/colors`، `/faq`، `/geo/*` و بلاگ با `ETag` + `Cache-Control: public, max-age=300` کش می‌شوند. |
    | Rate limit | ورود و کدهای تأیید: جدول «محدودیت‌ها» در بخش ۲. پیگیری مهمان: ۱۰ بار در ۱۰ دقیقه برای هر IP. سفارش پرداخت‌نشده و تلاش پرداخت: بخش ۳. پاسخ `429` همیشه با هدر `Retry-After` (ثانیه) و `meta.retryAfterSeconds`. |

    ## ۲. احراز هویت

    * ورود و ثبت‌نام یکی است: `POST /auth/otp/send` ← `POST /auth/otp/verify` (کد ۵ رقمی، اعتبار ۵ دقیقه، تایمر ارسال مجدد ۱۲۰ ثانیه).
      پاسخ `send` برای شماره‌ی ثبت‌نام‌شده و جدید دقیقاً یکی است؛ ثبت‌نام بودن فقط بعد از verify (`isNewUser`) معلوم می‌شود.
    * **دو توکن:**
      * `accessToken`: JWT با اعتبار ۱۵ دقیقه، در بدنه‌ی پاسخ. کلاینت آن را **فقط در حافظه** نگه می‌دارد (نه `localStorage`، نه `sessionStorage`، نه کوکی) و با `Authorization: Bearer <token>` می‌فرستد.
      * `refreshToken`: **در بدنه نمی‌آید.** سرور آن را در کوکی `kiva_rt` می‌گذارد:
        `HttpOnly; Secure; SameSite=Strict; Path=/api/v1/auth`. جاوااسکریپت آن را نمی‌بیند و مرورگر فقط برای `/api/v1/auth/*` می‌فرستدش.
        با هر استفاده عوض می‌شود (چرخشی). مشتری: ۳۰ روز بعد از آخرین استفاده و حداکثر ۱۸۰ روز. کاربر پنل (هر نقشی غیر از `CUSTOMER`): ۱۲ ساعت بعد از آخرین استفاده و حداکثر ۷ روز.
    * **باز شدن صفحه و تمدید:** کلاینت بعد از باز شدن صفحه، و هر وقت جواب `401 TOKEN_EXPIRED` گرفت، `POST /auth/refresh` را با `credentials: 'include'` صدا می‌زند.
      اگر چند تب باز است فقط **یکی** تمدید کند (مثلاً با `navigator.locks`). سرور درخواست‌های هم‌زمان با یک توکن را تا ۳۰ ثانیه می‌پذیرد،
      ولی استفاده از توکنی که قبلاً عوض شده بعد از این مهلت **نشانه‌ی دزدی است** و همه‌ی نشست‌های آن زنجیره باطل می‌شود (`401 REFRESH_TOKEN_INVALID`).
    * هر درخواستی که کوکی نشست را می‌گذارد یا می‌خواند (`/auth/otp/verify`، `/auth/refresh`، `/auth/logout`، `/me/phone-change/verify`، `DELETE /me`)
      باید با `credentials: 'include'` فرستاده شود؛ وگرنه مرورگر `Set-Cookie` پاسخ را نادیده می‌گیرد. بقیه‌ی درخواست‌ها به آن نیازی ندارند.
    * **محل فرانت:** چون کوکی `SameSite=Strict` است، فرانت و پنل باید روی **همان سایت** API باشند (`kiva.ir`، `www.kiva.ir`، `admin.kiva.ir` در کنار `api.kiva.ir`؛ در توسعه `localhost`).
      `/auth/refresh` و `/auth/logout` فقط از originهای مجاز پذیرفته می‌شوند (هدر `Origin`)؛ وگرنه `403 FORBIDDEN`.
    * اگر `isNewUser = true` بود، کلاینت مرحله‌ی اختیاری «دوست داری چی صدات کنیم؟» را نشان می‌دهد و با `PATCH /me` نام را ذخیره می‌کند.
    * **سبد مهمان:** افزودن به سبد بدون ورود مجاز است. سرور در اولین درخواست سبد یک `X-Cart-Token` برمی‌گرداند؛ کلاینت آن را نگه می‌دارد.
      با Bearer معتبر، سبد کاربر برمی‌گردد و `X-Cart-Token` نادیده گرفته می‌شود.
      موقع verify، اگر `guestCartToken` ارسال شود سبد مهمان با سبد کاربر **ادغام** می‌شود و سبد مهمان از بین می‌رود. `cart` ِ پاسخ verify همیشه سبد کاربر بعد از ادغام است.
    * نیازمند ورود: پرداخت، علاقه‌مندی‌ها، ثبت نظر، حساب کاربری. پیگیری سفارش (track) بدون ورود است.
    * **ورود اختیاری:** endpointهایی که `security` آن‌ها `[{}, bearerAuth]` است با و بی ورود کار می‌کنند. بدون هدر `Authorization` = مهمان.
      ولی اگر هدر فرستاده شود و توکن منقضی یا نامعتبر باشد، جواب `401` است (`TOKEN_EXPIRED` یا `UNAUTHORIZED`) و درخواست **هرگز بی‌صدا مهمان حساب نمی‌شود**.
    * **نقش‌ها:** هر endpoint ِ `/admin/*` نقش‌های مجازش را در `x-roles` دارد؛ نقش ناکافی = `403 FORBIDDEN`. `ADMIN` همه‌جا مجاز است.
      در پنل، نقش‌ها و فعال بودن نشست در **هر درخواست** از سرور خوانده می‌شوند، پس گرفتن نقش یا خروج فوراً اثر می‌کند. تغییر نقش‌های یک کاربر همه‌ی نشست‌هایش را باطل می‌کند.

      | بخش پنل | نقش‌ها |
      |---|---|
      | کاتالوگ، موجودی و صف «موجود شد خبرم کن» (`GET /admin/stock-alerts`) | `ADMIN`، `CATALOG_MANAGER` |
      | آپلود مدیا (`POST /admin/media`) | `ADMIN`، `CATALOG_MANAGER`، `CONTENT_EDITOR`، `OPERATOR` |
      | سفارش‌ها و مرجوعی‌ها | `ADMIN`، `OPERATOR` — به‌جز ثبت و پیگیری استرداد وجه (`POST /admin/orders/{orderCode}/refunds`، `PATCH /admin/refunds/{refundId}`): فقط `ADMIN` |
      | کد تخفیف | فقط `ADMIN` |
      | کمپین، بنر، نوار اطلاعیه، رضایت مشتری، بلاگ، FAQ، صفحه‌های ثابت | `ADMIN`، `CONTENT_EDITOR` |
      | تنظیمات (`/admin/settings`) | فقط `ADMIN` |
      | نظرات، پیام‌های تماس، مشتریان | `ADMIN`، `SUPPORT` |
      | گزارش‌ها، تعیین نقش کاربران، لاگ تغییرات و مشترکین خبرنامه | فقط `ADMIN` |

    * **لاگ تغییرات:** هر درخواست **موفقِ** نوشتنی زیر `/admin/*` (`POST`، `PUT`، `PATCH`، `DELETE`؛ به‌جز آپلود مدیا) یک ردیف در لاگ تغییرات می‌گذارد:
      چه کسی، کِی، چه کاری، روی چه چیزی، و هر فیلد از چه به چه شد. خواندن‌ها و کارهای خودکار سیستم (مثل پایان مهلت رزرو) ثبت نمی‌شوند.
      **یک ردیف برای هر درخواست**: درخواستی که چند چیز را عوض می‌کند (ساخت محصول با رنگ‌هایش) یک ردیف با همه‌ی تغییرها دارد،
      و درخواستی که چیزی را عوض نکرد (ذخیره‌ی فرم بی‌تغییر، آرشیو ِ محصولِ از قبل آرشیو) ردیفی ندارد.
      `actor` (نام و موبایل) موقع خواندن از حساب **فعلی** کاربر خوانده می‌شود، نه از ردیف. نوع `MEDIA` استفاده نمی‌شود، چون آپلود ثبت نمی‌شود.
      لاگ فقط اضافه می‌شود و ویرایش ندارد؛ هر ردیف **۹۰ روز** نگه داشته می‌شود و هر شب ردیف‌های قدیمی‌تر پاک می‌شوند: `GET /admin/audit-log`.

    * **محدودیت‌ها** (همه با `429`، هدر `Retry-After` و `meta.retryAfterSeconds`):

      | چی | حد | کد |
      |---|---|---|
      | ارسال کد به یک شماره | ۱ بار در ۱۲۰ ثانیه (برای هر هدف جدا: ورود، تغییر شماره، حذف حساب) | `OTP_RESEND_TOO_SOON` |
      | ارسال کد به یک شماره | ۵ بار در ساعت و ۱۰ بار در ۲۴ ساعت | `RATE_LIMITED` |
      | درخواست کد از یک IP | ۲۰ بار در ۱۰ دقیقه | `RATE_LIMITED` |
      | امتحان یک کد | ۵ بار؛ بعدش کد باطل است (`422`) | `OTP_TOO_MANY_ATTEMPTS` |
      | کد اشتباه برای یک شماره | ۱۰ بار در ۲۴ ساعت؛ بعدش تا پایان بازه کد جدید هم پذیرفته نمی‌شود | `RATE_LIMITED` |

      همین حدها برای کدهای تغییر شماره و حذف حساب هم هست.

    ## ۳. قوانین کسب‌وکار

    * **ارسال رایگان:** فقط برای `POST` (پست معمولی) وقتی `subtotal` (جمع بعد از تخفیف محصولات و **قبل** از کد تخفیف) ≥ ۳٬۰۰۰٬۰۰۰ تومان.
    * **محاسبه‌ی جمع سبد** (دقیقاً مطابق طرح سبد و تسویه):
      `itemsCompareAtTotal` (قیمت کالاها = جمع قیمت قبل از تخفیف) − `productDiscount` (تخفیف محصولات) = `subtotal`
      ← − `codeDiscount` (کد تخفیف) + `shippingCost` = `payable` (مبلغ قابل پرداخت، هرگز منفی نیست).
    * **کد تخفیف:** مبنا جمع ردیف‌های قابل خریدی است که کد شاملشان می‌شود (کد بدون محدودیت دسته/محصول/«بدون کالاهای تخفیف‌خورده» = کل `subtotal`).
      نوع درصدی: `floor((مبنا × درصد + 50000) / 100000) × 1000`، یعنی به نزدیک‌ترین ۱٬۰۰۰ تومان، نیمه به بالا (۱۴۵٬۵۰۰ ← ۱۴۶٬۰۰۰؛ ۱۴۵٬۴۹۹ ← ۱۴۵٬۰۰۰)، بعد حداکثر `maxDiscount`؛
      نوع مبلغی حداکثر به اندازه‌ی مبنا. شرط‌ها به این ترتیب (اولین شرط ناموفق جواب است): وجود و فعال بودن، شروع، پایان، ورود (کد با سقف هر کاربر، خرید اول یا «فقط با ورود» برای مهمان نیست)،
      خرید اول (کاربری که سفارش پرداخت‌شده دارد)، سقف استفاده (کل و هر کاربر؛ سفارش‌های پرداخت‌نشده‌ی در جریان هم شمرده می‌شوند)، حداقل خرید، و دست‌کم یک ردیف مشمول.
      کد سبد بعد از هر تغییر سبد دوباره بررسی می‌شود و اگر دیگر معتبر نباشد با `DISCOUNT_REMOVED` (یک بار) برداشته می‌شود. استفاده‌ی سفارشی که منقضی شود آزاد می‌شود.
    * **موجودی:** موجودی دقیق هیچ‌وقت لو نمی‌رود؛ فقط وقتی کمتر از `lowStockThreshold` (پیش‌فرض ۵) است، `availableQuantity` برگردانده می‌شود («فقط ۳ عدد باقی مونده»).
    * **سقف خرید هر محصول** (`maxPerOrder`، پیش‌فرض ۵) مال **محصول** است، نه هر رنگ: جمع تعداد همه‌ی رنگ‌های یک محصول در سبد و در سفارش از آن بیشتر نمی‌شود.
      پس سقف هر ردیف سبد (`CartItem.maxQuantity`) = min(موجودی آن رنگ، `maxPerOrder` − تعداد بقیه‌ی رنگ‌های همان محصول در سبد).
    * **ردیف غیرقابل خرید:** اگر رنگی ناموجود شود یا از فروشگاه خارج شود، ردیفش در سبد می‌ماند (`CartItem.purchasable = false`) ولی در جمع پول حساب نمی‌شود،
      و ثبت سفارش تا وقتی حذف نشود رد می‌شود.
    * **نگه‌داری موجودی برای پرداخت:** با `POST /orders` موجودی برای ۱۵ دقیقه (`paymentPendingMinutes`) کنار گذاشته می‌شود و با پرداخت موفق تا ارسال کنار می‌ماند.
      اگر پرداخت تا آن موقع انجام نشود سفارش `EXPIRED` و موجودی آزاد می‌شود؛ ولی اگر مشتری در همین ۱۵ دقیقه به درگاه رفته و هنوز برنگشته، موجودی تا پایان همان پرداخت
      (حداکثر ۲۰ دقیقه بعد از پایان مهلت) نگه داشته می‌شود. تلاش پرداخت تازه فقط تا پایان مهلت مجاز است و پرداخت دوباره مهلت را تمدید نمی‌کند.
    * **سقف سفارش پرداخت‌نشده:** هر کاربر حداکثر ۳ سفارش پرداخت‌نشده دارد که موجودی نگه داشته‌اند؛ سفارش چهارم `429 RATE_LIMITED` می‌گیرد.
      هر سفارش حداکثر ۱۰ تلاش پرداخت دارد.
    * **ناموجودها** در لیست محصولات به انتهای لیست می‌روند، مگر در مرتب‌سازی قیمتی.
    * **رزرو ۴ روزه:** سوییچ «رزرو ۴ روزه» در سبد و تسویه، **کنار** روش ارسال (پست/تیپاکس) است و جای آن را نمی‌گیرد.
      مبلغ کامل (با هزینه‌ی ارسال) پرداخت می‌شود و سفارش `RESERVED` می‌ماند؛ هر خرید دیگری در این مدت به همان سفارش می‌پیوندد و هزینه‌ی ارسال ندارد.
      * **شروع و پایان مهلت:** مهلت از لحظه‌ی **پرداخت موفق** اولین سفارش (سفارش اصلی) شروع می‌شود و `reservationHoldDays` (۴) روز بعد تمام می‌شود.
        این زمان برای کل گروه ثابت است و با پیوستن سفارش‌های بعدی تمدید نمی‌شود.
      * **پیوستن (ادغام):** اگر کاربر رزرو فعال داشته باشد و سفارش جدید را **به همان آدرس** ثبت کند، سفارش جدید خودکار به گروه می‌پیوندد.
        «همان آدرس» یعنی همان آدرس ذخیره‌شده‌ی سفارش اصلی (`addressId`)، به شرطی که از شروع رزرو ویرایش نشده باشد؛ اگر ویرایش شده باشد سفارش تازه ادغام نمی‌شود.
        هزینه‌ی ارسال سفارش پیوسته صفر می‌شود (`freeReason = RESERVATION_CONSOLIDATION`)، روش ارسالش همان روش سفارش اصلی است، و بعد از پرداخت آن هم `RESERVED` می‌شود.
        تصمیم ادغام هنگام `POST /orders` گرفته می‌شود و اگر مهلت در فاصله‌ی ثبت تا پرداخت (حداکثر ۱۵ دقیقه) تمام شود، ارسال رایگان همچنان حفظ می‌شود
        و سفارش بعد از پرداخت مستقیم `PROCESSING` می‌شود (همراه گروه ارسال می‌شود). سوییچ رزرو ِ سفارشی که می‌پیوندد نادیده گرفته می‌شود.
      * **فقط یک رزرو فعال:** هر کاربر در هر لحظه حداکثر یک رزرو فعال دارد. وقتی رزرو فعال دارد سوییچ رزرو در دسترس نیست
        (`reservation.available = false`، `unavailableReason = HAS_ACTIVE_RESERVATION`): سفارش به همان آدرس ادغام می‌شود و سفارش به آدرس دیگر عادی ارسال می‌شود.
        اگر دو سفارش رزروی پیش از شروع رزرو ثبت شده باشند، اولین پرداخت رزرو را شروع می‌کند و دومی هنگام پرداخت، اگر به همان آدرس باشد، به آن می‌پیوندد
        و وگرنه `PROCESSING` می‌شود.
      * **کالای غیرقابل‌رزرو:** اگر حتی یک کالای سبد `reservable = false` باشد، رزرو در دسترس نیست (`ITEM_NOT_RESERVABLE`).
      * **پایان مهلت:** همه‌ی سفارش‌های گروه **خودکار** از `RESERVED` به `PROCESSING` می‌روند (عکس قبل از ارسال، سپس ارسال گروهی با **یک کد رهگیری**).
      * **لغو:** مشتری سفارش گروه را تا وقتی وضعیتش عوض نشده (`RESERVED` یا `PROCESSING` و هیچ عکسی برایش فرستاده نشده) لغو می‌کند؛
        پنل هر سفارش گروه را تا قبل از `SHIPPED`. لغو سفارش اصلی گروه یا مهلتش را از بین نمی‌برد و
        ارسال رایگان سفارش‌های پیوسته حفظ می‌شود. هزینه‌ی ارسال سفارش اصلی بعد از پیوستن سفارش‌های دیگر دوباره محاسبه نمی‌شود.
    * **عکس قبل از ارسال (امضای کیوا):** انتخاب پیام‌رسان (روبیکا/تلگرام/بله) و شماره‌ی آن در تسویه **اجباری** است. اپراتور قبل از بسته‌بندی عکس/ویدیو را آپلود می‌کند،
      خودش در پیام‌رسان مشتری می‌فرستد و ارسال را ثبت می‌کند؛ یک نسخه برای همیشه در جزئیات سفارش می‌ماند. مشتری عکس را تأیید می‌کند یا تغییر رنگ/مدل می‌خواهد.
    * **لغو سفارش:** مشتری تا وقتی وضعیت سفارش عوض نشده (`RESERVED` یا `PROCESSING` و هیچ عکسی فرستاده نشده) لغو می‌کند؛
      بعد از آن لغو با درخواست تغییر یا پشتیبانی است. پنل تا قبل از `SHIPPED` لغو می‌کند. سفارش پرداخت‌نشده لغو نمی‌شود (خودش منقضی می‌شود).
      **بازگشت وجه دستی است:** با هر لغو یک استرداد `PENDING` به اندازه‌ی کل مبلغ پرداخت‌شده (منهای استردادهای قبلی) ثبت می‌شود
      و همکاران برای گرفتن شماره شبا با مشتری تماس می‌گیرند؛ شماره شبا در سیستم ذخیره نمی‌شود. موجودی آزاد و استفاده‌ی کد تخفیف برگردانده می‌شود.
    * **بازگشت کالا:** تا ۷ روز بعد از تحویل. اگر مشکل از کیوا باشد (`NOT_AS_PICTURED`، `MANUFACTURING_DEFECT`، ...) هزینه‌ی برگشت با کیواست؛ در `CHANGED_MIND` با مشتری.
    * **جمعه‌ها** ارسال نداریم (`nonShippingWeekdays`). سفارشی که جمعه (به وقت تهران) ثبت می‌شود شنبه ارسال می‌شود، و `estimatedDelivery`
      از روز ارسال شمرده می‌شود: `minDays` تا `maxDays` روز کاری بعد از آن، بدون جمعه‌ها. پس سفارش جمعه یک روز دیرتر از سفارش پنجشنبه می‌رسد.

    ## ۴. چرخه‌ی وضعیت سفارش

    | `status` | برچسب طرح | مرحله‌ی stepper | رنگ تگ |
    |---|---|---|---|
    | `PENDING_PAYMENT` | در انتظار پرداخت | — | warn |
    | `PAYMENT_FAILED` / `EXPIRED` | پرداخت ناموفق / منقضی | — | danger |
    | `RESERVED` | رزرو شده | ۱ ثبت شد | cream |
    | `PROCESSING` | در حال آماده‌سازی | ۱ ثبت شد | warn |
    | `PHOTO_SENT` | عکس کیف ارسال شد | ۲ عکس ارسال شد | default |
    | `CHANGE_REQUESTED` | درخواست تغییر ثبت شد | ۲ عکس ارسال شد | warn |
    | `SHIPPED` | در مسیر | ۳ تحویل پست شد | default |
    | `DELIVERED` | تحویل شده | ۴ تحویل شد | success |
    | `CANCELLED` | لغو شده | — | danger |
    | `RETURN_REQUESTED` / `RETURNED` / `REFUNDED` | درخواست مرجوعی / مرجوع شد / وجه برگشت داده شد | — | warn / default |

    مسیر اصلی: `PENDING_PAYMENT → (RESERVED) → PROCESSING → PHOTO_SENT → SHIPPED → DELIVERED`.
    `RESERVED → PROCESSING` فقط خودکار و در پایان مهلت رزرو انجام می‌شود؛ `RESERVED → CANCELLED` با لغو مشتری یا ادمین.

    **`allowedTransitions`** (آنچه `POST /admin/orders/{orderCode}/status` می‌پذیرد):

    | وضعیت فعلی | `allowedTransitions` |
    |---|---|
    | `RESERVED`، `PROCESSING`، `PHOTO_SENT`، `CHANGE_REQUESTED` | `[CANCELLED]` |
    | `SHIPPED` | `[DELIVERED]` |
    | بقیه | `[]` |

    `PHOTO_SENT` (با `…/pre-shipment-media/send`)، `SHIPPED` (با `…/shipment`)، خروج از `CHANGE_REQUESTED` به‌جز لغو و وضعیت‌های مرجوعی هیچ‌وقت از `…/status` نمی‌آیند.

    **عکس قبل از ارسال** (`preShipmentMedia.status`): `WAITING` (پیش‌نویس دارد یا نه؛ مشتری پیش‌نویس را نمی‌بیند) ← ثبت ارسال ← `SENT` ← تأیید مشتری،
    یا پایان مهلت پاسخ (`feedbackDeadline` = زمان ارسال عکس + ۲۴ ساعت) ← `APPROVED`؛ `SENT` یا `APPROVED` ← درخواست تغییر ← `CHANGE_REQUESTED` ← رسیدگی ← `WAITING` (عکس تازه).
    تأیید عکس وضعیت سفارش را عوض نمی‌کند (`PHOTO_SENT` تا ارسال می‌ماند).

    **ارسال** فقط از `PHOTO_SENT` است، و فقط بعد از تأیید مشتری یا پایان مهلت پاسخ (`422 AWAITING_CUSTOMER_FEEDBACK`)، و بدون مانده‌ی پرداخت.
    **گروه رزرو با یک درخواست و یک کد رهگیری ارسال می‌شود** و همه‌ی سفارش‌های لغونشده‌ی گروه باید آماده باشند (`422 GROUP_NOT_READY`)؛ سفارش لغوشده‌ی گروه ارسال نمی‌شود و مانع هم نیست.
    «تحویل شد» دستی است (`…/status` با `DELIVERED`) و مهلت مرجوعی (`returnableUntil`) همان لحظه با `returnWindowDays` ِ آن لحظه ثابت می‌شود.
    سرور برای هر سفارش آبجکت آماده‌ی `progress` (۴ مرحله با تاریخ هر مرحله) و `statusLabel`/`statusTone` را برمی‌گرداند تا کلاینت منطق نگاشت نداشته باشد.

    **درخواست تغییر:** مشتری با `POST /me/orders/{orderCode}/media-feedback` (`REQUEST_CHANGE`) سفارش را `CHANGE_REQUESTED` می‌کند.
    اپراتور آن را با `POST /admin/orders/{orderCode}/change-request/resolution` اجرا یا رد می‌کند و سفارش به `PROCESSING` برمی‌گردد
    (`preShipmentMedia.status = WAITING`: عکس تازه، بعد ارسال). از `CHANGE_REQUESTED` فقط همین endpoint یا لغو (`CANCELLED`) بیرون می‌برد.
    اگر رنگ/مدل تازه **ارزان‌تر** باشد، مابه‌التفاوت اول از مانده‌ی پرداخت (`balanceDue`) کم می‌شود و باقیش خودکار استرداد می‌شود؛
    اگر **گران‌تر** باشد، روی سفارش `balanceDue` می‌نشیند (در `OrderSummary` و `totals`) و `actions.canPay = true`؛
    مشتری با `POST /me/orders/{orderCode}/payments` آن را می‌پردازد و تا صفر نشود سفارش ارسال نمی‌شود (`422 BALANCE_DUE`).
    درخواست تغییر فقط در `PHOTO_SENT` (عکس `SENT` یا `APPROVED`؛ پس بعد از تأیید هم) و یکی در هر لحظه ممکن است؛ بعد از ارسال هیچ‌وقت.

    **چرخه‌ی مرجوعی** (`ReturnStatus`):

    | از | به | با |
    |---|---|---|
    | — | `REQUESTED` | مشتری: `POST /me/orders/{orderCode}/returns` |
    | `REQUESTED` | `APPROVED` یا `REJECTED` (پایان) | `POST /admin/returns/{returnId}/decision` |
    | `APPROVED` | `PICKUP_SCHEDULED` (اختیاری؛ وقتی کیوا مرسوله را جمع می‌کند) | `PUT /admin/returns/{returnId}/pickup` (دوباره صدا زدن = تغییر زمان/کد) |
    | `APPROVED`، `PICKUP_SCHEDULED` | `RECEIVED` (کالا به انبار رسید و بازبینی شد) | `POST /admin/returns/{returnId}/receipt` |
    | `RECEIVED` | `REFUNDED` (پایان) | وقتی استرداد همین مرجوعی (`POST /admin/orders/{orderCode}/refunds` با `returnId`) `COMPLETED` شود |
    | `APPROVED`، `PICKUP_SCHEDULED`، `RECEIVED` | `CLOSED` (پایان بدون استرداد: کالا نرسید یا بازبینی رد شد) | `POST /admin/returns/{returnId}/close` |

    وضعیت سفارش دنبال مرجوعی باز آن می‌رود: تا مرجوعی `REQUESTED`، `APPROVED` یا `PICKUP_SCHEDULED` است سفارش `RETURN_REQUESTED`،
    بعد از `RECEIVED` سفارش `RETURNED` و بعد از `REFUNDED` سفارش `REFUNDED` است. اگر مرجوعی `REJECTED` یا `CLOSED` شود (یعنی بدون استرداد)،
    سفارش به `DELIVERED` برمی‌گردد. انتقال نامجاز در همه‌ی این endpointها `422 INVALID_STATUS_TRANSITION` است و پاسخ پنل
    (`AdminReturnRequest.allowedTransitions`) قدم‌های مجاز بعدی را می‌گوید.

    ## ۵. پیامک‌ها و اعلان‌ها

    | رویداد | کانال | محتوا |
    |---|---|---|
    | درخواست OTP | SMS | کد ۵ رقمی |
    | پرداخت موفق | SMS | کد سفارش + لینک `track?order=KV-...` |
    | ارسال عکس قبل از ارسال | پیام‌رسان انتخابی (اپراتور، دستی) + SMS (سرور) | عکس‌ها/ویدیو در پیام‌رسان؛ پیامک: کد سفارش + لینک جزئیات سفارش |
    | ۱۲ ساعت مانده به پایان رزرو | SMS | یادآوری افزودن خرید [پیشنهادی] |
    | تحویل به پست/تیپاکس | SMS | کد رهگیری + اسم حامل (اصلاح کد رهگیری پیامک ندارد) |
    | تحویل شد | SMS | درخواست ثبت نظر (با `notifyCustomer`) |
    | لغو شد | SMS | کد سفارش؛ لغو مشتری همیشه، لغو پنل با `notifyCustomer` |
    | پول برگشت | SMS | کد سفارش؛ وقتی استرداد `COMPLETED` می‌شود |
    | درخواست تغییر بررسی شد | SMS | کد سفارش + «جزئیات در صفحه‌ی سفارش»؛ با `notifyCustomer`. **بدون `note`**: متن آزاد پیامک نداریم، `note` در `feedback.resolution` و تایم‌لاین دیده می‌شود |
    | موجود شد | SMS | لینک محصول (اشتراک «موجود شد خبرم کن») |
    | افت قیمت علاقه‌مندی | SMS | فقط با رضایت بازاریابی [پیشنهادی] |

    ## ۶. نگاشت صفحه‌ها به endpointها

    | صفحه | endpointها |
    |---|---|
    | همه صفحات (هدر/فوتر/منو/جستجو/سبد کشویی) | `GET /config`، `GET /categories`، `GET /search/suggest`، `GET /search/hints`، `GET /cart`، `GET /me/wishlist/ids`، `POST /newsletter/subscriptions` |
    | خانه `index` | `GET /home` (یا جداگانه: `/campaigns/active`، `/banners`، `/testimonials`، `/products?sort=newest`) |
    | فروشگاه `products` | `GET /products` (+`includeFacets`)، `GET /products/facets`، `GET /colors` |
    | جزئیات محصول `product` | `GET /products/{idOrSlug}`، `GET /products/{id}/reviews`، `POST /products/{id}/reviews`، `GET /products/{id}/related`، `POST /products/{id}/stock-alerts`، `GET /products/{id}/inquiry`، `POST /cart/items`، `PUT /me/wishlist/items/{id}` |
    | سبد `cart` | `GET/POST/PATCH/DELETE /cart/...`، `PUT /cart/shipping-method`، `PUT /cart/reservation`، `POST/DELETE /cart/discount-code`، `POST /cart/items/{id}/move-to-wishlist` |
    | تسویه `checkout` | `GET /checkout`، `POST /orders`، `GET /payments/{id}`، `GET /geo/provinces` |
    | ورود `login` | `POST /auth/otp/send`، `POST /auth/otp/verify`، `PATCH /me` |
    | حساب `account` | `GET /me/dashboard`، `GET /me/orders`، `GET /me/orders/{code}`، `GET /me/tracking`، `/me/addresses`، `/me/wishlist`، `GET /me/reviews`، `GET/PATCH /me` |
    | کارهای سفارش در `account` (طبق `actions`) | `POST /me/orders/{code}/payments`، `POST /me/orders/{code}/cancel`، `POST /me/orders/{code}/media-feedback`، `POST /me/orders/{code}/returns`، `GET /me/orders/{code}/invoice` |
    | علاقه‌مندی `wishlist` | `GET /me/wishlist`، `DELETE /me/wishlist`، `POST /me/wishlist/add-to-cart`، `POST/DELETE /me/wishlist/share` |
    | لیست اشتراکی `wishlist/shared/{token}` (بدون ورود) | `GET /wishlists/shared/{token}` |
    | پیگیری `track` | `POST /tracking/lookup`، `GET /tracking/daily/days`، `GET /tracking/daily` |
    | بلاگ | `GET /blog/categories`، `GET /blog/posts`، `GET /blog/posts/{idOrSlug}`، `GET /blog/posts/{id}/related`، `POST /blog/posts/{id}/feedback` |
    | سوالات متداول `faq` | `GET /faq` |
    | تماس `contact` | `GET /contact/topics`، `POST /contact/messages` (ساعات پاسخگویی در `/config`) |
    | درباره ما `about` | `GET /site/stats`، `GET /pages/{slug}` |
servers:
  - url: https://api.kiva.ir/api/v1
    description: Production
  - url: https://staging-api.kiva.ir/api/v1
    description: Staging
  - url: '{scheme}://{host}:{port}/api/v1'
    description: Local development
    variables:
      scheme:
        enum: [http, https]
        default: http
      host:
        default: localhost
      port:
        default: '8080'
security: []
