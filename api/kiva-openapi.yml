      summary: "همه‌ی گروه‌ها و سوالات متداول، به همان شکلی که `PUT` می‌گیرد"
      description: |
        بدون کش (برخلاف `GET /faq` که تا ۵ دقیقه کش می‌شود)، تا فرم بعد از ذخیره نسخه‌ی کهنه نبیند.
        `questionHighlighted` و `answerHighlighted` این‌جا همیشه `null` هستند.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
