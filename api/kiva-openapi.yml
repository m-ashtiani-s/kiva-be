        `CATEGORY`؛ ناموجود `400 MEDIA_NOT_FOUND`، `purpose` ِ دیگر `400 MEDIA_PURPOSE_MISMATCH`) ← slug ِ تکراری `409 DUPLICATE_SLUG`.
      security: [{ bearerAuth: [] }]
      requestBody:
