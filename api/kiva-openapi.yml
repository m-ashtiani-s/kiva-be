        به ترتیب `waitingCount` نزولی و بعد `oldestAt` صعودی. شماره‌ی مشترکین در این لیست نمی‌آید. پیامک‌ها را یک کار زمان‌بندی‌شده تا ۵ دقیقه بعد از
        موجود شدن، **از هر راهی** (تنظیم موجودی، رسیدن مرجوعی، انقضا یا لغو سفارش، انتشار دوباره)، می‌فرستد؛ نه بین ۲۲ تا ۸ صبح تهران.
        `inStock = true` یعنی همین الان موجود است (پیامک به‌زودی می‌رود). فیلتر `inStock` جز `true`/`false` ← `400 BOOLEAN_INVALID`.
      security: [{ bearerAuth: [] }]
