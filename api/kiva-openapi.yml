paths:
  # ================================================================
  #  CONFIG & HOME
  # ================================================================
  /config:
    get:
      tags: [Config & Home]
      operationId: getSiteConfig
      summary: "تنظیمات سراسری سایت (هدر، فوتر، ارسال، رزرو، پیام‌رسان‌ها، درگاه‌ها، پشتیبانی)"
      description: |
        یک‌بار در بارگذاری اپ گرفته و کش می‌شود. همه‌ی عددهای ثابتی که الان در `kiva.js` هاردکد شده‌اند
        (`SHIPPING`، `FREE_POST`، `MSGR`، پیام‌های نوار اطلاعیه، ساعت کاری، آستانه‌ی موجودی کم و ...) از این‌جا می‌آیند.
        با `ETag` و `Cache-Control: public, max-age=300` کش می‌شود؛ درخواست با `If-None-Match` برابر `304` بدون بدنه می‌گیرد.
        منبع هر بخش در `SiteConfig`: عددها و لیست‌ها همان تنظیمات `PUT /admin/settings` و همان چیزی‌اند که سبد و تسویه می‌خوانند؛
        متن‌های برند، فوتر و نشان‌ها محتوای ثابت سایت‌اند (فعلاً بدون endpoint پنل). `support.isOpenNow` و `announcements` به لحظه‌ی
        ساختن پاسخ وابسته‌اند، پس تا ۵ دقیقه ممکن است کهنه باشند.
      responses:
        '200':
          description: OK
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SiteConfig' }
        '304':
          description: تغییری نکرده (`If-None-Match` همان `ETag` فعلی است)؛ بدون بدنه
  /home:
