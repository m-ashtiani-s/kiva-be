  /search/suggest:
    get:
      tags: [Search]
      operationId: searchSuggest
      summary: "جستجوی زنده‌ی هدر (حداکثر ۸ محصول + دسته‌ها و رنگ‌های منطبق)"
      description: |
        جستجو روی نام محصول، نام دسته، نام رنگ‌ها و متریال انجام می‌شود و همه‌ی کلمات باید منطبق باشند (AND).
        اگر کلمه‌ای از نام رنگ در عبارت باشد (مثلاً «کیف مشکی»)، `matchedColorKey` همان رنگ است تا تصویر و لینک با همان رنگ باز شوند.
        `nameHighlighted` با تگ `<mark>` آماده‌ی نمایش است (HTML-escaped).
      security: [{}, { bearerAuth: [] }]
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 100, example: کراس مشکی }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 20, default: 8 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchSuggestResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
  /search/hints:
    get:
      tags: [Search]
      operationId: getSearchHints
      summary: "پیشنهادهای اولیه‌ی پنل جستجو (دسته‌ها، رنگ‌ها، جستجوهای پرتکرار)"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchHints' }

  # ================================================================
  #  CART
  # ================================================================
  /cart:
    get:
      tags: [Cart]
      operationId: getCart
      summary: "سبد خرید جاری (مهمان با X-Cart-Token یا کاربر با Bearer)"
      description: |
        پاسخ همه‌ی محاسبات را آماده دارد: جمع‌ها، تخفیف‌ها، هزینه‌ی هر روش ارسال، نوار پیشرفت ارسال رایگان،
        مبلغ صرفه‌جویی، وضعیت رزرو و `issues` (تغییر قیمت/ناموجود شدن از آخرین بازدید).

        **کدام سبد:** با Bearer معتبر، سبد کاربر (`X-Cart-Token` نادیده گرفته می‌شود). بدون Bearer، سبد مهمانِ همان `X-Cart-Token`.
        سبد مهمان تازه **فقط** وقتی ساخته می‌شود که توکن نیامده باشد یا ناشناخته یا بدشکل باشد؛ توکن تازه در هدر `X-Cart-Token` برمی‌گردد.
        Bearer منقضی یا نامعتبر `401` می‌گیرد و هرگز مهمان حساب نمی‌شود. همین قاعده برای همه‌ی endpointهای سبد است.

        **همگام‌سازی:** هر خواندن سبد، ردیف‌ها را با قیمت و موجودی فعلی فروشگاه مقایسه می‌کند. تعداد بیشتر از سقف کم می‌شود (وقتی سقف خرید محصول بین رنگ‌هایش
        کم بیاید، ردیف قدیمی‌تر سهمش را نگه می‌دارد و ردیفی که جایی برایش نماند حذف می‌شود)، روش ارسال غیرفعال‌شده
        به روش پیش‌فرض برمی‌گردد، و `issues` همه‌ی این تغییرها را می‌گوید. هر issue فقط **یک بار** برمی‌گردد، چون همین خواندن «دیده شد» را ثبت می‌کند.

        این endpoint را فقط از مرورگر صدا بزنید، نه از رندر سمت سرور (SSR)؛ وگرنه هر بازدید یک سبد خالی مهمان می‌سازد.
      security: [{}, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/CartToken'
      responses:
        '200':
          description: OK
          headers:
            X-Cart-Token: { $ref: '#/components/headers/XCartToken' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
    delete:
      tags: [Cart]
      operationId: clearCart
      summary: "خالی کردن سبد"
      description: ردیف‌ها، کد تخفیف و سوییچ رزرو پاک می‌شوند؛ روش ارسال انتخاب‌شده می‌ماند.
      security: [{}, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/CartToken'
      responses:
        '200':
          description: سبد خالی
          headers:
            X-Cart-Token: { $ref: '#/components/headers/XCartToken' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
  /cart/items:
    post:
      tags: [Cart]
      operationId: addCartItem
      summary: "افزودن به سبد (اگر همان ورینت/رنگ موجود باشد تعداد جمع می‌شود)"
      description: |
        تعداد نهایی هر ردیف حداکثر `maxQuantity` آن است: min(موجودی آن رنگ، `maxPerOrder` − تعداد بقیه‌ی رنگ‌های همان محصول در سبد).
        اگر درخواست بیشتر باشد به سقف کاهش داده می‌شود و `Cart.issues` شامل `QUANTITY_REDUCED` خواهد بود (کلاینت تُست «حداکثر موجودی: n عدد» را نشان می‌دهد).
        برای «افزودن سریع» از کارت محصول، `variantId` رنگِ فعال روی کارت ارسال می‌شود.
      security: [{}, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/CartToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddCartItemRequest' }
      responses:
        '200':
          description: سبد به‌روز شد
          headers:
            X-Cart-Token: { $ref: '#/components/headers/XCartToken' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CartMutationResponse' }
        '404':
          description: "`VARIANT_NOT_FOUND` — رنگی با این شناسه نیست"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: |
            `OUT_OF_STOCK` این رنگ موجودی ندارد ·
            `PRODUCT_UNAVAILABLE` محصول یا این رنگش در فروشگاه نیست ·
            `QUANTITY_EXCEEDS_LIMIT` سقف خرید این محصول را رنگ‌های دیگرش در سبد پر کرده‌اند، با وجود موجودی (`meta.maxPerOrder`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '400': { $ref: '#/components/responses/ValidationError' }
  /cart/items/{itemId}:
    patch:
      tags: [Cart]
      operationId: updateCartItem
      summary: "تغییر تعداد یا رنگ یک ردیف سبد"
      description: |
        حداقل یکی از `quantity` و `variantId` لازم است؛ وگرنه `400` روی `quantity` (`QUANTITY_OR_VARIANT_REQUIRED`). با هر دو، اول رنگ و بعد تعداد روی ردیفی که می‌ماند.
        `itemId` بدشکل مثل ردیفی که در این سبد نیست `404 CART_ITEM_NOT_FOUND` می‌گیرد.

        **تعداد:** برخلاف افزودن، کم نمی‌شود و رد می‌شود: بیشتر از موجودی رنگ ← `QUANTITY_EXCEEDS_STOCK`؛ در موجودی جا می‌شود ولی از سقف خرید محصول
        (با حساب بقیه‌ی رنگ‌هایش در سبد) بیشتر است ← `QUANTITY_EXCEEDS_LIMIT`.

        **رنگ** [پیشنهادی]: رنگ تازه باید مال همان محصول باشد، وگرنه `400` روی `variantId` (`VARIANT_ID_INVALID`). اگر رنگ تازه از قبل ردیف دارد، دو ردیف **یکی** می‌شوند
        (تعدادها جمع، تا سقف؛ بیشتر از سقف با `QUANTITY_REDUCED` کم می‌شود) و `affectedItemId` شناسه‌ی ردیفی است که می‌ماند.
      security: [{}, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/CartToken'
        - $ref: '#/components/parameters/CartItemId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateCartItemRequest' }
      responses:
        '200':
          description: OK
          headers:
            X-Cart-Token: { $ref: '#/components/headers/XCartToken' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CartMutationResponse' }
        '404':
          description: "`CART_ITEM_NOT_FOUND` — این ردیف در این سبد نیست"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: |
            `QUANTITY_EXCEEDS_STOCK` (`meta.availableQuantity` = همان `maxQuantity` ردیف؛ موجودی دقیق لو نمی‌رود) ·
            `QUANTITY_EXCEEDS_LIMIT` (`meta.maxQuantity`) ·
            `OUT_OF_STOCK` رنگ تازه موجودی ندارد ·
            `PRODUCT_UNAVAILABLE` محصول یا رنگ تازه در فروشگاه نیست
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '400': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Cart]
      operationId: removeCartItem
      summary: "حذف ردیف از سبد"
      description: کلاینت برای «برگردون» (undo) کافی است همان `variantId` و `quantity` را دوباره POST کند؛ این دو در `removedItem` برگردانده می‌شوند.
      security: [{}, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/CartToken'
        - $ref: '#/components/parameters/CartItemId'
      responses:
        '200':
          description: OK
          headers:
            X-Cart-Token: { $ref: '#/components/headers/XCartToken' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CartMutationResponse' }
        '404':
          description: "`CART_ITEM_NOT_FOUND` — این ردیف در این سبد نیست"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /cart/items/{itemId}/move-to-wishlist:
    post:
      tags: [Cart]
      operationId: moveCartItemToWishlist
      summary: "انتقال از سبد به علاقه‌مندی‌ها (نیازمند ورود)"
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/CartItemId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CartMutationResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /cart/shipping-method:
    put:
      tags: [Cart]
      operationId: setCartShippingMethod
      summary: "انتخاب روش ارسال (تیپاکس / پست)"
      security: [{}, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/CartToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [method]
              properties:
                method: { $ref: '#/components/schemas/ShippingMethodCode' }
      responses:
        '200':
          description: OK
          headers:
            X-Cart-Token: { $ref: '#/components/headers/XCartToken' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '422':
          description: "`SHIPPING_METHOD_UNAVAILABLE` — این روش غیرفعال است، یا سبد به رزرو فعال می‌پیوندد و فقط روش ارسال گروه مجاز است"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '400': { $ref: '#/components/responses/ValidationError' }
  /cart/reservation:
    put:
      tags: [Cart]
      operationId: setCartReservation
      summary: "فعال/غیرفعال کردن رزرو ۴ روزه"
      description: |
        فقط وقتی `cart.reservation.available = true` است می‌توان رزرو را فعال کرد (دلیل در دسترس نبودن در `unavailableReason`).
        غیرفعال کردن همیشه مجاز است.
      security: [{}, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/CartToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean, example: true }
      responses:
        '200':
          description: OK
          headers:
            X-Cart-Token: { $ref: '#/components/headers/XCartToken' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '422':
          description: "`RESERVATION_UNAVAILABLE` — رزرو برای این سبد در دسترس نیست (`meta.reason` = همان `unavailableReason`)"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '400': { $ref: '#/components/responses/ValidationError' }
  /cart/discount-code:
    post:
      tags: [Cart]
      operationId: applyDiscountCode
      summary: "اعمال کد تخفیف"
      description: |
        کد trim، ارقامش لاتین و حروفش بزرگ می‌شود (`kiva10 ` و `KIVA۱۰` هر دو `KIVA10`) و جای کد قبلی سبد را می‌گیرد. سبد اول همگام‌سازی می‌شود.
        کد خالی ← `400` روی `code` (`DISCOUNT_CODE_REQUIRED`)؛ متنی که هیچ کدی نمی‌تواند باشد ← همان `422 DISCOUNT_CODE_INVALID`.
        کدی که رد شود کد قبلی سبد را دست نمی‌زند. ترتیب `422`ها در «قوانین کسب‌وکار».
      security: [{}, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/CartToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApplyDiscountCodeRequest' }
      responses:
        '200':
          description: اعمال شد — `Cart.discount` شامل کد، برچسب و مبلغ است
          headers:
            X-Cart-Token: { $ref: '#/components/headers/XCartToken' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '422':
          description: |
            `DISCOUNT_CODE_INVALID` «این کد تخفیف معتبر نیست»،
            `DISCOUNT_MIN_SUBTOTAL_NOT_MET` «این کد برای خرید بالای ۲٬۰۰۰٬۰۰۰ تومان فعاله» (`meta.minSubtotal`)،
            `DISCOUNT_CODE_NOT_STARTED`، `DISCOUNT_CODE_EXPIRED`، `DISCOUNT_FIRST_ORDER_ONLY`، `DISCOUNT_USAGE_LIMIT_REACHED`، `DISCOUNT_LOGIN_REQUIRED`، `DISCOUNT_NOT_APPLICABLE`
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    delete:
      tags: [Cart]
      operationId: removeDiscountCode
      summary: "حذف کد تخفیف"
      description: سبد بدون کد هم `200` می‌گیرد.
      security: [{}, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/CartToken'
      responses:
        '200':
          description: OK
          headers:
            X-Cart-Token: { $ref: '#/components/headers/XCartToken' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
  /cart/merge:
    post:
      tags: [Cart]
      operationId: mergeGuestCart
      summary: "ادغام سبد مهمان در سبد کاربر (اگر در verify انجام نشده باشد)"
      description: |
        همان ادغامی که `POST /auth/otp/verify` با `guestCartToken` انجام می‌دهد:
        * هر ردیف مهمان به سبد کاربر اضافه می‌شود؛ رنگ مشترک تعدادش جمع می‌شود (در ردیف کاربر) و بیشتر از سقف با `QUANTITY_REDUCED` (در `issues`) کم می‌شود.
          رنگی که فقط مهمان داشت با همان `id` منتقل می‌شود. وقتی سقف خرید محصول کم بیاید، ردیف قدیمی‌تر (زودتر اضافه‌شده، در هر کدام از دو سبد)
          سهمش را نگه می‌دارد و ردیفی که جایی برایش نماند حذف می‌شود (`QUANTITY_REDUCED` به `0`).
        * روش ارسال و سوییچ رزرو سبد مهمان برنده‌اند (مشتری همین الان روی صفحه‌ی سبد انتخابشان کرده)، ولی فقط وقتی سبد مهمان ردیفی دارد:
          سبد مهمان خالی (که هر بازدید می‌سازد) چیزی انتخاب نکرده و روش ارسال و سوییچ رزرو کاربر سر جایشان می‌مانند. کد تخفیف: اگر کاربر کد داشت همان می‌ماند، وگرنه کد مهمان (بعد از اعتبارسنجی دوباره).
        * سبد مهمان (خالی یا نه) حذف می‌شود و توکنش دیگر کار نمی‌کند.
        * هر دو سبد مثل `GET /cart` همگام‌سازی می‌شوند، پس `issues` ِ پاسخ تغییرهای از آخرین بازدید هر دو سبد و کم شدن‌های خود ادغام را دارد (هر کدام یک بار).

        توکنی که سبدی ندارد (قبلاً ادغام شده، پاک شده، ساختگی یا بدشکل است) هیچ کاری نمی‌کند و خطا هم نمی‌دهد: `200` با سبد کاربر بدون ادغام
        (همگام‌سازی‌شده مثل `GET /cart`). پس تکرار ادغام (بعد از verify، یا از دو تب) بی‌خطر است. `400` فقط وقتی `guestCartToken` نیامده یا رشته نیست.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [guestCartToken]
              properties:
                guestCartToken: { type: string, example: 'gct_7f3a9c2e1b' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }

        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  # ================================================================
  #  CHECKOUT & PAYMENT
  # ================================================================
  /checkout:
    get:
      tags: [Checkout & Payment]
      operationId: getCheckoutContext
      summary: "همه‌ی داده‌ی صفحه‌ی تکمیل خرید در یک درخواست"
      description: |
        شامل سبد (با جمع‌ها)، آدرس‌های ذخیره‌شده و آدرس پیش‌فرض، پیام‌رسان پیش‌فرض و شماره‌ی آخرین استفاده‌شده،
        گزینه‌های ارسال با قیمت محاسبه‌شده، وضعیت رزرو (تاریخ ارسال بعد از ۴ روز)، درگاه‌های فعال،
        و اگر کاربر رزرو فعال داشته باشد پیشنهاد **پیوستن به سفارش رزروی** (`consolidation`).
        سبد مثل `GET /cart` همگام‌سازی می‌شود، پس `cart.issues` تغییرهای از آخرین بازدید را دارد (هر کدام یک بار).
        `shippingOptions`، `reservation` و `consolidation` ِ بالای پاسخ همان‌های `cart` اند.
        اگر سبد هیچ ردیفی نداشته باشد `422 CART_EMPTY`. ردیفی که قابل خرید نیست (`purchasable = false`) هم ردیف است: صفحه نشانش می‌دهد و `POST /orders` ردش می‌کند.
        ترتیب خطاها مثل `POST /orders`: اول `CART_EMPTY`، بعد `addressId`.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: addressId
          in: query
          description: |
            برای محاسبه‌ی مجدد (مثلاً امکان ادغام با رزرو فقط برای همان آدرس است). نیامده = آدرس پیش‌فرض.
            آدرسی که مال این کاربر نیست، وجود ندارد یا عدد نیست `400` روی فیلد `addressId` با کد `ADDRESS_NOT_FOUND` می‌گیرد (هر سه یکی، تا معلوم نشود آدرس کس دیگری وجود دارد).
          schema: { type: integer }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckoutContext' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422':
          description: "`CART_EMPTY`"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '400': { $ref: '#/components/responses/ValidationError' }
  /orders:
    post:
      tags: [Checkout & Payment]
      operationId: placeOrder
      summary: "ثبت سفارش و دریافت لینک درگاه پرداخت"
      description: |
        قیمت‌ها و همه‌ی مبلغ‌ها را سرور حساب می‌کند. `expectedPayable` فقط برای مقایسه است و هیچ عددی که کلاینت می‌فرستد پول جابه‌جا نمی‌کند.

        **اول، شکل ورودی** (`400 VALIDATION_ERROR`، همه‌ی خطاها با هم): هدر `Idempotency-Key`، دقیقاً یکی از `addressId` و `newAddress`
        (خطاهای `newAddress` با پیشوند `newAddress.` در `errors[].field`، مثل `newAddress.postalCode`)، مقدار enumها، طول یادداشت‌ها، و `expectedPayable ≥ 0`.
        کدهای فیلد: هیچ آدرسی ← `addressId` با `ADDRESS_REQUIRED`، هر دو ← `addressId` با `ADDRESS_AMBIGUOUS`؛ `shippingMethod` یا `paymentGateway` نیامده ←
        `SHIPPING_METHOD_REQUIRED` و `PAYMENT_GATEWAY_REQUIRED`؛ `preShipmentMessenger.channel` بیرون از فهرست ← `MESSENGER_CHANNEL_INVALID`؛
        `expectedPayable` منفی ← `MONEY_NEGATIVE`؛ `gift.message` و `customerNote` و `preShipmentMessenger.username`/`note` با کدهای طولشان.

        **بعد، قانون‌ها به این ترتیب** (اولین موردی که برقرار نباشد برمی‌گردد):
        1. سبد هیچ ردیفی ندارد ← `422 CART_EMPTY`
        2. `addressId` وجود ندارد یا مال کاربر دیگری است ← `422 ADDRESS_NOT_FOUND`. برای `newAddress`: استان یا شهر ناموجود ← `400` روی `newAddress.provinceId` یا
           `newAddress.cityId` (`PROVINCE_NOT_FOUND`، `CITY_NOT_FOUND`)، شهرِ استان دیگر ← `422 CITY_NOT_IN_PROVINCE`
        3. `preShipmentMessenger` نیامده یا `channel` ندارد ← `422 MESSENGER_REQUIRED`؛ شماره‌ی پیام‌رسان نیامده یا غلط است ← `422 MESSENGER_PHONE_INVALID`
        4. روش ارسال غیرفعال است (یا سفارش به رزرو فعال می‌پیوندد و روش، روش گروه نیست) ← `422 SHIPPING_METHOD_UNAVAILABLE`
        5. مبلغ قابل پرداخت بیشتر از صفر است و درگاه انتخابی در دسترس نیست ← `422 PAYMENT_GATEWAY_UNAVAILABLE` (بدون `meta.orderCode`: سفارشی ساخته نشده)
        6. `acceptTerms` نیست ← `422 TERMS_NOT_ACCEPTED`
        7. `reserve = true` ولی رزرو در دسترس نیست ← `422 RESERVATION_UNAVAILABLE` (`meta.reason`)
        8. کاربر ۳ سفارش پرداخت‌نشده دارد که هنوز موجودی نگه داشته‌اند (مهلت پرداختشان تمام نشده) ← `429 RATE_LIMITED`
        9. ردیفی از فروشگاه خارج شده ← `422 PRODUCT_UNAVAILABLE`؛ ردیفی موجودی کافی ندارد ← `422 OUT_OF_STOCK`؛ رنگ‌های یک محصول با هم بیشتر از سقف خرید آن محصول‌اند
           (سقف بعد از افزودن به سبد کم شده) ← `422 QUANTITY_EXCEEDS_LIMIT`. هر سه با `meta.itemIds` (شناسه‌ی ردیف‌های سبد)، و به همین ترتیب.
        10. کد تخفیف سبد دیگر معتبر نیست ← سفارش بدون کد حساب می‌شود (و چون مبلغ عوض شده، قدم بعد `PRICE_CHANGED` می‌دهد)
        11. `expectedPayable` با مبلغ سرور فرق دارد ← `409 PRICE_CHANGED` (`meta.payable` = مبلغ تازه)

        هر کدام از این‌ها رد شود **هیچ چیزی** ذخیره نمی‌شود: سبد سر جایش است و موجودی کنار گذاشته نشده.

        **ثبت:** موجودی ردیف‌ها تا `payment.expiresAt` (۱۵ دقیقه) کنار گذاشته می‌شود و سبد خالی می‌شود. بعد سرور جلسه‌ی پرداخت را در درگاه باز می‌کند:
        * موفق ← `201`، سفارش `PENDING_PAYMENT`، کاربر را به `payment.redirect` بفرستید.
        * درگاه جواب نداد یا رد کرد ← `422 PAYMENT_GATEWAY_UNAVAILABLE` **با** `meta.orderCode` و `meta.paymentId`. سفارش ساخته شده و موجودی‌اش کنار گذاشته شده؛
          ادامه با `POST /payments/{paymentId}/retry` (همان درگاه یا درگاه دیگر)، نه با ثبت دوباره. وجود `meta.orderCode` این حالت را از قدم ۵ جدا می‌کند.
        * مبلغ قابل پرداخت صفر (کد تخفیف کامل) ← `201` با `payment = null`؛ سفارش مستقیماً پرداخت‌شده است.

        **تکرار با همان `Idempotency-Key`:** همان سفارش و همان پرداخت برمی‌گردد، از جمله همان `422 PAYMENT_GATEWAY_UNAVAILABLE`، با وضعیت **فعلی** سفارش (شاید دیگر پرداخت شده باشد).
        تکرار هیچ‌وقت جلسه‌ی تازه‌ای در درگاه باز نمی‌کند؛ `payment.redirect` همان قبلی است. درخواستی که رد شد (۴۰۰، ۴۰۹، ۴۲۲ ِ قبل از ثبت، ۴۲۹) کلید را مصرف نمی‌کند.
        دو درخواست همزمان از یک سبد (دو تب، با دو کلید): یکی ثبت می‌شود و دیگری `422 CART_EMPTY` می‌گیرد.

        **رزرو:** اگر کاربر رزرو فعال به همین آدرس داشته باشد، سفارش بدون توجه به `reserve` به گروه رزرو می‌پیوندد (هزینه‌ی ارسال صفر) — قوانین کامل در بخش «قوانین کسب‌وکار».
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlaceOrderRequest' }
      responses:
        '201':
          description: سفارش ساخته شد؛ کاربر را به `payment.redirect` هدایت کنید
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlaceOrderResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: "`PRICE_CHANGED` (با `meta.payable`) یا `IDEMPOTENCY_KEY_REUSED` (همان کلید با بدنه‌ی دیگر)"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: |
            `CART_EMPTY`، `ADDRESS_NOT_FOUND`، `CITY_NOT_IN_PROVINCE` (`newAddress`)، `MESSENGER_REQUIRED`، `MESSENGER_PHONE_INVALID`، `SHIPPING_METHOD_UNAVAILABLE`، `TERMS_NOT_ACCEPTED`،
            `RESERVATION_UNAVAILABLE` (`meta.reason`)، `PRODUCT_UNAVAILABLE`، `OUT_OF_STOCK` و `QUANTITY_EXCEEDS_LIMIT` (`meta.itemIds`)،
            `PAYMENT_GATEWAY_UNAVAILABLE` (قبل از ثبت بدون meta؛ بعد از ثبت با `meta.orderCode` و `meta.paymentId`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429':
          description: |
            `RATE_LIMITED` — کاربر ۳ سفارش پرداخت‌نشده دارد که هنوز موجودی نگه داشته‌اند.
            `Retry-After` و `meta.retryAfterSeconds` = ثانیه‌های باقی‌مانده تا پایان مهلت پرداخت زودترین‌شان.
          headers:
            Retry-After: { $ref: '#/components/headers/RetryAfter' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /payment-callbacks/{gateway}:
    get:
      tags: [Checkout & Payment]
      operationId: paymentCallbackGet
      summary: "بازگشت از درگاه (سرور به سرور / مرورگر) — فقط برای بک‌اند"
      description: |
        پارامترهای مخصوص هر درگاه را می‌گیرد (زرین‌پال: `Authority`, `Status` — سامان: `RefNum`, `State`, `ResNum` — ملت: `RefId`, `ResCode`, `SaleOrderId`, `SaleReferenceId`)،
        تراکنش را verify می‌کند و با `302` کاربر را به `https://kiva.ir/checkout/result?paymentId=...` هدایت می‌کند.

        * تراکنش از روی شناسه‌ای که خود درگاه داده (زرین‌پال: `Authority`) پیدا می‌شود، و verify سرور به سرور با مبلغی انجام می‌شود که سرور خودش ذخیره کرده، نه با چیزی از این درخواست.
        * verify فقط وقتی انجام می‌شود که سفارش هنوز در انتظار پرداخت باشد. اگر سفارش منقضی شده یا با تلاش دیگری پرداخت شده، verify **نمی‌شود**،
          تراکنش `FAILED` می‌شود و درگاه مبلغ را خودش به کارت برمی‌گرداند.
        * **پرداخت مانده** (تلاش با `purpose = BALANCE`، بعد از درخواست تغییر): verify فقط وقتی انجام می‌شود که `balanceDue` ِ سفارش هنوز **دقیقاً همان مبلغ تلاش** باشد.
          اگر مانده صفر شده (تلاش دیگری پرداختش کرده) یا عوض شده (اپراتور دوباره تغییر داده) یا سفارش لغو شده، verify نمی‌شود و همان مسیر بالا (`FAILED`) را می‌رود.
        * اگر تلاش دیگری از **همین سفارش** همان لحظه در حال verify است، این تلاش فعلاً verify نمی‌شود و `PENDING` می‌ماند (هیچ‌وقت دو تلاش یک سفارش با هم verify نمی‌شوند).
          سرور بعداً خودش تمامش می‌کند: اگر آن تلاش موفق شد این یکی `FAILED` می‌شود و درگاه مبلغش را برمی‌گرداند، وگرنه همین یکی verify می‌شود.
        * این مسیر هیچ‌وقت JSON یا صفحه‌ی خطا نشان نمی‌دهد و **همیشه** `302` است. تراکنش پیدا نشد (یا پارامترها مال این درگاه نیست، یا درگاهی است که هنوز
          پیاده‌سازی نشده مثل `saman` و `mellat`، یا خطای داخلی پیش آمد) ← هدایت به همان صفحه‌ی نتیجه **بدون** `paymentId`؛ وضعیت سفارش در «سفارش‌های من» دیده می‌شود.
        * صدا زدن دوباره (refresh، یا GET و POST با هم) چیزی را عوض نمی‌کند و همان هدایت را تکرار می‌کند.
        * مقصد هدایت ثابت است و از تنظیمات سرور می‌آید؛ فقط `paymentId` به آن اضافه می‌شود.
      parameters:
        - $ref: '#/components/parameters/GatewayPath'
      responses:
        '302':
          description: هدایت به صفحه‌ی نتیجه‌ی فرانت
          headers:
            Location:
              schema: { type: string, example: 'https://kiva.ir/checkout/result?paymentId=pay_01J9X2' }
    post:
      tags: [Checkout & Payment]
      operationId: paymentCallbackPost
      summary: "بازگشت از درگاه با متد POST (سامان/ملت)"
      parameters:
        - $ref: '#/components/parameters/GatewayPath'
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: { type: string }
      responses:
        '302':
          description: هدایت به صفحه‌ی نتیجه‌ی فرانت
  /payments/{paymentId}:
    get:
      tags: [Checkout & Payment]
      operationId: getPaymentResult
      summary: "نتیجه‌ی پرداخت برای صفحه‌ی موفقیت (کد سفارش، مراحل بعدی) یا خطا"
      description: |
        `status = PENDING` روی صفحه‌ی نتیجه یعنی «verify در جریان است» (مثلاً درگاه دیر جواب داده). کلاینت هر ۳ ثانیه و حداکثر ۳۰ ثانیه دوباره می‌پرسد.
        اگر بعد از آن هم `PENDING` بود، سرور خودش پرداخت را با درگاه پیگیری و تمام می‌کند و نتیجه در «سفارش‌های من» دیده می‌شود.
        تراکنش کاربر دیگر `404 PAYMENT_NOT_FOUND` می‌گیرد، مثل تراکنشی که وجود ندارد، و همین‌طور شناسه‌ای که شکل `pay_…` ندارد.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/PaymentId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentResult' }
        '404':
          description: "`PAYMENT_NOT_FOUND`"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /payments/{paymentId}/retry:
    post:
      tags: [Checkout & Payment]
      operationId: retryPayment
      summary: "پرداخت مجدد سفارش پرداخت‌نشده (در صورت شکست/انصراف) — امکان تغییر درگاه"
      description: |
        یک تراکنش تازه به مبلغ `totals.payable` سفارش ساخته می‌شود؛ `gateway` نیامده (یا بدنه‌ای نیامده) = درگاه همین تراکنش. `gateway` نامعتبر ← `400` روی `gateway`.
        `expiresAt` همان پایان مهلت پرداخت سفارش است و **تمدید نمی‌شود**؛ بعد از آن `PAYMENT_EXPIRED`.
        تلاش‌های قبلی لغو نمی‌شوند: اگر تلاشی قدیمی (مثلاً در تب دیگر) اول پرداخت شود همان برنده است، و تلاش‌های بعدی verify نمی‌شوند و درگاه مبلغشان را برمی‌گرداند.
        هر سفارش حداکثر ۱۰ تلاش پرداخت دارد. تکرار با همان `Idempotency-Key` همان تراکنش را برمی‌گرداند (مثل `POST /orders`)؛ کلید مال همین نوع درخواست است،
        پس همان UUID روی `POST /me/orders/{orderCode}/payments` کلید دیگری است.

        ترتیب قانون‌ها: تراکنش مال کاربر نیست یا شناسه شکل `pay_…` ندارد (`404`) ← `ORDER_ALREADY_PAID` ← `PAYMENT_EXPIRED` ← درگاه در دسترس نیست
        (`PAYMENT_GATEWAY_UNAVAILABLE` **بدون** `meta`، تراکنشی ساخته نشد) ← ۱۰ تلاش (`429`). اگر تراکنش ساخته شد ولی درگاه جواب نداد،
        `422 PAYMENT_GATEWAY_UNAVAILABLE` **با** `meta.orderCode` و `meta.paymentId` (همان رفتار `POST /orders`)؛ ادامه با retry ِ همین `paymentId`.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/PaymentId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                gateway: { $ref: '#/components/schemas/PaymentGatewayCode' }
      responses:
        '201':
          description: تراکنش جدید
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentInit' }
        '409':
          description: "`IDEMPOTENCY_KEY_REUSED` (همان کلید با بدنه‌ی دیگر)"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: "`ORDER_ALREADY_PAID`، `PAYMENT_EXPIRED` (مهلت پرداخت تمام شده و موجودی آزاد شده یا می‌شود) یا `PAYMENT_GATEWAY_UNAVAILABLE` (درگاه انتخابی در دسترس نیست یا جواب نداد)"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429':
          description: |
            `RATE_LIMITED` — این سفارش ۱۰ تلاش پرداخت داشته است.
            `Retry-After` و `meta.retryAfterSeconds` = ثانیه‌های باقی‌مانده تا پایان مهلت پرداخت سفارش؛ بعد از آن سفارش منقضی می‌شود و با «خرید دوباره» می‌شود از نو سفارش داد.
          headers:
            Retry-After: { $ref: '#/components/headers/RetryAfter' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: "`PAYMENT_NOT_FOUND` — تراکنشی با این شناسه برای این کاربر نیست"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  # ================================================================
  #  TRACKING (public)
  # ================================================================
  /tracking/lookup:
    post:
      tags: [Tracking]
      operationId: guestTrackOrder
      summary: "پیگیری سفارش بدون ورود با شماره سفارش + موبایل"
      description: |
        به‌خاطر حریم خصوصی، شماره موبایل در بدنه‌ی POST ارسال می‌شود نه در URL.
        خروجی نسخه‌ی محدود سفارش است (بدون آدرس و قیمت‌ها؛ حداکثر ۴ عکس پیش‌نمایش).
        موبایل باید موبایل خریدار یا گیرنده باشد. در صورت عدم تطابق، برای جلوگیری از حدس زدن، همان `404 TRACKING_NOT_FOUND` برمی‌گردد.
        **فقط سفارش پرداخت‌شده** (هر وضعیتی جز `PENDING_PAYMENT`، `PAYMENT_FAILED` و `EXPIRED`). کد بدشکل، سفارش ناموجود یا پرداخت‌نشده و موبایل دیگر
        همه همان `404 TRACKING_NOT_FOUND` با بدنه‌ی یکسان‌اند؛ فقط موبایل بدشکل `400` روی `phone` است. `orderCode` با ارقام فارسی هم پذیرفته است.
        سقف: ۱۰ درخواست در ۱۰ دقیقه برای هر IP (`429`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GuestTrackingRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GuestTrackingResult' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /tracking/daily/days:
    get:
      tags: [Tracking]
      operationId: listDailyShipmentDays
      summary: "تب‌های روزهای اخیر (امروز، دیروز، ...) با تعداد مرسوله‌ی هر روز"
      description: |
        روزها از امروز (به وقت تهران) به عقب. `shipmentCount` تعداد **کدهای رهگیری** یکتای آن روز است (سفارش‌های یک گروه رزرو یک کد).
      parameters:
        - name: days
          in: query
          schema: { type: integer, minimum: 1, maximum: 30, default: 10 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DailyShipmentDay' }
        '400': { $ref: '#/components/responses/ValidationError' }
  /tracking/daily:
    get:
      tags: [Tracking]
      operationId: listDailyShipments
      summary: "کدهای رهگیری ارسال‌های یک روز (اطلاعات گیرنده ماسک‌شده)"
      description: |
        جستجو با ۴ رقم آخر موبایل، حرف اول نام یا نام شهر. نام‌ها و موبایل‌ها **همیشه ماسک‌شده** از سرور می‌آیند
        (`س*** م***`، `09** *** 4821`) و داده‌ی کامل هرگز به این endpoint عمومی نمی‌رسد.
        **یک ردیف برای هر کد رهگیری** (سفارش‌های یک گروه یک ردیف)، فقط مرسوله‌هایی که `showInDailyList` دارند، و **فقط ۳۰ روز اخیر**
        (`date` ِ قدیمی‌تر یا آینده یک لیست خالی است). `q`: چهار رقم ← چهار رقم آخر موبایل گیرنده؛ یک حرف ← حرف اول نام گیرنده؛ وگرنه شهر شامل متن.
        ترتیب: زمان ارسال، تازه‌ترین اول.
      parameters:
        - name: date
          in: query
          required: true
          schema: { type: string, format: date, example: '2026-10-05' }
        - name: q
          in: query
          schema: { type: string, maxLength: 20, example: '4821' }
        - $ref: '#/components/parameters/Page'
        - name: size
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DailyShipmentListResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }

  # ================================================================
  #  ACCOUNT / PROFILE
  # ================================================================
  /me:
    get:
      tags: [Account]
      operationId: getMe
      summary: "اطلاعات کاربر جاری"
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [Account]
      operationId: updateMe
      summary: "ویرایش اطلاعات شخصی (نام، ایمیل، تولد، جنسیت، پیام‌رسان پیش‌فرض، پیامک تخفیف)"
      description: فقط فیلدهای ارسال‌شده تغییر می‌کنند. ارسال `null` برای فیلدهای اختیاری یعنی پاک کردن.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProfileRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [Account]
      operationId: deleteMe
      summary: "حذف حساب کاربری (با OTP تأیید) [پیشنهادی — بعد از فاز سفارش]"
      description: |
        کد را اول از `POST /me/deletion/request` بگیر. با حذف، اطلاعات شخصی (نام، ایمیل، تولد، پیام‌رسان) پاک،
        همه‌ی نشست‌ها باطل و شماره آزاد می‌شود؛ سفارش‌های قبلی برای حسابداری بی‌نام می‌مانند.
        کسی که سفارش جاری دارد (پرداخت‌شده و هنوز تحویل‌نشده، یا رزرو فعال) نمی‌تواند حساب را حذف کند.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [otpCode]
              properties:
                otpCode: { type: string, pattern: '^\d{5}$' }
                reason: { type: string, maxLength: 300 }
      responses:
        '204':
          description: حساب حذف شد
          headers:
            Set-Cookie: { $ref: '#/components/headers/ClearRefreshCookie' }
        '422':
          description: "`OTP_INVALID` (با `meta.attemptsLeft`)، `OTP_EXPIRED`، `OTP_TOO_MANY_ATTEMPTS` یا `ACCOUNT_HAS_ACTIVE_ORDERS`"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /me/deletion/request:
    post:
      tags: [Account]
      operationId: requestAccountDeletion
      summary: "ارسال کد تأیید حذف حساب به موبایل خود کاربر [پیشنهادی — بعد از فاز سفارش]"
      description: کد فقط برای `DELETE /me` معتبر است، نه برای ورود؛ و کد ورود هم برای حذف حساب پذیرفته نمی‌شود.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: کد ارسال شد
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SendOtpResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /me/phone-change/request:
    post:
      tags: [Account]
      operationId: requestPhoneChange
      summary: "درخواست تغییر شماره موبایل — ارسال کد به شماره‌ی فعلی و شماره‌ی جدید [پیشنهادی]"
      description: |
        برای امنیت، مالکیت **هر دو** شماره باید ثابت شود: یک کد به شماره‌ی فعلی و یک کد به شماره‌ی جدید می‌رود.
        (اگر فقط شماره‌ی جدید چک شود، کسی که یک accessToken را دزدیده می‌تواند حساب را برای همیشه به شماره‌ی خودش ببرد.)
        کسی که به شماره‌ی فعلی‌اش دسترسی ندارد، تغییر شماره را از پشتیبانی می‌خواهد.
        اینکه شماره‌ی جدید مال حساب دیگری است، عمداً اینجا گفته نمی‌شود (فقط بعد از تأیید هر دو کد، در verify)،
        تا این endpoint راهی برای فهمیدن «این شماره در کیوا حساب دارد؟» نباشد.
        شماره‌ی تکراری: `400 VALIDATION_ERROR` با `errors[].field = newPhone` و `code = PHONE_SAME_AS_CURRENT`.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newPhone]
              properties:
                newPhone: { $ref: '#/components/schemas/PhoneNumber' }
      responses:
        '200':
          description: هر دو کد ارسال شد (با همان تایمرها)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PhoneChangeOtpResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /me/phone-change/verify:
    post:
      tags: [Account]
      operationId: verifyPhoneChange
      summary: "تأیید هر دو کد و تغییر شماره [پیشنهادی]"
      description: |
        بعد از تغییر: همه‌ی نشست‌های قبلی (همه‌ی دستگاه‌ها) باطل می‌شوند، یک نشست تازه برای همین دستگاه ساخته می‌شود
        (کوکی جدید + accessToken جدید در پاسخ)، و یک پیامک هشدار به شماره‌ی **قبلی** می‌رود.
        در `422`ها، `meta.field` می‌گوید کدام کد مشکل دارد (`currentPhoneCode` یا `newPhoneCode`).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newPhone, currentPhoneCode, newPhoneCode]
              properties:
                newPhone: { $ref: '#/components/schemas/PhoneNumber' }
                currentPhoneCode: { type: string, pattern: '^\d{5}$', description: کدی که به شماره‌ی فعلی رفت }
                newPhoneCode: { type: string, pattern: '^\d{5}$', description: کدی که به شماره‌ی جدید رفت }
      responses:
        '200':
          description: شماره عوض شد
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetRefreshCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PhoneChangeResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: "`PHONE_ALREADY_REGISTERED`: شماره‌ی جدید مال حساب دیگری است"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: "`OTP_INVALID` (با `meta.attemptsLeft` و `meta.field`)، `OTP_EXPIRED` یا `OTP_TOO_MANY_ATTEMPTS` (با `meta.field`)"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /me/dashboard:
    get:
      tags: [Account]
      operationId: getMyDashboard
      summary: "سربرگ حساب کاربری — سلام، کارت‌های آمار و شمارنده‌های منوی کناری"
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountDashboard' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ================================================================
  #  ADDRESSES
  # ================================================================
  /me/addresses:
    get:
      tags: [Addresses]
      operationId: listMyAddresses
      summary: "آدرس‌های من (آدرس پیش‌فرض اول)"
      description: آدرس پیش‌فرض اول، بعد بقیه به ترتیب ثبت (قدیمی‌ترین اول). وقتی دفترچه آدرسی دارد، دقیقاً یکی از آن‌ها پیش‌فرض است.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Address' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Addresses]
      operationId: createAddress
      summary: "افزودن آدرس جدید"
      description: |
        اولین آدرس همیشه پیش‌فرض می‌شود؛ آدرس‌های بعدی فقط با `setAsDefault: true` (و پیش‌فرض قبلی دیگر پیش‌فرض نیست).
        همه‌ی خطاهای فیلدها با هم در یک `400` می‌آیند. استان یا شهری که در فهرست نیست `400` روی همان فیلد است
        (`PROVINCE_NOT_FOUND`، `CITY_NOT_FOUND`)؛ شهر واقعیِ استانی دیگر `422 CITY_NOT_IN_PROVINCE`.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddressInput' }
      responses:
        '201':
          description: ساخته شد
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Address' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '422':
          description: "`CITY_NOT_IN_PROVINCE` یا `ADDRESS_LIMIT_REACHED` (حداکثر ۲۰ آدرس)"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me/addresses/{addressId}:
    get:
      tags: [Addresses]
      operationId: getAddress
      summary: "یک آدرس"
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/AddressId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Address' }
        '404':
          description: "`ADDRESS_NOT_FOUND` — این آدرس در دفترچه‌ی این کاربر نیست (آدرس کاربر دیگر هم همین جواب را می‌گیرد)"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [Addresses]
      operationId: updateAddress
      summary: "ویرایش آدرس"
      description: |
        همه‌ی فیلدها دوباره فرستاده می‌شوند (جایگزینی کامل). سفارش‌های قبلی تغییر نمی‌کنند چون یک snapshot از آدرس در سفارش ذخیره شده است.
        `setAsDefault: true` این آدرس را پیش‌فرض می‌کند؛ `false` هیچ‌وقت پیش‌فرض بودن را برنمی‌دارد، چون همیشه یکی باید پیش‌فرض باشد
        (پیش‌فرض فقط با پیش‌فرض کردن آدرسی دیگر عوض می‌شود).
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/AddressId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddressInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Address' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404':
          description: "`ADDRESS_NOT_FOUND` — این آدرس در دفترچه‌ی این کاربر نیست (آدرس کاربر دیگر هم همین جواب را می‌گیرد)"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: "`CITY_NOT_IN_PROVINCE`"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [Addresses]
      operationId: deleteAddress
      summary: "حذف آدرس (اگر پیش‌فرض بود، قدیمی‌ترین آدرس بعدی پیش‌فرض می‌شود)"
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/AddressId'
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '404':
