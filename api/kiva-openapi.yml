      description: |
        فقط پنل می‌بیند؛ ویرایش و حذف ندارد. `text` بعد از حذف فاصله‌های دو طرف ۱ تا ۱۰۰۰ نویسه (`400 NOTE_REQUIRED` / `NOTE_TOO_LONG`).
        `author` اسم نمایشی اپراتور است. در لاگ تغییرات فقط ثبت یادداشت می‌آید، نه متنش.
