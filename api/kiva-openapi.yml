        '400': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Wishlist]
      operationId: clearMyWishlist
      summary: "پاک کردن کل لیست علاقه‌مندی‌ها"
      security: [{ bearerAuth: [] }]
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me/wishlist/ids:
    get:
      tags: [Wishlist]
