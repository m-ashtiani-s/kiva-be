        status: { type: string, enum: [ACTIVE, NOTIFIED, CANCELLED] }
        createdAt: { type: string, format: date-time }
        notifiedAt: { type: string, format: date-time, nullable: true }
        message: { type: string, description: '`ACTIVE` «هر وقت موجود شد، بهت پیامک می‌دیم»؛ `NOTIFIED` «موجود شد و بهت خبر دادیم»؛ `CANCELLED` «اشتراک لغو شد»', example: هر وقت موجود شد، بهت پیامک می‌دیم }
