      x-roles: [ADMIN, OPERATOR]
      operationId: adminCloseReturn
      summary: "بستن مرجوعی بدون استرداد (← CLOSED)"
      description: |
        از `APPROVED` یا `PICKUP_SCHEDULED` (کالا هیچ‌وقت نرسید) یا `RECEIVED` (بازبینی رد شد و کالا به مشتری برمی‌گردد).
        دلیل برای مشتری پیامک و در جزئیات مرجوعی نمایش داده می‌شود. سفارش به `DELIVERED` برمی‌گردد.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: returnId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
