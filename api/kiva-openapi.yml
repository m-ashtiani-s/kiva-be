    patch:
      tags: [Admin · Orders]
      x-roles: [ADMIN]
      operationId: adminUpdateRefund
      summary: "پیگیری استرداد: در حال انجام، انجام شد (با شماره‌ی پیگیری بانک) یا ناموفق"
      description: |
        انتقال‌های مجاز: `PENDING → PROCESSING`، `PENDING|PROCESSING → COMPLETED`، `PENDING|PROCESSING → FAILED`. `COMPLETED` و `FAILED` پایانی‌اند؛
        برای استرداد ناموفق یک استرداد تازه ثبت کنید.
        `COMPLETED`: `completedAt` همین لحظه است و `referenceId` (شماره‌ی پیگیری انتقال بانکی، تا ۶۴ نویسه از `[0-9A-Za-z-]`)
        **برای `COMPLETED` همیشه لازم است** (`400 REFERENCE_ID_REQUIRED`).
        مبلغ به `totals.refunded` سفارش اضافه می‌شود (و یک ردیف در تایم‌لاین)، اگر به مرجوعی وصل است آن مرجوعی `REFUNDED` می‌شود، و به مشتری پیامک می‌رود.
        `note` به‌عنوان `statusNote` برای مشتری هم دیده می‌شود (مثلاً «شماره شبا تأیید نشد؛ دوباره باهات تماس می‌گیریم»).
        استرداد ناموجود یا شناسه‌ای که عدد مثبت نیست ← `404 REFUND_NOT_FOUND`.
      security: [{ bearerAuth: [] }]
      parameters:
