      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TrackingDayGroup' }

        '401': { $ref: '#/components/responses/Unauthorized' }
