    put:
      tags: [Admin · Content]
      x-roles: [ADMIN, CONTENT_EDITOR]
      operationId: adminReplaceFaq
      summary: "ذخیره‌ی کامل گروه‌ها و سوالات متداول (با ترتیب)"
      description: |
        **کل درخت** را جایگزین می‌کند: گروه یا سؤالی که در بدنه نیست حذف می‌شود، پس فرم را از `GET /admin/faq/groups` پر کنید.
        ترتیب = ترتیب آرایه‌ها. حداکثر ۲۰ گروه (`400 FAQ_TOO_MANY` روی فیلد `groups`، با `meta.maxItems`). قانون‌های هر گروه و سؤال در `FaqGroupInput`
        و `FaqItemInput`؛ همه‌ی مشکل‌ها با هم و با مسیر (`2.questions.0.answer`). جواب‌ها پاک‌سازی می‌شوند. پاسخ کل درخت ذخیره‌شده است؛
        هر ذخیره‌ی تغییردهنده یک ردیف `FAQ_SAVED` در لاگ تغییرات.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              maxItems: 20
              items: { $ref: '#/components/schemas/FaqGroupInput' }
      responses:
