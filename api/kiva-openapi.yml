      type: object
      required: [phone, code]
      properties:
        phone: { $ref: '#/components/schemas/PhoneNumber' }
        code: { type: string, pattern: '^\d{5}$', example: '48213', description: ارقام فارسی هم پذیرفته می‌شوند }
        guestCartToken: { type: string, nullable: true, description: 'برای ادغام سبد مهمان در سبد کاربر (مثل `POST /cart/merge`)، فقط بعد از کد درست؛ کد اشتباه سبد مهمان را دست نمی‌زند. توکنی که سبدی ندارد (یا بدشکل است) نادیده گرفته می‌شود و ورود را خراب نمی‌کند.', example: 'gct_7f3a9c2e1b' }
        device:
          type: object
          nullable: true
          description: نام دستگاه برای نمایش نشست‌ها؛ اگر نیاید، سرور از `User-Agent` می‌سازد. فقط برای نمایش است، نه امنیت.
          properties:
            name: { type: string, maxLength: 100, example: Chrome on Android }
    AuthTokens:
      type: object
      description: refreshToken اینجا نیست؛ در کوکی `kiva_rt` است (بخش ۲).
      required: [accessToken, tokenType, expiresIn, refreshExpiresIn]
      properties:
        accessToken: { type: string, example: 'eyJhbGciOiJIUzI1NiIs...' }
        tokenType: { type: string, enum: [Bearer] }
        expiresIn: { type: integer, description: عمر accessToken به ثانیه, example: 900 }
        refreshExpiresIn: { type: integer, description: عمر کوکی نشست به ثانیه (مشتری ۳۰ روز، پنل ۱۲ ساعت), example: 2592000 }
    AuthResponse:
      allOf:
        - $ref: '#/components/schemas/AuthTokens'
        - type: object
          required: [isNewUser, user, cart]
          properties:
            isNewUser: { type: boolean, description: true → مرحله‌ی «به کیوا خوش اومدی! دوست داری چی صدات کنیم؟» }
            user: { $ref: '#/components/schemas/User' }
            cart:
              allOf: [{ $ref: '#/components/schemas/Cart' }]
              description: سبد کاربر بعد از ادغام سبد مهمان (اگر `guestCartToken` آمده بود)؛ همیشه هست، حتی خالی. مثل `GET /cart` همگام‌سازی می‌شود، پس `issues` تغییرهای از آخرین بازدید را دارد (یک بار). کلاینت بعد از آن توکن مهمان را دور می‌ریزد.
    PhoneChangeResponse:
      allOf:
        - $ref: '#/components/schemas/AuthTokens'
        - type: object
          required: [user]
          properties:
            user: { $ref: '#/components/schemas/User' }

    # ============ USER ============
    UserRole:
      type: string
      description: |
        `CUSTOMER` را همه دارند و برداشتنی نیست. بقیه نقش‌های پنل‌اند (جدول نقش‌ها در بخش ۲):
        `ADMIN` همه‌کار · `CATALOG_MANAGER` محصول و موجودی · `OPERATOR` سفارش و ارسال · `CONTENT_EDITOR` محتوا و بنر · `SUPPORT` نظرات، تماس و مشتریان
      enum: [CUSTOMER, ADMIN, CATALOG_MANAGER, OPERATOR, CONTENT_EDITOR, SUPPORT]
    Gender:
      type: string
      enum: [FEMALE, MALE, UNSPECIFIED]
    User:
      type: object
      required: [id, phone]
      properties:
        id: { type: integer, example: 1024 }
        phone: { $ref: '#/components/schemas/PhoneNumber' }
        firstName: { type: string, nullable: true, example: سارا }
        lastName: { type: string, nullable: true, example: محمدی }
        fullName: { type: string, nullable: true, example: سارا محمدی }
        displayName: { type: string, description: «سلام سارا» یا «دوست عزیز», example: سارا }
        avatarInitial: { type: string, example: س }
        email: { type: string, format: email, nullable: true, example: sara@example.com }
        birthDate: { type: string, format: date, nullable: true, description: میلادی؛ نمایش شمسی در کلاینت (برای هدیه تولد), example: '1996-09-10' }
        gender: { $ref: '#/components/schemas/Gender' }
        defaultMessenger: { type: string, allOf: [{ $ref: '#/components/schemas/PhotoMessengerChannel' }], nullable: true }
        defaultMessengerPhone: { type: string, allOf: [{ $ref: '#/components/schemas/PhoneNumber' }], nullable: true }
        marketingSmsOptIn: { type: boolean, description: «دریافت پیامک تخفیف‌ها و کالکشن‌های جدید», example: true }
        roles:
          type: array
          items: { $ref: '#/components/schemas/UserRole' }
        createdAt: { type: string, format: date-time }
    UpdateProfileRequest:
      type: object
      properties:
        firstName: { type: string, maxLength: 50, nullable: true, example: سارا }
        lastName: { type: string, maxLength: 50, nullable: true, example: محمدی }
        email: { type: string, format: email, nullable: true }
        birthDate: { type: string, format: date, nullable: true }
        gender: { $ref: '#/components/schemas/Gender' }
        defaultMessenger: { type: string, allOf: [{ $ref: '#/components/schemas/PhotoMessengerChannel' }], nullable: true }
        defaultMessengerPhone: { type: string, allOf: [{ $ref: '#/components/schemas/PhoneNumber' }], nullable: true }
        marketingSmsOptIn: { type: boolean }
    AccountDashboard:
      type: object
      properties:
        greeting: { type: string, example: سلام سارا }
        user: { $ref: '#/components/schemas/User' }
        stats:
          type: object
          description: چهار کارت آمار بالای حساب
          properties:
            ordersTotal: { type: integer, description: کل سفارش‌ها, example: 4 }
            ordersActive: { type: integer, description: سفارش جاری, example: 3 }
            mediaReceived: { type: integer, description: عکس و ویدیوی دریافتی, example: 12 }
            wishlistCount: { type: integer, description: علاقه‌مندی, example: 3 }
        navCounts:
          type: object
          description: شمارنده‌های منوی کناری
          properties:
            orders: { type: integer, example: 4 }
            addresses: { type: integer, example: 1 }
            wishlist: { type: integer, example: 3 }
            reviews: { type: integer, example: 2 }
        activeReservation: { type: object, allOf: [{ $ref: '#/components/schemas/ReservationInfo' }], nullable: true }
        pendingReviewCount: { type: integer, description: '[پیشنهادی] کالاهای تحویل‌شده بدون نظر', example: 1 }

    # ============ ADDRESS / GEO ============
    City:
      type: object
      required: [id, name]
      properties:
        id: { type: integer, example: 394 }
        name: { type: string, example: تهران }
        provinceId: { type: integer, example: 8 }
    Province:
      type: object
      required: [id, name]
      properties:
        id: { type: integer, example: 8 }
        name: { type: string, example: تهران }
        cities:
          type: array
          nullable: true
          description: شهرهای استان به ترتیب الفبا؛ `null` وقتی با `includeCities=false` خواسته شده
          items: { $ref: '#/components/schemas/City' }
    Address:
      type: object
      required: [id, provinceId, provinceName, cityId, cityName, addressLine, postalCode, recipientName, recipientPhone, isDefault]
      properties:
        id: { type: integer, example: 42 }
        title: { type: string, nullable: true, example: خانه }
        provinceId: { type: integer, example: 8 }
        provinceName: { type: string, example: تهران }
        cityId: { type: integer, example: 394 }
        cityName: { type: string, example: تهران }
        addressLine: { type: string, example: 'خیابان ولیعصر، بالاتر از پارک ساعی، کوچه نسترن، پلاک ۱۲، واحد ۴' }
        plaque: { type: string, nullable: true }
        unit: { type: string, nullable: true }
        postalCode: { $ref: '#/components/schemas/PostalCode' }
        recipientName: { type: string, example: سارا محمدی }
        recipientPhone: { $ref: '#/components/schemas/PhoneNumber' }
        isSelfRecipient: { type: boolean, example: true }
        isDefault: { type: boolean, example: true }
        location:
          type: object
          nullable: true
          properties:
            lat: { type: number, format: double }
            lng: { type: number, format: double }
        fullText: { type: string, description: '«استان، شهر، آدرس»، و اگر فرستاده شده‌اند «پلاک …» و «واحد …» (با ارقام فارسی)', example: 'تهران، تهران، خیابان ولیعصر، بالاتر از پارک ساعی، کوچه نسترن، پلاک ۱۲، واحد ۴' }
        createdAt: { type: string, format: date-time }

    # ============ WISHLIST ============
    WishlistItem:
      type: object
      required: [product, addedAt]
      properties:
        product: { $ref: '#/components/schemas/ProductSummary' }
        addedAt: { type: string, format: date-time }
        preferredColorKey: { type: string, allOf: [{ $ref: '#/components/schemas/ColorKey' }], nullable: true }
        priceAtAdd: { allOf: [{ $ref: '#/components/schemas/Money' }], description: قیمت در لحظه‌ی ذخیره, example: 1990000 }
        priceDrop:
          type: object
          nullable: true
          description: «از وقتی ذخیره کردی ۱۵٪ ارزون‌تر شده»
          properties:
            amount: { allOf: [{ $ref: '#/components/schemas/Money' }], example: 300000 }
            percent: { type: integer, example: 15 }
            label: { type: string, example: از وقتی ذخیره کردی ۱۵٪ ارزون‌تر شده }
    Wishlist:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/WishlistItem' }
        meta: { $ref: '#/components/schemas/PageMeta' }
        count: { type: integer, example: 3 }
        inStockCount: { type: integer, description: برای دکمه‌ی «افزودن همه موجودها به سبد (۲)», example: 2 }
        share: { type: object, allOf: [{ $ref: '#/components/schemas/WishlistShare' }], nullable: true }
    WishlistToggleResponse:
      type: object
      properties:
        productId: { type: integer, example: 7 }
        wishlisted: { type: boolean, example: true }
        count: { type: integer, description: برای بج قلب هدر, example: 4 }
        message: { type: string, example: به علاقه‌مندی‌ها اضافه شد }
    WishlistAddToCartResponse:
      type: object
      properties:
        cart: { $ref: '#/components/schemas/Cart' }
        addedCount: { type: integer, example: 2 }
        skipped:
          type: array
          items:
            type: object
            properties:
              productId: { type: integer }
              name: { type: string }
              reason: { type: string, enum: [OUT_OF_STOCK, UNAVAILABLE, ALREADY_AT_MAX] }
        message: { type: string, example: ۲ کیف به سبد اضافه شد }
    WishlistShare:
      type: object
      properties:
        token: { type: string, example: 'wl_9Kq2Xz' }
        url: { type: string, format: uri, description: 'سرور با الگوی `https://kiva.ir/wishlist/shared/{token}` می‌سازد (مسیر صفحه‌ی فرانت)', example: 'https://kiva.ir/wishlist/shared/wl_9Kq2Xz' }
        createdAt: { type: string, format: date-time }
    SharedWishlist:
      type: object
      properties:
        ownerDisplayName: { type: string, example: سارا }
        items:
          type: array
          items: { $ref: '#/components/schemas/ProductSummary' }

    # ============ SITE CONFIG ============
    ShippingMethod:
      type: object
      properties:
        code: { $ref: '#/components/schemas/ShippingMethodCode' }
        name: { type: string, example: تیپاکس }
        description: { type: string, description: 'ساخته‌شده از `minDays` و `maxDays`، پس همیشه با آن‌ها جور است. فقط خواندنی: در PUT نادیده گرفته می‌شود.', example: تحویل ۱ تا ۲ روز کاری }
        baseCost: { allOf: [{ $ref: '#/components/schemas/Money' }], example: 145000 }
        minDays: { type: integer, example: 1 }
        maxDays: { type: integer, example: 2 }
        icon: { $ref: '#/components/schemas/IconName' }
        trackingUrlTemplate: { type: string, example: 'https://tipaxco.com/tracking?code={code}' }
        isActive: { type: boolean, example: true }
    Announcement:
      type: object
      description: پیام چرخشی نوار بالای سایت
      required: [id, icon, text, url, sortOrder, startsAt, endsAt]
      properties:
        id: { type: integer, example: 1 }
        icon: { type: string, nullable: true, allOf: [{ $ref: '#/components/schemas/IconName' }] }
        text: { type: string, example: هرچی ببینی، همون می‌رسه — قبل از ارسال، عکس کیف خودت رو برات می‌فرستیم }
        url: { type: string, nullable: true }
        sortOrder: { type: integer, description: 'جای پیام در لیست (۰، ۱، …)؛ از ترتیب آرایه‌ی `PUT` ساخته می‌شود' }
        startsAt: { type: string, format: date-time, nullable: true }
        endsAt: { type: string, format: date-time, nullable: true }
    AnnouncementInput:
      type: object
      description: |
        یک پیام در بدنه‌ی `PUT /admin/announcements`. با `id` همان پیام قبلی است و بی `id` پیام تازه؛ `id` ِ ناشناخته ←
        `400 ANNOUNCEMENT_NOT_FOUND` و `id` ِ تکراری ← `400 LIST_ITEM_DUPLICATE`. ترتیب = ترتیب آرایه (`sortOrder` اگر بیاید نادیده).
      required: [text]
      properties:
        id: { type: integer, nullable: true }
        icon: { type: string, nullable: true, description: 'اسم آیکن (`ICON_INVALID`)' }
        text: { type: string, minLength: 1, maxLength: 200, description: '`ANNOUNCEMENT_TEXT_REQUIRED` / `TEXT_TOO_LONG`' }
        url: { type: string, nullable: true, maxLength: 300, description: '`null`، آدرس کامل `https://`، یا مسیر نسبی که با یک `/` شروع می‌شود (نه `//`)؛ وگرنه `URL_INVALID`' }
        startsAt: { type: string, format: date-time, nullable: true }
        endsAt: { type: string, format: date-time, nullable: true, description: 'اگر هر دو هست، بعد از `startsAt` (`DATE_RANGE_INVALID`)' }
    SupportHours:
      type: object
      properties:
        label: { type: string, example: شنبه تا چهارشنبه }
        weekdays:
          type: array
          items: { type: string, enum: [SATURDAY, SUNDAY, MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY] }
        from: { type: string, nullable: true, pattern: '^\d{2}:\d{2}$', example: '09:00' }
        to: { type: string, nullable: true, pattern: '^\d{2}:\d{2}$', example: '21:00' }
        messengerOnly: { type: boolean, description: «جمعه و تعطیلات — فقط پیام‌رسان», example: false }
    SocialLink:
      type: object
      properties:
        channel: { $ref: '#/components/schemas/SocialChannel' }
        name: { type: string, example: تلگرام }
        url: { type: string, format: uri, example: 'https://t.me/kiva_shop' }
        handle: { type: string, example: '@kiva_shop' }
    SiteConfig:
      type: object
      description: |
        همه‌ی فیلدها همیشه هستند (فیلد بی‌مقدار `null`). منبع هر بخش:
        - تنظیمات فروشگاه (`PUT /admin/settings`): `shipping`، `reservation.enabled`/`holdDays`، `returns.windowDays`،
          `inventory.lowStockThreshold`، `paymentGateways`، `support.phone`/`email`/`hours`، `social`، `features`.
        - محتوای ثابت سایت (فعلاً فقط با به‌روزرسانی سرور): `brand`، `currency.label`، `reservation.description`، `returns.policyUrl`،
          `preShipmentPhoto.title`/`description`، `support.emailResponseHint`/`responseTimeHint`، `productPerks`، `trustBadges`، `footerLinks`.
        - ساخته‌ی سرور: `support.phoneDisplay`، `support.isOpenNow`، `auth`، `preShipmentPhoto.channels`/`enabled`/`required`، `currency.code`.
      required: [brand, currency, announcements, shipping, reservation, returns, preShipmentPhoto, inventory, auth, support, social, paymentGateways, productPerks, trustBadges, footerLinks, features]
      properties:
        brand:
          type: object
          required: [name, slogan, about, logoUrl, logoWhiteUrl, faviconUrl]
          properties:
            name: { type: string, example: کیوا }
            slogan: { type: string, example: هرچی ببینی، همون می‌رسه. }
            about: { type: string }
            logoUrl: { type: string, format: uri }
            logoWhiteUrl: { type: string, format: uri }
            faviconUrl: { type: string, format: uri }
        currency:
          type: object
          required: [code, label]
          properties:
            code: { $ref: '#/components/schemas/Currency' }
            label: { type: string, example: تومان }
        announcements:
          type: array
          description: 'فقط پیام‌هایی که **الان** در بازه‌شان هستند (`startsAt ≤ الان < endsAt`؛ `null` یعنی باز)، به ترتیب نمایش'
          items: { $ref: '#/components/schemas/Announcement' }
        shipping:
          type: object
          required: [methods, freeShippingThreshold, freeShippingMethods, nonShippingWeekdays]
          properties:
            methods:
              type: array
              description: فقط روش‌های فعال، به ترتیب تنظیمات (همان‌هایی که سبد پیشنهاد می‌دهد)
              items: { $ref: '#/components/schemas/ShippingMethod' }
            freeShippingThreshold: { allOf: [{ $ref: '#/components/schemas/Money' }], example: 3000000 }
            freeShippingMethods:
              type: array
              items: { $ref: '#/components/schemas/ShippingMethodCode' }
              example: [POST]
            nonShippingWeekdays:
              type: array
              items: { type: string, enum: [SATURDAY, SUNDAY, MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY] }
              example: [FRIDAY]
        reservation:
          type: object
          required: [enabled, holdDays, description]
          properties:
            enabled: { type: boolean, example: true }
            holdDays: { type: integer, example: 4 }
            description: { type: string, example: الان کامل پرداخت کن، ۴ روز بعد برات ارسال می‌شه. }
        returns:
          type: object
          required: [windowDays, policyUrl]
          properties:
            windowDays: { type: integer, example: 7 }
            policyUrl: { type: string, example: /faq#return }
        preShipmentPhoto:
          type: object
          required: [enabled, required, channels, title, description]
          properties:
            enabled: { type: boolean, description: همیشه `true` (عکس قبل از ارسال قدم هر سفارش است), example: true }
            required: { type: boolean, description: همیشه `true`, example: true }
            channels:
              type: array
              description: همان پیام‌رسان‌های صفحه‌ی تسویه (`CheckoutContext.messengers`)
              items: { $ref: '#/components/schemas/MessengerOption' }
            title: { type: string, example: قبل از ارسال، عکس همین کیف رو می‌بینی }
            description: { type: string }
        inventory:
          type: object
          required: [lowStockThreshold]
          properties:
            lowStockThreshold: { type: integer, example: 5 }
        auth:
          type: object
          required: [otpLength, resendCooldownSeconds]
          properties:
            otpLength: { type: integer, example: 5 }
            resendCooldownSeconds: { type: integer, example: 120 }
        support:
          type: object
          required: [phone, phoneDisplay, email, emailResponseHint, responseTimeHint, hours, isOpenNow]
          properties:
            phone: { type: string, nullable: true, example: '02191001234' }
            phoneDisplay:
              type: string
              nullable: true
              description: 'ساخته‌ی سرور از `phone` با ارقام فارسی: ثابت `۰۲۱-۹۱۰۰۱۲۳۴`، موبایل `۰۹۱۲-۳۴۵-۶۷۸۹`؛ بی‌شماره `null`'
              example: ۰۲۱-۹۱۰۰۱۲۳۴
            email: { type: string, format: email, nullable: true, example: support@kiva.ir }
            emailResponseHint: { type: string, example: پاسخ تا ۲۴ ساعت }
            responseTimeHint: { type: string, example: معمولاً کمتر از یک ساعت جواب می‌دیم }
            hours:
              type: array
              items: { $ref: '#/components/schemas/SupportHours' }
            isOpenNow:
              type: boolean
              description: |
                «الان پاسخگوییم» / «خارج از ساعت کاری»، با ساعت تهران: الان در یکی از ردیف‌های `hours` است که روز امروز را دارد،
                `from ≤ الان < to` و `messengerOnly` ش `false` است. ردیف بی‌ساعت یا «فقط پیام‌رسان» هیچ‌وقت `true` نمی‌دهد.
                به خاطر کش تا ۵ دقیقه ممکن است کهنه باشد.
        social:
          type: array
          items: { $ref: '#/components/schemas/SocialLink' }
        paymentGateways:
          type: array
          description: همان درگاه‌های صفحه‌ی تسویه، با همان `available` و `isDefault`
          items: { $ref: '#/components/schemas/PaymentGateway' }
        productPerks:
          type: array
          items: { $ref: '#/components/schemas/Perk' }
        trustBadges:
          type: array
          items:
            type: object
            required: [type, label, imageUrl, linkUrl]
            properties:
              type: { type: string, enum: [ENAMAD, SAMANDEHI] }
              label: { type: string, example: نماد اعتماد الکترونیکی }
              imageUrl: { type: string, format: uri }
              linkUrl: { type: string, format: uri }
        footerLinks:
          type: array
          items:
            type: object
            required: [group, links]
            properties:
              group: { type: string, example: راهنمای خرید }
              links:
                type: array
                items:
                  type: object
                  required: [label, url]
                  properties:
                    label: { type: string, example: کدهای رهگیری روزانه }
                    url: { type: string, example: /track#daily }
        features:
          type: object
          description: 'feature flagها، همان `features` ِ تنظیمات (`wishlistShare`، `reviewMedia`، `giftWrap`)'
          additionalProperties: { type: boolean }
          example: { wishlistShare: false, reviewMedia: false, giftWrap: false }

    # ============ HOME / MARKETING ============
    BannerPlacement:
      type: string
      enum: [HOME_HERO, HOME_PROMO, SHOP_TOP, PRODUCT_SIDEBAR, BLOG_TOP]
    Banner:
      type: object
      properties:
        id: { type: integer, example: 3 }
        placement: { $ref: '#/components/schemas/BannerPlacement' }
        theme: { type: string, enum: [CREAM, PURPLE, LILAC, DARK, WHITE], example: CREAM }
        tag:
          type: object
          nullable: true
          properties:
            label: { type: string, example: رزرو ۴ روزه }
            icon: { $ref: '#/components/schemas/IconName' }
        title: { type: string, example: 'الان بخر، همه رو یکجا تحویل بگیر' }
        text: { type: string, example: پول کیف رو بده و تا ۴ روز رزروش کن؛ هر خرید دیگه‌ای هم داشتی، همه با یک هزینه ارسال می‌رسه. }
        cta:
          type: object
          properties:
            label: { type: string, example: بیشتر بدونم }
            url: { type: string, example: /faq#reserve }
        image: { $ref: '#/components/schemas/MediaAsset' }
        overlay:
          type: object
          nullable: true
          description: برچسب روی عکس (مثلاً «۴ روز رزرو» یا «عکس کیف شما — در بله ارسال شد»)
          properties:
            highlight: { type: string, nullable: true, example: '4' }
            title: { type: string, example: روز رزرو }
            subtitle: { type: string, example: یک هزینه ارسال }
            channel: { type: string, allOf: [{ $ref: '#/components/schemas/SocialChannel' }], nullable: true }
        sortOrder: { type: integer }
        startsAt: { type: string, format: date-time, nullable: true }
        endsAt: { type: string, format: date-time, nullable: true }
    Campaign:
      type: object
      properties:
        id: { type: integer, example: 5 }
        slug: { type: string, example: paeez-1405 }
        title: { type: string, example: جشنواره پاییزه }
        subtitle: { type: string, example: تا پایان جشنواره فرصت داری }
        icon: { $ref: '#/components/schemas/IconName' }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time, description: مقصد شمارنده‌ی معکوس }
        serverTime: { type: string, format: date-time, description: برای همگام‌سازی شمارنده با ساعت سرور }
        products:
          type: array
          description: محصولات تخفیف‌دار موجود به ترتیب بیشترین درصد تخفیف
          items: { $ref: '#/components/schemas/ProductSummary' }
        seeAllUrl: { type: string, example: '/products?onSale=true' }
        isActive: { type: boolean, example: true }
    SatisfactionSummary:
      type: object
      properties:
        averageRating: { type: number, minimum: 0, maximum: 5, description: حداکثر یک رقم اعشار, example: 4.9 }
        scale: { type: integer, description: 'همیشه ۵؛ در `PUT /admin/settings` فقط خواندنی', example: 5 }
        totalCount: { type: integer, minimum: 0, description: «بر اساس ۲٬۴۸۰ نظر و پیام ثبت‌شده», example: 2480 }
        metrics:
          type: array
          items:
            type: object
            properties:
              key: { type: string, enum: [PHOTO_MATCH, QUALITY, SHIPPING_SPEED, PACKAGING, SUPPORT] }
              label: { type: string, description: 'از روی `key` ساخته می‌شود؛ در `PUT /admin/settings` فقط خواندنی', example: تطابق با عکس }
              percent: { type: integer, minimum: 0, maximum: 100, example: 98 }
        sources:
          type: array
          items: { $ref: '#/components/schemas/SocialChannel' }
    Testimonial:
      type: object
      properties:
        id: { type: integer, example: 1 }
        customerName: { type: string, example: سارا }
        customerInitial: { type: string, example: س }
        city: { type: string, example: تهران }
        source: { $ref: '#/components/schemas/SocialChannel' }
        sourceName: { type: string, example: تلگرام }
        message: { type: string, example: سلام، کیف امروز رسید. دقیقاً همونیه که توی عکس دیده بودم، حتی رنگش! }
        messageTime: { type: string, example: '10:12' }
        receivedAt: { type: string, format: date-time }
        rating: { type: integer, minimum: 1, maximum: 5, example: 5 }
        product: { $ref: '#/components/schemas/ProductRef' }
        color: { $ref: '#/components/schemas/Color' }
        screenshotUrl: { type: string, format: uri, nullable: true, description: '[پیشنهادی] اسکرین‌شات واقعی پیام برای اعتماد بیشتر' }
    TestimonialListResponse:
      type: object
      properties:
        summary: { $ref: '#/components/schemas/SatisfactionSummary' }
        items:
          type: array
          items: { $ref: '#/components/schemas/Testimonial' }
        meta: { $ref: '#/components/schemas/PageMeta' }
    HomeFeature:
      type: object
      properties:
        icon: { $ref: '#/components/schemas/IconName' }
        title: { type: string, example: عکس قبل از ارسال }
        subtitle: { type: string, example: کیف خودت رو قبل از ارسال ببین }
    HomePage:
      type: object
      properties:
        hero:
          type: object
          properties:
            eyebrow: { type: string, example: 'امضای کیوا: عکس قبل از ارسال' }
            title: { type: string, example: 'هرچی ببینی، همون می‌رسه.' }
            text: { type: string }
            primaryCta: { type: object, properties: { label: { type: string, example: مشاهده محصولات }, url: { type: string, example: /products } } }
            secondaryCta: { type: object, properties: { label: { type: string, example: چطور کار می‌کنیم؟ }, url: { type: string, example: '#how' } } }
            showcaseProduct:
              allOf: [{ $ref: '#/components/schemas/ProductSummary' }]
              description: محصولی که رنگ‌هایش در کارت «روی سایت دیدی = قبل از ارسال فرستادیم» می‌چرخد (از `colors[].imageUrl`)
            showcaseMessenger: { $ref: '#/components/schemas/PhotoMessengerChannel' }
        features:
          type: array
          items: { $ref: '#/components/schemas/HomeFeature' }
        categories:
          type: array
          items: { $ref: '#/components/schemas/Category' }
        newArrivals:
          type: array
          items: { $ref: '#/components/schemas/ProductSummary' }
        promos:
          type: array
          items: { $ref: '#/components/schemas/Banner' }
        sale: { type: object, allOf: [{ $ref: '#/components/schemas/Campaign' }], nullable: true }
        testimonials: { $ref: '#/components/schemas/TestimonialListResponse' }
        howItWorks:
          type: array
          items:
            type: object
            properties:
              step: { type: integer, example: 2 }
              title: { type: string, example: عکس کیف خودت، قبل از ارسال }
              text: { type: string }
              isSignature: { type: boolean, example: true }
    SiteStats:
      type: object
      description: 'عددهای بازاریابی، دستی از `PUT /admin/settings` (`siteStats`)؛ حساب نمی‌شوند'
      required: [happyCustomers, preShipmentPhotos, photoMatchSatisfactionPercent, productModels, satisfaction]
      properties:
        happyCustomers: { type: integer, minimum: 0, example: 12000 }
        preShipmentPhotos: { type: integer, minimum: 0, example: 48000 }
        photoMatchSatisfactionPercent: { type: integer, minimum: 0, maximum: 100, example: 98 }
        productModels: { type: integer, minimum: 0, example: 60 }
        satisfaction: { allOf: [{ $ref: '#/components/schemas/SatisfactionSummary' }], nullable: true }

    # ============ FAQ / CONTACT / PAGES ============
    FaqItem:
      type: object
      required: [id, question, answer, questionHighlighted, answerHighlighted, sortOrder]
      properties:
        id: { type: integer, example: 7 }
        question: { type: string, example: رزرو ۴ روزه چطور کار می‌کنه؟ }
        answer: { $ref: '#/components/schemas/HtmlString' }
        questionHighlighted:
          type: string
          nullable: true
          description: 'فقط با `q`: متن سؤال، **escape‌شده**، با `<mark>` دور هر تطابق (پس با `innerHTML` امن است)؛ بی `q` `null`'
        answerHighlighted:
          type: string
          nullable: true
          description: 'فقط با `q`: همان `answer` با `<mark>` دور هر تطابق، فقط داخل متن (نه داخل تگ یا آدرس)؛ بی `q` `null`'
        sortOrder: { type: integer, description: جای سؤال در گروه (۰، ۱، …) }
    FaqGroup:
      type: object
      required: [id, name, icon, isSignature, sortOrder, questions]
      properties:
        id: { type: string, description: 'anchor لینک مستقیم — photo / order / reserve / shipping / return / payment / account', example: reserve }
        name: { type: string, example: رزرو ۴ روزه }
        icon: { type: string, nullable: true, allOf: [{ $ref: '#/components/schemas/IconName' }] }
        isSignature: { type: boolean, description: تگ «امضای کیوا», example: false }
        sortOrder: { type: integer, description: جای گروه (۰، ۱، …) }
        questions:
          type: array
          items: { $ref: '#/components/schemas/FaqItem' }
    FaqItemInput:
      type: object
      description: 'یک سؤال در بدنه‌ی `PUT /admin/faq/groups`. با `id` همان سؤال (حتی اگر به گروه دیگری رفته باشد)، بی `id` سؤال تازه'
      required: [question, answer]
      properties:
        id: { type: integer, nullable: true, description: '`id` ِ ناشناخته ← `FAQ_ITEM_NOT_FOUND`؛ تکراری ← `LIST_ITEM_DUPLICATE`' }
        question: { type: string, minLength: 1, maxLength: 300, description: '`QUESTION_REQUIRED` / `TEXT_TOO_LONG`' }
        answer: { type: string, description: 'HTML؛ بعد از پاک‌سازی (`HtmlString`) ۱ تا ۵۰۰۰ نویسه (`ANSWER_REQUIRED` / `TEXT_TOO_LONG`)' }
    FaqGroupInput:
      type: object
      description: یک گروه در بدنه‌ی `PUT /admin/faq/groups`؛ ترتیب گروه‌ها و سؤال‌ها = ترتیب آرایه‌ها (`sortOrder` اگر بیاید نادیده)
      required: [id, name, questions]
      properties:
        id: { type: string, pattern: '^[a-z][a-z0-9-]{1,30}$', description: 'anchor، یکتا (`FAQ_ANCHOR_INVALID` / `FAQ_ANCHOR_DUPLICATE`)' }
        name: { type: string, minLength: 1, maxLength: 60, description: '`FAQ_GROUP_NAME_REQUIRED` / `TEXT_TOO_LONG`' }
        icon: { type: string, nullable: true, description: 'اسم آیکن (`ICON_INVALID`)' }
        isSignature: { type: boolean, default: false }
        questions:
          type: array
          maxItems: 50
          description: 'حداکثر ۵۰ (`FAQ_TOO_MANY` با `meta.maxItems`)'
          items: { $ref: '#/components/schemas/FaqItemInput' }
    FaqResponse:
      type: object
      required: [groups, totalMatches, emptyMessage]
      properties:
        groups:
          type: array
          description: 'با `q` فقط گروه‌هایی که سؤال جور دارند، و در هر گروه فقط سؤال‌های جور'
          items: { $ref: '#/components/schemas/FaqGroup' }
        totalMatches: { type: integer, description: 'با `q` تعداد سؤال‌های جور؛ بی `q` تعداد همه‌ی سؤال‌ها', example: 3 }
        emptyMessage: { type: string, nullable: true, description: 'فقط وقتی `groups` خالی است', example: سوالی با این کلمه پیدا نکردیم؛ از پشتیبانی بپرس }
    ContactTopic:
      type: string
      enum: [ORDER_FOLLOWUP, PRODUCT_QUESTION, RETURN, COLLABORATION, OTHER]
    ContactTopicOption:
      type: object
      properties:
        value: { $ref: '#/components/schemas/ContactTopic' }
        label: { type: string, example: پیگیری سفارش }
        requiresOrderCode: { type: boolean, description: فیلد «شماره سفارش (اختیاری)» نمایش داده شود, example: true }
    ContactMessageRequest:
      type: object
      required: [topic, fullName, phone, message]
      properties:
        topic: { $ref: '#/components/schemas/ContactTopic' }
        fullName: { type: string, minLength: 3, maxLength: 80, example: سارا محمدی }
        phone: { $ref: '#/components/schemas/PhoneNumber' }
        email: { type: string, format: email, nullable: true }
        orderCode: { type: string, allOf: [{ $ref: '#/components/schemas/OrderCode' }], nullable: true }
        message: { type: string, minLength: 10, maxLength: 600, example: سلام، سفارشم هنوز عکسش برام ارسال نشده. }
    ContactMessageResponse:
      type: object
      properties:
        ticketCode: { type: string, example: CT-4821 }
        createdAt: { type: string, format: date-time }
        message: { type: string, example: پیامت رسید! به زودی از طریق پیامک باهات تماس می‌گیریم. }
    NewsletterSubscribeRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email, example: sara@example.com }
        source: { type: string, example: footer }
    NewsletterSubscription:
      type: object
      description: یک مشترک خبرنامه در پنل (`GET /admin/newsletter/subscriptions`)
      required: [id, email, status, source, subscribedAt, unsubscribedAt]
      properties:
        id: { type: integer, example: 318 }
        email: { type: string, format: email, example: sara@example.com }
        status: { type: string, enum: [ACTIVE, UNSUBSCRIBED] }
        source: { type: string, nullable: true, example: footer }
        subscribedAt: { type: string, format: date-time }
        unsubscribedAt: { type: string, format: date-time, nullable: true }
    StaticPage:
      type: object
      required: [slug, title, content, updatedAt, seo]
      properties:
        slug: { type: string, example: terms }
        title: { type: string, example: قوانین و حریم خصوصی }
        content: { $ref: '#/components/schemas/HtmlString' }
        updatedAt: { type: string, format: date-time }
        seo:
          type: object
          required: [title, description, canonicalUrl, ogImageUrl, noIndex]
          description: '`SeoMeta` ِ صفحه: `title` بی‌مقدار ← «عنوان صفحه | کیوا»؛ `canonicalUrl` همیشه `{سایت}/pages/{slug}`؛ `ogImageUrl` فعلاً `null`'
          properties:
            title: { type: string }
            description: { type: string, nullable: true }
            canonicalUrl: { type: string, format: uri }
            ogImageUrl: { type: string, format: uri, nullable: true }
            noIndex: { type: boolean }
    StaticPageUpsertRequest:
      type: object
      description: |
        بدنه‌ی `PUT /admin/pages/{slug}`. `slug` یا نیاید یا همان مسیر باشد (`400 SLUG_IMMUTABLE`). `title` ۱ تا ۱۲۰
        (`PAGE_TITLE_REQUIRED` / `TEXT_TOO_LONG`)؛ `content` HTML که بعد از پاک‌سازی (`HtmlString`) ۱ تا ۵۰٬۰۰۰ نویسه است
        (`PAGE_CONTENT_REQUIRED` / `TEXT_TOO_LONG`). `seo`: `title` ≤ ۷۰، `description` ≤ ۱۷۰، `noIndex`؛ بقیه‌ی `SeoMeta` نادیده.
      required: [title, content]
      properties:
        slug: { type: string, nullable: true }
        title: { type: string, minLength: 1, maxLength: 120 }
        content: { type: string }
        seo:
          type: object
          nullable: true
          properties:
            title: { type: string, nullable: true, maxLength: 70 }
            description: { type: string, nullable: true, maxLength: 170 }
            noIndex: { type: boolean, default: false }
    AdminStaticPageSummary:
      type: object
      description: یک ردیف لیست صفحه‌های ثابت در پنل
      required: [slug, title, updatedAt]
      properties:
        slug: { type: string, example: terms }
        title: { type: string, example: قوانین و حریم خصوصی }
        updatedAt: { type: string, format: date-time }

    # ============ BLOG ============
    BlogCategory:
      type: object
      properties:
        id: { type: integer, example: 2 }
        slug: { type: string, example: buying-guide }
        name: { type: string, example: راهنمای خرید }
        postCount: { type: integer, example: 2 }
    BlogAuthor:
      type: object
      properties:
        id: { type: integer, example: 1 }
        name: { type: string, example: نیلوفر }
        title: { type: string, example: تیم استایل کیوا }
        initial: { type: string, example: ن }
        avatarUrl: { type: string, format: uri, nullable: true }
        bio: { type: string, example: عاشق کیف‌های مینیمال و نوشتن درباره‌ی استایل روزمره. }
    BlogPostSummary:
      type: object
      properties:
        id: { type: integer, example: 1 }
        slug: { type: string, example: bag-by-body-shape }
        title: { type: string, example: راهنمای انتخاب کیف بر اساس فرم بدن }
        excerpt: { type: string, example: قد، فرم شانه و سبک زندگیت تعیین می‌کنه چه کیفی بهت میاد. }
        category: { $ref: '#/components/schemas/BlogCategory' }
        cover: { $ref: '#/components/schemas/MediaAsset' }
        coverBackground: { type: string, nullable: true, description: رنگ پس‌زمینه‌ی کاور ایلاستریشنی, example: '#E4D9F3' }
        readingMinutes: { type: integer, example: 6 }
        publishedAt: { type: string, format: date-time }
        author: { $ref: '#/components/schemas/BlogAuthor' }
        isFeatured: { type: boolean, description: «منتخب سردبیر», example: true }
        tags:
          type: array
          items: { type: string }
    BlogContentBlock:
      type: object
      description: |
        محتوای مقاله به‌صورت بلوکی (برای رندر دقیق طرح):
        `HEADING` (با `anchor` برای فهرست مطالب) · `PARAGRAPH` · `QUOTE` · `TIP` (باکس «نکته کیوا») · `PRODUCT` (کارت محصول درون‌متنی) · `IMAGE` · `LIST`
      required: [type]
      properties:
        type: { type: string, enum: [HEADING, PARAGRAPH, QUOTE, TIP, PRODUCT, IMAGE, LIST] }
        anchor: { type: string, nullable: true, example: s0 }
        text: { type: string, nullable: true, example: چرا فرم بدن مهمه؟ }
        html: { type: string, allOf: [{ $ref: '#/components/schemas/HtmlString' }], nullable: true }
        title: { type: string, nullable: true, example: نکته کیوا }
        items:
          type: array
          nullable: true
          items: { type: string }
        product: { type: object, allOf: [{ $ref: '#/components/schemas/ProductSummary' }], nullable: true }
        image: { type: object, allOf: [{ $ref: '#/components/schemas/MediaAsset' }], nullable: true }
    BlogPostDetail:
      allOf:
        - $ref: '#/components/schemas/BlogPostSummary'
        - type: object
          properties:
            lead: { type: string, description: پاراگراف آغازین بزرگ }
            blocks:
              type: array
              items: { $ref: '#/components/schemas/BlogContentBlock' }
            toc:
              type: array
              description: فهرست مطالب (sticky)
              items:
                type: object
                properties:
                  anchor: { type: string, example: s0 }
                  title: { type: string, example: چرا فرم بدن مهمه؟ }
            breadcrumbs:
              type: array
              items: { $ref: '#/components/schemas/Breadcrumb' }
            shareUrl: { type: string, format: uri }
            shareLinks:
              type: array
              items: { $ref: '#/components/schemas/MessengerLink' }
            helpfulStats:
              type: object
              properties:
                helpfulCount: { type: integer, example: 120 }
                notHelpfulCount: { type: integer, example: 6 }
            seo: { $ref: '#/components/schemas/SeoMeta' }
            updatedAt: { type: string, format: date-time }
    BlogPostListResponse:
      type: object
      properties:
        featured: { type: object, allOf: [{ $ref: '#/components/schemas/BlogPostSummary' }], nullable: true }
        items:
          type: array
          items: { $ref: '#/components/schemas/BlogPostSummary' }
        meta: { $ref: '#/components/schemas/PageMeta' }
        emptyMessage: { type: string, nullable: true, example: مقاله‌ای با این مشخصات پیدا نشد. }

    # ============ ADMIN · CATALOG ============
    ProductMediaInput:
      type: object
      required: [mediaId, view]
      description: |
        یک مدیای گالری رنگ: فقط مدیای آپلودشده با `purpose = PRODUCT` (ناموجود ← `400 MEDIA_NOT_FOUND`، `purpose` ِ دیگر ← `400 MEDIA_PURPOSE_MISMATCH`).
        ترتیب نهایی گالری: `isPrimary` اول (حداکثر یکی؛ دومی ← `400 MEDIA_PRIMARY_DUPLICATE`)، بعد `sortOrder`، بعد ترتیب همین لیست.
      properties:
        mediaId: { type: string, pattern: '^med_[0-9A-Za-z]{22}$', example: 'med_5Hq2xT9aLmQ0vB3nR7sK1w' }
        view: { $ref: '#/components/schemas/MediaView' }
        sortOrder: { type: integer, example: 0 }
        isPrimary: { type: boolean, default: false }
        alt: { type: string, maxLength: 200 }
    VariantUpsertRequest:
      type: object
      required: [colorKey]
      properties:
        colorKey: { allOf: [{ $ref: '#/components/schemas/ColorKey' }], description: 'در `PUT` عوض نمی‌شود (`400 COLOR_KEY_IMMUTABLE`)' }
        sku: { type: string, nullable: true, maxLength: 40, pattern: '^[A-Za-z][A-Za-z0-9]*(-[A-Za-z0-9]+)*$', description: 'خالی = تولید خودکار (KV-1001-LILAC)؛ با حروف بزرگ ذخیره می‌شود. در `PUT` عوض نمی‌شود (`400 SKU_IMMUTABLE`)', example: KV-1001-LILAC }
        barcode: { type: string, nullable: true, pattern: '^[0-9A-Za-z-]{4,32}$' }
        priceOverride: { type: integer, allOf: [{ $ref: '#/components/schemas/Money' }], nullable: true, description: 'اگر این رنگ قیمت متفاوت دارد؛ `null` = قیمت خود محصول' }
        compareAtPriceOverride: { type: integer, allOf: [{ $ref: '#/components/schemas/Money' }], nullable: true, description: 'فقط همراه `priceOverride` (`400 PRICE_OVERRIDE_REQUIRED`) و بیشتر از آن' }
        stockQuantity: { type: integer, minimum: 0, maximum: 10000, description: 'موجودی اولیه، فقط در ساخت (در `PUT` نادیده گرفته می‌شود؛ برای تغییرات بعدی از adjustments استفاده کنید)', example: 12 }
        isDefault: { type: boolean, default: false, description: '`false` پیش‌فرض بودن را برنمی‌دارد' }
        isActive: { type: boolean, default: true }
        sortOrder: { type: integer, example: 0 }
        media:
          type: array
          maxItems: 20
          description: 'کل گالری این رنگ (حداکثر ۲۰ تا؛ بیشتر ← `400 MEDIA_TOO_MANY`؛ یک مدیا دو بار ← `400 MEDIA_DUPLICATE`)'
          items: { $ref: '#/components/schemas/ProductMediaInput' }
    ProductUpsertRequest:
      type: object
      required: [name, slug, categoryId, bagType, price, materialId]
      description: |
        همه‌ی خطاهای شکل با هم در یک `400` با مسیر هر فیلد برمی‌گردند. `canonicalUrl`، `ogImageUrl` و `jsonLd` ِ `seo` نادیده گرفته می‌شوند:
        سرور خودش آن‌ها را می‌سازد. `description` قبل از ذخیره sanitize می‌شود (فقط تگ‌های `HtmlString`؛ `<script>`، `on*` و لینک `javascript:` حذف).
      properties:
        name: { type: string, minLength: 1, maxLength: 120, example: کیف دوشی ماهک }
        slug: { type: string, maxLength: 100, pattern: '^(?=.*[a-z])[a-z0-9]+(-[a-z0-9]+)*$', description: 'حروف کوچک لاتین، رقم و خط تیره؛ حداقل یک حرف (تا با id عددی اشتباه نشود). در `PUT` عوض نمی‌شود (`400 SLUG_IMMUTABLE`)', example: mahak-shoulder-bag }
        sku: { type: string, nullable: true, maxLength: 40, pattern: '^[A-Za-z][A-Za-z0-9]*(-[A-Za-z0-9]+)*$', description: 'خالی = تولید خودکار (KV-xxxx)؛ با حروف بزرگ ذخیره می‌شود. در `PUT` عوض نمی‌شود (`400 SKU_IMMUTABLE`)', example: KV-1001 }
        categoryId: { type: integer, example: 1 }
        bagType: { $ref: '#/components/schemas/BagType' }
        materialId: { type: integer, example: 3 }
        materialDescription: { type: string, maxLength: 120, example: چرم مصنوعی مات درجه یک }
        price: { allOf: [{ $ref: '#/components/schemas/Money' }], example: 1890000 }
        compareAtPrice: { type: integer, allOf: [{ $ref: '#/components/schemas/Money' }], nullable: true, description: 'بیشتر از `price` (`400 COMPARE_AT_PRICE_NOT_ABOVE_PRICE`)' }
        shortDescription: { type: string, maxLength: 300, nullable: true }
        description: { allOf: [{ $ref: '#/components/schemas/HtmlString' }], description: 'حداکثر ۱۰٬۰۰۰ نویسه **بعد از** sanitize' }
        highlights:
          type: array
          maxItems: 8
          items: { type: string, maxLength: 160 }
        specs: { $ref: '#/components/schemas/ProductSpecsInput' }
        tags:
          type: array
          maxItems: 20
          description: 'حداکثر ۲۰ برچسب (`TAGS_TOO_MANY`)، هر کدام ۱ تا ۳۰ نویسه (`TAG_INVALID`)'
          items: { type: string, minLength: 1, maxLength: 30 }
        newUntil: { type: string, format: date-time, nullable: true, description: تا این تاریخ تگ «جدید» می‌خورد (به‌جای فیلد دستی isNew) }
        maxPerOrder: { type: integer, minimum: 1, maximum: 20, default: 5 }
        returnable: { type: boolean, default: true }
        reservable: { type: boolean, default: true }
        sortPriority: { type: integer, default: 0, description: برای چیدمان دستی (pin) در لیست }
        status: { allOf: [{ $ref: '#/components/schemas/ProductStatus' }], description: 'فقط در ساخت (پیش‌فرض `DRAFT`)؛ در `PUT` نادیده گرفته می‌شود' }
        seo:
          type: object
          description: 'فقط این سه فیلد خوانده می‌شوند'
          properties:
            title: { type: string, maxLength: 70, nullable: true }
            description: { type: string, maxLength: 170, nullable: true }
            noIndex: { type: boolean, default: false }
        variants:
          type: array
          description: فقط در ساخت؛ برای ویرایش از endpointهای ورینت استفاده کنید (در `PUT` نادیده گرفته می‌شود)
          items: { $ref: '#/components/schemas/VariantUpsertRequest' }
    ProductSpecsInput:
      type: object
      description: |
        مشخصات در فرم محصول؛ همان `ProductSpecs` با سقف‌ها. `label` ِ `closure` و `occasions` را سرور می‌سازد و از ورودی خوانده نمی‌شود.
        هر مشکل یک خطای فیلد با مسیر کامل است (`specs.straps.1.lengthCm`).
      properties:
        dimensions: { allOf: [{ $ref: '#/components/schemas/ProductDimensions' }], nullable: true, description: 'هر ضلع بیشتر از ۰ و حداکثر ۲۰۰' }
        weightGrams: { type: integer, nullable: true, minimum: 1, maximum: 20000 }
        closure:
          type: object
          nullable: true
          properties:
            type: { $ref: '#/components/schemas/ClosureType' }
        straps:
          type: array
          nullable: true
          maxItems: 4
          items:
            type: object
            properties:
              type: { $ref: '#/components/schemas/StrapType' }
              label: { type: string, maxLength: 200 }
              lengthCm: { type: number, nullable: true, minimum: 0, exclusiveMinimum: true, maximum: 200 }
              minLengthCm: { type: number, nullable: true, minimum: 0, exclusiveMinimum: true, maximum: 200 }
              maxLengthCm: { type: number, nullable: true, minimum: 0, exclusiveMinimum: true, maximum: 200, description: 'حداقل `minLengthCm`' }
              adjustable: { type: boolean, default: false }
              detachable: { type: boolean, default: false }
              material: { type: string, nullable: true, maxLength: 60 }
        pockets:
          type: object
          nullable: true
          description: 'هر شمارنده ۰ تا ۲۰'
          properties:
            internal: { type: integer, minimum: 0, maximum: 20 }
            internalZip: { type: integer, minimum: 0, maximum: 20 }
            external: { type: integer, minimum: 0, maximum: 20 }
            phone: { type: integer, minimum: 0, maximum: 20 }
            cardSlots: { type: integer, minimum: 0, maximum: 20 }
            billSlots: { type: integer, minimum: 0, maximum: 20 }
            coinPocket: { type: boolean, default: false }
            detachablePouch: { type: boolean, default: false }
            laptopSleeve: { type: boolean, default: false }
            summary: { type: string, maxLength: 200 }
        laptopMaxInch: { type: number, nullable: true, minimum: 0, exclusiveMinimum: true, maximum: 20 }
        capacityLiters: { type: number, nullable: true, minimum: 0, exclusiveMinimum: true, maximum: 100 }
        waterproof: { type: boolean, default: false }
        occasions:
          type: array
          items:
            type: object
            properties:
              code: { $ref: '#/components/schemas/Occasion' }
        fits:
          type: array
          items: { $ref: '#/components/schemas/FitItem' }
        lining:
          type: object
          nullable: true
          properties:
            material: { type: string, maxLength: 60 }
            color: { type: string, maxLength: 40 }
        hardware:
          type: object
          nullable: true
          properties:
            material: { type: string, maxLength: 60 }
            finish: { type: string, maxLength: 40 }
        stitching: { type: string, nullable: true, maxLength: 100 }
        handmade: { type: boolean, default: false }
        madeIn: { type: string, nullable: true, maxLength: 40 }
        careInstructions:
          type: array
          maxItems: 10
          items: { type: string, minLength: 1, maxLength: 200 }
        warranty:
          type: object
          nullable: true
          properties:
            months: { type: integer, minimum: 1, maximum: 60 }
            description: { type: string, maxLength: 200 }
    AdminVariant:
      allOf:
        - $ref: '#/components/schemas/ProductVariant'
        - type: object
          properties:
            barcode: { type: string, nullable: true }
            isActive: { type: boolean }
            stockOnHand: { type: integer, description: موجودی فیزیکی, example: 12 }
            stockReserved: { type: integer, description: رزرو موقت سبدهای در حال پرداخت + سفارش‌های ارسال‌نشده, example: 2 }
            stockAvailable: { type: integer, example: 10 }
            soldCount: { type: integer, example: 64 }
            stockAlertSubscribers: { type: integer, example: 7 }
    AdminProduct:
      description: |
        همه‌ی فیلدهای `ProductDetail` (همان چیزی که مشتری می‌بیند) به‌اضافه‌ی فیلدهای پنل. `variants` فقط رنگ‌های **فعال** است و
        موجودی‌اش همان قانون فروشگاه را دارد؛ `adminVariants` **همه‌ی** رنگ‌ها (فعال و غیرفعال) با موجودی دقیق.
        فیلدهای فقط‌مشتری: `isWishlisted` و `stockAlert` و `campaign` همیشه `null`، `perks` خالی، `selectedColorKey` رنگ پیش‌فرض.
      allOf:
        - $ref: '#/components/schemas/ProductDetail'
        - type: object
          properties:
            status: { $ref: '#/components/schemas/ProductStatus' }
            adminVariants:
              type: array
              items: { $ref: '#/components/schemas/AdminVariant' }
            newUntil: { type: string, format: date-time, nullable: true }
            sortPriority: { type: integer }
            publishAt: { type: string, format: date-time, nullable: true, description: 'زمان انتشار برنامه‌ریزی‌شده‌ی محصول پیش‌نویس؛ بدون برنامه `null`' }
            viewsCount: { type: integer, nullable: true, description: 'تا آمار بازدید ساخته نشده `null`', example: 5230 }
            conversionRate: { type: number, nullable: true, description: 'تا آمار بازدید ساخته نشده `null`', example: 3.5 }
            createdAt: { type: string, format: date-time }
            createdBy: { type: string, description: 'اسم نمایشی سازنده: نام کامل، وگرنه موبایل ماسک‌شده؛ برای کار سیستم «سیستم»', example: لیلا احمدی }
            etag: { type: string, description: 'همان هدر `ETag`: `W/"{نسخه}"`', example: 'W/"12"' }
    AdminProductListItem:
      type: object
      properties:
        id: { type: integer }
        sku: { type: string }
        name: { type: string }
        imageUrl: { type: string, format: uri, nullable: true, description: 'نسخه‌ی کوچک اولین مدیای رنگ پیش‌فرض؛ بدون مدیا `null`' }
        category: { $ref: '#/components/schemas/CategoryRef' }
        status: { $ref: '#/components/schemas/ProductStatus' }
        price: { $ref: '#/components/schemas/PriceInfo' }
        totalStock: { type: integer, description: 'جمع موجودی قابل فروش رنگ‌های فعال', example: 12 }
        variantsCount: { type: integer, description: 'همه‌ی رنگ‌ها (فعال و غیرفعال)', example: 4 }
        lowStockVariants: { type: integer, description: 'رنگ‌های فعال با موجودی بین صفر و آستانه', example: 1 }
        soldCount: { type: integer, example: 184 }
        rating: { $ref: '#/components/schemas/RatingBrief' }
        updatedAt: { type: string, format: date-time }
    AdminProductListResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AdminProductListItem' }
        meta: { $ref: '#/components/schemas/PageMeta' }
    InventoryAdjustmentRequest:
      type: object
      required: [variantId, delta, reason]
      properties:
        variantId: { type: integer, example: 101 }
        delta: { type: integer, minimum: -10000, maximum: 10000, description: 'مثبت = ورود، منفی = خروج؛ صفر نه. `STOCKTAKE` هم تفاوت است، نه عدد شمارش', example: 10 }
        reason: { type: string, enum: [RESTOCK, STOCKTAKE, DAMAGED, RETURNED, MANUAL_CORRECTION], description: '`RESTOCK` و `RETURNED` فقط مثبت، `DAMAGED` فقط منفی، `STOCKTAKE` و `MANUAL_CORRECTION` هر دو' }
        note: { type: string, maxLength: 300 }
    InventoryAdjustment:
      type: object
      properties:
        id: { type: integer }
        variantId: { type: integer }
        sku: { type: string }
        delta: { type: integer }
        reason: { type: string, enum: [RESTOCK, STOCKTAKE, DAMAGED, RETURNED, MANUAL_CORRECTION] }
        note: { type: string, nullable: true }
        stockAfter: { type: integer, description: 'موجودی فیزیکی (`stockOnHand`) بعد از همین تغییر' }
        createdAt: { type: string, format: date-time }
        createdBy: { type: string, description: 'اسم نمایشی: نام کامل، وگرنه موبایل ماسک‌شده؛ برای کار سیستم «سیستم»', example: لیلا احمدی }
    CategoryUpsertRequest:
      type: object
      required: [name, slug, iconBagType, iconColorKey]
      properties:
        name: { type: string, minLength: 1, maxLength: 100, example: کیف دوشی }
        slug: { type: string, maxLength: 100, pattern: '^(?=.*[a-z])[a-z0-9]+(-[a-z0-9]+)*$', description: 'حداقل یک حرف (تا با id عددی اشتباه نشود)؛ یکتا (`409 DUPLICATE_SLUG`)', example: shoulder }
        description: { type: string, nullable: true, maxLength: 500 }
        iconBagType: { $ref: '#/components/schemas/BagType' }
        iconColorKey: { allOf: [{ $ref: '#/components/schemas/ColorKey' }], description: 'رنگی از پالت (`400 COLOR_NOT_FOUND`)' }
        imageMediaId: { type: string, nullable: true, description: 'فقط مدیای آپلودشده با `purpose = CATEGORY` (فقط عکس)' }
        sortOrder: { type: integer, default: 0 }
        showInMenu: { type: boolean, default: true }
        seo:
          type: object
          description: 'فقط این سه فیلد خوانده می‌شوند'
          properties:
            title: { type: string, maxLength: 70, nullable: true }
            description: { type: string, maxLength: 170, nullable: true }
            noIndex: { type: boolean, default: false }
    ColorUpsertRequest:
      type: object
      required: [key, name, hex]
      properties:
        key: { allOf: [{ $ref: '#/components/schemas/ColorKey' }], description: 'یکتا (`409 DUPLICATE_CODE`)؛ در `PUT` باید همان کلید مسیر باشد (`400 COLOR_KEY_IMMUTABLE`)' }
        name: { type: string, minLength: 1, maxLength: 50, example: یاسی }
        hex: { type: string, pattern: '^#[0-9A-Fa-f]{6}$', example: '#C8B6E2' }
        isLight: { type: boolean, default: false }
        sortOrder: { type: integer, description: 'پیش‌فرض در ساخت: بعد از آخرین رنگ' }
    MaterialUpsertRequest:
      type: object
      required: [name, slug, family]
      properties:
        name: { type: string, minLength: 1, maxLength: 120, example: چرم طبیعی گاوی }
        slug: { type: string, maxLength: 100, pattern: '^(?=.*[a-z])[a-z0-9]+(-[a-z0-9]+)*$', description: 'یکتا (`409 DUPLICATE_SLUG`)', example: genuine-cow-leather }
        family: { $ref: '#/components/schemas/MaterialFamily' }
        description: { type: string, nullable: true, maxLength: 1000 }
        careInstructions:
          type: array
          maxItems: 10
          description: 'حداکثر ۱۰ تا، هر کدام ۱ تا ۲۰۰ نویسه (`CARE_INSTRUCTIONS_INVALID`)'
          items: { type: string, minLength: 1, maxLength: 200 }
    AdminCategory:
      description: دسته‌بندی در پنل؛ `Category` به‌اضافه‌ی شناسه‌ی مدیای عکس تا فرم ویرایش بداند عکس فعلی کدام است
      allOf:
        - $ref: '#/components/schemas/Category'
        - type: object
          required: [imageMediaId]
          properties:
            imageMediaId: { type: string, nullable: true, description: 'همان `imageMediaId` ِ `CategoryUpsertRequest`؛ بدون عکس `null`', example: med_7Kx1 }
    AdminStockAlertGroup:
      type: object
      description: اشتراک‌های فعال «موجود شد خبرم کن» برای یک ورینت (یا برای کل محصول، وقتی مشتری رنگ خاصی نخواسته)
      required: [product, variantId, color, sku, waitingCount, oldestAt, stockStatus, availableQuantity]
      properties:
        product: { $ref: '#/components/schemas/ProductRef' }
        variantId: { type: integer, nullable: true, description: '`null` = هر رنگی از این محصول', example: 501 }
        color: { type: object, allOf: [{ $ref: '#/components/schemas/Color' }], nullable: true }
        sku: { type: string, nullable: true, example: KV-1001-LILAC }
        waitingCount: { type: integer, description: تعداد اشتراک‌های فعال, example: 6 }
        oldestAt: { type: string, format: date-time, description: قدیمی‌ترین اشتراک فعال }
        stockStatus: { $ref: '#/components/schemas/StockStatus' }
        availableQuantity: { type: integer, description: 'موجودی قابل فروش دقیق (پنل)؛ برای `variantId = null` جمع همه‌ی رنگ‌ها', example: 0 }

    # ============ ADMIN · ORDERS ============
    AdminNote:
      type: object
      properties:
        id: { type: integer }
        text: { type: string }
        author: { type: string, description: اسم نمایشی نویسنده (اسم کامل، وگرنه موبایل ماسک‌شده), example: مریم رضایی }
        createdAt: { type: string, format: date-time }
    AdminOrderListItem:
      type: object
      properties:
        code: { $ref: '#/components/schemas/OrderCode' }
        placedAt: { type: string, format: date-time }
        status: { $ref: '#/components/schemas/OrderStatus' }
        customerName: { type: string, example: سارا محمدی }
        customerPhone: { $ref: '#/components/schemas/PhoneNumber' }
        city: { type: string, example: تهران }
        itemsCount: { type: integer }
        payable: { $ref: '#/components/schemas/Money' }
        shippingMethod: { $ref: '#/components/schemas/ShippingMethodCode' }
        messenger: { $ref: '#/components/schemas/PhotoMessengerChannel' }
        reserved: { type: boolean }
        reservationExpiresAt: { type: string, format: date-time, nullable: true }
        shipmentGroupCode: { type: string, nullable: true, example: SG-3021 }
        mediaCount: { type: integer }
        trackingCode: { type: string, nullable: true }
    AdminOrderListResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AdminOrderListItem' }
        meta: { $ref: '#/components/schemas/PageMeta' }
        statusCounts:
          type: object
          additionalProperties: { type: integer }
          example: { PROCESSING: 12, PHOTO_SENT: 7, RESERVED: 3 }
    AdminOrder:
      allOf:
        - $ref: '#/components/schemas/OrderDetail'
        - type: object
          properties:
            customer:
              type: object
              properties:
                id: { type: integer }
                fullName: { type: string, nullable: true, description: 'اسم حساب؛ `null` وقتی مشتری اسمش را نداده' }
                phone: { $ref: '#/components/schemas/PhoneNumber' }
                ordersCount: { type: integer, description: 'سفارش‌های پرداخت‌شده‌ی مشتری (لغوشده هم)', example: 3 }
            shipmentGroup:
              type: object
              nullable: true
              description: گروه ارسال رزرو (همه با یک کد رهگیری)
              properties:
                code: { type: string, example: SG-3021 }
                orderCodes:
                  type: array
                  description: سفارش‌های لغونشده‌ی گروه به ترتیب پرداخت
                  items: { $ref: '#/components/schemas/OrderCode' }
                releaseAt: { type: string, format: date-time, description: پایان مهلت رزرو گروه }
            draftItems:
              type: array
              description: 'پیش‌نویس عکس‌های قبل از ارسال (`PUT …/pre-shipment-media`) که هنوز فرستاده نشده؛ مشتری آن را نمی‌بیند'
              items: { $ref: '#/components/schemas/OrderMediaItem' }
            payments:
              description: همه‌ی تلاش‌های پرداخت سفارش، قدیمی‌ترین اول
              type: array
              items: { $ref: '#/components/schemas/OrderPaymentInfo' }
            refunds:
              type: array
              items: { $ref: '#/components/schemas/Refund' }
            notes:
              type: array
              items: { $ref: '#/components/schemas/AdminNote' }
            allowedTransitions:
              type: array
              description: 'وضعیت‌هایی که `POST /admin/orders/{orderCode}/status` الان می‌پذیرد'
              items: { $ref: '#/components/schemas/OrderStatus' }
    AdminOrderStatusChangeRequest:
      type: object
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/OrderStatus' }
        note: { type: string, maxLength: 500, nullable: true }
        notifyCustomer: { type: boolean, default: true }
    AdminPreShipmentMediaRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [mediaId]
            properties:
              mediaId: { type: string }
              orderItemId: { type: integer, nullable: true }
              view: { $ref: '#/components/schemas/MediaView' }
              sortOrder: { type: integer }
    AdminShipmentRequest:
      type: object
      required: [carrier, trackingCode]
      properties:
        carrier: { $ref: '#/components/schemas/ShippingMethodCode' }
        trackingCode: { type: string, minLength: 6, maxLength: 40, example: '183920674512039845612307' }
        shippedAt: { type: string, format: date-time, nullable: true }
        showInDailyList: { type: boolean, default: true, description: نمایش (ماسک‌شده) در «کدهای رهگیری روزانه» }
    AdminRefundRequest:
      type: object
      required: [amount, reason]
      properties:
        amount: { $ref: '#/components/schemas/Money' }
        reason: { type: string, maxLength: 300 }
        method: { type: string, enum: [ORIGINAL_PAYMENT, BANK_TRANSFER], default: ORIGINAL_PAYMENT }
        returnId: { type: integer, nullable: true }
    AdminReturnDecisionRequest:
      type: object
      required: [approve]
      properties:
        approve: { type: boolean }
        shippingPaidBy: { type: string, enum: [KIVA, CUSTOMER] }
        instructions: { type: string, maxLength: 1000 }
        rejectionReason: { type: string, maxLength: 500, nullable: true }
    AdminChangeRequestResolutionRequest:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [APPLY, REJECT] }
        variantId:
          type: integer
          nullable: true
          description: 'فقط برای `APPLY` و `changeType` = `COLOR`/`MODEL`: ورینت جایگزین؛ اگر نیاید همان `desiredVariantId` ِ مشتری. همان قانون `desiredVariantId` را دارد (`400 DESIRED_VARIANT_INVALID`)؛ با `REJECT`، `CANCEL_ITEM` یا `OTHER` ← `400 VARIANT_NOT_ALLOWED`'
        note:
          type: string
          maxLength: 500
          nullable: true
          description: 'برای مشتری: در `feedback.resolution.note` و تایم‌لاین سفارش دیده می‌شود (پیامک متن آزاد ندارد)؛ برای `REJECT` و `OTHER` لازم'
          example: رنگ مشکی تموم شده بود؛ همون رنگ قبلی برات ارسال می‌شه.
        notifyCustomer: { type: boolean, default: true }
    AdminRefundUpdateRequest:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [PROCESSING, COMPLETED, FAILED] }
        referenceId:
          type: string
          maxLength: 64
          nullable: true
          description: 'شماره‌ی پیگیری انتقال بانکی (`[0-9A-Za-z-]`)؛ برای `COMPLETED` همیشه لازم (`400 REFERENCE_ID_REQUIRED`)'
          example: '140507181234567'
        note: { type: string, maxLength: 300, nullable: true, description: 'می‌شود `Refund.statusNote`؛ مشتری هم می‌بیند' }
    AdminReturnRequest:
      description: مرجوعی در پنل؛ `ReturnRequest` به‌اضافه‌ی مشتری، شماره شبا و قدم‌های مجاز بعدی
      allOf:
        - $ref: '#/components/schemas/ReturnRequest'
        - type: object
          required: [customer, iban, receipt, allowedTransitions]
          properties:
            customer:
              type: object
              properties:
                id: { type: integer }
                fullName: { type: string, nullable: true }
                phone: { $ref: '#/components/schemas/PhoneNumber' }
            iban: { type: string, nullable: true, pattern: '^IR\d{24}$', description: 'برای `refundMethod = BANK_TRANSFER`؛ در بقیه `null`' }
            receipt:
              type: object
              nullable: true
              description: نتیجه‌ی رسیدن به انبار (`POST /admin/returns/{returnId}/receipt`)؛ تا آن موقع `null`
              properties:
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      orderItemId: { type: integer }
                      receivedQuantity: { type: integer }
                      restockQuantity: { type: integer }
                note: { type: string, nullable: true }
            allowedTransitions:
              type: array
              description: 'قدم‌های مجاز بعدی (بخش ۴)؛ `REFUNDED` یعنی «ثبت استرداد با `returnId`»'
              items: { $ref: '#/components/schemas/ReturnStatus' }
              example: [REFUNDED, CLOSED]
    AdminReturnPickupRequest:
      type: object
      required: [carrier]
      properties:
        carrier: { $ref: '#/components/schemas/ShippingMethodCode' }
        scheduledFor: { type: string, format: date-time, nullable: true, description: زمان مراجعه‌ی مأمور }
        trackingCode: { type: string, minLength: 6, maxLength: 40, nullable: true }
        note: { type: string, maxLength: 500, nullable: true, description: برای مشتری }
        notifyCustomer: { type: boolean, default: true }
    AdminReturnReceiptRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          description: 'برای هر قلم مرجوعی؛ `restockQuantity ≤ receivedQuantity ≤` تعداد درخواست‌شده'
          items:
            type: object
            required: [orderItemId, receivedQuantity, restockQuantity]
            properties:
              orderItemId: { type: integer }
              receivedQuantity: { type: integer, minimum: 0 }
              restockQuantity: { type: integer, minimum: 0, description: عددهای سالم که به موجودی برمی‌گردند }
        note: { type: string, maxLength: 1000, nullable: true, description: نتیجه‌ی بازبینی (داخلی) }
    AdminReturnCloseRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 3, maxLength: 500, description: برای مشتری, example: مرسوله تا ۱۴ روز بعد از تأیید به انبار نرسید. }
        notifyCustomer: { type: boolean, default: true }

    # ============ ADMIN · MARKETING ============
    DiscountCodeUpsertRequest:
      type: object
      description: |
        ساخت و ویرایش کد تخفیف. همه‌ی خطاهای شکل با هم (`400`، روی همان فیلد). ویرایش کدی که استفاده شده مجاز است: سفارش‌های قبلی مبلغ
        ذخیره‌شده‌ی خودشان را دارند و سبدها با همگام‌سازی بعدی دوباره بررسی می‌شوند (کدی که دیگر نمی‌خورد با `DISCOUNT_REMOVED` برداشته می‌شود).
      required: [code, type, value, label]
      properties:
        code:
          type: string
          pattern: '^[A-Z0-9_-]{3,32}$'
          description: |
            اول trim، حروف بزرگ و ارقام لاتین می‌شود، بعد با الگو سنجیده می‌شود (` paeez۱۵ ` ← `PAEEZ15`؛ `DISCOUNT_CODE_TEXT_INVALID`).
            تکراری (به‌جز خود همین کد در ویرایش) ← `409 DUPLICATE_CODE`. کدهای دوحرفی قدیمی معتبر می‌مانند، ولی کد تازه حداقل ۳ حرف است.
          example: PAEEZ15
        type: { type: string, enum: [PERCENT, FIXED], description: '`DISCOUNT_TYPE_INVALID`' }
        value: { type: integer, description: '`PERCENT`: درصد ۱ تا ۱۰۰؛ `FIXED`: ۱٬۰۰۰ تا ۱۰۰٬۰۰۰٬۰۰۰ تومان (`DISCOUNT_VALUE_INVALID`)', example: 15 }
        label: { type: string, minLength: 1, maxLength: 200, description: 'متنی که سبد نشان می‌دهد (`AppliedDiscount.label`)', example: '۱۵٪ تخفیف پاییزه (خرید بالای ۲ میلیون)' }
        minSubtotal: { type: integer, allOf: [{ $ref: '#/components/schemas/Money' }], nullable: true, description: '۰ تا ۱٬۰۰۰٬۰۰۰٬۰۰۰؛ `null` = بدون حداقل', example: 2000000 }
        maxDiscount: { type: integer, allOf: [{ $ref: '#/components/schemas/Money' }], nullable: true, description: 'سقف تخفیف، **فقط** برای `PERCENT` (۱٬۰۰۰ تا ۱۰۰٬۰۰۰٬۰۰۰)؛ با `FIXED` ← `400 MAX_DISCOUNT_NOT_ALLOWED`' }
        startsAt: { type: string, format: date-time, nullable: true }
        endsAt: { type: string, format: date-time, nullable: true, description: 'بعد از `startsAt` (`DATE_RANGE_INVALID`)؛ کد تا (نه در) این لحظه کار می‌کند' }
        usageLimit: { type: integer, minimum: 1, nullable: true, description: 'کل دفعات مجاز (سفارش‌های پرداخت‌نشده‌ی در جریان هم شمرده می‌شوند)؛ `null` = بی‌سقف' }
        perUserLimit: { type: integer, minimum: 1, nullable: true, description: 'دفعات مجاز هر مشتری؛ `null` = بی‌سقف. پیش‌فرض ندارد: نیامده یعنی `null`' }
        firstOrderOnly: { type: boolean, default: false, description: مثل WELCOME }
        requiresLogin:
          type: boolean
          default: false
          description: |
            در پاسخ، مقدار **ذخیره‌شده** برمی‌گردد: `requiresLogin` یا `firstOrderOnly` یا `perUserLimit ≠ null`؛ چون مهمان را نمی‌شود شمرد،
            هر کدام از این‌ها کد را «فقط با ورود» می‌کند (`DISCOUNT_LOGIN_REQUIRED`).
        excludeSaleItems: { type: boolean, default: false, description: اعمال نشدن روی کالاهای تخفیف‌خورده }
        categoryIds:
          type: array
          maxItems: 50
          uniqueItems: true
          description: 'دسته‌هایی که کد شاملشان است؛ هر کدام باید وجود داشته باشد (`400 CATEGORY_NOT_FOUND` روی `categoryIds.i`). با `productIds` «اجتماع» است: ردیفی مشمول است که محصولش در `productIds` یا دسته‌اش در `categoryIds` باشد؛ هر دو خالی = همه‌ی ردیف‌ها'
          items: { type: integer }
        productIds:
          type: array
          maxItems: 200
          uniqueItems: true
          description: 'محصولاتی که کد شاملشان است؛ هر کدام باید وجود داشته باشد (`400 PRODUCT_NOT_FOUND` روی `productIds.i`)'
          items: { type: integer }
        isActive: { type: boolean, default: true }
    DiscountCode:
      allOf:
        - $ref: '#/components/schemas/DiscountCodeUpsertRequest'
        - type: object
          required: [id, usedCount, totalDiscountGiven, createdAt, updatedAt]
          properties:
            id: { type: integer }
            usedCount: { type: integer, description: 'سفارش‌های پرداخت‌شده و برنگشته (لغوشده نه) که این کد را دارند', example: 132 }
            totalDiscountGiven: { allOf: [{ $ref: '#/components/schemas/Money' }], description: 'جمع تخفیف همان سفارش‌ها' }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    CampaignUpsertRequest:
      type: object
      required: [slug, title, startsAt, endsAt]
      properties:
        slug: { type: string, example: paeez-1405 }
        title: { type: string, example: جشنواره پاییزه }
        subtitle: { type: string }
        icon: { $ref: '#/components/schemas/IconName' }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        productIds:
          type: array
          description: خالی = همه‌ی محصولات تخفیف‌دار
          items: { type: integer }
        isActive: { type: boolean }
    AdminCampaign:
      description: کمپین در پنل؛ `Campaign` به‌اضافه‌ی انتخاب ذخیره‌شده‌ی محصولات برای فرم ویرایش
      allOf:
        - $ref: '#/components/schemas/Campaign'
        - type: object
          required: [productIds]
          properties:
            productIds:
              type: array
              description: 'همان `productIds` ِ `CampaignUpsertRequest`؛ خالی = همه‌ی محصولات تخفیف‌دار (برخلاف `products` که نتیجه‌ی محاسبه است)'
              items: { type: integer }
              example: [1, 4, 9]
    BannerUpsertRequest:
      type: object
      required: [placement, title]
      properties:
        placement: { $ref: '#/components/schemas/BannerPlacement' }
        theme: { type: string, enum: [CREAM, PURPLE, LILAC, DARK, WHITE] }
        tagLabel: { type: string, nullable: true }
        tagIcon: { $ref: '#/components/schemas/IconName' }
        title: { type: string }
        text: { type: string }
        ctaLabel: { type: string }
        ctaUrl: { type: string }
        imageMediaId: { type: string }
        overlayHighlight: { type: string, nullable: true }
        overlayTitle: { type: string, nullable: true }
        overlaySubtitle: { type: string, nullable: true }
        overlayChannel: { type: string, allOf: [{ $ref: '#/components/schemas/SocialChannel' }], nullable: true }
        sortOrder: { type: integer }
        startsAt: { type: string, format: date-time, nullable: true }
        endsAt: { type: string, format: date-time, nullable: true }
    TestimonialUpsertRequest:
      type: object
      required: [customerName, source, message, productId]
      properties:
        customerName: { type: string, example: مریم }
        city: { type: string, example: اصفهان }
        source: { $ref: '#/components/schemas/SocialChannel' }
        message: { type: string, maxLength: 500 }
        messageTime: { type: string, example: '11:17' }
        receivedAt: { type: string, format: date-time }
        rating: { type: integer, minimum: 1, maximum: 5, default: 5 }
        productId: { type: integer }
        colorKey: { $ref: '#/components/schemas/ColorKey' }
        screenshotMediaId: { type: string, nullable: true }
        isPublished: { type: boolean, default: true }
        sortOrder: { type: integer }
    AdminTestimonial:
      description: پیام رضایت در پنل؛ `Testimonial` به‌اضافه‌ی فیلدهایی که فقط فرم ویرایش لازم دارد
      allOf:
        - $ref: '#/components/schemas/Testimonial'
        - type: object
          required: [isPublished, sortOrder, screenshotMediaId, createdAt]
          properties:
            isPublished: { type: boolean, description: 'منتشرنشده‌ها در `GET /testimonials` و صفحه‌ی اصلی نمی‌آیند' }
            sortOrder: { type: integer }
            screenshotMediaId: { type: string, nullable: true, description: 'همان `screenshotMediaId` ِ `TestimonialUpsertRequest`؛ بدون اسکرین‌شات `null`' }
            createdAt: { type: string, format: date-time }

    # ============ ADMIN · CONTENT ============
    BlogPostUpsertRequest:
      type: object
      required: [title, slug, categoryId, blocks]
      properties:
        title: { type: string }
        slug: { type: string }
        excerpt: { type: string, maxLength: 300 }
        lead: { type: string }
        categoryId: { type: integer }
        authorId: { type: integer }
        coverMediaId: { type: string }
        coverBackground: { type: string, nullable: true }
        readingMinutes: { type: integer, nullable: true, description: خالی = محاسبه‌ی خودکار }
        blocks:
          type: array
          items:
            type: object
            description: مثل BlogContentBlock، با `productId` و `imageMediaId` به‌جای آبجکت کامل
            properties:
              type: { type: string, enum: [HEADING, PARAGRAPH, QUOTE, TIP, PRODUCT, IMAGE, LIST] }
              text: { type: string, nullable: true }
              html: { type: string, nullable: true }
              title: { type: string, nullable: true }
              items:
                type: array
                nullable: true
                items: { type: string }
              productId: { type: integer, nullable: true }
              imageMediaId: { type: string, nullable: true }
        tags:
          type: array
          items: { type: string }
        isFeatured: { type: boolean }
        status: { type: string, enum: [DRAFT, PUBLISHED, ARCHIVED] }
        publishedAt: { type: string, format: date-time, nullable: true }
        seo: { $ref: '#/components/schemas/SeoMeta' }
    AdminSettings:
      type: object
      description: |
        تنظیمات فروشگاه در پنل. بخشی از این‌ها در `/config` منتشر می‌شوند (روش‌های ارسال، ارسال رایگان، رزرو، مهلت مرجوعی، آستانه‌ی موجودی کم،
        پشتیبانی، شبکه‌های اجتماعی و درگاه‌ها)، `siteStats` در `/site/stats`، و بقیه فقط رفتار سرور را عوض می‌کنند.

        **`PUT` کل سند است:** همه‌ی فیلدهای سطح اول لازم‌اند (فیلد نیامده ← `400 FIELD_REQUIRED` روی همان فیلد؛ `null` فقط برای فیلدهای
        `nullable`) و لیست‌ها **کامل جایگزین** می‌شوند. فیلدهای فقط‌خواندنی (`shippingMethods[].description`، `paymentGateways[].name`،
        `paymentGateways[].available`، `siteStats.satisfaction.scale`، `siteStats.satisfaction.metrics[].label`) نادیده گرفته می‌شوند.
        همه‌ی خطاهای شکل با هم و با مسیر فیلد برمی‌گردند (`shippingMethods.1.maxDays`، `social.0.url`). پاسخ همیشه کل سند تازه است.
        ذخیره‌ی بی‌تغییر `200` است و ردیفی در لاگ تغییرات نمی‌گذارد؛ هر ذخیره‌ی دیگر یک ردیف `SETTINGS_UPDATED` با فیلدهای عوض‌شده.

        **تغییرها فقط از این لحظه به بعد اثر دارند:** `paymentPendingMinutes` برای سفارش‌های تازه؛ `reservationHoldDays` برای گروه‌های رزرو تازه؛
        `returnWindowDays` برای سفارش‌هایی که از این به بعد تحویل می‌شوند؛ `preShipmentFeedbackHours` برای عکس‌هایی که از این به بعد فرستاده می‌شوند؛
        هزینه‌ها و آستانه‌ی ارسال رایگان از همگام‌سازی بعدی سبد (سفارش ثبت‌شده مبلغ خودش را دارد). دو استثنا: **اسم روش ارسال** روی سفارش‌های قبلی هم
        عوض می‌شود (از تنظیمات خوانده می‌شود)، و `lowStockThreshold` همان لحظه همه‌جا.

        **همزمانی:** دو ذخیره‌ی همزمان ← دومی `409 CHANGED_BY_SOMEONE_ELSE` و هیچ‌چیزش ذخیره نمی‌شود؛ پنل سند را دوباره می‌خواند.
      required:
        - shippingMethods
        - defaultShippingMethod
        - freeShippingThreshold
        - freeShippingMethods
        - reservationEnabled
        - reservationHoldDays
        - returnWindowDays
        - lowStockThreshold
        - preShipmentFeedbackHours
        - paymentPendingMinutes
        - nonShippingWeekdays
        - supportPhone
        - supportEmail
        - supportHours
        - social
        - paymentGateways
        - siteStats
        - features
      properties:
        shippingMethods:
          type: array
          description: |
            دقیقاً همان روش‌هایی که فروشگاه دارد (`TIPAX` و `POST`)، هر کدام یک بار (وگرنه `400 SHIPPING_METHOD_LIST_INVALID`)؛ ترتیب لیست = ترتیب نمایش.
            `COURIER` تا تصمیمش گرفته نشده `400 SHIPPING_METHOD_NOT_SUPPORTED` است. حداقل یکی فعال (`400 NO_ACTIVE_SHIPPING_METHOD`).
            هر روش: `name` ۱ تا ۵۰ حرف؛ `baseCost` ۰ تا ۱۰٬۰۰۰٬۰۰۰؛ `minDays` ۰ تا ۳۰ و `maxDays` از `minDays` تا ۳۰ (`NUMBER_OUT_OF_RANGE` با `meta.min` و `meta.max`)؛
            `icon` ۱ تا ۳۰ حرف کوچک انگلیسی، رقم یا خط تیره (`ICON_INVALID`)؛ `trackingUrlTemplate` با `https://`، شامل `{code}` و حداکثر ۳۰۰ حرف، یا `null`
            (`TRACKING_URL_TEMPLATE_INVALID`)؛ `description` فقط خواندنی.
          items: { $ref: '#/components/schemas/ShippingMethod' }
        defaultShippingMethod:
          allOf: [{ $ref: '#/components/schemas/ShippingMethodCode' }]
          description: 'روش سبد تازه؛ باید یکی از روش‌های **فعال** لیست باشد (`400 DEFAULT_SHIPPING_METHOD_INVALID`)'
        freeShippingThreshold: { allOf: [{ $ref: '#/components/schemas/Money' }], description: '۰ تا ۱۰۰٬۰۰۰٬۰۰۰؛ با `subtotal` (بعد از تخفیف محصولات، قبل از کد) مقایسه می‌شود', example: 3000000 }
        freeShippingMethods:
          type: array
          uniqueItems: true
          description: 'روش‌هایی که از آستانه به بعد رایگان‌اند؛ هر کدام یکی از روش‌های لیست `shippingMethods` (`COURIER` ← `SHIPPING_METHOD_NOT_SUPPORTED`، تکرار ← `LIST_ITEM_DUPLICATE`). خالی = ارسال رایگان نداریم'
          items: { $ref: '#/components/schemas/ShippingMethodCode' }
        reservationEnabled: { type: boolean, example: true }
        reservationHoldDays: { type: integer, minimum: 1, maximum: 14, example: 4 }
        returnWindowDays: { type: integer, minimum: 0, maximum: 60, example: 7 }
        lowStockThreshold: { type: integer, minimum: 1, maximum: 20, description: 'کمتر از این ← «موجودی کم» و `availableQuantity`', example: 5 }
        preShipmentFeedbackHours: { type: integer, minimum: 1, maximum: 168, description: مهلت پاسخ مشتری به عکس قبل از تأیید خودکار, example: 24 }
        paymentPendingMinutes: { type: integer, minimum: 5, maximum: 60, example: 15 }
        nonShippingWeekdays:
          type: array
          uniqueItems: true
          description: 'روزهایی که ارسال نداریم و در روز کاری حساب نمی‌شوند؛ کمتر از ۷ روز (`400 NON_SHIPPING_WEEKDAYS_INVALID`)، روز ناشناخته ← `WEEKDAY_INVALID`'
          items: { type: string, enum: [SATURDAY, SUNDAY, MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY] }
          example: [FRIDAY]
        supportPhone: { type: string, nullable: true, description: 'موبایل یا تلفن ثابت ایران با پیش‌شماره (ارقام فارسی لاتین می‌شوند، فاصله و خط تیره حذف)؛ `SUPPORT_PHONE_INVALID`؛ متن خالی مثل `null` یعنی پاک', example: '02191001234' }
        supportEmail: { type: string, format: email, maxLength: 100, nullable: true, description: '`EMAIL_INVALID`، بیشتر از ۱۰۰ ← `EMAIL_TOO_LONG`؛ متن خالی مثل `null` یعنی پاک', example: support@kiva.ir }
        supportHours:
          type: array
          maxItems: 7
          description: |
            هر ردیف (`SUPPORT_HOURS_INVALID` روی همان ردیف): `label` ۱ تا ۵۰ حرف؛ `weekdays` حداقل یک روز، بدون تکرار؛ `from` و `to` به شکل `HH:mm`
            و `from < to`، یا هر دو `null` برای «تعطیل». بیشتر از ۷ ردیف ← `TOO_MANY_ITEMS`.
          items: { $ref: '#/components/schemas/SupportHours' }
        social:
          type: array
          maxItems: 10
          description: 'هر ردیف (`SOCIAL_LINK_INVALID` روی همان ردیف): `channel`؛ `name` ۱ تا ۴۰ حرف؛ `url` با `https://` و حداکثر ۳۰۰ حرف؛ `handle` حداکثر ۵۰ حرف یا `null`. بیشتر از ۱۰ ← `TOO_MANY_ITEMS`'
          items: { $ref: '#/components/schemas/SocialLink' }
        paymentGateways:
          type: array
          description: |
            دقیقاً سه درگاه، هر کدام یک بار (`400 PAYMENT_GATEWAY_LIST_INVALID`)؛ ترتیب لیست = ترتیب نمایش در تسویه.
            حداقل یکی فعال (`400 NO_ACTIVE_GATEWAY`) و دقیقاً یکی پیش‌فرض که فعال هم باشد (`400 DEFAULT_GATEWAY_INVALID`).
          items: { $ref: '#/components/schemas/AdminPaymentGatewaySetting' }
        siteStats:
          allOf: [{ $ref: '#/components/schemas/SiteStats' }]
          description: |
            عددهای بازاریابی، **دستی**؛ همین‌ها در `GET /site/stats` منتشر می‌شوند (حساب نمی‌شوند). همه‌ی فیلدهای `SiteStats` لازم‌اند و عددها
            ۰ تا ۱۰٬۰۰۰٬۰۰۰، درصدها ۰ تا ۱۰۰ (`NUMBER_OUT_OF_RANGE`). `satisfaction` بی‌مقدار `null` است؛ با مقدار: `averageRating` ۰ تا ۵ با حداکثر
            یک رقم اعشار (`RATING_INVALID`)، `totalCount` ≥ ۰، `metrics` هر `key` حداکثر یک بار و `sources` بدون تکرار (`LIST_ITEM_DUPLICATE`)؛
            کلید ناشناخته‌ی `metrics` ← `SATISFACTION_METRIC_INVALID`، شبکه‌ی ناشناخته‌ی `sources` ← `SOCIAL_CHANNEL_INVALID`.
        features:
          type: object
          description: |
            پرچم‌های قابلیت. فقط همین سه کلید (کلید ناشناخته ← `400 FEATURE_UNKNOWN`)، و هر سه لازم: `wishlistShare` (لینک اشتراک علاقه‌مندی‌ها)،
            `reviewMedia` (عکس در نظرها)، `giftWrap` (فعلاً پشتیبانی نمی‌شود: `true` ← `400 FEATURE_NOT_AVAILABLE`).
          required: [wishlistShare, reviewMedia, giftWrap]
          additionalProperties: false
          properties:
            wishlistShare: { type: boolean, example: false }
            reviewMedia: { type: boolean, example: false }
            giftWrap: { type: boolean, example: false }
    AdminPaymentGatewaySetting:
      type: object
      description: یک درگاه در تنظیمات پنل
      required: [code, name, isActive, isDefault, available]
      properties:
        code: { $ref: '#/components/schemas/PaymentGatewayCode' }
        name: { type: string, description: فقط خواندنی, example: زرین‌پال }
        isActive: { type: boolean, description: فروشگاه این درگاه را روشن کرده, example: true }
        isDefault: { type: boolean, description: درگاهی که تسویه اول انتخاب می‌کند, example: true }
        available: { type: boolean, description: 'فقط خواندنی: فعال **و** سرور برایش آداپتر دارد؛ فقط همین‌ها به مشتری پیشنهاد می‌شوند', example: true }

    # ============ ADMIN · SUPPORT & REPORTS ============
    AdminReviewListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/Review'
              - type: object
                properties:
                  customerId: { type: integer }
                  contact: { type: string }
        meta: { $ref: '#/components/schemas/PageMeta' }
        pendingCount: { type: integer, example: 4 }
    ReviewModerationRequest:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [APPROVE, REJECT] }
        rejectionReason: { type: string, nullable: true, maxLength: 300 }
        reply: { type: string, nullable: true, maxLength: 1000, description: ثبت هم‌زمان پاسخ کیوا }
    AdminContactMessage:
      type: object
      properties:
        ticketCode: { type: string, example: CT-4821 }
        topic: { $ref: '#/components/schemas/ContactTopic' }
        fullName: { type: string }
        phone: { $ref: '#/components/schemas/PhoneNumber' }
        email: { type: string, nullable: true }
        orderCode: { type: string, allOf: [{ $ref: '#/components/schemas/OrderCode' }], nullable: true }
        message: { type: string }
        status: { type: string, enum: [OPEN, IN_PROGRESS, CLOSED] }
        reply: { type: string, nullable: true }
        internalNote: { type: string, nullable: true }
        userId: { type: integer, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AdminCustomer:
      type: object
      properties:
        id: { type: integer }
        phone: { $ref: '#/components/schemas/PhoneNumber' }
        fullName: { type: string, nullable: true }
        email: { type: string, nullable: true }
        ordersCount: { type: integer, description: 'سفارش‌هایی که پولشان رسیده (پرداخت‌شده، از جمله لغو و مرجوعی بعدی)؛ پرداخت‌نشده و منقضی نه' }
        totalSpent: { allOf: [{ $ref: '#/components/schemas/Money' }], description: 'جمع `payable` ِ همان سفارش‌ها (در فاز استرداد، مبلغ برگشتی از آن کم می‌شود)' }
        lastOrderAt: { type: string, format: date-time, nullable: true, description: 'زمان ثبت آخرین همان سفارش‌ها؛ بدون خرید `null`' }
        defaultMessenger: { type: string, allOf: [{ $ref: '#/components/schemas/PhotoMessengerChannel' }], nullable: true }
        marketingSmsOptIn: { type: boolean }
        roles:
          type: array
          items: { $ref: '#/components/schemas/UserRole' }
        createdAt: { type: string, format: date-time }
    AdminCustomerDetail:
      description: صفحه‌ی یک مشتری در پنل (`GET /admin/customers/{customerId}`)؛ `AdminCustomer` به‌اضافه‌ی پروفایل کامل، آدرس‌ها و آخرین سفارش‌ها
      allOf:
        - $ref: '#/components/schemas/AdminCustomer'
        - type: object
          required: [firstName, lastName, birthDate, gender, defaultMessengerPhone, addresses, recentOrders]
          properties:
            firstName: { type: string, nullable: true }
            lastName: { type: string, nullable: true }
            birthDate: { type: string, format: date, nullable: true }
            gender: { $ref: '#/components/schemas/Gender' }
            defaultMessengerPhone: { type: string, allOf: [{ $ref: '#/components/schemas/PhoneNumber' }], nullable: true }
            addresses:
              type: array
              description: همه‌ی آدرس‌های ذخیره‌شده، پیش‌فرض اول
              items: { $ref: '#/components/schemas/Address' }
            recentOrders:
              type: array
              description: 'آخرین ۵ سفارش **در هر وضعیتی** (پرداخت‌نشده و منقضی هم، تا پشتیبانی ببیند)، تازه‌ترین اول؛ برای همه: `GET /admin/orders?q=<موبایل>`'
              items: { $ref: '#/components/schemas/AdminOrderListItem' }
    AdminReportOverview:
      type: object
      description: 'داشبورد مدیریتی یک بازه. «سفارش دوره» در `GET /admin/reports/overview`.'
      required: [from, to, revenue, ordersCount, averageOrderValue, newCustomers, reservationShare, mediaApprovalRate, changeRequestRate, returnRate, discountTotal, shippingMix, messengerMix, topProducts, dailySeries]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        revenue: { allOf: [{ $ref: '#/components/schemas/Money' }], description: 'جمع (پرداخت‌شده − برگشت‌داده‌شده) ِ سفارش‌های دوره؛ پرداخت‌شده = مبلغ ثبت + مانده‌ی پرداخت‌شده' }
        ordersCount: { type: integer, description: تعداد سفارش‌های دوره }
        averageOrderValue: { allOf: [{ $ref: '#/components/schemas/Money' }], description: '`revenue ÷ ordersCount` به نزدیک‌ترین تومان (نیمه به بالا)؛ بدون سفارش ۰' }
        newCustomers: { type: integer, description: کاربرانی که **اولین** سفارش پرداخت‌شده‌شان در این بازه است }
        reservationShare: { type: number, description: درصد سفارش‌های دوره که عضو گروه رزروند, example: 18.5 }
        mediaApprovalRate: { type: number, description: 'از سفارش‌هایی که **اولین** عکس قبل از ارسالشان در بازه فرستاده شد، درصد آن‌هایی که هیچ‌وقت درخواست تغییر نداشتند؛ بدون چنین سفارشی ۰', example: 97.2 }
        changeRequestRate: { type: number, description: 'از همان سفارش‌ها، درصد آن‌هایی که حداقل یک درخواست تغییر داشتند (با `mediaApprovalRate` جمعش ۱۰۰ است، یا هر دو ۰)', example: 2.1 }
        returnRate: { type: number, description: 'از سفارش‌هایی که در بازه تحویل شدند، درصد آن‌هایی که درخواست مرجوعی دارند (تا ساخته شدن مرجوعی همیشه ۰)', example: 0.8 }
        discountTotal: { allOf: [{ $ref: '#/components/schemas/Money' }], description: 'جمع تخفیف کد ِ سفارش‌های دوره' }
        shippingMix:
          type: object
          description: 'تعداد سفارش‌های دوره برای **هر** روش ارسال (`ShippingMethodCode`)، صفر هم'
          additionalProperties: { type: integer }
          example: { TIPAX: 120, POST: 310, COURIER: 0 }
        messengerMix:
          type: object
          description: 'تعداد سفارش‌های دوره برای **هر** پیام‌رسان (`PhotoMessengerChannel`)، صفر هم'
          additionalProperties: { type: integer }
          example: { TELEGRAM: 200, BALE: 130, RUBIKA: 100 }
        topProducts:
          type: array
          maxItems: 5
          description: '۵ محصول با بیشترین تعداد فروخته‌شده در سفارش‌های دوره (ردیف‌های **فعلی** سفارش، یعنی بعد از درخواست تغییر)؛ مساوی ← شناسه‌ی کوچک‌تر اول'
          items:
            type: object
            required: [product, unitsSold, revenue]
            properties:
              product: { $ref: '#/components/schemas/ProductRef' }
              unitsSold: { type: integer }
              revenue: { allOf: [{ $ref: '#/components/schemas/Money' }], description: جمع مبلغ ردیف‌های همین محصول }
        dailySeries:
          type: array
          description: 'هر روز تهران ِ بازه، به ترتیب، **صفر هم**: فروش و تعداد سفارش‌های دوره که `paidOn` شان همان روز است'
          items:
            type: object
            required: [date, revenue, orders]
            properties:
              date: { type: string, format: date }
              revenue: { $ref: '#/components/schemas/Money' }
              orders: { type: integer }
    AuditEntityType:
      type: string
      description: 'نوع چیزی که در پنل تغییر کرد. `MEDIA` استفاده نمی‌شود: آپلود مدیا در لاگ تغییرات ثبت نمی‌شود.'
      enum: [PRODUCT, VARIANT, INVENTORY, MEDIA, CATEGORY, COLOR, MATERIAL, ORDER, RETURN, REFUND, DISCOUNT_CODE, CAMPAIGN, BANNER, ANNOUNCEMENT, TESTIMONIAL, FAQ, PAGE, SETTINGS, REVIEW, CONTACT_MESSAGE, USER]
    AuditLogEntry:
      type: object
      description: یک ردیف لاگ تغییرات پنل
      required: [id, at, actor, action, entityType, entityId, entityLabel, summary, changes, ip]
      properties:
        id: { type: integer, example: 90412 }
        at: { type: string, format: date-time }
        actor:
          type: object
          required: [id, fullName, phone]
          properties:
            id: { type: integer, example: 7 }
            fullName: { type: string, nullable: true, example: لیلا احمدی }
            phone: { $ref: '#/components/schemas/PhoneNumber' }
        action:
          type: string
          description: کد ماشینی کار (فهرست باز است و ممکن است کد تازه اضافه شود؛ برای نمایش `summary` کافی است)
          example: PRODUCT_PRICE_CHANGED
        entityType: { $ref: '#/components/schemas/AuditEntityType' }
        entityId: { type: string, description: 'شناسه یا کد همان چیز (`12`، `KV-218340`، `lilac`، `terms`)', example: '12' }
        entityLabel: { type: string, nullable: true, description: نام آماده‌ی نمایش در لحظه‌ی تغییر, example: کیف دوشی ماهک }
        summary: { type: string, description: جمله‌ی فارسی آماده‌ی نمایش, example: قیمت از ۱٬۸۹۰٬۰۰۰ به ۱٬۷۹۰٬۰۰۰ تومان تغییر کرد }
        changes:
          type: array
          nullable: true
          description: 'فیلدهایی که عوض شدند؛ برای کارهایی که «از چه به چه» ندارند (مثل حذف یا ارسال پیامک) `null`'
          items:
            type: object
            required: [field, from, to]
            properties:
              field: { type: string, example: price }
              from: { type: string, nullable: true, example: '1890000' }
              to: { type: string, nullable: true, example: '1790000' }
        ip: { type: string, nullable: true, example: 5.160.12.34 }
