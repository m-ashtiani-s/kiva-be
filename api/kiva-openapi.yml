          example: [کیف مجلسی, کوله دانشگاه, کراس‌بادی مشکی]

    # ============ CHANNELS / METHODS ============
    PhotoMessengerChannel:
      type: string
      description: پیام‌رسان‌های قابل انتخاب برای «عکس قبل از ارسال»
      enum: [RUBIKA, TELEGRAM, BALE]
      example: TELEGRAM
    SocialChannel:
      type: string
      enum: [RUBIKA, TELEGRAM, BALE, INSTAGRAM]
    ShippingMethodCode:
      type: string
      description: "`TIPAX` تیپاکس (۱ تا ۲ روز کاری) · `POST` پست معمولی (۳ تا ۵ روز کاری) · `COURIER` پیک درون‌شهری [پیشنهادی]"
      enum: [TIPAX, POST, COURIER]
      example: POST
    PaymentGatewayCode:
      type: string
      enum: [ZARINPAL, SAMAN, MELLAT]
      example: ZARINPAL
    MessengerOption:
      type: object
      required: [channel, name]
      properties:
        channel: { $ref: '#/components/schemas/PhotoMessengerChannel' }
        name: { type: string, example: تلگرام }
        hint: { type: string, example: با آیدی یا شماره }
        iconUrl: { type: string, format: uri, nullable: true }
        enabled: { type: boolean, example: true }
    ShippingOptionQuote:
      type: object
      required: [method, name, cost, isFree, available]
      properties:
        method: { $ref: '#/components/schemas/ShippingMethodCode' }
        name: { type: string, example: پست معمولی }
        description: { type: string, description: 'ساخته‌شده از `estimatedDelivery.minDays` و `maxDays`', example: تحویل ۳ تا ۵ روز کاری }
        icon: { $ref: '#/components/schemas/IconName' }
        baseCost: { allOf: [{ $ref: '#/components/schemas/Money' }], description: قیمت پایه (برای نمایش خط‌خورده وقتی رایگان است), example: 75000 }
        cost: { allOf: [{ $ref: '#/components/schemas/Money' }], example: 0 }
        isFree: { type: boolean, example: true }
        freeReason:
          type: string
          nullable: true
          enum: [THRESHOLD, RESERVATION_CONSOLIDATION, PROMO, null]
          example: THRESHOLD
        estimatedDelivery:
          type: object
          properties:
            minDays: { type: integer, example: 3 }
            maxDays: { type: integer, example: 5 }
            fromDate: { type: string, format: date, example: '2026-10-08' }
            toDate: { type: string, format: date, example: '2026-10-11' }
        available: { type: boolean, example: true }
        unavailableReason: { type: string, nullable: true }
        selected: { type: boolean, example: true }

    # ============ CART ============
    CartItem:
      type: object
      required: [id, productId, variantId, product, color, quantity, unitPrice, lineTotal, stock, purchasable]
      properties:
        id: { type: string, example: 'ci_8d2f1a' }
        productId: { type: integer, example: 2 }
        variantId: { type: integer, example: 205 }
        product:
          type: object
          properties:
            id: { type: integer, example: 2 }
            slug: { type: string, example: nila-crossbody }
            sku: { type: string, example: KV-1002 }
            name: { type: string, example: کراس‌بادی نیلا }
            category: { $ref: '#/components/schemas/CategoryRef' }
            url: { type: string, example: '/product/nila-crossbody?color=olive' }
        color: { $ref: '#/components/schemas/Color' }
        image:
          type: object
          allOf: [{ $ref: '#/components/schemas/MediaAsset' }]
          nullable: true
          description: عکس رنگ ردیف (همیشه فرستاده می‌شود)؛ تا وقتی عکسی آپلود نشده `null` است، مثل `ProductSummary.image`
        quantity: { type: integer, minimum: 1, example: 1 }
        maxQuantity:
          type: integer
          description: |
            سقف دکمه‌ی + = min(موجودی این رنگ، `maxPerOrder` محصول − تعداد بقیه‌ی رنگ‌های همان محصول در سبد، ۲۰).
            سقف خرید مال محصول است و بین رنگ‌هایش تقسیم می‌شود؛ ردیف غیرقابل خرید هم سهمش را نگه می‌دارد، تا برگشتنش رنگی را که مشتری دارد می‌خرد کم نکند.
            هیچ ردیفی بیشتر از ۲۰ عدد ندارد (افزودن ۱۵ و بعد ۱۰ با `QUANTITY_REDUCED` روی ۲۰ می‌ماند).
            هیچ‌وقت از `maxPerOrder` بیشتر نیست، پس موجودی دقیق را لو نمی‌دهد. برای ردیف غیرقابل خرید `0`.
          example: 5
        purchasable:
          type: boolean
          description: |
            این ردیف الان قابل خرید است (محصول و رنگ در فروشگاه‌اند و موجودی دارند). ردیف غیرقابل خرید در سبد می‌ماند تا مشتری ببیند یا حذفش کند،
            ولی در جمع‌های پول (`totals` به‌جز `itemsCount` و `linesCount`) حساب نمی‌شود و تا وقتی در سبد است `POST /orders` رد می‌شود.
          example: true
        unitPrice: { allOf: [{ $ref: '#/components/schemas/Money' }], example: 1450000 }
        unitCompareAtPrice: { type: integer, allOf: [{ $ref: '#/components/schemas/Money' }], nullable: true, example: 1750000 }
        lineTotal: { allOf: [{ $ref: '#/components/schemas/Money' }], example: 1450000 }
        lineCompareAtTotal: { type: integer, allOf: [{ $ref: '#/components/schemas/Money' }], nullable: true, example: 1750000 }
        lineDiscount: { allOf: [{ $ref: '#/components/schemas/Money' }], example: 300000 }
        stock: { $ref: '#/components/schemas/StockInfo' }
        isWishlisted: { type: boolean, nullable: true, description: کاربر واردشده `true`/`false`؛ مهمان `null` }
        addedAt: { type: string, format: date-time }
    CartIssue:
      type: object
      description: |
        مشکلاتی که از آخرین مشاهده‌ی سبد پیش آمده (نمایش نوار هشدار). هر کدام فقط یک بار می‌آید.
        `QUANTITY_REDUCED` با `currentValue = 0` یعنی ردیف حذف شد: سقف خرید محصول (بعد از کم شدن سقف یا ادغام سبد) جایی برایش نگذاشت؛
        `itemId` شناسه‌ی همان ردیفی است که دیگر در سبد نیست.
        `DISCOUNT_REMOVED`: کد تخفیف سبد دیگر معتبر نیست (منقضی شد، ظرفیتش پر شد، یا سبد دیگر شرطش را ندارد) و برداشته شد؛ `itemId` نال است و پیام کد را نام می‌برد.
      required: [code, message]
      properties:
        code:
          type: string
          enum: [OUT_OF_STOCK, QUANTITY_REDUCED, PRICE_INCREASED, PRICE_DECREASED, VARIANT_UNAVAILABLE, DISCOUNT_REMOVED, SHIPPING_METHOD_CHANGED]
        itemId: { type: string, nullable: true }
        message: { type: string, example: قیمت «کیف دستی آیدا» از آخرین بازدیدت تغییر کرده. }
        previousValue: { type: integer, nullable: true, example: 3290000 }
        currentValue: { type: integer, nullable: true, example: 2790000 }
    CartTotals:
      type: object
      description: |
        `itemsCompareAtTotal` قیمت کالاها ← `productDiscount` تخفیف محصولات ← `subtotal` ←
        `codeDiscount` کد تخفیف ← `shippingCost` ارسال ← `payable` مبلغ قابل پرداخت

        همه‌ی مبلغ‌ها فقط از ردیف‌های قابل خرید (`CartItem.purchasable = true`) حساب می‌شوند. سبدی که ردیف قابل خرید ندارد همه‌ی مبلغ‌هایش ۰ است
        و `shippingIsFree = false`. `itemsCount` و `linesCount` همه‌ی ردیف‌ها را می‌شمرند، چون بج سبد همان چیزی را نشان می‌دهد که در سبد دیده می‌شود.
      required: [itemsCount, itemsCompareAtTotal, productDiscount, subtotal, codeDiscount, shippingCost, payable, currency]
      properties:
        itemsCount: { type: integer, description: جمع تعداد همه‌ی ردیف‌ها (بج سبد), example: 2 }
        linesCount: { type: integer, description: تعداد همه‌ی ردیف‌ها, example: 2 }
        itemsCompareAtTotal: { allOf: [{ $ref: '#/components/schemas/Money' }], description: «قیمت کالاها» (جمع قیمت‌های قبل از تخفیف), example: 4080000 }
        productDiscount: { allOf: [{ $ref: '#/components/schemas/Money' }], description: «تخفیف محصولات», example: 600000 }
        subtotal: { allOf: [{ $ref: '#/components/schemas/Money' }], description: جمع سبد بعد از تخفیف محصولات (مبنای کد تخفیف و ارسال رایگان), example: 3480000 }
        codeDiscount: { allOf: [{ $ref: '#/components/schemas/Money' }], example: 0 }
        shippingCost: { allOf: [{ $ref: '#/components/schemas/Money' }], example: 0 }
        shippingIsFree: { type: boolean, example: true }
        payable: { allOf: [{ $ref: '#/components/schemas/Money' }], description: «مبلغ قابل پرداخت», example: 3480000 }
        totalSavings: { allOf: [{ $ref: '#/components/schemas/Money' }], description: «۶۰۰٬۰۰۰ تومان صرفه‌جویی کردی!» = productDiscount + codeDiscount, example: 600000 }
        currency: { $ref: '#/components/schemas/Currency' }
    FreeShippingProgress:
      type: object
      properties:
        threshold: { allOf: [{ $ref: '#/components/schemas/Money' }], example: 3000000 }
        method: { $ref: '#/components/schemas/ShippingMethodCode' }
        eligible: { type: boolean, example: false }
        remaining: { allOf: [{ $ref: '#/components/schemas/Money' }], description: «فقط ۱٬۵۵۰٬۰۰۰ تومان تا ارسال رایگان با پست», example: 1550000 }
        progressPercent:
          type: number
          description: '`subtotal` نسبت به `threshold`، با یک رقم اعشار (نیمه به بالا). `100` فقط وقتی `eligible`: تا وقتی حتی ۱ تومان مانده، حداکثر `99.9`'
          example: 48.3
        message: { type: string, example: فقط ۱٬۵۵۰٬۰۰۰ تومان تا ارسال رایگان با پست }
    AppliedDiscount:
      type: object
      properties:
        code: { type: string, example: KIVA10 }
        label: { type: string, example: ۱۰٪ تخفیف روی کل سبد }
        type: { type: string, enum: [PERCENT, FIXED] }
        value: { type: integer, example: 10 }
        amount: { allOf: [{ $ref: '#/components/schemas/Money' }], description: مبلغی که کد از همین سبد کم می‌کند (همان `totals.codeDiscount`), example: 348000 }
    CartReservation:
      type: object
      description: وضعیت سوییچ «رزرو ۴ روزه» در سبد/تسویه
      properties:
        available: { type: boolean, example: true }
        unavailableReason:
          type: string
          nullable: true
          description: |
            فقط وقتی `available = false`:
            `HAS_ACTIVE_RESERVATION` کاربر رزرو فعال دارد (خرید به همان آدرس خودکار ادغام می‌شود؛ `consolidation` را ببینید) ·
            `ITEM_NOT_RESERVABLE` حداقل یک کالای سبد قابل رزرو نیست · `RESERVATION_DISABLED` رزرو در تنظیمات سایت خاموش است
          enum: [HAS_ACTIVE_RESERVATION, ITEM_NOT_RESERVABLE, RESERVATION_DISABLED, null]
          example: null
        enabled: { type: boolean, example: false }
        holdDays: { type: integer, example: 4 }
        shipAfterDate: { type: string, format: date, description: «ارسال بعد از سه‌شنبه ۱۵ مهر», example: '2026-10-09' }
        timeline:
          type: array
          description: |
            سه کارت تایم‌لاین رزرو، با تاریخ شمسی تهران: «امروز، ۲۰ مهر» · «تا {روز هفته} {روز} {ماه}» (همان `shipAfterDate`) · «بعد از ۴ روز».
            وقتی رزرو در تنظیمات سایت خاموش است (`RESERVATION_DISABLED`) خالی است
          items:
            type: object
            properties:
              title: { type: string, example: تا جمعه ۱۸ مهر }
              text: { type: string, example: هر محصول دیگه‌ای خواستی به همین سفارش اضافه کن }
    ReservationConsolidation:
      type: object
      description: کاربر رزرو فعال دارد؛ این سفارش به گروه ارسال آن می‌پیوندد و هزینه‌ی ارسال ندارد
      properties:
        reservedOrderCode: { $ref: '#/components/schemas/OrderCode' }
        expiresAt: { type: string, format: date-time }
        addressId: { type: integer, description: 'فقط ارسال به همین آدرس ادغام می‌شود، و فقط اگر از شروع رزرو ویرایش نشده باشد' }
        shippingWaived: { type: boolean, example: true }
        shippingMethod:
          allOf: [{ $ref: '#/components/schemas/ShippingMethodCode' }]
          description: روش ارسال گروه (همان روش سفارش اصلی)؛ برای سفارش پیوسته قابل انتخاب نیست
        message: { type: string, example: این خرید به سفارش رزروی KV-218340 اضافه می‌شه و هزینه ارسال نداره. }
    Cart:
      type: object
      required: [id, items, totals, shippingMethod, shippingOptions, reservation]
      properties:
        id: { type: string, example: 'cart_3Fq8' }
        isGuest: { type: boolean, example: true }
        items:
          type: array
          description: به ترتیب افزودن، قدیمی‌ترین اول
          items: { $ref: '#/components/schemas/CartItem' }
        totals: { $ref: '#/components/schemas/CartTotals' }
        shippingMethod:
          allOf: [{ $ref: '#/components/schemas/ShippingMethodCode' }]
          description: روش ارسال انتخاب‌شده. سبد تازه با روش پیش‌فرض فروشگاه (`POST`) شروع می‌شود؛ اگر روش انتخاب‌شده غیرفعال شود، به همان برمی‌گردد (`SHIPPING_METHOD_CHANGED`).
        shippingOptions:
          type: array
          items: { $ref: '#/components/schemas/ShippingOptionQuote' }
        freeShipping:
          type: object
          allOf: [{ $ref: '#/components/schemas/FreeShippingProgress' }]
          nullable: true
          description: نوار «تا ارسال رایگان». `null` وقتی فروشگاه هیچ روش ارسال فعالی با ارسال رایگان ندارد
        reservation: { $ref: '#/components/schemas/CartReservation' }
        consolidation: { type: object, allOf: [{ $ref: '#/components/schemas/ReservationConsolidation' }], nullable: true, description: 'برای آدرس پیش‌فرض کاربر (سبد آدرس ندارد)؛ برای مهمان همیشه `null`' }
        discount: { type: object, allOf: [{ $ref: '#/components/schemas/AppliedDiscount' }], nullable: true }
        issues:
          type: array
          items: { $ref: '#/components/schemas/CartIssue' }
        checkoutRequiresLogin: { type: boolean, description: «برای پرداخت، با شماره موبایل وارد می‌شی», example: true }
        updatedAt: { type: string, format: date-time }
    CartMutationResponse:
      type: object
      required: [cart]
      properties:
        cart: { $ref: '#/components/schemas/Cart' }
        affectedItemId: { type: string, nullable: true, example: 'ci_8d2f1a' }
        removedItem:
          type: object
          nullable: true
          description: برای دکمه‌ی «برگردون»
          properties:
            variantId: { type: integer, example: 205 }
            quantity: { type: integer, example: 1 }
            name: { type: string, example: کراس‌بادی نیلا }
        message:
          type: string
          nullable: true
          description: تُست بعد از افزودن («… (۱ عدد) به سبد اضافه شد») یا حذف («… از سبد حذف شد»)؛ `null` برای تغییر ردیف، و برای افزودنی که ردیف جای بیشتری نداشت (`issues` دلیلش را می‌گوید)
          example: کراس‌بادی نیلا — زیتونی (۱ عدد) به سبد اضافه شد
    AddCartItemRequest:
      type: object
      required: [variantId]
      properties:
        variantId: { type: integer, example: 205 }
        quantity: { type: integer, minimum: 1, maximum: 20, default: 1 }
    UpdateCartItemRequest:
      type: object
      properties:
        quantity: { type: integer, minimum: 1, maximum: 20, example: 2 }
        variantId: { type: integer, description: '[پیشنهادی] تغییر رنگ همان محصول در سبد' }
    ApplyDiscountCodeRequest:
      type: object
      required: [code]
      properties:
        code: { type: string, minLength: 2, maxLength: 32, description: حساس به حروف نیست؛ سرور trim و UPPERCASE می‌کند و ارقام فارسی/عربی را لاتین, example: KIVA10 }

    # ============ CHECKOUT ============
    PaymentGateway:
      type: object
      required: [code, name]
      properties:
        code: { $ref: '#/components/schemas/PaymentGatewayCode' }
        name: { type: string, example: زرین‌پال }
        logoUrl: { type: string, format: uri, nullable: true }
        brandColor: { type: string, example: '#F2C230' }
        initial: { type: string, description: حرف داخل لوگوی جایگزین, example: ز }
        isDefault: { type: boolean, description: 'درگاهی که تسویه اول انتخاب می‌کند، و همیشه یکی از درگاه‌های `available`: پیش‌فرض فروشگاه اگر در دسترس است، وگرنه اولین درگاه در دسترس. بدون درگاه در دسترس، هیچ‌کدام', example: true }
        available: { type: boolean, description: 'در تنظیمات فروشگاه فعال است **و** سرور برایش آداپتر دارد. فقط همین‌ها در `POST /orders` پذیرفته می‌شوند', example: true }
    CheckoutContext:
      type: object
      required: [cart, addresses, messengers, shippingOptions, paymentGateways]
      properties:
        cart: { $ref: '#/components/schemas/Cart' }
        addresses:
          type: array
          description: آدرس پیش‌فرض اول، بعد بقیه از قدیمی‌ترین (مثل `GET /me/addresses`)
          items: { $ref: '#/components/schemas/Address' }
        selectedAddressId: { type: integer, nullable: true, description: 'آدرسی که تسویه با آن شروع می‌شود: `addressId` ِ درخواست، وگرنه آدرس پیش‌فرض. `null` وقتی کاربر هیچ آدرسی ندارد: فرانت فرم آدرس تازه (`newAddress` در `POST /orders`) را باز می‌کند', example: 42 }
        messengers:
          type: array
          description: روبیکا، تلگرام و بله، به همین ترتیب
          items: { $ref: '#/components/schemas/MessengerOption' }
        selectedMessenger: { type: string, allOf: [{ $ref: '#/components/schemas/PhotoMessengerChannel' }], nullable: true, description: پیام‌رسان پیش‌فرض پروفایل یا آخرین انتخاب }
        messengerPhone: { allOf: [{ $ref: '#/components/schemas/PhoneNumber' }], description: آخرین شماره‌ی استفاده‌شده یا موبایل حساب }
        shippingOptions:
          type: array
          items: { $ref: '#/components/schemas/ShippingOptionQuote' }
        reservation: { $ref: '#/components/schemas/CartReservation' }
        consolidation: { type: object, allOf: [{ $ref: '#/components/schemas/ReservationConsolidation' }], nullable: true, description: 'برای آدرس انتخاب‌شده (`selectedAddressId`)' }
        paymentGateways:
          type: array
          description: همه‌ی درگاه‌های فروشگاه به ترتیب، در دسترس یا نه (`available`)؛ دقیقاً یکی `isDefault` اگر حداقل یکی در دسترس است
          items: { $ref: '#/components/schemas/PaymentGateway' }
        giftWrap:
          type: object
          description: '[پیشنهادی] بسته‌بندی هدیه. فعلاً `{available: false, price: 0}`'
          properties:
            available: { type: boolean, example: true }
            price: { allOf: [{ $ref: '#/components/schemas/Money' }], example: 45000 }
        termsUrl: { type: string, example: /pages/terms }
    AddressInput:
      type: object
      required: [provinceId, cityId, addressLine, postalCode, recipientName, recipientPhone]
      properties:
        title: { type: string, maxLength: 30, nullable: true, description: '[پیشنهادی] «خانه»، «محل کار»', example: خانه }
        provinceId: { type: integer, example: 8 }
        cityId: { type: integer, example: 394 }
        addressLine: { type: string, minLength: 10, maxLength: 300, description: 'خیابان، کوچه، پلاک، واحد. ارقام همان‌طور که تایپ شده‌اند می‌مانند؛ حروف عربی (ي، ك) و فاصله‌های اضافه یکدست می‌شوند.', example: 'خیابان ولیعصر، بالاتر از پارک ساعی، کوچه نسترن، پلاک ۱۲، واحد ۴' }
        plaque: { type: string, maxLength: 10, nullable: true, description: '[پیشنهادی] خالی = null. ارقامش لاتین ذخیره می‌شود.', example: '12' }
        unit: { type: string, maxLength: 10, nullable: true, description: '[پیشنهادی] خالی = null. ارقامش لاتین ذخیره می‌شود.', example: '4' }
        postalCode: { allOf: [{ $ref: '#/components/schemas/PostalCode' }], description: 'ارقام فارسی، فاصله و «-» پذیرفته و حذف می‌شوند («۱۹۶۵۸-۴۳۱۱۷» ← 1965843117)؛ بعد دقیقاً ۱۰ رقم.' }
        recipientName: { type: string, minLength: 3, maxLength: 80, example: سارا محمدی }
        recipientPhone: { $ref: '#/components/schemas/PhoneNumber' }
        isSelfRecipient: { type: boolean, description: «گیرنده خودم هستم», example: true }
        location:
          type: object
          nullable: true
          description: '[پیشنهادی] انتخاب روی نقشه برای پیک. هر دو با هم یا هیچ‌کدام؛ وگرنه `LOCATION_INVALID`.'
          properties:
            lat: { type: number, format: double, example: 35.7575 }
            lng: { type: number, format: double, example: 51.4107 }
        setAsDefault: { type: boolean, default: false, description: '`true` = پیش‌فرض شود. `false` پیش‌فرض بودن را برنمی‌دارد. اولین آدرس همیشه پیش‌فرض است.' }
    PlaceOrderRequest:
      type: object
      required: [shippingMethod, paymentGateway]
      description: |
        دقیقاً یکی از `addressId` یا `newAddress` باید ارسال شود؛ هیچ‌کدام یا هر دو = `400`. خطاهای `newAddress` با پیشوند `newAddress.` در `errors[].field` می‌آیند.
        سبد و کد تخفیف همیشه از سبد کاربر خوانده می‌شوند؛ وضعیت رزرو هم، مگر `reserve` در این بدنه بیاید.
        `preShipmentMessenger` اجباری است، ولی با قانون کسب‌وکار (`422 MESSENGER_REQUIRED` / `MESSENGER_PHONE_INVALID`)، نه با شکل ورودی (`400`)؛ ترتیب کامل در `POST /orders`.
      properties:
        addressId: { type: integer, nullable: true, example: 42 }
        newAddress: { type: object, allOf: [{ $ref: '#/components/schemas/AddressInput' }], nullable: true }
        saveNewAddress:
          type: boolean
          default: true
          description: «ذخیره این آدرس در حساب کاربری». اگر دفترچه‌ی آدرس پر باشد (۲۰ آدرس)، سفارش ثبت می‌شود و آدرس ذخیره نمی‌شود.
        preShipmentMessenger:
          type: object
          description: |
            «عکس کیفت رو قبل از ارسال کجا بفرستیم؟» — اجباری (امضای کیوا).
            نیامده یا بدون `channel` ← `422 MESSENGER_REQUIRED`؛ `phone` نیامده یا غلط ← `422 MESSENGER_PHONE_INVALID`. مقدار `channel` خارج از فهرست ← `400`.
          properties:
            channel: { $ref: '#/components/schemas/PhotoMessengerChannel' }
            phone: { $ref: '#/components/schemas/PhoneNumber' }
            username: { type: string, nullable: true, description: '[پیشنهادی] آیدی تلگرام', example: '@sara_m' }
            note: { type: string, maxLength: 200, nullable: true, description: «توضیح برای عکس», example: از داخل کیف هم عکس بگیرید }
            saveAsDefault: { type: boolean, default: true }
        shippingMethod: { $ref: '#/components/schemas/ShippingMethodCode' }
        reserve: { type: boolean, nullable: true, description: 'رزرو ۴ روزه (اگر null از سبد خوانده می‌شود). وقتی سفارش به رزرو فعال می‌پیوندد (`consolidation`) نادیده گرفته می‌شود' }
        paymentGateway: { $ref: '#/components/schemas/PaymentGatewayCode' }
        customerNote: { type: string, maxLength: 300, nullable: true, description: '[پیشنهادی] توضیح سفارش' }
        gift:
          type: object
          nullable: true
          description: '[پیشنهادی] سفارش هدیه'
          properties:
            wrap: { type: boolean, description: 'تا وقتی `CheckoutContext.giftWrap.available = false` است نادیده گرفته می‌شود (بدون هزینه)', example: true }
            message: { type: string, maxLength: 200, example: تولدت مبارک! }
            hidePrices: { type: boolean, default: true }
        expectedPayable:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: |
            مبلغی که کاربر روی دکمه‌ی پرداخت دیده؛ برای تشخیص تغییر قیمت (`409 PRICE_CHANGED`). فقط برای مقایسه است و هیچ‌وقت مبلغ پرداخت را تعیین نمی‌کند.
            به‌شدت توصیه می‌شود همیشه فرستاده شود؛ اگر نیاید مقایسه‌ای انجام نمی‌شود و سفارش با مبلغ فعلی سرور ثبت می‌شود.
          example: 1595000
        acceptTerms: { type: boolean, default: false, description: '«با پرداخت، قوانین کیوا رو می‌پذیری». نیامده = نپذیرفته (`422 TERMS_NOT_ACCEPTED`)', example: true }
    PaymentInit:
      type: object
      required: [paymentId, gateway, amount, redirect]
      properties:
        paymentId: { type: string, example: 'pay_01J9X2K7' }
        gateway: { $ref: '#/components/schemas/PaymentGatewayCode' }
        amount: { $ref: '#/components/schemas/Money' }
        redirect:
          type: object
          description: برای GET فقط `url`؛ برای POST (سامان/ملت) یک فرم auto-submit با `fields` بسازید
          required: [url, method]
          properties:
            url: { type: string, format: uri, example: 'https://www.zarinpal.com/pg/StartPay/A00000000000000000000000000217885159' }
            method: { type: string, enum: [GET, POST] }
            fields:
              type: object
              additionalProperties: { type: string }
              example: {}
        expiresAt: { type: string, format: date-time, description: 'پایان مهلت پرداخت سفارش و رزرو موقت موجودی (ثبت سفارش + ۱۵ دقیقه). برای همه‌ی تلاش‌های پرداخت یک سفارش یکی است و تمدید نمی‌شود. برای پرداخت مانده (`purpose = BALANCE`) پایان پنجره‌ی همین تلاش روی درگاه (شروع + ۲۰ دقیقه)؛ مانده خودش مهلت ندارد.' }
    PlaceOrderResponse:
      type: object
      required: [order]
      properties:
        order: { $ref: '#/components/schemas/OrderSummary' }
        payment: { type: object, allOf: [{ $ref: '#/components/schemas/PaymentInit' }], nullable: true }
    PaymentStatus:
      type: string
      description: |
        `PENDING` مشتری هنوز از درگاه برنگشته یا verify در جریان است ·
        `SUCCEEDED` پرداخت تأیید شد · `FAILED` درگاه رد کرد، verify رد شد، یا سفارش دیگر قابل پرداخت نبود (مبلغ را درگاه برمی‌گرداند) ·
        `CANCELLED` مشتری در درگاه انصراف داد · `EXPIRED` مهلت پرداخت سفارش تمام شد، یا مشتری بیش از ۲۰ دقیقه در درگاه ماند و برنگشت و درگاه می‌گوید پرداخت نشده · `REFUNDED` وجه برگشت داده شد (از جمله تلاشی که verify شد ولی سفارشش دیگر قابل پرداخت نبود و درگاه همان لحظه مبلغ را برگرداند)
      enum: [PENDING, SUCCEEDED, FAILED, CANCELLED, EXPIRED, REFUNDED]
    PaymentResult:
      type: object
      required: [paymentId, status, amount, gateway]
      properties:
        paymentId: { type: string, example: 'pay_01J9X2K7' }
        status:
          allOf: [{ $ref: '#/components/schemas/PaymentStatus' }]
          description: روی صفحه‌ی نتیجه `PENDING` یعنی verify در جریان است؛ کلاینت هر ۳ ثانیه و حداکثر ۳۰ ثانیه دوباره می‌پرسد.
        amount: { $ref: '#/components/schemas/Money' }
        gateway: { $ref: '#/components/schemas/PaymentGatewayCode' }
        referenceId: { type: string, nullable: true, description: شماره پیگیری بانکی, example: '201843917' }
        cardMask: { type: string, nullable: true, example: '6037-99**-****-1234' }
        paidAt: { type: string, format: date-time, nullable: true }
        failureReason: { type: string, nullable: true, description: 'فقط برای تلاش ناموفق؛ برای `SUCCEEDED` و `PENDING` همیشه `null`', example: تراکنش توسط کاربر لغو شد }
        canRetry: { type: boolean, description: 'پرداخت موفق نیست، در حال verify هم نیست (صفحه منتظر نتیجه‌اش می‌ماند)، و سفارش هنوز در مهلت پرداخت است (`POST /payments/{paymentId}/retry`)', example: false }
        order:
          type: object
          properties:
            code: { $ref: '#/components/schemas/OrderCode' }
            status: { $ref: '#/components/schemas/OrderStatus' }
            reserved: { type: boolean, example: false }
            consolidatedInto: { type: string, allOf: [{ $ref: '#/components/schemas/OrderCode' }], nullable: true, description: 'کد سفارش اصلی رزروی که این سفارش به آن پیوسته و همراهش ارسال می‌شود؛ برای خود سفارش اصلی و سفارش عادی `null`' }
        nextSteps:
          type: array
          description: سه قدم صفحه‌ی موفقیت؛ فقط برای `SUCCEEDED`، وگرنه خالی
          items: { type: string }
          example:
            - سفارشت در حال آماده‌سازیه.
            - عکس و ویدیوی کیفت رو قبل از ارسال توی تلگرام برات می‌فرستیم.
            - بعد از تحویل به تیپاکس، کد رهگیری توی حسابت قرار می‌گیره.

    # ============ ORDERS ============
    OrderStatus:
      type: string
      enum: [PENDING_PAYMENT, PAYMENT_FAILED, EXPIRED, RESERVED, PROCESSING, PHOTO_SENT, CHANGE_REQUESTED, SHIPPED, DELIVERED, CANCELLED, RETURN_REQUESTED, RETURNED, REFUNDED]
      example: PHOTO_SENT
    OrderProgressStep:
      type: object
      required: [key, label, state]
      properties:
        key: { type: string, enum: [PLACED, PHOTO_SENT, SHIPPED, DELIVERED] }
        label: { type: string, example: عکس ارسال شد }
        icon: { $ref: '#/components/schemas/IconName' }
        state: { type: string, enum: [DONE, CURRENT, UPCOMING] }
        at: { type: string, format: date-time, nullable: true }
    OrderProgress:
      type: object
      properties:
        currentStepIndex: { type: integer, minimum: 0, maximum: 3, example: 1 }
        steps:
          type: array
          minItems: 4
          maxItems: 4
          items: { $ref: '#/components/schemas/OrderProgressStep' }
    ReservationInfo:
      type: object
      properties:
        active: { type: boolean, description: 'در `GET /me/reservation` همیشه `true`؛ روی کارت سفارش `false` یعنی مهلت تمام شده و سفارش به‌زودی `PROCESSING` می‌شود', example: true }
        orderCode: { $ref: '#/components/schemas/OrderCode' }
        startedAt: { type: string, format: date-time, description: لحظه‌ی پرداخت موفق سفارش اصلی (شروع مهلت) }
        expiresAt: { type: string, format: date-time, description: 'startedAt + reservationHoldDays؛ برای کل گروه ثابت است و تمدید نمی‌شود. برای شمارنده «۲ روز و ۱۴ ساعت و ۵ دقیقه مانده»' }
        remainingSeconds: { type: integer, example: 223500 }
        groupOrderCodes:
          type: array
          description: سفارش‌های پرداخت‌شده‌ی این رزرو به ترتیب پرداخت؛ اولی سفارش اصلی است
          items: { $ref: '#/components/schemas/OrderCode' }
        message: { type: string, example: تا سه‌شنبه ۱۵ مهر هر خریدی کنی، با همین سفارش و بدون هزینه ارسال جدید فرستاده می‌شه. }
    Shipment:
      type: object
      properties:
        carrier: { $ref: '#/components/schemas/ShippingMethodCode' }
        carrierName: { type: string, example: تیپاکس }
        trackingCode: { type: string, nullable: true, example: TPX4821760 }
        trackingUrl: { type: string, format: uri, nullable: true, example: 'https://tipaxco.com/tracking' }
        shippedAt: { type: string, format: date-time, nullable: true }
        deliveredAt: { type: string, format: date-time, nullable: true }
        waitingMessage: { type: string, nullable: true, example: بعد از تحویل به تیپاکس این‌جا نمایش داده می‌شه }
    OrderItemPreview:
      type: object
      properties:
        productId: { type: integer, example: 4 }
        name: { type: string, example: کیف دستی آیدا }
        colorKey: { $ref: '#/components/schemas/ColorKey' }
        imageUrl: { type: string, format: uri, nullable: true, description: 'عکس رنگ؛ تا آپلود مدیا `null`، مثل ردیف سبد' }
        quantity: { type: integer, example: 1 }
    PreShipmentMediaSummary:
      type: object
      properties:
        status: { type: string, enum: [WAITING, SENT, APPROVED, CHANGE_REQUESTED] }
        channel: { $ref: '#/components/schemas/PhotoMessengerChannel' }
        channelName: { type: string, example: تلگرام }
        count: { type: integer, example: 4 }
        hasVideo: { type: boolean, example: true }
        sentAt: { type: string, format: date-time, nullable: true }
    OrderSummary:
      type: object
      description: کارت سفارش در «سفارش‌های من»
      required: [code, placedAt, status, statusLabel, payable, shippingMethod, itemsPreview, progress]
      properties:
        code: { $ref: '#/components/schemas/OrderCode' }
        placedAt: { type: string, format: date-time }
        status: { $ref: '#/components/schemas/OrderStatus' }
        statusLabel: { type: string, example: عکس کیف ارسال شد }
        statusTone: { $ref: '#/components/schemas/Tone' }
        payable: { $ref: '#/components/schemas/Money' }
        balanceDue:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: 'همان `totals.balanceDue`، برای کارت سفارش: مانده‌ی پرداخت بعد از درخواست تغییر به رنگ/مدل گران‌تر؛ معمولاً ۰'
          example: 0
        shippingMethod:
          type: object
          properties:
            code: { $ref: '#/components/schemas/ShippingMethodCode' }
            name: { type: string, example: تیپاکس }
        itemsPreview:
          type: array
          items: { $ref: '#/components/schemas/OrderItemPreview' }
        itemsCount: { type: integer, example: 1 }
        progress: { $ref: '#/components/schemas/OrderProgress' }
        reservation: { type: object, allOf: [{ $ref: '#/components/schemas/ReservationInfo' }], nullable: true }
        shipment: { $ref: '#/components/schemas/Shipment' }
        preShipmentMedia: { $ref: '#/components/schemas/PreShipmentMediaSummary' }
        actions:
          type: object
          description: کدام دکمه‌ها نمایش داده شوند
          properties:
            canCancel: { type: boolean, example: true }
            canRequestChange: { type: boolean, example: true }
            canApproveMedia: { type: boolean, example: true }
            canReturn: { type: boolean, example: false }
            canPay: { type: boolean, description: 'دکمه‌ی «پرداخت» ← `POST /me/orders/{code}/payments` (سفارش پرداخت‌نشده، یا `balanceDue > 0`)', example: false }
            canAddToReservation: { type: boolean, example: false }
            canReview: { type: boolean, description: 'سفارش `DELIVERED` و دست‌کم یک ردیف با `reviewed = false` که محصولش منتشرشده است', example: false }
    OrderItem:
      type: object
      required: [id, productId, variantId, name, color, quantity, unitPrice, lineTotal]
      properties:
        id: { type: integer, description: 'شماره‌ی ردیف در همین سفارش (۱ تا n)؛ فقط داخل سفارش یکتاست', example: 1 }
        productId: { type: integer, example: 4 }
        variantId: { type: integer, example: 402 }
        sku: { type: string, example: KV-1004-CAR }
        name: { type: string, description: snapshot نام در زمان خرید, example: کیف دستی آیدا }
        slug: { type: string, example: aida-satchel }
        color: { $ref: '#/components/schemas/Color' }
        image: { type: string, format: uri, nullable: true, description: 'عکس رنگ در لحظه‌ی خرید (نسخه‌ی ۴۸۰، snapshot)؛ سفارش‌های پیش از آپلود مدیا و رنگ بی‌عکس `null`' }
        quantity: { type: integer, example: 1 }
        unitPrice: { allOf: [{ $ref: '#/components/schemas/Money' }], example: 2790000 }
        unitCompareAtPrice: { type: integer, allOf: [{ $ref: '#/components/schemas/Money' }], nullable: true, example: 3290000 }
        lineTotal: { allOf: [{ $ref: '#/components/schemas/Money' }], example: 2790000 }
        reviewed: { type: boolean, description: 'کاربر برای **محصول** این ردیف نظر زنده (`PENDING` یا `APPROVED`) دارد', example: false }
        returnableUntil: { type: string, format: date-time, nullable: true }
    OrderTotals:
      type: object
      description: |
        جمع‌های سفارش. قبل از هر درخواست تغییر همان جمع‌های لحظه‌ی ثبت‌اند. **بعد از درخواست تغییر** (رنگ/مدل عوض شد یا قلمی حذف شد):

        * `itemsCompareAtTotal`، `productDiscount` و `subtotal` از قلم‌های **فعلی** سفارش حساب می‌شوند (قلم تازه با قیمت لحظه‌ی رسیدگی)؛
        * `shippingCost` همان لحظه‌ی ثبت است؛ `codeDiscount` هم، منهای سهم کد ِ قلم‌های حذف‌شده (`floor(lineTotal × codeDiscount ÷ subtotal)` ِ لحظه‌ی ثبت)؛
          کد با قانون‌های خودش دوباره حساب نمی‌شود؛
        * `payable` کل پرداخت‌شده تا الان است و `balanceDue` مانده؛ `refunded` استردادهای `COMPLETED`.

        همیشه: `subtotal − codeDiscount + shippingCost = payable + balanceDue − (استردادهای ساخته‌شده از درخواست تغییر)`.
      properties:
        itemsCompareAtTotal: { allOf: [{ $ref: '#/components/schemas/Money' }], example: 4080000 }
        productDiscount: { allOf: [{ $ref: '#/components/schemas/Money' }], example: 600000 }
        subtotal: { allOf: [{ $ref: '#/components/schemas/Money' }], example: 3480000 }
        discountCode: { type: string, nullable: true, description: کد تخفیفی که سفارش با آن ثبت شد (`codeDiscount` مال آن است), example: null }
        codeDiscount: { allOf: [{ $ref: '#/components/schemas/Money' }], description: 'تخفیف کد؛ بعد از حذف قلم، منهای سهم کد ِ آن قلم', example: 0 }
        shippingCost: { allOf: [{ $ref: '#/components/schemas/Money' }], example: 0 }
        shippingFreeReason: { type: string, nullable: true, example: THRESHOLD }
        giftWrapCost: { allOf: [{ $ref: '#/components/schemas/Money' }], example: 0 }
        payable: { allOf: [{ $ref: '#/components/schemas/Money' }], description: '«پرداخت شده»: **کل پرداخت‌شده تا الان** (مبلغ ثبت سفارش + مانده‌های پرداخت‌شده). برای سفارش پرداخت‌نشده، مبلغی که باید پرداخت شود', example: 3480000 }
        refunded: { allOf: [{ $ref: '#/components/schemas/Money' }], description: 'جمع استردادهای `COMPLETED`', example: 0 }
        balanceDue:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: مانده‌ی پرداخت بعد از درخواست تغییر به رنگ/مدل گران‌تر؛ در بقیه‌ی موارد ۰. تا صفر نشود سفارش ارسال نمی‌شود. سفارش لغوشده مانده ندارد.
          example: 0
        currency: { $ref: '#/components/schemas/Currency' }
    AddressSnapshot:
      type: object
      description: 'نشانی ِ سفارش در لحظه‌ی ثبت. سفارش ِ حسابی که حذف شده بی‌نام است: همه‌ی فیلدهای شخصی `null` و فقط استان و شهر می‌مانند'
      properties:
        provinceName: { type: string, example: تهران }
        cityName: { type: string, example: تهران }
        addressLine: { type: string, nullable: true, example: 'خیابان ولیعصر، بالاتر از پارک ساعی، کوچه نسترن، پلاک ۱۲، واحد ۴' }
        plaque: { type: string, nullable: true, example: '12' }
        unit: { type: string, nullable: true, example: '4' }
        postalCode: { type: string, nullable: true, allOf: [{ $ref: '#/components/schemas/PostalCode' }] }
        recipientName: { type: string, nullable: true, example: سارا محمدی }
        recipientPhone: { type: string, nullable: true, allOf: [{ $ref: '#/components/schemas/PhoneNumber' }] }
        fullText: { type: string, example: 'تهران، تهران، خیابان ولیعصر، ...', description: 'برای سفارش بی‌نام فقط «استان، شهر»' }
    OrderMediaItem:
      allOf:
        - $ref: '#/components/schemas/MediaAsset'
        - type: object
          properties:
            orderItemId: { type: integer, nullable: true, description: عکس مربوط به کدام قلم (سفارش چندکالایی) }
            view: { $ref: '#/components/schemas/MediaView' }
            capturedAt: { type: string, format: date-time }
    PreShipmentMedia:
      type: object
      properties:
        status:
          type: string
          enum: [WAITING, SENT, APPROVED, CHANGE_REQUESTED]
          description: '`CHANGE_REQUESTED` فقط تا رسیدگی اپراتور؛ بعدش دوباره `WAITING` (عکس تازه)'
        channel: { $ref: '#/components/schemas/PhotoMessengerChannel' }
        channelName: { type: string, example: بله }
        phone: { type: string, nullable: true, allOf: [{ $ref: '#/components/schemas/PhoneNumber' }], description: '`null` فقط برای سفارش بی‌نام (حساب حذف‌شده؛ `username` و `note` هم `null`)' }
        username: { type: string, nullable: true, description: 'شناسه‌ی مشتری در همان پیام‌رسان، اگر در تسویه داده؛ اپراتور به آن می‌فرستد', example: '@sara_m' }
        note: { type: string, nullable: true, example: از داخل کیف هم عکس بگیرید }
        sentAt: { type: string, format: date-time, nullable: true }
        waitingMessage: { type: string, nullable: true, example: قبل از ارسال، از کیفت عکس و ویدیو می‌گیریم و توی بله برات می‌فرستیم؛ یه نسخه هم همین‌جا قرار می‌گیره. }
        items:
          type: array
          description: 'فقط آخرین دسته‌ی **فرستاده‌شده**؛ پیش‌نویس اپراتور فقط در `AdminOrder.draftItems` (و در پاسخ `PUT …/pre-shipment-media`)'
          items: { $ref: '#/components/schemas/OrderMediaItem' }
        feedback:
          type: object
          nullable: true
          description: آخرین پاسخ مشتری؛ برای `REQUEST_CHANGE` همان چیزی که در `PreShipmentFeedbackRequest` فرستاده
          properties:
            decision: { type: string, enum: [APPROVE, REQUEST_CHANGE] }
            changeType: { type: string, nullable: true, enum: [COLOR, MODEL, CANCEL_ITEM, OTHER, null] }
            orderItemId: { type: integer, nullable: true }
            desiredVariantId: { type: integer, nullable: true, description: 'رنگ/مدل جایگزین؛ نام و رنگش از `GET /products/{productId}`' }
            note: { type: string, nullable: true }
            at: { type: string, format: date-time }
            resolution:
              type: object
              nullable: true
              description: نتیجه‌ی درخواست تغییر (`POST /admin/orders/{orderCode}/change-request/resolution`)؛ تا رسیدگی نشده `null`
              properties:
                decision: { type: string, enum: [APPLY, REJECT] }
                variantId: { type: integer, nullable: true, description: ورینتی که واقعاً جایگزین شد }
                note: { type: string, nullable: true }
                at: { type: string, format: date-time }
        feedbackDeadline: { type: string, format: date-time, nullable: true, description: 'زمان ارسال عکس + ۲۴ ساعت؛ اگر تا آن موقع جوابی نیاید عکس خودکار تأیید می‌شود و ارسال ممکن است' }
    OrderEvent:
      type: object
      properties:
        status: { $ref: '#/components/schemas/OrderStatus' }
        label: { type: string, example: تحویل پست شد }
        at: { type: string, format: date-time }
        note: { type: string, nullable: true }
    OrderPaymentInfo:
      type: object
      required: [purpose, amount]
      properties:
        purpose:
          type: string
          enum: [ORDER, BALANCE]
          description: '`ORDER` پرداخت خود سفارش؛ `BALANCE` پرداخت مانده بعد از درخواست تغییر'
          example: ORDER
        amount: { allOf: [{ $ref: '#/components/schemas/Money' }], description: مبلغ همین تلاش, example: 3480000 }
        gateway: { $ref: '#/components/schemas/PaymentGatewayCode' }
        gatewayName: { type: string, example: زرین‌پال }
        status: { $ref: '#/components/schemas/PaymentStatus' }
        referenceId: { type: string, nullable: true, example: '201843917' }
        paidAt: { type: string, format: date-time, nullable: true }
        cardMask: { type: string, nullable: true }
    OrderDetail:
      allOf:
        - $ref: '#/components/schemas/OrderSummary'
        - type: object
          required: [items, address, totals]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/OrderItem' }
            address: { $ref: '#/components/schemas/AddressSnapshot' }
            totals: { $ref: '#/components/schemas/OrderTotals' }
            payment: { $ref: '#/components/schemas/OrderPaymentInfo' }
            preShipmentMediaDetail: { $ref: '#/components/schemas/PreShipmentMedia' }
            timeline:
              type: array
              description: رویدادهای سفارش، قدیمی‌ترین اول. هر تلاش پرداخت ناموفق یک ردیف `PAYMENT_FAILED` ِ خودش را دارد.
              items: { $ref: '#/components/schemas/OrderEvent' }
            customerNote: { type: string, nullable: true }
            gift:
              type: object
              nullable: true
              properties:
                wrap: { type: boolean }
                message: { type: string }
            returns:
              type: array
              items: { $ref: '#/components/schemas/ReturnRequest' }
            invoiceUrl: { type: string, nullable: true, example: /api/v1/me/orders/KV-215566/invoice, description: 'برای سفارشی که یک بار پرداخت شده (لغوشده و مرجوعی‌شده هم)؛ وگرنه `null`' }
            refunds:
              type: array
              description: 'همه‌ی استردادهای سفارش، قدیمی‌ترین اول، با وضعیت و `statusNote`'
              items: { $ref: '#/components/schemas/Refund' }
    OrderListResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/OrderSummary' }
        meta: { $ref: '#/components/schemas/PageMeta' }
        counts:
          type: object
          description: شمارنده‌ی تب‌ها
          properties:
            all: { type: integer, example: 4 }
            current: { type: integer, example: 3 }
            delivered: { type: integer, example: 1 }
            cancelled: { type: integer, example: 0 }
    PreShipmentFeedbackRequest:
      type: object
      required: [decision]
      description: |
        `APPROVE` بقیه‌ی فیلدها را نمی‌خواهد. `REQUEST_CHANGE` با `changeType` (`400 CHANGE_TYPE_REQUIRED`):
        `COLOR` و `MODEL` با `orderItemId` (`ORDER_ITEM_REQUIRED`) و `desiredVariantId` (`DESIRED_VARIANT_REQUIRED`)؛
        `CANCEL_ITEM` با `orderItemId`؛ `OTHER` با `note` (`NOTE_REQUIRED`). فیلدی که برای آن `changeType` معنی ندارد نادیده گرفته می‌شود.
        `COLOR` = رنگ دیگری از همان محصول ِ قلم؛ `MODEL` = رنگی از محصول دیگر (وگرنه `400 DESIRED_VARIANT_INVALID`).
      properties:
        decision: { type: string, enum: [APPROVE, REQUEST_CHANGE] }
        changeType: { type: string, nullable: true, enum: [COLOR, MODEL, CANCEL_ITEM, OTHER, null] }
        orderItemId: { type: integer, nullable: true, description: 'قلم سفارش (`OrderItem.id`)؛ برای `COLOR`، `MODEL` و `CANCEL_ITEM`' }
        desiredVariantId: { type: integer, nullable: true, description: 'رنگ/مدل جایگزین؛ برای `COLOR` و `MODEL`' }
        note: { type: string, maxLength: 500, nullable: true, example: می‌شه رنگ مشکی‌اش رو بفرستید؟ }
    CancelOrderRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, enum: [CHANGED_MIND, NOT_AS_PICTURED, ORDERED_BY_MISTAKE, FOUND_CHEAPER, DELIVERY_TOO_LONG, OTHER] }
        note: { type: string, maxLength: 500, nullable: true }
    CancelOrderResponse:
      type: object
      properties:
        order: { $ref: '#/components/schemas/OrderSummary' }
        refund: { type: object, allOf: [{ $ref: '#/components/schemas/Refund' }], nullable: true, description: 'استرداد `PENDING` ِ ساخته‌شده؛ `null` وقتی چیزی پرداخت نشده بود' }
        message: { type: string, example: سفارش لغو شد. برای برگردوندن پولت، همکارهامون تا ۷۲ ساعت کاری باهات تماس می‌گیرن. }
    Refund:
      type: object
      properties:
        id: { type: integer, example: 31 }
        amount: { $ref: '#/components/schemas/Money' }
        method: { type: string, enum: [ORIGINAL_PAYMENT, BANK_TRANSFER] }
        status: { type: string, enum: [PENDING, PROCESSING, COMPLETED, FAILED] }
        reason: { type: string, nullable: true }
        returnId: { type: integer, nullable: true, description: مرجوعی‌ای که این استرداد برای آن است }
        createdAt: { type: string, format: date-time }
        expectedBy: { type: string, format: date-time, nullable: true, description: 'زمان ثبت + ۷۲ ساعت؛ تخمین تماس همکاران' }
        completedAt: { type: string, format: date-time, nullable: true }
        referenceId: { type: string, nullable: true, description: شماره‌ی پیگیری انتقال بانکی }
        statusNote: { type: string, nullable: true, description: 'توضیح آخرین تغییر وضعیت (`PATCH /admin/refunds/{refundId}`)؛ به مشتری هم نشان داده می‌شود', example: شماره شبا تأیید نشد؛ دوباره باهات تماس می‌گیریم }
    ReturnStatus:
      type: string
      enum: [REQUESTED, APPROVED, REJECTED, PICKUP_SCHEDULED, RECEIVED, REFUNDED, CLOSED]
    ReturnReason:
      type: string
      description: |
        چهار مورد اول (`NOT_AS_PICTURED`، `MANUFACTURING_DEFECT`، `WRONG_ITEM`، `DAMAGED_IN_TRANSIT`) «تقصیر کیوا»اند: پیشنهاد پیش‌فرض
        `shippingPaidBy = KIVA` و حداقل یک عکس یا ویدیو لازم است. `CHANGED_MIND` و `OTHER`: `CUSTOMER`؛ `OTHER` توضیح لازم دارد.
        آسیب در راه تقصیر مشتری نیست (کیوا خسارت را از حامل می‌گیرد).
      enum: [NOT_AS_PICTURED, MANUFACTURING_DEFECT, WRONG_ITEM, DAMAGED_IN_TRANSIT, CHANGED_MIND, OTHER]
    CreateReturnRequest:
      type: object
      description: |
        همه‌ی خطاهای شکل با هم (`400`، روی همان فیلد). شماره شبا گرفته نمی‌شود: برای `BANK_TRANSFER` اپراتور تماس می‌گیرد
        (فیلد `iban` ِ کلاینت قدیمی نادیده گرفته می‌شود).
      required: [items, reason]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 20
          description: 'همه‌ی قلم‌هایی که برمی‌گردند، یک جا. خالی یا نیامده ← `FIELD_REQUIRED`؛ بیشتر از ۲۰ ← `TOO_MANY_ITEMS`؛ هر `orderItemId` یک بار (← `LIST_ITEM_DUPLICATE` روی `items.{i}.orderItemId`)'
          items:
            type: object
            required: [orderItemId, quantity]
            properties:
              orderItemId: { type: integer, description: '`OrderItem.id`؛ نیامده ← `FIELD_REQUIRED`؛ کمتر از ۱ یا نه قلم این سفارش ← `ORDER_ITEM_NOT_FOUND`؛ قلم غیرقابل مرجوعی ← `ITEM_NOT_RETURNABLE`' }
              quantity: { type: integer, minimum: 1, maximum: 20, description: 'نیامده ← `FIELD_REQUIRED`؛ بیرون ۱ تا ۲۰ ← `QUANTITY_INVALID`؛ بیشتر از تعداد قلم ← `RETURN_QUANTITY_EXCEEDS` با `meta.maxQuantity`' }
        reason: { $ref: '#/components/schemas/ReturnReason' }
        description: { type: string, maxLength: 1000, nullable: true, description: 'خالی = بی‌توضیح؛ خط تازه = فاصله؛ نویسه‌ی کنترلی ← `TEXT_INVALID`؛ بیشتر ← `TEXT_TOO_LONG`؛ برای `OTHER` لازم (`DESCRIPTION_REQUIRED`)', example: رنگ کیف با عکس قبل از ارسال فرق داشت. }
        mediaIds:
          type: array
          maxItems: 6
          description: 'عکس‌ها و ویدیوهای مستندات از `POST /me/uploads` (`purpose = RETURN_EVIDENCE`، فقط آپلودهای خود همین کاربر). بیشتر از ۶ ← `TOO_MANY_ITEMS`؛ شناسه‌ی بدشکل ← `MEDIA_ID_INVALID`؛ تکراری ← `LIST_ITEM_DUPLICATE`؛ برای دلیل‌های «تقصیر کیوا» حداقل یکی (`EVIDENCE_REQUIRED`)'
          items: { type: string, pattern: '^med_[0-9A-Za-z]{22}$' }
        refundMethod: { type: string, enum: [ORIGINAL_PAYMENT, BANK_TRANSFER], default: ORIGINAL_PAYMENT, description: 'ترجیح مشتری برای برگشت پول؛ ناشناخته (`STORE_CREDIT` هم) ← `REFUND_METHOD_INVALID`' }
    ReturnRequest:
      type: object
      description: 'مرجوعی، همان‌طور که مشتری می‌بیند (`GET /me/returns`، `OrderDetail.returns`). همه‌ی فیلدها همیشه فرستاده می‌شوند'
      required: [id, code, orderCode, status, statusLabel, reason, description, items, media, shippingPaidBy, instructions, refundMethod, rejectionReason, pickup, refund, createdAt, decidedAt, receivedAt, closedAt, closeReason]
      properties:
        id: { type: integer, example: 12 }
        code: { type: string, pattern: '^RT-\d{4,}$', description: '`RT-` + (۱۰۰۰ + `id`)', example: RT-1012 }
        orderCode: { $ref: '#/components/schemas/OrderCode' }
        status: { $ref: '#/components/schemas/ReturnStatus' }
        statusLabel: { type: string, example: در حال بررسی }
        reason: { $ref: '#/components/schemas/ReturnReason' }
        description: { type: string, nullable: true }
        items:
          type: array
          items:
            type: object
            properties:
              orderItemId: { type: integer }
              name: { type: string }
              color: { $ref: '#/components/schemas/Color' }
              quantity: { type: integer }
        media:
          type: array
          items: { $ref: '#/components/schemas/MediaAsset' }
        shippingPaidBy: { type: string, enum: [KIVA, CUSTOMER], description: 'از لحظه‌ی درخواست پر است: پیشنهاد دلیل (`ReturnReason`)، تا اپراتور موقع تأیید عوضش کند' }
        instructions:
          type: string
          nullable: true
          description: 'دستورالعمل فرستادن، بعد از تأیید (و در قدم‌های بعدی): متن اپراتور، یا اگر ننوشت متن پیش‌فرض همان `shippingPaidBy`. در `REQUESTED` و `REJECTED` `null`'
          example: بسته رو با تیپاکس به آدرس انبار کیوا بفرست و کد رهگیری رو برای پشتیبانی بفرست.
        refundMethod: { type: string, enum: [ORIGINAL_PAYMENT, BANK_TRANSFER] }
        rejectionReason: { type: string, nullable: true, description: فقط برای `REJECTED` }
        pickup:
          type: object
          nullable: true
          description: جمع‌آوری مرسوله توسط کیوا (`PICKUP_SCHEDULED`)؛ وقتی مشتری خودش می‌فرستد `null`
          properties:
            carrier: { $ref: '#/components/schemas/ShippingMethodCode' }
            carrierName: { type: string, example: تیپاکس }
            scheduledFor: { type: string, format: date-time, nullable: true }
            trackingCode: { type: string, nullable: true }
            note: { type: string, nullable: true }
        refund: { type: object, allOf: [{ $ref: '#/components/schemas/Refund' }], nullable: true, description: 'تازه‌ترین استرداد ِ همین مرجوعی (`FAILED` هم، با `statusNote`)؛ تا ثبت استرداد `null`' }
        createdAt: { type: string, format: date-time }
        decidedAt: { type: string, format: date-time, nullable: true }
        receivedAt: { type: string, format: date-time, nullable: true }
        closedAt: { type: string, format: date-time, nullable: true }
        closeReason: { type: string, nullable: true, description: فقط برای `CLOSED` }

    # ============ TRACKING ============
    GuestTrackingRequest:
      type: object
      required: [orderCode, phone]
      properties:
        orderCode:
          type: string
          description: «KV-215566» یا فقط عدد؛ سرور پیشوند KV- را اضافه می‌کند
          example: KV-215566
        phone: { $ref: '#/components/schemas/PhoneNumber' }
    GuestTrackingResult:
      type: object
      properties:
        code: { $ref: '#/components/schemas/OrderCode' }
        placedAt: { type: string, format: date-time }
        shippingMethod:
          type: object
          properties:
            code: { $ref: '#/components/schemas/ShippingMethodCode' }
            name: { type: string, example: پست معمولی }
        status: { $ref: '#/components/schemas/OrderStatus' }
        statusLabel: { type: string, example: تحویل پست شد }
        statusTone: { $ref: '#/components/schemas/Tone' }
        progress: { $ref: '#/components/schemas/OrderProgress' }
        shipment: { $ref: '#/components/schemas/Shipment' }
        preShipmentMedia:
          type: object
          properties:
            channelName: { type: string, example: روبیکا }
            preview:
              type: array
              maxItems: 4
              items: { $ref: '#/components/schemas/MediaAsset' }
            totalCount: { type: integer, example: 5 }
        loginHint: { type: string, example: برای دیدن جزئیات کامل، آدرس و همه عکس‌ها وارد حساب کاربری شو. }
    DailyShipmentDay:
      type: object
      properties:
        date: { type: string, format: date, example: '2026-10-05' }
        label: { type: string, description: «امروز» / «دیروز» / نام روز هفته, example: امروز }
        shipmentCount: { type: integer, example: 11 }
        isNonShippingDay: { type: boolean, description: جمعه‌ها, example: false }
    DailyShipmentEntry:
      type: object
      properties:
        id: { type: integer }
        recipientMasked: { type: string, example: 'س*** م***' }
        recipientInitial: { type: string, example: س }
        city: { type: string, example: اصفهان }
        carrier: { $ref: '#/components/schemas/ShippingMethodCode' }
        carrierName: { type: string, example: تیپاکس }
        phoneLast4: { type: string, pattern: '^\d{4}$', example: '4821' }
        phoneMasked: { type: string, example: '09** *** 4821' }
        trackingCode: { type: string, example: TPX0482176 }
        trackingUrl: { type: string, format: uri }
        shippedAt: { type: string, format: date-time }
    DailyShipmentListResponse:
      type: object
      properties:
        date: { type: string, format: date }
        label: { type: string, example: یکشنبه ۱۳ مهر ۱۴۰۵ }
        isNonShippingDay: { type: boolean, example: false }
        emptyMessage: { type: string, nullable: true, example: جمعه‌ها ارسال نداریم }
        items:
          type: array
          items: { $ref: '#/components/schemas/DailyShipmentEntry' }
        meta: { $ref: '#/components/schemas/PageMeta' }
    TrackingDayGroup:
      type: object
      properties:
        date: { type: string, format: date }
        label: { type: string, example: سه‌شنبه ۸ مهر }
        shipments:
          type: array
          items:
            type: object
            properties:
              orderCode: { $ref: '#/components/schemas/OrderCode' }
              carrier: { $ref: '#/components/schemas/ShippingMethodCode' }
              carrierName: { type: string, example: پست معمولی }
              trackingCode: { type: string, example: '183920674512039845612307' }
              trackingUrl: { type: string, format: uri }

    # ============ AUTH ============
    SendOtpRequest:
      type: object
      required: [phone]
      properties:
        phone: { $ref: '#/components/schemas/PhoneNumber' }
        purpose:
          type: string
          enum: [LOGIN]
          default: LOGIN
          description: کدهای تغییر شماره و حذف حساب endpoint خودشان را دارند و با کد ورود قابل جابه‌جایی نیستند.
    SendOtpResponse:
      type: object
      required: [phone, codeLength, expiresInSeconds, resendAvailableInSeconds]
      properties:
        phone: { allOf: [{ $ref: '#/components/schemas/PhoneNumber' }], description: شماره‌ی نرمال‌شده برای «ارسال شده به ...» }
        codeLength: { type: integer, example: 5 }
        expiresInSeconds: { type: integer, example: 300 }
        resendAvailableInSeconds: { type: integer, description: تایمر دایره‌ای ارسال مجدد, example: 120 }
    PhoneChangeOtpResponse:
      type: object
      required: [currentPhone, newPhone, codeLength, expiresInSeconds, resendAvailableInSeconds]
      properties:
        currentPhone: { allOf: [{ $ref: '#/components/schemas/PhoneNumber' }], description: شماره‌ی فعلی حساب که یک کد به آن رفت }
        newPhone: { allOf: [{ $ref: '#/components/schemas/PhoneNumber' }], description: شماره‌ی جدید (نرمال‌شده) که کد دوم به آن رفت }
        codeLength: { type: integer, example: 5 }
        expiresInSeconds: { type: integer, example: 300 }
        resendAvailableInSeconds: { type: integer, example: 120 }
    VerifyOtpRequest:
      type: object
      required: [phone, code]
      properties:
        phone: { $ref: '#/components/schemas/PhoneNumber' }
        code: { type: string, pattern: '^\d{5}$', example: '48213', description: ارقام فارسی هم پذیرفته می‌شوند }
        guestCartToken: { type: string, nullable: true, description: 'برای ادغام سبد مهمان در سبد کاربر (مثل `POST /cart/merge`)، فقط بعد از کد درست؛ کد اشتباه سبد مهمان را دست نمی‌زند. توکنی که سبدی ندارد (یا بدشکل است) نادیده گرفته می‌شود و ورود را خراب نمی‌کند.', example: 'gct_7f3a9c2e1b' }
        device:
          type: object
          nullable: true
          description: نام دستگاه برای نمایش نشست‌ها؛ اگر نیاید، سرور از `User-Agent` می‌سازد. فقط برای نمایش است، نه امنیت.
          properties:
            name: { type: string, maxLength: 100, example: Chrome on Android }
    AuthTokens:
      type: object
      description: refreshToken اینجا نیست؛ در کوکی `kiva_rt` است (بخش ۲).
      required: [accessToken, tokenType, expiresIn, refreshExpiresIn]
      properties:
        accessToken: { type: string, example: 'eyJhbGciOiJIUzI1NiIs...' }
        tokenType: { type: string, enum: [Bearer] }
        expiresIn: { type: integer, description: عمر accessToken به ثانیه, example: 900 }
        refreshExpiresIn: { type: integer, description: عمر کوکی نشست به ثانیه (مشتری ۳۰ روز، پنل ۱۲ ساعت), example: 2592000 }
    AuthResponse:
      allOf:
        - $ref: '#/components/schemas/AuthTokens'
        - type: object
          required: [isNewUser, user, cart]
          properties:
            isNewUser: { type: boolean, description: true → مرحله‌ی «به کیوا خوش اومدی! دوست داری چی صدات کنیم؟» }
            user: { $ref: '#/components/schemas/User' }
            cart:
              allOf: [{ $ref: '#/components/schemas/Cart' }]
              description: سبد کاربر بعد از ادغام سبد مهمان (اگر `guestCartToken` آمده بود)؛ همیشه هست، حتی خالی. مثل `GET /cart` همگام‌سازی می‌شود، پس `issues` تغییرهای از آخرین بازدید را دارد (یک بار). کلاینت بعد از آن توکن مهمان را دور می‌ریزد.
    PhoneChangeResponse:
      allOf:
        - $ref: '#/components/schemas/AuthTokens'
        - type: object
          required: [user]
          properties:
            user: { $ref: '#/components/schemas/User' }

    # ============ USER ============
    UserRole:
      type: string
      description: |
        `CUSTOMER` را همه دارند و برداشتنی نیست. بقیه نقش‌های پنل‌اند (جدول نقش‌ها در بخش ۲):
        `ADMIN` همه‌کار · `CATALOG_MANAGER` محصول و موجودی · `OPERATOR` سفارش و ارسال · `CONTENT_EDITOR` محتوا و بنر · `SUPPORT` نظرات، تماس و مشتریان
      enum: [CUSTOMER, ADMIN, CATALOG_MANAGER, OPERATOR, CONTENT_EDITOR, SUPPORT]
    Gender:
      type: string
      enum: [FEMALE, MALE, UNSPECIFIED]
    User:
      type: object
      required: [id, phone]
      properties:
        id: { type: integer, example: 1024 }
        phone: { $ref: '#/components/schemas/PhoneNumber' }
        firstName: { type: string, nullable: true, example: سارا }
        lastName: { type: string, nullable: true, example: محمدی }
        fullName: { type: string, nullable: true, example: سارا محمدی }
        displayName: { type: string, description: «سلام سارا» یا «دوست عزیز», example: سارا }
        avatarInitial: { type: string, example: س }
        email: { type: string, format: email, nullable: true, example: sara@example.com }
        birthDate: { type: string, format: date, nullable: true, description: میلادی؛ نمایش شمسی در کلاینت (برای هدیه تولد), example: '1996-09-10' }
        gender: { $ref: '#/components/schemas/Gender' }
        defaultMessenger: { type: string, allOf: [{ $ref: '#/components/schemas/PhotoMessengerChannel' }], nullable: true }
        defaultMessengerPhone: { type: string, allOf: [{ $ref: '#/components/schemas/PhoneNumber' }], nullable: true }
        marketingSmsOptIn: { type: boolean, description: «دریافت پیامک تخفیف‌ها و کالکشن‌های جدید», example: true }
        roles:
          type: array
          items: { $ref: '#/components/schemas/UserRole' }
        createdAt: { type: string, format: date-time }
    UpdateProfileRequest:
      type: object
      properties:
        firstName: { type: string, maxLength: 50, nullable: true, example: سارا }
        lastName: { type: string, maxLength: 50, nullable: true, example: محمدی }
        email: { type: string, format: email, nullable: true }
        birthDate: { type: string, format: date, nullable: true }
        gender: { $ref: '#/components/schemas/Gender' }
        defaultMessenger: { type: string, allOf: [{ $ref: '#/components/schemas/PhotoMessengerChannel' }], nullable: true }
        defaultMessengerPhone: { type: string, allOf: [{ $ref: '#/components/schemas/PhoneNumber' }], nullable: true }
        marketingSmsOptIn: { type: boolean }
    AccountDashboard:
      type: object
      description: هر عدد دقیقاً همان عدد صفحه‌ای است که به آن لینک می‌دهد.
      required: [greeting, user, stats, navCounts, activeReservation, pendingReviewCount]
      properties:
        greeting: { type: string, description: '«سلام {اسم کوچک}» یا «سلام دوست عزیز»', example: سلام سارا }
        user: { $ref: '#/components/schemas/User' }
        stats:
          type: object
          description: چهار کارت آمار بالای حساب
          required: [ordersTotal, ordersActive, mediaReceived, wishlistCount]
          properties:
            ordersTotal: { type: integer, description: 'کل سفارش‌ها = `counts.all` ِ `GET /me/orders`', example: 4 }
            ordersActive: { type: integer, description: 'سفارش جاری = `counts.current` ِ `GET /me/orders` (با پرداخت‌نشده‌ها)', example: 3 }
            mediaReceived: { type: integer, description: 'عکس و ویدیوی دریافتی: جمع `preShipmentMedia.count` ِ آخرین دسته‌ی فرستاده‌شده‌ی هر سفارش', example: 12 }
            wishlistCount: { type: integer, description: '`count` ِ `GET /me/wishlist`', example: 3 }
        navCounts:
          type: object
          description: شمارنده‌های منوی کناری
          required: [orders, addresses, wishlist, reviews]
          properties:
            orders: { type: integer, description: '`counts.all` ِ `GET /me/orders`', example: 4 }
            addresses: { type: integer, description: 'تعداد `GET /me/addresses`', example: 1 }
            wishlist: { type: integer, description: '`count` ِ `GET /me/wishlist`', example: 3 }
            reviews: { type: integer, description: '`counts.total` ِ `GET /me/reviews` (ردشده‌ها هم)', example: 2 }
        activeReservation: { type: object, allOf: [{ $ref: '#/components/schemas/ReservationInfo' }], nullable: true, description: 'همان `GET /me/reservation`؛ نبود ← `null`' }
        pendingReviewCount: { type: integer, description: 'تعداد ردیف‌های `GET /me/reviews/pending-products`', example: 1 }

    # ============ ADDRESS / GEO ============
    City:
      type: object
      required: [id, name]
      properties:
        id: { type: integer, example: 394 }
        name: { type: string, example: تهران }
        provinceId: { type: integer, example: 8 }
    Province:
      type: object
      required: [id, name]
      properties:
        id: { type: integer, example: 8 }
        name: { type: string, example: تهران }
        cities:
          type: array
          nullable: true
          description: شهرهای استان به ترتیب الفبا؛ `null` وقتی با `includeCities=false` خواسته شده
          items: { $ref: '#/components/schemas/City' }
    Address:
      type: object
      required: [id, provinceId, provinceName, cityId, cityName, addressLine, postalCode, recipientName, recipientPhone, isDefault]
      properties:
        id: { type: integer, example: 42 }
        title: { type: string, nullable: true, example: خانه }
        provinceId: { type: integer, example: 8 }
        provinceName: { type: string, example: تهران }
        cityId: { type: integer, example: 394 }
        cityName: { type: string, example: تهران }
        addressLine: { type: string, example: 'خیابان ولیعصر، بالاتر از پارک ساعی، کوچه نسترن، پلاک ۱۲، واحد ۴' }
        plaque: { type: string, nullable: true }
        unit: { type: string, nullable: true }
        postalCode: { $ref: '#/components/schemas/PostalCode' }
        recipientName: { type: string, example: سارا محمدی }
        recipientPhone: { $ref: '#/components/schemas/PhoneNumber' }
        isSelfRecipient: { type: boolean, example: true }
        isDefault: { type: boolean, example: true }
        location:
          type: object
          nullable: true
          properties:
            lat: { type: number, format: double }
            lng: { type: number, format: double }
        fullText: { type: string, description: '«استان، شهر، آدرس»، و اگر فرستاده شده‌اند «پلاک …» و «واحد …» (با ارقام فارسی)', example: 'تهران، تهران، خیابان ولیعصر، بالاتر از پارک ساعی، کوچه نسترن، پلاک ۱۲، واحد ۴' }
        createdAt: { type: string, format: date-time }

    # ============ WISHLIST ============
    WishlistItem:
      type: object
      required: [product, addedAt, preferredColorKey, priceAtAdd, priceDrop]
      properties:
        product: { $ref: '#/components/schemas/ProductSummary' }
        addedAt: { type: string, format: date-time }
        preferredColorKey: { type: string, allOf: [{ $ref: '#/components/schemas/ColorKey' }], nullable: true }
        priceAtAdd: { allOf: [{ $ref: '#/components/schemas/Money' }], description: قیمت در لحظه‌ی ذخیره, example: 1990000 }
        priceDrop:
          type: object
          nullable: true
          description: |
            قیمت فعلی ِ همان رنگ (بدون رنگ: قیمت کارت) کمتر از `priceAtAdd`: `amount` = تفاوت، `percent` = `floor(amount × 100 ÷ priceAtAdd)`، فقط وقتی
            `percent ≥ 1`. گران‌تر یا کمتر از ۱٪ ← `null`. پیامک افت قیمت نداریم.
          required: [amount, percent, label]
          properties:
            amount: { allOf: [{ $ref: '#/components/schemas/Money' }], example: 300000 }
            percent: { type: integer, example: 15 }
            label: { type: string, example: از وقتی ذخیره کردی ۱۵٪ ارزون‌تر شده }
    Wishlist:
      type: object
      required: [items, meta, count, inStockCount, share]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/WishlistItem' }
        meta: { $ref: '#/components/schemas/PageMeta' }
        count: { type: integer, description: 'قلم‌های دیده‌شده (منتشرشده)، همه‌ی صفحه‌ها', example: 3 }
        inStockCount: { type: integer, description: 'قلم‌های دیده‌شده با حداقل یک رنگ موجود: همان‌هایی که «همه به سبد» می‌برد. برای دکمه‌ی «افزودن همه موجودها به سبد (۲)»', example: 2 }
        share: { type: object, allOf: [{ $ref: '#/components/schemas/WishlistShare' }], nullable: true, description: 'لینک فعال؛ نساخته یا پرچم `wishlistShare` خاموش ← `null`' }
    WishlistToggleResponse:
      type: object
      required: [productId, wishlisted, count, message]
      properties:
        productId: { type: integer, example: 7 }
        wishlisted: { type: boolean, example: true }
        count: { type: integer, description: 'برای بج قلب هدر: قلم‌های دیده‌شده', example: 4 }
        message: { type: string, example: به علاقه‌مندی‌ها اضافه شد }
    WishlistAddToCartResponse:
      type: object
      required: [cart, addedCount, skipped, message]
      properties:
        cart: { $ref: '#/components/schemas/Cart' }
        addedCount: { type: integer, example: 2 }
        skipped:
          type: array
          items:
            type: object
            properties:
              productId: { type: integer }
              name: { type: string }
              reason: { type: string, enum: [OUT_OF_STOCK, UNAVAILABLE, ALREADY_AT_MAX] }
        message: { type: string, example: ۲ کیف به سبد اضافه شد }
    WishlistShare:
      type: object
      required: [token, url, createdAt]
      properties:
        token: { type: string, pattern: '^wl_[0-9A-Za-z]{32}$', example: 'wl_9Kq2XzA7bC4dE1fG8hJ3kL6mN0pQ5rS2' }
        url: { type: string, format: uri, description: 'سرور با الگوی `{دامنه‌ی فروشگاه}/wishlist/shared/{token}` می‌سازد (مسیر صفحه‌ی فرانت)', example: 'https://kivashop.ir/wishlist/shared/wl_9Kq2XzA7bC4dE1fG8hJ3kL6mN0pQ5rS2' }
        createdAt: { type: string, format: date-time }
    SharedWishlist:
      type: object
      required: [ownerDisplayName, items]
      properties:
        ownerDisplayName: { type: string, description: 'اسم کوچک صاحب لیست، وگرنه «یکی از دوستان کیوا»', example: سارا }
        items:
          type: array
          items: { $ref: '#/components/schemas/ProductSummary' }

    # ============ SITE CONFIG ============
    ShippingMethod:
      type: object
      properties:
        code: { $ref: '#/components/schemas/ShippingMethodCode' }
        name: { type: string, example: تیپاکس }
        description: { type: string, description: 'ساخته‌شده از `minDays` و `maxDays`، پس همیشه با آن‌ها جور است. فقط خواندنی: در PUT نادیده گرفته می‌شود.', example: تحویل ۱ تا ۲ روز کاری }
        baseCost: { allOf: [{ $ref: '#/components/schemas/Money' }], example: 145000 }
        minDays: { type: integer, example: 1 }
        maxDays: { type: integer, example: 2 }
        icon: { $ref: '#/components/schemas/IconName' }
        trackingUrlTemplate: { type: string, example: 'https://tipaxco.com/tracking?code={code}' }
        isActive: { type: boolean, example: true }
    Announcement:
      type: object
      description: پیام چرخشی نوار بالای سایت
      required: [id, icon, text, url, sortOrder, startsAt, endsAt]
      properties:
        id: { type: integer, example: 1 }
        icon: { type: string, nullable: true, allOf: [{ $ref: '#/components/schemas/IconName' }] }
        text: { type: string, example: هرچی ببینی، همون می‌رسه — قبل از ارسال، عکس کیف خودت رو برات می‌فرستیم }
        url: { type: string, nullable: true }
        sortOrder: { type: integer, description: 'جای پیام در لیست (۰، ۱، …)؛ از ترتیب آرایه‌ی `PUT` ساخته می‌شود' }
        startsAt: { type: string, format: date-time, nullable: true }
        endsAt: { type: string, format: date-time, nullable: true }
    AnnouncementInput:
      type: object
      description: |
        یک پیام در بدنه‌ی `PUT /admin/announcements`. با `id` همان پیام قبلی است و بی `id` پیام تازه؛ `id` ِ ناشناخته ←
        `400 ANNOUNCEMENT_NOT_FOUND` و `id` ِ تکراری ← `400 LIST_ITEM_DUPLICATE`. ترتیب = ترتیب آرایه (`sortOrder` اگر بیاید نادیده).
      required: [text]
      properties:
        id: { type: integer, nullable: true }
        icon: { type: string, nullable: true, description: 'اسم آیکن (`ICON_INVALID`)' }
        text: { type: string, minLength: 1, maxLength: 200, description: '`ANNOUNCEMENT_TEXT_REQUIRED` / `TEXT_TOO_LONG`' }
        url: { type: string, nullable: true, maxLength: 300, description: '`null`، آدرس کامل `https://`، یا مسیر نسبی که با یک `/` شروع می‌شود (نه `//`)؛ وگرنه `URL_INVALID`' }
        startsAt: { type: string, format: date-time, nullable: true }
        endsAt: { type: string, format: date-time, nullable: true, description: 'اگر هر دو هست، بعد از `startsAt` (`DATE_RANGE_INVALID`)' }
    SupportHours:
      type: object
      properties:
        label: { type: string, example: شنبه تا چهارشنبه }
        weekdays:
          type: array
          items: { type: string, enum: [SATURDAY, SUNDAY, MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY] }
        from: { type: string, nullable: true, pattern: '^\d{2}:\d{2}$', example: '09:00' }
        to: { type: string, nullable: true, pattern: '^\d{2}:\d{2}$', example: '21:00' }
        messengerOnly: { type: boolean, description: «جمعه و تعطیلات — فقط پیام‌رسان», example: false }
    SocialLink:
      type: object
      properties:
        channel: { $ref: '#/components/schemas/SocialChannel' }
        name: { type: string, example: تلگرام }
        url: { type: string, format: uri, example: 'https://t.me/kiva_shop' }
        handle: { type: string, example: '@kiva_shop' }
    SiteConfig:
      type: object
      description: |
        همه‌ی فیلدها همیشه هستند (فیلد بی‌مقدار `null`). منبع هر بخش:
        - تنظیمات فروشگاه (`PUT /admin/settings`): `shipping`، `reservation.enabled`/`holdDays`، `returns.windowDays`،
          `inventory.lowStockThreshold`، `paymentGateways`، `support.phone`/`email`/`hours`، `social`، `features`.
        - محتوای ثابت سایت (فعلاً فقط با به‌روزرسانی سرور): `brand`، `currency.label`، `reservation.description`، `returns.policyUrl`،
          `preShipmentPhoto.title`/`description`، `support.emailResponseHint`/`responseTimeHint`، `productPerks`، `trustBadges`، `footerLinks`.
        - ساخته‌ی سرور: `support.phoneDisplay`، `support.isOpenNow`، `auth`، `preShipmentPhoto.channels`/`enabled`/`required`، `currency.code`.
      required: [brand, currency, announcements, shipping, reservation, returns, preShipmentPhoto, inventory, auth, support, social, paymentGateways, productPerks, trustBadges, footerLinks, features]
      properties:
        brand:
          type: object
          required: [name, slogan, about, logoUrl, logoWhiteUrl, faviconUrl]
          properties:
            name: { type: string, example: کیوا }
            slogan: { type: string, example: هرچی ببینی، همون می‌رسه. }
            about: { type: string }
            logoUrl: { type: string, format: uri }
            logoWhiteUrl: { type: string, format: uri }
            faviconUrl: { type: string, format: uri }
        currency:
          type: object
          required: [code, label]
          properties:
            code: { $ref: '#/components/schemas/Currency' }
            label: { type: string, example: تومان }
        announcements:
          type: array
          description: 'فقط پیام‌هایی که **الان** در بازه‌شان هستند (`startsAt ≤ الان < endsAt`؛ `null` یعنی باز)، به ترتیب نمایش'
          items: { $ref: '#/components/schemas/Announcement' }
        shipping:
          type: object
          required: [methods, freeShippingThreshold, freeShippingMethods, nonShippingWeekdays]
          properties:
            methods:
              type: array
              description: فقط روش‌های فعال، به ترتیب تنظیمات (همان‌هایی که سبد پیشنهاد می‌دهد)
              items: { $ref: '#/components/schemas/ShippingMethod' }
            freeShippingThreshold: { allOf: [{ $ref: '#/components/schemas/Money' }], example: 3000000 }
            freeShippingMethods:
              type: array
              items: { $ref: '#/components/schemas/ShippingMethodCode' }
              example: [POST]
            nonShippingWeekdays:
              type: array
              items: { type: string, enum: [SATURDAY, SUNDAY, MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY] }
              example: [FRIDAY]
        reservation:
          type: object
          required: [enabled, holdDays, description]
          properties:
            enabled: { type: boolean, example: true }
            holdDays: { type: integer, example: 4 }
            description: { type: string, example: الان کامل پرداخت کن، ۴ روز بعد برات ارسال می‌شه. }
        returns:
          type: object
          required: [windowDays, policyUrl]
          properties:
            windowDays: { type: integer, example: 7 }
            policyUrl: { type: string, example: /faq#return }
        preShipmentPhoto:
          type: object
          required: [enabled, required, channels, title, description]
          properties:
            enabled: { type: boolean, description: همیشه `true` (عکس قبل از ارسال قدم هر سفارش است), example: true }
            required: { type: boolean, description: همیشه `true`, example: true }
            channels:
              type: array
              description: همان پیام‌رسان‌های صفحه‌ی تسویه (`CheckoutContext.messengers`)
              items: { $ref: '#/components/schemas/MessengerOption' }
            title: { type: string, example: قبل از ارسال، عکس همین کیف رو می‌بینی }
            description: { type: string }
        inventory:
          type: object
          required: [lowStockThreshold]
          properties:
            lowStockThreshold: { type: integer, example: 5 }
        auth:
          type: object
          required: [otpLength, resendCooldownSeconds]
          properties:
            otpLength: { type: integer, example: 5 }
            resendCooldownSeconds: { type: integer, example: 120 }
        support:
          type: object
          required: [phone, phoneDisplay, email, emailResponseHint, responseTimeHint, hours, isOpenNow]
          properties:
            phone: { type: string, nullable: true, example: '02191001234' }
            phoneDisplay:
              type: string
              nullable: true
              description: 'ساخته‌ی سرور از `phone` با ارقام فارسی: ثابت `۰۲۱-۹۱۰۰۱۲۳۴`، موبایل `۰۹۱۲-۳۴۵-۶۷۸۹`؛ بی‌شماره `null`'
              example: ۰۲۱-۹۱۰۰۱۲۳۴
            email: { type: string, format: email, nullable: true, example: support@kiva.ir }
            emailResponseHint: { type: string, example: پاسخ تا ۲۴ ساعت }
            responseTimeHint: { type: string, example: معمولاً کمتر از یک ساعت جواب می‌دیم }
            hours:
              type: array
              items: { $ref: '#/components/schemas/SupportHours' }
            isOpenNow:
              type: boolean
              description: |
                «الان پاسخگوییم» / «خارج از ساعت کاری»، با ساعت تهران: الان در یکی از ردیف‌های `hours` است که روز امروز را دارد،
                `from ≤ الان < to` و `messengerOnly` ش `false` است. ردیف بی‌ساعت یا «فقط پیام‌رسان» هیچ‌وقت `true` نمی‌دهد.
                به خاطر کش تا ۵ دقیقه ممکن است کهنه باشد.
        social:
          type: array
          items: { $ref: '#/components/schemas/SocialLink' }
        paymentGateways:
          type: array
          description: همان درگاه‌های صفحه‌ی تسویه، با همان `available` و `isDefault`
          items: { $ref: '#/components/schemas/PaymentGateway' }
        productPerks:
          type: array
          items: { $ref: '#/components/schemas/Perk' }
        trustBadges:
          type: array
          items:
            type: object
            required: [type, label, imageUrl, linkUrl]
            properties:
              type: { type: string, enum: [ENAMAD, SAMANDEHI] }
              label: { type: string, example: نماد اعتماد الکترونیکی }
              imageUrl: { type: string, format: uri }
              linkUrl: { type: string, format: uri }
        footerLinks:
          type: array
          items:
            type: object
            required: [group, links]
            properties:
              group: { type: string, example: راهنمای خرید }
              links:
                type: array
                items:
                  type: object
                  required: [label, url]
                  properties:
                    label: { type: string, example: کدهای رهگیری روزانه }
                    url: { type: string, example: /track#daily }
        features:
          type: object
          description: 'feature flagها، همان `features` ِ تنظیمات (`wishlistShare`، `reviewMedia`، `giftWrap`)'
          additionalProperties: { type: boolean }
          example: { wishlistShare: false, reviewMedia: false, giftWrap: false }

    # ============ HOME / MARKETING ============
    BannerPlacement:
      type: string
      enum: [HOME_HERO, HOME_PROMO, SHOP_TOP, PRODUCT_SIDEBAR, BLOG_TOP]
    Banner:
      type: object
      description: 'دیده می‌شود وقتی `startsAt ≤ الان < endsAt` (هر کدام `null` = باز)؛ فیلد `isActive` ندارد: برای پنهان کردن `endsAt` را گذشته بگذار یا حذف کن'
      required: [id, placement, theme, tag, title, text, cta, image, overlay, sortOrder, startsAt, endsAt]
      properties:
        id: { type: integer, example: 3 }
        placement: { $ref: '#/components/schemas/BannerPlacement' }
        theme: { type: string, enum: [CREAM, PURPLE, LILAC, DARK, WHITE], example: CREAM }
        tag:
          type: object
          nullable: true
          properties:
            label: { type: string, example: رزرو ۴ روزه }
            icon: { $ref: '#/components/schemas/IconName' }
        title: { type: string, example: 'الان بخر، همه رو یکجا تحویل بگیر' }
        text: { type: string, nullable: true, example: پول کیف رو بده و تا ۴ روز رزروش کن؛ هر خرید دیگه‌ای هم داشتی، همه با یک هزینه ارسال می‌رسه. }
        cta:
          type: object
          nullable: true
          description: 'بنر بی‌دکمه ← `null`'
          properties:
            label: { type: string, example: بیشتر بدونم }
            url: { type: string, example: /faq#reserve }
        image: { $ref: '#/components/schemas/MediaAsset' }
        overlay:
          type: object
          nullable: true
          description: برچسب روی عکس (مثلاً «۴ روز رزرو» یا «عکس کیف شما — در بله ارسال شد»)
          properties:
            highlight: { type: string, nullable: true, example: '4' }
            title: { type: string, example: روز رزرو }
            subtitle: { type: string, example: یک هزینه ارسال }
            channel: { type: string, allOf: [{ $ref: '#/components/schemas/SocialChannel' }], nullable: true }
        sortOrder: { type: integer }
        startsAt: { type: string, format: date-time, nullable: true }
        endsAt: { type: string, format: date-time, nullable: true }
    Campaign:
      type: object
      required: [id, slug, title, subtitle, icon, startsAt, endsAt, serverTime, products, seeAllUrl, isActive]
      properties:
        id: { type: integer, example: 5 }
        slug: { type: string, example: paeez-1405 }
        title: { type: string, example: جشنواره پاییزه }
        subtitle: { type: string, nullable: true, example: تا پایان جشنواره فرصت داری }
        icon: { type: string, allOf: [{ $ref: '#/components/schemas/IconName' }], nullable: true }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time, description: مقصد شمارنده‌ی معکوس }
        serverTime: { type: string, format: date-time, description: برای همگام‌سازی شمارنده با ساعت سرور }
        products:
          type: array
          description: |
            مجموعه = `productIds` ِ کمپین (اگر خالی نیست) وگرنه همه‌ی محصولات منتشرشده؛ فقط تخفیف‌دارها (`discountPercent ≥ 1`) با حداقل یک رنگ موجود؛
            به ترتیب درصد تخفیف نزولی، بعد پرفروش‌تر، بعد شناسه. `GET /campaigns/active` حداکثر ۲۴، صفحه‌ی خانه ۴.
          items: { $ref: '#/components/schemas/ProductSummary' }
        seeAllUrl: { type: string, description: 'همیشه `/products?campaign={slug}`', example: '/products?campaign=paeez-1405' }
        isActive: { type: boolean, example: true }
    SatisfactionSummary:
      type: object
      description: '**دستی**، همان `siteStats.satisfaction` ِ `PUT /admin/settings`؛ از نظرها یا پیام‌ها حساب نمی‌شود'
      properties:
        averageRating: { type: number, minimum: 0, maximum: 5, description: حداکثر یک رقم اعشار, example: 4.9 }
        scale: { type: integer, description: 'همیشه ۵؛ در `PUT /admin/settings` فقط خواندنی', example: 5 }
        totalCount: { type: integer, minimum: 0, description: «بر اساس ۲٬۴۸۰ نظر و پیام ثبت‌شده», example: 2480 }
        metrics:
          type: array
          items:
            type: object
            properties:
              key: { type: string, enum: [PHOTO_MATCH, QUALITY, SHIPPING_SPEED, PACKAGING, SUPPORT] }
              label: { type: string, description: 'از روی `key` ساخته می‌شود؛ در `PUT /admin/settings` فقط خواندنی', example: تطابق با عکس }
              percent: { type: integer, minimum: 0, maximum: 100, example: 98 }
        sources:
          type: array
          items: { $ref: '#/components/schemas/SocialChannel' }
    Testimonial:
      type: object
      required: [id, customerName, customerInitial, city, source, sourceName, message, messageTime, receivedAt, rating, product, color, screenshotUrl]
      properties:
        id: { type: integer, example: 1 }
        customerName: { type: string, example: سارا }
        customerInitial: { type: string, example: س }
        city: { type: string, nullable: true, example: تهران }
        source: { $ref: '#/components/schemas/SocialChannel' }
        sourceName: { type: string, example: تلگرام }
        message: { type: string, example: سلام، کیف امروز رسید. دقیقاً همونیه که توی عکس دیده بودم، حتی رنگش! }
        messageTime: { type: string, nullable: true, example: '10:12' }
        receivedAt: { type: string, format: date-time, nullable: true }
        rating: { type: integer, minimum: 1, maximum: 5, example: 5 }
        product: { $ref: '#/components/schemas/ProductRef' }
        color: { type: object, allOf: [{ $ref: '#/components/schemas/Color' }], nullable: true }
        screenshotUrl: { type: string, format: uri, nullable: true, description: '[پیشنهادی] اسکرین‌شات واقعی پیام برای اعتماد بیشتر' }
    TestimonialListResponse:
      type: object
      required: [summary, items, meta]
      properties:
        summary: { type: object, allOf: [{ $ref: '#/components/schemas/SatisfactionSummary' }], nullable: true, description: 'تنظیم نشده ← `null`' }
        items:
          type: array
          items: { $ref: '#/components/schemas/Testimonial' }
        meta: { $ref: '#/components/schemas/PageMeta' }
    HomeFeature:
      type: object
      properties:
        icon: { $ref: '#/components/schemas/IconName' }
        title: { type: string, example: عکس قبل از ارسال }
        subtitle: { type: string, example: کیف خودت رو قبل از ارسال ببین }
    HomePage:
      type: object
      required: [hero, features, categories, newArrivals, promos, sale, testimonials, howItWorks]
      properties:
        hero:
          type: object
          properties:
            eyebrow: { type: string, example: 'امضای کیوا: عکس قبل از ارسال' }
            title: { type: string, example: 'هرچی ببینی، همون می‌رسه.' }
            text: { type: string }
            primaryCta: { type: object, properties: { label: { type: string, example: مشاهده محصولات }, url: { type: string, example: /products } } }
            secondaryCta: { type: object, properties: { label: { type: string, example: چطور کار می‌کنیم؟ }, url: { type: string, example: '#how' } } }
            showcaseProduct:
              allOf: [{ $ref: '#/components/schemas/ProductSummary' }]
              nullable: true
              description: |
                محصولی که رنگ‌هایش در کارت «روی سایت دیدی = قبل از ارسال فرستادیم» می‌چرخد (از `colors[].imageUrl`): محصول انتخاب‌شده‌ی محتوا اگر
                منتشرشده است، وگرنه تازه‌ترین محصول منتشرشده؛ هیچ محصولی نیست ← `null`
            showcaseMessenger: { $ref: '#/components/schemas/PhotoMessengerChannel' }
        features:
          type: array
          items: { $ref: '#/components/schemas/HomeFeature' }
        categories:
          type: array
          items: { $ref: '#/components/schemas/Category' }
        newArrivals:
          type: array
          items: { $ref: '#/components/schemas/ProductSummary' }
        promos:
          type: array
          items: { $ref: '#/components/schemas/Banner' }
        sale: { type: object, allOf: [{ $ref: '#/components/schemas/Campaign' }], nullable: true }
        testimonials: { $ref: '#/components/schemas/TestimonialListResponse' }
        howItWorks:
          type: array
          items:
            type: object
            properties:
              step: { type: integer, example: 2 }
              title: { type: string, example: عکس کیف خودت، قبل از ارسال }
              text: { type: string }
              isSignature: { type: boolean, example: true }
    SiteStats:
      type: object
      description: 'عددهای بازاریابی، دستی از `PUT /admin/settings` (`siteStats`)؛ حساب نمی‌شوند'
      required: [happyCustomers, preShipmentPhotos, photoMatchSatisfactionPercent, productModels, satisfaction]
      properties:
        happyCustomers: { type: integer, minimum: 0, example: 12000 }
        preShipmentPhotos: { type: integer, minimum: 0, example: 48000 }
        photoMatchSatisfactionPercent: { type: integer, minimum: 0, maximum: 100, example: 98 }
        productModels: { type: integer, minimum: 0, example: 60 }
        satisfaction: { allOf: [{ $ref: '#/components/schemas/SatisfactionSummary' }], nullable: true }

    # ============ FAQ / CONTACT / PAGES ============
    FaqItem:
      type: object
      required: [id, question, answer, questionHighlighted, answerHighlighted, sortOrder]
      properties:
        id: { type: integer, example: 7 }
        question: { type: string, example: رزرو ۴ روزه چطور کار می‌کنه؟ }
        answer: { $ref: '#/components/schemas/HtmlString' }
        questionHighlighted:
          type: string
          nullable: true
          description: 'فقط با `q`: متن سؤال، **escape‌شده**، با `<mark>` دور هر تطابق (پس با `innerHTML` امن است)؛ بی `q` `null`'
        answerHighlighted:
          type: string
          nullable: true
          description: 'فقط با `q`: همان `answer` با `<mark>` دور هر تطابق، فقط داخل متن (نه داخل تگ یا آدرس)؛ بی `q` `null`'
        sortOrder: { type: integer, description: جای سؤال در گروه (۰، ۱، …) }
    FaqGroup:
      type: object
      required: [id, name, icon, isSignature, sortOrder, questions]
      properties:
        id: { type: string, description: 'anchor لینک مستقیم — photo / order / reserve / shipping / return / payment / account', example: reserve }
        name: { type: string, example: رزرو ۴ روزه }
        icon: { type: string, nullable: true, allOf: [{ $ref: '#/components/schemas/IconName' }] }
        isSignature: { type: boolean, description: تگ «امضای کیوا», example: false }
        sortOrder: { type: integer, description: جای گروه (۰، ۱، …) }
        questions:
          type: array
          items: { $ref: '#/components/schemas/FaqItem' }
    FaqItemInput:
      type: object
      description: 'یک سؤال در بدنه‌ی `PUT /admin/faq/groups`. با `id` همان سؤال (حتی اگر به گروه دیگری رفته باشد)، بی `id` سؤال تازه'
      required: [question, answer]
      properties:
        id: { type: integer, nullable: true, description: '`id` ِ ناشناخته ← `FAQ_ITEM_NOT_FOUND`؛ تکراری ← `LIST_ITEM_DUPLICATE`' }
        question: { type: string, minLength: 1, maxLength: 300, description: '`QUESTION_REQUIRED` / `TEXT_TOO_LONG`' }
        answer: { type: string, description: 'HTML؛ بعد از پاک‌سازی (`HtmlString`) ۱ تا ۵۰۰۰ نویسه (`ANSWER_REQUIRED` / `TEXT_TOO_LONG`)' }
    FaqGroupInput:
      type: object
      description: یک گروه در بدنه‌ی `PUT /admin/faq/groups`؛ ترتیب گروه‌ها و سؤال‌ها = ترتیب آرایه‌ها (`sortOrder` اگر بیاید نادیده)
      required: [id, name, questions]
      properties:
        id: { type: string, pattern: '^[a-z][a-z0-9-]{1,30}$', description: 'anchor، یکتا (`FAQ_ANCHOR_INVALID` / `FAQ_ANCHOR_DUPLICATE`)' }
        name: { type: string, minLength: 1, maxLength: 60, description: '`FAQ_GROUP_NAME_REQUIRED` / `TEXT_TOO_LONG`' }
        icon: { type: string, nullable: true, description: 'اسم آیکن (`ICON_INVALID`)' }
        isSignature: { type: boolean, default: false }
        questions:
          type: array
          maxItems: 50
          description: 'حداکثر ۵۰ (`FAQ_TOO_MANY` با `meta.maxItems`)'
          items: { $ref: '#/components/schemas/FaqItemInput' }
    FaqResponse:
      type: object
      required: [groups, totalMatches, emptyMessage]
      properties:
        groups:
          type: array
          description: 'با `q` فقط گروه‌هایی که سؤال جور دارند، و در هر گروه فقط سؤال‌های جور'
          items: { $ref: '#/components/schemas/FaqGroup' }
        totalMatches: { type: integer, description: 'با `q` تعداد سؤال‌های جور؛ بی `q` تعداد همه‌ی سؤال‌ها', example: 3 }
        emptyMessage: { type: string, nullable: true, description: 'فقط وقتی `groups` خالی است', example: سوالی با این کلمه پیدا نکردیم؛ از پشتیبانی بپرس }
    ContactTopic:
      type: string
      enum: [ORDER_FOLLOWUP, PRODUCT_QUESTION, RETURN, COLLABORATION, OTHER]
    ContactTopicOption:
      type: object
      required: [value, label, requiresOrderCode]
      properties:
        value: { $ref: '#/components/schemas/ContactTopic' }
        label: { type: string, description: '«پیگیری سفارش»، «سؤال درباره‌ی محصول»، «مرجوعی»، «همکاری»، «سایر»', example: پیگیری سفارش }
        requiresOrderCode: { type: boolean, description: 'فیلد اختیاری «شماره سفارش» نمایش داده شود (اجباری نیست): `ORDER_FOLLOWUP` و `RETURN`', example: true }
    ContactMessageRequest:
      type: object
      required: [topic, fullName, phone, message]
      properties:
        topic: { $ref: '#/components/schemas/ContactTopic' }
        fullName: { type: string, minLength: 3, maxLength: 80, example: سارا محمدی }
        phone: { type: string, description: 'موبایل `09…` (ارقام فارسی هم)', example: '09123456789' }
        email: { type: string, format: email, nullable: true, description: 'با حروف کوچک ذخیره می‌شود' }
        orderCode: { type: string, nullable: true, description: '`KV-` و رقم‌ها (`kv-218340` و ارقام فارسی هم)؛ فقط مرجع، مالکیتش چک نمی‌شود', example: KV-218340 }
        message: { type: string, minLength: 10, maxLength: 600, description: متن ساده؛ خط تازه نگه داشته می‌شود, example: سلام، سفارشم هنوز عکسش برام ارسال نشده. }
    ContactMessageResponse:
      type: object
      required: [ticketCode, createdAt, message]
      properties:
        ticketCode: { type: string, description: '`CT-` و ۶ رقم تصادفی', example: CT-482113 }
        createdAt: { type: string, format: date-time }
        message: { type: string, example: پیامت رسید! به زودی از طریق پیامک باهات تماس می‌گیریم. }
    NewsletterSubscribeRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email, example: sara@example.com }
        source: { type: string, maxLength: 30, description: 'حروف کوچک لاتین، رقم، `_` و `-`؛ غیر از این نادیده (`null`)', example: footer }
    NewsletterSubscription:
      type: object
      description: یک مشترک خبرنامه در پنل (`GET /admin/newsletter/subscriptions`)
      required: [id, email, status, source, subscribedAt, unsubscribedAt]
      properties:
        id: { type: integer, example: 318 }
        email: { type: string, format: email, example: sara@example.com }
        status: { type: string, enum: [ACTIVE, UNSUBSCRIBED] }
        source: { type: string, nullable: true, example: footer }
        subscribedAt: { type: string, format: date-time }
        unsubscribedAt: { type: string, format: date-time, nullable: true }
    StaticPage:
      type: object
      required: [slug, title, content, updatedAt, seo]
      properties:
        slug: { type: string, example: terms }
        title: { type: string, example: قوانین و حریم خصوصی }
        content: { $ref: '#/components/schemas/HtmlString' }
        updatedAt: { type: string, format: date-time }
        seo:
          type: object
          required: [title, description, canonicalUrl, ogImageUrl, noIndex]
          description: '`SeoMeta` ِ صفحه: `title` بی‌مقدار ← «عنوان صفحه | کیوا»؛ `canonicalUrl` همیشه `{سایت}/pages/{slug}`؛ `ogImageUrl` فعلاً `null`'
          properties:
            title: { type: string }
            description: { type: string, nullable: true }
            canonicalUrl: { type: string, format: uri }
            ogImageUrl: { type: string, format: uri, nullable: true }
            noIndex: { type: boolean }
    StaticPageUpsertRequest:
      type: object
      description: |
        بدنه‌ی `PUT /admin/pages/{slug}`. `slug` یا نیاید یا همان مسیر باشد (`400 SLUG_IMMUTABLE`). `title` ۱ تا ۱۲۰
        (`PAGE_TITLE_REQUIRED` / `TEXT_TOO_LONG`)؛ `content` HTML که بعد از پاک‌سازی (`HtmlString`) ۱ تا ۵۰٬۰۰۰ نویسه است
        (`PAGE_CONTENT_REQUIRED` / `TEXT_TOO_LONG`). `seo`: `title` ≤ ۷۰، `description` ≤ ۱۷۰، `noIndex`؛ بقیه‌ی `SeoMeta` نادیده.
      required: [title, content]
      properties:
        slug: { type: string, nullable: true }
        title: { type: string, minLength: 1, maxLength: 120 }
        content: { type: string }
        seo:
          type: object
          nullable: true
          properties:
            title: { type: string, nullable: true, maxLength: 70 }
            description: { type: string, nullable: true, maxLength: 170 }
            noIndex: { type: boolean, default: false }
    AdminStaticPageSummary:
      type: object
      description: یک ردیف لیست صفحه‌های ثابت در پنل
      required: [slug, title, updatedAt]
      properties:
        slug: { type: string, example: terms }
        title: { type: string, example: قوانین و حریم خصوصی }
        updatedAt: { type: string, format: date-time }

    # ============ BLOG ============
    BlogCategory:
      type: object
      properties:
        id: { type: integer, example: 2 }
        slug: { type: string, example: buying-guide }
        name: { type: string, example: راهنمای خرید }
        postCount: { type: integer, example: 2 }
    BlogAuthor:
      type: object
      properties:
        id: { type: integer, example: 1 }
        name: { type: string, example: نیلوفر }
        title: { type: string, example: تیم استایل کیوا }
        initial: { type: string, example: ن }
        avatarUrl: { type: string, format: uri, nullable: true }
        bio: { type: string, example: عاشق کیف‌های مینیمال و نوشتن درباره‌ی استایل روزمره. }
    BlogPostSummary:
      type: object
      properties:
        id: { type: integer, example: 1 }
        slug: { type: string, example: bag-by-body-shape }
        title: { type: string, example: راهنمای انتخاب کیف بر اساس فرم بدن }
        excerpt: { type: string, description: 'خلاصه‌ی خود مقاله، وگرنه ۱۶۰ نویسه‌ی اول `lead` یا اولین پاراگراف', example: قد، فرم شانه و سبک زندگیت تعیین می‌کنه چه کیفی بهت میاد. }
        category: { $ref: '#/components/schemas/BlogCategory' }
        cover: { type: object, nullable: true, allOf: [{ $ref: '#/components/schemas/MediaAsset' }], description: 'کاور نگذاشته ← `null` (ایلاستریشن با `coverBackground`)' }
        coverBackground: { type: string, nullable: true, description: رنگ پس‌زمینه‌ی کاور ایلاستریشنی, example: '#E4D9F3' }
        readingMinutes: { type: integer, example: 6 }
        publishedAt: { type: string, format: date-time }
        author: { $ref: '#/components/schemas/BlogAuthor' }
        isFeatured: { type: boolean, description: «منتخب سردبیر», example: true }
        tags:
          type: array
          items: { type: string }
    BlogContentBlock:
      type: object
      description: |
        محتوای مقاله به‌صورت بلوکی (برای رندر دقیق طرح):
        `HEADING` (با `anchor` برای فهرست مطالب) · `PARAGRAPH` · `QUOTE` · `TIP` (باکس «نکته کیوا») · `PRODUCT` (کارت محصول درون‌متنی) · `IMAGE` · `LIST`
      required: [type]
      properties:
        type: { type: string, enum: [HEADING, PARAGRAPH, QUOTE, TIP, PRODUCT, IMAGE, LIST] }
        anchor: { type: string, nullable: true, example: s0 }
        text: { type: string, nullable: true, example: چرا فرم بدن مهمه؟ }
        html: { type: string, allOf: [{ $ref: '#/components/schemas/HtmlString' }], nullable: true }
        title: { type: string, nullable: true, example: نکته کیوا }
        items:
          type: array
          nullable: true
          items: { type: string }
        product: { type: object, allOf: [{ $ref: '#/components/schemas/ProductSummary' }], nullable: true }
        image: { type: object, allOf: [{ $ref: '#/components/schemas/MediaAsset' }], nullable: true }
    BlogPostDetail:
      allOf:
        - $ref: '#/components/schemas/BlogPostSummary'
        - type: object
          properties:
            lead: { type: string, description: پاراگراف آغازین بزرگ }
            blocks:
              type: array
              items: { $ref: '#/components/schemas/BlogContentBlock' }
            toc:
              type: array
              description: فهرست مطالب (sticky)
              items:
                type: object
                properties:
                  anchor: { type: string, example: s0 }
                  title: { type: string, example: چرا فرم بدن مهمه؟ }
            breadcrumbs:
              type: array
              items: { $ref: '#/components/schemas/Breadcrumb' }
            shareUrl: { type: string, format: uri }
            shareLinks:
              type: array
              items: { $ref: '#/components/schemas/MessengerLink' }
            helpfulStats:
              type: object
              properties:
                helpfulCount: { type: integer, example: 120 }
                notHelpfulCount: { type: integer, example: 6 }
            seo: { $ref: '#/components/schemas/SeoMeta' }
            updatedAt: { type: string, format: date-time }
    BlogPostListResponse:
      type: object
      properties:
        featured: { type: object, allOf: [{ $ref: '#/components/schemas/BlogPostSummary' }], nullable: true }
        items:
          type: array
          items: { $ref: '#/components/schemas/BlogPostSummary' }
        meta: { $ref: '#/components/schemas/PageMeta' }
        emptyMessage: { type: string, nullable: true, example: مقاله‌ای با این مشخصات پیدا نشد. }
    AdminBlogAuthor:
      description: 'نویسنده در پنل: همه‌ی `BlogAuthor` به‌علاوه‌ی `isDefault`.'
      allOf:
        - $ref: '#/components/schemas/BlogAuthor'
        - type: object
          required: [isDefault]
          properties:
            isDefault: { type: boolean, description: 'نویسنده‌ی مقاله‌ای که `authorId` نفرستاده؛ حداکثر یکی', example: true }
    AdminBlogPost:
      description: |
        مقاله در پنل: همه‌ی `BlogPostDetail` به‌علاوه‌ی وضعیت و چیزهای ویرایش. در لیست پنل `blocks` و `toc` خالی‌اند.
        بلوک `PRODUCT` ِ محصولی که دیگر در فروشگاه نیست این‌جا می‌ماند (`product = null`) و شناسه‌اش در `unavailableProductIds` است؛
        فروشگاه آن بلوک را نشان نمی‌دهد.
      allOf:
        - $ref: '#/components/schemas/BlogPostDetail'
        - type: object
          required: [status, scheduled, createdAt, unavailableProductIds, feedbackComments]
          properties:
            status: { type: string, enum: [DRAFT, PUBLISHED, ARCHIVED] }
            scheduled: { type: boolean, description: '`PUBLISHED` با `publishedAt` ِ آینده: هنوز در مجله دیده نمی‌شود' }
            createdAt: { type: string, format: date-time }
            createdBy: { type: string, description: 'اسم کامل، وگرنه موبایل ماسک‌شده، یا «سیستم»' }
            updatedBy: { type: string }
            unavailableProductIds:
              type: array
              items: { type: integer }
            feedbackComments:
              type: array
              description: '۵۰ نظر آخر «مفید نبود»، جدیدترین اول؛ بدون هیچ شناسه‌ای از رأی‌دهنده'
              items:
                type: object
                properties:
                  comment: { type: string }
                  createdAt: { type: string, format: date-time }

    # ============ ADMIN · CATALOG ============
    ProductMediaInput:
      type: object
      required: [mediaId, view]
      description: |
        یک مدیای گالری رنگ: فقط مدیای آپلودشده با `purpose = PRODUCT` (ناموجود ← `400 MEDIA_NOT_FOUND`، `purpose` ِ دیگر ← `400 MEDIA_PURPOSE_MISMATCH`).
        ترتیب نهایی گالری: `isPrimary` اول (حداکثر یکی؛ دومی ← `400 MEDIA_PRIMARY_DUPLICATE`)، بعد `sortOrder`، بعد ترتیب همین لیست.
      properties:
        mediaId: { type: string, pattern: '^med_[0-9A-Za-z]{22}$', example: 'med_5Hq2xT9aLmQ0vB3nR7sK1w' }
        view: { $ref: '#/components/schemas/MediaView' }
        sortOrder: { type: integer, example: 0 }
        isPrimary: { type: boolean, default: false }
        alt: { type: string, maxLength: 200 }
    VariantUpsertRequest:
      type: object
      required: [colorKey]
      properties:
        colorKey: { allOf: [{ $ref: '#/components/schemas/ColorKey' }], description: 'در `PUT` عوض نمی‌شود (`400 COLOR_KEY_IMMUTABLE`)' }
        sku: { type: string, nullable: true, maxLength: 40, pattern: '^[A-Za-z][A-Za-z0-9]*(-[A-Za-z0-9]+)*$', description: 'خالی = تولید خودکار (KV-1001-LILAC)؛ با حروف بزرگ ذخیره می‌شود. در `PUT` عوض نمی‌شود (`400 SKU_IMMUTABLE`)', example: KV-1001-LILAC }
        barcode: { type: string, nullable: true, pattern: '^[0-9A-Za-z-]{4,32}$' }
        priceOverride: { type: integer, allOf: [{ $ref: '#/components/schemas/Money' }], nullable: true, description: 'اگر این رنگ قیمت متفاوت دارد؛ `null` = قیمت خود محصول' }
        compareAtPriceOverride: { type: integer, allOf: [{ $ref: '#/components/schemas/Money' }], nullable: true, description: 'فقط همراه `priceOverride` (`400 PRICE_OVERRIDE_REQUIRED`) و بیشتر از آن' }
        stockQuantity: { type: integer, minimum: 0, maximum: 10000, description: 'موجودی اولیه، فقط در ساخت (در `PUT` نادیده گرفته می‌شود؛ برای تغییرات بعدی از adjustments استفاده کنید)', example: 12 }
        isDefault: { type: boolean, default: false, description: '`false` پیش‌فرض بودن را برنمی‌دارد' }
        isActive: { type: boolean, default: true }
        sortOrder: { type: integer, example: 0 }
        media:
          type: array
          maxItems: 20
          description: 'کل گالری این رنگ (حداکثر ۲۰ تا؛ بیشتر ← `400 MEDIA_TOO_MANY`؛ یک مدیا دو بار ← `400 MEDIA_DUPLICATE`)'
          items: { $ref: '#/components/schemas/ProductMediaInput' }
    ProductUpsertRequest:
      type: object
      required: [name, slug, categoryId, bagType, price, materialId]
      description: |
        همه‌ی خطاهای شکل با هم در یک `400` با مسیر هر فیلد برمی‌گردند. `canonicalUrl`، `ogImageUrl` و `jsonLd` ِ `seo` نادیده گرفته می‌شوند:
        سرور خودش آن‌ها را می‌سازد. `description` قبل از ذخیره sanitize می‌شود (فقط تگ‌های `HtmlString`؛ `<script>`، `on*` و لینک `javascript:` حذف).
      properties:
        name: { type: string, minLength: 1, maxLength: 120, example: کیف دوشی ماهک }
        slug: { type: string, maxLength: 100, pattern: '^(?=.*[a-z])[a-z0-9]+(-[a-z0-9]+)*$', description: 'حروف کوچک لاتین، رقم و خط تیره؛ حداقل یک حرف (تا با id عددی اشتباه نشود). در `PUT` عوض نمی‌شود (`400 SLUG_IMMUTABLE`)', example: mahak-shoulder-bag }
        sku: { type: string, nullable: true, maxLength: 40, pattern: '^[A-Za-z][A-Za-z0-9]*(-[A-Za-z0-9]+)*$', description: 'خالی = تولید خودکار (KV-xxxx)؛ با حروف بزرگ ذخیره می‌شود. در `PUT` عوض نمی‌شود (`400 SKU_IMMUTABLE`)', example: KV-1001 }
        categoryId: { type: integer, example: 1 }
        bagType: { $ref: '#/components/schemas/BagType' }
        materialId: { type: integer, example: 3 }
        materialDescription: { type: string, maxLength: 120, example: چرم مصنوعی مات درجه یک }
        price: { allOf: [{ $ref: '#/components/schemas/Money' }], example: 1890000 }
        compareAtPrice: { type: integer, allOf: [{ $ref: '#/components/schemas/Money' }], nullable: true, description: 'بیشتر از `price` (`400 COMPARE_AT_PRICE_NOT_ABOVE_PRICE`)' }
        shortDescription: { type: string, maxLength: 300, nullable: true }
        description: { allOf: [{ $ref: '#/components/schemas/HtmlString' }], description: 'حداکثر ۱۰٬۰۰۰ نویسه **بعد از** sanitize' }
        highlights:
          type: array
          maxItems: 8
          items: { type: string, maxLength: 160 }
        specs: { $ref: '#/components/schemas/ProductSpecsInput' }
        tags:
          type: array
          maxItems: 20
          description: 'حداکثر ۲۰ برچسب (`TAGS_TOO_MANY`)، هر کدام ۱ تا ۳۰ نویسه (`TAG_INVALID`)'
          items: { type: string, minLength: 1, maxLength: 30 }
        newUntil: { type: string, format: date-time, nullable: true, description: تا این تاریخ تگ «جدید» می‌خورد (به‌جای فیلد دستی isNew) }
        maxPerOrder: { type: integer, minimum: 1, maximum: 20, default: 5 }
        returnable: { type: boolean, default: true }
        reservable: { type: boolean, default: true }
        sortPriority: { type: integer, default: 0, description: برای چیدمان دستی (pin) در لیست }
        status: { allOf: [{ $ref: '#/components/schemas/ProductStatus' }], description: 'فقط در ساخت (پیش‌فرض `DRAFT`)؛ در `PUT` نادیده گرفته می‌شود' }
        seo:
          type: object
          description: 'فقط این سه فیلد خوانده می‌شوند'
          properties:
            title: { type: string, maxLength: 70, nullable: true }
            description: { type: string, maxLength: 170, nullable: true }
            noIndex: { type: boolean, default: false }
        variants:
          type: array
          description: فقط در ساخت؛ برای ویرایش از endpointهای ورینت استفاده کنید (در `PUT` نادیده گرفته می‌شود)
          items: { $ref: '#/components/schemas/VariantUpsertRequest' }
    ProductSpecsInput:
      type: object
      description: |
        مشخصات در فرم محصول؛ همان `ProductSpecs` با سقف‌ها. `label` ِ `closure` و `occasions` را سرور می‌سازد و از ورودی خوانده نمی‌شود.
        هر مشکل یک خطای فیلد با مسیر کامل است (`specs.straps.1.lengthCm`).
      properties:
        dimensions: { allOf: [{ $ref: '#/components/schemas/ProductDimensions' }], nullable: true, description: 'هر ضلع بیشتر از ۰ و حداکثر ۲۰۰' }
        weightGrams: { type: integer, nullable: true, minimum: 1, maximum: 20000 }
        closure:
          type: object
          nullable: true
          properties:
            type: { $ref: '#/components/schemas/ClosureType' }
        straps:
          type: array
          nullable: true
          maxItems: 4
          items:
            type: object
            properties:
              type: { $ref: '#/components/schemas/StrapType' }
              label: { type: string, maxLength: 200 }
              lengthCm: { type: number, nullable: true, minimum: 0, exclusiveMinimum: true, maximum: 200 }
              minLengthCm: { type: number, nullable: true, minimum: 0, exclusiveMinimum: true, maximum: 200 }
              maxLengthCm: { type: number, nullable: true, minimum: 0, exclusiveMinimum: true, maximum: 200, description: 'حداقل `minLengthCm`' }
              adjustable: { type: boolean, default: false }
              detachable: { type: boolean, default: false }
              material: { type: string, nullable: true, maxLength: 60 }
        pockets:
          type: object
          nullable: true
          description: 'هر شمارنده ۰ تا ۲۰'
          properties:
            internal: { type: integer, minimum: 0, maximum: 20 }
            internalZip: { type: integer, minimum: 0, maximum: 20 }
            external: { type: integer, minimum: 0, maximum: 20 }
            phone: { type: integer, minimum: 0, maximum: 20 }
            cardSlots: { type: integer, minimum: 0, maximum: 20 }
            billSlots: { type: integer, minimum: 0, maximum: 20 }
            coinPocket: { type: boolean, default: false }
            detachablePouch: { type: boolean, default: false }
            laptopSleeve: { type: boolean, default: false }
            summary: { type: string, maxLength: 200 }
        laptopMaxInch: { type: number, nullable: true, minimum: 0, exclusiveMinimum: true, maximum: 20 }
        capacityLiters: { type: number, nullable: true, minimum: 0, exclusiveMinimum: true, maximum: 100 }
        waterproof: { type: boolean, default: false }
        occasions:
          type: array
          items:
            type: object
            properties:
              code: { $ref: '#/components/schemas/Occasion' }
        fits:
          type: array
          items: { $ref: '#/components/schemas/FitItem' }
        lining:
          type: object
          nullable: true
          properties:
            material: { type: string, maxLength: 60 }
            color: { type: string, maxLength: 40 }
        hardware:
          type: object
          nullable: true
          properties:
            material: { type: string, maxLength: 60 }
            finish: { type: string, maxLength: 40 }
        stitching: { type: string, nullable: true, maxLength: 100 }
        handmade: { type: boolean, default: false }
        madeIn: { type: string, nullable: true, maxLength: 40 }
        careInstructions:
          type: array
          maxItems: 10
          items: { type: string, minLength: 1, maxLength: 200 }
        warranty:
          type: object
          nullable: true
          properties:
            months: { type: integer, minimum: 1, maximum: 60 }
            description: { type: string, maxLength: 200 }
    AdminVariant:
      allOf:
        - $ref: '#/components/schemas/ProductVariant'
        - type: object
          properties:
            barcode: { type: string, nullable: true }
            isActive: { type: boolean }
            stockOnHand: { type: integer, description: موجودی فیزیکی, example: 12 }
            stockReserved: { type: integer, description: رزرو موقت سبدهای در حال پرداخت + سفارش‌های ارسال‌نشده, example: 2 }
            stockAvailable: { type: integer, example: 10 }
            soldCount: { type: integer, example: 64 }
            stockAlertSubscribers: { type: integer, description: 'اشتراک‌های `ACTIVE` ِ همین رنگ (بدون «هر رنگی»)', example: 7 }
    AdminProduct:
      description: |
        همه‌ی فیلدهای `ProductDetail` (همان چیزی که مشتری می‌بیند) به‌اضافه‌ی فیلدهای پنل. `variants` فقط رنگ‌های **فعال** است و
        موجودی‌اش همان قانون فروشگاه را دارد؛ `adminVariants` **همه‌ی** رنگ‌ها (فعال و غیرفعال) با موجودی دقیق.
        فیلدهای فقط‌مشتری: `isWishlisted` و `stockAlert` و `campaign` همیشه `null`، `perks` خالی، `selectedColorKey` رنگ پیش‌فرض.
      allOf:
        - $ref: '#/components/schemas/ProductDetail'
        - type: object
          properties:
            status: { $ref: '#/components/schemas/ProductStatus' }
            adminVariants:
              type: array
              items: { $ref: '#/components/schemas/AdminVariant' }
            newUntil: { type: string, format: date-time, nullable: true }
            sortPriority: { type: integer }
            publishAt: { type: string, format: date-time, nullable: true, description: 'زمان انتشار برنامه‌ریزی‌شده‌ی محصول پیش‌نویس؛ بدون برنامه `null`' }
            viewsCount: { type: integer, nullable: true, description: 'تا آمار بازدید ساخته نشده `null`', example: 5230 }
            conversionRate: { type: number, nullable: true, description: 'تا آمار بازدید ساخته نشده `null`', example: 3.5 }
            createdAt: { type: string, format: date-time }
            createdBy: { type: string, description: 'اسم نمایشی سازنده: نام کامل، وگرنه موبایل ماسک‌شده؛ برای کار سیستم «سیستم»', example: لیلا احمدی }
            etag: { type: string, description: 'همان هدر `ETag`: `W/"{نسخه}"`', example: 'W/"12"' }
    AdminProductListItem:
      type: object
      properties:
        id: { type: integer }
        sku: { type: string }
        name: { type: string }
        imageUrl: { type: string, format: uri, nullable: true, description: 'نسخه‌ی کوچک اولین مدیای رنگ پیش‌فرض؛ بدون مدیا `null`' }
        category: { $ref: '#/components/schemas/CategoryRef' }
        status: { $ref: '#/components/schemas/ProductStatus' }
        price: { $ref: '#/components/schemas/PriceInfo' }
        totalStock: { type: integer, description: 'جمع موجودی قابل فروش رنگ‌های فعال', example: 12 }
        variantsCount: { type: integer, description: 'همه‌ی رنگ‌ها (فعال و غیرفعال)', example: 4 }
        lowStockVariants: { type: integer, description: 'رنگ‌های فعال با موجودی بین صفر و آستانه', example: 1 }
        soldCount: { type: integer, example: 184 }
        rating: { allOf: [{ $ref: '#/components/schemas/RatingBrief' }], description: 'همیشه فرستاده می‌شود (بی‌نظر: صفر)' }
        updatedAt: { type: string, format: date-time }
    AdminProductListResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AdminProductListItem' }
        meta: { $ref: '#/components/schemas/PageMeta' }
    InventoryAdjustmentRequest:
      type: object
      required: [variantId, delta, reason]
      properties:
        variantId: { type: integer, example: 101 }
        delta: { type: integer, minimum: -10000, maximum: 10000, description: 'مثبت = ورود، منفی = خروج؛ صفر نه. `STOCKTAKE` هم تفاوت است، نه عدد شمارش', example: 10 }
        reason: { type: string, enum: [RESTOCK, STOCKTAKE, DAMAGED, RETURNED, MANUAL_CORRECTION], description: '`RESTOCK` و `RETURNED` فقط مثبت، `DAMAGED` فقط منفی، `STOCKTAKE` و `MANUAL_CORRECTION` هر دو' }
        note: { type: string, maxLength: 300 }
    InventoryAdjustment:
      type: object
      properties:
        id: { type: integer }
        variantId: { type: integer }
        sku: { type: string }
        delta: { type: integer }
        reason: { type: string, enum: [RESTOCK, STOCKTAKE, DAMAGED, RETURNED, MANUAL_CORRECTION] }
        note: { type: string, nullable: true }
        stockAfter: { type: integer, description: 'موجودی فیزیکی (`stockOnHand`) بعد از همین تغییر' }
        createdAt: { type: string, format: date-time }
        createdBy: { type: string, description: 'اسم نمایشی: نام کامل، وگرنه موبایل ماسک‌شده؛ برای کار سیستم «سیستم»', example: لیلا احمدی }
    CategoryUpsertRequest:
      type: object
      required: [name, slug, iconBagType, iconColorKey]
      properties:
        name: { type: string, minLength: 1, maxLength: 100, example: کیف دوشی }
        slug: { type: string, maxLength: 100, pattern: '^(?=.*[a-z])[a-z0-9]+(-[a-z0-9]+)*$', description: 'حداقل یک حرف (تا با id عددی اشتباه نشود)؛ یکتا (`409 DUPLICATE_SLUG`)', example: shoulder }
        description: { type: string, nullable: true, maxLength: 500 }
        iconBagType: { $ref: '#/components/schemas/BagType' }
        iconColorKey: { allOf: [{ $ref: '#/components/schemas/ColorKey' }], description: 'رنگی از پالت (`400 COLOR_NOT_FOUND`)' }
        imageMediaId: { type: string, nullable: true, description: 'فقط مدیای آپلودشده با `purpose = CATEGORY` (فقط عکس)' }
        sortOrder: { type: integer, default: 0 }
        showInMenu: { type: boolean, default: true }
        seo:
          type: object
          description: 'فقط این سه فیلد خوانده می‌شوند'
          properties:
            title: { type: string, maxLength: 70, nullable: true }
            description: { type: string, maxLength: 170, nullable: true }
            noIndex: { type: boolean, default: false }
    ColorUpsertRequest:
      type: object
      required: [key, name, hex]
      properties:
        key: { allOf: [{ $ref: '#/components/schemas/ColorKey' }], description: 'یکتا (`409 DUPLICATE_CODE`)؛ در `PUT` باید همان کلید مسیر باشد (`400 COLOR_KEY_IMMUTABLE`)' }
        name: { type: string, minLength: 1, maxLength: 50, example: یاسی }
        hex: { type: string, pattern: '^#[0-9A-Fa-f]{6}$', example: '#C8B6E2' }
        isLight: { type: boolean, default: false }
        sortOrder: { type: integer, description: 'پیش‌فرض در ساخت: بعد از آخرین رنگ' }
    MaterialUpsertRequest:
      type: object
      required: [name, slug, family]
      properties:
        name: { type: string, minLength: 1, maxLength: 120, example: چرم طبیعی گاوی }
        slug: { type: string, maxLength: 100, pattern: '^(?=.*[a-z])[a-z0-9]+(-[a-z0-9]+)*$', description: 'یکتا (`409 DUPLICATE_SLUG`)', example: genuine-cow-leather }
        family: { $ref: '#/components/schemas/MaterialFamily' }
        description: { type: string, nullable: true, maxLength: 1000 }
        careInstructions:
          type: array
          maxItems: 10
          description: 'حداکثر ۱۰ تا، هر کدام ۱ تا ۲۰۰ نویسه (`CARE_INSTRUCTIONS_INVALID`)'
          items: { type: string, minLength: 1, maxLength: 200 }
    AdminCategory:
      description: دسته‌بندی در پنل؛ `Category` به‌اضافه‌ی شناسه‌ی مدیای عکس تا فرم ویرایش بداند عکس فعلی کدام است
      allOf:
        - $ref: '#/components/schemas/Category'
        - type: object
          required: [imageMediaId]
          properties:
            imageMediaId: { type: string, nullable: true, description: 'همان `imageMediaId` ِ `CategoryUpsertRequest`؛ بدون عکس `null`', example: med_7Kx1 }
    AdminStockAlertGroup:
      type: object
      description: اشتراک‌های فعال «موجود شد خبرم کن» برای یک ورینت (یا برای کل محصول، وقتی مشتری رنگ خاصی نخواسته)
      required: [product, variantId, color, sku, waitingCount, oldestAt, stockStatus, availableQuantity]
      properties:
        product: { $ref: '#/components/schemas/ProductRef' }
        variantId: { type: integer, nullable: true, description: '`null` = هر رنگی از این محصول', example: 501 }
        color: { type: object, allOf: [{ $ref: '#/components/schemas/Color' }], nullable: true }
        sku: { type: string, nullable: true, example: KV-1001-LILAC }
        waitingCount: { type: integer, description: تعداد اشتراک‌های فعال, example: 6 }
        oldestAt: { type: string, format: date-time, description: قدیمی‌ترین اشتراک فعال }
        stockStatus: { $ref: '#/components/schemas/StockStatus' }
        availableQuantity: { type: integer, description: 'موجودی قابل فروش دقیق (پنل)؛ برای `variantId = null` جمع همه‌ی رنگ‌ها', example: 0 }

    # ============ ADMIN · ORDERS ============
    AdminNote:
      type: object
      properties:
        id: { type: integer }
        text: { type: string }
        author: { type: string, description: اسم نمایشی نویسنده (اسم کامل، وگرنه موبایل ماسک‌شده), example: مریم رضایی }
        createdAt: { type: string, format: date-time }
    AdminOrderListItem:
      type: object
      properties:
        code: { $ref: '#/components/schemas/OrderCode' }
        placedAt: { type: string, format: date-time }
        status: { $ref: '#/components/schemas/OrderStatus' }
        customerName: { type: string, nullable: true, example: سارا محمدی, description: 'اسم حساب، وگرنه اسم گیرنده؛ `null` برای سفارش بی‌نام (حساب حذف‌شده)' }
        customerPhone: { type: string, nullable: true, allOf: [{ $ref: '#/components/schemas/PhoneNumber' }], description: '`null` برای سفارش بی‌نام (حساب حذف‌شده)' }
        city: { type: string, example: تهران }
        itemsCount: { type: integer }
        payable: { $ref: '#/components/schemas/Money' }
        shippingMethod: { $ref: '#/components/schemas/ShippingMethodCode' }
        messenger: { $ref: '#/components/schemas/PhotoMessengerChannel' }
        reserved: { type: boolean }
        reservationExpiresAt: { type: string, format: date-time, nullable: true }
        shipmentGroupCode: { type: string, nullable: true, example: SG-3021 }
        mediaCount: { type: integer }
        trackingCode: { type: string, nullable: true }
    AdminOrderListResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AdminOrderListItem' }
        meta: { $ref: '#/components/schemas/PageMeta' }
        statusCounts:
          type: object
          additionalProperties: { type: integer }
          example: { PROCESSING: 12, PHOTO_SENT: 7, RESERVED: 3 }
    AdminOrder:
      allOf:
        - $ref: '#/components/schemas/OrderDetail'
        - type: object
          properties:
            customer:
              type: object
              properties:
                id: { type: integer }
                fullName: { type: string, nullable: true, description: 'اسم حساب؛ `null` وقتی مشتری اسمش را نداده یا حسابش حذف شده' }
                phone: { type: string, nullable: true, allOf: [{ $ref: '#/components/schemas/PhoneNumber' }], description: '`null` وقتی حساب حذف شده (پنل «حساب حذف‌شده» نشان می‌دهد)' }
                ordersCount: { type: integer, description: 'سفارش‌های پرداخت‌شده‌ی مشتری (لغوشده هم)', example: 3 }
            shipmentGroup:
              type: object
              nullable: true
              description: گروه ارسال رزرو (همه با یک کد رهگیری)
              properties:
                code: { type: string, example: SG-3021 }
                orderCodes:
                  type: array
                  description: سفارش‌های لغونشده‌ی گروه به ترتیب پرداخت
                  items: { $ref: '#/components/schemas/OrderCode' }
                releaseAt: { type: string, format: date-time, description: پایان مهلت رزرو گروه }
            draftItems:
              type: array
              description: 'پیش‌نویس عکس‌های قبل از ارسال (`PUT …/pre-shipment-media`) که هنوز فرستاده نشده؛ مشتری آن را نمی‌بیند'
              items: { $ref: '#/components/schemas/OrderMediaItem' }
            payments:
              description: همه‌ی تلاش‌های پرداخت سفارش، قدیمی‌ترین اول
              type: array
              items: { $ref: '#/components/schemas/OrderPaymentInfo' }
            refunds:
              type: array
              items: { $ref: '#/components/schemas/Refund' }
            notes:
              type: array
              items: { $ref: '#/components/schemas/AdminNote' }
            allowedTransitions:
              type: array
              description: 'وضعیت‌هایی که `POST /admin/orders/{orderCode}/status` الان می‌پذیرد'
              items: { $ref: '#/components/schemas/OrderStatus' }
    AdminOrderStatusChangeRequest:
      type: object
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/OrderStatus' }
        note: { type: string, maxLength: 500, nullable: true }
        notifyCustomer: { type: boolean, default: true }
    AdminPreShipmentMediaRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [mediaId]
            properties:
              mediaId: { type: string }
              orderItemId: { type: integer, nullable: true }
              view: { $ref: '#/components/schemas/MediaView' }
              sortOrder: { type: integer }
    AdminShipmentRequest:
      type: object
      required: [carrier, trackingCode]
      properties:
        carrier: { $ref: '#/components/schemas/ShippingMethodCode' }
        trackingCode: { type: string, minLength: 6, maxLength: 40, example: '183920674512039845612307' }
        shippedAt: { type: string, format: date-time, nullable: true }
        showInDailyList: { type: boolean, default: true, description: نمایش (ماسک‌شده) در «کدهای رهگیری روزانه» }
    AdminRefundRequest:
      type: object
      required: [amount, reason]
      properties:
        amount: { $ref: '#/components/schemas/Money' }
        reason: { type: string, maxLength: 300 }
        method: { type: string, enum: [ORIGINAL_PAYMENT, BANK_TRANSFER], description: 'نیامده: `refundMethod` ِ مرجوعی با `returnId`، وگرنه `ORIGINAL_PAYMENT`' }
        returnId: { type: integer, nullable: true, description: 'استرداد ِ یک مرجوعی `RECEIVED` ِ همین سفارش (`RETURN_NOT_FOUND`، `422 INVALID_STATUS_TRANSITION`، `422 RETURN_REFUND_EXISTS`)' }
    AdminReturnDecisionRequest:
      type: object
      required: [approve]
      properties:
        approve: { type: boolean, description: 'نیامده ← `FIELD_REQUIRED`' }
        shippingPaidBy: { type: string, enum: [KIVA, CUSTOMER], nullable: true, description: 'فقط تأیید؛ نیامده = پیشنهاد ِ دلیل؛ ناشناخته ← `SHIPPING_PAYER_INVALID`' }
        instructions: { type: string, maxLength: 1000, nullable: true, description: 'فقط تأیید؛ نیامده = متن پیش‌فرض همان پرداخت‌کننده (`TEXT_TOO_LONG` / `TEXT_INVALID`)' }
        rejectionReason: { type: string, minLength: 3, maxLength: 500, nullable: true, description: 'برای رد لازم: ۳ تا ۵۰۰ نویسه (`REJECTION_REASON_REQUIRED` / `TEXT_TOO_LONG` / `TEXT_INVALID`)؛ در تأیید نادیده' }
    AdminChangeRequestResolutionRequest:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [APPLY, REJECT] }
        variantId:
          type: integer
          nullable: true
          description: 'فقط برای `APPLY` و `changeType` = `COLOR`/`MODEL`: ورینت جایگزین؛ اگر نیاید همان `desiredVariantId` ِ مشتری. همان قانون `desiredVariantId` را دارد (`400 DESIRED_VARIANT_INVALID`)؛ با `REJECT`، `CANCEL_ITEM` یا `OTHER` ← `400 VARIANT_NOT_ALLOWED`'
        note:
          type: string
          maxLength: 500
          nullable: true
          description: 'برای مشتری: در `feedback.resolution.note` و تایم‌لاین سفارش دیده می‌شود (پیامک متن آزاد ندارد)؛ برای `REJECT` و `OTHER` لازم'
          example: رنگ مشکی تموم شده بود؛ همون رنگ قبلی برات ارسال می‌شه.
        notifyCustomer: { type: boolean, default: true }
    AdminRefundUpdateRequest:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [PROCESSING, COMPLETED, FAILED] }
        referenceId:
          type: string
          maxLength: 64
          nullable: true
          description: 'شماره‌ی پیگیری انتقال بانکی (`[0-9A-Za-z-]`)؛ برای `COMPLETED` همیشه لازم (`400 REFERENCE_ID_REQUIRED`)'
          example: '140507181234567'
        note: { type: string, maxLength: 300, nullable: true, description: 'می‌شود `Refund.statusNote`؛ مشتری هم می‌بیند' }
    AdminReturnRequest:
      description: 'مرجوعی در پنل؛ `ReturnRequest` به‌اضافه‌ی مشتری، نتیجه‌ی بازبینی، قدم‌های مجاز بعدی و مبلغ پیشنهادی. شماره شبا در سیستم نیست (تلفنی گرفته می‌شود)'
      allOf:
        - $ref: '#/components/schemas/ReturnRequest'
        - type: object
          required: [customer, receipt, allowedTransitions, suggestedRefund]
          properties:
            customer:
              type: object
              required: [id, fullName, phone]
              properties:
                id: { type: integer }
                fullName: { type: string, nullable: true }
                phone: { type: string, nullable: true, allOf: [{ $ref: '#/components/schemas/PhoneNumber' }], description: '`null` وقتی حساب حذف شده' }
            suggestedRefund:
              type: integer
              allOf: [{ $ref: '#/components/schemas/Money' }]
              nullable: true
              description: |
                فقط در `RECEIVED` (وگرنه `null`): جمع `floor(سهم پرداخت‌شده‌ی قلم × receivedQuantity ÷ تعداد قلم)`، سهم پرداخت‌شده = جمع قلم منهای سهم کد تخفیف
                (`floor(lineTotal × codeDiscount ÷ subtotal)` ِ لحظه‌ی ثبت)، حداکثر «قابل استرداد» ِ سفارش. **هزینه‌ی ارسال جزوش نیست.**
                پیشنهاد است؛ ادمین مبلغ را خودش در `POST /admin/orders/{orderCode}/refunds` می‌زند.
              example: 1890000
            receipt:
              type: object
              nullable: true
              description: نتیجه‌ی رسیدن به انبار (`POST /admin/returns/{returnId}/receipt`)؛ تا آن موقع `null`
              properties:
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      orderItemId: { type: integer }
                      receivedQuantity: { type: integer }
                      restockQuantity: { type: integer }
                note: { type: string, nullable: true }
            allowedTransitions:
              type: array
              description: 'قدم‌های مجاز بعدی (جدول بخش ۴)؛ `REFUNDED` یعنی «ثبت استرداد با `returnId`»؛ `RECEIVED` با استرداد باز `[]`'
              items: { $ref: '#/components/schemas/ReturnStatus' }
              example: [REFUNDED, CLOSED]
    AdminReturnPickupRequest:
      type: object
      description: 'جایگزین کامل جمع‌آوری قبلی (فیلد نیامده = خالی). همه‌ی خطاهای شکل با هم'
      required: [carrier]
      properties:
        carrier: { allOf: [{ $ref: '#/components/schemas/ShippingMethodCode' }], description: 'فقط `TIPAX` یا `POST`؛ `COURIER` ← `SHIPPING_METHOD_NOT_SUPPORTED`؛ نیامده ← `FIELD_REQUIRED`؛ ناشناخته ← `CARRIER_INVALID`' }
        scheduledFor: { type: string, format: date-time, nullable: true, description: 'زمان مراجعه‌ی مأمور: از یک ساعت پیش تا ۳۰ روز بعد (`PICKUP_TIME_INVALID`؛ بدشکل ← `DATE_TIME_INVALID`)' }
        trackingCode: { type: string, minLength: 6, maxLength: 40, nullable: true, description: 'خالی = بی‌کد؛ همان قانون کد رهگیری ارسال (`TRACKING_CODE_INVALID`)' }
        note: { type: string, maxLength: 500, nullable: true, description: 'برای مشتری (`TEXT_TOO_LONG` / `TEXT_INVALID`)' }
        notifyCustomer: { type: boolean, default: true }
    AdminReturnReceiptRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 20
          description: |
            برای هر قلم مرجوعی **دقیقاً یک ردیف** (کم، اضافه یا تکراری ← `RECEIPT_ITEMS_MISMATCH` روی `items` با `meta.expectedItemIds`)؛
            `restockQuantity ≤ receivedQuantity ≤` تعداد درخواست‌شده (`RESTOCK_EXCEEDS_RECEIVED` / `RECEIVED_QUANTITY_EXCEEDS` با `meta.maxQuantity`).
            خالی یا نیامده ← `FIELD_REQUIRED`؛ بیشتر از ۲۰ ← `TOO_MANY_ITEMS`.
          items:
            type: object
            required: [orderItemId, receivedQuantity, restockQuantity]
            properties:
              orderItemId: { type: integer }
              receivedQuantity: { type: integer, minimum: 0, maximum: 20, description: 'نیامده ← `FIELD_REQUIRED`؛ بیرون ۰ تا ۲۰ ← `NUMBER_OUT_OF_RANGE`' }
              restockQuantity: { type: integer, minimum: 0, maximum: 20, description: 'عددهای سالم که به موجودی برمی‌گردند (همان قانون‌های `receivedQuantity`)' }
        note: { type: string, maxLength: 1000, nullable: true, description: 'نتیجه‌ی بازبینی؛ داخلی، مشتری نمی‌بیند (`TEXT_TOO_LONG` / `TEXT_INVALID`)' }
    AdminReturnCloseRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 3, maxLength: 500, description: 'برای مشتری، در جزئیات مرجوعی (نه در پیامک)؛ کمتر از ۳ یا نیامده ← `CLOSE_REASON_REQUIRED` (`TEXT_TOO_LONG` / `TEXT_INVALID`)', example: مرسوله‌ای از طرفت به انبار نرسید؛ اگه فرستادی با پشتیبانی تماس بگیر. }
        notifyCustomer: { type: boolean, default: true }

    # ============ ADMIN · MARKETING ============
    DiscountCodeUpsertRequest:
      type: object
      description: |
        ساخت و ویرایش کد تخفیف. همه‌ی خطاهای شکل با هم (`400`، روی همان فیلد). ویرایش کدی که استفاده شده مجاز است: سفارش‌های قبلی مبلغ
        ذخیره‌شده‌ی خودشان را دارند و سبدها با همگام‌سازی بعدی دوباره بررسی می‌شوند (کدی که دیگر نمی‌خورد با `DISCOUNT_REMOVED` برداشته می‌شود).
      required: [code, type, value, label]
      properties:
        code:
          type: string
          pattern: '^[A-Z0-9_-]{3,32}$'
          description: |
            اول trim، حروف بزرگ و ارقام لاتین می‌شود، بعد با الگو سنجیده می‌شود (` paeez۱۵ ` ← `PAEEZ15`؛ `DISCOUNT_CODE_TEXT_INVALID`).
            تکراری (به‌جز خود همین کد در ویرایش) ← `409 DUPLICATE_CODE`. کدهای دوحرفی قدیمی معتبر می‌مانند، ولی کد تازه حداقل ۳ حرف است.
          example: PAEEZ15
        type: { type: string, enum: [PERCENT, FIXED], description: '`DISCOUNT_TYPE_INVALID`' }
        value: { type: integer, description: '`PERCENT`: درصد ۱ تا ۱۰۰؛ `FIXED`: ۱٬۰۰۰ تا ۱۰۰٬۰۰۰٬۰۰۰ تومان (`DISCOUNT_VALUE_INVALID`)', example: 15 }
        label: { type: string, minLength: 1, maxLength: 200, description: 'متنی که سبد نشان می‌دهد (`AppliedDiscount.label`)', example: '۱۵٪ تخفیف پاییزه (خرید بالای ۲ میلیون)' }
        minSubtotal: { type: integer, allOf: [{ $ref: '#/components/schemas/Money' }], nullable: true, description: '۰ تا ۱٬۰۰۰٬۰۰۰٬۰۰۰؛ `null` = بدون حداقل', example: 2000000 }
        maxDiscount: { type: integer, allOf: [{ $ref: '#/components/schemas/Money' }], nullable: true, description: 'سقف تخفیف، **فقط** برای `PERCENT` (۱٬۰۰۰ تا ۱۰۰٬۰۰۰٬۰۰۰)؛ با `FIXED` ← `400 MAX_DISCOUNT_NOT_ALLOWED`' }
        startsAt: { type: string, format: date-time, nullable: true }
        endsAt: { type: string, format: date-time, nullable: true, description: 'بعد از `startsAt` (`DATE_RANGE_INVALID`)؛ کد تا (نه در) این لحظه کار می‌کند' }
        usageLimit: { type: integer, minimum: 1, nullable: true, description: 'کل دفعات مجاز (سفارش‌های پرداخت‌نشده‌ی در جریان هم شمرده می‌شوند)؛ `null` = بی‌سقف' }
        perUserLimit: { type: integer, minimum: 1, nullable: true, description: 'دفعات مجاز هر مشتری؛ `null` = بی‌سقف. پیش‌فرض ندارد: نیامده یعنی `null`' }
        firstOrderOnly: { type: boolean, default: false, description: مثل WELCOME }
        requiresLogin:
          type: boolean
          default: false
          description: |
            در پاسخ، مقدار **ذخیره‌شده** برمی‌گردد: `requiresLogin` یا `firstOrderOnly` یا `perUserLimit ≠ null`؛ چون مهمان را نمی‌شود شمرد،
            هر کدام از این‌ها کد را «فقط با ورود» می‌کند (`DISCOUNT_LOGIN_REQUIRED`).
        excludeSaleItems: { type: boolean, default: false, description: اعمال نشدن روی کالاهای تخفیف‌خورده }
        categoryIds:
          type: array
          maxItems: 50
          uniqueItems: true
          description: 'دسته‌هایی که کد شاملشان است؛ هر کدام باید وجود داشته باشد (`400 CATEGORY_NOT_FOUND` روی `categoryIds.i`). با `productIds` «اجتماع» است: ردیفی مشمول است که محصولش در `productIds` یا دسته‌اش در `categoryIds` باشد؛ هر دو خالی = همه‌ی ردیف‌ها'
          items: { type: integer }
        productIds:
          type: array
          maxItems: 200
          uniqueItems: true
          description: 'محصولاتی که کد شاملشان است؛ هر کدام باید وجود داشته باشد (`400 PRODUCT_NOT_FOUND` روی `productIds.i`)'
          items: { type: integer }
        isActive: { type: boolean, default: true }
    DiscountCode:
      allOf:
        - $ref: '#/components/schemas/DiscountCodeUpsertRequest'
        - type: object
          required: [id, usedCount, totalDiscountGiven, createdAt, updatedAt]
          properties:
            id: { type: integer }
            usedCount: { type: integer, description: 'سفارش‌های پرداخت‌شده و برنگشته (لغوشده نه) که این کد را دارند', example: 132 }
            totalDiscountGiven: { allOf: [{ $ref: '#/components/schemas/Money' }], description: 'جمع تخفیف همان سفارش‌ها' }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    CampaignUpsertRequest:
      type: object
      required: [slug, title, startsAt, endsAt]
      properties:
        slug: { type: string, maxLength: 60, description: 'الگوی slug ِ محصول (`SLUG_INVALID`)؛ یکتا (`409 DUPLICATE_SLUG`)', example: paeez-1405 }
        title: { type: string, minLength: 1, maxLength: 80, example: جشنواره پاییزه }
        subtitle: { type: string, maxLength: 120, nullable: true }
        icon: { type: string, allOf: [{ $ref: '#/components/schemas/IconName' }], nullable: true }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time, description: 'بعد از `startsAt` (`400 DATE_RANGE_INVALID` روی `endsAt`)' }
        productIds:
          type: array
          maxItems: 200
          description: 'خالی یا نیامده = همه‌ی محصولات تخفیف‌دار؛ بدون تکرار (`LIST_ITEM_DUPLICATE`)؛ هر کدام محصول غیربایگانی'
          items: { type: integer }
        isActive: { type: boolean, default: true }
    AdminCampaign:
      description: کمپین در پنل؛ `Campaign` به‌اضافه‌ی انتخاب ذخیره‌شده‌ی محصولات برای فرم ویرایش
      allOf:
        - $ref: '#/components/schemas/Campaign'
        - type: object
          required: [productIds]
          properties:
            productIds:
              type: array
              description: 'همان `productIds` ِ `CampaignUpsertRequest`؛ خالی = همه‌ی محصولات تخفیف‌دار (برخلاف `products` که نتیجه‌ی محاسبه است)'
              items: { type: integer }
              example: [1, 4, 9]
    BannerUpsertRequest:
      type: object
      required: [placement, title, imageMediaId]
      properties:
        placement: { $ref: '#/components/schemas/BannerPlacement' }
        theme: { type: string, enum: [CREAM, PURPLE, LILAC, DARK, WHITE], default: CREAM }
        tagLabel: { type: string, maxLength: 30, nullable: true, description: 'بدون `tagLabel`، `tag = null`' }
        tagIcon: { type: string, allOf: [{ $ref: '#/components/schemas/IconName' }], nullable: true }
        title: { type: string, minLength: 1, maxLength: 80 }
        text: { type: string, maxLength: 200, nullable: true }
        ctaLabel: { type: string, maxLength: 30, nullable: true, description: 'با `ctaUrl` یا هر دو یا هیچ‌کدام (`400 CTA_INCOMPLETE`)' }
        ctaUrl: { type: string, maxLength: 300, nullable: true, description: '`https://` ِ کامل یا مسیر همین سایت با `/` (`400 URL_INVALID`)' }
        imageMediaId: { type: string, description: 'اجباری (`400 IMAGE_REQUIRED`)؛ مدیای `BANNER`، فقط عکس' }
        overlayHighlight: { type: string, maxLength: 30, nullable: true }
        overlayTitle: { type: string, maxLength: 30, nullable: true }
        overlaySubtitle: { type: string, maxLength: 30, nullable: true }
        overlayChannel: { type: string, allOf: [{ $ref: '#/components/schemas/SocialChannel' }], nullable: true, description: 'همه‌ی `overlay*` خالی ← `overlay = null`' }
        sortOrder: { type: integer, default: 0 }
        startsAt: { type: string, format: date-time, nullable: true }
        endsAt: { type: string, format: date-time, nullable: true, description: 'وقتی هر دو هست، بعد از `startsAt` (`400 DATE_RANGE_INVALID`)' }
    TestimonialUpsertRequest:
      type: object
      required: [customerName, source, message, productId]
      properties:
        customerName: { type: string, minLength: 1, maxLength: 40, example: مریم }
        city: { type: string, maxLength: 40, nullable: true, example: اصفهان }
        source: { $ref: '#/components/schemas/SocialChannel' }
        message: { type: string, minLength: 1, maxLength: 500, description: متن ساده (نه HTML) }
        messageTime: { type: string, pattern: '^\d{2}:\d{2}$', nullable: true, example: '11:17' }
        receivedAt: { type: string, format: date-time, nullable: true, description: 'نه بعد از الان (`400 DATE_IN_FUTURE`)' }
        rating: { type: integer, minimum: 1, maximum: 5, default: 5 }
        productId: { type: integer, description: 'محصول غیربایگانی (`400 PRODUCT_NOT_FOUND`)' }
        colorKey: { type: string, allOf: [{ $ref: '#/components/schemas/ColorKey' }], nullable: true, description: 'رنگی از همان محصول (`400 COLOR_NOT_FOUND`)' }
        screenshotMediaId: { type: string, nullable: true, description: 'مدیای `TESTIMONIAL`، فقط عکس' }
        isPublished: { type: boolean, default: true }
        sortOrder: { type: integer, default: 0 }
    AdminTestimonial:
      description: پیام رضایت در پنل؛ `Testimonial` به‌اضافه‌ی فیلدهایی که فقط فرم ویرایش لازم دارد
      allOf:
        - $ref: '#/components/schemas/Testimonial'
        - type: object
          required: [isPublished, sortOrder, screenshotMediaId, createdAt]
          properties:
            isPublished: { type: boolean, description: 'منتشرنشده‌ها در `GET /testimonials` و صفحه‌ی اصلی نمی‌آیند' }
            sortOrder: { type: integer }
            screenshotMediaId: { type: string, nullable: true, description: 'همان `screenshotMediaId` ِ `TestimonialUpsertRequest`؛ بدون اسکرین‌شات `null`' }
            createdAt: { type: string, format: date-time }

    # ============ ADMIN · CONTENT ============
    BlogPostUpsertRequest:
      type: object
      required: [title, slug, categoryId, blocks]
      properties:
        title: { type: string }
        slug: { type: string }
        excerpt: { type: string, maxLength: 300 }
        lead: { type: string }
        categoryId: { type: integer }
        authorId: { type: integer }
        coverMediaId: { type: string }
        coverBackground: { type: string, nullable: true }
        readingMinutes: { type: integer, nullable: true, description: خالی = محاسبه‌ی خودکار }
        blocks:
          type: array
          items:
            type: object
            description: مثل BlogContentBlock، با `productId` و `imageMediaId` به‌جای آبجکت کامل؛ فیلدهای نوع‌های دیگر (و `anchor`) نادیده
            properties:
              type: { type: string, enum: [HEADING, PARAGRAPH, QUOTE, TIP, PRODUCT, IMAGE, LIST] }
              text: { type: string, nullable: true }
              html: { type: string, nullable: true }
              title: { type: string, nullable: true }
              items:
                type: array
                nullable: true
                items: { type: string }
              productId: { type: integer, nullable: true }
              imageMediaId: { type: string, nullable: true }
        tags:
          type: array
          items: { type: string }
        isFeatured: { type: boolean }
        status: { type: string, enum: [DRAFT, PUBLISHED, ARCHIVED], description: 'نیامده ← `DRAFT`' }
        publishedAt: { type: string, format: date-time, nullable: true }
        seo: { $ref: '#/components/schemas/SeoMeta' }
    AdminSettings:
      type: object
      description: |
        تنظیمات فروشگاه در پنل. بخشی از این‌ها در `/config` منتشر می‌شوند (روش‌های ارسال، ارسال رایگان، رزرو، مهلت مرجوعی، آستانه‌ی موجودی کم،
        پشتیبانی، شبکه‌های اجتماعی و درگاه‌ها)، `siteStats` در `/site/stats`، و بقیه فقط رفتار سرور را عوض می‌کنند.

        **`PUT` کل سند است:** همه‌ی فیلدهای سطح اول لازم‌اند (فیلد نیامده ← `400 FIELD_REQUIRED` روی همان فیلد؛ `null` فقط برای فیلدهای
        `nullable`) و لیست‌ها **کامل جایگزین** می‌شوند. فیلدهای فقط‌خواندنی (`shippingMethods[].description`، `paymentGateways[].name`،
        `paymentGateways[].available`، `siteStats.satisfaction.scale`، `siteStats.satisfaction.metrics[].label`) نادیده گرفته می‌شوند.
        همه‌ی خطاهای شکل با هم و با مسیر فیلد برمی‌گردند (`shippingMethods.1.maxDays`، `social.0.url`). پاسخ همیشه کل سند تازه است.
        ذخیره‌ی بی‌تغییر `200` است و ردیفی در لاگ تغییرات نمی‌گذارد؛ هر ذخیره‌ی دیگر یک ردیف `SETTINGS_UPDATED` با فیلدهای عوض‌شده.

        **تغییرها فقط از این لحظه به بعد اثر دارند:** `paymentPendingMinutes` برای سفارش‌های تازه؛ `reservationHoldDays` برای گروه‌های رزرو تازه؛
        `returnWindowDays` برای سفارش‌هایی که از این به بعد تحویل می‌شوند؛ `preShipmentFeedbackHours` برای عکس‌هایی که از این به بعد فرستاده می‌شوند؛
        هزینه‌ها و آستانه‌ی ارسال رایگان از همگام‌سازی بعدی سبد (سفارش ثبت‌شده مبلغ خودش را دارد). دو استثنا: **اسم روش ارسال** روی سفارش‌های قبلی هم
        عوض می‌شود (از تنظیمات خوانده می‌شود)، و `lowStockThreshold` همان لحظه همه‌جا.

        **همزمانی:** دو ذخیره‌ی همزمان ← دومی `409 CHANGED_BY_SOMEONE_ELSE` و هیچ‌چیزش ذخیره نمی‌شود؛ پنل سند را دوباره می‌خواند.
      required:
        - shippingMethods
        - defaultShippingMethod
        - freeShippingThreshold
        - freeShippingMethods
        - reservationEnabled
        - reservationHoldDays
        - returnWindowDays
        - lowStockThreshold
        - preShipmentFeedbackHours
        - paymentPendingMinutes
        - nonShippingWeekdays
        - supportPhone
        - supportEmail
        - supportHours
        - social
        - paymentGateways
        - siteStats
        - features
      properties:
        shippingMethods:
          type: array
          description: |
            دقیقاً همان روش‌هایی که فروشگاه دارد (`TIPAX` و `POST`)، هر کدام یک بار (وگرنه `400 SHIPPING_METHOD_LIST_INVALID`)؛ ترتیب لیست = ترتیب نمایش.
            `COURIER` تا تصمیمش گرفته نشده `400 SHIPPING_METHOD_NOT_SUPPORTED` است. حداقل یکی فعال (`400 NO_ACTIVE_SHIPPING_METHOD`).
            هر روش: `name` ۱ تا ۵۰ حرف؛ `baseCost` ۰ تا ۱۰٬۰۰۰٬۰۰۰؛ `minDays` ۰ تا ۳۰ و `maxDays` از `minDays` تا ۳۰ (`NUMBER_OUT_OF_RANGE` با `meta.min` و `meta.max`)؛
            `icon` ۱ تا ۳۰ حرف کوچک انگلیسی، رقم یا خط تیره (`ICON_INVALID`)؛ `trackingUrlTemplate` با `https://`، شامل `{code}` و حداکثر ۳۰۰ حرف، یا `null`
            (`TRACKING_URL_TEMPLATE_INVALID`)؛ `description` فقط خواندنی.
          items: { $ref: '#/components/schemas/ShippingMethod' }
        defaultShippingMethod:
          allOf: [{ $ref: '#/components/schemas/ShippingMethodCode' }]
          description: 'روش سبد تازه؛ باید یکی از روش‌های **فعال** لیست باشد (`400 DEFAULT_SHIPPING_METHOD_INVALID`)'
        freeShippingThreshold: { allOf: [{ $ref: '#/components/schemas/Money' }], description: '۰ تا ۱۰۰٬۰۰۰٬۰۰۰؛ با `subtotal` (بعد از تخفیف محصولات، قبل از کد) مقایسه می‌شود', example: 3000000 }
        freeShippingMethods:
          type: array
          uniqueItems: true
          description: 'روش‌هایی که از آستانه به بعد رایگان‌اند؛ هر کدام یکی از روش‌های لیست `shippingMethods` (`COURIER` ← `SHIPPING_METHOD_NOT_SUPPORTED`، تکرار ← `LIST_ITEM_DUPLICATE`). خالی = ارسال رایگان نداریم'
          items: { $ref: '#/components/schemas/ShippingMethodCode' }
        reservationEnabled: { type: boolean, example: true }
        reservationHoldDays: { type: integer, minimum: 1, maximum: 14, example: 4 }
        returnWindowDays: { type: integer, minimum: 0, maximum: 60, example: 7 }
        lowStockThreshold: { type: integer, minimum: 1, maximum: 20, description: 'کمتر از این ← «موجودی کم» و `availableQuantity`', example: 5 }
        preShipmentFeedbackHours: { type: integer, minimum: 1, maximum: 168, description: مهلت پاسخ مشتری به عکس قبل از تأیید خودکار, example: 24 }
        paymentPendingMinutes: { type: integer, minimum: 5, maximum: 60, example: 15 }
        nonShippingWeekdays:
          type: array
          uniqueItems: true
          description: 'روزهایی که ارسال نداریم و در روز کاری حساب نمی‌شوند؛ کمتر از ۷ روز (`400 NON_SHIPPING_WEEKDAYS_INVALID`)، روز ناشناخته ← `WEEKDAY_INVALID`'
          items: { type: string, enum: [SATURDAY, SUNDAY, MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY] }
          example: [FRIDAY]
        supportPhone: { type: string, nullable: true, description: 'موبایل یا تلفن ثابت ایران با پیش‌شماره (ارقام فارسی لاتین می‌شوند، فاصله و خط تیره حذف)؛ `SUPPORT_PHONE_INVALID`؛ متن خالی مثل `null` یعنی پاک', example: '02191001234' }
        supportEmail: { type: string, format: email, maxLength: 100, nullable: true, description: '`EMAIL_INVALID`، بیشتر از ۱۰۰ ← `EMAIL_TOO_LONG`؛ متن خالی مثل `null` یعنی پاک', example: support@kiva.ir }
        supportHours:
          type: array
          maxItems: 7
          description: |
            هر ردیف (`SUPPORT_HOURS_INVALID` روی همان ردیف): `label` ۱ تا ۵۰ حرف؛ `weekdays` حداقل یک روز، بدون تکرار؛ `from` و `to` به شکل `HH:mm`
            و `from < to`، یا هر دو `null` برای «تعطیل». بیشتر از ۷ ردیف ← `TOO_MANY_ITEMS`.
          items: { $ref: '#/components/schemas/SupportHours' }
        social:
          type: array
          maxItems: 10
          description: 'هر ردیف (`SOCIAL_LINK_INVALID` روی همان ردیف): `channel`؛ `name` ۱ تا ۴۰ حرف؛ `url` با `https://` و حداکثر ۳۰۰ حرف؛ `handle` حداکثر ۵۰ حرف یا `null`. بیشتر از ۱۰ ← `TOO_MANY_ITEMS`'
          items: { $ref: '#/components/schemas/SocialLink' }
        paymentGateways:
          type: array
          description: |
            دقیقاً سه درگاه، هر کدام یک بار (`400 PAYMENT_GATEWAY_LIST_INVALID`)؛ ترتیب لیست = ترتیب نمایش در تسویه.
            حداقل یکی فعال (`400 NO_ACTIVE_GATEWAY`) و دقیقاً یکی پیش‌فرض که فعال هم باشد (`400 DEFAULT_GATEWAY_INVALID`).
          items: { $ref: '#/components/schemas/AdminPaymentGatewaySetting' }
        siteStats:
          allOf: [{ $ref: '#/components/schemas/SiteStats' }]
          description: |
            عددهای بازاریابی، **دستی**؛ همین‌ها در `GET /site/stats` منتشر می‌شوند (حساب نمی‌شوند). همه‌ی فیلدهای `SiteStats` لازم‌اند و عددها
            ۰ تا ۱۰٬۰۰۰٬۰۰۰، درصدها ۰ تا ۱۰۰ (`NUMBER_OUT_OF_RANGE`). `satisfaction` بی‌مقدار `null` است؛ با مقدار: `averageRating` ۰ تا ۵ با حداکثر
            یک رقم اعشار (`RATING_INVALID`)، `totalCount` ≥ ۰، `metrics` هر `key` حداکثر یک بار و `sources` بدون تکرار (`LIST_ITEM_DUPLICATE`)؛
            کلید ناشناخته‌ی `metrics` ← `SATISFACTION_METRIC_INVALID`، شبکه‌ی ناشناخته‌ی `sources` ← `SOCIAL_CHANNEL_INVALID`.
        features:
          type: object
          description: |
            پرچم‌های قابلیت. فقط همین سه کلید (کلید ناشناخته ← `400 FEATURE_UNKNOWN`)، و هر سه لازم: `wishlistShare` (لینک اشتراک علاقه‌مندی‌ها)،
            `reviewMedia` (عکس در نظرها)، `giftWrap` (فعلاً پشتیبانی نمی‌شود: `true` ← `400 FEATURE_NOT_AVAILABLE`).
          required: [wishlistShare, reviewMedia, giftWrap]
          additionalProperties: false
          properties:
            wishlistShare: { type: boolean, example: false }
            reviewMedia: { type: boolean, example: false }
            giftWrap: { type: boolean, example: false }
    AdminPaymentGatewaySetting:
      type: object
      description: یک درگاه در تنظیمات پنل
      required: [code, name, isActive, isDefault, available]
      properties:
        code: { $ref: '#/components/schemas/PaymentGatewayCode' }
        name: { type: string, description: فقط خواندنی, example: زرین‌پال }
        isActive: { type: boolean, description: فروشگاه این درگاه را روشن کرده, example: true }
        isDefault: { type: boolean, description: درگاهی که تسویه اول انتخاب می‌کند, example: true }
        available: { type: boolean, description: 'فقط خواندنی: فعال **و** سرور برایش آداپتر دارد؛ فقط همین‌ها به مشتری پیشنهاد می‌شوند', example: true }

    # ============ ADMIN · SUPPORT & REPORTS ============
    AdminReviewListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/Review'
              - type: object
                required: [customerId, contact]
                properties:
                  customerId: { type: integer }
                  contact: { type: string, nullable: true, description: 'راه تماسی که نویسنده داد، وگرنه موبایل فعلی حساب' }
        meta: { $ref: '#/components/schemas/PageMeta' }
        pendingCount: { type: integer, description: کل نظرهای `PENDING`، مستقل از فیلترها, example: 4 }
    ReviewModerationRequest:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [APPROVE, REJECT], description: 'نیامده ← `FIELD_REQUIRED`؛ ناشناخته ← `MODERATION_ACTION_INVALID`' }
        rejectionReason: { type: string, nullable: true, minLength: 3, maxLength: 300, description: 'برای `REJECT` لازم (`REJECTION_REASON_REQUIRED`)؛ در `APPROVE` نادیده' }
        reply: { type: string, nullable: true, minLength: 2, maxLength: 1000, description: 'ثبت هم‌زمان پاسخ کیوا؛ فقط با `APPROVE` (با `REJECT` ← `REPLY_REQUIRES_APPROVAL`)' }
    AdminContactMessage:
      type: object
      required: [ticketCode, topic, fullName, phone, email, orderCode, message, status, reply, replyChannel, repliedAt, repliedBy, internalNote, userId, createdAt, updatedAt]
      properties:
        ticketCode: { type: string, example: CT-482113 }
        topic: { $ref: '#/components/schemas/ContactTopic' }
        fullName: { type: string }
        phone: { $ref: '#/components/schemas/PhoneNumber' }
        email: { type: string, nullable: true }
        orderCode: { type: string, allOf: [{ $ref: '#/components/schemas/OrderCode' }], nullable: true }
        message: { type: string }
        status: { type: string, enum: [OPEN, IN_PROGRESS, CLOSED] }
        reply: { type: string, nullable: true }
        replyChannel: { type: string, enum: [SMS, EMAIL], nullable: true }
        repliedAt: { type: string, format: date-time, nullable: true }
        repliedBy: { type: string, nullable: true, description: 'اسم نمایشی اپراتوری که آخرین پاسخ را داد (اسم کامل، وگرنه موبایل ماسک‌شده)' }
        internalNote: { type: string, nullable: true }
        userId: { type: integer, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AdminCustomer:
      type: object
      properties:
        id: { type: integer }
        phone: { $ref: '#/components/schemas/PhoneNumber' }
        fullName: { type: string, nullable: true }
        email: { type: string, nullable: true }
        ordersCount: { type: integer, description: 'سفارش‌هایی که پولشان رسیده (پرداخت‌شده، از جمله لغو و مرجوعی بعدی)؛ پرداخت‌نشده و منقضی نه' }
        totalSpent: { allOf: [{ $ref: '#/components/schemas/Money' }], description: 'جمع `payable` ِ همان سفارش‌ها (در فاز استرداد، مبلغ برگشتی از آن کم می‌شود)' }
        lastOrderAt: { type: string, format: date-time, nullable: true, description: 'زمان ثبت آخرین همان سفارش‌ها؛ بدون خرید `null`' }
        defaultMessenger: { type: string, allOf: [{ $ref: '#/components/schemas/PhotoMessengerChannel' }], nullable: true }
        marketingSmsOptIn: { type: boolean }
        roles:
          type: array
          items: { $ref: '#/components/schemas/UserRole' }
        createdAt: { type: string, format: date-time }
    AdminCustomerDetail:
      description: صفحه‌ی یک مشتری در پنل (`GET /admin/customers/{customerId}`)؛ `AdminCustomer` به‌اضافه‌ی پروفایل کامل، آدرس‌ها و آخرین سفارش‌ها
      allOf:
        - $ref: '#/components/schemas/AdminCustomer'
        - type: object
          required: [firstName, lastName, birthDate, gender, defaultMessengerPhone, addresses, recentOrders]
          properties:
            firstName: { type: string, nullable: true }
            lastName: { type: string, nullable: true }
            birthDate: { type: string, format: date, nullable: true }
            gender: { $ref: '#/components/schemas/Gender' }
            defaultMessengerPhone: { type: string, allOf: [{ $ref: '#/components/schemas/PhoneNumber' }], nullable: true }
            addresses:
              type: array
              description: همه‌ی آدرس‌های ذخیره‌شده، پیش‌فرض اول
              items: { $ref: '#/components/schemas/Address' }
            recentOrders:
              type: array
              description: 'آخرین ۵ سفارش **در هر وضعیتی** (پرداخت‌نشده و منقضی هم، تا پشتیبانی ببیند)، تازه‌ترین اول؛ برای همه: `GET /admin/orders?q=<موبایل>`'
              items: { $ref: '#/components/schemas/AdminOrderListItem' }
    AdminReportOverview:
      type: object
      description: 'داشبورد مدیریتی یک بازه. «سفارش دوره» در `GET /admin/reports/overview`.'
      required: [from, to, revenue, ordersCount, averageOrderValue, newCustomers, reservationShare, mediaApprovalRate, changeRequestRate, returnRate, discountTotal, shippingMix, messengerMix, topProducts, dailySeries]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        revenue: { allOf: [{ $ref: '#/components/schemas/Money' }], description: 'جمع (پرداخت‌شده − برگشت‌داده‌شده) ِ سفارش‌های دوره؛ پرداخت‌شده = مبلغ ثبت + مانده‌ی پرداخت‌شده' }
        ordersCount: { type: integer, description: تعداد سفارش‌های دوره }
        averageOrderValue: { allOf: [{ $ref: '#/components/schemas/Money' }], description: '`revenue ÷ ordersCount` به نزدیک‌ترین تومان (نیمه به بالا)؛ بدون سفارش ۰' }
        newCustomers: { type: integer, description: کاربرانی که **اولین** سفارش پرداخت‌شده‌شان در این بازه است }
        reservationShare: { type: number, description: درصد سفارش‌های دوره که عضو گروه رزروند, example: 18.5 }
        mediaApprovalRate: { type: number, description: 'از سفارش‌هایی که **اولین** عکس قبل از ارسالشان در بازه فرستاده شد، درصد آن‌هایی که هیچ‌وقت درخواست تغییر نداشتند؛ بدون چنین سفارشی ۰', example: 97.2 }
        changeRequestRate: { type: number, description: 'از همان سفارش‌ها، درصد آن‌هایی که حداقل یک درخواست تغییر داشتند (با `mediaApprovalRate` جمعش ۱۰۰ است، یا هر دو ۰)', example: 2.1 }
        returnRate: { type: number, description: 'از سفارش‌هایی که در بازه تحویل شدند، درصد آن‌هایی که درخواست مرجوعی دارند (تا ساخته شدن مرجوعی همیشه ۰)', example: 0.8 }
        discountTotal: { allOf: [{ $ref: '#/components/schemas/Money' }], description: 'جمع تخفیف کد ِ سفارش‌های دوره' }
        shippingMix:
          type: object
          description: 'تعداد سفارش‌های دوره برای **هر** روش ارسال (`ShippingMethodCode`)، صفر هم'
          additionalProperties: { type: integer }
          example: { TIPAX: 120, POST: 310, COURIER: 0 }
        messengerMix:
          type: object
          description: 'تعداد سفارش‌های دوره برای **هر** پیام‌رسان (`PhotoMessengerChannel`)، صفر هم'
          additionalProperties: { type: integer }
          example: { TELEGRAM: 200, BALE: 130, RUBIKA: 100 }
        topProducts:
          type: array
          maxItems: 5
          description: '۵ محصول با بیشترین تعداد فروخته‌شده در سفارش‌های دوره (ردیف‌های **فعلی** سفارش، یعنی بعد از درخواست تغییر)؛ مساوی ← شناسه‌ی کوچک‌تر اول'
          items:
            type: object
            required: [product, unitsSold, revenue]
            properties:
              product: { $ref: '#/components/schemas/ProductRef' }
              unitsSold: { type: integer }
              revenue: { allOf: [{ $ref: '#/components/schemas/Money' }], description: جمع مبلغ ردیف‌های همین محصول }
        dailySeries:
          type: array
          description: 'هر روز تهران ِ بازه، به ترتیب، **صفر هم**: فروش و تعداد سفارش‌های دوره که `paidOn` شان همان روز است'
          items:
            type: object
            required: [date, revenue, orders]
            properties:
              date: { type: string, format: date }
              revenue: { $ref: '#/components/schemas/Money' }
              orders: { type: integer }
    AuditEntityType:
      type: string
      description: 'نوع چیزی که در پنل تغییر کرد. `MEDIA` استفاده نمی‌شود: آپلود مدیا در لاگ تغییرات ثبت نمی‌شود.'
      enum: [PRODUCT, VARIANT, INVENTORY, MEDIA, CATEGORY, COLOR, MATERIAL, ORDER, RETURN, REFUND, DISCOUNT_CODE, CAMPAIGN, BANNER, ANNOUNCEMENT, TESTIMONIAL, FAQ, PAGE, SETTINGS, REVIEW, CONTACT_MESSAGE, USER, BLOG_POST]
    AuditLogEntry:
      type: object
      description: یک ردیف لاگ تغییرات پنل
      required: [id, at, actor, action, entityType, entityId, entityLabel, summary, changes, ip]
      properties:
        id: { type: integer, example: 90412 }
        at: { type: string, format: date-time }
        actor:
          type: object
          required: [id, fullName, phone]
          properties:
            id: { type: integer, example: 7 }
            fullName: { type: string, nullable: true, example: لیلا احمدی }
            phone: { $ref: '#/components/schemas/PhoneNumber' }
        action:
          type: string
          description: کد ماشینی کار (فهرست باز است و ممکن است کد تازه اضافه شود؛ برای نمایش `summary` کافی است)
          example: PRODUCT_PRICE_CHANGED
        entityType: { $ref: '#/components/schemas/AuditEntityType' }
        entityId: { type: string, description: 'شناسه یا کد همان چیز (`12`، `KV-218340`، `lilac`، `terms`)', example: '12' }
        entityLabel: { type: string, nullable: true, description: نام آماده‌ی نمایش در لحظه‌ی تغییر, example: کیف دوشی ماهک }
        summary: { type: string, description: جمله‌ی فارسی آماده‌ی نمایش, example: قیمت از ۱٬۸۹۰٬۰۰۰ به ۱٬۷۹۰٬۰۰۰ تومان تغییر کرد }
        changes:
          type: array
          nullable: true
          description: 'فیلدهایی که عوض شدند؛ برای کارهایی که «از چه به چه» ندارند (مثل حذف یا ارسال پیامک) `null`'
          items:
            type: object
            required: [field, from, to]
            properties:
              field: { type: string, example: price }
              from: { type: string, nullable: true, example: '1890000' }
              to: { type: string, nullable: true, example: '1790000' }
        ip: { type: string, nullable: true, example: 5.160.12.34 }
