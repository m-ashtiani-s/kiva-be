  # ================================================================
  /admin/discount-codes:
    get:
      tags: [Admin · Marketing]
      x-roles: [ADMIN]
      operationId: adminListDiscountCodes
      summary: "کدهای تخفیف"
      description: |
        تازه‌ترین ساخته‌شده اول. `active` یعنی پرچم `isActive` (نه «الان در بازه‌ی زمانی‌اش است»)؛ نیامده = همه.
        `usedCount` و `totalDiscountGiven` از سفارش‌های پرداخت‌شده‌ی برنگشته‌اند (سفارش لغوشده شمرده نمی‌شود).
      security: [{ bearerAuth: [] }]
      parameters:
        - name: active
          in: query
          description: '`true` فقط فعال‌ها، `false` فقط غیرفعال‌ها؛ مقدار دیگر ← `400 BOOLEAN_INVALID`'
          schema: { type: boolean }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/DiscountCode' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Admin · Marketing]
      x-roles: [ADMIN]
      operationId: adminCreateDiscountCode
      summary: "ساخت کد تخفیف"
      description: 'قانون‌ها در `DiscountCodeUpsertRequest`. ترتیب: شکل (همه با هم) ← دسته‌ها و محصولات هستند (`400`) ← متن تکراری (`409 DUPLICATE_CODE`). یک ردیف `DISCOUNT_CODE_CREATED` در لاگ تغییرات.'
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DiscountCodeUpsertRequest' }
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiscountCode' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: "`DUPLICATE_CODE`: کد دیگری همین متن را دارد"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /admin/discount-codes/{discountId}:
    put:
      tags: [Admin · Marketing]
      x-roles: [ADMIN]
      operationId: adminUpdateDiscountCode
      summary: "ویرایش کد تخفیف"
      description: |
        کل کد را جایگزین می‌کند (فیلد نیامده = پیش‌فرضش). ترتیب: شکل (همه با هم) ← کد هست (`404`؛ شناسه‌ی بدشکل هم `404`) ← دسته‌ها و محصولات هستند (`400`)
        ← متن تکراری به‌جز خودش (`409 DUPLICATE_CODE`). دو ذخیره‌ی همزمان ← دومی `409 CHANGED_BY_SOMEONE_ELSE`.
        ذخیره‌ی بی‌تغییر ردیفی در لاگ تغییرات نمی‌گذارد؛ بقیه یک ردیف `DISCOUNT_CODE_UPDATED` با فیلدهای عوض‌شده.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: discountId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DiscountCodeUpsertRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiscountCode' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: "`DUPLICATE_CODE` (کد دیگری همین متن را دارد) یا `CHANGED_BY_SOMEONE_ELSE` (ذخیره‌ی همزمان)"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    delete:
      tags: [Admin · Marketing]
      x-roles: [ADMIN]
      operationId: adminDeleteDiscountCode
      summary: "غیرفعال کردن کد تخفیف"
      description: |
        هیچ‌وقت حذف واقعی نیست (سفارش‌ها به کد اشاره می‌کنند): `isActive = false` و `204`، با یک ردیف `DISCOUNT_CODE_DEACTIVATED` در لاگ تغییرات.
        کد از قبل غیرفعال هم `204` و بی‌اثر است (بدون ردیف). کد ناموجود یا شناسه‌ی بدشکل ← `404`.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: discountId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
