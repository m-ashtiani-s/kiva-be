          items: { $ref: '#/components/schemas/MessengerLink' }

    # ============ REVIEWS ============
    ReviewStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED]
    ReviewReply:
      type: object
      properties:
        text: { type: string, example: سمیرا جان ممنون از انرژی خوبت، مبارکت باشه. }
        authorName: { type: string, description: همیشه «کیوا», example: کیوا }
        createdAt: { type: string, format: date-time, description: آخرین ذخیره }
    Review:
      type: object
      required: [id, productId, product, authorName, authorInitial, rating, title, text, createdAt, status, statusLabel, rejectionReason, isVerifiedBuyer, purchasedColor, reply, helpfulCount, myHelpfulVote, media, isMine]
      properties:
        id: { type: integer, example: 5531 }
        productId: { type: integer, example: 1 }
        product:
          allOf: [{ $ref: '#/components/schemas/ProductRef' }]
          nullable: true
          description: 'در «نظرات من» و در پنل (صف نظرات و پاسخ تأیید/رد و «پاسخ کیوا»)، با هر وضعیتی که محصول الان دارد؛ بقیه‌جا `null`'
        authorName: { type: string, description: 'اسمی که نویسنده داد؛ نداد ← «کاربر کیوا». اسم حساب خودکار گذاشته نمی‌شود', example: سمیرا }
        authorInitial: { type: string, example: س }
        rating: { type: integer, minimum: 1, maximum: 5, example: 5 }
        title: { type: string, nullable: true, description: '[پیشنهادی] همیشه `null` (ورودی ندارد)' }
        text: { type: string, description: 'متن ساده (نه HTML): به‌صورت متن نمایش بده، نه `innerHTML`؛ خط تازه نگه داشته می‌شود', example: کیفیت دوخت و چرمش عالیه. عکسی که قبل از ارسال فرستادن دقیقاً همونی بود که رسید. }
        createdAt: { type: string, format: date-time }
        status: { $ref: '#/components/schemas/ReviewStatus' }
        statusLabel: { type: string, example: در انتظار تأیید }
        rejectionReason: { type: string, nullable: true, description: 'فقط برای صاحب نظر (و پنل)؛ بقیه‌جا `null`' }
        isVerifiedBuyer: { type: boolean, description: 'تگ «خریدار»: نظر به ردیف تحویل‌شده‌ای از سفارش خود نویسنده وصل است', example: true }
        purchasedColor: { type: object, allOf: [{ $ref: '#/components/schemas/Color' }], nullable: true }
        reply: { type: object, allOf: [{ $ref: '#/components/schemas/ReviewReply' }], nullable: true, description: 'فقط وقتی نظر `APPROVED` است' }
        helpfulCount: { type: integer, example: 4 }
        myHelpfulVote: { type: boolean, nullable: true, description: '`true` یا `null` (مهمان همیشه `null`)' }
        media:
          type: array
          description: '[پیشنهادی] عکس‌های مشتری'
          items: { $ref: '#/components/schemas/MediaAsset' }
        isMine: { type: boolean, example: false }
    CreateReviewRequest:
      type: object
      description: |
        همه‌ی خطاهای شکل با هم (`400`، روی همان فیلد). **وصل خرید:** اگر `orderCode` و `orderItemId` آمدند: سفارش مال خود کاربر (`404 ORDER_NOT_FOUND`)،
        ردیف در سفارش (`400 ORDER_ITEM_NOT_FOUND` روی `orderItemId`)، محصول ردیف همین محصول (`400 ORDER_ITEM_PRODUCT_MISMATCH`)، سفارش تحویل‌شده و لغونشده
        (`422 REVIEW_PURCHASE_NOT_DELIVERED`). فقط یکی آمد ← `400 FIELD_REQUIRED` روی دیگری. **هیچ‌کدام نیامد:** سرور آخرین ردیف تحویل‌شده‌ی همین محصول از
        سفارش‌های همین کاربر را خودش پیدا و وصل می‌کند. وصل‌شده ← `isVerifiedBuyer = true` و `purchasedColor` از snapshot ِ همان ردیف.
      required: [rating, text]
      properties:
        rating: { type: integer, minimum: 1, maximum: 5, description: 'نیامده ← `FIELD_REQUIRED`؛ بیرون ۱ تا ۵ ← `RATING_INVALID`' }
        authorName: { type: string, maxLength: 40, description: 'خالی = «کاربر کیوا» (`TEXT_TOO_LONG`)', example: سارا }
        contact:
          type: string
          description: 'موبایل (`09…` بعد از نرمال‌سازی ارقام) یا ایمیل، وگرنه `CONTACT_INVALID`؛ فقط پنل می‌بیند. نیامده: پنل موبایل حساب را نشان می‌دهد'
          example: '09123456789'
        text: { type: string, minLength: 10, maxLength: 1000, description: 'متن ساده ۱۰ تا ۱۰۰۰ نویسه بعد از trim (`TEXT_TOO_SHORT` / `TEXT_TOO_LONG`)؛ خط تازه نگه داشته می‌شود، بیشتر از دو خط خالی پشت‌سرهم یکی؛ نویسه‌ی کنترلی ← `TEXT_INVALID`', example: از کیفیت، رنگ و اندازه‌اش خیلی راضی‌ام. }
        orderCode: { type: string, allOf: [{ $ref: '#/components/schemas/OrderCode' }], nullable: true, description: 'همراه `orderItemId`؛ شماره‌ی ردیف فقط داخل سفارش خودش یکتاست' }
        orderItemId: { type: integer, nullable: true, description: 'اتصال به خرید → تگ «خریدار» (همراه `orderCode`؛ مثل `ReviewablePurchase`)' }
        mediaIds:
          type: array
          maxItems: 5
          description: '[پیشنهادی] از `POST /me/uploads` با `REVIEW_PHOTO`، فقط آپلودهای خود کاربر (وگرنه `MEDIA_NOT_FOUND`)؛ عکس و ویدیو. پرچم `reviewMedia` خاموش و ناخالی ← `REVIEW_MEDIA_DISABLED`. بیشتر از ۵ ← `TOO_MANY_ITEMS`؛ تکراری ← `LIST_ITEM_DUPLICATE`؛ بعد از ثبت عوض نمی‌شود'
          items: { type: string }
    UpdateReviewRequest:
      type: object
      description: هر فیلد نیامده عوض نمی‌شود؛ همان قانون‌های `CreateReviewRequest`
      properties:
        rating: { type: integer, minimum: 1, maximum: 5 }
        authorName: { type: string, maxLength: 40 }
        text: { type: string, minLength: 10, maxLength: 1000 }
    ReviewListResponse:
      type: object
      required: [summary, items, meta]
      properties:
        summary: { $ref: '#/components/schemas/RatingSummary' }
        items:
          type: array
          items: { $ref: '#/components/schemas/Review' }
        meta: { $ref: '#/components/schemas/PageMeta' }
    MyReviewListResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Review' }
        meta: { $ref: '#/components/schemas/PageMeta' }
        counts:
          type: object
          required: [total, pending, approved, rejected]
          properties:
            total: { type: integer, example: 3 }
            pending: { type: integer, example: 1 }
            approved: { type: integer, example: 2 }
            rejected: { type: integer, example: 0 }
    ReviewablePurchase:
      type: object
      required: [orderCode, orderItemId, product, color, deliveredAt]
      properties:
        orderCode: { $ref: '#/components/schemas/OrderCode' }
        orderItemId: { type: integer }
        product: { $ref: '#/components/schemas/ProductRef' }
        color: { $ref: '#/components/schemas/Color' }
        deliveredAt: { type: string, format: date-time }

    # ============ SEARCH ============
    SearchSuggestProduct:
      type: object
      required: [id, slug, name, nameHighlighted, categoryName, price, matchedColorKey, imageUrl, url]
      properties:
        id: { type: integer, example: 2 }
        slug: { type: string, example: nila-crossbody }
        name: { type: string, example: کراس‌بادی نیلا }
        nameHighlighted: { type: string, example: '<mark>کراس</mark>‌بادی نیلا' }
        categoryName: { type: string, example: کراس‌بادی }
        price: { $ref: '#/components/schemas/PriceInfo' }
        matchedColorKey: { type: string, allOf: [{ $ref: '#/components/schemas/ColorKey' }], nullable: true, example: black }
        imageUrl: { type: string, format: uri, nullable: true, description: 'عکس کوچک ِ رنگ منطبق یا پیش‌فرض؛ محصول بی‌عکس ← `null`' }
        url: { type: string, description: 'با `?color=` فقط وقتی `matchedColorKey` هست', example: '/product/nila-crossbody?color=black' }
    SearchSuggestResponse:
      type: object
      required: [query, normalizedQuery, products, categories, colors, totalProducts, seeAllUrl]
      properties:
        query: { type: string, example: کراس مشکي }
        normalizedQuery: { type: string, example: کراس مشکی }
        products:
          type: array
          items: { $ref: '#/components/schemas/SearchSuggestProduct' }
        categories:
          type: array
          items: { $ref: '#/components/schemas/CategoryRef' }
        colors:
          type: array
          items: { $ref: '#/components/schemas/Color' }
        totalProducts: { type: integer, example: 2 }
        seeAllUrl: { type: string, example: '/products?q=کراس%20مشکی' }
    SearchHints:
      type: object
      required: [categories, colors, popularQueries]
      properties:
        categories:
          type: array
          items: { $ref: '#/components/schemas/CategoryRef' }
        colors:
          type: array
          items: { $ref: '#/components/schemas/Color' }
        popularQueries:
          type: array
