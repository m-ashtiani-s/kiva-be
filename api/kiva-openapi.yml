        (همه‌ی بقیه ← `422 INVALID_STATUS_TRANSITION`). اگر استرداد ِ `PENDING`/`PROCESSING` ِ همین مرجوعی هست ← `422 RETURN_REFUND_OPEN` (اول آن را
        تمام یا `FAILED` کنید). دلیل در جزئیات مرجوعی نمایش داده می‌شود و پیامک (با `notifyCustomer`) فقط کد مرجوعی را دارد. سفارش به `DELIVERED` برمی‌گردد
        و دیگر مرجوعی نمی‌گیرد؛ عددهایی که با رسید به موجودی برگشته‌اند سر جایشان می‌مانند. یک ردیف `RETURN_CLOSED` در لاگ تغییرات.
