    delete:
      tags: [Product]
      operationId: deleteMyStockAlert
      summary: "لغو اشتراک موجود شدن"
      security: [{ bearerAuth: [] }]
      parameters:
        - name: alertId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /me/uploads:
    post:
      tags: [Uploads]
      operationId: uploadMyFile
      summary: "آپلود عکس/ویدیو (برای مرجوعی یا نظر) — خروجی mediaId"
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, purpose]
              properties:
                file:
                  type: string
                  format: binary
                  description: "jpg/png/webp تا ۸MB یا mp4 تا ۵۰MB"
                purpose: { type: string, enum: [RETURN_EVIDENCE, REVIEW_PHOTO] }
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaAsset' }
        '413':
          description: "`UPLOAD_TOO_LARGE`"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '415':
          description: "`UPLOAD_TYPE_NOT_ALLOWED`"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  # ================================================================
