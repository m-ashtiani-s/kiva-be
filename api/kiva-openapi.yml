  /products:
    get:
      tags: [Catalog]
      operationId: listProducts
      summary: "لیست محصولات با فیلتر، مرتب‌سازی، صفحه‌بندی و (اختیاری) facets"
      description: |
        پارامترها همان state صفحه‌ی فروشگاه هستند (`?q=&category=shoulder,cross&color=black,lilac&minPrice=&maxPrice=&onSale=true&inStock=true&sort=bestselling`).

        * وقتی فیلتر رنگ فعال است، `ProductSummary.displayColorKey` برابر اولین رنگ منطبق است تا **عکس اول کارت همان رنگ** باشد.
        * ناموجودها در انتهای لیست قرار می‌گیرند مگر `sort` قیمتی باشد.
        * `title` و `appliedFilters` آماده‌ی نمایش (عنوان صفحه، بردکرامب و چیپ‌های فیلتر فعال) برگردانده می‌شوند.
        * با `ids` می‌توان لیست «اخیراً دیده‌شده» یا علاقه‌مندی مهمان را گرفت.
      security: [{}, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/SearchQuery'
        - $ref: '#/components/parameters/CategoryFilter'
        - $ref: '#/components/parameters/ColorFilter'
        - $ref: '#/components/parameters/MinPrice'
        - $ref: '#/components/parameters/MaxPrice'
        - $ref: '#/components/parameters/OnSale'
        - $ref: '#/components/parameters/InStock'
        - $ref: '#/components/parameters/IsNew'
        - $ref: '#/components/parameters/HasVideo'
        - $ref: '#/components/parameters/BagTypeFilter'
        - $ref: '#/components/parameters/MaterialFilter'
        - $ref: '#/components/parameters/OccasionFilter'
        - $ref: '#/components/parameters/CampaignFilter'
        - $ref: '#/components/parameters/ProductIds'
        - $ref: '#/components/parameters/ProductSort'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/ProductPageSize'
        - name: includeFacets
          in: query
          description: اگر true باشد facets (تعداد هر دسته/رنگ و بازه‌ی قیمت) هم در پاسخ می‌آید.
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductListResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
  /products/facets:
    get:
      tags: [Catalog]
      operationId: getProductFacets
      summary: "شمارش‌های فیلتر (تعداد هر دسته و رنگ) و کمترین/بیشترین قیمت فعلی"
      description: |
        بازه‌ی قیمت پویاست: ارزان‌ترین و گران‌ترین محصول فعلی، گرد شده با `step` (۱۰٬۰۰۰ تومان).
        هر facet با در نظر گرفتن سایر فیلترهای اعمال‌شده (به جز خودش) شمرده می‌شود (disjunctive faceting).
      parameters:
        - $ref: '#/components/parameters/SearchQuery'
        - $ref: '#/components/parameters/CategoryFilter'
        - $ref: '#/components/parameters/ColorFilter'
        - $ref: '#/components/parameters/MinPrice'
        - $ref: '#/components/parameters/MaxPrice'
        - $ref: '#/components/parameters/OnSale'
        - $ref: '#/components/parameters/InStock'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductFacets' }

        '400': { $ref: '#/components/responses/ValidationError' }
  # ================================================================
  #  PRODUCT
  # ================================================================
  /products/{idOrSlug}:
    get:
      tags: [Product]
      operationId: getProduct
      summary: "جزئیات کامل محصول (گالری هر رنگ، ویدیو، قیمت، موجودی، مشخصات، امتیاز، SEO)"
      description: |
        `idOrSlug` می‌تواند `1`، `KV-1001` (کد محصول) یا `mahak-shoulder-bag` باشد.
        تشخیص بی‌ابهام است: فقط رقم ← id؛ با حروف بزرگ (`KV-...`) ← کد محصول؛ در غیر این صورت ← slug
        (slug همیشه حروف کوچک است و حداقل یک حرف دارد).
        اگر با id/sku صدا زده شود، `seo.canonicalUrl` آدرس slug را برمی‌گرداند.
        پارامتر `color` فقط `selectedColorKey` را تعیین می‌کند (برای لینک‌هایی مثل `product?id=2&color=olive`).
        در صورت ورود کاربر: `isWishlisted` و `stockAlert.subscribed` پر می‌شوند.
      security: [{}, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ProductIdOrSlug'
        - name: color
          in: query
          schema: { $ref: '#/components/schemas/ColorKey' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductDetail' }
        '301':
          description: slug تغییر کرده؛ هدر `Location` به آدرس جدید اشاره می‌کند
        '404': { $ref: '#/components/responses/NotFound' }
        '400': { $ref: '#/components/responses/ValidationError' }
  /products/{productId}/related:
    get:
      tags: [Product]
      operationId: getRelatedProducts
      summary: "محصولات مشابه (اول هم‌دسته، بعد پرفروش‌ترین‌ها)"
      security: [{}, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ProductId'
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 24, default: 8 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ProductSummary' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
  /products/{productId}/stock-alerts:
    post:
      tags: [Product]
      operationId: createStockAlert
      summary: "«موجود شد خبرم کن» — اشتراک پیامک موجود شدن"
      description: |
        اگر کاربر وارد شده باشد شماره‌ی حسابش استفاده می‌شود؛ در غیر این صورت `phone` الزامی است.
        اگر `variantId` نیاید، با موجود شدن **هر** رنگی اطلاع داده می‌شود.
      security: [{}, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ProductId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateStockAlertRequest' }
      responses:
        '201':
          description: ثبت شد
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StockAlert' }
        '409':
          description: "`STOCK_ALERT_EXISTS`"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: "`PRODUCT_IN_STOCK` — محصول/رنگ موجود است"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
  /products/{productId}/inquiry:
    get:
      tags: [Product]
      operationId: getProductInquiryLinks
      summary: "«سؤال داری؟ عکس یا ویدیوی بیشتر بخواه» — لینک پیام‌رسان‌ها با متن آماده"
      description: |
        متن پیام شامل نام محصول، رنگ انتخابی و کد محصول (KV-1001) است و در `url` هر کانال (`?text=`) قرار می‌گیرد.
        ساخت لینک در سرور انجام می‌شود تا تغییر آیدی‌ها یا متن نیاز به انتشار فرانت نداشته باشد.
      parameters:
        - $ref: '#/components/parameters/ProductId'
        - name: color
          in: query
          schema: { $ref: '#/components/schemas/ColorKey' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductInquiry' }

        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
  # ================================================================
  #  REVIEWS
  # ================================================================
  /products/{productId}/reviews:
    get:
      tags: [Reviews]
      operationId: listProductReviews
      summary: "نظرات تأییدشده‌ی محصول + خلاصه‌ی امتیاز (میانگین و توزیع ستاره‌ها)"
      description: اگر کاربر وارد شده باشد، نظرات «در انتظار تأیید» خودش هم با `isMine=true` در ابتدای لیست می‌آید.
      security: [{}, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ProductId'
        - name: sort
          in: query
          schema: { type: string, enum: [newest, highest, lowest, helpful], default: newest }
        - name: rating
          in: query
          description: فیلتر بر اساس ستاره
          schema: { type: integer, minimum: 1, maximum: 5 }
        - name: withMedia
          in: query
          schema: { type: boolean }
        - name: verifiedOnly
          in: query
          schema: { type: boolean }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: OK
          content:
            application/json:
