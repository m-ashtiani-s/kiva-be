        productCode: { type: string, example: KV-1001 }
        productName: { type: string, example: کیف دوشی ماهک }
        colorName: { type: string, example: یاسی }
        prefilledText: { type: string, example: 'سلام، درباره «کیف دوشی ماهک» رنگ یاسی (کد KV-1001) سؤال دارم. می‌شه عکس/ویدیوی بیشتری بفرستید؟' }
        channels:
