  /admin/customers/{customerId}/roles:
    put:
      tags: [Admin · Support]
      x-roles: [ADMIN]
      operationId: adminSetCustomerRoles
      summary: "تعیین نقش‌های پنل یک کاربر"
      description: |
        لیست کامل نقش‌ها را جایگزین می‌کند (`CUSTOMER` همیشه می‌ماند و لازم نیست فرستاده شود). بعد از تغییر، همه‌ی نشست‌های آن کاربر
        باطل می‌شوند تا با نقش‌های جدید دوباره وارد شود. هر تغییر با «چه کسی، کِی، از چه به چه» در رویدادهای امنیتی ثبت می‌شود.
        هیچ‌کس نقش‌های **خودش** را عوض نمی‌کند (`422 ROLE_CHANGE_NOT_ALLOWED`)، تا آخرین ADMIN اشتباهی خودش را بیرون نیندازد.
        **آخرین ADMIN نقشش را از دست نمی‌دهد:** تغییری که تعداد ADMINها را صفر کند ← `422 ROLE_CHANGE_NOT_ALLOWED` با `meta.reason = LAST_ADMIN`.
        تغییرهای نقش یکی‌یکی انجام می‌شوند و نقش‌های **فعلی** ِ انجام‌دهنده همان لحظه دوباره خوانده می‌شوند: اگر دو ADMIN همزمان ADMIN ِ همدیگر را
        بردارند، یکی انجام می‌شود و دومی (که دیگر ADMIN نیست) `403 FORBIDDEN` می‌گیرد. هر تغییر در رویدادهای امنیتی و لاگ تغییرات (`USER_ROLES_CHANGED`) ثبت می‌شود.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: customerId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roles]
              properties:
                roles:
                  type: array
                  uniqueItems: true
                  items: { $ref: '#/components/schemas/UserRole' }
                  example: [OPERATOR]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminCustomer' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: "`ROLE_CHANGE_NOT_ALLOWED`: نقش‌های خودت را نمی‌توانی عوض کنی، یا (`meta.reason = LAST_ADMIN`) این آخرین ADMIN است"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /admin/reports/overview:
    get:
      tags: [Admin · Support]
      x-roles: [ADMIN]
      operationId: adminReportOverview
      summary: "داشبورد مدیریتی (فروش، تعداد سفارش، میانگین سبد، پرفروش‌ها، نرخ تأیید عکس)"
      description: |
        `from` و `to` روزهای تهران‌اند و هر دو **شامل** (`from` از ساعت ۰۰:۰۰ همان روز تا پایان روز `to`). نیامده ← `400 FIELD_REQUIRED`،
        بدشکل ← `400 DATE_INVALID`، `from` بعد از `to` ← `400 DATE_RANGE_INVALID` روی `to`، بیشتر از ۳۶۶ روز ← `400 DATE_RANGE_TOO_LONG` روی `to`.

        **سفارش دوره** = سفارشی که پولش (`paidOn`، پرداخت اول) در بازه رسیده و لغو نشده. همه‌ی عددهای پولی از همین سفارش‌هاست
        (معنی هر فیلد در `AdminReportOverview`). همه با ریاضی صحیح؛ درصدها یک رقم اعشار، نیمه به بالا.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
          example: '2026-10-01'
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
          example: '2026-10-31'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminReportOverview' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/audit-log:
    get:
      tags: [Admin · Support]
      x-roles: [ADMIN]
      operationId: adminListAuditLog
      summary: "لاگ تغییرات پنل: چه کسی، کِی، چه کاری، روی چه چیزی (تازه‌ترین اول)"
      description: |
        هر درخواست موفق نوشتنی زیر `/admin/*` یک ردیف (بخش ۲). لاگ فقط اضافه می‌شود و ویرایش ندارد؛ بعد از ۹۰ روز خودکار پاک می‌شود،
        پس بازه‌ی قدیمی‌تر فقط خالی برمی‌گردد.
        برای تاریخچه‌ی یک مورد: `entityType` + `entityId` (مثلاً `PRODUCT` و `12`، یا `ORDER` و `KV-218340`). `entityId` بدون `entityType` هم مجاز است.
        `from` و `to` روزهای تهران‌اند و هر دو شامل: `from` از ساعت ۰۰:۰۰ همان روز و `to` تا پایان همان روز (۰۰:۰۰ ِ روز بعد، نابسته).
        `from` بعد از `to` ← `400` روی `to` با `DATE_RANGE_INVALID`. ترتیب: تازه‌ترین اول (`at`، بعد `id`، نزولی).
        `actor` موقع خواندن از حساب فعلی کاربر می‌آید (موبایل کامل، چون فقط `ADMIN` می‌بیند)؛ `summary` جمله‌ی فارسی همان ردیف است.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: entityType
          in: query
          schema: { $ref: '#/components/schemas/AuditEntityType' }
        - name: entityId
          in: query
          schema: { type: string, maxLength: 64 }
        - name: actorId
          in: query
          description: شناسه‌ی کاربر پنلی که کار را کرده
          schema: { type: integer }
        - name: from
          in: query
          description: روز شروع (به وقت تهران، شامل)
          schema: { type: string, format: date }
        - name: to
          in: query
          description: روز پایان (به وقت تهران، شامل)
          schema: { type: string, format: date }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, meta]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AuditLogEntry' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        accessToken دریافتی از `POST /auth/otp/verify` یا `POST /auth/refresh`، با اعتبار ۱۵ دقیقه.
        Claimها: `sub` (userId)، `sid` (شناسه‌ی نشست)، `phone`، `roles` (`CUSTOMER`، و برای پنل: `ADMIN`، `CATALOG_MANAGER`، `OPERATOR`، `CONTENT_EDITOR`، `SUPPORT`)، `iat`، `exp`.
        کلاینت محتوای توکن را فقط برای نمایش می‌خواند (مثلاً منوی پنل از روی `roles`)؛ تصمیم دسترسی همیشه با سرور است.
        endpointهای `/admin/*` نیازمند نقش‌های `x-roles` خود هستند و در غیر این صورت `403 FORBIDDEN`.
    refreshCookie:
      type: apiKey
      in: cookie
      name: kiva_rt
      description: |
        refreshToken در کوکی `HttpOnly; Secure; SameSite=Strict; Path=/api/v1/auth`. فقط `POST /auth/refresh` و `POST /auth/logout` آن را می‌خوانند.
        کلاینت با `credentials: 'include'` درخواست می‌دهد و هیچ‌وقت خود توکن را نمی‌بیند.

  # ----------------------------------------------------------------
  parameters:
    Page:
      name: page
      in: query
      description: شماره صفحه (از ۱)
      schema: { type: integer, minimum: 1, default: 1 }
    Size:
      name: size
      in: query
      description: تعداد آیتم در صفحه
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    ProductPageSize:
      name: size
      in: query
      description: تعداد محصول در صفحه (گرید ۳ ستونه → مضرب ۳ و ۲)
      schema: { type: integer, minimum: 1, maximum: 60, default: 24 }
    SearchQuery:
      name: q
      in: query
      description: جستجو روی نام، دسته، رنگ‌های فعال، متریال و کد محصول (SKU)، با نرمال‌سازی ی/ک
      schema: { type: string, maxLength: 100, example: کراس‌بادی }
    CategoryFilter:
      name: category
      in: query
      description: یک یا چند slug دسته‌بندی، جدا با کاما
      style: form
      explode: false
      schema:
        type: array
        items: { type: string }
        example: [shoulder, cross]
    ColorFilter:
      name: color
      in: query
      description: یک یا چند کلید رنگ، جدا با کاما (محصولی که حداقل یکی از رنگ‌ها را دارد)
      style: form
      explode: false
      schema:
        type: array
        items: { $ref: '#/components/schemas/ColorKey' }
        example: [black, lilac]
    MinPrice:
      name: minPrice
      in: query
      schema: { type: integer, format: int64, minimum: 0, example: 500000 }
    MaxPrice:
      name: maxPrice
      in: query
      schema: { type: integer, format: int64, minimum: 0, example: 2500000 }
    OnSale:
      name: onSale
      in: query
      description: فقط تخفیف‌خورده‌ها
      schema: { type: boolean }
    InStock:
      name: inStock
      in: query
      description: فقط کالاهای موجود
      schema: { type: boolean }
    IsNew:
      name: isNew
      in: query
      description: فقط محصولات جدید
      schema: { type: boolean }
    HasVideo:
      name: hasVideo
      in: query
      description: "فقط محصولات دارای ویدیو [پیشنهادی]"
      schema: { type: boolean }
    BagTypeFilter:
      name: bagType
      in: query
      description: "فرم کیف [پیشنهادی]"
      style: form
      explode: false
      schema:
        type: array
        items: { $ref: '#/components/schemas/BagType' }
    MaterialFilter:
      name: material
      in: query
      description: "slug متریال [پیشنهادی]"
      style: form
      explode: false
      schema:
        type: array
        items: { type: string }
        example: [genuine-leather]
    OccasionFilter:
      name: occasion
      in: query
      description: "مناسب برای (دانشگاه، مهمانی، ...) [پیشنهادی]"
      style: form
      explode: false
      schema:
        type: array
        items: { $ref: '#/components/schemas/Occasion' }
    CampaignFilter:
      name: campaign
      in: query
      description: slug کمپین (برای صفحه‌ی «همه تخفیف‌های جشنواره»)
      schema: { type: string, example: paeez-1405 }
    ProductIds:
      name: ids
      in: query
      description: لیست شناسه‌ها (اخیراً دیده‌شده / مقایسه)، ترتیب حفظ می‌شود
      style: form
      explode: false
      schema:
        type: array
        maxItems: 60
        items: { type: integer }
    ProductSort:
      name: sort
      in: query
      description: |
        `newest` جدیدترین (پیش‌فرض) · `bestselling` پرفروش‌ترین · `price_asc` ارزان‌ترین · `price_desc` گران‌ترین ·
        `discount_desc` بیشترین تخفیف · `rating_desc` بیشترین امتیاز
      schema:
        type: string
        enum: [newest, bestselling, price_asc, price_desc, discount_desc, rating_desc]
        default: newest
    ProductIdOrSlug:
      name: idOrSlug
      in: path
      required: true
      description: شناسه‌ی عددی، کد محصول (KV-1001) یا slug
      schema: { type: string, example: mahak-shoulder-bag }
    ProductId:
      name: productId
      in: path
      required: true
      schema: { type: integer, example: 1 }
    VariantId:
      name: variantId
      in: path
      required: true
      schema: { type: integer, example: 101 }
    ReviewId:
      name: reviewId
      in: path
      required: true
      schema: { type: integer, example: 5531 }
    CartItemId:
      name: itemId
      in: path
      required: true
      schema: { type: string, example: 'ci_8d2f1a' }
    CartToken:
      name: X-Cart-Token
      in: header
      required: false
      description: توکن سبد مهمان. برای کاربر واردشده لازم نیست و با Bearer معتبر نادیده گرفته می‌شود.
      schema: { type: string, example: 'gct_7f3a9c2e1b' }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        UUID یکتا برای هر تلاش ثبت؛ جلوگیری از ثبت دوباره‌ی سفارش با دابل‌کلیک یا قطع شبکه.
        کلاینت برای هر تلاش تازه کلید تازه می‌سازد و فقط برای تکرار همان درخواست (مثلاً بعد از قطع شبکه) همان کلید را می‌فرستد.
        نیامده یا UUID نیست = `400 VALIDATION_ERROR` روی فیلد `Idempotency-Key`. قواعد کامل در «قراردادهای کلی».
      schema: { type: string, format: uuid }
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: ETag نسخه‌ی فعلی برای جلوگیری از بازنویسی همزمان
      schema: { type: string }
    OrderCode:
      name: orderCode
      in: path
      required: true
      schema: { $ref: '#/components/schemas/OrderCode' }
    AddressId:
      name: addressId
      in: path
      required: true
      schema: { type: integer, example: 42 }
    PaymentId:
      name: paymentId
      in: path
      required: true
      schema: { type: string, example: 'pay_01J9X2K7' }
    GatewayPath:
      name: gateway
      in: path
      required: true
      schema:
        type: string
        enum: [zarinpal, saman, mellat]

  # ----------------------------------------------------------------
  headers:
    ETag:
      description: نسخه‌ی منبع برای کش شرطی (`If-None-Match`)
      schema: { type: string, example: 'W/"a1b2c3"' }
    XCartToken:
      description: توکن سبد مهمان (فقط وقتی سبد جدید ساخته شده یا توکن عوض شده). روی پاسخ خطا هیچ‌وقت نمی‌آید، چون سبد تازه‌ی درخواستِ شکست‌خورده نگه داشته نمی‌شود
      schema: { type: string, example: 'gct_7f3a9c2e1b' }
    RetryAfter:
      description: چند ثانیه‌ی دیگر می‌توان دوباره تلاش کرد
      schema: { type: integer, example: 87 }
    SetRefreshCookie:
      description: |
        نشست جدید یا چرخیده: `kiva_rt=<token>; HttpOnly; Secure; SameSite=Strict; Path=/api/v1/auth; Max-Age=<ثانیه>`.
        `Max-Age` همان `refreshExpiresIn` پاسخ است.
      schema: { type: string, example: 'kiva_rt=Q2xhdWRlIHdhcyBoZXJl...; Max-Age=2592000; Path=/api/v1/auth; Secure; HttpOnly; SameSite=Strict' }
    ClearRefreshCookie:
      description: پاک کردن کوکی نشست
      schema: { type: string, example: 'kiva_rt=; Max-Age=0; Path=/api/v1/auth; Secure; HttpOnly; SameSite=Strict' }

  # ----------------------------------------------------------------
  responses:
    NoContent:
      description: انجام شد (بدون محتوا)
    ValidationError:
      description: "`VALIDATION_ERROR` — ورودی نامعتبر (جزئیات در `errors[]`)"
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://kiva.ir/problems/validation-error
            title: Validation failed
            status: 400
            code: VALIDATION_ERROR
            message: چند تا از فیلدها رو باید درست کنی
            traceId: 4bf92f3577b34da6
            errors:
              - field: postalCode
                code: PATTERN
                message: کد پستی باید ۱۰ رقم باشه
              - field: recipientPhone
                code: PHONE_INVALID
                message: موبایل معتبر وارد کن
    Unauthorized:
      description: "`UNAUTHORIZED` / `TOKEN_EXPIRED` — نیاز به ورود"
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            status: 401
            code: UNAUTHORIZED
            message: اول وارد حساب کاربریت شو.
    Forbidden:
      description: "`FORBIDDEN` — نقش کافی ندارید"
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: "`NOT_FOUND` (یا کد دقیق‌تر مثل `PRODUCT_NOT_FOUND`، `ORDER_NOT_FOUND`، `TRACKING_NOT_FOUND`)"
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            status: 404
            code: TRACKING_NOT_FOUND
            message: سفارشی با این شماره و موبایل پیدا نکردیم.
    TooManyRequests:
      description: "`RATE_LIMITED` / `OTP_RESEND_TOO_SOON`"
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            status: 429
            code: OTP_RESEND_TOO_SOON
            message: تا ۰۱:۲۷ دیگه می‌تونی دوباره کد بگیری.
            meta: { retryAfterSeconds: 87 }

  # ----------------------------------------------------------------
  schemas:
    # ============ PRIMITIVES ============
    Money:
      type: integer
      format: int64
      minimum: 0
      description: مبلغ به تومان
      example: 1890000
    PhoneNumber:
      type: string
      pattern: '^09\d{9}$'
      description: موبایل ۱۱ رقمی (ورودی با ارقام فارسی هم پذیرفته و نرمال می‌شود)
      example: '09123456789'
    PostalCode:
      type: string
      pattern: '^\d{10}$'
      example: '1965843117'
    OrderCode:
      type: string
      pattern: '^KV-\d{4,8}$'
      description: کد عمومی سفارش
      example: KV-218340
    ColorKey:
      type: string
      pattern: '^[a-z][a-z0-9-]{1,30}$'
      description: کلید پایدار رنگ در پالت
      example: lilac
    Currency:
      type: string
      enum: [IRT]
      description: IRT = تومان
      default: IRT
    IconName:
      type: string
      description: نام آیکن در آیکن‌ست فرانت (`camera`، `truck`، `timer`، `refresh`، `box`، `heart`، ...)
      example: camera
    HtmlString:
      type: string
      description: |
        HTML امن و sanitize‌شده در سرور (فقط تگ‌های `p, b, strong, em, a, ul, ol, li, br, mark, h2, h3, blockquote`).
        `a` فقط با `href`، و فقط به آدرس کامل `http://`/`https://` یا مسیر نسبی‌ای که با یک `/` (نه `//` و نه `/\`) یا `#` شروع
        می‌شود (`/faq#reserve`، `#top`)؛ هر لینک دیگری (`javascript:`، `//evil.com`، `faq`) `href` اش را از دست می‌دهد و متنش می‌ماند.
    Tone:
      type: string
      description: رنگ‌بندی تگ در دیزاین‌سیستم (`tag`, `tag-sale`, `tag-warn`, `tag-success`, `tag-cream`, `tag-dark`, `tag-glass`)
      enum: [DEFAULT, SALE, WARN, SUCCESS, CREAM, DARK, GLASS, DANGER]

    # ============ PAGINATION & ERRORS ============
    PageMeta:
      type: object
      required: [page, size, totalItems, totalPages, hasNext]
      properties:
        page: { type: integer, example: 1 }
        size: { type: integer, example: 24 }
        totalItems: { type: integer, example: 16 }
        totalPages: { type: integer, example: 1 }
        hasNext: { type: boolean, example: false }
    MessageResponse:
      type: object
      required: [message]
      properties:
        message: { type: string, example: عضو خبرنامه کیوا شدی! }
    FieldError:
      type: object
      required: [field, code, message]
      properties:
        field: { type: string, description: 'مسیر فیلد (dot-notation)', example: newAddress.postalCode }
        code:
          type: string
          description: >-
            کد مشکل همین فیلد. فهرست ثابتی ندارد (برخلاف `ErrorCode` که `code` اصلی پاسخ است) و ممکن است کد تازه اضافه شود؛
            برای نمایش، `field` و `message` کافی است.
          example: PATTERN
        message: { type: string, example: کد پستی باید ۱۰ رقم باشه }
        meta:
          type: object
          nullable: true
          description: >-
            داده‌ی کمکی همین خطا، همون عددهایی که `message` ازشون ساخته شده (`min`، `max`، `maxLength`، `maxItems`، `maxDays`، …)؛
            خطای بی‌داده `null`. برای نمایش لازم نیست؛ برای کنار input گذاشتن سقف (از 1.11.1).
          additionalProperties: true
          example: { min: 0, max: 30 }
    Problem:
      type: object
      description: RFC 7807 Problem Details + کد ماشینی کیوا
      required: [status, code, message]
      properties:
        type: { type: string, format: uri, example: 'https://kiva.ir/problems/discount-min-subtotal' }
        title: { type: string, example: Discount minimum subtotal not met }
        status: { type: integer, example: 422 }
        code: { $ref: '#/components/schemas/ErrorCode' }
        message: { type: string, description: پیام فارسی قابل نمایش به کاربر, example: این کد برای خرید بالای ۲٬۰۰۰٬۰۰۰ تومان فعاله }
        detail: { type: string, description: توضیح فنی (فقط در محیط‌های غیر production) }
        instance: { type: string, nullable: true, example: /api/v1/cart/discount-code }
        traceId: { type: string, nullable: true, example: 4bf92f3577b34da6 }
        errors:
          type: array
          nullable: true
          description: فقط برای `VALIDATION_ERROR`؛ در بقیه‌ی خطاها `null`
          items: { $ref: '#/components/schemas/FieldError' }
        meta:
          type: object
          nullable: true
          description: داده‌ی کمکی وابسته به خطا (`minSubtotal`, `availableQuantity`, `attemptsLeft`, `retryAfterSeconds`, `payable`, ...)
          additionalProperties: true
          example: { minSubtotal: 2000000 }
    ErrorCode:
      type: string
      description: کدهای خطای پایدار برای نگاشت رفتار UI (ERROR_BEHAVIOUR در فرانت)
      enum:
        - VALIDATION_ERROR
        - UNAUTHORIZED
        - TOKEN_EXPIRED
        - REFRESH_TOKEN_INVALID
        - FORBIDDEN
        - NOT_FOUND
        - RATE_LIMITED
        - INTERNAL_ERROR
        - CHANGED_BY_SOMEONE_ELSE
        - PHONE_INVALID
        - OTP_INVALID
        - OTP_EXPIRED
        - OTP_TOO_MANY_ATTEMPTS
        - OTP_RESEND_TOO_SOON
        - PHONE_ALREADY_REGISTERED
        - PRODUCT_NOT_FOUND
        - VARIANT_NOT_FOUND
        - PRODUCT_UNAVAILABLE
        - OUT_OF_STOCK
        - QUANTITY_EXCEEDS_STOCK
        - QUANTITY_EXCEEDS_LIMIT
        - CART_NOT_FOUND
        - CART_EMPTY
        - CART_ITEM_NOT_FOUND
        - DISCOUNT_CODE_INVALID
        - DISCOUNT_CODE_EXPIRED
        - DISCOUNT_CODE_NOT_STARTED
        - DISCOUNT_MIN_SUBTOTAL_NOT_MET
        - DISCOUNT_FIRST_ORDER_ONLY
        - DISCOUNT_USAGE_LIMIT_REACHED
        - DISCOUNT_LOGIN_REQUIRED
        - DISCOUNT_NOT_APPLICABLE
        - ADDRESS_NOT_FOUND
        - ADDRESS_LIMIT_REACHED
        - CITY_NOT_IN_PROVINCE
        - SHIPPING_METHOD_UNAVAILABLE
        - MESSENGER_REQUIRED
        - MESSENGER_PHONE_INVALID
        - TERMS_NOT_ACCEPTED
        - PRICE_CHANGED
        - IDEMPOTENCY_KEY_REUSED
        - ORDER_NOT_FOUND
        - ORDER_NOT_CANCELLABLE
        - ORDER_NOT_RETURNABLE
        - RETURN_WINDOW_EXPIRED
        - ORDER_ALREADY_PAID
        - CHANGE_REQUEST_NOT_ALLOWED
        - INVALID_STATUS_TRANSITION
        - PAYMENT_NOT_FOUND
        - PAYMENT_FAILED
        - PAYMENT_EXPIRED
        - PAYMENT_GATEWAY_UNAVAILABLE
        - TRACKING_NOT_FOUND
        - REVIEW_ALREADY_EXISTS
        - REVIEW_NOT_EDITABLE
        - STOCK_ALERT_EXISTS
        - PRODUCT_IN_STOCK
        - WISHLIST_LIMIT_REACHED
        - UPLOAD_TOO_LARGE
        - UPLOAD_TYPE_NOT_ALLOWED
        - DUPLICATE_SLUG
        - DUPLICATE_SKU
        - RESERVATION_UNAVAILABLE
        - ACCOUNT_HAS_ACTIVE_ORDERS
        - ROLE_CHANGE_NOT_ALLOWED
        # --- پنل ادمین: کلید تکراری (رنگ) ---
        - DUPLICATE_CODE
        # --- پنل ادمین: محصول و رنگ‌هایش ---
        - COLOR_ALREADY_ON_PRODUCT
        - PRODUCT_ARCHIVED
        - PRODUCT_ALREADY_ACTIVE
        - PRODUCT_ALREADY_DRAFT
        - PRODUCT_ALREADY_ARCHIVED
        - VARIANT_ALREADY_ACTIVE
        - VARIANT_ALREADY_INACTIVE
        - INACTIVE_VARIANT_CANNOT_BE_DEFAULT
        - LAST_ACTIVE_VARIANT
        - NO_ACTIVE_VARIANT
        # --- پنل ادمین: حذف دسته، رنگ یا متریالی که محصول دارد (meta.productCount) ---
        - IN_USE
        # --- موجودی و رزرو انبار (فاز سفارش) ---
        - ORDER_ALREADY_SHIPPED
        - RESERVATION_QUANTITY_MISMATCH
        - RESERVATION_NOT_FOUND
        # --- سفارش با مانده‌ی پرداخت بعد از درخواست تغییر (meta.balanceDue) ---
        - BALANCE_DUE
        # --- کار روی سفارش در پنل ---
        - AWAITING_CUSTOMER_FEEDBACK
        - GROUP_NOT_READY
        - PHOTOS_INCOMPLETE
        - REFUND_NOT_FOUND
        - PAYMENT_IN_PROGRESS
      example: DISCOUNT_MIN_SUBTOTAL_NOT_MET

    # ============ MEDIA ============
    MediaAsset:
      type: object
      required: [id, type, url]
      properties:
        id: { type: string, pattern: '^med_[0-9A-Za-z]{22}$', example: 'med_5Hq2xT9aLmQ0vB3nR7sK1w' }
        type: { type: string, enum: [IMAGE, VIDEO] }
        url: { type: string, format: uri, example: 'https://cdn.kiva.ir/p/1/lilac/front.webp' }
        thumbnailUrl: { type: string, format: uri, nullable: true, example: 'https://cdn.kiva.ir/p/1/lilac/front_160.webp' }
        srcSet:
          type: array
          description: نسخه‌های ریسپانسیو برای `srcset`
          items:
            type: object
            properties:
              width: { type: integer, example: 640 }
              url: { type: string, format: uri }
        posterUrl: { type: string, format: uri, nullable: true, description: فریم کاور ویدیو }
        width: { type: integer, example: 1200 }
        height: { type: integer, example: 1224 }
        durationSec: { type: integer, nullable: true, description: طول ویدیو (نمایش «ویدیو ۰:۲۴»), example: 24 }
        mimeType: { type: string, example: image/webp }
        alt: { type: string, nullable: true, example: کیف دوشی ماهک رنگ یاسی — نمای جلو }
        blurhash: { type: string, nullable: true, description: placeholder تار برای لود تدریجی, example: 'LKO2?U%2Tw=w]~RBVZRi};RPxuwH' }

    # ============ CATALOG ENUMS ============
    BagType:
      type: string
      description: |
        فرم کیف (برای آیکن/ایلاستریشن و جدول مشخصات پیش‌فرض):
        `HOBO` دوشی هوبو · `CROSSBODY` کراس‌بادی · `BACKPACK` کوله · `SATCHEL` دستی · `CLUTCH` کلاچ/مجلسی · `TOTE` شاپر/توت · `BUCKET` سطلی · `WALLET` کیف پول
      enum: [HOBO, CROSSBODY, BACKPACK, SATCHEL, CLUTCH, TOTE, BUCKET, WALLET]
      example: HOBO
    Occasion:
      type: string
      description: مناسب برای — `DAILY` روزمره · `UNIVERSITY` دانشگاه · `WORK` محل کار · `FORMAL` رسمی · `PARTY` مهمانی/مجالس · `TRAVEL` سفر · `SHOPPING` خرید · `GATHERING` دورهمی
      enum: [DAILY, UNIVERSITY, WORK, FORMAL, PARTY, TRAVEL, SHOPPING, GATHERING]
    MaterialFamily:
      type: string
      enum: [GENUINE_LEATHER, FAUX_LEATHER, CANVAS, SUEDE, FAUX_SUEDE, SATIN, VELVET, COTTON, OTHER]
    ClosureType:
      type: string
      description: زیپ فلزی، زیپ دوطرفه، زیپ + قفل تزئینی، درب مگنتی، دکمه مگنتی، بند کشی، دکمه فلزی، بدون درب
      enum: [ZIPPER, DOUBLE_ZIPPER, ZIPPER_WITH_DECORATIVE_LOCK, MAGNETIC_FLAP, MAGNETIC_SNAP, DRAWSTRING, METAL_BUTTON, OPEN_TOP]
    StrapType:
      type: string
      enum: [SHOULDER, CROSSBODY, TOP_HANDLE, CHAIN, BACKPACK_STRAPS, WRISTLET, NONE]
    MediaView:
      type: string
      description: زاویه‌ی تصویر — `FRONT` نمای جلو · `SIDE` نمای کنار · `BACK` پشت · `DETAIL` جزئیات · `INTERIOR` داخل کیف · `STYLE` استایل/لایف‌استایل · `ON_MODEL` روی مدل · `SCALE` مقایسه‌ی اندازه
      enum: [FRONT, SIDE, BACK, DETAIL, INTERIOR, STYLE, ON_MODEL, SCALE]
    StockStatus:
      type: string
      enum: [IN_STOCK, LOW_STOCK, OUT_OF_STOCK]
    ProductStatus:
      type: string
      enum: [DRAFT, ACTIVE, ARCHIVED]
    FitItem:
      type: string
      description: "[پیشنهادی] چه چیزهایی داخل کیف جا می‌شود (راهنمای اندازه‌ی تصویری)"
      enum: [PHONE, CARDS, KEYS, SUNGLASSES, MAKEUP_POUCH, WATER_BOTTLE, UMBRELLA, A5_NOTEBOOK, A4_DOCUMENTS, TABLET_11, LAPTOP_14]

    # ============ TAXONOMY ============
    Color:
      type: object
      required: [key, name, hex]
      properties:
        key: { $ref: '#/components/schemas/ColorKey' }
        name: { type: string, example: یاسی }
        hex: { type: string, pattern: '^#[0-9A-Fa-f]{6}$', example: '#C8B6E2' }
        isLight:
          type: boolean
          description: رنگ روشن است → تیک انتخاب روی سواچ تیره نمایش داده شود (سفید، کرم، صورتی، یاسی، طوسی)
          example: true
        sortOrder: { type: integer, example: 4 }
        productCount: { type: integer, nullable: true, description: فقط در `/colors` و facets, example: 7 }
    CategoryRef:
      type: object
      required: [id, slug, name]
      properties:
        id: { type: integer, example: 1 }
        slug: { type: string, example: shoulder }
        name: { type: string, example: کیف دوشی }
    Category:
      allOf:
        - $ref: '#/components/schemas/CategoryRef'
        - type: object
          properties:
            description: { type: string, nullable: true, example: کیف‌های دوشی مینیمال برای استفاده‌ی روزمره }
            icon:
              type: object
              description: ایلاستریشن دسته (در طرح فعلی SVG کارتونی بر اساس فرم و رنگ)
              properties:
                bagType: { $ref: '#/components/schemas/BagType' }
                colorKey: { $ref: '#/components/schemas/ColorKey' }
                imageUrl: { type: string, format: uri, nullable: true, description: اگر آیکن عکس/SVG آپلودی باشد }
            imageUrl: { type: string, format: uri, nullable: true }
            productCount: { type: integer, description: «۲ مدل», example: 2 }
            sortOrder: { type: integer, example: 1 }
            showInMenu: { type: boolean, example: true }
            seo: { $ref: '#/components/schemas/SeoMeta' }
    MaterialRef:
      type: object
      required: [id, slug, name]
      properties:
        id: { type: integer, example: 3 }
        slug: { type: string, example: faux-leather-matte }
        name: { type: string, example: چرم مصنوعی مات درجه یک }
        family: { $ref: '#/components/schemas/MaterialFamily' }
    Material:
      allOf:
        - $ref: '#/components/schemas/MaterialRef'
        - type: object
          properties:
            description: { type: string, nullable: true }
            careInstructions:
              type: array
              items: { type: string }
              example: [با دستمال نرم و کمی مرطوب تمیز شود, از الکل و دستمال مرطوب آرایشی استفاده نشود]
            productCount: { type: integer, example: 4 }

    # ============ PRODUCT BUILDING BLOCKS ============
    PriceInfo:
      type: object
      required: [price, currency]
      properties:
        price:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: قیمت فروش فعلی
          example: 1450000
        compareAtPrice:
          type: integer
          allOf: [{ $ref: '#/components/schemas/Money' }]
          nullable: true
          description: قیمت قبل از تخفیف (خط‌خورده)؛ null یعنی تخفیف ندارد
          example: 1750000
        discountPercent: { type: integer, minimum: 0, maximum: 100, description: 'round((1 - price/compareAtPrice) × 100)', example: 17 }
        discountAmount: { allOf: [{ $ref: '#/components/schemas/Money' }], example: 300000 }
        currency: { $ref: '#/components/schemas/Currency' }
    StockInfo:
      type: object
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/StockStatus' }
        availableQuantity:
          type: integer
          nullable: true
          description: فقط وقتی `LOW_STOCK` است مقدار دارد (موجودی دقیق لو نمی‌رود)
          example: 3
        maxOrderQuantity:
          type: integer
          description: سقف انتخاب تعداد = min(موجودی، سقف خرید هر محصول)
          example: 3
        label: { type: string, example: فقط ۳ عدد در انبار باقی مونده }
    ProductBadge:
      type: object
      required: [code, label]
      properties:
        code:
          type: string
          enum: [NEW, SALE, HAS_VIDEO, FREE_SHIPPING, SOLD_OUT, LOW_STOCK, BESTSELLER, HANDMADE, CAMPAIGN]
        label: { type: string, example: ۱۷٪ تخفیف }
        tone: { $ref: '#/components/schemas/Tone' }
        icon: { type: string, allOf: [{ $ref: '#/components/schemas/IconName' }], nullable: true, example: play }
    RatingBrief:
      type: object
      required: [average, count]
      properties:
        average: { type: number, format: float, minimum: 0, maximum: 5, example: 4.6 }
        count: { type: integer, example: 21 }
    RatingSummary:
      type: object
      required: [average, count, distribution]
      properties:
        average: { type: number, format: float, example: 4.6 }
        count: { type: integer, description: تعداد نظرات تأییدشده, example: 21 }
        distribution:
          type: array
          description: از ۵ ستاره تا ۱ ستاره
          items:
            type: object
            required: [stars, count, percent]
            properties:
              stars: { type: integer, minimum: 1, maximum: 5, example: 5 }
              count: { type: integer, example: 15 }
              percent: { type: number, example: 71.4 }
        verifiedBuyerPercent: { type: integer, nullable: true, description: '[پیشنهادی]', example: 92 }
    ProductColorOption:
      type: object
      description: سواچ رنگ روی کارت و صفحه‌ی محصول؛ با کلیک روی آن عکس کارت عوض می‌شود
      required: [variantId, color, stockStatus]
      properties:
        variantId: { type: integer, example: 101 }
        color: { $ref: '#/components/schemas/Color' }
        stockStatus: { $ref: '#/components/schemas/StockStatus' }
        imageUrl: { type: string, format: uri, example: 'https://cdn.kiva.ir/p/1/lilac/front_640.webp' }
        thumbnailUrl: { type: string, format: uri, example: 'https://cdn.kiva.ir/p/1/lilac/front_160.webp' }
    ProductRef:
      type: object
      required: [id, slug, name]
      properties:
        id: { type: integer, example: 1 }
        slug: { type: string, example: mahak-shoulder-bag }
        sku: { type: string, example: KV-1001 }
        name: { type: string, example: کیف دوشی ماهک }
        imageUrl: { type: string, format: uri }
        colorKey: { type: string, allOf: [{ $ref: '#/components/schemas/ColorKey' }], nullable: true }
    ProductSummary:
      type: object
      description: کارت محصول (گرید فروشگاه، اسکرول افقی خانه، محصولات مشابه، علاقه‌مندی‌ها، سبد خالی)
      required: [id, slug, sku, name, category, price, colors, defaultColorKey, image, stock, badges]
      properties:
        id: { type: integer, example: 1 }
        slug: { type: string, example: mahak-shoulder-bag }
        sku: { type: string, description: کد محصول قابل نمایش, example: KV-1001 }
        name: { type: string, example: کیف دوشی ماهک }
        url: { type: string, example: /product/mahak-shoulder-bag }
        category: { $ref: '#/components/schemas/CategoryRef' }
        bagType: { $ref: '#/components/schemas/BagType' }
        price: { $ref: '#/components/schemas/PriceInfo' }
        colors:
          type: array
          description: همه‌ی رنگ‌ها به ترتیب نمایش (کارت ۵ تای اول + «+n»)
          items: { $ref: '#/components/schemas/ProductColorOption' }
        colorsCount: { type: integer, example: 4 }
        defaultColorKey:
          allOf: [{ $ref: '#/components/schemas/ColorKey' }]
          nullable: true
          description: فقط برای محصول بدون رنگ فعال (پیش‌نویس در پنل) `null` است؛ در فروشگاه هیچ‌وقت `null` نیست
        displayColorKey:
          allOf: [{ $ref: '#/components/schemas/ColorKey' }]
          nullable: true
          description: |
            رنگی که عکس کارت با آن نمایش داده شود (اگر فیلتر رنگ فعال باشد = اولین رنگ منطبق).
            فقط برای محصول بدون رنگ فعال (پیش‌نویس در پنل) `null` است؛ در فروشگاه هیچ‌وقت `null` نیست
        image:
          allOf: [{ $ref: '#/components/schemas/MediaAsset' }]
          nullable: true
          description: عکس کارت (همیشه فرستاده می‌شود)؛ تا وقتی عکسی آپلود نشده `null` است و کلاینت ایلاستریشن کیف را نشان می‌دهد
        hoverImage:
          type: object
          allOf: [{ $ref: '#/components/schemas/MediaAsset' }]
          nullable: true
          description: "[پیشنهادی] تصویر دوم برای hover کارت"
        badges:
          type: array
          items: { $ref: '#/components/schemas/ProductBadge' }
        stock: { $ref: '#/components/schemas/StockInfo' }
        isNew: { type: boolean, example: true }
        hasVideo: { type: boolean, example: true }
        rating: { $ref: '#/components/schemas/RatingBrief' }
        soldCount: { type: integer, description: «۱۸۴ فروش موفق», example: 184 }
        freeShippingEligible: { type: boolean, description: قیمت ≥ آستانه‌ی ارسال رایگان, example: false }
        isWishlisted: { type: boolean, nullable: true, description: null برای کاربر مهمان }
    ProductMedia:
      allOf:
        - $ref: '#/components/schemas/MediaAsset'
        - type: object
          properties:
            view: { allOf: [{ $ref: '#/components/schemas/MediaView' }], nullable: true }
            viewLabel: { type: string, nullable: true, example: نمای جلو }
            sortOrder: { type: integer, example: 0 }
            isPrimary: { type: boolean, example: true }
            isUnedited: { type: boolean, description: «عکس واقعی، بدون ادیت», default: true }
    ProductVariant:
      type: object
      description: هر رنگ یک ورینت با SKU، قیمت، موجودی و گالری اختصاصی خودش
      required: [id, sku, color, price, stock, media]
      properties:
        id: { type: integer, example: 101 }
        sku: { type: string, example: KV-1001-LILAC }
        color: { $ref: '#/components/schemas/Color' }
        isDefault: { type: boolean, example: false }
        price: { $ref: '#/components/schemas/PriceInfo' }
        stock: { $ref: '#/components/schemas/StockInfo' }
        media:
          type: array
          description: گالری این رنگ به ترتیب (thumbnailها + عکس اصلی). ویدیوها هم با `type = VIDEO` در همین لیست هستند.
          items: { $ref: '#/components/schemas/ProductMedia' }
        hasVideo: { type: boolean, example: true }
        stockAlertSubscribed: { type: boolean, nullable: true, description: برای کاربر واردشده و ورینت ناموجود }
    ProductDimensions:
      type: object
      description: ابعاد (طول × ارتفاع × عرض) به سانتی‌متر
      required: [lengthCm, heightCm, widthCm]
      properties:
        lengthCm: { type: number, example: 34 }
        heightCm: { type: number, example: 26 }
        widthCm: { type: number, example: 12 }
    StrapInfo:
      type: object
      properties:
        type: { $ref: '#/components/schemas/StrapType' }
        label: { type: string, example: بند دوشی ثابت ۵۵ سانتی‌متر }
        lengthCm: { type: number, nullable: true, example: 55 }
        minLengthCm: { type: number, nullable: true }
        maxLengthCm: { type: number, nullable: true, example: 120 }
        adjustable: { type: boolean, example: false }
        detachable: { type: boolean, example: false }
        material: { type: string, nullable: true, example: زنجیر فلزی طلایی }
    PocketInfo:
      type: object
      properties:
        internal: { type: integer, example: 1 }
        internalZip: { type: integer, example: 1 }
        external: { type: integer, example: 0 }
        phone: { type: integer, example: 2 }
        cardSlots: { type: integer, example: 0 }
        billSlots: { type: integer, example: 0 }
        coinPocket: { type: boolean, example: false }
        detachablePouch: { type: boolean, example: false }
        laptopSleeve: { type: boolean, example: false }
        summary: { type: string, example: '۱ جیب زیپ‌دار داخلی، ۲ جیب موبایل' }
    ProductSpecs:
      type: object
      description: مشخصات ساختاریافته (برای فیلتر، مقایسه و SEO). نسخه‌ی آماده‌ی نمایش در `specTable` است.
      properties:
        dimensions: { allOf: [{ $ref: '#/components/schemas/ProductDimensions' }], nullable: true }
        weightGrams: { type: integer, nullable: true, example: 650 }
        closure:
          type: object
          nullable: true
          properties:
            type: { $ref: '#/components/schemas/ClosureType' }
            label: { type: string, example: زیپ فلزی }
        straps:
          type: array
          nullable: true
          items: { $ref: '#/components/schemas/StrapInfo' }
        pockets: { allOf: [{ $ref: '#/components/schemas/PocketInfo' }], nullable: true }
        laptopMaxInch: { type: number, nullable: true, description: جای لپ‌تاپ تا (اینچ), example: 14 }
        capacityLiters: { type: number, nullable: true, description: '[پیشنهادی] حجم', example: 9.5 }
        waterproof: { type: boolean, example: false }
        occasions:
          type: array
          items:
            type: object
            properties:
              code: { $ref: '#/components/schemas/Occasion' }
              label: { type: string, example: دانشگاه }
        fits:
          type: array
          description: '[پیشنهادی] راهنمای «چی توش جا می‌شه؟»'
          items: { $ref: '#/components/schemas/FitItem' }
        lining:
          type: object
          nullable: true
          properties:
            material: { type: string, example: آستر ضدلک }
            color: { type: string, example: یاسی کیوا }
        hardware:
          type: object
          nullable: true
          properties:
            material: { type: string, example: فلز ضدزنگ }
            finish: { type: string, example: طلایی مات }
        stitching: { type: string, nullable: true, example: دوخت دولایه و لبه‌دوزی دستی }
        handmade: { type: boolean, example: false }
        madeIn: { type: string, example: ایران }
        careInstructions:
          type: array
          items: { type: string }
        warranty:
          type: object
          nullable: true
          description: '[پیشنهادی] ضمانت دوخت/یراق'
          properties:
            months: { type: integer, example: 6 }
            description: { type: string, example: ضمانت ۶ ماهه‌ی دوخت و یراق‌آلات }
    SpecRow:
      type: object
      description: یک ردیف جدول تب «مشخصات» به ترتیب نمایش (جنس، ابعاد، وزن، نوع بسته شدن، بند و دسته، جیب‌ها، رنگ‌های موجود، مناسب برای، دسته‌بندی، کد محصول، موجودی انبار)
      required: [key, label, value]
      properties:
        key:
          type: string
          enum: [MATERIAL, DIMENSIONS, WEIGHT, CLOSURE, STRAP, POCKETS, COLORS, OCCASIONS, CATEGORY, SKU, STOCK, LAPTOP, WATERPROOF, LINING, HARDWARE, MADE_IN, WARRANTY]
        label: { type: string, example: ابعاد (طول × ارتفاع × عرض) }
        value: { type: string, example: ۳۴ × ۲۶ × ۱۲ سانتی‌متر }
        swatches:
          type: array
          nullable: true
          description: فقط برای ردیف رنگ‌ها
          items: { $ref: '#/components/schemas/Color' }
        tone: { type: string, allOf: [{ $ref: '#/components/schemas/Tone' }], nullable: true, description: 'مثلاً DANGER برای «فقط ۳ عدد باقی مانده»' }
    Breadcrumb:
      type: object
      required: [label]
      properties:
        label: { type: string, example: کیف دوشی }
        url: { type: string, nullable: true, example: '/products?category=shoulder' }
    SeoMeta:
      type: object
      properties:
        title: { type: string, example: کیف دوشی ماهک | کیوا }
        description: { type: string, nullable: true, maxLength: 170 }
        canonicalUrl: { type: string, format: uri, example: 'https://kiva.ir/product/mahak-shoulder-bag' }
        ogImageUrl: { type: string, format: uri }
        noIndex: { type: boolean, default: false }
        jsonLd:
          type: object
          description: داده‌ی ساختاریافته‌ی schema.org (Product/Offer/AggregateRating یا Article)
          additionalProperties: true
    Perk:
      type: object
      properties:
        icon: { $ref: '#/components/schemas/IconName' }
        title: { type: string, example: رزرو ۴ روزه }
        subtitle: { type: string, example: یکجا تحویل بگیر }
    ProductPolicies:
      type: object
      properties:
        returnable: { type: boolean, example: true }
        returnWindowDays: { type: integer, example: 7 }
        reservable: { type: boolean, example: true }
        reservationDays: { type: integer, example: 4 }
        preShipmentPhoto: { type: boolean, description: امضای کیوا, example: true }
        maxPerOrder: { type: integer, example: 5 }
    ProductDetail:
      description: صفحه‌ی جزئیات محصول
      allOf:
        - $ref: '#/components/schemas/ProductSummary'
        - type: object
          required: [variants, specTable, breadcrumbs, ratingSummary]
          properties:
            selectedColorKey:
              allOf: [{ $ref: '#/components/schemas/ColorKey' }]
              description: رنگ انتخاب‌شده (از `?color=` یا پیش‌فرض)
            shortDescription: { type: string, nullable: true }
            description:
              allOf: [{ $ref: '#/components/schemas/HtmlString' }]
              nullable: true
              description: متن تب «توضیحات»
              example: '<p>کیف دوشی ماهک با چرم مصنوعی مات درجه یک، دوخت دقیق و یراق‌آلات مقاوم...</p>'
            highlights:
              type: array
              description: بولت‌های «چرا ماهک؟»
              items: { type: string }
              example: [چرم مصنوعی مات درجه یک با دوخت دولایه و لبه‌دوزی دستی, یراق‌آلات فلزی ضدزنگ با روکش طلایی مات, آستر داخلی ضدلک با رنگ یاسی کیوا]
            material: { $ref: '#/components/schemas/MaterialRef' }
            materialDescription: { type: string, nullable: true, example: چرم مصنوعی مات درجه یک }
            specs: { $ref: '#/components/schemas/ProductSpecs' }
            specTable:
              type: array
              items: { $ref: '#/components/schemas/SpecRow' }
            variants:
              type: array
              items: { $ref: '#/components/schemas/ProductVariant' }
            breadcrumbs:
              type: array
              items: { $ref: '#/components/schemas/Breadcrumb' }
              example:
                - { label: خانه, url: / }
                - { label: فروشگاه, url: /products }
                - { label: کیف دوشی, url: '/products?category=shoulder' }
                - { label: کیف دوشی ماهک, url: null }
            ratingSummary: { $ref: '#/components/schemas/RatingSummary' }
            policies: { $ref: '#/components/schemas/ProductPolicies' }
            perks:
              type: array
              description: «ارسال سریع / رزرو ۴ روزه / ۷ روز بازگشت»
              items: { $ref: '#/components/schemas/Perk' }
            tags:
              type: array
              items: { type: string }
              example: [مینیمال, روزمره]
            campaign:
              type: object
              nullable: true
              description: '[پیشنهادی] اگر محصول در کمپین فعال است (برای شمارنده روی صفحه‌ی محصول)'
              properties:
                slug: { type: string }
                title: { type: string }
                endsAt: { type: string, format: date-time }
            stockAlert:
              type: object
              nullable: true
              properties:
                subscribed: { type: boolean }
                alertId: { type: integer, nullable: true }
            shareUrl: { type: string, format: uri, description: 'همان `seo.canonicalUrl` (مسیر `product/{slug}`)', example: 'https://kiva.ir/product/mahak-shoulder-bag' }
            seo: { $ref: '#/components/schemas/SeoMeta' }
            publishedAt: { type: string, format: date-time, nullable: true }
            updatedAt: { type: string, format: date-time }

    # ============ LISTING ============
    AppliedFilter:
      type: object
      description: چیپ فیلتر فعال (با کلیک حذف می‌شود)
      required: [key, label]
      properties:
        key: { type: string, enum: [q, category, color, price, onSale, inStock, isNew, hasVideo, bagType, material, occasion, campaign] }
        value: { type: string, nullable: true, example: lilac }
        label: { type: string, example: یاسی }
        swatchHex: { type: string, nullable: true, example: '#C8B6E2' }
    FacetOption:
      type: object
      required: [value, label, count]
      properties:
        value: { type: string, example: shoulder }
        label: { type: string, example: کیف دوشی }
        count: { type: integer, example: 2 }
        selected: { type: boolean, example: false }
        hex: { type: string, nullable: true, description: فقط برای رنگ‌ها }
    ProductFacets:
      type: object
      properties:
        categories:
          type: array
          items: { $ref: '#/components/schemas/FacetOption' }
        colors:
          type: array
          items: { $ref: '#/components/schemas/FacetOption' }
        materials:
          type: array
          items: { $ref: '#/components/schemas/FacetOption' }
        bagTypes:
          type: array
          items: { $ref: '#/components/schemas/FacetOption' }
        price:
          type: object
          nullable: true
          description: null وقتی هیچ محصولی با فیلترها جور نیست
          required: [min, max, step]
          properties:
            min: { allOf: [{ $ref: '#/components/schemas/Money' }], description: کمترین قیمت فعلی (گرد به پایین), example: 590000 }
            max: { allOf: [{ $ref: '#/components/schemas/Money' }], description: بیشترین قیمت فعلی (گرد به بالا), example: 3150000 }
            step: { type: integer, example: 10000 }
        onSaleCount: { type: integer, example: 6 }
        inStockCount: { type: integer, example: 14 }
        newCount: { type: integer, example: 6 }
        withVideoCount: { type: integer, example: 10 }
    ProductListResponse:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ProductSummary' }
        meta: { $ref: '#/components/schemas/PageMeta' }
        title: { type: string, description: «کیف دوشی» / «تخفیف‌خورده‌ها» / «فروشگاه کیوا», example: فروشگاه کیوا }
        subtitle: { type: string, nullable: true }
        breadcrumbs:
          type: array
          items: { $ref: '#/components/schemas/Breadcrumb' }
        appliedFilters:
          type: array
          items: { $ref: '#/components/schemas/AppliedFilter' }
        sort: { type: string, example: newest }
        facets:
          type: object
          allOf: [{ $ref: '#/components/schemas/ProductFacets' }]
          nullable: true

    # ============ STOCK ALERT / INQUIRY ============
    CreateStockAlertRequest:
      type: object
      properties:
        variantId: { type: integer, nullable: true, example: 501 }
        phone:
          allOf: [{ $ref: '#/components/schemas/PhoneNumber' }]
          description: برای کاربر مهمان الزامی
        channel: { type: string, enum: [SMS], default: SMS }
    StockAlert:
      type: object
      properties:
        id: { type: integer, example: 77 }
        product: { $ref: '#/components/schemas/ProductRef' }
        variantId: { type: integer, nullable: true }
        color: { type: object, allOf: [{ $ref: '#/components/schemas/Color' }], nullable: true }
        channel: { type: string, enum: [SMS] }
        phoneMasked: { type: string, example: '0912***6789' }
        status: { type: string, enum: [ACTIVE, NOTIFIED, CANCELLED] }
        createdAt: { type: string, format: date-time }
        notifiedAt: { type: string, format: date-time, nullable: true }
        message: { type: string, example: هر وقت موجود شد، بهت پیامک می‌دیم }
    MessengerLink:
      type: object
      required: [channel, name, url]
      properties:
        channel: { $ref: '#/components/schemas/SocialChannel' }
        name: { type: string, example: روبیکا }
        url: { type: string, format: uri, example: 'https://rubika.ir/kiva_shop?text=...' }
        handle: { type: string, example: '@kiva_shop' }
        responseHours: { type: string, example: پاسخگویی ۹ تا ۲۱ }
    ProductInquiry:
      type: object
      properties:
        productCode: { type: string, example: KV-1001 }
        productName: { type: string, example: کیف دوشی ماهک }
        colorName: { type: string, example: یاسی }
        prefilledText: { type: string, example: 'سلام، درباره «کیف دوشی ماهک» رنگ یاسی (کد KV-1001) سؤال دارم. می‌شه عکس/ویدیوی بیشتری بفرستید؟' }
        channels:
          type: array
          items: { $ref: '#/components/schemas/MessengerLink' }

    # ============ REVIEWS ============
    ReviewStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED]
    ReviewReply:
      type: object
      properties:
        text: { type: string, example: سمیرا جان ممنون از انرژی خوبت، مبارکت باشه. }
        authorName: { type: string, example: کیوا }
        createdAt: { type: string, format: date-time }
    Review:
      type: object
      required: [id, productId, authorName, rating, text, createdAt, status]
      properties:
        id: { type: integer, example: 5531 }
        productId: { type: integer, example: 1 }
        product:
          allOf: [{ $ref: '#/components/schemas/ProductRef' }]
          description: فقط در «نظرات من»
        authorName: { type: string, example: سمیرا }
        authorInitial: { type: string, example: س }
        rating: { type: integer, minimum: 1, maximum: 5, example: 5 }
        title: { type: string, nullable: true, description: '[پیشنهادی]' }
        text: { type: string, example: کیفیت دوخت و چرمش عالیه. عکسی که قبل از ارسال فرستادن دقیقاً همونی بود که رسید. }
        createdAt: { type: string, format: date-time }
        status: { $ref: '#/components/schemas/ReviewStatus' }
        statusLabel: { type: string, example: در انتظار تأیید }
        rejectionReason: { type: string, nullable: true }
        isVerifiedBuyer: { type: boolean, description: تگ «خریدار», example: true }
        purchasedColor: { type: object, allOf: [{ $ref: '#/components/schemas/Color' }], nullable: true }
        reply: { type: object, allOf: [{ $ref: '#/components/schemas/ReviewReply' }], nullable: true }
        helpfulCount: { type: integer, example: 4 }
        myHelpfulVote: { type: boolean, nullable: true }
        media:
          type: array
          description: '[پیشنهادی] عکس‌های مشتری'
          items: { $ref: '#/components/schemas/MediaAsset' }
        isMine: { type: boolean, example: false }
    CreateReviewRequest:
      type: object
      required: [rating, text]
      properties:
        rating: { type: integer, minimum: 1, maximum: 5, default: 5 }
        authorName: { type: string, maxLength: 40, description: 'خالی = «کاربر کیوا»', example: سارا }
        contact:
          type: string
          description: موبایل یا ایمیل (در طرح فرم هست؛ برای کاربر واردشده پیش‌فرض موبایل حساب)
          example: '09123456789'
        text: { type: string, minLength: 10, maxLength: 1000, example: از کیفیت، رنگ و اندازه‌اش خیلی راضی‌ام. }
        orderCode: { type: string, allOf: [{ $ref: '#/components/schemas/OrderCode' }], nullable: true, description: 'همراه `orderItemId`؛ شماره‌ی ردیف فقط داخل سفارش خودش یکتاست' }
        orderItemId: { type: integer, nullable: true, description: 'اتصال به خرید → تگ «خریدار» (همراه `orderCode`؛ مثل `ReviewablePurchase`)' }
        mediaIds:
          type: array
          maxItems: 5
          description: '[پیشنهادی] از `POST /me/uploads`'
          items: { type: string }
    UpdateReviewRequest:
      type: object
      properties:
        rating: { type: integer, minimum: 1, maximum: 5 }
        authorName: { type: string, maxLength: 40 }
        text: { type: string, minLength: 10, maxLength: 1000 }
    ReviewListResponse:
      type: object
      required: [summary, items, meta]
      properties:
        summary: { $ref: '#/components/schemas/RatingSummary' }
        items:
          type: array
          items: { $ref: '#/components/schemas/Review' }
        meta: { $ref: '#/components/schemas/PageMeta' }
    MyReviewListResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Review' }
        meta: { $ref: '#/components/schemas/PageMeta' }
        counts:
          type: object
          properties:
            total: { type: integer, example: 3 }
            pending: { type: integer, example: 1 }
            approved: { type: integer, example: 2 }
    ReviewablePurchase:
      type: object
      properties:
        orderCode: { $ref: '#/components/schemas/OrderCode' }
        orderItemId: { type: integer }
        product: { $ref: '#/components/schemas/ProductRef' }
        color: { $ref: '#/components/schemas/Color' }
        deliveredAt: { type: string, format: date-time }

    # ============ SEARCH ============
    SearchSuggestProduct:
      type: object
      properties:
        id: { type: integer, example: 2 }
        slug: { type: string, example: nila-crossbody }
        name: { type: string, example: کراس‌بادی نیلا }
        nameHighlighted: { type: string, example: '<mark>کراس</mark>‌بادی نیلا' }
        categoryName: { type: string, example: کراس‌بادی }
        price: { $ref: '#/components/schemas/PriceInfo' }
        matchedColorKey: { type: string, allOf: [{ $ref: '#/components/schemas/ColorKey' }], nullable: true, example: black }
        imageUrl: { type: string, format: uri }
        url: { type: string, example: '/product/nila-crossbody?color=black' }
    SearchSuggestResponse:
      type: object
      properties:
        query: { type: string, example: کراس مشکي }
        normalizedQuery: { type: string, example: کراس مشکی }
        products:
          type: array
          items: { $ref: '#/components/schemas/SearchSuggestProduct' }
        categories:
          type: array
          items: { $ref: '#/components/schemas/CategoryRef' }
        colors:
          type: array
          items: { $ref: '#/components/schemas/Color' }
        totalProducts: { type: integer, example: 2 }
        seeAllUrl: { type: string, example: '/products?q=کراس%20مشکی' }
    SearchHints:
      type: object
      properties:
        categories:
          type: array
          items: { $ref: '#/components/schemas/CategoryRef' }
        colors:
          type: array
          items: { $ref: '#/components/schemas/Color' }
        popularQueries:
          type: array
          items: { type: string }
          example: [کیف مجلسی, کوله دانشگاه, کراس‌بادی مشکی]

    # ============ CHANNELS / METHODS ============
    PhotoMessengerChannel:
      type: string
      description: پیام‌رسان‌های قابل انتخاب برای «عکس قبل از ارسال»
      enum: [RUBIKA, TELEGRAM, BALE]
      example: TELEGRAM
    SocialChannel:
      type: string
      enum: [RUBIKA, TELEGRAM, BALE, INSTAGRAM]
    ShippingMethodCode:
      type: string
      description: "`TIPAX` تیپاکس (۱ تا ۲ روز کاری) · `POST` پست معمولی (۳ تا ۵ روز کاری) · `COURIER` پیک درون‌شهری [پیشنهادی]"
      enum: [TIPAX, POST, COURIER]
      example: POST
    PaymentGatewayCode:
      type: string
      enum: [ZARINPAL, SAMAN, MELLAT]
      example: ZARINPAL
    MessengerOption:
      type: object
      required: [channel, name]
      properties:
        channel: { $ref: '#/components/schemas/PhotoMessengerChannel' }
        name: { type: string, example: تلگرام }
        hint: { type: string, example: با آیدی یا شماره }
        iconUrl: { type: string, format: uri, nullable: true }
        enabled: { type: boolean, example: true }
    ShippingOptionQuote:
      type: object
      required: [method, name, cost, isFree, available]
      properties:
        method: { $ref: '#/components/schemas/ShippingMethodCode' }
        name: { type: string, example: پست معمولی }
        description: { type: string, description: 'ساخته‌شده از `estimatedDelivery.minDays` و `maxDays`', example: تحویل ۳ تا ۵ روز کاری }
        icon: { $ref: '#/components/schemas/IconName' }
        baseCost: { allOf: [{ $ref: '#/components/schemas/Money' }], description: قیمت پایه (برای نمایش خط‌خورده وقتی رایگان است), example: 75000 }
        cost: { allOf: [{ $ref: '#/components/schemas/Money' }], example: 0 }
        isFree: { type: boolean, example: true }
        freeReason:
          type: string
          nullable: true
          enum: [THRESHOLD, RESERVATION_CONSOLIDATION, PROMO, null]
          example: THRESHOLD
        estimatedDelivery:
          type: object
          properties:
            minDays: { type: integer, example: 3 }
            maxDays: { type: integer, example: 5 }
            fromDate: { type: string, format: date, example: '2026-10-08' }
            toDate: { type: string, format: date, example: '2026-10-11' }
        available: { type: boolean, example: true }
        unavailableReason: { type: string, nullable: true }
        selected: { type: boolean, example: true }

    # ============ CART ============
    CartItem:
      type: object
      required: [id, productId, variantId, product, color, quantity, unitPrice, lineTotal, stock, purchasable]
      properties:
        id: { type: string, example: 'ci_8d2f1a' }
        productId: { type: integer, example: 2 }
        variantId: { type: integer, example: 205 }
        product:
          type: object
          properties:
            id: { type: integer, example: 2 }
            slug: { type: string, example: nila-crossbody }
            sku: { type: string, example: KV-1002 }
            name: { type: string, example: کراس‌بادی نیلا }
            category: { $ref: '#/components/schemas/CategoryRef' }
            url: { type: string, example: '/product/nila-crossbody?color=olive' }
        color: { $ref: '#/components/schemas/Color' }
        image:
          type: object
          allOf: [{ $ref: '#/components/schemas/MediaAsset' }]
          nullable: true
          description: عکس رنگ ردیف (همیشه فرستاده می‌شود)؛ تا وقتی عکسی آپلود نشده `null` است، مثل `ProductSummary.image`
        quantity: { type: integer, minimum: 1, example: 1 }
        maxQuantity:
          type: integer
          description: |
            سقف دکمه‌ی + = min(موجودی این رنگ، `maxPerOrder` محصول − تعداد بقیه‌ی رنگ‌های همان محصول در سبد، ۲۰).
            سقف خرید مال محصول است و بین رنگ‌هایش تقسیم می‌شود؛ ردیف غیرقابل خرید هم سهمش را نگه می‌دارد، تا برگشتنش رنگی را که مشتری دارد می‌خرد کم نکند.
            هیچ ردیفی بیشتر از ۲۰ عدد ندارد (افزودن ۱۵ و بعد ۱۰ با `QUANTITY_REDUCED` روی ۲۰ می‌ماند).
            هیچ‌وقت از `maxPerOrder` بیشتر نیست، پس موجودی دقیق را لو نمی‌دهد. برای ردیف غیرقابل خرید `0`.
          example: 5
        purchasable:
          type: boolean
          description: |
            این ردیف الان قابل خرید است (محصول و رنگ در فروشگاه‌اند و موجودی دارند). ردیف غیرقابل خرید در سبد می‌ماند تا مشتری ببیند یا حذفش کند،
            ولی در جمع‌های پول (`totals` به‌جز `itemsCount` و `linesCount`) حساب نمی‌شود و تا وقتی در سبد است `POST /orders` رد می‌شود.
          example: true
        unitPrice: { allOf: [{ $ref: '#/components/schemas/Money' }], example: 1450000 }
        unitCompareAtPrice: { type: integer, allOf: [{ $ref: '#/components/schemas/Money' }], nullable: true, example: 1750000 }
        lineTotal: { allOf: [{ $ref: '#/components/schemas/Money' }], example: 1450000 }
        lineCompareAtTotal: { type: integer, allOf: [{ $ref: '#/components/schemas/Money' }], nullable: true, example: 1750000 }
        lineDiscount: { allOf: [{ $ref: '#/components/schemas/Money' }], example: 300000 }
        stock: { $ref: '#/components/schemas/StockInfo' }
        isWishlisted: { type: boolean, nullable: true }
        addedAt: { type: string, format: date-time }
    CartIssue:
      type: object
      description: |
        مشکلاتی که از آخرین مشاهده‌ی سبد پیش آمده (نمایش نوار هشدار). هر کدام فقط یک بار می‌آید.
        `QUANTITY_REDUCED` با `currentValue = 0` یعنی ردیف حذف شد: سقف خرید محصول (بعد از کم شدن سقف یا ادغام سبد) جایی برایش نگذاشت؛
        `itemId` شناسه‌ی همان ردیفی است که دیگر در سبد نیست.
        `DISCOUNT_REMOVED`: کد تخفیف سبد دیگر معتبر نیست (منقضی شد، ظرفیتش پر شد، یا سبد دیگر شرطش را ندارد) و برداشته شد؛ `itemId` نال است و پیام کد را نام می‌برد.
      required: [code, message]
      properties:
        code:
          type: string
          enum: [OUT_OF_STOCK, QUANTITY_REDUCED, PRICE_INCREASED, PRICE_DECREASED, VARIANT_UNAVAILABLE, DISCOUNT_REMOVED, SHIPPING_METHOD_CHANGED]
        itemId: { type: string, nullable: true }
        message: { type: string, example: قیمت «کیف دستی آیدا» از آخرین بازدیدت تغییر کرده. }
        previousValue: { type: integer, nullable: true, example: 3290000 }
        currentValue: { type: integer, nullable: true, example: 2790000 }
    CartTotals:
      type: object
      description: |
        `itemsCompareAtTotal` قیمت کالاها ← `productDiscount` تخفیف محصولات ← `subtotal` ←
        `codeDiscount` کد تخفیف ← `shippingCost` ارسال ← `payable` مبلغ قابل پرداخت

        همه‌ی مبلغ‌ها فقط از ردیف‌های قابل خرید (`CartItem.purchasable = true`) حساب می‌شوند. سبدی که ردیف قابل خرید ندارد همه‌ی مبلغ‌هایش ۰ است
        و `shippingIsFree = false`. `itemsCount` و `linesCount` همه‌ی ردیف‌ها را می‌شمرند، چون بج سبد همان چیزی را نشان می‌دهد که در سبد دیده می‌شود.
      required: [itemsCount, itemsCompareAtTotal, productDiscount, subtotal, codeDiscount, shippingCost, payable, currency]
      properties:
        itemsCount: { type: integer, description: جمع تعداد همه‌ی ردیف‌ها (بج سبد), example: 2 }
        linesCount: { type: integer, description: تعداد همه‌ی ردیف‌ها, example: 2 }
        itemsCompareAtTotal: { allOf: [{ $ref: '#/components/schemas/Money' }], description: «قیمت کالاها» (جمع قیمت‌های قبل از تخفیف), example: 4080000 }
        productDiscount: { allOf: [{ $ref: '#/components/schemas/Money' }], description: «تخفیف محصولات», example: 600000 }
        subtotal: { allOf: [{ $ref: '#/components/schemas/Money' }], description: جمع سبد بعد از تخفیف محصولات (مبنای کد تخفیف و ارسال رایگان), example: 3480000 }
        codeDiscount: { allOf: [{ $ref: '#/components/schemas/Money' }], example: 0 }
        shippingCost: { allOf: [{ $ref: '#/components/schemas/Money' }], example: 0 }
        shippingIsFree: { type: boolean, example: true }
        payable: { allOf: [{ $ref: '#/components/schemas/Money' }], description: «مبلغ قابل پرداخت», example: 3480000 }
        totalSavings: { allOf: [{ $ref: '#/components/schemas/Money' }], description: «۶۰۰٬۰۰۰ تومان صرفه‌جویی کردی!» = productDiscount + codeDiscount, example: 600000 }
        currency: { $ref: '#/components/schemas/Currency' }
    FreeShippingProgress:
      type: object
      properties:
        threshold: { allOf: [{ $ref: '#/components/schemas/Money' }], example: 3000000 }
        method: { $ref: '#/components/schemas/ShippingMethodCode' }
        eligible: { type: boolean, example: false }
        remaining: { allOf: [{ $ref: '#/components/schemas/Money' }], description: «فقط ۱٬۵۵۰٬۰۰۰ تومان تا ارسال رایگان با پست», example: 1550000 }
        progressPercent:
          type: number
          description: '`subtotal` نسبت به `threshold`، با یک رقم اعشار (نیمه به بالا). `100` فقط وقتی `eligible`: تا وقتی حتی ۱ تومان مانده، حداکثر `99.9`'
          example: 48.3
        message: { type: string, example: فقط ۱٬۵۵۰٬۰۰۰ تومان تا ارسال رایگان با پست }
    AppliedDiscount:
      type: object
      properties:
        code: { type: string, example: KIVA10 }
        label: { type: string, example: ۱۰٪ تخفیف روی کل سبد }
        type: { type: string, enum: [PERCENT, FIXED] }
        value: { type: integer, example: 10 }
        amount: { allOf: [{ $ref: '#/components/schemas/Money' }], description: مبلغی که کد از همین سبد کم می‌کند (همان `totals.codeDiscount`), example: 348000 }
    CartReservation:
      type: object
      description: وضعیت سوییچ «رزرو ۴ روزه» در سبد/تسویه
      properties:
        available: { type: boolean, example: true }
        unavailableReason:
          type: string
          nullable: true
          description: |
            فقط وقتی `available = false`:
            `HAS_ACTIVE_RESERVATION` کاربر رزرو فعال دارد (خرید به همان آدرس خودکار ادغام می‌شود؛ `consolidation` را ببینید) ·
            `ITEM_NOT_RESERVABLE` حداقل یک کالای سبد قابل رزرو نیست · `RESERVATION_DISABLED` رزرو در تنظیمات سایت خاموش است
          enum: [HAS_ACTIVE_RESERVATION, ITEM_NOT_RESERVABLE, RESERVATION_DISABLED, null]
          example: null
        enabled: { type: boolean, example: false }
        holdDays: { type: integer, example: 4 }
        shipAfterDate: { type: string, format: date, description: «ارسال بعد از سه‌شنبه ۱۵ مهر», example: '2026-10-09' }
        timeline:
          type: array
          description: |
            سه کارت تایم‌لاین رزرو، با تاریخ شمسی تهران: «امروز، ۲۰ مهر» · «تا {روز هفته} {روز} {ماه}» (همان `shipAfterDate`) · «بعد از ۴ روز».
            وقتی رزرو در تنظیمات سایت خاموش است (`RESERVATION_DISABLED`) خالی است
          items:
            type: object
            properties:
              title: { type: string, example: تا جمعه ۱۸ مهر }
              text: { type: string, example: هر محصول دیگه‌ای خواستی به همین سفارش اضافه کن }
    ReservationConsolidation:
      type: object
      description: کاربر رزرو فعال دارد؛ این سفارش به گروه ارسال آن می‌پیوندد و هزینه‌ی ارسال ندارد
      properties:
        reservedOrderCode: { $ref: '#/components/schemas/OrderCode' }
        expiresAt: { type: string, format: date-time }
        addressId: { type: integer, description: 'فقط ارسال به همین آدرس ادغام می‌شود، و فقط اگر از شروع رزرو ویرایش نشده باشد' }
        shippingWaived: { type: boolean, example: true }
        shippingMethod:
          allOf: [{ $ref: '#/components/schemas/ShippingMethodCode' }]
          description: روش ارسال گروه (همان روش سفارش اصلی)؛ برای سفارش پیوسته قابل انتخاب نیست
        message: { type: string, example: این خرید به سفارش رزروی KV-218340 اضافه می‌شه و هزینه ارسال نداره. }
    Cart:
      type: object
      required: [id, items, totals, shippingMethod, shippingOptions, reservation]
      properties:
        id: { type: string, example: 'cart_3Fq8' }
        isGuest: { type: boolean, example: true }
        items:
          type: array
          description: به ترتیب افزودن، قدیمی‌ترین اول
          items: { $ref: '#/components/schemas/CartItem' }
        totals: { $ref: '#/components/schemas/CartTotals' }
        shippingMethod:
          allOf: [{ $ref: '#/components/schemas/ShippingMethodCode' }]
          description: روش ارسال انتخاب‌شده. سبد تازه با روش پیش‌فرض فروشگاه (`POST`) شروع می‌شود؛ اگر روش انتخاب‌شده غیرفعال شود، به همان برمی‌گردد (`SHIPPING_METHOD_CHANGED`).
        shippingOptions:
          type: array
          items: { $ref: '#/components/schemas/ShippingOptionQuote' }
        freeShipping:
          type: object
          allOf: [{ $ref: '#/components/schemas/FreeShippingProgress' }]
          nullable: true
          description: نوار «تا ارسال رایگان». `null` وقتی فروشگاه هیچ روش ارسال فعالی با ارسال رایگان ندارد
        reservation: { $ref: '#/components/schemas/CartReservation' }
        consolidation: { type: object, allOf: [{ $ref: '#/components/schemas/ReservationConsolidation' }], nullable: true, description: 'برای آدرس پیش‌فرض کاربر (سبد آدرس ندارد)؛ برای مهمان همیشه `null`' }
        discount: { type: object, allOf: [{ $ref: '#/components/schemas/AppliedDiscount' }], nullable: true }
        issues:
          type: array
          items: { $ref: '#/components/schemas/CartIssue' }
        checkoutRequiresLogin: { type: boolean, description: «برای پرداخت، با شماره موبایل وارد می‌شی», example: true }
        updatedAt: { type: string, format: date-time }
    CartMutationResponse:
      type: object
      required: [cart]
      properties:
        cart: { $ref: '#/components/schemas/Cart' }
        affectedItemId: { type: string, nullable: true, example: 'ci_8d2f1a' }
        removedItem:
          type: object
          nullable: true
          description: برای دکمه‌ی «برگردون»
          properties:
            variantId: { type: integer, example: 205 }
            quantity: { type: integer, example: 1 }
            name: { type: string, example: کراس‌بادی نیلا }
        message:
          type: string
          nullable: true
          description: تُست بعد از افزودن («… (۱ عدد) به سبد اضافه شد») یا حذف («… از سبد حذف شد»)؛ `null` برای تغییر ردیف، و برای افزودنی که ردیف جای بیشتری نداشت (`issues` دلیلش را می‌گوید)
          example: کراس‌بادی نیلا — زیتونی (۱ عدد) به سبد اضافه شد
    AddCartItemRequest:
      type: object
      required: [variantId]
      properties:
        variantId: { type: integer, example: 205 }
        quantity: { type: integer, minimum: 1, maximum: 20, default: 1 }
    UpdateCartItemRequest:
      type: object
      properties:
        quantity: { type: integer, minimum: 1, maximum: 20, example: 2 }
        variantId: { type: integer, description: '[پیشنهادی] تغییر رنگ همان محصول در سبد' }
    ApplyDiscountCodeRequest:
      type: object
      required: [code]
      properties:
        code: { type: string, minLength: 2, maxLength: 32, description: حساس به حروف نیست؛ سرور trim و UPPERCASE می‌کند و ارقام فارسی/عربی را لاتین, example: KIVA10 }

    # ============ CHECKOUT ============
    PaymentGateway:
      type: object
      required: [code, name]
      properties:
        code: { $ref: '#/components/schemas/PaymentGatewayCode' }
        name: { type: string, example: زرین‌پال }
        logoUrl: { type: string, format: uri, nullable: true }
        brandColor: { type: string, example: '#F2C230' }
        initial: { type: string, description: حرف داخل لوگوی جایگزین, example: ز }
        isDefault: { type: boolean, description: 'درگاهی که تسویه اول انتخاب می‌کند، و همیشه یکی از درگاه‌های `available`: پیش‌فرض فروشگاه اگر در دسترس است، وگرنه اولین درگاه در دسترس. بدون درگاه در دسترس، هیچ‌کدام', example: true }
        available: { type: boolean, description: 'در تنظیمات فروشگاه فعال است **و** سرور برایش آداپتر دارد. فقط همین‌ها در `POST /orders` پذیرفته می‌شوند', example: true }
    CheckoutContext:
      type: object
      required: [cart, addresses, messengers, shippingOptions, paymentGateways]
      properties:
        cart: { $ref: '#/components/schemas/Cart' }
        addresses:
          type: array
          description: آدرس پیش‌فرض اول، بعد بقیه از قدیمی‌ترین (مثل `GET /me/addresses`)
          items: { $ref: '#/components/schemas/Address' }
        selectedAddressId: { type: integer, nullable: true, description: 'آدرسی که تسویه با آن شروع می‌شود: `addressId` ِ درخواست، وگرنه آدرس پیش‌فرض. `null` وقتی کاربر هیچ آدرسی ندارد: فرانت فرم آدرس تازه (`newAddress` در `POST /orders`) را باز می‌کند', example: 42 }
        messengers:
          type: array
          description: روبیکا، تلگرام و بله، به همین ترتیب
          items: { $ref: '#/components/schemas/MessengerOption' }
        selectedMessenger: { type: string, allOf: [{ $ref: '#/components/schemas/PhotoMessengerChannel' }], nullable: true, description: پیام‌رسان پیش‌فرض پروفایل یا آخرین انتخاب }
        messengerPhone: { allOf: [{ $ref: '#/components/schemas/PhoneNumber' }], description: آخرین شماره‌ی استفاده‌شده یا موبایل حساب }
        shippingOptions:
          type: array
          items: { $ref: '#/components/schemas/ShippingOptionQuote' }
        reservation: { $ref: '#/components/schemas/CartReservation' }
        consolidation: { type: object, allOf: [{ $ref: '#/components/schemas/ReservationConsolidation' }], nullable: true, description: 'برای آدرس انتخاب‌شده (`selectedAddressId`)' }
        paymentGateways:
          type: array
          description: همه‌ی درگاه‌های فروشگاه به ترتیب، در دسترس یا نه (`available`)؛ دقیقاً یکی `isDefault` اگر حداقل یکی در دسترس است
          items: { $ref: '#/components/schemas/PaymentGateway' }
        giftWrap:
          type: object
          description: '[پیشنهادی] بسته‌بندی هدیه. فعلاً `{available: false, price: 0}`'
          properties:
            available: { type: boolean, example: true }
            price: { allOf: [{ $ref: '#/components/schemas/Money' }], example: 45000 }
        termsUrl: { type: string, example: /pages/terms }
    AddressInput:
      type: object
      required: [provinceId, cityId, addressLine, postalCode, recipientName, recipientPhone]
      properties:
        title: { type: string, maxLength: 30, nullable: true, description: '[پیشنهادی] «خانه»، «محل کار»', example: خانه }
        provinceId: { type: integer, example: 8 }
        cityId: { type: integer, example: 394 }
        addressLine: { type: string, minLength: 10, maxLength: 300, description: 'خیابان، کوچه، پلاک، واحد. ارقام همان‌طور که تایپ شده‌اند می‌مانند؛ حروف عربی (ي، ك) و فاصله‌های اضافه یکدست می‌شوند.', example: 'خیابان ولیعصر، بالاتر از پارک ساعی، کوچه نسترن، پلاک ۱۲، واحد ۴' }
        plaque: { type: string, maxLength: 10, nullable: true, description: '[پیشنهادی] خالی = null. ارقامش لاتین ذخیره می‌شود.', example: '12' }
        unit: { type: string, maxLength: 10, nullable: true, description: '[پیشنهادی] خالی = null. ارقامش لاتین ذخیره می‌شود.', example: '4' }
        postalCode: { allOf: [{ $ref: '#/components/schemas/PostalCode' }], description: 'ارقام فارسی، فاصله و «-» پذیرفته و حذف می‌شوند («۱۹۶۵۸-۴۳۱۱۷» ← 1965843117)؛ بعد دقیقاً ۱۰ رقم.' }
        recipientName: { type: string, minLength: 3, maxLength: 80, example: سارا محمدی }
        recipientPhone: { $ref: '#/components/schemas/PhoneNumber' }
        isSelfRecipient: { type: boolean, description: «گیرنده خودم هستم», example: true }
        location:
          type: object
          nullable: true
          description: '[پیشنهادی] انتخاب روی نقشه برای پیک. هر دو با هم یا هیچ‌کدام؛ وگرنه `LOCATION_INVALID`.'
          properties:
            lat: { type: number, format: double, example: 35.7575 }
            lng: { type: number, format: double, example: 51.4107 }
        setAsDefault: { type: boolean, default: false, description: '`true` = پیش‌فرض شود. `false` پیش‌فرض بودن را برنمی‌دارد. اولین آدرس همیشه پیش‌فرض است.' }
    PlaceOrderRequest:
      type: object
      required: [shippingMethod, paymentGateway]
      description: |
        دقیقاً یکی از `addressId` یا `newAddress` باید ارسال شود؛ هیچ‌کدام یا هر دو = `400`. خطاهای `newAddress` با پیشوند `newAddress.` در `errors[].field` می‌آیند.
        سبد و کد تخفیف همیشه از سبد کاربر خوانده می‌شوند؛ وضعیت رزرو هم، مگر `reserve` در این بدنه بیاید.
        `preShipmentMessenger` اجباری است، ولی با قانون کسب‌وکار (`422 MESSENGER_REQUIRED` / `MESSENGER_PHONE_INVALID`)، نه با شکل ورودی (`400`)؛ ترتیب کامل در `POST /orders`.
      properties:
        addressId: { type: integer, nullable: true, example: 42 }
        newAddress: { type: object, allOf: [{ $ref: '#/components/schemas/AddressInput' }], nullable: true }
        saveNewAddress:
          type: boolean
          default: true
          description: «ذخیره این آدرس در حساب کاربری». اگر دفترچه‌ی آدرس پر باشد (۲۰ آدرس)، سفارش ثبت می‌شود و آدرس ذخیره نمی‌شود.
        preShipmentMessenger:
          type: object
          description: |
            «عکس کیفت رو قبل از ارسال کجا بفرستیم؟» — اجباری (امضای کیوا).
            نیامده یا بدون `channel` ← `422 MESSENGER_REQUIRED`؛ `phone` نیامده یا غلط ← `422 MESSENGER_PHONE_INVALID`. مقدار `channel` خارج از فهرست ← `400`.
          properties:
            channel: { $ref: '#/components/schemas/PhotoMessengerChannel' }
            phone: { $ref: '#/components/schemas/PhoneNumber' }
            username: { type: string, nullable: true, description: '[پیشنهادی] آیدی تلگرام', example: '@sara_m' }
            note: { type: string, maxLength: 200, nullable: true, description: «توضیح برای عکس», example: از داخل کیف هم عکس بگیرید }
            saveAsDefault: { type: boolean, default: true }
        shippingMethod: { $ref: '#/components/schemas/ShippingMethodCode' }
        reserve: { type: boolean, nullable: true, description: 'رزرو ۴ روزه (اگر null از سبد خوانده می‌شود). وقتی سفارش به رزرو فعال می‌پیوندد (`consolidation`) نادیده گرفته می‌شود' }
        paymentGateway: { $ref: '#/components/schemas/PaymentGatewayCode' }
        customerNote: { type: string, maxLength: 300, nullable: true, description: '[پیشنهادی] توضیح سفارش' }
        gift:
          type: object
          nullable: true
          description: '[پیشنهادی] سفارش هدیه'
          properties:
            wrap: { type: boolean, description: 'تا وقتی `CheckoutContext.giftWrap.available = false` است نادیده گرفته می‌شود (بدون هزینه)', example: true }
            message: { type: string, maxLength: 200, example: تولدت مبارک! }
            hidePrices: { type: boolean, default: true }
        expectedPayable:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: |
            مبلغی که کاربر روی دکمه‌ی پرداخت دیده؛ برای تشخیص تغییر قیمت (`409 PRICE_CHANGED`). فقط برای مقایسه است و هیچ‌وقت مبلغ پرداخت را تعیین نمی‌کند.
            به‌شدت توصیه می‌شود همیشه فرستاده شود؛ اگر نیاید مقایسه‌ای انجام نمی‌شود و سفارش با مبلغ فعلی سرور ثبت می‌شود.
          example: 1595000
        acceptTerms: { type: boolean, default: false, description: '«با پرداخت، قوانین کیوا رو می‌پذیری». نیامده = نپذیرفته (`422 TERMS_NOT_ACCEPTED`)', example: true }
    PaymentInit:
      type: object
      required: [paymentId, gateway, amount, redirect]
      properties:
        paymentId: { type: string, example: 'pay_01J9X2K7' }
        gateway: { $ref: '#/components/schemas/PaymentGatewayCode' }
        amount: { $ref: '#/components/schemas/Money' }
        redirect:
          type: object
          description: برای GET فقط `url`؛ برای POST (سامان/ملت) یک فرم auto-submit با `fields` بسازید
          required: [url, method]
          properties:
            url: { type: string, format: uri, example: 'https://www.zarinpal.com/pg/StartPay/A00000000000000000000000000217885159' }
            method: { type: string, enum: [GET, POST] }
            fields:
              type: object
              additionalProperties: { type: string }
              example: {}
        expiresAt: { type: string, format: date-time, description: 'پایان مهلت پرداخت سفارش و رزرو موقت موجودی (ثبت سفارش + ۱۵ دقیقه). برای همه‌ی تلاش‌های پرداخت یک سفارش یکی است و تمدید نمی‌شود. برای پرداخت مانده (`purpose = BALANCE`) پایان پنجره‌ی همین تلاش روی درگاه (شروع + ۲۰ دقیقه)؛ مانده خودش مهلت ندارد.' }
    PlaceOrderResponse:
      type: object
      required: [order]
      properties:
        order: { $ref: '#/components/schemas/OrderSummary' }
        payment: { type: object, allOf: [{ $ref: '#/components/schemas/PaymentInit' }], nullable: true }
    PaymentStatus:
      type: string
      description: |
        `PENDING` مشتری هنوز از درگاه برنگشته یا verify در جریان است ·
        `SUCCEEDED` پرداخت تأیید شد · `FAILED` درگاه رد کرد، verify رد شد، یا سفارش دیگر قابل پرداخت نبود (مبلغ را درگاه برمی‌گرداند) ·
        `CANCELLED` مشتری در درگاه انصراف داد · `EXPIRED` مهلت پرداخت سفارش تمام شد، یا مشتری بیش از ۲۰ دقیقه در درگاه ماند و برنگشت و درگاه می‌گوید پرداخت نشده · `REFUNDED` وجه برگشت داده شد (از جمله تلاشی که verify شد ولی سفارشش دیگر قابل پرداخت نبود و درگاه همان لحظه مبلغ را برگرداند)
      enum: [PENDING, SUCCEEDED, FAILED, CANCELLED, EXPIRED, REFUNDED]
    PaymentResult:
      type: object
      required: [paymentId, status, amount, gateway]
      properties:
        paymentId: { type: string, example: 'pay_01J9X2K7' }
        status:
          allOf: [{ $ref: '#/components/schemas/PaymentStatus' }]
          description: روی صفحه‌ی نتیجه `PENDING` یعنی verify در جریان است؛ کلاینت هر ۳ ثانیه و حداکثر ۳۰ ثانیه دوباره می‌پرسد.
        amount: { $ref: '#/components/schemas/Money' }
        gateway: { $ref: '#/components/schemas/PaymentGatewayCode' }
        referenceId: { type: string, nullable: true, description: شماره پیگیری بانکی, example: '201843917' }
        cardMask: { type: string, nullable: true, example: '6037-99**-****-1234' }
        paidAt: { type: string, format: date-time, nullable: true }
        failureReason: { type: string, nullable: true, description: 'فقط برای تلاش ناموفق؛ برای `SUCCEEDED` و `PENDING` همیشه `null`', example: تراکنش توسط کاربر لغو شد }
        canRetry: { type: boolean, description: 'پرداخت موفق نیست، در حال verify هم نیست (صفحه منتظر نتیجه‌اش می‌ماند)، و سفارش هنوز در مهلت پرداخت است (`POST /payments/{paymentId}/retry`)', example: false }
        order:
          type: object
          properties:
            code: { $ref: '#/components/schemas/OrderCode' }
            status: { $ref: '#/components/schemas/OrderStatus' }
            reserved: { type: boolean, example: false }
            consolidatedInto: { type: string, allOf: [{ $ref: '#/components/schemas/OrderCode' }], nullable: true, description: 'کد سفارش اصلی رزروی که این سفارش به آن پیوسته و همراهش ارسال می‌شود؛ برای خود سفارش اصلی و سفارش عادی `null`' }
        nextSteps:
          type: array
          description: سه قدم صفحه‌ی موفقیت؛ فقط برای `SUCCEEDED`، وگرنه خالی
          items: { type: string }
          example:
            - سفارشت در حال آماده‌سازیه.
            - عکس و ویدیوی کیفت رو قبل از ارسال توی تلگرام برات می‌فرستیم.
            - بعد از تحویل به تیپاکس، کد رهگیری توی حسابت قرار می‌گیره.

    # ============ ORDERS ============
    OrderStatus:
      type: string
      enum: [PENDING_PAYMENT, PAYMENT_FAILED, EXPIRED, RESERVED, PROCESSING, PHOTO_SENT, CHANGE_REQUESTED, SHIPPED, DELIVERED, CANCELLED, RETURN_REQUESTED, RETURNED, REFUNDED]
      example: PHOTO_SENT
    OrderProgressStep:
      type: object
      required: [key, label, state]
      properties:
        key: { type: string, enum: [PLACED, PHOTO_SENT, SHIPPED, DELIVERED] }
        label: { type: string, example: عکس ارسال شد }
        icon: { $ref: '#/components/schemas/IconName' }
        state: { type: string, enum: [DONE, CURRENT, UPCOMING] }
        at: { type: string, format: date-time, nullable: true }
    OrderProgress:
      type: object
      properties:
        currentStepIndex: { type: integer, minimum: 0, maximum: 3, example: 1 }
        steps:
          type: array
          minItems: 4
          maxItems: 4
          items: { $ref: '#/components/schemas/OrderProgressStep' }
    ReservationInfo:
      type: object
      properties:
        active: { type: boolean, description: 'در `GET /me/reservation` همیشه `true`؛ روی کارت سفارش `false` یعنی مهلت تمام شده و سفارش به‌زودی `PROCESSING` می‌شود', example: true }
        orderCode: { $ref: '#/components/schemas/OrderCode' }
        startedAt: { type: string, format: date-time, description: لحظه‌ی پرداخت موفق سفارش اصلی (شروع مهلت) }
        expiresAt: { type: string, format: date-time, description: 'startedAt + reservationHoldDays؛ برای کل گروه ثابت است و تمدید نمی‌شود. برای شمارنده «۲ روز و ۱۴ ساعت و ۵ دقیقه مانده»' }
        remainingSeconds: { type: integer, example: 223500 }
        groupOrderCodes:
          type: array
          description: سفارش‌های پرداخت‌شده‌ی این رزرو به ترتیب پرداخت؛ اولی سفارش اصلی است
          items: { $ref: '#/components/schemas/OrderCode' }
        message: { type: string, example: تا سه‌شنبه ۱۵ مهر هر خریدی کنی، با همین سفارش و بدون هزینه ارسال جدید فرستاده می‌شه. }
    Shipment:
      type: object
      properties:
        carrier: { $ref: '#/components/schemas/ShippingMethodCode' }
        carrierName: { type: string, example: تیپاکس }
        trackingCode: { type: string, nullable: true, example: TPX4821760 }
        trackingUrl: { type: string, format: uri, nullable: true, example: 'https://tipaxco.com/tracking' }
        shippedAt: { type: string, format: date-time, nullable: true }
        deliveredAt: { type: string, format: date-time, nullable: true }
        waitingMessage: { type: string, nullable: true, example: بعد از تحویل به تیپاکس این‌جا نمایش داده می‌شه }
    OrderItemPreview:
      type: object
      properties:
        productId: { type: integer, example: 4 }
        name: { type: string, example: کیف دستی آیدا }
        colorKey: { $ref: '#/components/schemas/ColorKey' }
        imageUrl: { type: string, format: uri, nullable: true, description: 'عکس رنگ؛ تا آپلود مدیا `null`، مثل ردیف سبد' }
        quantity: { type: integer, example: 1 }
    PreShipmentMediaSummary:
      type: object
      properties:
        status: { type: string, enum: [WAITING, SENT, APPROVED, CHANGE_REQUESTED] }
        channel: { $ref: '#/components/schemas/PhotoMessengerChannel' }
        channelName: { type: string, example: تلگرام }
        count: { type: integer, example: 4 }
        hasVideo: { type: boolean, example: true }
        sentAt: { type: string, format: date-time, nullable: true }
    OrderSummary:
      type: object
      description: کارت سفارش در «سفارش‌های من»
      required: [code, placedAt, status, statusLabel, payable, shippingMethod, itemsPreview, progress]
      properties:
        code: { $ref: '#/components/schemas/OrderCode' }
        placedAt: { type: string, format: date-time }
        status: { $ref: '#/components/schemas/OrderStatus' }
        statusLabel: { type: string, example: عکس کیف ارسال شد }
        statusTone: { $ref: '#/components/schemas/Tone' }
        payable: { $ref: '#/components/schemas/Money' }
        balanceDue:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: 'همان `totals.balanceDue`، برای کارت سفارش: مانده‌ی پرداخت بعد از درخواست تغییر به رنگ/مدل گران‌تر؛ معمولاً ۰'
          example: 0
        shippingMethod:
          type: object
          properties:
            code: { $ref: '#/components/schemas/ShippingMethodCode' }
            name: { type: string, example: تیپاکس }
        itemsPreview:
          type: array
          items: { $ref: '#/components/schemas/OrderItemPreview' }
        itemsCount: { type: integer, example: 1 }
        progress: { $ref: '#/components/schemas/OrderProgress' }
        reservation: { type: object, allOf: [{ $ref: '#/components/schemas/ReservationInfo' }], nullable: true }
        shipment: { $ref: '#/components/schemas/Shipment' }
        preShipmentMedia: { $ref: '#/components/schemas/PreShipmentMediaSummary' }
        actions:
          type: object
          description: کدام دکمه‌ها نمایش داده شوند
          properties:
            canCancel: { type: boolean, example: true }
            canRequestChange: { type: boolean, example: true }
            canApproveMedia: { type: boolean, example: true }
            canReturn: { type: boolean, example: false }
            canPay: { type: boolean, description: 'دکمه‌ی «پرداخت» ← `POST /me/orders/{code}/payments` (سفارش پرداخت‌نشده، یا `balanceDue > 0`)', example: false }
            canAddToReservation: { type: boolean, example: false }
            canReview: { type: boolean, example: false }
    OrderItem:
      type: object
      required: [id, productId, variantId, name, color, quantity, unitPrice, lineTotal]
      properties:
        id: { type: integer, description: 'شماره‌ی ردیف در همین سفارش (۱ تا n)؛ فقط داخل سفارش یکتاست', example: 1 }
        productId: { type: integer, example: 4 }
        variantId: { type: integer, example: 402 }
        sku: { type: string, example: KV-1004-CAR }
        name: { type: string, description: snapshot نام در زمان خرید, example: کیف دستی آیدا }
        slug: { type: string, example: aida-satchel }
        color: { $ref: '#/components/schemas/Color' }
        image: { type: string, format: uri, nullable: true, description: 'عکس رنگ در لحظه‌ی خرید (نسخه‌ی ۴۸۰، snapshot)؛ سفارش‌های پیش از آپلود مدیا و رنگ بی‌عکس `null`' }
        quantity: { type: integer, example: 1 }
        unitPrice: { allOf: [{ $ref: '#/components/schemas/Money' }], example: 2790000 }
        unitCompareAtPrice: { type: integer, allOf: [{ $ref: '#/components/schemas/Money' }], nullable: true, example: 3290000 }
        lineTotal: { allOf: [{ $ref: '#/components/schemas/Money' }], example: 2790000 }
        reviewed: { type: boolean, example: false }
        returnableUntil: { type: string, format: date-time, nullable: true }
    OrderTotals:
      type: object
      description: |
        جمع‌های سفارش. قبل از هر درخواست تغییر همان جمع‌های لحظه‌ی ثبت‌اند. **بعد از درخواست تغییر** (رنگ/مدل عوض شد یا قلمی حذف شد):

        * `itemsCompareAtTotal`، `productDiscount` و `subtotal` از قلم‌های **فعلی** سفارش حساب می‌شوند (قلم تازه با قیمت لحظه‌ی رسیدگی)؛
        * `shippingCost` همان لحظه‌ی ثبت است؛ `codeDiscount` هم، منهای سهم کد ِ قلم‌های حذف‌شده (`floor(lineTotal × codeDiscount ÷ subtotal)` ِ لحظه‌ی ثبت)؛
          کد با قانون‌های خودش دوباره حساب نمی‌شود؛
        * `payable` کل پرداخت‌شده تا الان است و `balanceDue` مانده؛ `refunded` استردادهای `COMPLETED`.

        همیشه: `subtotal − codeDiscount + shippingCost = payable + balanceDue − (استردادهای ساخته‌شده از درخواست تغییر)`.
      properties:
        itemsCompareAtTotal: { allOf: [{ $ref: '#/components/schemas/Money' }], example: 4080000 }
        productDiscount: { allOf: [{ $ref: '#/components/schemas/Money' }], example: 600000 }
        subtotal: { allOf: [{ $ref: '#/components/schemas/Money' }], example: 3480000 }
        discountCode: { type: string, nullable: true, description: کد تخفیفی که سفارش با آن ثبت شد (`codeDiscount` مال آن است), example: null }
        codeDiscount: { allOf: [{ $ref: '#/components/schemas/Money' }], description: 'تخفیف کد؛ بعد از حذف قلم، منهای سهم کد ِ آن قلم', example: 0 }
        shippingCost: { allOf: [{ $ref: '#/components/schemas/Money' }], example: 0 }
        shippingFreeReason: { type: string, nullable: true, example: THRESHOLD }
        giftWrapCost: { allOf: [{ $ref: '#/components/schemas/Money' }], example: 0 }
        payable: { allOf: [{ $ref: '#/components/schemas/Money' }], description: '«پرداخت شده»: **کل پرداخت‌شده تا الان** (مبلغ ثبت سفارش + مانده‌های پرداخت‌شده). برای سفارش پرداخت‌نشده، مبلغی که باید پرداخت شود', example: 3480000 }
        refunded: { allOf: [{ $ref: '#/components/schemas/Money' }], description: 'جمع استردادهای `COMPLETED`', example: 0 }
        balanceDue:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: مانده‌ی پرداخت بعد از درخواست تغییر به رنگ/مدل گران‌تر؛ در بقیه‌ی موارد ۰. تا صفر نشود سفارش ارسال نمی‌شود. سفارش لغوشده مانده ندارد.
          example: 0
        currency: { $ref: '#/components/schemas/Currency' }
    AddressSnapshot:
      type: object
      properties:
        provinceName: { type: string, example: تهران }
        cityName: { type: string, example: تهران }
        addressLine: { type: string, example: 'خیابان ولیعصر، بالاتر از پارک ساعی، کوچه نسترن، پلاک ۱۲، واحد ۴' }
        plaque: { type: string, nullable: true, example: '12' }
        unit: { type: string, nullable: true, example: '4' }
        postalCode: { $ref: '#/components/schemas/PostalCode' }
        recipientName: { type: string, example: سارا محمدی }
        recipientPhone: { $ref: '#/components/schemas/PhoneNumber' }
        fullText: { type: string, example: 'تهران، تهران، خیابان ولیعصر، ...' }
