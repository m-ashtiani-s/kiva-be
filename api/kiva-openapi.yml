  /admin/reviews/{reviewId}/moderation:
    post:
      tags: [Admin · Support]
      x-roles: [ADMIN, SUPPORT]
      operationId: adminModerateReview
      summary: "تأیید یا رد نظر"
      description: |
        `PENDING` ← `APPROVED` یا `REJECTED`؛ `APPROVED` ← `REJECTED` (برداشتن از سایت)؛ `REJECTED` ← `APPROVED`. همان وضعیت دوباره ← `422 INVALID_STATUS_TRANSITION`.
        رد: `rejectionReason` ۳ تا ۳۰۰ لازم (`400 REJECTION_REASON_REQUIRED`)؛ فقط صاحب نظر آن را می‌بیند. `reply` (۲ تا ۱۰۰۰) فقط با `APPROVE`؛ با `REJECT` ←
        `400 REPLY_REQUIRES_APPROVAL` روی `reply`. امتیاز محصول با هر ورود یا خروج از `APPROVED` به‌روز می‌شود. پیامکی نمی‌رود. یک ردیف `REVIEW_MODERATED` در لاگ تغییرات.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ReviewId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewModerationRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Review' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: "`REVIEW_ALREADY_EXISTS` — تأیید نظر ردشده وقتی نویسنده‌اش نظر زنده‌ی دیگری برای همین محصول دارد"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: "`INVALID_STATUS_TRANSITION`"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /admin/reviews/{reviewId}/reply:
    put:
      tags: [Admin · Support]
      x-roles: [ADMIN, SUPPORT]
      operationId: adminReplyReview
      summary: "ثبت/ویرایش «پاسخ کیوا» زیر نظر"
      description: |
        فقط روی نظر `APPROVED` (وگرنه `422 INVALID_STATUS_TRANSITION`). متن ساده ۲ تا ۱۰۰۰ (همان قانون متن نظر). `reply.authorName` همیشه «کیوا» و
        `reply.createdAt` آخرین ذخیره. یک ردیف `REVIEW_REPLIED` در لاگ تغییرات. رد کردن بعدی نظر، پاسخ را نگه می‌دارد ولی دیده نمی‌شود.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ReviewId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, minLength: 2, maxLength: 1000, example: 'سمیرا جان ممنون از انرژی خوبت، مبارکت باشه.' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Review' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: "`INVALID_STATUS_TRANSITION` — نظر تأییدشده نیست"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    delete:
      tags: [Admin · Support]
      x-roles: [ADMIN, SUPPORT]
      operationId: adminDeleteReviewReply
      summary: "حذف پاسخ"
      description: همیشه `204`، بدون پاسخ هم (نظر ناموجود ← `404 REVIEW_NOT_FOUND`)؛ ردیف `REVIEW_REPLY_DELETED` ِ لاگ تغییرات فقط وقتی واقعاً پاسخی پاک شد.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ReviewId'
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/contact-messages:
    get:
      tags: [Admin · Support]
      x-roles: [ADMIN, SUPPORT]
      operationId: adminListContactMessages
      summary: "پیام‌های فرم تماس"
      description: تازه‌ترین اول، با فیلتر `status` و `topic` (مقدار ناشناخته ← `400`). پیام‌های `CLOSED` ِ قدیمی‌تر از ۳۶۵ روز (از `updatedAt`) پاک می‌شوند.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [OPEN, IN_PROGRESS, CLOSED] }
        - name: topic
          in: query
          schema: { $ref: '#/components/schemas/ContactTopic' }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AdminContactMessage' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/contact-messages/{ticketCode}:
    patch:
      tags: [Admin · Support]
      x-roles: [ADMIN, SUPPORT]
      operationId: adminUpdateContactMessage
      summary: "تغییر وضعیت/پاسخ پیام تماس (پاسخ از طریق پیامک یا ایمیل ارسال می‌شود)"
      description: |
        همه‌ی فیلدها اختیاری؛ `{}` ← `200` بی‌تغییر. `reply` (۲ تا ۱۰۰۰، متن ساده) و `replyChannel` با هم (یکی بی دیگری ← `400 REPLY_CHANNEL_REQUIRED`
        یا `400 REPLY_REQUIRED`). وضعیت هر به هر مجاز است و فقط وقتی `status` آمده عوض می‌شود. هر `reply` ِ تازه جای قبلی را می‌گیرد و دوباره فرستاده می‌شود.
        `internalNote` (حداکثر ۱۰۰۰) جایگزین می‌شود و هیچ‌وقت به مشتری نمی‌رسد.
        * `replyChannel = SMS`: **متن پاسخ پیامک نمی‌شود**؛ فقط یک پیامک خبر با کد پیگیری می‌رود (بخش پیامک‌ها) و اپراتور خودش تماس می‌گیرد.
        * `replyChannel = EMAIL`: متن کامل پاسخ ایمیل می‌شود؛ پیام بدون `email` ← `400 EMAIL_NOT_AVAILABLE` روی `replyChannel`.
        پیامک و ایمیل بعد از ذخیره می‌روند و شکستشان کار را برنمی‌گرداند. هر تغییر یک ردیف `CONTACT_MESSAGE_UPDATED` (بدون متن پاسخ و یادداشت).
      security: [{ bearerAuth: [] }]
      parameters:
        - name: ticketCode
          in: path
          required: true
          schema: { type: string, example: CT-4821 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: string, enum: [OPEN, IN_PROGRESS, CLOSED] }
                reply: { type: string, minLength: 2, maxLength: 1000 }
                replyChannel: { type: string, enum: [SMS, EMAIL] }
                internalNote: { type: string, maxLength: 1000, nullable: true }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminContactMessage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/customers:
    get:
      tags: [Admin · Support]
      x-roles: [ADMIN, SUPPORT]
      operationId: adminListCustomers
      summary: "مشتریان (جستجو با موبایل/نام)"
      description: '`role` فقط کاربرانی که آن نقش را دارند (برای صفحه‌ی نقش‌ها و کارمندها)؛ `CUSTOMER` = همه. نقش ناشناخته ← `400 ROLE_INVALID` روی `role`. حساب‌های حذف‌شده نمی‌آیند.'
      security: [{ bearerAuth: [] }]
      parameters:
        - name: q
          in: query
          schema: { type: string }
        - name: role
          in: query
          schema: { $ref: '#/components/schemas/UserRole' }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AdminCustomer' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/customers/{customerId}:
    get:
      tags: [Admin · Support]
      x-roles: [ADMIN, SUPPORT]
      operationId: adminGetCustomer
      summary: "جزئیات یک مشتری: پروفایل، آدرس‌ها و آخرین سفارش‌ها"
      description: |
        کاربر ناموجود یا شناسه‌ی بدشکل ← `404 NOT_FOUND`؛ حساب حذف‌شده ← `404 CUSTOMER_DELETED` (تا پنل «این حساب حذف شده» را از «مسیر اشتباه» جدا کند؛
        شناسه‌ی چنین حسابی هنوز در سفارش‌ها، مرجوعی‌ها و نظرهایش هست). خواندن در لاگ تغییرات ثبت نمی‌شود.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: customerId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminCustomerDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/customers/{customerId}/roles:
    put:
      tags: [Admin · Support]
      x-roles: [ADMIN]
      operationId: adminSetCustomerRoles
      summary: "تعیین نقش‌های پنل یک کاربر"
      description: |
        لیست کامل نقش‌ها را جایگزین می‌کند (`CUSTOMER` همیشه می‌ماند و لازم نیست فرستاده شود). بعد از تغییر، همه‌ی نشست‌های آن کاربر
        باطل می‌شوند تا با نقش‌های جدید دوباره وارد شود. هر تغییر با «چه کسی، کِی، از چه به چه» در رویدادهای امنیتی ثبت می‌شود.
        هیچ‌کس نقش‌های **خودش** را عوض نمی‌کند (`422 ROLE_CHANGE_NOT_ALLOWED`)، تا آخرین ADMIN اشتباهی خودش را بیرون نیندازد.
        **آخرین ADMIN نقشش را از دست نمی‌دهد:** تغییری که تعداد ADMINها را صفر کند ← `422 ROLE_CHANGE_NOT_ALLOWED` با `meta.reason = LAST_ADMIN`.
        تغییرهای نقش یکی‌یکی انجام می‌شوند و نقش‌های **فعلی** ِ انجام‌دهنده همان لحظه دوباره خوانده می‌شوند: اگر دو ADMIN همزمان ADMIN ِ همدیگر را
        بردارند، یکی انجام می‌شود و دومی (که دیگر ADMIN نیست) `403 FORBIDDEN` می‌گیرد. هر تغییر در رویدادهای امنیتی و لاگ تغییرات (`USER_ROLES_CHANGED`) ثبت می‌شود.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: customerId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roles]
              properties:
                roles:
                  type: array
                  uniqueItems: true
                  items: { $ref: '#/components/schemas/UserRole' }
                  example: [OPERATOR]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminCustomer' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: "`ROLE_CHANGE_NOT_ALLOWED`: نقش‌های خودت را نمی‌توانی عوض کنی، یا (`meta.reason = LAST_ADMIN`) این آخرین ADMIN است"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /admin/reports/overview:
    get:
      tags: [Admin · Support]
      x-roles: [ADMIN]
      operationId: adminReportOverview
      summary: "داشبورد مدیریتی (فروش، تعداد سفارش، میانگین سبد، پرفروش‌ها، نرخ تأیید عکس)"
      description: |
        `from` و `to` روزهای تهران‌اند و هر دو **شامل** (`from` از ساعت ۰۰:۰۰ همان روز تا پایان روز `to`). نیامده ← `400 FIELD_REQUIRED`،
        بدشکل ← `400 DATE_INVALID`، `from` بعد از `to` ← `400 DATE_RANGE_INVALID` روی `to`، بیشتر از ۳۶۶ روز ← `400 DATE_RANGE_TOO_LONG` روی `to`.

        **سفارش دوره** = سفارشی که پولش (`paidOn`، پرداخت اول) در بازه رسیده و لغو نشده. همه‌ی عددهای پولی از همین سفارش‌هاست
        (معنی هر فیلد در `AdminReportOverview`). همه با ریاضی صحیح؛ درصدها یک رقم اعشار، نیمه به بالا.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
          example: '2026-10-01'
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
          example: '2026-10-31'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminReportOverview' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/audit-log:
    get:
      tags: [Admin · Support]
      x-roles: [ADMIN]
      operationId: adminListAuditLog
      summary: "لاگ تغییرات پنل: چه کسی، کِی، چه کاری، روی چه چیزی (تازه‌ترین اول)"
      description: |
        هر درخواست موفق نوشتنی زیر `/admin/*` یک ردیف (بخش ۲). لاگ فقط اضافه می‌شود و ویرایش ندارد؛ بعد از ۹۰ روز خودکار پاک می‌شود،
        پس بازه‌ی قدیمی‌تر فقط خالی برمی‌گردد.
        برای تاریخچه‌ی یک مورد: `entityType` + `entityId` (مثلاً `PRODUCT` و `12`، یا `ORDER` و `KV-218340`). `entityId` بدون `entityType` هم مجاز است.
        `from` و `to` روزهای تهران‌اند و هر دو شامل: `from` از ساعت ۰۰:۰۰ همان روز و `to` تا پایان همان روز (۰۰:۰۰ ِ روز بعد، نابسته).
        `from` بعد از `to` ← `400` روی `to` با `DATE_RANGE_INVALID`. ترتیب: تازه‌ترین اول (`at`، بعد `id`، نزولی).
        `actor` موقع خواندن از حساب فعلی کاربر می‌آید (موبایل کامل، چون فقط `ADMIN` می‌بیند)؛ `summary` جمله‌ی فارسی همان ردیف است.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: entityType
          in: query
          schema: { $ref: '#/components/schemas/AuditEntityType' }
        - name: entityId
          in: query
          schema: { type: string, maxLength: 64 }
        - name: actorId
          in: query
          description: شناسه‌ی کاربر پنلی که کار را کرده
          schema: { type: integer }
        - name: from
          in: query
          description: روز شروع (به وقت تهران، شامل)
          schema: { type: string, format: date }
        - name: to
          in: query
          description: روز پایان (به وقت تهران، شامل)
          schema: { type: string, format: date }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, meta]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AuditLogEntry' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        accessToken دریافتی از `POST /auth/otp/verify` یا `POST /auth/refresh`، با اعتبار ۱۵ دقیقه.
        Claimها: `sub` (userId)، `sid` (شناسه‌ی نشست)، `phone`، `roles` (`CUSTOMER`، و برای پنل: `ADMIN`، `CATALOG_MANAGER`، `OPERATOR`، `CONTENT_EDITOR`، `SUPPORT`)، `iat`، `exp`.
        کلاینت محتوای توکن را فقط برای نمایش می‌خواند (مثلاً منوی پنل از روی `roles`)؛ تصمیم دسترسی همیشه با سرور است.
        endpointهای `/admin/*` نیازمند نقش‌های `x-roles` خود هستند و در غیر این صورت `403 FORBIDDEN`.
    refreshCookie:
      type: apiKey
      in: cookie
      name: kiva_rt
      description: |
        refreshToken در کوکی `HttpOnly; Secure; SameSite=Strict; Path=/api/v1/auth`. فقط `POST /auth/refresh` و `POST /auth/logout` آن را می‌خوانند.
        کلاینت با `credentials: 'include'` درخواست می‌دهد و هیچ‌وقت خود توکن را نمی‌بیند.

  # ----------------------------------------------------------------
  parameters:
    Page:
      name: page
      in: query
      description: شماره صفحه (از ۱)
      schema: { type: integer, minimum: 1, default: 1 }
    Size:
      name: size
      in: query
      description: تعداد آیتم در صفحه
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    ProductPageSize:
      name: size
      in: query
      description: تعداد محصول در صفحه (گرید ۳ ستونه → مضرب ۳ و ۲)
      schema: { type: integer, minimum: 1, maximum: 60, default: 24 }
    SearchQuery:
      name: q
      in: query
      description: 'جستجو روی نام، دسته، رنگ‌های فعال، متریال و کد محصول (SKU)، با همان نرمال‌سازی `GET /search/suggest`؛ همه‌ی کلمه‌ها (AND، «شامل»)، حداکثر ۶ کلمه‌ی اول'
      schema: { type: string, maxLength: 100, example: کراس‌بادی }
    CategoryFilter:
      name: category
      in: query
      description: یک یا چند slug دسته‌بندی، جدا با کاما
      style: form
      explode: false
      schema:
        type: array
        items: { type: string }
        example: [shoulder, cross]
    ColorFilter:
      name: color
      in: query
      description: یک یا چند کلید رنگ، جدا با کاما (محصولی که حداقل یکی از رنگ‌ها را دارد)
      style: form
      explode: false
      schema:
        type: array
        items: { $ref: '#/components/schemas/ColorKey' }
        example: [black, lilac]
    MinPrice:
      name: minPrice
      in: query
      schema: { type: integer, format: int64, minimum: 0, example: 500000 }
    MaxPrice:
      name: maxPrice
      in: query
      schema: { type: integer, format: int64, minimum: 0, example: 2500000 }
    OnSale:
      name: onSale
      in: query
      description: فقط تخفیف‌خورده‌ها
      schema: { type: boolean }
    InStock:
      name: inStock
      in: query
      description: فقط کالاهای موجود
      schema: { type: boolean }
    IsNew:
      name: isNew
      in: query
      description: فقط محصولات جدید
      schema: { type: boolean }
    HasVideo:
      name: hasVideo
      in: query
      description: "فقط محصولات دارای ویدیو [پیشنهادی]"
      schema: { type: boolean }
    BagTypeFilter:
      name: bagType
      in: query
      description: "فرم کیف [پیشنهادی]"
      style: form
      explode: false
      schema:
        type: array
        items: { $ref: '#/components/schemas/BagType' }
    MaterialFilter:
      name: material
      in: query
      description: "slug متریال [پیشنهادی]"
      style: form
      explode: false
      schema:
        type: array
        items: { type: string }
        example: [genuine-leather]
    OccasionFilter:
      name: occasion
      in: query
      description: "مناسب برای (دانشگاه، مهمانی، ...) [پیشنهادی]"
      style: form
      explode: false
      schema:
        type: array
        items: { $ref: '#/components/schemas/Occasion' }
    CampaignFilter:
      name: campaign
      in: query
      description: |
        slug کمپین (برای صفحه‌ی «همه تخفیف‌های جشنواره»): فقط محصول‌های تخفیف‌دار ِ مجموعه‌ی کمپین **فعال** با همین `slug` (ناموجودها طبق قانون
        موجود ته لیست). کمپینی که الان فعال نیست یا نیست ← لیست خالی، نه خطا. شکل غلط slug ← `400`.
      schema: { type: string, example: paeez-1405 }
    ProductIds:
      name: ids
      in: query
      description: لیست شناسه‌ها (اخیراً دیده‌شده / مقایسه)، ترتیب حفظ می‌شود
      style: form
      explode: false
      schema:
        type: array
        maxItems: 60
        items: { type: integer }
    ProductSort:
      name: sort
      in: query
      description: |
        `newest` جدیدترین (پیش‌فرض) · `bestselling` پرفروش‌ترین · `price_asc` ارزان‌ترین · `price_desc` گران‌ترین ·
        `discount_desc` بیشترین تخفیف · `rating_desc` بیشترین امتیاز (میانگین نزولی، بعد تعداد نظر نزولی، بعد تازه‌ترین؛ بی‌نظرها بعد از نظردارها،
        و ناموجودها مثل بقیه‌ی ترتیب‌ها ته لیست)
      schema:
        type: string
        enum: [newest, bestselling, price_asc, price_desc, discount_desc, rating_desc]
        default: newest
    ProductIdOrSlug:
      name: idOrSlug
      in: path
      required: true
      description: شناسه‌ی عددی، کد محصول (KV-1001) یا slug
      schema: { type: string, example: mahak-shoulder-bag }
    ProductId:
      name: productId
      in: path
      required: true
      schema: { type: integer, example: 1 }
    VariantId:
      name: variantId
      in: path
      required: true
      schema: { type: integer, example: 101 }
    ReviewId:
      name: reviewId
      in: path
      required: true
      schema: { type: integer, example: 5531 }
    CartItemId:
      name: itemId
      in: path
      required: true
      schema: { type: string, example: 'ci_8d2f1a' }
    CartToken:
      name: X-Cart-Token
      in: header
      required: false
      description: توکن سبد مهمان. برای کاربر واردشده لازم نیست و با Bearer معتبر نادیده گرفته می‌شود.
      schema: { type: string, example: 'gct_7f3a9c2e1b' }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        UUID یکتا برای هر تلاش ثبت؛ جلوگیری از ثبت دوباره‌ی سفارش با دابل‌کلیک یا قطع شبکه.
        کلاینت برای هر تلاش تازه کلید تازه می‌سازد و فقط برای تکرار همان درخواست (مثلاً بعد از قطع شبکه) همان کلید را می‌فرستد.
        نیامده یا UUID نیست = `400 VALIDATION_ERROR` روی فیلد `Idempotency-Key`. قواعد کامل در «قراردادهای کلی».
      schema: { type: string, format: uuid }
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: ETag نسخه‌ی فعلی برای جلوگیری از بازنویسی همزمان
      schema: { type: string }
    OrderCode:
      name: orderCode
      in: path
      required: true
      schema: { $ref: '#/components/schemas/OrderCode' }
    AddressId:
      name: addressId
      in: path
      required: true
      schema: { type: integer, example: 42 }
    PaymentId:
      name: paymentId
      in: path
      required: true
      schema: { type: string, example: 'pay_01J9X2K7' }
    GatewayPath:
      name: gateway
      in: path
      required: true
      schema:
        type: string
        enum: [zarinpal, saman, mellat]

  # ----------------------------------------------------------------
  headers:
    ETag:
      description: نسخه‌ی منبع برای کش شرطی (`If-None-Match`)
      schema: { type: string, example: 'W/"a1b2c3"' }
    XCartToken:
      description: توکن سبد مهمان (فقط وقتی سبد جدید ساخته شده یا توکن عوض شده). روی پاسخ خطا هیچ‌وقت نمی‌آید، چون سبد تازه‌ی درخواستِ شکست‌خورده نگه داشته نمی‌شود
      schema: { type: string, example: 'gct_7f3a9c2e1b' }
    RetryAfter:
      description: چند ثانیه‌ی دیگر می‌توان دوباره تلاش کرد
      schema: { type: integer, example: 87 }
    SetRefreshCookie:
      description: |
        نشست جدید یا چرخیده: `kiva_rt=<token>; HttpOnly; Secure; SameSite=Strict; Path=/api/v1/auth; Max-Age=<ثانیه>`.
        `Max-Age` همان `refreshExpiresIn` پاسخ است.
      schema: { type: string, example: 'kiva_rt=Q2xhdWRlIHdhcyBoZXJl...; Max-Age=2592000; Path=/api/v1/auth; Secure; HttpOnly; SameSite=Strict' }
    ClearRefreshCookie:
      description: پاک کردن کوکی نشست
      schema: { type: string, example: 'kiva_rt=; Max-Age=0; Path=/api/v1/auth; Secure; HttpOnly; SameSite=Strict' }

  # ----------------------------------------------------------------
  responses:
    NoContent:
      description: انجام شد (بدون محتوا)
    ValidationError:
      description: "`VALIDATION_ERROR` — ورودی نامعتبر (جزئیات در `errors[]`)"
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://kiva.ir/problems/validation-error
            title: Validation failed
            status: 400
            code: VALIDATION_ERROR
            message: چند تا از فیلدها رو باید درست کنی
            traceId: 4bf92f3577b34da6
            errors:
              - field: postalCode
                code: PATTERN
                message: کد پستی باید ۱۰ رقم باشه
              - field: recipientPhone
                code: PHONE_INVALID
                message: موبایل معتبر وارد کن
    Unauthorized:
      description: "`UNAUTHORIZED` / `TOKEN_EXPIRED` — نیاز به ورود"
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            status: 401
            code: UNAUTHORIZED
            message: اول وارد حساب کاربریت شو.
    Forbidden:
      description: "`FORBIDDEN` — نقش کافی ندارید"
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: "`NOT_FOUND` (یا کد دقیق‌تر مثل `PRODUCT_NOT_FOUND`، `ORDER_NOT_FOUND`، `TRACKING_NOT_FOUND`)"
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            status: 404
            code: TRACKING_NOT_FOUND
            message: سفارشی با این شماره و موبایل پیدا نکردیم.
    TooManyRequests:
      description: "`RATE_LIMITED` / `OTP_RESEND_TOO_SOON`"
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            status: 429
            code: OTP_RESEND_TOO_SOON
            message: تا ۰۱:۲۷ دیگه می‌تونی دوباره کد بگیری.
            meta: { retryAfterSeconds: 87 }

  # ----------------------------------------------------------------
  schemas:
    # ============ PRIMITIVES ============
    Money:
      type: integer
      format: int64
      minimum: 0
      description: مبلغ به تومان
      example: 1890000
    PhoneNumber:
      type: string
      pattern: '^09\d{9}$'
      description: موبایل ۱۱ رقمی (ورودی با ارقام فارسی هم پذیرفته و نرمال می‌شود)
      example: '09123456789'
    PostalCode:
      type: string
      pattern: '^\d{10}$'
      example: '1965843117'
    OrderCode:
      type: string
      pattern: '^KV-\d{4,8}$'
      description: کد عمومی سفارش
      example: KV-218340
    ColorKey:
      type: string
      pattern: '^[a-z][a-z0-9-]{1,30}$'
      description: کلید پایدار رنگ در پالت
      example: lilac
    Currency:
      type: string
      enum: [IRT]
      description: IRT = تومان
      default: IRT
    IconName:
      type: string
      description: نام آیکن در آیکن‌ست فرانت (`camera`، `truck`، `timer`، `refresh`، `box`، `heart`، ...)
      example: camera
    HtmlString:
      type: string
      description: |
        HTML امن و sanitize‌شده در سرور (فقط تگ‌های `p, b, strong, em, a, ul, ol, li, br, mark, h2, h3, blockquote`).
        `a` فقط با `href`، و فقط به آدرس کامل `http://`/`https://` یا مسیر نسبی‌ای که با یک `/` (نه `//` و نه `/\`) یا `#` شروع
        می‌شود (`/faq#reserve`، `#top`)؛ هر لینک دیگری (`javascript:`، `//evil.com`، `faq`) `href` اش را از دست می‌دهد و متنش می‌ماند.
    Tone:
      type: string
      description: رنگ‌بندی تگ در دیزاین‌سیستم (`tag`, `tag-sale`, `tag-warn`, `tag-success`, `tag-cream`, `tag-dark`, `tag-glass`)
      enum: [DEFAULT, SALE, WARN, SUCCESS, CREAM, DARK, GLASS, DANGER]

    # ============ PAGINATION & ERRORS ============
    PageMeta:
      type: object
      required: [page, size, totalItems, totalPages, hasNext]
      properties:
        page: { type: integer, example: 1 }
        size: { type: integer, example: 24 }
        totalItems: { type: integer, example: 16 }
        totalPages: { type: integer, example: 1 }
        hasNext: { type: boolean, example: false }
    MessageResponse:
      type: object
      required: [message]
      properties:
        message: { type: string, example: عضو خبرنامه کیوا شدی! }
    FieldError:
      type: object
      required: [field, code, message]
      properties:
        field: { type: string, description: 'مسیر فیلد (dot-notation)', example: newAddress.postalCode }
        code:
          type: string
          description: >-
            کد مشکل همین فیلد. فهرست ثابتی ندارد (برخلاف `ErrorCode` که `code` اصلی پاسخ است) و ممکن است کد تازه اضافه شود؛
            برای نمایش، `field` و `message` کافی است.
          example: PATTERN
        message: { type: string, example: کد پستی باید ۱۰ رقم باشه }
        meta:
          type: object
          nullable: true
          description: >-
            داده‌ی کمکی همین خطا، همون عددهایی که `message` ازشون ساخته شده (`min`، `max`، `maxLength`، `maxItems`، `maxDays`، …)؛
            خطای بی‌داده `null`. برای نمایش لازم نیست؛ برای کنار input گذاشتن سقف (از 1.11.1).
          additionalProperties: true
          example: { min: 0, max: 30 }
    Problem:
      type: object
      description: RFC 7807 Problem Details + کد ماشینی کیوا
      required: [status, code, message]
      properties:
        type: { type: string, format: uri, example: 'https://kiva.ir/problems/discount-min-subtotal' }
        title: { type: string, example: Discount minimum subtotal not met }
        status: { type: integer, example: 422 }
        code: { $ref: '#/components/schemas/ErrorCode' }
        message: { type: string, description: پیام فارسی قابل نمایش به کاربر, example: این کد برای خرید بالای ۲٬۰۰۰٬۰۰۰ تومان فعاله }
        detail: { type: string, description: توضیح فنی (فقط در محیط‌های غیر production) }
        instance: { type: string, nullable: true, example: /api/v1/cart/discount-code }
        traceId: { type: string, nullable: true, example: 4bf92f3577b34da6 }
        errors:
          type: array
          nullable: true
          description: فقط برای `VALIDATION_ERROR`؛ در بقیه‌ی خطاها `null`
          items: { $ref: '#/components/schemas/FieldError' }
        meta:
          type: object
          nullable: true
          description: داده‌ی کمکی وابسته به خطا (`minSubtotal`, `availableQuantity`, `attemptsLeft`, `retryAfterSeconds`, `payable`, ...)
          additionalProperties: true
          example: { minSubtotal: 2000000 }
    ErrorCode:
      type: string
      description: کدهای خطای پایدار برای نگاشت رفتار UI (ERROR_BEHAVIOUR در فرانت)
      enum:
        - VALIDATION_ERROR
        - UNAUTHORIZED
        - TOKEN_EXPIRED
        - REFRESH_TOKEN_INVALID
        - FORBIDDEN
        - NOT_FOUND
        - RATE_LIMITED
        - INTERNAL_ERROR
        - CHANGED_BY_SOMEONE_ELSE
        - PHONE_INVALID
        - OTP_INVALID
        - OTP_EXPIRED
        - OTP_TOO_MANY_ATTEMPTS
        - OTP_RESEND_TOO_SOON
        - PHONE_ALREADY_REGISTERED
        - PRODUCT_NOT_FOUND
        - VARIANT_NOT_FOUND
        - PRODUCT_UNAVAILABLE
        - OUT_OF_STOCK
        - QUANTITY_EXCEEDS_STOCK
        - QUANTITY_EXCEEDS_LIMIT
        - CART_NOT_FOUND
        - CART_EMPTY
        - CART_ITEM_NOT_FOUND
        - DISCOUNT_CODE_INVALID
        - DISCOUNT_CODE_EXPIRED
        - DISCOUNT_CODE_NOT_STARTED
        - DISCOUNT_MIN_SUBTOTAL_NOT_MET
        - DISCOUNT_FIRST_ORDER_ONLY
        - DISCOUNT_USAGE_LIMIT_REACHED
        - DISCOUNT_LOGIN_REQUIRED
        - DISCOUNT_NOT_APPLICABLE
        - ADDRESS_NOT_FOUND
        - ADDRESS_LIMIT_REACHED
        - CITY_NOT_IN_PROVINCE
        - SHIPPING_METHOD_UNAVAILABLE
        - MESSENGER_REQUIRED
        - MESSENGER_PHONE_INVALID
        - TERMS_NOT_ACCEPTED
        - PRICE_CHANGED
        - IDEMPOTENCY_KEY_REUSED
        - ORDER_NOT_FOUND
        - ORDER_NOT_CANCELLABLE
        - ORDER_NOT_RETURNABLE
        - RETURN_WINDOW_EXPIRED
        - ORDER_ALREADY_PAID
        - CHANGE_REQUEST_NOT_ALLOWED
        - INVALID_STATUS_TRANSITION
        - PAYMENT_NOT_FOUND
        - PAYMENT_FAILED
        - PAYMENT_EXPIRED
        - PAYMENT_GATEWAY_UNAVAILABLE
        - TRACKING_NOT_FOUND
        - REVIEW_ALREADY_EXISTS
        - REVIEW_NOT_EDITABLE
        - STOCK_ALERT_EXISTS
        - STOCK_ALERT_LIMIT_REACHED
        - STOCK_ALERT_NOT_FOUND
        - CAMPAIGN_OVERLAP
        - IMAGE_REQUIRED
        - SEARCH_QUERY_EMPTY
        - EMAIL_NOT_AVAILABLE
        - REPLY_CHANNEL_REQUIRED
        - REPLY_REQUIRED
        - CTA_INCOMPLETE
        - PRODUCT_IN_STOCK
        - WISHLIST_LIMIT_REACHED
        - WISHLIST_SHARE_DISABLED
        - UPLOAD_TOO_LARGE
        - UPLOAD_TYPE_NOT_ALLOWED
        - DUPLICATE_SLUG
        - DUPLICATE_SKU
        - RESERVATION_UNAVAILABLE
        - ACCOUNT_HAS_ACTIVE_ORDERS
        - STAFF_ACCOUNT_CANNOT_BE_DELETED
        - INVOICE_NOT_AVAILABLE
        - ROLE_CHANGE_NOT_ALLOWED
        - CUSTOMER_DELETED
        # --- پنل ادمین: کلید تکراری (رنگ) ---
        - DUPLICATE_CODE
        # --- پنل ادمین: محصول و رنگ‌هایش ---
        - COLOR_ALREADY_ON_PRODUCT
        - PRODUCT_ARCHIVED
        - PRODUCT_ALREADY_ACTIVE
        - PRODUCT_ALREADY_DRAFT
        - PRODUCT_ALREADY_ARCHIVED
        - VARIANT_ALREADY_ACTIVE
        - VARIANT_ALREADY_INACTIVE
        - INACTIVE_VARIANT_CANNOT_BE_DEFAULT
        - LAST_ACTIVE_VARIANT
        - NO_ACTIVE_VARIANT
        # --- پنل ادمین: حذف دسته، رنگ یا متریالی که محصول دارد (meta.productCount) ---
        - IN_USE
        # --- موجودی و رزرو انبار (فاز سفارش) ---
        - ORDER_ALREADY_SHIPPED
        - RESERVATION_QUANTITY_MISMATCH
        - RESERVATION_NOT_FOUND
        # --- سفارش با مانده‌ی پرداخت بعد از درخواست تغییر (meta.balanceDue) ---
        - BALANCE_DUE
        # --- کار روی سفارش در پنل ---
        - AWAITING_CUSTOMER_FEEDBACK
        - GROUP_NOT_READY
        - PHOTOS_INCOMPLETE
        - REFUND_NOT_FOUND
        - PAYMENT_IN_PROGRESS
        # --- مرجوعی (کدهای فیلدی مثل ITEM_NOT_RETURNABLE و EVIDENCE_REQUIRED فقط در errors[].code می‌آیند) ---
        - RETURN_NOT_FOUND
        - RETURN_REFUND_EXISTS
        - RETURN_REFUND_OPEN
        # --- نظرها (فاز ۸) ---
        - REVIEW_NOT_FOUND
        - REVIEW_PURCHASE_NOT_DELIVERED
        - OWN_REVIEW_VOTE
        # --- بلاگ (فاز ۱۵) ---
        - BLOG_CATEGORY_NOT_FOUND
        - BLOG_AUTHOR_NOT_FOUND
        - BLOG_BLOCK_TYPE_INVALID
        - BLOG_BLOCK_TEXT_OR_HTML
        - BLOG_POST_STATUS_INVALID
        - BLOG_TAG_EMPTY
      example: DISCOUNT_MIN_SUBTOTAL_NOT_MET

    # ============ MEDIA ============
    MediaAsset:
      type: object
      required: [id, type, url]
      properties:
        id: { type: string, pattern: '^med_[0-9A-Za-z]{22}$', example: 'med_5Hq2xT9aLmQ0vB3nR7sK1w' }
        type: { type: string, enum: [IMAGE, VIDEO] }
        url: { type: string, format: uri, example: 'https://cdn.kiva.ir/p/1/lilac/front.webp' }
        thumbnailUrl: { type: string, format: uri, nullable: true, example: 'https://cdn.kiva.ir/p/1/lilac/front_160.webp' }
        srcSet:
          type: array
          description: نسخه‌های ریسپانسیو برای `srcset`
          items:
            type: object
            properties:
              width: { type: integer, example: 640 }
              url: { type: string, format: uri }
        posterUrl: { type: string, format: uri, nullable: true, description: فریم کاور ویدیو }
        width: { type: integer, example: 1200 }
        height: { type: integer, example: 1224 }
        durationSec: { type: integer, nullable: true, description: طول ویدیو (نمایش «ویدیو ۰:۲۴»), example: 24 }
        mimeType: { type: string, example: image/webp }
        alt: { type: string, nullable: true, example: کیف دوشی ماهک رنگ یاسی — نمای جلو }
        blurhash: { type: string, nullable: true, description: placeholder تار برای لود تدریجی, example: 'LKO2?U%2Tw=w]~RBVZRi};RPxuwH' }

    # ============ CATALOG ENUMS ============
    BagType:
      type: string
      description: |
        فرم کیف (برای آیکن/ایلاستریشن و جدول مشخصات پیش‌فرض):
        `HOBO` دوشی هوبو · `CROSSBODY` کراس‌بادی · `BACKPACK` کوله · `SATCHEL` دستی · `CLUTCH` کلاچ/مجلسی · `TOTE` شاپر/توت · `BUCKET` سطلی · `WALLET` کیف پول
      enum: [HOBO, CROSSBODY, BACKPACK, SATCHEL, CLUTCH, TOTE, BUCKET, WALLET]
      example: HOBO
    Occasion:
      type: string
      description: مناسب برای — `DAILY` روزمره · `UNIVERSITY` دانشگاه · `WORK` محل کار · `FORMAL` رسمی · `PARTY` مهمانی/مجالس · `TRAVEL` سفر · `SHOPPING` خرید · `GATHERING` دورهمی
      enum: [DAILY, UNIVERSITY, WORK, FORMAL, PARTY, TRAVEL, SHOPPING, GATHERING]
    MaterialFamily:
      type: string
      enum: [GENUINE_LEATHER, FAUX_LEATHER, CANVAS, SUEDE, FAUX_SUEDE, SATIN, VELVET, COTTON, OTHER]
    ClosureType:
      type: string
      description: زیپ فلزی، زیپ دوطرفه، زیپ + قفل تزئینی، درب مگنتی، دکمه مگنتی، بند کشی، دکمه فلزی، بدون درب
      enum: [ZIPPER, DOUBLE_ZIPPER, ZIPPER_WITH_DECORATIVE_LOCK, MAGNETIC_FLAP, MAGNETIC_SNAP, DRAWSTRING, METAL_BUTTON, OPEN_TOP]
    StrapType:
      type: string
      enum: [SHOULDER, CROSSBODY, TOP_HANDLE, CHAIN, BACKPACK_STRAPS, WRISTLET, NONE]
    MediaView:
      type: string
      description: زاویه‌ی تصویر — `FRONT` نمای جلو · `SIDE` نمای کنار · `BACK` پشت · `DETAIL` جزئیات · `INTERIOR` داخل کیف · `STYLE` استایل/لایف‌استایل · `ON_MODEL` روی مدل · `SCALE` مقایسه‌ی اندازه
      enum: [FRONT, SIDE, BACK, DETAIL, INTERIOR, STYLE, ON_MODEL, SCALE]
    StockStatus:
      type: string
      enum: [IN_STOCK, LOW_STOCK, OUT_OF_STOCK]
    ProductStatus:
      type: string
      enum: [DRAFT, ACTIVE, ARCHIVED]
    FitItem:
      type: string
      description: "[پیشنهادی] چه چیزهایی داخل کیف جا می‌شود (راهنمای اندازه‌ی تصویری)"
      enum: [PHONE, CARDS, KEYS, SUNGLASSES, MAKEUP_POUCH, WATER_BOTTLE, UMBRELLA, A5_NOTEBOOK, A4_DOCUMENTS, TABLET_11, LAPTOP_14]

    # ============ TAXONOMY ============
    Color:
      type: object
      required: [key, name, hex]
      properties:
        key: { $ref: '#/components/schemas/ColorKey' }
        name: { type: string, example: یاسی }
        hex: { type: string, pattern: '^#[0-9A-Fa-f]{6}$', example: '#C8B6E2' }
        isLight:
          type: boolean
          description: رنگ روشن است → تیک انتخاب روی سواچ تیره نمایش داده شود (سفید، کرم، صورتی، یاسی، طوسی)
          example: true
        sortOrder: { type: integer, example: 4 }
        productCount: { type: integer, nullable: true, description: فقط در `/colors` و facets, example: 7 }
    CategoryRef:
      type: object
      required: [id, slug, name]
      properties:
        id: { type: integer, example: 1 }
        slug: { type: string, example: shoulder }
        name: { type: string, example: کیف دوشی }
    Category:
      allOf:
        - $ref: '#/components/schemas/CategoryRef'
        - type: object
          properties:
            description: { type: string, nullable: true, example: کیف‌های دوشی مینیمال برای استفاده‌ی روزمره }
            icon:
              type: object
              description: ایلاستریشن دسته (در طرح فعلی SVG کارتونی بر اساس فرم و رنگ)
              properties:
                bagType: { $ref: '#/components/schemas/BagType' }
                colorKey: { $ref: '#/components/schemas/ColorKey' }
                imageUrl: { type: string, format: uri, nullable: true, description: اگر آیکن عکس/SVG آپلودی باشد }
            imageUrl: { type: string, format: uri, nullable: true }
            productCount: { type: integer, description: «۲ مدل», example: 2 }
            sortOrder: { type: integer, example: 1 }
            showInMenu: { type: boolean, example: true }
            seo: { $ref: '#/components/schemas/SeoMeta' }
    MaterialRef:
      type: object
      required: [id, slug, name]
      properties:
        id: { type: integer, example: 3 }
        slug: { type: string, example: faux-leather-matte }
        name: { type: string, example: چرم مصنوعی مات درجه یک }
        family: { $ref: '#/components/schemas/MaterialFamily' }
    Material:
      allOf:
        - $ref: '#/components/schemas/MaterialRef'
        - type: object
          properties:
            description: { type: string, nullable: true }
            careInstructions:
              type: array
              items: { type: string }
              example: [با دستمال نرم و کمی مرطوب تمیز شود, از الکل و دستمال مرطوب آرایشی استفاده نشود]
            productCount: { type: integer, example: 4 }

    # ============ PRODUCT BUILDING BLOCKS ============
    PriceInfo:
      type: object
      required: [price, currency]
      properties:
        price:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: قیمت فروش فعلی
          example: 1450000
        compareAtPrice:
          type: integer
          allOf: [{ $ref: '#/components/schemas/Money' }]
          nullable: true
          description: قیمت قبل از تخفیف (خط‌خورده)؛ null یعنی تخفیف ندارد
          example: 1750000
        discountPercent: { type: integer, minimum: 0, maximum: 100, description: 'round((1 - price/compareAtPrice) × 100)', example: 17 }
        discountAmount: { allOf: [{ $ref: '#/components/schemas/Money' }], example: 300000 }
        currency: { $ref: '#/components/schemas/Currency' }
    StockInfo:
      type: object
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/StockStatus' }
        availableQuantity:
          type: integer
          nullable: true
          description: فقط وقتی `LOW_STOCK` است مقدار دارد (موجودی دقیق لو نمی‌رود)
          example: 3
        maxOrderQuantity:
          type: integer
          description: سقف انتخاب تعداد = min(موجودی، سقف خرید هر محصول)
          example: 3
        label: { type: string, example: فقط ۳ عدد در انبار باقی مونده }
    ProductBadge:
      type: object
      required: [code, label]
      properties:
        code:
          type: string
          description: '`CAMPAIGN` فعلاً استفاده نمی‌شود (کارت تخفیف‌دار نشان `SALE` دارد؛ کمپین فقط روی صفحه‌ی محصول، `ProductDetail.campaign`)'
          enum: [NEW, SALE, HAS_VIDEO, FREE_SHIPPING, SOLD_OUT, LOW_STOCK, BESTSELLER, HANDMADE, CAMPAIGN]
        label: { type: string, example: ۱۷٪ تخفیف }
        tone: { $ref: '#/components/schemas/Tone' }
        icon: { type: string, allOf: [{ $ref: '#/components/schemas/IconName' }], nullable: true, example: play }
    RatingBrief:
      type: object
      description: 'فقط نظرهای `APPROVED`. `average` = جمع ÷ تعداد، گرد به یک رقم اعشار (نیم رو به بالا)؛ محصول بی‌نظر `{average: 0, count: 0}`'
      required: [average, count]
      properties:
        average: { type: number, format: float, minimum: 0, maximum: 5, example: 4.6 }
        count: { type: integer, example: 21 }
    RatingSummary:
      type: object
      description: |
        فقط نظرهای `APPROVED`. `average` یک رقم اعشار (نیم رو به بالا)؛ `percent` ِ هر ستاره یک رقم اعشار (جمعشان ممکن است دقیقاً ۱۰۰ نشود)؛
        `verifiedBuyerPercent` = گرد ِ «نظرهای خریدار × ۱۰۰ ÷ تعداد». محصول بی‌نظر: `average = 0`، `count = 0`، پنج ردیف صفر و `verifiedBuyerPercent = null`.
      required: [average, count, distribution, verifiedBuyerPercent]
      properties:
        average: { type: number, format: float, example: 4.6 }
        count: { type: integer, description: تعداد نظرات تأییدشده, example: 21 }
        distribution:
          type: array
          description: از ۵ ستاره تا ۱ ستاره
          items:
            type: object
            required: [stars, count, percent]
            properties:
              stars: { type: integer, minimum: 1, maximum: 5, example: 5 }
              count: { type: integer, example: 15 }
              percent: { type: number, example: 71.4 }
        verifiedBuyerPercent: { type: integer, nullable: true, description: '[پیشنهادی]', example: 92 }
    ProductColorOption:
      type: object
      description: سواچ رنگ روی کارت و صفحه‌ی محصول؛ با کلیک روی آن عکس کارت عوض می‌شود
      required: [variantId, color, stockStatus]
      properties:
        variantId: { type: integer, example: 101 }
        color: { $ref: '#/components/schemas/Color' }
        stockStatus: { $ref: '#/components/schemas/StockStatus' }
        imageUrl: { type: string, format: uri, example: 'https://cdn.kiva.ir/p/1/lilac/front_640.webp' }
        thumbnailUrl: { type: string, format: uri, example: 'https://cdn.kiva.ir/p/1/lilac/front_160.webp' }
    ProductRef:
      type: object
      required: [id, slug, name]
      properties:
        id: { type: integer, example: 1 }
        slug: { type: string, example: mahak-shoulder-bag }
        sku: { type: string, example: KV-1001 }
        name: { type: string, example: کیف دوشی ماهک }
        imageUrl: { type: string, format: uri }
        colorKey: { type: string, allOf: [{ $ref: '#/components/schemas/ColorKey' }], nullable: true }
    ProductSummary:
      type: object
      description: کارت محصول (گرید فروشگاه، اسکرول افقی خانه، محصولات مشابه، علاقه‌مندی‌ها، سبد خالی)
      required: [id, slug, sku, name, category, price, colors, defaultColorKey, image, stock, badges]
      properties:
        id: { type: integer, example: 1 }
        slug: { type: string, example: mahak-shoulder-bag }
        sku: { type: string, description: کد محصول قابل نمایش, example: KV-1001 }
        name: { type: string, example: کیف دوشی ماهک }
        url: { type: string, example: /product/mahak-shoulder-bag }
        category: { $ref: '#/components/schemas/CategoryRef' }
        bagType: { $ref: '#/components/schemas/BagType' }
        price: { $ref: '#/components/schemas/PriceInfo' }
        colors:
          type: array
          description: همه‌ی رنگ‌ها به ترتیب نمایش (کارت ۵ تای اول + «+n»)
          items: { $ref: '#/components/schemas/ProductColorOption' }
        colorsCount: { type: integer, example: 4 }
        defaultColorKey:
          allOf: [{ $ref: '#/components/schemas/ColorKey' }]
          nullable: true
          description: فقط برای محصول بدون رنگ فعال (پیش‌نویس در پنل) `null` است؛ در فروشگاه هیچ‌وقت `null` نیست
        displayColorKey:
          allOf: [{ $ref: '#/components/schemas/ColorKey' }]
          nullable: true
          description: |
            رنگی که عکس کارت با آن نمایش داده شود (اگر فیلتر رنگ فعال باشد = اولین رنگ منطبق).
            فقط برای محصول بدون رنگ فعال (پیش‌نویس در پنل) `null` است؛ در فروشگاه هیچ‌وقت `null` نیست
        image:
          allOf: [{ $ref: '#/components/schemas/MediaAsset' }]
          nullable: true
          description: عکس کارت (همیشه فرستاده می‌شود)؛ تا وقتی عکسی آپلود نشده `null` است و کلاینت ایلاستریشن کیف را نشان می‌دهد
        hoverImage:
          type: object
          allOf: [{ $ref: '#/components/schemas/MediaAsset' }]
          nullable: true
          description: "[پیشنهادی] تصویر دوم برای hover کارت"
        badges:
          type: array
          items: { $ref: '#/components/schemas/ProductBadge' }
        stock: { $ref: '#/components/schemas/StockInfo' }
        isNew: { type: boolean, example: true }
        hasVideo: { type: boolean, example: true }
        rating: { allOf: [{ $ref: '#/components/schemas/RatingBrief' }], description: 'همیشه فرستاده می‌شود (بی‌نظر: صفر)' }
        soldCount: { type: integer, description: «۱۸۴ فروش موفق», example: 184 }
        freeShippingEligible: { type: boolean, description: قیمت ≥ آستانه‌ی ارسال رایگان, example: false }
        isWishlisted: { type: boolean, nullable: true, description: 'کاربر واردشده روی endpoint ِ بدون کش: `true`/`false`؛ مهمان، و پاسخ‌های کش‌شده‌ی عمومی (`/home`) همیشه: `null` (فرانت از `GET /me/wishlist/ids` استفاده می‌کند)' }
    ProductMedia:
      allOf:
        - $ref: '#/components/schemas/MediaAsset'
        - type: object
          properties:
            view: { allOf: [{ $ref: '#/components/schemas/MediaView' }], nullable: true }
            viewLabel: { type: string, nullable: true, example: نمای جلو }
            sortOrder: { type: integer, example: 0 }
            isPrimary: { type: boolean, example: true }
            isUnedited: { type: boolean, description: «عکس واقعی، بدون ادیت», default: true }
    ProductVariant:
      type: object
      description: هر رنگ یک ورینت با SKU، قیمت، موجودی و گالری اختصاصی خودش
      required: [id, sku, color, price, stock, media]
      properties:
        id: { type: integer, example: 101 }
        sku: { type: string, example: KV-1001-LILAC }
        color: { $ref: '#/components/schemas/Color' }
        isDefault: { type: boolean, example: false }
        price: { $ref: '#/components/schemas/PriceInfo' }
        stock: { $ref: '#/components/schemas/StockInfo' }
        media:
          type: array
          description: گالری این رنگ به ترتیب (thumbnailها + عکس اصلی). ویدیوها هم با `type = VIDEO` در همین لیست هستند.
          items: { $ref: '#/components/schemas/ProductMedia' }
        hasVideo: { type: boolean, example: true }
        stockAlertSubscribed: { type: boolean, nullable: true, description: 'کاربر واردشده برای همین رنگ اشتراک `ACTIVE` دارد؛ مهمان `false`' }
    ProductDimensions:
      type: object
      description: ابعاد (طول × ارتفاع × عرض) به سانتی‌متر
      required: [lengthCm, heightCm, widthCm]
      properties:
        lengthCm: { type: number, example: 34 }
        heightCm: { type: number, example: 26 }
        widthCm: { type: number, example: 12 }
    StrapInfo:
      type: object
      properties:
        type: { $ref: '#/components/schemas/StrapType' }
        label: { type: string, example: بند دوشی ثابت ۵۵ سانتی‌متر }
        lengthCm: { type: number, nullable: true, example: 55 }
        minLengthCm: { type: number, nullable: true }
        maxLengthCm: { type: number, nullable: true, example: 120 }
        adjustable: { type: boolean, example: false }
        detachable: { type: boolean, example: false }
        material: { type: string, nullable: true, example: زنجیر فلزی طلایی }
    PocketInfo:
      type: object
      properties:
        internal: { type: integer, example: 1 }
        internalZip: { type: integer, example: 1 }
        external: { type: integer, example: 0 }
        phone: { type: integer, example: 2 }
        cardSlots: { type: integer, example: 0 }
        billSlots: { type: integer, example: 0 }
        coinPocket: { type: boolean, example: false }
        detachablePouch: { type: boolean, example: false }
        laptopSleeve: { type: boolean, example: false }
        summary: { type: string, example: '۱ جیب زیپ‌دار داخلی، ۲ جیب موبایل' }
    ProductSpecs:
      type: object
      description: مشخصات ساختاریافته (برای فیلتر، مقایسه و SEO). نسخه‌ی آماده‌ی نمایش در `specTable` است.
      properties:
        dimensions: { allOf: [{ $ref: '#/components/schemas/ProductDimensions' }], nullable: true }
        weightGrams: { type: integer, nullable: true, example: 650 }
        closure:
          type: object
          nullable: true
          properties:
            type: { $ref: '#/components/schemas/ClosureType' }
            label: { type: string, example: زیپ فلزی }
        straps:
          type: array
          nullable: true
          items: { $ref: '#/components/schemas/StrapInfo' }
        pockets: { allOf: [{ $ref: '#/components/schemas/PocketInfo' }], nullable: true }
        laptopMaxInch: { type: number, nullable: true, description: جای لپ‌تاپ تا (اینچ), example: 14 }
        capacityLiters: { type: number, nullable: true, description: '[پیشنهادی] حجم', example: 9.5 }
        waterproof: { type: boolean, example: false }
        occasions:
          type: array
          items:
            type: object
            properties:
              code: { $ref: '#/components/schemas/Occasion' }
              label: { type: string, example: دانشگاه }
        fits:
          type: array
          description: '[پیشنهادی] راهنمای «چی توش جا می‌شه؟»'
          items: { $ref: '#/components/schemas/FitItem' }
        lining:
          type: object
          nullable: true
          properties:
            material: { type: string, example: آستر ضدلک }
            color: { type: string, example: یاسی کیوا }
        hardware:
          type: object
          nullable: true
          properties:
            material: { type: string, example: فلز ضدزنگ }
            finish: { type: string, example: طلایی مات }
        stitching: { type: string, nullable: true, example: دوخت دولایه و لبه‌دوزی دستی }
        handmade: { type: boolean, example: false }
        madeIn: { type: string, example: ایران }
        careInstructions:
          type: array
          items: { type: string }
        warranty:
          type: object
          nullable: true
          description: '[پیشنهادی] ضمانت دوخت/یراق'
          properties:
            months: { type: integer, example: 6 }
            description: { type: string, example: ضمانت ۶ ماهه‌ی دوخت و یراق‌آلات }
    SpecRow:
      type: object
      description: یک ردیف جدول تب «مشخصات» به ترتیب نمایش (جنس، ابعاد، وزن، نوع بسته شدن، بند و دسته، جیب‌ها، رنگ‌های موجود، مناسب برای، دسته‌بندی، کد محصول، موجودی انبار)
      required: [key, label, value]
      properties:
        key:
          type: string
          enum: [MATERIAL, DIMENSIONS, WEIGHT, CLOSURE, STRAP, POCKETS, COLORS, OCCASIONS, CATEGORY, SKU, STOCK, LAPTOP, WATERPROOF, LINING, HARDWARE, MADE_IN, WARRANTY]
        label: { type: string, example: ابعاد (طول × ارتفاع × عرض) }
        value: { type: string, example: ۳۴ × ۲۶ × ۱۲ سانتی‌متر }
        swatches:
          type: array
          nullable: true
          description: فقط برای ردیف رنگ‌ها
          items: { $ref: '#/components/schemas/Color' }
        tone: { type: string, allOf: [{ $ref: '#/components/schemas/Tone' }], nullable: true, description: 'مثلاً DANGER برای «فقط ۳ عدد باقی مانده»' }
    Breadcrumb:
      type: object
      required: [label]
      properties:
        label: { type: string, example: کیف دوشی }
        url: { type: string, nullable: true, example: '/products?category=shoulder' }
    SeoMeta:
      type: object
      properties:
        title: { type: string, example: کیف دوشی ماهک | کیوا }
        description: { type: string, nullable: true, maxLength: 170 }
        canonicalUrl: { type: string, format: uri, example: 'https://kiva.ir/product/mahak-shoulder-bag' }
        ogImageUrl: { type: string, format: uri }
        noIndex: { type: boolean, default: false }
        jsonLd:
          type: object
          description: داده‌ی ساختاریافته‌ی schema.org (Product/Offer/AggregateRating یا Article)
          additionalProperties: true
    Perk:
      type: object
      properties:
        icon: { $ref: '#/components/schemas/IconName' }
        title: { type: string, example: رزرو ۴ روزه }
        subtitle: { type: string, example: یکجا تحویل بگیر }
    ProductPolicies:
      type: object
      properties:
        returnable: { type: boolean, example: true }
        returnWindowDays: { type: integer, example: 7 }
        reservable: { type: boolean, example: true }
        reservationDays: { type: integer, example: 4 }
        preShipmentPhoto: { type: boolean, description: امضای کیوا, example: true }
        maxPerOrder: { type: integer, example: 5 }
    ProductDetail:
      description: صفحه‌ی جزئیات محصول
      allOf:
        - $ref: '#/components/schemas/ProductSummary'
        - type: object
          required: [variants, specTable, breadcrumbs, ratingSummary]
          properties:
            selectedColorKey:
              allOf: [{ $ref: '#/components/schemas/ColorKey' }]
              description: رنگ انتخاب‌شده (از `?color=` یا پیش‌فرض)
            shortDescription: { type: string, nullable: true }
            description:
              allOf: [{ $ref: '#/components/schemas/HtmlString' }]
              nullable: true
              description: متن تب «توضیحات»
              example: '<p>کیف دوشی ماهک با چرم مصنوعی مات درجه یک، دوخت دقیق و یراق‌آلات مقاوم...</p>'
            highlights:
              type: array
              description: بولت‌های «چرا ماهک؟»
              items: { type: string }
              example: [چرم مصنوعی مات درجه یک با دوخت دولایه و لبه‌دوزی دستی, یراق‌آلات فلزی ضدزنگ با روکش طلایی مات, آستر داخلی ضدلک با رنگ یاسی کیوا]
            material: { $ref: '#/components/schemas/MaterialRef' }
            materialDescription: { type: string, nullable: true, example: چرم مصنوعی مات درجه یک }
            specs: { $ref: '#/components/schemas/ProductSpecs' }
            specTable:
              type: array
              items: { $ref: '#/components/schemas/SpecRow' }
            variants:
              type: array
              items: { $ref: '#/components/schemas/ProductVariant' }
            breadcrumbs:
              type: array
              items: { $ref: '#/components/schemas/Breadcrumb' }
              example:
                - { label: خانه, url: / }
                - { label: فروشگاه, url: /products }
                - { label: کیف دوشی, url: '/products?category=shoulder' }
                - { label: کیف دوشی ماهک, url: null }
            ratingSummary: { $ref: '#/components/schemas/RatingSummary' }
            policies: { $ref: '#/components/schemas/ProductPolicies' }
            perks:
              type: array
              description: «ارسال سریع / رزرو ۴ روزه / ۷ روز بازگشت»
              items: { $ref: '#/components/schemas/Perk' }
            tags:
              type: array
              items: { type: string }
              example: [مینیمال, روزمره]
            campaign:
              type: object
              nullable: true
              description: 'وقتی محصول در مجموعه‌ی کمپین فعال است و تخفیف دارد (برای شمارنده روی صفحه‌ی محصول)، وگرنه `null`'
              required: [slug, title, endsAt]
              properties:
                slug: { type: string }
                title: { type: string }
                endsAt: { type: string, format: date-time }
            stockAlert:
              type: object
              nullable: true
              description: 'اشتراک `ACTIVE` ِ «هر رنگی» ِ کاربر واردشده برای این محصول؛ مهمان: `{subscribed: false, alertId: null}`'
              required: [subscribed, alertId]
              properties:
                subscribed: { type: boolean }
                alertId: { type: integer, nullable: true }
            shareUrl: { type: string, format: uri, description: 'همان `seo.canonicalUrl` (مسیر `product/{slug}`)', example: 'https://kiva.ir/product/mahak-shoulder-bag' }
            seo: { $ref: '#/components/schemas/SeoMeta' }
            publishedAt: { type: string, format: date-time, nullable: true }
            updatedAt: { type: string, format: date-time }

    # ============ LISTING ============
    AppliedFilter:
      type: object
      description: چیپ فیلتر فعال (با کلیک حذف می‌شود)
      required: [key, label]
      properties:
        key: { type: string, enum: [q, category, color, price, onSale, inStock, isNew, hasVideo, bagType, material, occasion, campaign] }
        value: { type: string, nullable: true, example: lilac }
        label: { type: string, example: یاسی }
        swatchHex: { type: string, nullable: true, example: '#C8B6E2' }
    FacetOption:
      type: object
      required: [value, label, count]
      properties:
        value: { type: string, example: shoulder }
        label: { type: string, example: کیف دوشی }
        count: { type: integer, example: 2 }
        selected: { type: boolean, example: false }
        hex: { type: string, nullable: true, description: فقط برای رنگ‌ها }
    ProductFacets:
      type: object
      properties:
        categories:
          type: array
          items: { $ref: '#/components/schemas/FacetOption' }
        colors:
          type: array
          items: { $ref: '#/components/schemas/FacetOption' }
        materials:
          type: array
          items: { $ref: '#/components/schemas/FacetOption' }
        bagTypes:
          type: array
