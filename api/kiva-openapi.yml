  /blog/categories:
    get:
      tags: [Blog]
      operationId: listBlogCategories
      summary: "دسته‌بندی‌های مجله (چیپ‌های بالای صفحه)"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/BlogCategory' }
  /blog/posts:
    get:
      tags: [Blog]
      operationId: listBlogPosts
      summary: "لیست مقاله‌ها + مقاله‌ی منتخب سردبیر"
      description: "`featured` فقط در صفحه‌ی اول و وقتی با فیلتر فعلی منطبق باشد برگردانده می‌شود و از `items` حذف است."
      parameters:
