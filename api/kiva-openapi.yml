        - name: tag
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/Page'
        - name: size
          in: query
          schema: { type: integer, minimum: 1, maximum: 30, default: 9 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BlogPostListResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
  /blog/posts/{idOrSlug}:
    get:
      tags: [Blog]
      operationId: getBlogPost
      summary: "مقاله با بلوک‌های محتوا (تیتر، پاراگراف، نقل‌قول، نکته‌ی کیوا، محصول درون‌متنی) و فهرست مطالب"
      parameters:
        - name: idOrSlug
          in: path
          required: true
          schema: { type: string, example: bag-by-body-shape }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BlogPostDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
  /blog/posts/{postId}/related:
    get:
      tags: [Blog]
      operationId: getRelatedBlogPosts
      summary: "مقاله‌های مرتبط (اول هم‌دسته)"
      parameters:
        - name: postId
          in: path
          required: true
          schema: { type: integer }
        - name: limit
          in: query
          schema: { type: integer, default: 3, maximum: 12 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/BlogPostSummary' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
  /blog/posts/{postId}/feedback:
    post:
      tags: [Blog]
      operationId: sendBlogFeedback
      summary: "«این مطلب مفید بود؟» آره / نه چندان"
      security: [{}, { bearerAuth: [] }]
      parameters:
        - name: postId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [helpful]
              properties:
                helpful: { type: boolean }
                comment: { type: string, maxLength: 300, description: "[پیشنهادی] توضیح وقتی مفید نبود" }
