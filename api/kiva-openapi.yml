  # ================================================================
  #  CONTENT: FAQ / CONTACT / NEWSLETTER / PAGES
  # ================================================================
  /faq:
    get:
      tags: [Content]
      operationId: getFaq
      summary: "سوالات متداول گروه‌بندی‌شده (با جستجو)"
      description: |
        گروه‌ها با `id` برای لینک مستقیم (`faq#reserve`، `faq#return`، `faq#shipping`) استفاده می‌شوند.
        با `q` فقط سوال‌هایی که در متن سوال یا متن ساده‌ی جواب (بدون تگ) شامل عبارت هستند برگردانده می‌شوند، و فقط گروه‌هایی که
        سوال جور دارند؛ `questionHighlighted`/`answerHighlighted` با `<mark>` پر می‌شوند. تطابق حرف‌به‌حرف و بی‌حساس به
        `ي`/`ی`، `ك`/`ک`، رقم فارسی و لاتین و حروف بزرگ و کوچک است؛ فاصله‌های اضافه‌ی `q` حذف می‌شوند. `q` ِ خالی یعنی بی `q`؛
        بیشتر از ۱۰۰ حرف ← `400 TEXT_TOO_LONG` روی `q`. بی نتیجه: `groups: []` و `emptyMessage`.
        با `ETag` و `Cache-Control: public, max-age=300` کش می‌شود.
      parameters:
        - name: q
          in: query
          schema: { type: string, maxLength: 100, example: رزرو }
      responses:
        '200':
          description: OK
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FaqResponse' }
        '304':
          description: تغییری نکرده (`If-None-Match` همان `ETag` فعلی است)؛ بدون بدنه
        '400': { $ref: '#/components/responses/ValidationError' }
