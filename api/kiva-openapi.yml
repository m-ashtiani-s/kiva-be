  # ================================================================
  #  ADMIN — CONTENT
  # ================================================================
  /admin/blog/posts:
    post:
      tags: [Admin · Content]
      x-roles: [ADMIN, CONTENT_EDITOR]
      operationId: adminCreateBlogPost
      summary: "ساخت مقاله"
      description: |
        شکل (همه‌ی خطاها با هم، با مسیر فیلد): `title` ۱ تا ۱۲۰؛ `slug` مثل slug ِ محصول (حداقل یک حرف) و حداکثر ۱۰۰؛ `excerpt` حداکثر ۳۰۰
        (خالی ← ۱۶۰ نویسه‌ی اول `lead` یا اولین پاراگراف)؛ `lead` متن ساده حداکثر ۶۰۰؛ `coverBackground` `#RRGGBB`؛ `readingMinutes` ۱ تا ۶۰ یا
        `null` (خودکار: کلمه‌های `lead` و بلوک‌ها ÷ ۲۰۰، حداقل ۱)؛ `tags` حداکثر ۱۰ تا، هر کدام ۱ تا ۳۰ (نرمال‌شده، تکراری حذف)؛ `seo.title` ≤ ۷۰ و
        `seo.description` ≤ ۱۷۰ (`canonicalUrl`، `ogImageUrl` و `jsonLd` ِ ورودی نادیده: سرور می‌سازد).
        `blocks` ۱ تا ۱۰۰؛ از هر بلوک فقط فیلدهای نوع خودش نگه داشته می‌شود: `HEADING` `text` ۱ تا ۱۲۰؛ `PARAGRAPH` دقیقاً یکی از `text`
        (متن ساده ≤ ۲۰۰۰) یا `html` (`HtmlString`، پاک‌شده ≤ ۵۰۰۰؛ هر دو ← `BLOG_BLOCK_TEXT_OR_HTML`)؛ `QUOTE` `text` ۱ تا ۵۰۰؛ `TIP` `title` ≤ ۶۰
        (خالی ← «نکته کیوا») و `text` یا `html` مثل پاراگراف؛ `PRODUCT` `productId` ِ محصولی که در فروشگاه است (وگرنه `PRODUCT_NOT_FOUND`)؛
        `IMAGE` `imageMediaId` (purpose ِ `BLOG`، فقط عکس) و `text` ِ اختیاری ≤ ۲۰۰ به‌عنوان زیرنویس؛ `LIST` `items` ۱ تا ۲۰، هر کدام ۱ تا ۳۰۰.
        خطای هر بلوک روی `blocks.{i}.{field}`؛ `anchor` ِ تیترها را سرور می‌سازد (`s0`، `s1`، …).
        بعد: `categoryId` ناموجود ← `400 BLOG_CATEGORY_NOT_FOUND`؛ `authorId` (نیامده ← نویسنده‌ی پیش‌فرض) ناموجود ← `400 BLOG_AUTHOR_NOT_FOUND`؛
        کاور و عکس‌ها ← `400 MEDIA_*`؛ slug ِ گرفته‌شده (به‌جز خود همین مقاله) ← `409 DUPLICATE_SLUG`.
        وضعیت: نیامده ← `DRAFT`. دیده شدن = `PUBLISHED` و `publishedAt ≤ الان`. `PUBLISHED` بدون `publishedAt` ← الان (یا همان تاریخ قبلی، اگر
        مقاله از قبل منتشر بوده)؛ `publishedAt` ِ آینده = زمان‌بندی (`scheduled = true`). `ARCHIVED` پنهان ولی نگه داشته.
        `isFeatured = true` منتخب ِ قبلی را برمی‌دارد (همیشه حداکثر یکی). `PUT` جایگزینی کامل است.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BlogPostUpsertRequest' }
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminBlogPost' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: "`DUPLICATE_SLUG`"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    get:
      tags: [Admin · Content]
      x-roles: [ADMIN, CONTENT_EDITOR]
      operationId: adminListBlogPosts
      summary: "همه‌ی مقاله‌ها برای پنل (پیش‌نویس، زمان‌بندی‌شده، منتشرشده، بایگانی)"
      description: |
        جدیدترین ویرایش (`updatedAt`) اول. `status` یکی از سه وضعیت؛ `q` همان جستجوی متن ِ `GET /blog/posts`؛ `category` = slug.
        هر ردیف `AdminBlogPost` **بدون محتوا** است (`blocks` و `toc` خالی، برای سبکی)؛ برای فرم ویرایش `GET /admin/blog/posts/{postId}`.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [DRAFT, PUBLISHED, ARCHIVED] }
          description: 'ناشناخته ← `400 BLOG_POST_STATUS_INVALID`'
        - name: q
          in: query
          schema: { type: string, maxLength: 100 }
        - name: category
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AdminBlogPost' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/blog/posts/{postId}:
