ktor {
  deployment {
    port = 8080
    port = ${?PORT}
  }
  application {
    modules = [com.kiva.infrastructure.ApplicationKt.module]
  }
}

kiva {
  # Defaults are for local development only.
  # On the server, set them through environment variables; real passwords never go into git.
  datasource {
    url = "jdbc:postgresql://localhost:5432/kiva"
    url = ${?KIVA_DB_URL}
    username = "kiva"
    username = ${?KIVA_DB_USER}
    password = "kiva"
    password = ${?KIVA_DB_PASSWORD}
    maxPoolSize = 10
  }
}
