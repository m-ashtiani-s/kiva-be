ktor {
  deployment {
    port = 8080
    port = ${?PORT}
  }
  application {
    modules = [com.kiva.infrastructure.ApplicationKt.start]
  }
}

kiva {
  # Defaults are for local development only.
  # On the server, set them through environment variables; real passwords never go into git.
  datasource {
    url = "jdbc:postgresql://localhost:5432/kiva"
    url = ${?KIVA_DB_URL}
    username = "kiva"
    username = ${?KIVA_DB_USER}
    password = "kiva"
    password = ${?KIVA_DB_PASSWORD}
    maxPoolSize = 10
  }

  # Which frontends may call the API from a browser (CORS), as full origins: scheme, host and port, no path.
  # Comma-separated. Defaults are the local dev servers (3100 is kiva-fe's own, 3200 the admin panel's); on the server set
  # KIVA_ALLOWED_ORIGINS (e.g. "https://kiva.ir,https://www.kiva.ir,https://admin.kiva.ir"). Never "*": the API takes logins and payments.
  http {
    allowedOrigins = "http://localhost:3100,http://127.0.0.1:3100,http://localhost:3200,http://127.0.0.1:3200,http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000"
    allowedOrigins = ${?KIVA_ALLOWED_ORIGINS}
    # 1 behind our nginx on the server; 0 everywhere else, so a made-up X-Forwarded-For can't change the client's address.
    trustedProxyHops = 0
    trustedProxyHops = ${?KIVA_TRUSTED_PROXY_HOPS}
  }

  auth {
    # Two secrets, each base64 of at least 32 random bytes (`openssl rand -base64 32`), different from each other.
    # No defaults: without them the app refuses to start. In development, set them once in IntelliJ's Run configuration.
    # The key of the login codes' HMAC.
    otpPepper = ${?KIVA_OTP_PEPPER}
    # The key access tokens are signed with.
    jwtSecret = ${?KIVA_JWT_SECRET}
    # The shop's cap on SMS in an hour, all phones together, against someone sending codes to thousands of numbers.
    maxSmsPerHour = 300
    # Becomes ADMIN on startup, only while no ADMIN exists at all. Set it for the very first start, then remove it.
    bootstrapAdminPhone = ${?KIVA_BOOTSTRAP_ADMIN_PHONE}
  }

  blog {
    # base64 of at least 32 random bytes (`openssl rand -base64 32`), its own secret. No default: without it the app
    # refuses to start. The key a guest's address is hashed with before a «مفید بود؟» vote is kept; the address itself never is.
    voterPepper = ${?KIVA_BLOG_VOTER_PEPPER}
  }

  sms {
    # "log" writes codes to the log instead of sending them: development only. "faraz" sends through Faraz SMS
    # (farazsms.com, web service at api.iranpayamak.com), with patterns approved in its panel.
    provider = "log"
    provider = ${?KIVA_SMS_PROVIDER}
    faraz {
      baseUrl = "https://api.iranpayamak.com"
      baseUrl = ${?KIVA_FARAZ_BASE_URL}
      # The panel's access key; required with provider = faraz. A secret: never in git, never in a log.
      apiKey = ${?KIVA_FARAZ_API_KEY}
      # The line pattern SMS go from (the panel's «خطوط»).
      lineNumber = "90008361"
      lineNumber = ${?KIVA_FARAZ_LINE_NUMBER}
      # «کد ورود: %code% / وبسایت کیوا»: login and phone-change codes. Its variable is "code".
      codePattern = "vdXmsAfAQs"
      codePattern = ${?KIVA_FARAZ_CODE_PATTERN}
      # Optional, until their patterns are approved: «your account moved» (variable "ending", the new number's last 4
      # digits) and «پرداخت موفق» (variable "order", the order's code). Without one, that SMS isn't sent (a WARN says so).
      phoneChangedPattern = ${?KIVA_FARAZ_PHONE_CHANGED_PATTERN}
      orderPaidPattern = ${?KIVA_FARAZ_ORDER_PAID_PATTERN}
      # The order's SMS as staff work on it (phase 2), each optional until its pattern is approved; each variable "order" (the
      # order's code), «ارسال شد» also "carrier" and "tracking".
      photosSentPattern = ${?KIVA_FARAZ_PHOTOS_SENT_PATTERN}
      refundCompletedPattern = ${?KIVA_FARAZ_REFUND_COMPLETED_PATTERN}
      orderCancelledPattern = ${?KIVA_FARAZ_ORDER_CANCELLED_PATTERN}
      orderShippedPattern = ${?KIVA_FARAZ_ORDER_SHIPPED_PATTERN}
      orderDeliveredPattern = ${?KIVA_FARAZ_ORDER_DELIVERED_PATTERN}
      # «درخواستت بررسی شد» when staff resolve a change request (phase 3); variable "order", never the note.
      changeResolvedPattern = ${?KIVA_FARAZ_CHANGE_RESOLVED_PATTERN}
      # A return's steps (phase 7): approved, turned down, collected, closed; variable "code" (the return's, RT-1012), the
      # pickup also "carrier". Never the reason: it is on the return's page.
      returnApprovedPattern = ${?KIVA_FARAZ_RETURN_APPROVED_PATTERN}
      returnRejectedPattern = ${?KIVA_FARAZ_RETURN_REJECTED_PATTERN}
      returnPickupPattern = ${?KIVA_FARAZ_RETURN_PICKUP_PATTERN}
      returnClosedPattern = ${?KIVA_FARAZ_RETURN_CLOSED_PATTERN}
      # «موجود شد» (phase 10): variables "product" (at most 30 characters) and "link". Without it the job tells nobody.
      backInStockPattern = ${?KIVA_FARAZ_BACK_IN_STOCK_PATTERN}
      # «پشتیبانی رسیدگی کرد» (phase 13): variable "code" (the contact message's, CT-482113). Never the reply's text.
      contactRepliedPattern = ${?KIVA_FARAZ_CONTACT_REPLIED_PATTERN}
    }
  }

  email {
    # "log" (the default) writes to whom (masked) and the subject, never the text, and sends nothing; "smtp" sends through
    # the server below (phase 13). The app works without a provider: replies by email and welcome mails are then only logged.
    provider = "log"
    provider = ${?KIVA_EMAIL_PROVIDER}
    smtp {
      # Required with provider = smtp.
      host = ${?KIVA_SMTP_HOST}
      port = 587
      port = ${?KIVA_SMTP_PORT}
      # Optional together: the login. The password is a secret: never in git, never in a log.
      username = ${?KIVA_SMTP_USERNAME}
      password = ${?KIVA_SMTP_PASSWORD}
      # Required with provider = smtp: the sender, a bare address (noreply@kivashop.ir).
      from = ${?KIVA_SMTP_FROM}
      # STARTTLS required; false only for a local test server.
      startTls = true
      startTls = ${?KIVA_SMTP_STARTTLS}
    }
  }

  # The shop's rules (shipping costs, free shipping, payment gateways, ...) live in the database (shopsettings_tbl),
  # so the admin panel can change them without a restart.
  shop {
    # The shop's own address, for the canonical and share links of pages.
    siteUrl = "https://kiva.ir"
    siteUrl = ${?KIVA_SITE_URL}
  }

  payment {
    # "fake" (development: a page on this server plays the bank, no money moves) or "zarinpal" (the server; needs
    # KIVA_ZARINPAL_MERCHANT_ID, and KIVA_ZARINPAL_SANDBOX=false for real money).
    # Fake writes a WARN on startup.
    provider = "fake"
    provider = ${?KIVA_PAYMENT_PROVIDER}
    # This API's public address, without a / at the end: the gateway sends the shopper back to
    # {callbackBaseUrl}/api/v1/payment-callbacks/... On the server https://api.kiva.ir; its domain must be the one
    # registered with Zarinpal.
    callbackBaseUrl = "http://localhost:8080"
    callbackBaseUrl = ${?KIVA_API_PUBLIC_URL}
    # The frontend's page that shows how the payment went; ?paymentId=... is added. On the server https://kiva.ir/checkout/result.
    resultUrl = "http://localhost:3100/checkout/result"
    resultUrl = ${?KIVA_PAYMENT_RESULT_URL}
    zarinpal {
      # 36 characters, from the Zarinpal panel; required with provider = zarinpal. A secret: never in git, never in a log.
      merchantId = ${?KIVA_ZARINPAL_MERCHANT_ID}
      # Zarinpal's test host; false on the server.
      sandbox = true
      sandbox = ${?KIVA_ZARINPAL_SANDBOX}
    }
  }

  # Expiring unpaid orders (every minute), reconciling payments (every 2 minutes), and the clean-ups of guests' carts
  # (daily, 04:00 Tehran) and of Idempotency-Keys (hourly). Always on, on the server too: without them an unpaid order
  # holds its stock for good. Off only to look at something by hand.
  jobs {
    enabled = true
    enabled = ${?KIVA_JOBS_ENABLED}
  }

  # Uploaded photos and videos (POST /admin/media). Processed with libvips and ffmpeg (on the server: apt install
  # libvips-tools ffmpeg; on a Windows machine: their official zips, and the full paths below).
  media {
    # Where processed files live. On the server /var/lib/kiva/media (owner kiva, 750).
    root = "build/media"
    root = ${?KIVA_MEDIA_ROOT}
    # Public base of the files, without a / at the end; only relative paths are stored, so this can change later.
    publicBaseUrl = "http://localhost:8080/media"
    publicBaseUrl = ${?KIVA_MEDIA_PUBLIC_URL}
    # true only in development: the app serves /media itself. On the server nginx does.
    serveLocally = true
    serveLocally = ${?KIVA_MEDIA_SERVE_LOCALLY}
    vipsBin = "vips"
    vipsBin = ${?KIVA_VIPS_BIN}
    ffmpegBin = "ffmpeg"
    ffmpegBin = ${?KIVA_FFMPEG_BIN}
  }

  # Fills the catalog with the prototype's 16 products, through the use cases like real data. Skips what is there.
  # Local development only: off unless KIVA_SEED_ENABLED=true, so a server never gets made-up products.
  seed {
    enabled = false
    enabled = ${?KIVA_SEED_ENABLED}
  }
}
