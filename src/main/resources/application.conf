ktor {
  deployment {
    port = 8080
    port = ${?PORT}
  }
  application {
    modules = [com.kiva.infrastructure.ApplicationKt.start]
  }
}

kiva {
  # Defaults are for local development only.
  # On the server, set them through environment variables; real passwords never go into git.
  datasource {
    url = "jdbc:postgresql://localhost:5432/kiva"
    url = ${?KIVA_DB_URL}
    username = "kiva"
    username = ${?KIVA_DB_USER}
    password = "kiva"
    password = ${?KIVA_DB_PASSWORD}
    maxPoolSize = 10
  }

  # Which frontends may call the API from a browser (CORS), as full origins: scheme, host and port, no path.
  # Comma-separated. Defaults are the local dev servers (3100 is kiva-fe's own, 3200 the admin panel's); on the server set
  # KIVA_ALLOWED_ORIGINS (e.g. "https://kiva.ir,https://www.kiva.ir,https://admin.kiva.ir"). Never "*": the API takes logins and payments.
  http {
    allowedOrigins = "http://localhost:3100,http://127.0.0.1:3100,http://localhost:3200,http://127.0.0.1:3200,http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000"
    allowedOrigins = ${?KIVA_ALLOWED_ORIGINS}
    # 1 behind our nginx on the server; 0 everywhere else, so a made-up X-Forwarded-For can't change the client's address.
    trustedProxyHops = 0
    trustedProxyHops = ${?KIVA_TRUSTED_PROXY_HOPS}
  }

  auth {
    # Two secrets, each base64 of at least 32 random bytes (`openssl rand -base64 32`), different from each other.
    # No defaults: without them the app refuses to start. In development, set them once in IntelliJ's Run configuration.
    # The key of the login codes' HMAC.
    otpPepper = ${?KIVA_OTP_PEPPER}
    # The key access tokens are signed with.
    jwtSecret = ${?KIVA_JWT_SECRET}
    # The shop's cap on SMS in an hour, all phones together, against someone sending codes to thousands of numbers.
    maxSmsPerHour = 300
    # Becomes ADMIN on startup, only while no ADMIN exists at all. Set it for the very first start, then remove it.
    bootstrapAdminPhone = ${?KIVA_BOOTSTRAP_ADMIN_PHONE}
  }

  sms {
    # "log" writes codes to the log instead of sending them: development only. The real provider comes before launch.
    provider = "log"
    provider = ${?KIVA_SMS_PROVIDER}
  }

  # The shop's rules (shipping costs, free shipping, payment gateways, ...) live in the database (shopsettings_tbl),
  # so the admin panel can change them without a restart.
  shop {
    # The shop's own address, for the canonical and share links of pages.
    siteUrl = "https://kiva.ir"
    siteUrl = ${?KIVA_SITE_URL}
  }

  # Fills the catalog with the prototype's 16 products, through the use cases like real data. Skips what is there.
  # Local development only: off unless KIVA_SEED_ENABLED=true, so a server never gets made-up products.
  seed {
    enabled = false
    enabled = ${?KIVA_SEED_ENABLED}
  }
}
